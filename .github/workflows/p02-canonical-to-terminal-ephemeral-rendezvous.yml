name: P02 Canonical To Terminal Ephemeral Rendezvous

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-canonical-to-terminal-ephemeral-rendezvous.yml'
      - 'scripts/p02_canonical_to_terminal_consumer_v1.py'
      - 'rendezvous/requests/p02-canonical-to-terminal-*.txt'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange
  SOURCE_ARTIFACT_ID: '10004880109'
  SOURCE_ARTIFACT_SHA256: '40c885ddaf83d29a33ecd28ae87ecd99d845923f69fe6dfdcb371c5f03b04e89'
  SOURCE_SHA256: 'd99dba176d2a474b8f2a66d6f43bd62d49ab70237d92e4f2a573246ae744fcc0'

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            cryptography numpy pandas scipy scikit-learn xgboost ib_insync pytz tzdata

      - name: Compile fixed transport and combined consumer
        run: |
          python -m py_compile scripts/ephemeral_x25519_chunked_v1.py
          python -m py_compile scripts/p02_canonical_to_terminal_consumer_v1.py

      - name: Download and verify registered admitted MNQ source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p02-source"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/p02-source.zip"
          echo "${SOURCE_ARTIFACT_SHA256}  $RUNNER_TEMP/p02-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/p02-source.zip" -d "$RUNNER_TEMP/p02-source"
          test -s "$RUNNER_TEMP/p02-source/MNQ_CONTINUOUS_1Min.csv"
          test -s "$RUNNER_TEMP/p02-source/MNQ_CONTINUOUS_1Min.lineage.json"
          echo "${SOURCE_SHA256}  $RUNNER_TEMP/p02-source/MNQ_CONTINUOUS_1Min.csv" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'p02-source'
          d=json.loads((root/'MNQ_CONTINUOUS_1Min.lineage.json').read_text())
          assert d['source_sha256'] == os.environ['SOURCE_SHA256']
          assert d['union_fingerprint_sha256'] == '81a1b9a40ab62c41b42dc72e7d5d5b7b58d0d71a0bdd7b02d736c20de095b2bd'
          assert d['authority'] == 'XoticHaze/research-foundry#78'
          assert d['coverage_qualified'] is True
          assert d['full_calendar_complete'] is False
          print('P02_ADMITTED_SOURCE_ARTIFACT=PASS')
          print('P02_ADMITTED_SOURCE_ROWS='+str(d['rows']))
          PY

      - name: Generate and publish one-run canonical recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'p02-canonical-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={
              'schema':'p02-canonical-to-terminal-recipient-v1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
              'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
              'harness':'p02_canonical_to_terminal_v1',
              'expected_mm_commit':'fd81406cec3860fb6f6452c8a3c2f638ee1ccfde',
          }
          Path(os.environ['RUNNER_TEMP'],'p02-canonical-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('P02_CANONICAL_PUBLIC_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('P02_CANONICAL_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-p02-canonical-to-terminal.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/p02-canonical-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish P02 canonical-to-terminal recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -d "$body" >/dev/null
          echo "P02_CANONICAL_RECIPIENT_PATH=${path}"

      - name: Wait for run-bound encrypted MM source capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          envelope_path="${root}/p02-canonical-to-terminal-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${envelope_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 420); do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.raw+json' \
              "$api" -o "$RUNNER_TEMP/p02-canonical-envelope.json"; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound P02 canonical source envelope did not arrive'; exit 42; }
          echo "P02_CANONICAL_RESPONSE_ROOT=${root}" >> "$GITHUB_ENV"

      - name: Reassemble authenticated ciphertext chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          env=json.loads(Path(os.environ['RUNNER_TEMP'],'p02-canonical-envelope.json').read_text())
          chunks=env.get('chunks')
          if not isinstance(chunks,list) or not chunks or len(chunks)>64:
              raise SystemExit('invalid P02 canonical chunk list')
          expected_prefix=os.environ['P02_CANONICAL_RESPONSE_ROOT'].rstrip('/')+'/'
          pieces=[]
          seen=set()
          for node in chunks:
              if set(node)!={'path','sha256','chars'}:
                  raise SystemExit('invalid P02 canonical chunk descriptor')
              path=str(node['path'])
              if not path.startswith(expected_prefix) or path in seen or '..' in path.split('/'):
                  raise SystemExit('invalid P02 canonical chunk path')
              seen.add(path)
              url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref={os.environ['EXCHANGE_REF']}"
              req=Request(url,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github.raw+json',
                  'X-GitHub-Api-Version':'2022-11-28',
              })
              raw=urlopen(req,timeout=30).read()
              if len(raw)!=int(node['chars']) or hashlib.sha256(raw).hexdigest()!=node['sha256']:
                  raise SystemExit('P02 canonical chunk identity mismatch')
              pieces.append(raw.decode('ascii'))
          ciphertext=base64.b64decode(''.join(pieces).encode('ascii'),validate=True)
          if hashlib.sha256(ciphertext).hexdigest()!=env.get('ciphertext_sha256'):
              raise SystemExit('P02 canonical assembled ciphertext digest mismatch')
          Path(os.environ['RUNNER_TEMP'],'p02-canonical-ciphertext.bin').write_bytes(ciphertext)
          print('P02_CANONICAL_CIPHERTEXT_BYTES='+str(len(ciphertext)))
          print('P02_CANONICAL_CHUNKS='+str(len(chunks)))
          PY

      - name: Canonicalize admitted source and execute first terminal consumer
        run: |
          set -euo pipefail
          mkdir -p artifacts/p02-canonical-terminal
          python scripts/p02_canonical_to_terminal_consumer_v1.py \
            --envelope "$RUNNER_TEMP/p02-canonical-envelope.json" \
            --ciphertext "$RUNNER_TEMP/p02-canonical-ciphertext.bin" \
            --private-key "$RUNNER_TEMP/p02-canonical-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --response-root "$P02_CANONICAL_RESPONSE_ROOT" \
            --source-csv "$RUNNER_TEMP/p02-source/MNQ_CONTINUOUS_1Min.csv" \
            --source-lineage-json "$RUNNER_TEMP/p02-source/MNQ_CONTINUOUS_1Min.lineage.json" \
            --output artifacts/p02-canonical-terminal/sanitized_receipt.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/p02-canonical-terminal/sanitized_receipt.json'))
          assert d['schema'] == 'p02-canonical-to-terminal-public-receipt-v1'
          assert d['status'] == 'PASS'
          assert d['canonical']['features_sha256']
          assert d['canonical']['feature_manifest_hash']
          assert d['terminal_consumer']['matched_window']['oos_rows'] > 0
          print('P02_CANONICAL_TO_TERMINAL=PASS')
          print('P02_CANONICAL_FEATURE_SHA256='+d['canonical']['features_sha256'])
          print('P02_CANONICAL_MANIFEST_HASH='+d['canonical']['feature_manifest_hash'])
          print('P02_TERMINAL_OOS_ROWS='+str(d['terminal_consumer']['matched_window']['oos_rows']))
          print('P02_ECONOMIC_STATUS='+str(d['terminal_consumer']['economic_evidence']['status']))
          PY

      - name: Upload sanitized terminal receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-canonical-to-terminal-receipt
          path: artifacts/p02-canonical-terminal/sanitized_receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-run private and canonical material
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/p02-canonical-private.b64" \
            "$RUNNER_TEMP/p02-canonical-recipient.json" \
            "$RUNNER_TEMP/p02-canonical-envelope.json" \
            "$RUNNER_TEMP/p02-canonical-ciphertext.bin" \
            "$RUNNER_TEMP/p02-source" \
            "$RUNNER_TEMP/p02-source.zip"
