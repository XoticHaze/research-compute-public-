name: F1b NQ operator evidence acceptance

on:
  push:
    branches:
      - acceptance/f1b-nq-operator-evidence-1f793c2c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record execution identity
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "private_product_head=1f793c2cd112a96f2844e4649e402da501fcec0e"
          echo "private_product_pr=600"
          echo "consumed_provenance_run=34736425305"
      - name: Execute sanitized deterministic acceptance
        run: python acceptance/f1b_nq_operator_evidence_acceptance.py
      - name: Upload deterministic receipt
        uses: actions/upload-artifact@v4
        with:
          name: f1b-nq-operator-evidence-receipt
          path: f1b-nq-operator-evidence-receipt.json
          if-no-files-found: error
