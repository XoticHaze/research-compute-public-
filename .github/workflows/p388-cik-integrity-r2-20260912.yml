name: P388 CIK Integrity R2 20260912
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p388_cik_integrity_r2_20260912.py'
      - '.github/workflows/p388-cik-integrity-r2-20260912.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas 'git+https://github.com/arielNacamulli/pitindex.git@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - id: result
        run: |
          python research/p388_cik_integrity_r2_20260912.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/p388_cik_integrity_r2_20260912.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p388-cik-integrity-r2__${{ steps.result.outputs.decision }}
          path: research/artifacts/p388_cik_integrity_r2_20260912.json
          if-no-files-found: error
          retention-days: 90
