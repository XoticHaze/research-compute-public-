name: FF5 Factor Persistence R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ff5_factor_persistence_r1.py'
      - '.github/workflows/ff5-factor-persistence-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - id: eval
        run: |
          python research/ff5_factor_persistence_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/ff5_factor_persistence_r1.json'))
          tag=f"{x['decision']}__hml_{int(x['factor_support']['HML'])}__rmw_{int(x['factor_support']['RMW'])}__cma_{int(x['factor_support']['CMA'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ff5-factor-persistence__${{ steps.eval.outputs.tag }}
          path: research/artifacts/ff5_factor_persistence_r1.json
          if-no-files-found: error
