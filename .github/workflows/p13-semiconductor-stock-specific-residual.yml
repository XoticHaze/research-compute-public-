name: P13 Semiconductor Stock-Specific Residual

on:
  pull_request:
    paths:
      - 'scripts/p13_semiconductor_stock_specific_residual.py'
      - '.github/workflows/p13-semiconductor-stock-specific-residual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'yfinance==0.2.54'
      - name: Execute frozen discriminator
        run: python scripts/p13_semiconductor_stock_specific_residual.py | tee p13-stock-specific-residual-receipt.txt
      - name: Upload sanitized receipt
        uses: actions/upload-artifact@v4
        with:
          name: p13-stock-specific-residual-receipt
          path: p13-stock-specific-residual-receipt.txt
          retention-days: 14
