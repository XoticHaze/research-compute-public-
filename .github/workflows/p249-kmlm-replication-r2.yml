name: P249 KMLM Replication R2
on:
  pull_request:
    paths:
      - 'research/p249_kmlm_replication_r2.py'
      - '.github/workflows/p249-kmlm-replication-r2.yml'
      - 'research/p249_orthogonal_sleeve_tournament_r1.py'
      - 'research/p279_p249_p266_forward_shadow_observer_r1.py'
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python -m research.p249_kmlm_replication_r2
      - uses: actions/upload-artifact@v4
        with:
          name: p249-kmlm-replication-r2-result
          path: research/artifacts/p249_kmlm_replication_r2.json
