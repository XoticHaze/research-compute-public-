name: DBB XLI industrial-metals R1
on:
  pull_request:
    paths:
      - 'research/dbb_xli_industrial_metals_r1.py'
      - '.github/workflows/dbb-xli-industrial-metals-r1.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen discriminator
        shell: bash
        run: |
          set -euo pipefail
          python research/dbb_xli_industrial_metals_r1.py | tee result.txt
          grep '^RESULT_JSON=' result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dbb-xli-industrial-metals-r1-result
          path: result.txt
