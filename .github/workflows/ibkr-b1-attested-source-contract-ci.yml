name: B1 Attested Source Contract CI

on:
  push:
    branches:
      - ibkr-b1-authority-v1
      - assistant/b1-attested-source-release-gate-20260920
  pull_request:
    branches:
      - ibkr-b1-authority-v1
    paths:
      - scripts/mmibkr_b1_attested_source_consumer_v1.py
      - scripts/ibkr_remote_selected_runtime_command_capsule_v2.py
      - scripts/ibkr_warm_selected_runtime_activation_v1.py
      - tests/test_mmibkr_b1_attested_source_consumer_v1.py
      - tests/test_ibkr_b1_canonical_dockerfile_v1.py
      - tests/test_ibkr_remote_selected_runtime_command_capsule_v2.py
      - tests/test_ibkr_remote_selected_runtime_paper_execute_v1.py
      - .github/workflows/ibkr-b1-attested-source-contract-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed B1 contract dependencies
        run: |
          python -m pip install --disable-pip-version-check             cryptography==46.0.1             ib_insync==0.9.86             pandas==2.2.3             PyYAML==6.0.2

      - name: Compile attested-source B1 surface
        run: |
          set -euo pipefail
          python -m py_compile             scripts/mmibkr_b1_attested_source_consumer_v1.py             scripts/ibkr_remote_selected_runtime_command_capsule_v2.py             scripts/ibkr_warm_selected_runtime_activation_v1.py             tests/test_mmibkr_b1_attested_source_consumer_v1.py             tests/test_ibkr_b1_canonical_dockerfile_v1.py

      - name: Run attested-source B1 contracts
        run: |
          set -euo pipefail
          python -m unittest -v             tests.test_mmibkr_b1_attested_source_consumer_v1             tests.test_ibkr_b1_canonical_dockerfile_v1             tests.test_ibkr_remote_selected_runtime_command_capsule_v2             tests.test_ibkr_remote_selected_runtime_paper_execute_v1
