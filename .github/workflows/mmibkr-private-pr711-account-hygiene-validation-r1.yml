name: MM-IBKR Private PR711 Account Hygiene Exact Validation R1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmibkr-private-pr711-account-hygiene-validation-r1.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmibkr-private-pr711-account-hygiene-validation-r1
  cancel-in-progress: false

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  PRIVATE_SOURCE_SHA: e78d16c99bde3df4d3828c952e27dc1746772875

jobs:
  exact-private-pr711-account-hygiene-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Materialize exact private PR711 Account Hygiene source through bounded Fleet stream
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import hashlib, json, os, shutil, tarfile, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from urllib.request import Request, urlopen

          base = os.environ['FLEET_AUTHORITY_BASE'].rstrip('/')
          source_sha = os.environ['PRIVATE_SOURCE_SHA'].strip().lower()
          run_id = os.environ['GITHUB_RUN_ID']
          temp = Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'mmibkr-pr711-account-hygiene.tar.gz'
          extract = temp / 'mmibkr-pr711-account-hygiene'
          if len(source_sha) != 40 or any(ch not in '0123456789abcdef' for ch in source_sha):
              raise SystemExit('invalid exact private source sha')

          def oidc():
              parsed = urlparse(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'])
              q = dict(parse_qsl(parsed.query, keep_blank_values=True))
              q['audience'] = 'mmibkr-fleet-authority'
              url = urlunparse((parsed.scheme, parsed.netloc, parsed.path, parsed.params, urlencode(q), parsed.fragment))
              req = Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                  'Accept': 'application/json',
              })
              with urlopen(req, timeout=20) as response:
                  token = str(json.load(response).get('value') or '')
              if token.count('.') != 2:
                  raise RuntimeError('OIDC token invalid')
              return token

          headers = {
              'Authorization': 'Bearer ' + oidc(),
              'Accept': 'application/gzip',
              'User-Agent': 'mmibkr-private-pr711-account-hygiene-forward-lifecycle-validation-r1',
              'X-MMIBKR-Caller-Run-Id': run_id,
          }
          url = f'{base}/v1/source-vault/private-archive/{source_sha}'
          response_headers = None
          for attempt in range(1, 73):
              try:
                  with urlopen(Request(url, headers=headers), timeout=60) as response:
                      response_headers = dict(response.headers.items())
                      with archive.open('wb') as out:
                          shutil.copyfileobj(response, out, length=1024 * 1024)
                  break
              except HTTPError as exc:
                  if exc.code not in {401, 403, 502, 503}:
                      raise
                  if attempt % 12 == 0:
                      print(f'MMIBKR_PR711 Account Hygiene_SOURCE_WAIT={attempt}')
                  time.sleep(5)
          else:
              raise SystemExit('exact private source admission did not converge')

          normalized = {str(k).lower(): str(v) for k,v in (response_headers or {}).items()}
          if normalized.get('x-mmibkr-source-sha') != source_sha:
              raise SystemExit('source sha response mismatch')
          if normalized.get('x-mmibkr-private-source-token-exposed') != 'false':
              raise SystemExit('source token exposure contract violated')
          stream_id = normalized.get('x-mmibkr-source-stream-id', '')
          if not stream_id:
              raise SystemExit('source stream id missing')

          digest = hashlib.sha256()
          size = 0
          with archive.open('rb') as fh:
              while True:
                  chunk = fh.read(1024 * 1024)
                  if not chunk: break
                  digest.update(chunk); size += len(chunk)
          archive_sha = digest.hexdigest()
          att = {
              'schema': 'mmibkr-fleet-private-source-attest-v1',
              'source_sha': source_sha,
              'stream_id': stream_id,
              'archive_sha256': archive_sha,
              'archive_bytes': size,
          }
          req = Request(
              base + '/v1/source-vault/private-archive/attest',
              data=json.dumps(att, sort_keys=True, separators=(',', ':')).encode(),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + oidc(),
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'mmibkr-private-pr711-account-hygiene-forward-lifecycle-validation-r1',
                  'X-MMIBKR-Caller-Run-Id': run_id,
              },
          )
          with urlopen(req, timeout=30) as response:
              node = json.load(response)
          if node.get('ok') is not True or node.get('source_sha') != source_sha or node.get('archive_sha256') != archive_sha:
              raise SystemExit('source attestation failed')

          extract.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              tops = {Path(m.name).parts[0] for m in members if Path(m.name).parts}
              if len(tops) != 1:
                  raise SystemExit('private archive root invalid')
              root = (extract / next(iter(tops))).resolve()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit('unsafe private archive member')
                  target = (extract / path).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit('private archive escape')
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True); continue
                  if not member.isfile():
                      raise SystemExit('private archive member type rejected')
                  handle = tf.extractfile(member)
                  if handle is None:
                      raise SystemExit('private archive member unreadable')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open('wb') as out:
                      shutil.copyfileobj(handle, out, length=1024 * 1024)

          if not (root / 'Dockerfile.bot').is_file():
              raise SystemExit('Dockerfile.bot missing')
          with Path(os.environ['GITHUB_ENV']).open('a') as fh:
              fh.write('PRIVATE_SOURCE_ROOT=' + str(root) + '\n')
              fh.write('PRIVATE_ARCHIVE_SHA256=' + archive_sha + '\n')
              fh.write('PRIVATE_ARCHIVE_BYTES=' + str(size) + '\n')
          print('MMIBKR_PR711 Account Hygiene_EXACT_SOURCE_READY=1')
          print('MMIBKR_PRIVATE_SOURCE_TOKEN_EXPOSED=0')
          PY

      - name: Build exact private bot image
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pr711-account-hygiene-build.log"
          set +e
          docker build -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot" --target bot \
            -t "mmibkr-pr711-account-hygiene:$GITHUB_RUN_ID" "$PRIVATE_SOURCE_ROOT" >"$log" 2>&1
          rc=$?
          set -e
          echo "MMIBKR_PR711 Account Hygiene_BUILD_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          rm -f "$log"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo 'MMIBKR_PR711 Account Hygiene_BUILD_STATUS=PASS'

      - name: Validate attribution-safe lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pr711-account-hygiene-tests.log"
          set +e
          docker run --rm \
            -e ENABLE_LIVE_TRADING=0 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            "mmibkr-pr711-account-hygiene:$GITHUB_RUN_ID" \
            python -m unittest -v \
              tests.test_ibkr_remote_account_hygiene_slot_v1 \
              tests.test_ibkr_remote_selected_runtime_paper_execute_slot_v1 \
              tests.test_ibkr_remote_paper_capsule_producer_v2 \
            >"$log" 2>&1
          rc=$?
          set -e
          sha="$(sha256sum "$log" | awk '{print $1}')"
          bytes="$(wc -c < "$log")"
          if [ "$rc" -ne 0 ]; then
            python - "$log" <<'PY'
          import re, sys
          from pathlib import Path
          for raw in Path(sys.argv[1]).read_text(errors='replace').splitlines():
              line = raw.strip()
              if re.match(r'^test_[A-Za-z0-9_]+ .* \.\.\. (ok|FAIL|ERROR)$', line):
                  print('MMIBKR_PR711 Account Hygiene_SAFE_DIAGNOSTIC=' + line)
              elif line.startswith('FAILED (') or line == 'OK':
                  print('MMIBKR_PR711 Account Hygiene_SAFE_DIAGNOSTIC=' + line)
          PY
            echo "MMIBKR_PR711 Account Hygiene_TEST_STATUS=FAIL"
            echo "MMIBKR_PR711 Account Hygiene_TEST_LOG_SHA256=$sha"
            echo "MMIBKR_PR711 Account Hygiene_TEST_LOG_BYTES=$bytes"
            rm -f "$log"
            exit "$rc"
          fi
          rm -f "$log"
          echo 'MMIBKR_PR711 Account Hygiene_TEST_STATUS=PASS'
          echo "MMIBKR_PR711 Account Hygiene_TEST_LOG_SHA256=$sha"
          echo "MMIBKR_PR711 Account Hygiene_TEST_LOG_BYTES=$bytes"
          echo 'MMIBKR_PRIVATE_PLAINTEXT_PUBLISHED=0'

      - name: Emit sanitized validation receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          print('MMIBKR_PR711 Account Hygiene_VALIDATION_RECEIPT=' + json.dumps({
              'schema': 'mmibkr.private_pr711_account_hygiene_validation.v1',
              'status': 'PASS',
              'source_sha': os.environ['PRIVATE_SOURCE_SHA'],
              'source_archive_sha256': os.environ['PRIVATE_ARCHIVE_SHA256'],
              'source_archive_bytes': int(os.environ['PRIVATE_ARCHIVE_BYTES']),
              'account_hygiene_producer_tests': True,
              'shared_encrypted_transport_tests': True,
              'private_source_token_exposed': False,
              'private_plaintext_published': False,
              'broker_credentials_used': False,
              'broker_request_made': False,
              'broker_action': False,
              'runtime_authority_changed': False,
              'live_trading_allowed': False,
          }, sort_keys=True))
          PY

      - name: Destroy one-run private source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "mmibkr-pr711-account-hygiene:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          sudo rm -rf "$RUNNER_TEMP/mmibkr-pr711-account-hygiene" "$RUNNER_TEMP/mmibkr-pr711-account-hygiene.tar.gz" "$RUNNER_TEMP/pr711-account-hygiene-build.log" "$RUNNER_TEMP/pr711-account-hygiene-tests.log"
          echo 'MMIBKR_PR711 Account Hygiene_PRIVATE_SOURCE_DESTROYED=1'
