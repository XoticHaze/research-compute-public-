name: P46 SOXX Beta Residual R1
on:
  pull_request:
    paths:
      - 'research/p46_soxx_beta_residual_r1.py'
      - '.github/workflows/p46-soxx-beta-residual-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_soxx_beta_residual_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_soxx_beta_residual_r1.json')); vals={'decision':x['decision'],'full':f"{100*x['tests']['full']['annualized_intercept']:.2f}",'recent':f"{100*x['tests']['2022_forward']['annualized_intercept']:.2f}",'p':f"{x['tests']['full']['bootstrap']['p_alpha_le_zero']:.4f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-soxx-beta__${{ steps.evaluate.outputs.decision }}__full_${{ steps.evaluate.outputs.full }}pct__recent_${{ steps.evaluate.outputs.recent }}pct__p_${{ steps.evaluate.outputs.p }}
          path: artifacts/p46_soxx_beta_residual_r1.json
          if-no-files-found: error
