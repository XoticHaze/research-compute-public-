name: MM-IBKR Live Warm State Crypto Contract R1

# TEST-ONLY: known synthetic key and dummy controller files. Never brokers.
on:
  push:
    branches:
      - feat/mmibkr-live-warm-state-envelope-r1-20261013
    paths:
      - .github/workflows/mmibkr-live-warm-state-crypto-contract-r1.yml
      - scripts/mmibkr_live_gateway_state_envelope_v1.py
      - tests/test_mmibkr_live_gateway_state_envelope_v1.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mmibkr-live-warm-state-crypto-contract-r1.yml
      - scripts/mmibkr_live_gateway_state_envelope_v1.py
      - tests/test_mmibkr_live_gateway_state_envelope_v1.py
permissions:
  contents: read
env:
  # Intentionally PUBLIC known test key for dummy data ONLY, NEVER live data.
  MMIBKR_LIVE_GATEWAY_WARM_KEY_B64: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

jobs:
  predecessor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned envelope dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Run cryptographic and archive safety regressions
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_mmibkr_live_gateway_state_envelope_v1.py' -v
          echo 'MMIBKR_LIVE_WARM_ENVELOPE_REGRESSION=PASS'
      - name: Seal dummy Gateway directory without broker login
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/mmibkr-live-state-fixture"
          mkdir -p "$dir/Jts"
          printf 'SYNTHETIC_GATEWAY_SETTINGS_ONLY\n' > "$dir/Jts/config.ini"
          tar -C "$dir" -czf "$dir/state.tgz" Jts
          python scripts/mmibkr_live_gateway_state_envelope_v1.py seal \
            --archive "$dir/state.tgz" --run-id "$GITHUB_RUN_ID" \
            --envelope "$dir/state.enc" --manifest "$dir/manifest.json"
          rm -rf "$dir/Jts" "$dir/state.tgz"
          test -f "$dir/state.enc" && test -f "$dir/manifest.json"
          echo 'MMIBKR_TEST_ONLY_ENCRYPTED_CHECKPOINT=PASS'
      - uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-live-state-fixture
          key: mmibkr-live-warm-synthetic-v1-${{ github.run_id }}-${{ github.sha }}
      - name: Delete all predecessor fixture state
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmibkr-live-state-fixture"

  successor:
    needs: predecessor
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned envelope dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-live-state-fixture
          key: mmibkr-live-warm-synthetic-v1-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Authenticate envelope and restore synthetic archive on independent VM
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mmibkr-live-state-fixture"
          python scripts/mmibkr_live_gateway_state_envelope_v1.py unseal \
            --envelope "$dir/state.enc" --manifest "$dir/manifest.json" \
            --current-run-id "$(( GITHUB_RUN_ID + 1 ))" \
            --output-archive "$dir/recovered.tgz"
          tar -tzf "$dir/recovered.tgz" | grep -qx 'Jts/config.ini'
          mkdir -p "$dir/restore"
          tar -xzf "$dir/recovered.tgz" -C "$dir/restore"
          grep -qx 'SYNTHETIC_GATEWAY_SETTINGS_ONLY' "$dir/restore/Jts/config.ini"
          echo 'MMIBKR_LIVE_ENVELOPE_FREE_CROSS_VM_SYNTHETIC_RESTORE=PASS'
          echo 'MMIBKR_ACTUAL_LIVE_GATEWAY_2FA_HANDOFF=UNTESTED'
          echo 'MMIBKR_LIVE_ORDER_DISPATCHES=0'
      - name: Delete all successor fixture state
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmibkr-live-state-fixture"
