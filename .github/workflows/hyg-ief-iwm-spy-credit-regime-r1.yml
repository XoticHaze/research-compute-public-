name: hyg-ief-iwm-spy-credit-regime-r1
on:
  pull_request:
    paths:
      - 'research/hyg_ief_iwm_spy_credit_regime_r1.py'
      - '.github/workflows/hyg-ief-iwm-spy-credit-regime-r1.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy yfinance
      - run: set -o pipefail; python research/hyg_ief_iwm_spy_credit_regime_r1.py | tee hyg_ief_iwm_spy_credit_regime_r1_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hyg-ief-iwm-spy-credit-regime-r1-result
          path: hyg_ief_iwm_spy_credit_regime_r1_result.txt
