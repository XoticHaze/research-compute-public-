name: IBKR Exact Historical Chunk CI

on:
  push:
    branches:
      - assistant/ibkr-exact-history-chunks-20260918
    paths:
      - scripts/ibkr_post_auth_pipeline_v1.py
      - tests/test_ibkr_post_auth_pipeline_contracts_v1.py
      - .github/workflows/ibkr-exact-history-chunk-ci.yml
  pull_request:
    paths:
      - scripts/ibkr_post_auth_pipeline_v1.py
      - tests/test_ibkr_post_auth_pipeline_contracts_v1.py
      - .github/workflows/ibkr-exact-history-chunk-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pandas ib_insync
      - name: Compile and test exact historical chunk contract
        run: |
          python -m py_compile scripts/ibkr_post_auth_pipeline_v1.py tests/test_ibkr_post_auth_pipeline_contracts_v1.py
          python -m unittest tests.test_ibkr_post_auth_pipeline_contracts_v1 -v
