name: P249 Orthogonal Sleeve Tournament R1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p249_orthogonal_sleeve_tournament_r1.py'
      - 'research/p279_p249_p266_forward_shadow_observer_r1.py'
      - '.github/workflows/p249-orthogonal-sleeve-tournament-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: result
        run: |
          python -m research.p249_orthogonal_sleeve_tournament_r1
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/p249_orthogonal_sleeve_tournament_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p249-orthogonal-sleeve-tournament__${{ steps.result.outputs.decision }}
          path: research/artifacts/p249_orthogonal_sleeve_tournament_r1.json
          if-no-files-found: error
          retention-days: 90
