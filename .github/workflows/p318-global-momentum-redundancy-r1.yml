name: P318 Global Momentum Redundancy R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p318_global_momentum_redundancy_r1.py'
      - '.github/workflows/p318-global-momentum-redundancy-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p318_global_momentum_redundancy_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p318_global_momentum_redundancy_r1.json'))
          tag=f"{x['decision']}__dev_{x['developed']['overall_excess_corr']:.2f}__em_{x['emerging']['overall_excess_corr']:.2f}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p318-global-momentum-redundancy__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p318_global_momentum_redundancy_r1.json
          if-no-files-found: error
