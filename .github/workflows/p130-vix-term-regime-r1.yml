name: P130 VIX Term Regime R1
on:
  pull_request:
    paths:
      - 'research/p130_vix_term_regime_r1.py'
      - '.github/workflows/p130-vix-term-regime-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p130_vix_term_regime_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p130_vix_term_regime_r1.json')); t=x['tests']['2015']['50']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\n"); f.write(f"matched={100*t['excess_matched']:.2f}\n"); f.write(f"spy={100*t['excess_spy']:.2f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p130-vix-term-regime__${{ steps.run.outputs.decision }}__matched_${{ steps.run.outputs.matched }}pp__spy_${{ steps.run.outputs.spy }}pp
          path: artifacts/p130_vix_term_regime_r1.json
          if-no-files-found: error
