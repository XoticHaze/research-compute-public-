name: P94 P87 Leave One Asset Out R1
on:
  pull_request:
    paths:
      - 'research/p94_p87_leave_one_asset_out_r1.py'
      - '.github/workflows/p94-p87-leave-one-asset-out-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p94_p87_leave_one_asset_out_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p94-p87-leave-one-asset-out-r1
          path: artifacts/p94_p87_leave_one_asset_out_r1.json
          if-no-files-found: error
