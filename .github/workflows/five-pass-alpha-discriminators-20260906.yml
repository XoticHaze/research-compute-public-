name: Five Pass Alpha Discriminators 20260906

on:
  push:
    paths:
      - 'scripts/five_pass_alpha_discriminators_20260906.py'
      - '.github/workflows/five-pass-alpha-discriminators-20260906.yml'
  pull_request:
    paths:
      - 'scripts/five_pass_alpha_discriminators_20260906.py'
      - '.github/workflows/five-pass-alpha-discriminators-20260906.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Execute five independent research discriminators
        run: python scripts/five_pass_alpha_discriminators_20260906.py
      - name: Preserve terminal receipt in job summary
        if: always()
        run: |
          if [ -f five-pass-alpha-discriminators-20260906.json ]; then
            cat five-pass-alpha-discriminators-20260906.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: five-pass-alpha-discriminators-20260906
          path: five-pass-alpha-discriminators-20260906.json
          if-no-files-found: ignore
          retention-days: 14
