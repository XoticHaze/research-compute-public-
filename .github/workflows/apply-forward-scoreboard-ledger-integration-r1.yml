name: Apply Forward Scoreboard Ledger Integration R1

on:
  push:
    branches:
      - 'assistant/forward-scoreboard-ledger-integration-r1'
    paths:
      - '.github/workflows/apply-forward-scoreboard-ledger-integration-r1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Apply deterministic integration patch
        run: python scripts/apply_forward_scoreboard_ledger_integration_r1.py
      - name: Prove scoreboard and allocator contracts
        run: |
          python research/forward_market_scoreboard_r1.py --self-test
          python research/forward_deterministic_allocator_r1.py --self-test
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: tested-forward-market-scoreboard-workflow
          path: .github/workflows/forward-market-scoreboard-r1.yml
          if-no-files-found: error
          retention-days: 7
      - name: Commit tested scoreboard code only
        run: |
          set -euo pipefail
          git config user.name 'forward-release-bot'
          git config user.email 'forward-release-bot@users.noreply.github.com'
          git add research/forward_market_scoreboard_r1.py
          git commit -m 'forward: surface prospective maturity evidence in scoreboard'
          git push origin HEAD:assistant/forward-scoreboard-ledger-integration-r1
