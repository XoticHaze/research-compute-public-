name: AMAT 15m useRTH0 Historical TRADES Discriminator R1

on:
  push:
    branches:
      - 'assistant/amat-15m-userth0-discriminator-20260928-r1'
    paths:
      - 'research/amat_15m_extended_hours_discriminator_r1.py'
      - 'tests/test_amat_15m_extended_hours_discriminator_r1.py'
      - '.github/workflows/amat-15m-extended-hours-discriminator-r1.yml'
      - 'rendezvous/requests/amat-15m-extended-hours-discriminator-r1.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: amat-15m-extended-hours-discriminator-r1
  cancel-in-progress: false

jobs:
  discriminate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLEET_AUTHORITY_URL: https://fleet-authority.slenderiq.workers.dev/v1/authorities/ibkr-paper/seal
      FLEET_AUTHORITY_HEALTH: https://fleet-authority.slenderiq.workers.dev/healthz
      IBKR_GATEWAY_IMAGE: ghcr.io/gnzsnz/ib-gateway:10.49.1c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed read-only dependencies and unit test discriminator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==46.0.1' 'ib_insync==0.9.86' pytest
          python -m py_compile research/amat_15m_extended_hours_discriminator_r1.py
          python -m pytest -q tests/test_amat_15m_extended_hours_discriminator_r1.py
      - name: Require configured private authority
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          req=Request(os.environ['FLEET_AUTHORITY_HEALTH'],headers={'Accept':'application/json','User-Agent':'amat-15m-userth0-r1'})
          with urlopen(req,timeout=15) as r: node=json.loads(r.read().decode())
          if node.get('ok') is not True or node.get('authority_configured') is not True:
              raise SystemExit('fleet authority unavailable')
          PY
      - name: Obtain one-run sealed paper gateway environment
        run: |
          set -euo pipefail
          umask 077
          python scripts/fleet_authority_envelope_consumer_v1.py --authority-url "$FLEET_AUTHORITY_URL" --run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/ibkr-gateway.env" --receipt "$RUNNER_TEMP/envelope-receipt.json"
      - name: Start disposable read-only paper gateway
        run: |
          set -euo pipefail
          docker pull "$IBKR_GATEWAY_IMAGE" >/dev/null
          docker run -d --name amat-userth0-r1 --env-file "$RUNNER_TEMP/ibkr-gateway.env" -e TWS_MAJOR_VRSN=10.49.1c -p 127.0.0.1:4002:4002 "$IBKR_GATEWAY_IMAGE" >/dev/null
          ready=0
          for _ in $(seq 1 120); do
            if python - <<'PY'
          import socket
          s=socket.socket(); s.settimeout(1)
          try: s.connect(('127.0.0.1',4002))
          except OSError: raise SystemExit(1)
          finally: s.close()
          PY
            then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
      - name: Execute bounded old-date AMAT discriminator
        run: |
          set -euo pipefail
          python research/amat_15m_extended_hours_discriminator_r1.py --host 127.0.0.1 --port 4002 --client-id 79 --symbol AMAT --target-date 2026-06-15 --output "$RUNNER_TEMP/amat-discriminator.json"
      - name: Publish sanitized result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amat-15m-extended-hours-discriminator-${{ github.run_id }}
          path: ${{ runner.temp }}/amat-discriminator.json
          if-no-files-found: error
          retention-days: 30
      - name: Destroy private runtime material
        if: always()
        run: |
          set +e
          docker rm -f amat-userth0-r1 >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/ibkr-gateway.env" "$RUNNER_TEMP/envelope-receipt.json" "$RUNNER_TEMP/amat-discriminator.json"
          echo AMAT_USERTH0_PRIVATE_RUNTIME_DESTROYED=1
