name: P166 P46 Stooq Replication R1
on:
  pull_request:
    paths:
      - 'research/p166_p46_stooq_replication_r1.py'
      - '.github/workflows/p166-p46-stooq-replication-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - id: run
        run: |
          python research/p166_p46_stooq_replication_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p166_p46_stooq_replication_r1.json')); t=x['tests']['2015']['50']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"decision={x['decision']}\nmatched={100*t['excess_matched']:.2f}\nspy={100*t['excess_spy']:.2f}\nqqq={100*t['excess_qqq']:.2f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p166-p46-stooq__${{ steps.run.outputs.decision }}__matched_${{ steps.run.outputs.matched }}pp__spy_${{ steps.run.outputs.spy }}pp__qqq_${{ steps.run.outputs.qqq }}pp
          path: artifacts/p166_p46_stooq_replication_r1.json
          if-no-files-found: error
