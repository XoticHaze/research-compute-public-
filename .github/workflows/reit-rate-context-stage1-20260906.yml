name: REIT Rate Context Stage1

on:
  pull_request:
    paths:
      - 'scripts/reit_rate_context_stage1_20260906.py'
      - '.github/workflows/reit-rate-context-stage1-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed environment
        run: python -m pip install --disable-pip-version-check -q yfinance==1.7.0 numpy==2.4.6 pandas==3.0.5 scikit-learn==1.7.2
      - name: Execute frozen REIT discriminator
        run: |
          set -euo pipefail
          python -m py_compile scripts/reit_rate_context_stage1_20260906.py
          python scripts/reit_rate_context_stage1_20260906.py
          python -m json.tool reit-rate-context-stage1-receipt.json >/dev/null
          cat reit-rate-context-stage1-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain scientific receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reit-rate-context-stage1-receipt
          path: reit-rate-context-stage1-receipt.json
          retention-days: 30
          if-no-files-found: error
