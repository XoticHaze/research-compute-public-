name: Fleet Source Exchange Contract CI

on:
  push:
    branches:
      - 'assistant/fleet-*'
  pull_request:
    branches:
      - main
    paths:
      - wrangler.jsonc
      - cloudflare/fleet-authority/src/source_exchange.js
      - cloudflare/fleet-authority/src/index.js
      - cloudflare/fleet-authority/wrangler.jsonc
      - cloudflare/fleet-authority/package.json
      - cloudflare/fleet-authority/package-lock.json
      - scripts/mmibkr_cloud_source_exchange_consumer_v1.py
      - tests/test_mmibkr_cloud_source_exchange_consumer_v1.py
      - .github/workflows/fleet-source-exchange-contract-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Worker JavaScript syntax
        run: |
          set -euo pipefail
          node --check cloudflare/fleet-authority/src/source_exchange.js
          node --check cloudflare/fleet-authority/src/index.js

      - name: Require production and local Durable Object declarations to agree
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              text = Path(path).read_text(encoding='utf-8')
              return json.loads(text)

          prod = load('wrangler.jsonc')
          local = load('cloudflare/fleet-authority/wrangler.jsonc')

          for name, node in [('production', prod), ('local', local)]:
              bindings = (node.get('durable_objects') or {}).get('bindings') or []
              source = [b for b in bindings if b.get('name') == 'SOURCE_EXCHANGE']
              if source != [{'name': 'SOURCE_EXCHANGE', 'class_name': 'SourceExchange'}]:
                  raise SystemExit(f'{name} SOURCE_EXCHANGE binding mismatch: {source!r}')
              exports = node.get('exports') or {}
              expected = {
                  'type': 'durable-object',
                  'state': 'created',
                  'storage': 'sqlite',
              }
              if exports.get('SourceExchange') != expected:
                  raise SystemExit(
                      f'{name} SourceExchange export mismatch: '
                      + repr(exports.get('SourceExchange'))
                  )

          if prod.get('main') != 'cloudflare/fleet-authority/src/index.js':
              raise SystemExit('production Wrangler main path mismatch')
          if local.get('main') != 'src/index.js':
              raise SystemExit('local Wrangler main path mismatch')
          print('FLEET_WRANGLER_AUTHORITY_PARITY=1')
          PY

      - name: Validate canonical production Worker bundle
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.2 deploy             --dry-run             --config wrangler.jsonc             --outdir "$RUNNER_TEMP/fleet-authority-production-dry-run"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Validate encrypted source consumer contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==46.0.1
          python -m py_compile scripts/mmibkr_cloud_source_exchange_consumer_v1.py
          python -m unittest -v tests.test_mmibkr_cloud_source_exchange_consumer_v1
