name: Industrial Machinery Stage-A Fresh Confirmation

on:
  push:
    paths:
      - '.github/workflows/industrial-machinery-stagea-fresh-confirmation.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute unchanged Industrials fresh confirmation
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          original=['DE','ETN','PH','EMR','ITW','ROK','CMI','PCAR']
          fresh=['DOV','SWK','GWW','FAST','IEX','XYL','PNR','GNRC']
          benchmark='XLI'
          assert len(fresh)==8 and not(set(original)&set(fresh))
          required=[*r.TRAIN,*fresh,'QQQ',benchmark]
          source={}; frames={}
          for symbol in required:
              try:
                  f=r._load(symbol); frames[symbol]=f
                  source[symbol]={'status':'OK','rows':len(f),'start':f.iloc[0].timestamp.isoformat() if len(f) else None,'end':f.iloc[-1].timestamp.isoformat() if len(f) else None}
              except Exception as exc:
                  source[symbol]={'status':'ERROR','error':f'{type(exc).__name__}: {exc}'}
          errors={k:v for k,v in source.items() if v['status']!='OK'}
          if errors: raise RuntimeError('source load failures: '+json.dumps(errors,sort_keys=True))
          common=set(frames[required[0]].timestamp)
          for symbol in required[1:]: common &= set(frames[symbol].timestamp)
          if len(common)<1500: raise RuntimeError(f'insufficient common source calendar={len(common)}')
          cutoff=max(common).isoformat()
          family={'industrial_machinery_fresh_confirmation':{'primary_industry_etf':benchmark,'development_universe':fresh}}
          out=r._evaluate_matrix(family,cutoff)
          s=out['family_summary']['industrial_machinery_fresh_confirmation']
          receipt={
            'schema':'industrial_machinery_stagea_fresh_confirmation.v1','benchmark':benchmark,
            'original_development_universe':original,'fresh_confirmation_universe':fresh,
            'panel_disjoint':True,'cutoff':cutoff,'source':source,
            'threshold_or_model_search':False,'external_holdouts_loaded':False,
            'family_summary':s,'per_symbol':out['per_symbol'],
            'decision':'FRESH_CONFIRMATION_PASS' if s['development_family_gate_pass'] else 'FRESH_CONFIRMATION_FAIL',
            'next_if_pass':'freeze separate sealed external Industrials holdout contract; unchanged model/no retune',
            'next_if_fail':'reject generic industrial-machinery transport; do not expose external holdouts',
            'research_only':True,'promotion_authority':False,'allocation_authority':False,
            'runtime_mutation':False,'live_trading_change':False
          }
          open('industrial-machinery-stagea-fresh-confirmation.json','w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('INDUSTRIAL_MACHINERY_FRESH_CONFIRMATION='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: industrial-machinery-stagea-fresh-confirmation
          path: industrial-machinery-stagea-fresh-confirmation.json
          retention-days: 30
