name: REIT Stage-A Fresh Confirmation

on:
  push:
    paths:
      - '.github/workflows/reit-stagea-fresh-confirmation.yml'
  pull_request:
    paths:
      - '.github/workflows/reit-stagea-fresh-confirmation.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute unchanged REIT confirmation
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          original=['AMT','PLD','O','SPG','EQIX','PSA','WELL','DLR']
          fresh=['CCI','VICI','AVB','EQR','EXR','MAA','CPT','ARE']
          cutoff='2026-08-24T13:30:00+00:00'
          assert not (set(original) & set(fresh))
          family={'reits_fresh_confirmation':{'primary_industry_etf':'VNQ','development_universe':fresh}}
          out=r._evaluate_matrix(family,cutoff)
          s=out['family_summary']['reits_fresh_confirmation']
          receipt={
            'schema':'reit_stagea_fresh_confirmation.v1',
            'benchmark':'VNQ',
            'cutoff':cutoff,
            'cutoff_reason':'common bounded-source cutoff chosen before any fresh-panel model result; first attempt emitted no result because AVB ended 2026-08-24',
            'frozen_model':'TextConverterToolbox@2d8995ba66502a4de25c64c1c32a67e132b05522:run_industry_stagea_public_runner_20260905.py',
            'original_development_universe':original,
            'fresh_confirmation_universe':fresh,
            'panel_disjoint':True,
            'symbol_substitution':False,
            'threshold_or_model_search':False,
            'external_holdouts_loaded':False,
            'family_summary':s,
            'per_symbol':out['per_symbol'],
            'decision':'FRESH_CONFIRMATION_PASS' if s['development_family_gate_pass'] else 'FRESH_CONFIRMATION_FAIL',
            'next_if_pass':'freeze separate sealed external REIT holdout contract; unchanged model/no retune',
            'next_if_fail':'reject generic REIT transport; do not expose external holdouts',
            'research_only':True,
            'promotion_authority':False,
            'allocation_authority':False,
            'runtime_mutation':False,
            'live_trading_change':False
          }
          open('reit-stagea-fresh-confirmation.json','w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('REIT_FRESH_CONFIRMATION='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reit-stagea-fresh-confirmation
          path: reit-stagea-fresh-confirmation.json
          retention-days: 30
