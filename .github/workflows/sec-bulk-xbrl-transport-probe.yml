name: SEC Bulk XBRL Transport Probe
on:
  pull_request:
    paths:
      - 'research/sec_bulk_xbrl_transport_probe_20260906.py'
      - '.github/workflows/sec-bulk-xbrl-transport-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Probe official SEC bulk XBRL routes
        run: python research/sec_bulk_xbrl_transport_probe_20260906.py
      - name: Retain transport receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec-bulk-xbrl-transport-probe
          path: sec_bulk_xbrl_transport_probe_20260906.json
          retention-days: 14
          if-no-files-found: error
