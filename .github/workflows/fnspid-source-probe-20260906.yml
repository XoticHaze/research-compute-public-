name: FNSPID Source Probe 20260906

on:
  push:
    branches:
      - research/fnspid-source-probe-20260906-r1
    paths:
      - research/fnspid_source_probe_20260906.py
      - .github/workflows/fnspid-source-probe-20260906.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check -q requests==2.32.5
      - name: Probe pinned FNSPID CSV ranges
        run: python research/fnspid_source_probe_20260906.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fnspid-source-probe-20260906
          path: fnspid-source-probe-20260906.json
          retention-days: 14
