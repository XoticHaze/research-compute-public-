name: Homebuilder Peer Relative Consensus R3

on:
  push:
    branches:
      - research/homebuilder-peer-relative-alpha-r1
    paths:
      - "scripts/homebuilder_peer_relative_alpha_r1.py"
      - "scripts/homebuilder_peer_relative_consensus_r3.py"
      - ".github/workflows/homebuilder-peer-relative-consensus-r3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Compile frozen child
        run: python -m py_compile scripts/homebuilder_peer_relative_alpha_r1.py scripts/homebuilder_peer_relative_consensus_r3.py
      - name: Execute fresh external temporal-consensus study
        run: python scripts/homebuilder_peer_relative_consensus_r3.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homebuilder-peer-relative-consensus-r3
          path: research/results/homebuilder_peer_relative_consensus_r3.json
          if-no-files-found: ignore
          retention-days: 30
