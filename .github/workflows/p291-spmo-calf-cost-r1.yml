name: P291 SPMO CALF Cost R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p291_spmo_calf_cost_r1.py'
      - '.github/workflows/p291-spmo-calf-cost-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p291_spmo_calf_cost_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p291_spmo_calf_cost_r1.json')); z=x['results']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__10_{bp(z['10']['2019']['matched_excess_cagr'])}__25_{bp(z['25']['2019']['matched_excess_cagr'])}__50_{bp(z['50']['2019']['matched_excess_cagr'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p291-spmo-calf-cost__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p291_spmo_calf_cost_r1.json
          if-no-files-found: error
