name: MR B9 copper timing placebo
on:
  push:
    branches: [mr-b9-copper-placebo-20260919]
    paths:
      - 'research/mr_b9_copper_placebo_falsifier.py'
      - '.github/workflows/mr-b9-copper-placebo-falsifier.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance
      - run: python research/mr_b9_copper_placebo_falsifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: mr-b9-copper-placebo-falsifier
          path: mr_b9_copper_placebo_falsifier.json
