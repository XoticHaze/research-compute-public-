name: Sector Residual Selector Tournament
on:
  pull_request:
    paths:
      - '.github/workflows/sector-residual-tournament.yml'
      - 'research/sector_residual_tournament_20260909.py'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0
      - name: Execute four-sector residual tournament
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/source.py
          test "$(git hash-object /tmp/source.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python research/sector_residual_tournament_20260909.py
      - uses: actions/upload-artifact@v4
        with:
          name: sector-residual-tournament
          path: /tmp/result.json
