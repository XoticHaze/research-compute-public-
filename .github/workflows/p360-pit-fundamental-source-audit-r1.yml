name: P360 PIT Fundamental Source Audit R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p360_pit_fundamental_source_audit_r1.py'
      - '.github/workflows/p360-pit-fundamental-source-audit-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/p360_pit_fundamental_source_audit_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p360-pit-fundamental-source-audit
          path: research/artifacts/p360_pit_fundamental_source_audit_r1.json
          if-no-files-found: error
          retention-days: 90
