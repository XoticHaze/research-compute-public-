name: Semiconductor P13 Semantics Correction R2
on:
  pull_request:
    paths:
      - '.github/workflows/semiconductor-p13-semantics-correction-r2.yml'
      - 'research/semiconductor-p13-semantics-correction-r2.json'
      - 'research/semiconductor_p13_semantics_correction_r2.py'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Execute corrected P13-compatible semiconductor children
        run: python research/semiconductor_p13_semantics_correction_r2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semiconductor-p13-semantics-correction-r2-result
          path: semiconductor-p13-semantics-correction-r2-result.json
          retention-days: 14
