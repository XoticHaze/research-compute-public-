name: REIT Nasdaq History Coverage

on:
  pull_request:
    paths:
      - "research/reit_nasdaq_history_coverage_20260906.py"
      - ".github/workflows/reit-nasdaq-history-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Execute source-only Nasdaq history coverage diagnostic
        run: python research/reit_nasdaq_history_coverage_20260906.py
      - name: Retain source coverage receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reit-nasdaq-history-coverage
          path: reit_nasdaq_history_coverage_20260906.json
          if-no-files-found: error
          retention-days: 14
