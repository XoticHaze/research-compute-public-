name: P46 P36 Causal Regime Attribution R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_causal_regime_attribution_r1.py'
      - '.github/workflows/p46-p36-causal-regime-attribution-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_causal_regime_attribution_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_causal_regime_attribution_r1.json')); vals={'decision':x['decision'],'on':f"{100*x['risk_on']['annualized_mean_excess']:.3f}",'off':f"{100*x['risk_off']['annualized_mean_excess']:.3f}",'non':str(x['risk_on']['months']),'noff':str(x['risk_off']['months'])}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-regime__${{ steps.evaluate.outputs.decision }}__on_${{ steps.evaluate.outputs.on }}pct__off_${{ steps.evaluate.outputs.off }}pct__nOn_${{ steps.evaluate.outputs.non }}__nOff_${{ steps.evaluate.outputs.noff }}
          path: artifacts/p46_p36_causal_regime_attribution_r1.json
          if-no-files-found: error
