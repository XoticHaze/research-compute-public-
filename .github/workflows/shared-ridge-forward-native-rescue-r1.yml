name: Shared Ridge Forward Native Rescue R1

on:
  push:
    branches: [main]
    paths:
      - rendezvous/fire/shared-ridge-forward-native-rescue-r1.json

permissions:
  contents: write

env:
  EXCHANGE_REF: rendezvous-exchange
  RECIPIENT_ROOT: rendezvous/recipients
  RESPONSE_ROOT: rendezvous/responses

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2
      - name: Compile existing consumer
        run: |
          python -m py_compile scripts/forward_native_ephemeral_consumer_v1.py
          python -m py_compile scripts/ephemeral_x25519_chunked_v1.py
      - name: Generate and publish one-run recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          harness='semiconductor_shared_ridge_three_book_v1'
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'forward-native-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={
            'schema':'forward-native-ephemeral-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'harness':harness,
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
          }
          Path(os.environ['RUNNER_TEMP'],'forward-native-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('SHARED_RIDGE_RESCUE_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('SHARED_RIDGE_RESCUE_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-semiconductor_shared_ridge_three_book_v1.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/forward-native-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish Shared Ridge rescue recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" -d "$body" >/dev/null
          echo "SHARED_RIDGE_RECIPIENT_PATH=${path}"
      - name: Wait for encrypted source capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/semiconductor_shared_ridge_three_book_v1"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${root}/envelope.json?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 240); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/forward-native-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'Shared Ridge encrypted capsule did not arrive'; exit 42; }
          echo "SHARED_RIDGE_RESPONSE_ROOT=${root}" >> "$GITHUB_ENV"
      - name: Execute existing encrypted consumer
        run: |
          set -euo pipefail
          python scripts/forward_native_ephemeral_consumer_v1.py \
            --envelope "$RUNNER_TEMP/forward-native-envelope.json" \
            --private-key "$RUNNER_TEMP/forward-native-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --harness semiconductor_shared_ridge_three_book_v1 \
            --adapter-script "$GITHUB_WORKSPACE/research/forward_native_program_adapter_r1.py" \
            --return-envelope "$RUNNER_TEMP/forward-native-return.json" \
            --sanitized-adapter-output "$RUNNER_TEMP/semiconductor_shared_ridge.sanitized.json"

      - name: Publish sanitized adapter receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="rendezvous/sanitized/${GITHUB_RUN_ID}/semiconductor_shared_ridge.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/semiconductor_shared_ridge.sanitized.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish sanitized Shared Ridge adapter receipt','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$body" >/dev/null
          echo "SHARED_RIDGE_SANITIZED_PATH=${path}"

      - name: Publish encrypted return
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${SHARED_RIDGE_RESPONSE_ROOT}-return.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/forward-native-return.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish encrypted Shared Ridge rescue return','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -d "$body" >/dev/null
          echo "SHARED_RIDGE_RETURN_PATH=${path}"

      - name: Remove private recipient material
        if: always()
        run: rm -f "$RUNNER_TEMP/forward-native-private.b64" "$RUNNER_TEMP/forward-native-recipient.json" "$RUNNER_TEMP/forward-native-envelope.json" "$RUNNER_TEMP/forward-native-return.json" "$RUNNER_TEMP/semiconductor_shared_ridge.sanitized.json"
