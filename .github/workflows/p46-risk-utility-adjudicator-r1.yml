name: P46 Risk Utility Adjudicator R1
on:
  pull_request:
    paths:
      - 'research/p46_risk_utility_adjudicator_r1.py'
      - '.github/workflows/p46-risk-utility-adjudicator-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p46_risk_utility_adjudicator_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_risk_utility_adjudicator_r1.json')); t=x['tests']['2015']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\n"); f.write(f"dd={100*t['p46']['maxdd']:.2f}\n"); f.write(f"spy_dd={100*t['spy']['maxdd']:.2f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-risk-utility__${{ steps.run.outputs.decision }}__p46dd_${{ steps.run.outputs.dd }}__spydd_${{ steps.run.outputs.spy_dd }}
          path: artifacts/p46_risk_utility_adjudicator_r1.json
          if-no-files-found: error
