name: RC001 Batch2 Family Isolation
on:
  pull_request:
    paths:
      - '.github/workflows/rc001-batch2-family-isolation.yml'
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        family: [medical_devices, biotech, chemicals]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Materialize pinned evaluator
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
      - name: Install fixed numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Evaluate frozen family independently
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          s=importlib.util.spec_from_file_location('r','.campaign/runner.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/batch2-contract.json').read_text()); assert not c['external_holdouts_loaded']
          family=os.environ['FAMILY']; spec={family:c['families'][family]}
          try:
              r=m._evaluate_matrix(spec,'2026-09-01T13:30:00+00:00')
              out={'schema':'research_compute_public.rc001_batch2_family_isolation.v1','family':family,'status':'PASS','family_summary':r['family_summary'],'external_holdouts_loaded':False,'research_only':True,'promotion_authority':False}
          except Exception as exc:
              out={'schema':'research_compute_public.rc001_batch2_family_isolation.v1','family':family,'status':'FAIL','error':f'{type(exc).__name__}: {exc}','external_holdouts_loaded':False,'research_only':True,'promotion_authority':False}
          print('FAMILY_TERMINAL='+json.dumps(out,sort_keys=True))
          if out['status'] != 'PASS': raise SystemExit(1)
          PY