name: RC001 Batch2 Family Isolation
on:
  pull_request:
    paths:
      - '.github/workflows/rc001-batch2-family-isolation.yml'
      - '.github/workflows/rc001-batch2-history-sufficiency.yml'
permissions:
  contents: read
jobs:
  history-sufficiency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Execute source-history discriminator
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          c=json.loads(Path('research/batch2-contract.json').read_text()); assert not c['external_holdouts_loaded']
          def epoch(x): return int(datetime.fromisoformat(x).replace(tzinfo=timezone.utc).timestamp())
          def probe(s):
              q=urlencode({'period1':epoch('2014-01-01'),'period2':epoch('2026-09-02'),'interval':'1d','events':'history','includeAdjustedClose':'true'})
              req=Request(f'https://query1.finance.yahoo.com/v8/finance/chart/{s}?{q}',headers={'User-Agent':'Mozilla/5.0 research-compute/1.0'})
              with urlopen(req,timeout=30) as r: p=json.loads(r.read().decode())
              z=(p.get('chart',{}).get('result') or [None])[0]; ts=[] if not z else (z.get('timestamp') or [])
              return {'rows':len(ts),'first':datetime.fromtimestamp(ts[0],timezone.utc).date().isoformat() if ts else None,'last':datetime.fromtimestamp(ts[-1],timezone.utc).date().isoformat() if ts else None}
          out={'schema':'research_compute_public.rc001_batch2_history_sufficiency.v1','research_only':True,'external_holdouts_loaded':False,'families':{}}
          for family,spec in c['families'].items():
              probes={s:probe(s) for s in list(spec['development_universe'])+[spec['primary_industry_etf']]}
              out['families'][family]={'symbols':probes,'latest_common_start':max(v['first'] for v in probes.values()),'shortest_symbol':min(probes,key=lambda s:probes[s]['rows'])}
          print('HISTORY_SUFFICIENCY='+json.dumps(out,sort_keys=True))
          PY
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        family: [medical_devices, biotech, chemicals]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Materialize pinned evaluator
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
      - name: Install fixed numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Evaluate frozen family independently
        env: {FAMILY: '${{ matrix.family }}'}
        run: |
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          s=importlib.util.spec_from_file_location('r','.campaign/runner.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/batch2-contract.json').read_text()); family=os.environ['FAMILY']
          try:
              r=m._evaluate_matrix({family:c['families'][family]},'2026-09-01T13:30:00+00:00'); out={'family':family,'status':'PASS','family_summary':r['family_summary'],'external_holdouts_loaded':False,'research_only':True}
          except Exception as exc: out={'family':family,'status':'FAIL','error':f'{type(exc).__name__}: {exc}','external_holdouts_loaded':False,'research_only':True}
          print('FAMILY_TERMINAL='+json.dumps(out,sort_keys=True)); raise SystemExit(out['status']!='PASS')
          PY