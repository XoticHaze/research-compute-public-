name: MM-IBKR First Successor Auto-Fire Retired (Contract Only)

# Historical one-shot auto-dispatch was pinned to failed run 39231751596
# and an obsolete workflow head. It is not independent current operator
# authorization. Only the existing canonical owner's explicitly admitted
# workflow_dispatch may start a live successor; this file must never fire one.
on:
  pull_request:
    paths:
      - .github/workflows/mmibkr-production-live-first-successor-r1.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify historical first-successor auto-fire is retired
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/mmibkr-production-live-first-successor-r1.yml').read_text()
          # Match actual YAML/command lines, not the test's own literals.
          lines=s.splitlines()
          assert not any(line == '  workflow_run:' for line in lines)
          assert not any(line == '  dispatch-successor:' for line in lines)
          assert not any(line.strip().startswith('gh api --method POST') for line in lines)
          assert not any(line.strip().startswith("-f 'inputs[admission_only]=false'") for line in lines)
          assert 'on:\n  pull_request:' in s
          print('STALE_LIVE_FIRST_SUCCESSOR_AUTOFIRE_RETIRED=PASS')
          PY
