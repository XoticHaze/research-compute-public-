name: P237 Quality Factor R1
on:
  pull_request:
    paths:
      - 'research/p237_quality_factor_r1.py'
      - '.github/workflows/p237-quality-factor-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p237_quality_factor_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p237_quality_factor_r1.json')); a=x['tests']['2014']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__spy_{bp(a['vs_spy'])}__iwb_{bp(a['vs_iwb'])}__folds_{a['positive_spy_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p237-quality-factor__${{ steps.eval.outputs.tag }}
          path: artifacts/p237_quality_factor_r1.json
          if-no-files-found: error
