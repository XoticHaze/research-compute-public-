name: P36 C3 XSD Representation Validation
on:
  pull_request:
    paths:
      - 'scripts/p36_independent_proxy_validation.py'
      - '.github/workflows/p36-c3-xsd-validation.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P36_ASSET: XSD
      P36_CHILD: C3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned evaluation dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: Compile frozen validator
        run: python -m py_compile scripts/p36_independent_proxy_validation.py
      - name: Execute frozen P36 C3 XSD validation
        run: python scripts/p36_independent_proxy_validation.py
      - name: Publish result summary
        run: cat artifacts/p36_c3_xsd_validation.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p36-c3-xsd-validation-${{ github.run_id }}
          path: artifacts/p36_c3_xsd_validation.json
          if-no-files-found: error
          retention-days: 30
