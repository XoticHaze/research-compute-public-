name: A1 FINRA Short Volume R3

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/finra_short_volume_r3.py'
      - '.github/workflows/a1-finra-short-volume-r3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - name: Execute frozen 2022-2025 FINRA discriminator
        run: python research/finra_short_volume_r3.py
      - name: Assert protected vintage and terminal receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/finra_short_volume_r3.json'))
          assert x['schema']=='research.finra_short_volume_r3.v1'
          assert x['boundaries']['2026_protected'] is True
          assert x['source_lineage']['2026_or_later_finra_data_requested'] is False
          assert x['price_source']['2026_price_outcomes_used'] is False
          assert x['sample']['max_exit_date'] <= '2025-12-31'
          assert x['result']['decision'] in {'FINRA_SHORT_VOLUME_R3_SUPPORTED','FINRA_SHORT_VOLUME_R3_REJECTED'}
          print('A1_FINRA_R3_TERMINAL='+x['result']['decision'])
          print('A1_FINRA_R3_OBSERVATIONS='+str(x['result']['overall']['observations']))
          print('A1_FINRA_R3_SPREAD_BPS='+str(x['result']['overall']['mean_spread_net_bps']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-finra-short-volume-r3-result
          path: artifacts/finra_short_volume_r3.json
          if-no-files-found: error
          retention-days: 90
