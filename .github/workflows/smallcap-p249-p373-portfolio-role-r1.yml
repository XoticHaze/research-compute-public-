name: Smallcap P249 P373 Portfolio Role R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/smallcap_p249_p373_portfolio_role_r1.py'
      - '.github/workflows/smallcap-p249-p373-portfolio-role-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: eval
        run: |
          python research/smallcap_p249_p373_portfolio_role_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/smallcap_p249_p373_portfolio_role_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smallcap-p249-p373-portfolio-role__${{ steps.eval.outputs.tag }}
          path: research/artifacts/smallcap_p249_p373_portfolio_role_r1.json
          if-no-files-found: error
          retention-days: 90