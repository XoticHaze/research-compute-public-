name: P263 Small Cap Momentum R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p263_smallcap_momentum_r1.py'
      - '.github/workflows/p263-smallcap-momentum-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p263_smallcap_momentum_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p263_smallcap_momentum_r1.json')); a=x['tests']['2015']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__ijr_{bp(a['vs_ijr_cagr'])}__iwm_{bp(a['vs_iwm_cagr'])}__folds_{a['positive_ijr_folds']}_{a['positive_iwm_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p263-smallcap-momentum__${{ steps.eval.outputs.tag }}
          path: artifacts/p263_smallcap_momentum_r1.json
          if-no-files-found: error
