name: P46 Market Beta Attribution R1
on:
  pull_request:
    paths:
      - 'research/p46_market_beta_attribution_r1.py'
      - '.github/workflows/p46-market-beta-attribution-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65 statsmodels==0.14.5
      - id: run
        run: |
          python research/p46_market_beta_attribution_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_market_beta_attribution_r1.json')); t=x['tests']['2015']['qqq']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\n"); f.write(f"alpha={100*t['annualized_alpha_compound']:.2f}\n"); f.write(f"t={t['alpha_hac_t']:.2f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-market-beta-attribution__${{ steps.run.outputs.decision }}__alpha_${{ steps.run.outputs.alpha }}pp__t_${{ steps.run.outputs.t }}
          path: artifacts/p46_market_beta_attribution_r1.json
          if-no-files-found: error
