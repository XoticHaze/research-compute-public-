name: CC Reusable Worker Factory Source Contract
on:
  pull_request:
    paths:
      - 'cloudflare/shared-worker-factory/**'
      - 'cloudflare/ordinary-scratch-releases/**'
      - '.github/workflows/cc-worker-factory-source-r1.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/shared-worker-factory/**'
      - 'cloudflare/ordinary-scratch-releases/**'
      - '.github/workflows/cc-worker-factory-source-r1.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Source syntax and exact offline contract
        run: |
          set -euo pipefail
          cd cloudflare/shared-worker-factory
          node --version
          node --check src/index.js
          node --check src/policy.js
          node --test tests/*.test.mjs
      - name: Verify pinned A/B scratch sources, not live Worker deployments
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/ordinary-scratch-releases/cc-scratch-proof-a/worker.mjs
          node --check cloudflare/ordinary-scratch-releases/cc-scratch-proof-b/worker.mjs
          printf '%s  %s\n' \
            '9d3ce1adcd34da626000d1d7a5fc2bd27a887da6b3dd12278bbc578f278af921' 'cloudflare/ordinary-scratch-releases/cc-scratch-proof-a/worker.mjs' \
            'b7335d64457347b61316765962c3b0c34aae9f2d0b7776ddd152cb71a18bc322' 'cloudflare/ordinary-scratch-releases/cc-scratch-proof-b/worker.mjs' \
            | sha256sum --check -
          echo "FACTORY_SCRATCH_A_B_PINNED_PUBLIC_SOURCE_ONLY_PASS=1"
      - name: Confirm no deploy or credential route
        run: |
          set -euo pipefail
          if grep -R -E 'secrets\.[A-Za-z_]+|wrangler deploy|cloudflare.*token.*echo' \
              cloudflare/shared-worker-factory/tests; then
            echo "Forbidden online side effect in offline tests" >&2
            exit 1
          fi
          echo "PUBLIC_SOURCE_CONTRACT_ONLY_NO_CLOUDFLARE_MUTATION=PASS"
