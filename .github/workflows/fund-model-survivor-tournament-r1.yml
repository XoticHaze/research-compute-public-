name: Fund Model Survivor Tournament R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/fund_model_survivor_tournament_r1.py'
      - '.github/workflows/fund-model-survivor-tournament-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact admitted P248 source owner
        run: |
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/research-compute-public-/20490f115d901aac3b586c33072c1157ad4d10a6/research/p248_smallvalue_survivor_complementarity_r1.py -o research/p248_smallvalue_survivor_complementarity_r1.py
          test "$(git hash-object research/p248_smallvalue_survivor_complementarity_r1.py)" = "a0c63a4277913512ad8b081d324cca5f0c074c39"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/fund_model_survivor_tournament_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/fund_model_survivor_tournament_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fund-model-survivor-tournament__${{ steps.eval.outputs.tag }}
          path: research/artifacts/fund_model_survivor_tournament_r1.json
          if-no-files-found: error
