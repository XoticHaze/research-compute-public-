name: P46 Alpha Block Bootstrap R1
on:
  pull_request:
    paths:
      - 'research/p46_alpha_block_bootstrap_r1.py'
      - '.github/workflows/p46-alpha-block-bootstrap-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p46_alpha_block_bootstrap_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_alpha_block_bootstrap_r1.json')); t=x['tests']['2015']['qqq']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\n"); f.write(f"p={t['p_alpha_le_zero']:.3f}\n"); f.write(f"pmean={t['p_mean_matched_excess_le_zero']:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-alpha-bootstrap__${{ steps.run.outputs.decision }}__pAlphaLE0_${{ steps.run.outputs.p }}__pMeanLE0_${{ steps.run.outputs.pmean }}
          path: artifacts/p46_alpha_block_bootstrap_r1.json
          if-no-files-found: error
