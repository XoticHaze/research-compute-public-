name: MM-IBKR Free Paper Gateway Handoff Boundary R1

# Synthetic, no-broker cross-VM boundary test. Never claim IBKR auth migration.
on:
  push:
    branches:
      - test/mmibkr-free-paper-gateway-handoff-r1-20261013
    paths:
      - '.github/workflows/mmibkr-free-paper-gateway-handoff-r1.yml'
      - 'scripts/mmibkr_paper_gateway_handoff_probe_v1.py'
      - 'tests/test_mmibkr_paper_gateway_handoff_probe_v1.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mmibkr-free-paper-gateway-handoff-r1.yml'
      - 'scripts/mmibkr_paper_gateway_handoff_probe_v1.py'
      - 'tests/test_mmibkr_paper_gateway_handoff_probe_v1.py'

permissions:
  contents: read

concurrency:
  group: mmibkr-paper-gateway-boundary-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  # Canonical immutable B1 IBG controller image in the current auth comparator;
  # only verify its image identity and filesystem, do NOT launch Gateway.
  IBC_IMAGE: ghcr.io/code-hustler-ft3d/ibg-controller@sha256:5db4074ec952d130937afc3bb926ee97f115d09f7f46676eb16d98c2805572b5

jobs:
  predecessor:
    name: Synthetic predecessor release and checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Run 15 pure fail-closed handoff regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_mmibkr_paper_gateway_handoff_probe_v1.py' -v
          echo 'MMIBKR_PAPER_HANDOFF_OFFLINE_REGRESSION=PASS'

      - name: Verify previously owned pinned IBC Docker image without starting Gateway
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IBC_IMAGE" >/dev/null
          docker image inspect "$IBC_IMAGE" --format '{{.Id}}' | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker run --rm --network none --entrypoint /bin/sh "$IBC_IMAGE" -lc '
            set -eu
            test -d /home/ibgateway
            echo IBC_IMAGE_FILESYSTEM=PASS
          '
          echo 'MMIBKR_IMMUTABLE_IBC_GATEWAY_IMAGE_INSPECTED=PASS'
          echo 'MMIBKR_BROKER_GATEWAY_STARTED=0'

      - name: Generate synthetic paper checkpoint and release fenced predecessor
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/mmibkr-synthetic-paper-handoff"
          mkdir -p "$dir"
          python scripts/mmibkr_paper_gateway_handoff_probe_v1.py predecessor \
            --run-id "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --job predecessor \
            --checkpoint "$dir/checkpoint.json" --receipt "$dir/predecessor.json"
          test "$(stat -c %a "$dir/checkpoint.json")" = 600
          test "$(stat -c %a "$dir/predecessor.json")" = 600
          echo 'MMIBKR_PREDECESSOR_JOB_RELEASE=PASS'
          echo 'MMIBKR_PREDECESSOR_REAL_BROKER_AUTH=NOT_ATTEMPTED'

      - name: Save synthetic checkpoint for distinct successor VM
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-synthetic-paper-handoff
          key: mmibkr-synthetic-paper-handoff-v1-${{ github.run_id }}-${{ github.sha }}

      - name: Destroy predecessor local mock state
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mmibkr-synthetic-paper-handoff"
          echo 'MMIBKR_PREDECESSOR_LOCAL_STATE_DESTROYED=1'

  successor:
    name: Independent successor VM checkpoint acceptance
    needs: predecessor
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Restore exact predecessor mock checkpoint from GitHub cache
        id: restore
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-synthetic-paper-handoff
          key: mmibkr-synthetic-paper-handoff-v1-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Validate successor fencing and explicitly deny brokerage authority
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true || { echo 'PREDECESSOR_CHECKPOINT_NOT_RESTORED=1'; exit 64; }
          dir="$RUNNER_TEMP/mmibkr-synthetic-paper-handoff"
          python scripts/mmibkr_paper_gateway_handoff_probe_v1.py successor \
            --run-id "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --job successor \
            --checkpoint "$dir/checkpoint.json" --receipt "$dir/predecessor.json" \
            --output "$dir/successor.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mmibkr-synthetic-paper-handoff/successor.json'
          n=json.loads(p.read_text())
          assert n['independent_job_boundary'] is True
          assert n['exact_predecessor_checkpoint_restored'] is True
          for field in ('gateway_authentication_transfer_proven',
                        'jts_transfer_proven','broker_login_attempted',
                        'broker_positions_or_orders_read','live_orders_enabled',
                        'execution_ownership_granted','production_handoff_ready'):
              assert n[field] is False,field
          assert n['ibc_reauthentication_requirement']=='UNTESTED'
          print('MMIBKR_FREE_GITHUB_CROSS_VM_SYNTHETIC_HANDOFF=PASS')
          print('MMIBKR_PAPER_IBC_AUTHENTICATION_MIGRATION=NOT_TESTED')
          print('MMIBKR_LIVE_ORDER_DISPATCHES=0')
          PY

      - name: Destroy successor local mock state
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mmibkr-synthetic-paper-handoff"
          echo 'MMIBKR_SUCCESSOR_LOCAL_STATE_DESTROYED=1'
