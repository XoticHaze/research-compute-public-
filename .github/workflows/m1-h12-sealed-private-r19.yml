name: M1 H12 Sealed Private Research Consumer R19
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  EXPECTED_HARNESS: research_foundry_m1_h12_r18_v1
  EXCHANGE_REF: rendezvous-exchange
  RECIPIENT_ROOT: rendezvous/recipients
  RESPONSE_ROOT: rendezvous/responses
jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Install age only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Generate one-run age recipient
        run: |
          set -euo pipefail
          umask 077
          age-keygen -o "$RUNNER_TEMP/m1-age-identity.txt" 2>"$RUNNER_TEMP/m1-age-keygen.log"
          age-keygen -y "$RUNNER_TEMP/m1-age-identity.txt" > "$RUNNER_TEMP/m1-age-recipient.txt"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          recipient=Path(os.environ['RUNNER_TEMP'],'m1-age-recipient.txt').read_text(encoding='ascii').strip()
          key_id='sha256:'+hashlib.sha256(recipient.encode('ascii')).hexdigest()
          record={'schema':'m1-r19-age-ephemeral-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],
                  'harness':'research_foundry_m1_h12_r18_v1','algorithm':'age-x25519',
                  'recipient':recipient,'recipient_key_id':key_id}
          Path(os.environ['RUNNER_TEMP'],'m1-recipient.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          PY
      - name: Publish one-run recipient
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-m1-r19.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/m1-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish M1 R19 recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o "$RUNNER_TEMP/put.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" -d "$body" || true)"
            [ "$status" = 200 ] || [ "$status" = 201 ] && break
            [ "$status" = 409 ] || { cat "$RUNNER_TEMP/put.json" >&2; exit 22; }
            sleep $((attempt*2))
          done
          [ "$status" = 200 ] || [ "$status" = 201 ] || exit 23
      - name: Wait for sealed M1 envelope
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/m1-r19"
          for _ in $(seq 1 240); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${root}/sealed-job.json?ref=${EXCHANGE_REF}" \
              -o "$RUNNER_TEMP/sealed-job.json"; then break; fi
            sleep 5
          done
          test -s "$RUNNER_TEMP/sealed-job.json" || exit 42
          cipher="$(python -c "import json; print(json.load(open('$RUNNER_TEMP/sealed-job.json'))['ciphertext']['path'])")"
          case "$cipher" in m1-payload.tar.gz.age) ;; *) echo "unexpected ciphertext path" >&2; exit 43;; esac
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${root}/${cipher}?ref=${EXCHANGE_REF}" \
            -o "$RUNNER_TEMP/$cipher"
      - name: Bind envelope to one-run recipient before decrypt
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/validate_sealed_job_v1.py" sealed-job.json >/dev/null
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('sealed-job.json').read_text()); r=json.loads(Path('m1-recipient.json').read_text())
          assert m['harness']==r['harness']=='research_foundry_m1_h12_r18_v1'
          assert m['authority']=='research_only'
          assert m['encryption']=={'algorithm':'age-x25519','recipient_key_id':r['recipient_key_id']}
          assert hashlib.sha256(Path(m['ciphertext']['path']).read_bytes()).hexdigest()==m['ciphertext']['sha256']
          PY
      - name: Decrypt runner-temp payload
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          age -d -i m1-age-identity.txt -o m1-payload.tar.gz m1-payload.tar.gz.age
      - name: Execute fixed R19 consumer
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/validate_sealed_job_v1.py" sealed-job.json --decrypted m1-payload.tar.gz \
            > m1-receipt.json 2> m1-private-stderr.log
      - name: Emit sanitized receipt only
        run: |
          python - "$RUNNER_TEMP/m1-receipt.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); h=p['harness_result']
          out={'schema':'m1-h12-sealed-consumer-receipt-r19-v1','manifest_status':p['manifest_status'],
               'job_id':p['job_id'],'authority':p['authority'],'harness':h['harness'],
               'result_sha256':h['result_sha256'],'source_head':h['source_head'],'source_tree':h['source_tree'],
               'frozen_fold_sha256':h['frozen_fold_sha256'],'oos_rows':h['oos_rows'],'families':h['families']}
          print('M1_SEALED_RECEIPT='+json.dumps(out,sort_keys=True))
          PY
      - name: Remove one-run private material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/m1-age-identity.txt" "$RUNNER_TEMP/m1-age-recipient.txt" "$RUNNER_TEMP/m1-age-keygen.log" \
                "$RUNNER_TEMP/m1-recipient.json" "$RUNNER_TEMP/sealed-job.json" "$RUNNER_TEMP/m1-payload.tar.gz.age" \
                "$RUNNER_TEMP/m1-payload.tar.gz" "$RUNNER_TEMP/m1-receipt.json" "$RUNNER_TEMP/m1-private-stderr.log" "$RUNNER_TEMP/put.json"
