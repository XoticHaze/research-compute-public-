name: uup-efa-dollar-regime-r1
on:
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q yfinance pandas numpy
      - run: set -o pipefail; python research/uup_efa_dollar_regime_r1.py | tee uup_efa_dollar_regime_r1_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uup-efa-dollar-regime-r1-result
          path: uup_efa_dollar_regime_r1_result.txt