name: Cybersecurity Stage-A Source-Repaired Confirmation
on:
  push:
    paths: ['.github/workflows/cybersecurity-stagea-source-repaired-confirmation.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Source-only select replacements then evaluate unchanged model
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py'); r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          original=['PANW','CRWD','FTNT','ZS','OKTA','CYBR','S','GEN']
          stable=['PANW','CRWD','FTNT','ZS','OKTA','GEN']
          excluded={'CYBR':'provider HTTP 404 in source audit','S':'only 1300 common rows in source audit, below 1500 minimum'}
          candidates=['AKAM','CHKP','FFIV','QLYS','RDWR','RPD','TENB','VRNS']
          benchmark='CIBR'
          base=[*r.TRAIN,*stable,'QQQ',benchmark]
          base_frames={s:r._load(s) for s in base}
          eligibility={}; eligible=[]
          for symbol in candidates:
              try:
                  f=r._load(symbol); common=set(f.timestamp)
                  for b in base: common &= set(base_frames[b].timestamp)
                  ok=len(common)>=1500
                  eligibility[symbol]={'status':'ELIGIBLE' if ok else 'INELIGIBLE','rows':len(f),'common_rows':len(common),'start':f.iloc[0].timestamp.isoformat() if len(f) else None,'end':f.iloc[-1].timestamp.isoformat() if len(f) else None}
                  if ok: eligible.append(symbol)
              except Exception as exc:
                  eligibility[symbol]={'status':'ERROR','error':f'{type(exc).__name__}: {exc}'}
          if len(eligible)<2: raise RuntimeError('fewer than two source-eligible replacements: '+json.dumps(eligibility,sort_keys=True))
          replacements=eligible[:2]
          fresh=[*stable,*replacements]
          assert len(fresh)==8 and not(set(replacements)&set(original))
          required=[*r.TRAIN,*fresh,'QQQ',benchmark]
          frames={s:r._load(s) for s in required}; common=set(frames[required[0]].timestamp)
          for s in required[1:]: common &= set(frames[s].timestamp)
          if len(common)<1500: raise RuntimeError(f'repaired panel common rows={len(common)}')
          cutoff=max(common).isoformat()
          out=r._evaluate_matrix({'cybersecurity_source_repaired':{'primary_industry_etf':benchmark,'development_universe':fresh}},cutoff)
          summary=out['family_summary']['cybersecurity_source_repaired']
          receipt={'schema':'cybersecurity_stagea_source_repaired_confirmation.v1','benchmark':benchmark,'original_universe':original,'stable_originals':stable,'source_excluded':excluded,'replacement_candidate_pool':candidates,'replacement_eligibility':eligibility,'selected_replacements':replacements,'repaired_universe':fresh,'selection_rule':'first two alphabetically predeclared candidates with >=1500 common source rows; selection completed before model outcomes','cutoff':cutoff,'threshold_or_model_search':False,'external_holdouts_loaded':False,'family_summary':summary,'per_symbol':out['per_symbol'],'decision':'SOURCE_REPAIRED_PASS' if summary['development_family_gate_pass'] else 'SOURCE_REPAIRED_FAIL','research_only':True,'promotion_authority':False,'allocation_authority':False,'runtime_mutation':False,'live_trading_change':False}
          open('cybersecurity-stagea-source-repaired-confirmation.json','w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cybersecurity-stagea-source-repaired-confirmation
          path: cybersecurity-stagea-source-repaired-confirmation.json
          retention-days: 30
