name: P569 TSA PDF Daily Parity R4
on:
  pull_request:
    paths:
      - 'research/p569_tsa_pdf_daily_parity_r4.py'
      - '.github/workflows/p569-tsa-pdf-daily-parity-r4.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 pandas==2.2.3 pdfplumber==0.11.7
      - run: python research/p569_tsa_pdf_daily_parity_r4.py
      - uses: actions/upload-artifact@v4
        with:
          name: p569-tsa-pdf-daily-parity-r4
          path: artifacts/p569_tsa_pdf_daily_parity_r4.json
          if-no-files-found: error
