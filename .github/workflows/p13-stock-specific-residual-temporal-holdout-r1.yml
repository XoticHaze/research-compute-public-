name: P13 Stock Specific Residual Temporal Holdout R1
on:
  pull_request:
    paths:
      - 'scripts/p13_stock_specific_residual_temporal_holdout_r1.py'
      - '.github/workflows/p13-stock-specific-residual-temporal-holdout-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'yfinance==0.2.54'
      - id: evaluate
        run: |
          python scripts/p13_stock_specific_residual_temporal_holdout_r1.py | tee p13-temporal-holdout-log.txt
          python - <<'PY'
          import json,os
          x=json.load(open('p13-temporal-holdout-receipt.json')); t=x['tests']['2022_forward']['50']; vals={'decision':x['decision'],'smh':f"{100*t['excess_vs_smh_cagr']:.3f}",'raw':f"{100*t['excess_vs_raw_cagr']:.3f}",'folds':str(t['positive_folds_vs_smh'])}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-temporal__${{ steps.evaluate.outputs.decision }}__smh_${{ steps.evaluate.outputs.smh }}pp__raw_${{ steps.evaluate.outputs.raw }}pp__folds_${{ steps.evaluate.outputs.folds }}of5
          path: p13-temporal-holdout-receipt.json
          if-no-files-found: error
