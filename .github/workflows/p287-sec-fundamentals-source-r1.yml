name: P287 SEC Fundamentals Source R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p287_sec_fundamentals_source_r1.py'
      - '.github/workflows/p287-sec-fundamentals-source-r1.yml'
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: eval
        run: |
          python research/p287_sec_fundamentals_source_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p287_sec_fundamentals_source_r1.json')); tag=f"{x['decision']}__pass_{x['passing_tickers']}_{x['ticker_count']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p287-sec-fundamentals-source__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p287_sec_fundamentals_source_r1.json
          if-no-files-found: error
