name: Reference Protocol Proof

on:
  push:
    branches: [main]
    paths:
      - 'proof/fire/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Execute reference worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/reference_worker_v1.py
      - name: Publish encrypted envelope only
        if: ${{ always() && hashFiles('reference-result-envelope.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1
          path: reference-result-envelope.json
          if-no-files-found: error
