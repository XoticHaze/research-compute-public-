name: DBMF Peer Benchmark R1
on:
  pull_request:
    paths:
      - '.github/workflows/dbmf-peer-benchmark-r1.yml'
      - 'research/dbmf-peer-benchmark-r1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Evaluate frozen first-party DBMF vs SG CTA peer benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/dbmf-peer-benchmark-r1.json').read_text())
          rows=[]
          for y,z in sorted(c['calendar_returns'].items()):
              ex=z['dbmf_nav']-z['sg_cta']
              rows.append({'year':y,'dbmf_nav':z['dbmf_nav'],'sg_cta':z['sg_cta'],'excess':ex,'positive':ex>0})
          positive=sum(x['positive'] for x in rows)
          si24=c['since_inception_2024']['dbmf_nav_cagr']-c['since_inception_2024']['sg_cta_cagr']
          si25=c['since_inception_sep2025']['dbmf_nav_cagr']-c['since_inception_sep2025']['sg_cta_cagr']
          out={'schema':'dbmf_peer_benchmark_result.v1','rows':rows,'positive_years':positive,'year_count':len(rows),'since_inception_excess_cagr_2024':si24,'since_inception_excess_cagr_sep2025':si25,'gates':c['gates']}
          out['peer_edge_supported']=(si24>=c['gates']['min_since_inception_excess_cagr'] and si25>=c['gates']['min_since_inception_excess_cagr'] and positive>=c['gates']['min_positive_calendar_years'])
          out['research_only']=True
          Path('dbmf-peer-benchmark-r1-result.json').write_text(json.dumps(out,sort_keys=True,indent=2));print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dbmf-peer-benchmark-r1-result
          path: dbmf-peer-benchmark-r1-result.json
          retention-days: 14
