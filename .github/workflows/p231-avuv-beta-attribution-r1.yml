name: P231 AVUV Beta Attribution R1
on:
  pull_request:
    paths:
      - 'research/p231_avuv_beta_attribution_r1.py'
      - '.github/workflows/p231-avuv-beta-attribution-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p231_avuv_beta_attribution_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p231_avuv_beta_attribution_r1.json')); a=x['tests']['2020']; r=a['regressions']['IJR']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__alpha_{bp(r['alpha_ann'])}__folds_{a['positive_ijr_alpha_folds']}__t_{r['alpha_t_iid']:.2f}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p231-avuv-beta-attribution__${{ steps.eval.outputs.tag }}
          path: artifacts/p231_avuv_beta_attribution_r1.json
          if-no-files-found: error
