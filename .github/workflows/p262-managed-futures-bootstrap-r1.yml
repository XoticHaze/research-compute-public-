name: P262 Managed Futures Bootstrap R1
on:
  pull_request:
    branches: [assistant/market-research-p261-managed-futures-r1]
    paths:
      - 'research/p262_managed_futures_bootstrap_r1.py'
      - '.github/workflows/p262-managed-futures-bootstrap-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p262_managed_futures_bootstrap_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p262_managed_futures_bootstrap_r1.json')); a=x['tests']['2020']; tag=f"{x['decision']}__p0_{a['probability_excess_le_zero']:.3f}__p05_{a['bootstrap_annualized_excess_p05']:.3f}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p262-managed-futures-bootstrap__${{ steps.eval.outputs.tag }}
          path: artifacts/p262_managed_futures_bootstrap_r1.json
          if-no-files-found: error
