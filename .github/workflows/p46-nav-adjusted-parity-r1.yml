name: P46 NAV Adjusted Parity R1
on:
  pull_request:
    paths:
      - 'research/p46_nav_adjusted_parity_r1.py'
      - '.github/workflows/p46-nav-adjusted-parity-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 openpyxl==3.1.5 lxml==5.3.0 yfinance==0.2.65
      - run: python research/p46_nav_adjusted_parity_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p46-nav-adjusted-parity-r1
          path: artifacts/p46_nav_adjusted_parity_r1.json
          if-no-files-found: error
