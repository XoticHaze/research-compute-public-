name: Industry Stage-A Batch 3

on:
  push:
    paths:
      - '.github/workflows/industry-stagea-batch3.yml'
  pull_request:
    paths:
      - '.github/workflows/industry-stagea-batch3.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: consumer_staples
            benchmark: XLP
            symbols: PG,KO,PEP,PM,MO,CL,KMB,GIS
          - family: metals_mining
            benchmark: XME
            symbols: NEM,FCX,SCCO,NUE,STLD,CLF,AA,CENX
          - family: reits
            benchmark: VNQ
            symbols: AMT,PLD,O,SPG,EQIX,PSA,WELL,DLR
          - family: pharma
            benchmark: PPH
            symbols: LLY,MRK,PFE,BMY,ABBV,JNJ,AMGN,AZN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute frozen Stage-A family evaluator
        env:
          FAMILY: ${{ matrix.family }}
          BENCHMARK: ${{ matrix.benchmark }}
          SYMBOLS: ${{ matrix.symbols }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json, os
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          family=os.environ['FAMILY']
          symbols=os.environ['SYMBOLS'].split(',')
          contract={family:{'primary_industry_etf':os.environ['BENCHMARK'],'development_universe':symbols}}
          out=r._evaluate_matrix(contract,'2026-09-01T13:30:00+00:00')
          receipt={
            'schema':'industry_stagea_batch3.v1',
            'family':family,
            'benchmark':os.environ['BENCHMARK'],
            'development_universe':symbols,
            'external_holdouts_loaded':False,
            'family_summary':out['family_summary'][family],
            'per_symbol':out['per_symbol'],
            'decision':'ADVANCE' if out['family_summary'][family]['development_family_gate_pass'] else 'REJECT_OR_REARCHITECT',
            'research_only':True,
            'promotion_authority':False,
          }
          path=f'{family}-stagea-receipt.json'
          open(path,'w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('INDUSTRY_STAGEA_BATCH3='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagea-${{ matrix.family }}
          path: ${{ matrix.family }}-stagea-receipt.json
          retention-days: 14
