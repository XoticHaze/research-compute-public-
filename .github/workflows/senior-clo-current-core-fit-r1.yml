name: Senior CLO Current Core Fit R1

on:
  pull_request:
    paths:
      - 'research/senior_clo_current_core_fit_r1.py'
      - 'research/p558_current_core_opportunity_cost_r1.py'
      - 'research/p279_p249_p266_forward_shadow_observer_r1.py'
      - '.github/workflows/senior-clo-current-core-fit-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check yfinance==0.2.65 pandas==2.3.2 numpy==2.3.2
      - id: result
        run: |
          python -m research.senior_clo_current_core_fit_r1
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/senior_clo_current_core_fit_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senior-clo-current-core-fit__${{ steps.result.outputs.decision }}
          path: research/artifacts/senior_clo_current_core_fit_r1.json
          if-no-files-found: error
