name: P220 Midcap Beta Adjusted Alpha R1
on:
  pull_request:
    paths:
      - 'research/p220_midcap_beta_adjusted_alpha_r1.py'
      - '.github/workflows/p220-midcap-beta-adjusted-alpha-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p220_midcap_beta_adjusted_alpha_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p220_midcap_beta_adjusted_alpha_r1.json')); a=x['tests']['2010']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__am_{bp(a['vs_mdy']['annualized_alpha'])}__as_{bp(a['vs_spy']['annualized_alpha'])}__fm_{a['positive_mdy_alpha_folds']}__fs_{a['positive_spy_alpha_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p220-midcap-beta-adjusted-alpha__${{ steps.eval.outputs.tag }}
          path: artifacts/p220_midcap_beta_adjusted_alpha_r1.json
          if-no-files-found: error
