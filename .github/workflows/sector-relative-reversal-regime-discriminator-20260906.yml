name: Sector Relative Reversal Regime Discriminator
on:
  pull_request:
    paths:
      - "research/sector_relative_reversal_regime_discriminator_20260906.py"
      - ".github/workflows/sector-relative-reversal-regime-discriminator-20260906.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install numerical environment
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Execute regime discriminator
        run: python research/sector_relative_reversal_regime_discriminator_20260906.py
      - name: Retain receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sector-relative-reversal-regime-receipt
          path: sector-relative-reversal-regime-receipt.json
          if-no-files-found: error
