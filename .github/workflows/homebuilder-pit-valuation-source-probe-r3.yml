name: Homebuilder PIT Valuation Source Probe R3
on:
  push:
    branches: ['market-research/homebuilder-pit-valuation-source-r1-20260913']
    paths:
      - 'research/homebuilder_pit_valuation_source_probe_r3.py'
      - '.github/workflows/homebuilder-pit-valuation-source-probe-r3.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Provenance
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "experiment_id=HOMEBUILDER-PIT-VALUATION-SOURCE-PROBE-R3"
          echo "economic_outcomes_examined=false"
      - run: python -m py_compile research/homebuilder_pit_valuation_source_probe_r2.py research/homebuilder_pit_valuation_source_probe_r3.py
      - name: Execute source R3
        run: python research/homebuilder_pit_valuation_source_probe_r3.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homebuilder-pit-valuation-source-probe-r3-result
          path: research/results/homebuilder_pit_valuation_source_probe_r3.json
          if-no-files-found: error
          retention-days: 30
