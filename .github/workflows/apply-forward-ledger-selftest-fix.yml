name: Apply Forward Ledger Self-Test Fix

on:
  push:
    branches:
      - 'assistant/forward-prospective-cohort-ledger-r1'
    paths:
      - '.github/workflows/apply-forward-ledger-selftest-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix synthetic loader cutoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/forward_prospective_cohort_ledger_r1.py')
          text = p.read_text()
          old = '''    def loader(symbol: str, _start: date, _end: date) -> pd.Series:\n        return fake[symbol]\n'''
          new = '''    def loader(symbol: str, _start: date, _end: date) -> pd.Series:\n        series = fake[symbol]\n        return series[series.index <= pd.Timestamp(_end)]\n'''
          assert old in text, 'expected self-test loader snippet not found'
          p.write_text(text.replace(old, new, 1))
          PY
          python research/forward_prospective_cohort_ledger_r1.py --self-test
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'forward-release-bot'
          git config user.email 'forward-release-bot@users.noreply.github.com'
          git add research/forward_prospective_cohort_ledger_r1.py
          git diff --cached --check
          git commit -m 'forward: fix prospective ledger cutoff self-test'
          git push origin HEAD:assistant/forward-prospective-cohort-ledger-r1
