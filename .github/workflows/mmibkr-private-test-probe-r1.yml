name: MMIBKR Private Test Probe R1

on:
  push:
    branches:
      - main
    paths:
      - 'rendezvous/fire/mmibkr-private-test-probe-r1'
  pull_request:
    paths:
      - '.github/workflows/mmibkr-private-test-probe-r1.yml'
      - 'scripts/mmibkr_private_test_probe_v1.py'
      - 'scripts/mmibkr_private_ui_build_probe_v1.py'
      - 'scripts/mmibkr_source_vault_consumer_v1.py'
      - 'tests/test_mmibkr_private_test_probe_v1.py'
      - 'tests/test_mmibkr_private_ui_build_probe_v1.py'
      - 'tests/test_mmibkr_source_vault_consumer_v1.py'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact private MM-IBKR commit SHA or admitted ref
        required: true
        type: string
      test_modules:
        description: Comma/space separated allowlisted unittest modules
        required: true
        type: string
      ui_acceptance_file:
        description: Optional allowlisted private UI Node acceptance file
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed public probe dependencies
        run: python -m pip install --disable-pip-version-check cryptography pytest

      - name: Validate public probe implementation
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python -m py_compile scripts/mmibkr_source_vault_consumer_v1.py
          python -m py_compile scripts/mmibkr_private_test_probe_v1.py
          python -m py_compile scripts/mmibkr_private_ui_build_probe_v1.py
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_mmibkr_private_test_probe_v1.py \
            tests/test_mmibkr_private_ui_build_probe_v1.py \
            tests/test_mmibkr_source_vault_consumer_v1.py

      - name: Resolve exact private test request
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_TEST_MODULES: ${{ inputs.test_modules }}
          DISPATCH_UI_ACCEPTANCE_FILE: ${{ inputs.ui_acceptance_file }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              source_ref = os.environ.get("DISPATCH_SOURCE_REF", "").strip()
              modules = os.environ.get("DISPATCH_TEST_MODULES", "").strip()
              parity_key = ""
              ui_acceptance = os.environ.get("DISPATCH_UI_ACCEPTANCE_FILE", "").strip()
              crw_consumer_reprobe = False
              s3_composition_economics = False
              s4_layered_mtf_economics = False
          elif event == "push":
              node = json.loads(Path("rendezvous/fire/mmibkr-private-test-probe-r1").read_text(encoding="utf-8"))
              if node.get("schema") != "mmibkr.private_test_probe_fire.v1":
                  raise SystemExit("private test probe fire schema rejected")
              source_ref = str(node.get("source_ref") or "").strip()
              raw_modules = node.get("test_modules") or []
              if not isinstance(raw_modules, list):
                  raise SystemExit("private test probe modules must be a list")
              modules = ",".join(str(value).strip() for value in raw_modules if str(value).strip())
              parity_key = str(node.get("parity_public_key_b64") or "").strip()
              ui_acceptance = str(node.get("ui_acceptance_file") or "").strip()
              crw_consumer_reprobe = bool(node.get("crw_consumer_reprobe"))
              s3_composition_economics = bool(node.get("s3_composition_economics"))
              s4_layered_mtf_economics = bool(node.get("s4_layered_mtf_economics"))
          else:
              raise SystemExit("unsupported private test probe event")
          if not re.fullmatch(r"[0-9a-f]{40}", source_ref):
              raise SystemExit("private test probe requires exact 40-char source SHA")
          if not modules:
              raise SystemExit("private test probe requires modules")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as fh:
              fh.write("MMIBKR_PRIVATE_TEST_SOURCE_REF=" + source_ref + "\n")
              fh.write("MMIBKR_PRIVATE_TEST_MODULES=" + modules + "\n")
              if parity_key:
                  fh.write("MMIBKR_PARITY_PUBLIC_KEY_B64=" + parity_key + "\n")
              if ui_acceptance:
                  fh.write("MMIBKR_PRIVATE_UI_ACCEPTANCE=" + ui_acceptance + "\n")
              fh.write("MMIBKR_CRW_CONSUMER_REPROBE=" + ("1" if crw_consumer_reprobe else "0") + "\n")
              fh.write("MMIBKR_S3_COMPOSITION_ECONOMICS=" + ("1" if s3_composition_economics else "0") + "\n")
              fh.write("MMIBKR_S4_LAYERED_MTF_ECONOMICS=" + ("1" if s4_layered_mtf_economics else "0") + "\n")
          print("MMIBKR_PRIVATE_TEST_REQUEST=PASS")
          print("MMIBKR_PRIVATE_TEST_SOURCE_REF=" + source_ref)
          print("MMIBKR_PRIVATE_TEST_MODULE_COUNT=" + str(len([x for x in modules.split(",") if x])))
          print("MMIBKR_PRIVATE_UI_ACCEPTANCE_REQUESTED=" + ("1" if ui_acceptance else "0"))
          PY

      - name: Materialize exact private MM source from encrypted Source Vault
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$MMIBKR_PRIVATE_TEST_SOURCE_REF" \
            --destination "$RUNNER_TEMP/mmibkr-private-test-probe-source" \
            --archive-output "$RUNNER_TEMP/mmibkr-private-test-probe-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-private-test-probe-source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          node=json.loads(Path(os.environ['RUNNER_TEMP'],'mmibkr-private-test-probe-source.json').read_text())
          if node.get('ok') is not True:
              raise SystemExit('private source materialization failed')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('MMIBKR_PRIVATE_TEST_SOURCE_ROOT='+str(node['source_root'])+'\n')
          print('MMIBKR_PRIVATE_TEST_SOURCE_SHA='+str(node['source_sha']))
          print('MMIBKR_PRIVATE_TEST_SOURCE_ARCHIVE_SHA256='+str(node['source_archive_sha256']))
          print('MMIBKR_PRIVATE_TEST_SOURCE_TRANSPORT='+str(node.get('source_transport')))
          print('MMIBKR_PRIVATE_TEST_SOURCE_MANIFEST_SHA256='+str(node.get('source_manifest_sha256')))
          print('MMIBKR_PRIVATE_TEST_SOURCE_TOKEN_USED=0')
          print('MMIBKR_PRIVATE_TEST_BROKER_CREDENTIALS_USED=0')
          PY

      - name: Encrypt one-time current-source parity handoff
        if: github.event_name == 'push' && env.MMIBKR_PARITY_PUBLIC_KEY_B64 != ''
        shell: bash
        env:
          PARITY_PUBLIC_KEY_B64: ${{ env.MMIBKR_PARITY_PUBLIC_KEY_B64 }}
          PARITY_EXPECTED_SOURCE_SHA: ${{ env.MMIBKR_PRIVATE_TEST_SOURCE_REF }}
        run: |
          set -euo pipefail
          umask 077
          test "$MMIBKR_PRIVATE_TEST_SOURCE_REF" = "$PARITY_EXPECTED_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/mmibkr-parity-export"
          printf '%s' "$PARITY_PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/mmibkr-parity-public.pem"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          temp=Path(os.environ["RUNNER_TEMP"])
          source=os.environ["PARITY_EXPECTED_SOURCE_SHA"]
          archive=temp/"mmibkr-private-test-probe-source.tar.gz"
          raw=archive.read_bytes()
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=("mmibkr-parity:"+source).encode()
          cipher=AESGCM(key).encrypt(nonce, raw, aad)
          public=serialization.load_pem_public_key((temp/"mmibkr-parity-public.pem").read_bytes())
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          out=temp/"mmibkr-parity-export"
          (out/"mm-ibkr-source.enc").write_bytes(cipher)
          (out/"wrapped-key.bin").write_bytes(wrapped)
          (out/"manifest.json").write_text(json.dumps({
              "schema":"mmibkr.parity_encrypted_source_export.v1",
              "source_sha":source,
              "archive_sha256":hashlib.sha256(raw).hexdigest(),
              "archive_bytes":len(raw),
              "ciphertext_sha256":hashlib.sha256(cipher).hexdigest(),
              "ciphertext_bytes":len(cipher),
              "nonce_b64":base64.b64encode(nonce).decode(),
              "aad_b64":base64.b64encode(aad).decode(),
              "cipher":"AES-256-GCM",
              "key_wrap":"RSA-OAEP-256",
              "private_plaintext_published":False
          },sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY
          rm -f "$RUNNER_TEMP/mmibkr-parity-public.pem"

      - name: Upload encrypted current-source parity handoff
        if: github.event_name == 'push' && env.MMIBKR_PARITY_PUBLIC_KEY_B64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-parity-encrypted-${{ env.MMIBKR_PRIVATE_TEST_SOURCE_REF }}
          path: ${{ runner.temp }}/mmibkr-parity-export/
          retention-days: 1
          if-no-files-found: error

      - name: Build exact private UI and execute acceptance
        if: github.event_name != 'pull_request' && env.MMIBKR_PRIVATE_UI_ACCEPTANCE != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mmibkr_private_ui_build_probe_v1.py \
            --source-root "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" \
            --source-materialization "$RUNNER_TEMP/mmibkr-private-test-probe-source.json" \
            --source-ref "$MMIBKR_PRIVATE_TEST_SOURCE_REF" \
            --acceptance-file "$MMIBKR_PRIVATE_UI_ACCEPTANCE" \
            | tee "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log"
          grep '^MMIBKR_PRIVATE_UI_BUILD_RECEIPT=' "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log" \
            > "$RUNNER_TEMP/mmibkr-private-ui-build-sanitized-receipt.txt"
          grep '^MMIBKR_PRIVATE_UI_BUILD_RECEIPT_SHA256=' "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log" \
            >> "$RUNNER_TEMP/mmibkr-private-ui-build-sanitized-receipt.txt"

      - name: Upload sanitized private UI build receipt
        if: github.event_name != 'pull_request' && env.MMIBKR_PRIVATE_UI_ACCEPTANCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-private-ui-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-private-ui-build-sanitized-receipt.txt
          retention-days: 7

      - name: Execute exact-private CRW24 consumer reprobe
        if: github.event_name != 'pull_request' && env.MMIBKR_CRW_CONSUMER_REPROBE == '1'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mmibkr-crw-consumer-reprobe"
          mkdir -p "$ROOT"
          python -m pip install --disable-pip-version-check \
            pandas==2.3.3 numpy==2.3.3 scikit-learn pytest pytz requests ib_insync==0.9.86

          # Prove the exact consumer-observation semantics before any provider call.
          PYTHONPATH="$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" python -m pytest -q \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_crw_consumer_observation_capture_20261003.py" \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_autotuner_behavioral_consumption_vnext.py"

          # Consumption proof does not use market-control economics. Remove only
          # matched-control metadata for this probe so provider acquisition is
          # limited to the 24 candidate market cells instead of unnecessary ETF cells.
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=Path(os.environ["MMIBKR_PRIVATE_TEST_SOURCE_ROOT"])/"config/research/autotuner_s1a_crw_consumer_reprobe_20261003.json"
          node=json.loads(src.read_text(encoding="utf-8"))
          for row in node.get("symbols") or []:
              if isinstance(row,dict):
                  row.pop("matched_control",None)
          out=Path(os.environ["RUNNER_TEMP"])/"mmibkr-crw-consumer-reprobe"/"probe-config.json"
          out.write_text(json.dumps(node,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("MMIBKR_CRW24_PROBE_CONFIG="+str(out))
          PY

          # The prior 2026-08-04 start crossed Yahoo's rolling intraday retention
          # boundary on 2026-10-03 and deterministically returned HTTP 422. This
          # behavioral-consumption probe needs only a discriminating bounded dataset,
          # not the earlier economic window, so use a fixed recent development slice.
          python "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/scripts/research/s1a_public_stock_shard_materialize_20261002.py" \
            --config "$ROOT/probe-config.json" \
            --shard-index 0 --shard-count 1 \
            --start-utc 2026-09-03T13:30:00Z --end-utc 2026-10-02T00:00:00Z \
            --source-root "$ROOT/source" \
            --data-root "$ROOT/data" \
            --receipt-json "$ROOT/input-materialization.json"
          PYTHONPATH="$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" \
            python "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/autotuner_family_universe_wave.py" \
              --config "$ROOT/probe-config.json" \
              --data-root "$ROOT/data" \
              --output-root "$ROOT/waves" \
              --shard-index 0 --shard-count 1 --probe-only
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"mmibkr-crw-consumer-reprobe"
          roots=list((root/"waves").glob("*/shard-00-of-01"))
          if len(roots)!=1:
              raise SystemExit(f"expected one CRW24 result root, got {roots}")
          proof=json.loads((roots[0]/"consumption_proof.json").read_text())
          reports=[r for r in (proof.get("reports") or []) if isinstance(r,dict)]
          if len(reports)!=24:
              raise SystemExit(f"expected 24 CRW reports, got {len(reports)}")
          summary={
              "schema":"mm.s1a_crw_consumer_observation_reprobe.v2",
              "source_sha":os.environ["MMIBKR_PRIVATE_TEST_SOURCE_REF"],
              "job_count":len(reports),
              "consumption_proven":sum(r.get("state")=="CONSUMPTION_PROVEN" for r in reports),
              "consumption_not_yet_proven":sum(r.get("state")=="CONSUMPTION_NOT_YET_PROVEN" for r in reports),
              "jobs":[{
                  "job_id":r.get("job_id"),
                  "symbol":r.get("symbol"),
                  "timeframe":r.get("timeframe"),
                  "state":r.get("state"),
                  "consumed_parameters":r.get("consumed_parameters"),
              } for r in reports],
              "authority":{
                  "research_only":True,
                  "strategy_spec_write":False,
                  "runtime_activation":False,
                  "broker_submit":False,
                  "promotion_mutation":False,
                  "live_trading":False,
              },
          }
          path=root/"sanitized-crw24-summary.json"
          path.write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("MMIBKR_CRW24_CONSUMER_REPROBE_BEGIN")
          print(json.dumps(summary,sort_keys=True))
          print("MMIBKR_CRW24_CONSUMER_REPROBE_END")
          PY

      - name: Upload sanitized CRW24 consumer receipt
        if: github.event_name != 'pull_request' && env.MMIBKR_CRW_CONSUMER_REPROBE == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-crw24-consumer-reprobe-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-crw-consumer-reprobe/sanitized-crw24-summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Execute exact-private S3 composition economics
        if: github.event_name != 'pull_request' && env.MMIBKR_S3_COMPOSITION_ECONOMICS == '1'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mmibkr-s3-composition-economics"
          mkdir -p "$ROOT/results"
          python -m pip install --disable-pip-version-check \
            pandas==2.3.3 numpy==2.3.3 scikit-learn pytest pytz requests ib_insync==0.9.86

          PYTHONPATH="$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" python -m pytest -q \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_s3_composition_matched_control_economics_20261003.py" \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_autotuner_composition_generator_vnext.py"

          python "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/scripts/research/s1a_public_stock_shard_materialize_20261002.py" \
            --config "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/config/research/s3_composition_economics_20261003.json" \
            --shard-index 0 --shard-count 1 \
            --start-utc 2026-09-03T13:30:00Z --end-utc 2026-10-02T00:00:00Z \
            --source-root "$ROOT/source" \
            --data-root "$ROOT/data" \
            --receipt-json "$ROOT/input-materialization.json"

          for symbol in AMAT AAPL TSLA; do
            PYTHONPATH="$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" \
              python "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/scripts/research/s3_composition_matched_control_economics_20261003.py" \
                --symbol "$symbol" \
                --data-root "$ROOT/data" \
                --output "$ROOT/results/$symbol.json"
          done

          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"mmibkr-s3-composition-economics"
          rows=[]
          for symbol in ("AMAT","AAPL","TSLA"):
              node=json.loads((root/"results"/f"{symbol}.json").read_text())
              rows.append({
                  "symbol":symbol,
                  "candidate_count":node["candidate_count"],
                  "backtest_valid_count":node["backtest_valid_count"],
                  "positive_simpler_control_count":node["positive_simpler_control_count"],
                  "positive_underlying_excess_count":node["positive_underlying_excess_count"],
                  "positive_sector_excess_count":node["positive_sector_excess_count"],
                  "economic_seed_supported_count":node["economic_seed_supported_count"],
                  "economic_seed_supported_ids":node["economic_seed_supported_ids"],
              })
          summary={
              "schema":"mm.s3_composition_matched_control_economics.summary.v1",
              "source_sha":os.environ["MMIBKR_PRIVATE_TEST_SOURCE_REF"],
              "symbols":rows,
              "candidate_evaluations":sum(x["candidate_count"] for x in rows),
              "economic_seed_supported_total":sum(x["economic_seed_supported_count"] for x in rows),
              "authority":{
                  "research_only":True,
                  "historical_survivor_granted":False,
                  "runtime_activation":False,
                  "broker_submit":False,
                  "promotion_mutation":False,
                  "live_trading":False,
              },
          }
          (root/"sanitized-s3-summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("MMIBKR_S3_COMPOSITION_ECONOMICS_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY

      - name: Upload sanitized S3 composition economics
        if: github.event_name != 'pull_request' && env.MMIBKR_S3_COMPOSITION_ECONOMICS == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-s3-composition-economics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mmibkr-s3-composition-economics/sanitized-s3-summary.json
            ${{ runner.temp }}/mmibkr-s3-composition-economics/results/*.json
            ${{ runner.temp }}/mmibkr-s3-composition-economics/input-materialization.json
          retention-days: 14
          if-no-files-found: error

      - name: Execute exact-private S4 layered MTF economics
        if: github.event_name != 'pull_request' && env.MMIBKR_S4_LAYERED_MTF_ECONOMICS == '1'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mmibkr-s4-layered-mtf-economics"
          mkdir -p "$ROOT/results"
          python -m pip install --disable-pip-version-check \
            pandas==2.3.3 numpy==2.3.3 scikit-learn pytest pytz requests ib_insync==0.9.86

          PYTHONPATH="$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" python -m pytest -q \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_s4_layered_mtf_matched_control_economics_20261004.py" \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_autotuner_composition_generator_vnext.py" \
            "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/tests/test_strategy_spec_mtf_registry_backtest_vnext.py"

          python "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/scripts/research/s1a_public_stock_shard_materialize_20261002.py" \
            --config "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/config/research/s4_layered_mtf_economics_20261004.json" \
            --shard-index 0 --shard-count 1 \
            --start-utc 2026-09-03T13:30:00Z --end-utc 2026-10-02T00:00:00Z \
            --source-root "$ROOT/source" \
            --data-root "$ROOT/data" \
            --receipt-json "$ROOT/input-materialization.json"

          for symbol in AMAT AAPL TSLA; do
            PYTHONPATH="$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" \
              python "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT/scripts/research/s4_layered_mtf_matched_control_economics_20261004.py" \
                --symbol "$symbol" \
                --data-root "$ROOT/data" \
                --output "$ROOT/results/$symbol.json"
          done

          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"mmibkr-s4-layered-mtf-economics"
          rows=[]
          for symbol in ("AMAT","AAPL","TSLA"):
              node=json.loads((root/"results"/f"{symbol}.json").read_text())
              rows.append({
                  "symbol":symbol,
                  "candidate_count":node["candidate_count"],
                  "backtest_valid_count":node["backtest_valid_count"],
                  "positive_simpler_control_count":node["positive_simpler_control_count"],
                  "positive_underlying_excess_count":node["positive_underlying_excess_count"],
                  "positive_sector_excess_count":node["positive_sector_excess_count"],
                  "economic_seed_supported_count":node["economic_seed_supported_count"],
                  "economic_seed_supported_ids":node["economic_seed_supported_ids"],
              })
          summary={
              "schema":"mm.s4_layered_mtf_matched_control_economics.summary.v1",
              "source_sha":os.environ["MMIBKR_PRIVATE_TEST_SOURCE_REF"],
              "symbols":rows,
              "candidate_evaluations":sum(x["candidate_count"] for x in rows),
              "backtest_valid_total":sum(x["backtest_valid_count"] for x in rows),
              "positive_simpler_control_total":sum(x["positive_simpler_control_count"] for x in rows),
              "positive_underlying_excess_total":sum(x["positive_underlying_excess_count"] for x in rows),
              "positive_sector_excess_total":sum(x["positive_sector_excess_count"] for x in rows),
              "economic_seed_supported_total":sum(x["economic_seed_supported_count"] for x in rows),
              "authority":{
                  "research_only":True,
                  "historical_survivor_granted":False,
                  "runtime_activation":False,
                  "broker_submit":False,
                  "promotion_mutation":False,
                  "live_trading":False,
              },
          }
          (root/"sanitized-s4-summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("MMIBKR_S4_LAYERED_MTF_ECONOMICS_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY

      - name: Upload sanitized S4 layered MTF economics
        if: github.event_name != 'pull_request' && env.MMIBKR_S4_LAYERED_MTF_ECONOMICS == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-s4-layered-mtf-economics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mmibkr-s4-layered-mtf-economics/sanitized-s4-summary.json
            ${{ runner.temp }}/mmibkr-s4-layered-mtf-economics/results/*.json
            ${{ runner.temp }}/mmibkr-s4-layered-mtf-economics/input-materialization.json
          retention-days: 14
          if-no-files-found: error

      - name: Execute allowlisted exact-private research tests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mmibkr_private_test_probe_v1.py \
            --source-root "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" \
            --source-materialization "$RUNNER_TEMP/mmibkr-private-test-probe-source.json" \
            --source-ref "$MMIBKR_PRIVATE_TEST_SOURCE_REF" \
            --test-modules "$MMIBKR_PRIVATE_TEST_MODULES" \
            --image-tag "mmibkr-private-test-probe:${GITHUB_RUN_ID}" \
            | tee "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log"
          grep '^MMIBKR_PRIVATE_TEST_PROBE_RECEIPT=' "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log" \
            > "$RUNNER_TEMP/mmibkr-private-test-probe-sanitized-receipt.txt"
          grep '^MMIBKR_PRIVATE_TEST_PROBE_RECEIPT_SHA256=' "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log" \
            >> "$RUNNER_TEMP/mmibkr-private-test-probe-sanitized-receipt.txt"

      - name: Upload sanitized private test receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-private-test-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-private-test-probe-sanitized-receipt.txt
          retention-days: 7

      - name: Destroy one-run private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "mmibkr-private-test-probe:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          sudo rm -rf \
            "$RUNNER_TEMP/mmibkr-private-test-probe-source" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-source.json" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-source.tar.gz" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-sanitized-receipt.txt" \
            "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log" \
            "$RUNNER_TEMP/mmibkr-private-ui-build-sanitized-receipt.txt" \
            "$RUNNER_TEMP/mmibkr-crw-consumer-reprobe" \
            "$RUNNER_TEMP/mmibkr-s3-composition-economics" \
            "$RUNNER_TEMP/mmibkr-s4-layered-mtf-economics"
          echo 'MMIBKR_PRIVATE_TEST_PROBE_PRIVATE_MATERIAL_DESTROYED=1'
