name: MMIBKR Private Test Probe R1

on:
  push:
    branches:
      - main
    paths:
      - 'rendezvous/fire/mmibkr-private-test-probe-r1'
  pull_request:
    paths:
      - '.github/workflows/mmibkr-private-test-probe-r1.yml'
      - 'scripts/mmibkr_private_test_probe_v1.py'
      - 'scripts/mmibkr_source_vault_consumer_v1.py'
      - 'tests/test_mmibkr_private_test_probe_v1.py'
      - 'tests/test_mmibkr_source_vault_consumer_v1.py'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact private MM-IBKR commit SHA or admitted ref
        required: true
        type: string
      test_modules:
        description: Comma/space separated allowlisted unittest modules
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed public probe dependencies
        run: python -m pip install --disable-pip-version-check cryptography pytest

      - name: Validate public probe implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/mmibkr_source_vault_consumer_v1.py
          python -m py_compile scripts/mmibkr_private_test_probe_v1.py
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_mmibkr_private_test_probe_v1.py \
            tests/test_mmibkr_source_vault_consumer_v1.py

      - name: Resolve exact private test request
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_TEST_MODULES: ${{ inputs.test_modules }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              source_ref = os.environ.get("DISPATCH_SOURCE_REF", "").strip()
              modules = os.environ.get("DISPATCH_TEST_MODULES", "").strip()
          elif event == "push":
              node = json.loads(Path("rendezvous/fire/mmibkr-private-test-probe-r1").read_text(encoding="utf-8"))
              if node.get("schema") != "mmibkr.private_test_probe_fire.v1":
                  raise SystemExit("private test probe fire schema rejected")
              source_ref = str(node.get("source_ref") or "").strip()
              raw_modules = node.get("test_modules") or []
              if not isinstance(raw_modules, list):
                  raise SystemExit("private test probe modules must be a list")
              modules = ",".join(str(value).strip() for value in raw_modules if str(value).strip())
          else:
              raise SystemExit("unsupported private test probe event")
          if not re.fullmatch(r"[0-9a-f]{40}", source_ref):
              raise SystemExit("private test probe requires exact 40-char source SHA")
          if not modules:
              raise SystemExit("private test probe requires modules")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as fh:
              fh.write("MMIBKR_PRIVATE_TEST_SOURCE_REF=" + source_ref + "\n")
              fh.write("MMIBKR_PRIVATE_TEST_MODULES=" + modules + "\n")
          print("MMIBKR_PRIVATE_TEST_REQUEST=PASS")
          print("MMIBKR_PRIVATE_TEST_SOURCE_REF=" + source_ref)
          print("MMIBKR_PRIVATE_TEST_MODULE_COUNT=" + str(len([x for x in modules.split(",") if x])))
          PY

      - name: Materialize exact private MM source from encrypted Source Vault
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$MMIBKR_PRIVATE_TEST_SOURCE_REF" \
            --destination "$RUNNER_TEMP/mmibkr-private-test-probe-source" \
            --archive-output "$RUNNER_TEMP/mmibkr-private-test-probe-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-private-test-probe-source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          node=json.loads(Path(os.environ['RUNNER_TEMP'],'mmibkr-private-test-probe-source.json').read_text())
          if node.get('ok') is not True:
              raise SystemExit('private source materialization failed')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('MMIBKR_PRIVATE_TEST_SOURCE_ROOT='+str(node['source_root'])+'\n')
          print('MMIBKR_PRIVATE_TEST_SOURCE_SHA='+str(node['source_sha']))
          print('MMIBKR_PRIVATE_TEST_SOURCE_ARCHIVE_SHA256='+str(node['source_archive_sha256']))
          print('MMIBKR_PRIVATE_TEST_SOURCE_TRANSPORT='+str(node.get('source_transport')))
          print('MMIBKR_PRIVATE_TEST_SOURCE_MANIFEST_SHA256='+str(node.get('source_manifest_sha256')))
          print('MMIBKR_PRIVATE_TEST_SOURCE_TOKEN_USED=0')
          print('MMIBKR_PRIVATE_TEST_BROKER_CREDENTIALS_USED=0')
          PY

      - name: Encrypt one-time current-source parity handoff
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PARITY_PUBLIC_KEY_B64: 
          PARITY_EXPECTED_SOURCE_SHA: 48c4119bed5cc572e1078386070cb2263032f3d8
        run: |
          set -euo pipefail
          umask 077
          test "$MMIBKR_PRIVATE_TEST_SOURCE_REF" = "$PARITY_EXPECTED_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/mmibkr-parity-export"
          printf '%s' "$PARITY_PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/mmibkr-parity-public.pem"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          temp=Path(os.environ["RUNNER_TEMP"])
          source=os.environ["PARITY_EXPECTED_SOURCE_SHA"]
          archive=temp/"mmibkr-private-test-probe-source.tar.gz"
          raw=archive.read_bytes()
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=("mmibkr-parity:"+source).encode()
          cipher=AESGCM(key).encrypt(nonce, raw, aad)
          public=serialization.load_pem_public_key((temp/"mmibkr-parity-public.pem").read_bytes())
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          out=temp/"mmibkr-parity-export"
          (out/"mm-ibkr-source.enc").write_bytes(cipher)
          (out/"wrapped-key.bin").write_bytes(wrapped)
          (out/"manifest.json").write_text(json.dumps({
              "schema":"mmibkr.parity_encrypted_source_export.v1",
              "source_sha":source,
              "archive_sha256":hashlib.sha256(raw).hexdigest(),
              "archive_bytes":len(raw),
              "ciphertext_sha256":hashlib.sha256(cipher).hexdigest(),
              "ciphertext_bytes":len(cipher),
              "nonce_b64":base64.b64encode(nonce).decode(),
              "aad_b64":base64.b64encode(aad).decode(),
              "cipher":"AES-256-GCM",
              "key_wrap":"RSA-OAEP-256",
              "private_plaintext_published":False
          },sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY
          rm -f "$RUNNER_TEMP/mmibkr-parity-public.pem"

      - name: Upload encrypted current-source parity handoff
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-parity-encrypted-48c4119bed5cc572e1078386070cb2263032f3d8
          path: ${{ runner.temp }}/mmibkr-parity-export/
          retention-days: 1
          if-no-files-found: error

      - name: Execute allowlisted exact-private research tests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mmibkr_private_test_probe_v1.py \
            --source-root "$MMIBKR_PRIVATE_TEST_SOURCE_ROOT" \
            --source-materialization "$RUNNER_TEMP/mmibkr-private-test-probe-source.json" \
            --source-ref "$MMIBKR_PRIVATE_TEST_SOURCE_REF" \
            --test-modules "$MMIBKR_PRIVATE_TEST_MODULES" \
            --image-tag "mmibkr-private-test-probe:${GITHUB_RUN_ID}" \
            | tee "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log"
          grep '^MMIBKR_PRIVATE_TEST_PROBE_RECEIPT=' "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log" \
            > "$RUNNER_TEMP/mmibkr-private-test-probe-sanitized-receipt.txt"
          grep '^MMIBKR_PRIVATE_TEST_PROBE_RECEIPT_SHA256=' "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log" \
            >> "$RUNNER_TEMP/mmibkr-private-test-probe-sanitized-receipt.txt"

      - name: Upload sanitized private test receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-private-test-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-private-test-probe-sanitized-receipt.txt
          retention-days: 7

      - name: Destroy one-run private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "mmibkr-private-test-probe:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          sudo rm -rf \
            "$RUNNER_TEMP/mmibkr-private-test-probe-source" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-source.json" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-source.tar.gz" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-receipt.log" \
            "$RUNNER_TEMP/mmibkr-private-test-probe-sanitized-receipt.txt"
          echo 'MMIBKR_PRIVATE_TEST_PROBE_PRIVATE_MATERIAL_DESTROYED=1'
