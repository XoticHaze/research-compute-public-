name: MMIBKR Private UI Build Probe R1

on:
  push:
    branches:
      - main
    paths:
      - 'rendezvous/fire/mmibkr-private-ui-build-probe-r1'
  pull_request:
    paths:
      - '.github/workflows/mmibkr-private-ui-build-probe-r1.yml'
      - 'scripts/mmibkr_private_ui_build_probe_v1.py'
      - 'scripts/mmibkr_source_vault_consumer_v1.py'
      - 'tests/test_mmibkr_private_ui_build_probe_v1.py'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact private MM-IBKR commit SHA
        required: true
        type: string
      acceptance_file:
        description: Allowlisted private UI acceptance file
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Validate public UI probe implementation
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python -m pip install --disable-pip-version-check cryptography pytest
          python -m py_compile scripts/mmibkr_source_vault_consumer_v1.py
          python -m py_compile scripts/mmibkr_private_ui_build_probe_v1.py
          python -m pytest -q             tests/test_mmibkr_source_vault_consumer_v1.py             tests/test_mmibkr_private_ui_build_probe_v1.py

      - name: Resolve exact private UI build request
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_ACCEPTANCE_FILE: ${{ inputs.acceptance_file }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              source_ref = os.environ.get("DISPATCH_SOURCE_REF", "").strip()
              acceptance = os.environ.get("DISPATCH_ACCEPTANCE_FILE", "").strip()
          elif event == "push":
              node = json.loads(Path("rendezvous/fire/mmibkr-private-ui-build-probe-r1").read_text(encoding="utf-8"))
              if node.get("schema") != "mmibkr.private_ui_build_probe_fire.v1":
                  raise SystemExit("private UI build fire schema rejected")
              source_ref = str(node.get("source_ref") or "").strip()
              acceptance = str(node.get("acceptance_file") or "").strip()
          else:
              raise SystemExit("unsupported private UI build event")
          if not re.fullmatch(r"[0-9a-f]{40}", source_ref):
              raise SystemExit("private UI build requires exact source SHA")
          if not acceptance:
              raise SystemExit("private UI build requires acceptance file")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as fh:
              fh.write("MMIBKR_PRIVATE_UI_SOURCE_REF=" + source_ref + "\n")
              fh.write("MMIBKR_PRIVATE_UI_ACCEPTANCE=" + acceptance + "\n")
          print("MMIBKR_PRIVATE_UI_BUILD_REQUEST=PASS")
          PY

      - name: Materialize exact private MM source from encrypted Source Vault
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/mmibkr_source_vault_consumer_v1.py             --authority-base "$FLEET_AUTHORITY_BASE"             --run-id "$GITHUB_RUN_ID"             --source-sha "$MMIBKR_PRIVATE_UI_SOURCE_REF"             --destination "$RUNNER_TEMP/mmibkr-private-ui-source"             --archive-output "$RUNNER_TEMP/mmibkr-private-ui-source.tar.gz"             --output "$RUNNER_TEMP/mmibkr-private-ui-source.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          node=json.loads(Path(os.environ["RUNNER_TEMP"],"mmibkr-private-ui-source.json").read_text())
          if node.get("ok") is not True:
              raise SystemExit("private UI source materialization failed")
          with Path(os.environ["GITHUB_ENV"]).open("a",encoding="utf-8") as fh:
              fh.write("MMIBKR_PRIVATE_UI_SOURCE_ROOT="+str(node["source_root"])+"\n")
          print("MMIBKR_PRIVATE_UI_SOURCE_SHA="+str(node["source_sha"]))
          print("MMIBKR_PRIVATE_UI_SOURCE_ARCHIVE_SHA256="+str(node["source_archive_sha256"]))
          print("MMIBKR_PRIVATE_UI_SOURCE_TOKEN_USED=0")
          print("MMIBKR_PRIVATE_UI_BROKER_CREDENTIALS_USED=0")
          PY

      - name: Build exact private UI and execute acceptance
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mmibkr_private_ui_build_probe_v1.py             --source-root "$MMIBKR_PRIVATE_UI_SOURCE_ROOT"             --source-materialization "$RUNNER_TEMP/mmibkr-private-ui-source.json"             --source-ref "$MMIBKR_PRIVATE_UI_SOURCE_REF"             --acceptance-file "$MMIBKR_PRIVATE_UI_ACCEPTANCE"             | tee "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log"
          grep '^MMIBKR_PRIVATE_UI_BUILD_RECEIPT=' "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log"             > "$RUNNER_TEMP/mmibkr-private-ui-build-sanitized-receipt.txt"
          grep '^MMIBKR_PRIVATE_UI_BUILD_RECEIPT_SHA256=' "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log"             >> "$RUNNER_TEMP/mmibkr-private-ui-build-sanitized-receipt.txt"

      - name: Upload sanitized UI build receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-private-ui-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-private-ui-build-sanitized-receipt.txt
          retention-days: 7

      - name: Destroy one-run private UI material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf             "$RUNNER_TEMP/mmibkr-private-ui-source"             "$RUNNER_TEMP/mmibkr-private-ui-source.json"             "$RUNNER_TEMP/mmibkr-private-ui-source.tar.gz"             "$RUNNER_TEMP/mmibkr-private-ui-build-receipt.log"             "$RUNNER_TEMP/mmibkr-private-ui-build-sanitized-receipt.txt"
          echo 'MMIBKR_PRIVATE_UI_PRIVATE_MATERIAL_DESTROYED=1'
