name: IBKR Warm Read Gateway Patch Apply

on:
  push:
    branches:
      - assistant/ibkr-warm-read-gateway-20260917
    paths:
      - '.github/workflows/ibkr-warm-read-gateway-patch-apply.yml'
      - 'scripts/patch_ibkr_warm_read_gateway_v1.py'
      - 'scripts/ibkr_warm_read_return_v1.py'
      - 'tests/test_ibkr_warm_read_return_v1.py'

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assistant/ibkr-warm-read-gateway-20260917

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Apply deterministic workflow wiring
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch_ibkr_warm_read_gateway_v1.py scripts/ibkr_warm_read_return_v1.py tests/test_ibkr_warm_read_return_v1.py
          python - <<'PY'
          from pathlib import Path
          from scripts import patch_ibkr_warm_read_gateway_v1 as patch
          import textwrap

          workflow = patch.WORKFLOW.read_text(encoding='utf-8')
          patch.WORKFLOW.write_text(patch.patch_workflow(workflow), encoding='utf-8')

          path = patch.WORKFLOW_TEST
          text = path.read_text(encoding='utf-8')
          marker = "\nif __name__ == '__main__':"
          at = text.rfind(marker)
          if at < 0:
              raise SystemExit('workflow test final marker not found')
          addition = r'''

              def test_optional_warm_read_return_is_readonly_run_bound_and_encrypted(self):
                  self.assertIn('read_return_recipient_b64:', self.text)
                  self.assertIn('read_return_recipient_key_id:', self.text)
                  self.assertIn('symbols:', self.text)
                  self.assertIn("inputs.mode == 'readonly'", self.text)
                  self.assertIn('IBKR_WARM_READ_RETURN_REQUEST_VALID=1', self.text)
                  self.assertIn('python scripts/ibkr_warm_read_return_v1.py', self.text)
                  self.assertIn('--run-id "$GITHUB_RUN_ID"', self.text)
                  self.assertIn('--public-head "$GITHUB_SHA"', self.text)
                  self.assertIn('rendezvous/returns/{run_id}/', self.text)
                  self.assertIn('IBKR_WARM_READ_RETURN_PLAINTEXT_PUBLISHED=0', self.text)
                  self.assertIn('"$RUNNER_TEMP/ibkr-warm-read-return"', self.text)
                  post_auth = self.text.index('name: Materialize canonical post-auth broker and forward-data handoff')
                  encrypt = self.text.index('name: Encrypt optional detailed warm read snapshot for private consumer')
                  publish = self.text.index('name: Publish encrypted warm read return')
                  proof = self.text.index('name: Execute one encrypted MM-authorized selected-runtime paper proof')
                  stop = self.text.index('name: Gracefully stop authenticated Gateway before warm-state snapshot')
                  self.assertLess(post_auth, encrypt)
                  self.assertLess(encrypt, publish)
                  self.assertLess(publish, proof)
                  self.assertLess(proof, stop)

              def test_warm_read_return_does_not_enable_writable_gateway(self):
                  needle = "IBKR_WARM_READ_RETURN_REQUESTED: $" + "{{ github.event_name == 'workflow_dispatch' && inputs.mode == 'readonly'"
                  self.assertIn(needle, self.text)
                  writable = self.text.index('if [ "$IBKR_PAPER_PROOF_MODE" = "1" ]; then')
                  writable_tail = self.text[writable:writable + 160]
                  self.assertIn('api_read_only=no', writable_tail)
                  self.assertNotIn('IBKR_WARM_READ_RETURN_REQUESTED', writable_tail)
          '''
          addition = textwrap.dedent(addition)
          path.write_text(text[:at] + addition + text[at:], encoding='utf-8')
          print('IBKR_WARM_READ_GATEWAY_WORKFLOW_PATCHED=1')
          PY

      - name: Validate final workflow and warm read crypto contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'cryptography==46.0.1' \
            'ib_insync==0.9.86' \
            'pandas==2.2.3' \
            'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml')
          node=yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(node, dict) or 'jobs' not in node:
              raise SystemExit('patched warm workflow YAML invalid')
          print('IBKR_WARM_READ_WORKFLOW_YAML_VALID=1')
          PY
          python -m py_compile \
            scripts/ibkr_warm_read_return_v1.py \
            tests/test_ibkr_warm_read_return_v1.py \
            tests/test_ibkr_b1_warm_state_workflow_v2.py
          python -m unittest \
            tests.test_ibkr_warm_read_return_v1 \
            tests.test_ibkr_b1_warm_state_workflow_v2 -v
          echo 'IBKR_BROKER_LOGIN_ATTEMPTED=0'
          echo 'IBKR_BROKER_ORDER_ATTEMPTED=0'
          echo 'IBKR_WARM_READ_GATEWAY_PATCH_VALID=1'

      - name: Commit accepted wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ibkr-cloudflare-readonly-b1-r1.yml tests/test_ibkr_b1_warm_state_workflow_v2.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'warm read gateway patch produced no changes'; exit 3; }
          git commit -m 'feat: wire encrypted warm read gateway return'
          git push origin HEAD:assistant/ibkr-warm-read-gateway-20260917
