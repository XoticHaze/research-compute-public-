name: Forward P249 P266 Shadow R1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forward-p249-p266-shadow-r1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/forward_p249_p266_shadow_r1.py'
      - 'research/current/forward_p249_p266_shadow_r1.json'
      - '.github/workflows/forward-p249-p266-shadow-r1.yml'
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      tag: ${{ steps.observer.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: observer
        run: |
          python research/forward_p249_p266_shadow_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/forward_p249_p266_shadow_r1.json'))
          assert x['workload_id']=='FORWARD_P249_P266_SHADOW_R1'
          assert x['parent']=='P249/P266/P278'
          c=x['forward']['p249_core_net']['cumulative_return']; s=x['forward']['p249_plus_p266_net']['cumulative_return']; d=x['forward']['satellite_increment_cumulative']; n=x['forward']['p249_core_net']['days']
          bp=lambda v:int(round(v*10000))
          tag=f"{x['status']}__days_{n}__core_{bp(c)}__sat_{bp(s)}__inc_{bp(d)}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forward-p249-p266-shadow__${{ steps.observer.outputs.tag }}
          path: artifacts/forward_p249_p266_shadow_r1.json
          if-no-files-found: error
  publish-current:
    if: github.event_name != 'pull_request'
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: forward-p249-p266-shadow__${{ needs.observe.outputs.tag }}
          path: /tmp/forward-p249-p266-shadow
      - name: Publish stable current snapshot
        run: |
          test -f /tmp/forward-p249-p266-shadow/forward_p249_p266_shadow_r1.json
          git fetch origin main
          git checkout -B forward-current-publish origin/main
          mkdir -p research/current
          cp /tmp/forward-p249-p266-shadow/forward_p249_p266_shadow_r1.json research/current/forward_p249_p266_shadow_r1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/current/forward_p249_p266_shadow_r1.json
          if git diff --cached --quiet; then
            echo 'CURRENT_SNAPSHOT_UNCHANGED=true'
            exit 0
          fi
          git commit -m 'Forward: publish current P249/P266 shadow snapshot'
          git push origin HEAD:main
          echo 'CURRENT_SNAPSHOT_PUBLISHED=true'
