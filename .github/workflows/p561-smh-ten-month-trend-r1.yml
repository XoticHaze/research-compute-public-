name: P561 SMH Ten Month Trend R1
on:
  push:
    branches: [research/p561-smh-ten-month-trend-r1]
    paths: [research/p561_smh_ten_month_trend_r1.py,.github/workflows/p561-smh-ten-month-trend-r1.yml]
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p561_smh_ten_month_trend_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p561_smh_ten_month_trend_r1.json'));bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__matched_{bp(x['overall']['matched_excess_cagr'])}__spy_{bp(x['overall']['spy_excess_cagr'])}__folds_{x['positive_fold_count_vs_matched']}_{x['positive_fold_count_vs_spy']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'tag={tag}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p561-smh-ten-month-trend__${{ steps.eval.outputs.tag }}
          path: artifacts/p561_smh_ten_month_trend_r1.json
          if-no-files-found: error
