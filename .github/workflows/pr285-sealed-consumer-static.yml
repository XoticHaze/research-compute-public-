name: PR285 Sealed Consumer Static Proof

on:
  pull_request:
    paths:
      - 'scripts/validate_sealed_job_v1.py'
      - '.github/workflows/pr285-sealed-private.yml'
      - '.github/workflows/pr285-sealed-consumer-static.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Compile consumer
        run: python -m py_compile scripts/validate_sealed_job_v1.py
      - name: Prove fixed harness and envelope rejection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          printf 'ciphertext-fixture' > payload.age
          sha="$(sha256sum payload.age | awk '{print $1}')"
          python - "$sha" "$GITHUB_WORKSPACE" <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          sha,repo=sys.argv[1:]
          spec=importlib.util.spec_from_file_location('sealed',Path(repo)/'scripts/validate_sealed_job_v1.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert 'research_foundry_pr285_stage1_v1' in m.ALLOWED_HARNESS
          assert 'command' in m.FORBIDDEN and 'plaintext' in m.FORBIDDEN
          obj={'schema_version':'sealed-job-v1','job_id':'proof','mode':'sealed','authority':'research_only','harness':'research_foundry_pr285_stage1_v1','ciphertext':{'path':'payload.age','sha256':sha},'encryption':{'algorithm':'age-x25519','recipient_key_id':'sha256:'+'1'*64}}
          Path('sealed-job.json').write_text(json.dumps(obj))
          ok=m.validate_manifest(Path('sealed-job.json'))
          assert ok['harness']=='research_foundry_pr285_stage1_v1'
          bad=dict(obj); bad['command']='echo nope'; Path('bad.json').write_text(json.dumps(bad))
          try: m.validate_manifest(Path('bad.json'))
          except RuntimeError: pass
          else: raise AssertionError('arbitrary command was not rejected')
          bad=dict(obj); bad['authority']='runtime_trading'; Path('bad2.json').write_text(json.dumps(bad))
          try: m.validate_manifest(Path('bad2.json'))
          except RuntimeError: pass
          else: raise AssertionError('authority escalation was not rejected')
          print('PR285_SEALED_STATIC=PASS')
          PY
