name: P04 H24 DCA Harness Check
on:
  pull_request:
    paths:
      - 'scripts/p04_h24_dca_consumer_v1.py'
      - '.github/workflows/p04-h24-dca-harness-check.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check cryptography pandas numpy
      - run: python -m py_compile scripts/p04_h24_dca_consumer_v1.py scripts/ephemeral_x25519_chunked_v1.py
      - run: python scripts/p04_h24_dca_consumer_v1.py --help
