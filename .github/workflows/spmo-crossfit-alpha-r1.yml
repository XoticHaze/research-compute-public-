name: SPMO Crossfit Alpha R1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/spmo_crossfit_alpha_r1.py'
      - '.github/workflows/spmo-crossfit-alpha-r1.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Evaluate frozen SPMO crossfit discriminator
        run: python research/spmo_crossfit_alpha_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spmo-crossfit-alpha-r1-result
          path: spmo-crossfit-alpha-r1-result.json
          retention-days: 14
          if-no-files-found: warn
