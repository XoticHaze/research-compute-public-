name: MM-IBKR Cloudflare Live Owner Canary R1

# Cloud-only, broker-FREE first rollout. No account, Gateway, or orders.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rendezvous/fire/mmibkr-cloudflare-live-canary-r1

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmibkr-cloudflare-live-canary-r1
  cancel-in-progress: false

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  PRIVATE_SOURCE_SHA: 9a190fe66665c8f673d227a41c4544889a2cf2cb
  CLOUDFLARE_CANARY_URL: https://mmibkr-live-cloud-owner.slenderiq.workers.dev

jobs:
  deploy_canary_only:
    # USER FREE-ONLY HOLD: paid Containers entitlement and an enforceable
    # zero-overage budget have not been independently authenticated.
    # This optional Cloudflare deploy is not an incumbent live P0 dependency.
    # An existing fire file or workflow_dispatch is not user billing approval.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_LIVE_CANARY_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_LIVE_CANARY_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install existing Source Vault decryption dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Require exact auditable canary fire identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("rendezvous/fire/mmibkr-cloudflare-live-canary-r1")
          if not p.is_file():
              raise SystemExit("explicit_canary_fire_missing")
          n=json.loads(p.read_text(encoding="utf-8"))
          if n.get("source_sha") != os.environ["PRIVATE_SOURCE_SHA"]:
              raise SystemExit("source_sha_must_match_pinned_approved_source")
          if n.get("schema") != "mmibkr.cloudflare_live_canary_fire.v1":
              raise SystemExit("canary_fire_schema_required")
          if n.get("no_broker") is not True or n.get("no_orders") is not True:
              raise SystemExit("broker_or_order_mode_refused")
          print("MMIBKR_CLOUD_CANARY_EXACT_SOURCE_REQUEST=PASS")
          PY

      - name: Materialize immutable private MM source through existing encrypted Fleet vault
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-cloud-canary"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$PRIVATE_SOURCE_SHA" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-cloud-canary/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-cloud-canary/source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-cloud-canary/materialization.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          node=json.loads((Path(os.environ["RUNNER_TEMP"])/"mmibkr-cloud-canary/materialization.json").read_text())
          assert node["ok"] is True and node["source_sha"] == os.environ["PRIVATE_SOURCE_SHA"]
          assert node["vault_attestation_verified"] is True
          assert node["plaintext_emitted"] is False
          assert node["broker_credentials_used"] is False
          root=Path(node["source_root"])
          project=root/"cloudflare/mmibkr-live-cloud-owner"
          config=json.loads((project/"wrangler.jsonc").read_text())
          assert config["name"] == "mmibkr-live-cloud-owner"
          assert config["vars"]["CANARY_START_ENABLED"] == "0"
          assert config["vars"]["LIVE_ORDER_EXECUTION_ENABLED"] == "0"
          assert config["containers"][0]["scheduling_policy"] == "durable_object"
          dockerfile=(project/"container/Dockerfile").read_text()
          assert "sleep" in dockerfile
          assert "ibg-controller" not in dockerfile
          assert not (project/"container/.env").exists()
          with (Path(os.environ["GITHUB_ENV"])).open("a") as fd:
              fd.write("CANARY_PROJECT="+str(project)+"\n")
          print("MMIBKR_CLOUD_CANARY_PRIVATE_SOURCE_ATTESTED=PASS")
          PY

      - name: Validate no-broker private canary and Wrangler bundling
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANARY_PROJECT"
          node --test test/*.test.mjs
          npm install --no-audit --no-fund --package-lock=false
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/mmibkr-canary-bundle" >/dev/null
          echo 'MMIBKR_CLOUD_CANARY_WRANGLER_DRYRUN=PASS'

      # User-owned FREE-only policy: a scoped token and an unarmed Worker
      # do not establish Containers entitlement or a zero-overage ceiling.
      # Keep the existing brokerless source/dry-run checks above executable,
      # but stop before any token-backed managed Container deployment.
      - name: Enforce free-only Containers deployment hold
        shell: bash
        run: |
          set -euo pipefail
          echo 'MMIBKR_CLOUDFLARE_CONTAINERS_FREE_ONLY_HOLD=1'
          echo 'Managed Containers deployment requires separate verified entitlement and explicit user authorization.'
          exit 64

      - name: Require currently scoped Cloudflare deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_LIVE_CANARY_DEPLOY_TOKEN" || { echo 'CLOUDFLARE_CANARY_DEDICATED_TOKEN_NOT_BOUND=1'; exit 61; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_CANARY_ACCOUNT_NOT_BOUND=1'; exit 62; }
          echo 'MMIBKR_CLOUDFLARE_DEDICATED_CANARY_TOKEN_PRESENT=1'

      - name: Deploy explicitly unarmed Cloudflare managed Container application
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_LIVE_CANARY_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANARY_PROJECT"
          npx wrangler deploy
          echo 'MMIBKR_CLOUDFLARE_CANARY_DEPLOY_COMMAND=PASS'

      - name: Verify published Worker is still unarmed and broker-free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          url=os.environ["CLOUDFLARE_CANARY_URL"]+"/healthz"
          for attempt in range(12):
              try:
                  with urlopen(Request(url,headers={"Accept":"application/json"}),timeout=12) as r:
                      j=json.load(r)
                  assert j["schema"]=="mmibkr.cloud_live_owner_substrate.v1"
                  assert j["actual_ibkr_login_proven"] is False
                  assert j["broker_gateway_started"] is False
                  assert j["live_execution_enabled"] is False
                  assert j["live_order_dispatches"] == 0
                  assert j["container_running"] is False
                  print("MMIBKR_CLOUDFLARE_CANARY_DEPLOYED_UNARMED=PASS")
                  break
              except Exception:
                  if attempt==11: raise SystemExit("cloud_canary_status_proof_not_established")
                  time.sleep(5)
          PY

      - name: Destroy one-run private source and any derived bundle
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mmibkr-cloud-canary" "$RUNNER_TEMP/mmibkr-canary-bundle"
          echo 'MMIBKR_CLOUDFLARE_CANARY_PRIVATE_MATERIAL_DESTROYED=1'
