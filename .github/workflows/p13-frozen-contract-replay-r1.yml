name: P13 Frozen Contract Replay R1
on:
  pull_request:
    paths: ['scripts/p13_frozen_contract_replay_r1.py','.github/workflows/p13-frozen-contract-replay-r1.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python scripts/p13_frozen_contract_replay_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_frozen_contract_replay_r1.json')); r=x['2022_forward']; vals={'panel':x['panel_sha256'][:12],'fingerprint':x['selection_return_fingerprint_sha256'][:12],'recent':f"{100*r['candidate_cagr']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-frozen-contract__panel_${{ steps.evaluate.outputs.panel }}__fp_${{ steps.evaluate.outputs.fingerprint }}__recent_${{ steps.evaluate.outputs.recent }}pct
          path: |
            artifacts/p13_adjusted_close_frozen.csv
            artifacts/p13_frozen_contract_replay_r1.json
          if-no-files-found: error
