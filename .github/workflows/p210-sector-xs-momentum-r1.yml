name: P210 Sector XS Momentum R1
on:
  pull_request:
    paths:
      - 'research/p210_sector_xs_momentum_r1.py'
      - '.github/workflows/p210-sector-xs-momentum-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p210_sector_xs_momentum_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p210_sector_xs_momentum_r1.json')); t=x['tests']; bp=lambda v:int(round(v*10000)); a=t['2010']; tag=f"{x['decision']}__eq10_{bp(a['strategy_minus_equalweight'])}__spy10_{bp(a['strategy_minus_spy'])}__fe_{a['positive_equalweight_folds']}__fs_{a['positive_spy_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p210-sector-xs-momentum__${{ steps.eval.outputs.tag }}
          path: artifacts/p210_sector_xs_momentum_r1.json
          if-no-files-found: error
