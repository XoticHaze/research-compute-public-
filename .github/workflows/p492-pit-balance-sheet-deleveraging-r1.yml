name: P492 PIT Balance Sheet Deleveraging R1
on:
  pull_request:
    paths:
      - 'research/p492_pit_balance_sheet_deleveraging_r1.py'
      - '.github/workflows/p492-pit-balance-sheet-deleveraging-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy requests lxml
      - id: evaluate
        run: |
          python research/p492_pit_balance_sheet_deleveraging_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p492_pit_balance_sheet_deleveraging_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p492-pit-deleveraging__${{ steps.evaluate.outputs.decision }}
          path: research/artifacts/p492_pit_balance_sheet_deleveraging_r1.json
          if-no-files-found: error
