name: P46 TLT Total Return Identity R1
on:
  pull_request:
    paths:
      - 'research/p46_tlt_totalreturn_identity_r1.py'
      - '.github/workflows/p46-tlt-totalreturn-identity-r1.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check lxml==5.3.0
      - run: python research/p46_tlt_totalreturn_identity_r1.py
      - name: Persist result on execution branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/p46_tlt_totalreturn_identity_r1.json
          git commit -m 'research: persist P46 TLT total-return identity result'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
