name: P273 Industry Capital Role Cost Stress R1
on:
  pull_request:
    branches: [assistant/market-research-p272-industry-momentum-capital-role-r1]
    paths:
      - 'research/p273_industry_capital_role_cost_stress_r1.py'
      - '.github/workflows/p273-industry-capital-role-cost-stress-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          cd research && python p273_industry_capital_role_cost_stress_r1.py && cd ..
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p273_industry_capital_role_cost_stress_r1.json')); a=x['tests']['2020']; bp=lambda v:int(round(v*10000)); d=a['industry_addition_impact']; tag=f"{x['decision']}__matched_{bp(a['matched_excess_cagr'])}__folds_{a['positive_matched_folds']}__add_{bp(d['cagr_delta'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p273-industry-capital-role-cost-stress__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p273_industry_capital_role_cost_stress_r1.json
          if-no-files-found: error
