name: MM-IBKR Selected Runtime Cloud R1

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact approved private MM-IBKR source SHA to materialize from the reusable encrypted Fleet vault
        required: true
        default: cb28771e5fd3aa610d8fcf2ef683596a1cfabd51
        type: string
      session_seconds:
        description: Bounded daemon session length
        required: true
        default: '18000'
        type: string
      max_cycles:
        description: Optional cycle cap; 0 means session-time bound only
        required: true
        default: '0'
        type: string
      self_handoff:
        description: Dispatch a queued successor after a successful session
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - rendezvous/fire/mmibkr-selected-runtime-cloud-r1
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mmibkr-selected-runtime-cloud-r1.yml
      - scripts/mmibkr_source_vault_consumer_v1.py
      - tests/test_mmibkr_source_vault_consumer_v1.py

permissions:
  contents: write
  actions: write
  id-token: write

env:
  CHECKPOINT_CACHE_PREFIX: mmibkr-selected-runtime-cloud-checkpoint-v1-
  EXCHANGE_REF: rendezvous-exchange
  RECEIPT_ROOT: rendezvous/receipts
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Validate reusable encrypted source-vault consumer
        run: |
          set -euo pipefail
          python -m py_compile scripts/mmibkr_source_vault_consumer_v1.py tests/test_mmibkr_source_vault_consumer_v1.py
          python -m unittest -v tests.test_mmibkr_source_vault_consumer_v1

  runtime:
    if: ${{ github.event_name != 'pull_request' }}
    needs: contract
    environment: ibkr-paper-runtime-r1
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    concurrency:
      group: mmibkr-selected-runtime-cloud-r1
      cancel-in-progress: false
    env:
      IBKR_REMOTE_EXCHANGE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Resolve bounded session request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          event = os.environ['GITHUB_EVENT_NAME']
          if event == 'push':
              fire = Path('rendezvous/fire/mmibkr-selected-runtime-cloud-r1')
              if not fire.is_file():
                  raise SystemExit('push fire request missing')
              payload = json.loads(fire.read_text())
          else:
              event_json = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              payload = dict(event_json.get('inputs') or {})

          source_ref = str(
              payload.get('source_ref')
              or 'cb28771e5fd3aa610d8fcf2ef683596a1cfabd51'
          ).strip().lower()
          if len(source_ref) != 40 or any(ch not in '0123456789abcdef' for ch in source_ref):
              raise SystemExit('source_ref must be an exact approved 40-hex private source SHA')
          session_seconds = int(payload.get('session_seconds') or 18000)
          max_cycles = int(payload.get('max_cycles') or 0)
          raw_handoff = payload.get('self_handoff', True)
          self_handoff = (
              raw_handoff
              if isinstance(raw_handoff, bool)
              else str(raw_handoff).strip().lower() in {'1', 'true', 'yes', 'on'}
          )
          if session_seconds < 900 or session_seconds > 18000:
              raise SystemExit('session_seconds must be 900..18000')
          if max_cycles < 0 or max_cycles > 1000:
              raise SystemExit('max_cycles must be 0..1000')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write(f'REQUEST_SOURCE_REF={source_ref}\n')
              fh.write(f'SESSION_SECONDS={session_seconds}\n')
              fh.write(f'MAX_CYCLES={max_cycles}\n')
              fh.write(f'SELF_HANDOFF={str(self_handoff).lower()}\n')
          print(json.dumps({
              'source_ref': source_ref,
              'session_seconds': session_seconds,
              'max_cycles': max_cycles,
              'self_handoff': self_handoff,
          }, sort_keys=True))
          PY

      - name: Materialize exact private MM-IBKR source from reusable encrypted Fleet vault
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$REQUEST_SOURCE_REF" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source'
          node = json.loads((root / 'materialization-host.json').read_text())
          if node.get('ok') is not True:
              raise SystemExit('source materialization not ok')
          if node.get('source_transport') != 'fleet_authority_exact_sha_encrypted_snapshot_vault':
              raise SystemExit('reusable encrypted source-vault transport required')
          if node.get('private_repository_token_used') is not False:
              raise SystemExit('private repository token unexpectedly used')
          if node.get('broker_credentials_used') is not False:
              raise SystemExit('broker credentials unexpectedly used')
          if node.get('plaintext_emitted') is not False:
              raise SystemExit('plaintext source emission contract violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution authority unexpectedly enabled')

          archive = root / 'mm-ibkr-source.tar.gz'
          source_root = Path(node['source_root'])
          if not archive.is_file() or not (source_root / 'Dockerfile.bot').is_file():
              raise SystemExit('materialized source layout incomplete')

          container_node = {
              'schema': 'mmibkr.attested_source_materialization.v2',
              'source_ref': node['source_ref'],
              'source_sha': node['source_sha'],
              'source_archive_sha256': node['source_archive_sha256'],
              'source_archive_bytes': node['source_archive_bytes'],
              'source_archive_path': '/private-source/mm-ibkr-source.tar.gz',
              'source_manifest_sha256': node['source_manifest_sha256'],
              'source_transport': node['source_transport'],
              'fleet_authority_base': os.environ['FLEET_AUTHORITY_BASE'],
              'caller_run_id': os.environ['GITHUB_RUN_ID'],
              'vault_attestation_verified': node['vault_attestation_verified'],
              'private_repository_token_used': False,
              'broker_credentials_used': False,
          }
          (root / 'source-materialization.json').write_text(
              json.dumps(container_node, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD=' + node['source_sha'] + '\n')
              fh.write('PRIVATE_SOURCE_ROOT=' + str(source_root) + '\n')
          print('MMIBKR_PRIVATE_HEAD=' + node['source_sha'])
          print('MMIBKR_SOURCE_ARCHIVE_SHA256=' + node['source_archive_sha256'])
          print('MMIBKR_SOURCE_MANIFEST_SHA256=' + node['source_manifest_sha256'])
          print('MMIBKR_SOURCE_TRANSPORT=' + node['source_transport'])
          PY

      - name: Build exact private MM-IBKR bot image
        run: |
          set -euo pipefail
          docker build             -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot"             --target bot             -t "mmibkr-cloud:${GITHUB_RUN_ID}"             "$PRIVATE_SOURCE_ROOT" >/dev/null

      - name: Validate private hostless/runtime contracts in exact image
        run: |
          set -euo pipefail
          docker run --rm "mmibkr-cloud:${GITHUB_RUN_ID}"             python -m unittest -v               tests.test_selected_runtime_execution_roll_v1               tests.test_selected_runtime_execution_expiry_guard_v1               tests.test_selected_runtime_futures_roll_maintenance_v1               tests.test_selected_runtime_signal_history_contract_v1               tests.test_runtime_market_data_cache_cursor_v1               tests.test_runtime_market_data_cache_checkpoint_v1               tests.test_selected_runtime_cloud_runner_dry_plan_v1               tests.test_selected_runtime_boundary_snapshot_hydrator_v1               tests.test_selected_runtime_cloud_natural_evaluator_v1               tests.test_selected_runtime_cloud_cycle_v1               tests.test_selected_runtime_cloud_daemon_v1               tests.test_ibkr_remote_selected_runtime_boundary_slot_v1               tests.test_ibkr_remote_selected_runtime_paper_execute_slot_v1               tests.test_mmibkr_cloud_source_producer_v1               tests.test_mmibkr_cloud_source_relay_v1               tests.test_ibkr_remote_warm_read_v1

      - name: Prepare checkpoint restore directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmibkr-checkpoint" "$RUNNER_TEMP/mmibkr-data"

      - name: Restore latest sanitized checkpoint cache
        id: restore-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}restore-${{ github.run_id }}
          restore-keys: |
            ${{ env.CHECKPOINT_CACHE_PREFIX }}

      - name: Restore canonical market-data and terminal-continuity state
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          if [ -s "$checkpoint" ]; then
            docker run --rm               -v "$RUNNER_TEMP/mmibkr-data:/app/data"               -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint:ro"               "mmibkr-cloud:${GITHUB_RUN_ID}"               python scripts/operator/runtime_market_data_cache_checkpoint_v1.py                 --repo-root /app                 --restore-archive /checkpoint/latest.tgz
            echo 'MMIBKR_CHECKPOINT_RESTORED=1'
          else
            echo 'MMIBKR_CHECKPOINT_RESTORED=0'
            echo 'No prior cache checkpoint; canonical self-healing bootstrap will be used.'
          fi

      - name: Run bounded selected-runtime cloud owner
        run: |
          set -euo pipefail
          docker run --rm             -e IBKR_REMOTE_EXCHANGE_TOKEN             -e ACTIONS_ID_TOKEN_REQUEST_URL             -e ACTIONS_ID_TOKEN_REQUEST_TOKEN             -e ENABLE_LIVE_TRADING=0             -v "$RUNNER_TEMP/mmibkr-data:/app/data"             -v "$RUNNER_TEMP/mmibkr-source:/private-source:ro"             "mmibkr-cloud:${GITHUB_RUN_ID}"             python scripts/operator/selected_runtime_cloud_daemon_v1.py               --repo-root /app               --data-root /app/data               --source-materialization /private-source/source-materialization.json               --session-seconds "$SESSION_SECONDS"               --max-cycles "$MAX_CYCLES"               --output /app/data/strategy_runtime/selected_runtime_cloud_daemon_v1/session.json

      - name: Build sanitized successor checkpoint
        if: ${{ always() }}
        id: checkpoint
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          docker run --rm             -v "$RUNNER_TEMP/mmibkr-data:/app/data"             -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint"             "mmibkr-cloud:${GITHUB_RUN_ID}"             python scripts/operator/runtime_market_data_cache_checkpoint_v1.py               --repo-root /app               --data-root /app/data               --archive-output /checkpoint/latest.tgz               > "$RUNNER_TEMP/checkpoint-build.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/checkpoint-build.log"
          if [ "$code" -eq 0 ] && [ -s "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            sha256sum "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
            echo 'Checkpoint unavailable; successor remains able to self-heal from broker history.'
          fi
          exit 0

      - name: Save sanitized successor checkpoint cache
        if: ${{ steps.checkpoint.outputs.ready == 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}

      - name: Publish sanitized cloud-session receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          session_path = Path(
              os.environ['RUNNER_TEMP'],
              'mmibkr-data',
              'strategy_runtime',
              'selected_runtime_cloud_daemon_v1',
              'session.json',
          )
          if session_path.is_file():
              node = json.loads(session_path.read_text())
              roll = (
                  node.get('futures_roll_maintenance')
                  if isinstance(node.get('futures_roll_maintenance'), dict)
                  else {}
              )
              receipt = {
                  'schema': 'mmibkr.selected_runtime_cloud_session_receipt.v1',
                  'ok': node.get('ok') is True,
                  'status': node.get('status'),
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'private_head': os.environ.get('PRIVATE_HEAD'),
                  'cycle_count': node.get('cycle_count'),
                  'success_count': node.get('success_count'),
                  'failure_count': node.get('failure_count'),
                  'checkpoint_handoff_ready': node.get('checkpoint_handoff_ready'),
                  'last_cycle': node.get('last_cycle'),
                  'futures_roll_maintenance': roll,
                  'source_transport': 'fleet_authority_exact_sha_encrypted_snapshot_vault',
                  'private_repository_token_used': False,
                  'live_execution_allowed': False,
                  'public_strategy_authority': False,
                  'public_execution_policy_authority': False,
                  'credentials_included': False,
                  'account_state_included': False,
                  'positions_included': False,
                  'orders_included': False,
              }
          else:
              receipt = {
                  'schema': 'mmibkr.selected_runtime_cloud_session_receipt.v1',
                  'ok': False,
                  'status': 'session_receipt_missing_after_runtime_failure',
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'private_head': os.environ.get('PRIVATE_HEAD'),
                  'source_transport': 'fleet_authority_exact_sha_encrypted_snapshot_vault',
                  'private_repository_token_used': False,
                  'live_execution_allowed': False,
                  'credentials_included': False,
                  'account_state_included': False,
                  'positions_included': False,
                  'orders_included': False,
              }
          out = Path(os.environ['RUNNER_TEMP'], 'mmibkr-cloud-session-receipt.json')
          out.write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY

          receipt_path="${RECEIPT_ROOT}/${GITHUB_RUN_ID}-mmibkr-selected-runtime-cloud.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/mmibkr-cloud-session-receipt.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json, sys
          content, branch = sys.argv[1:]
          print(json.dumps({
              'message': 'runtime: publish sanitized MM-IBKR cloud session receipt',
              'content': content,
              'branch': branch,
          }))
          PY
          )"
          curl -fsSL -X PUT             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${receipt_path}"             -d "$body" >/dev/null
          echo "MMIBKR_CLOUD_RECEIPT_PATH=${receipt_path}"

      - name: Queue successor bounded session
        if: ${{ success() && env.SELF_HANDOFF == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'source_ref': os.environ['REQUEST_SOURCE_REF'],
                  'session_seconds': os.environ['SESSION_SECONDS'],
                  'max_cycles': os.environ['MAX_CYCLES'],
                  'self_handoff': True,
              },
          }))
          PY
          )"
          curl -fsSL -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mmibkr-selected-runtime-cloud-r1.yml/dispatches"             -d "$body"
          echo 'MMIBKR_CLOUD_SUCCESSOR_QUEUED=1'

      - name: Destroy private runtime material
        if: ${{ always() }}
        run: |
          set +e
          docker image rm "mmibkr-cloud:${GITHUB_RUN_ID}" >/dev/null 2>&1
          rm -rf             "$RUNNER_TEMP/mmibkr-source"             "$RUNNER_TEMP/mmibkr-data"             "$RUNNER_TEMP/mmibkr-checkpoint"
