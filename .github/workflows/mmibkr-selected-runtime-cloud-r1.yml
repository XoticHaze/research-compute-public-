name: MM-IBKR Selected Runtime Cloud R1

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact approved private MM-IBKR source SHA to materialize from the reusable encrypted Fleet vault
        required: true
        default: d81df85788ebb6be6d4d69b9b9a537be96f16507
        type: string
      session_seconds:
        description: Bounded daemon session length
        required: true
        default: '18000'
        type: string
      max_cycles:
        description: Optional cycle cap; 0 means session-time bound only
        required: true
        default: '0'
        type: string
      expected_checkpoint_cache_key:
        description: Exact predecessor checkpoint cache key required for steady-state restore
        required: false
        default: ''
        type: string
      expected_checkpoint_sha256:
        description: Exact predecessor checkpoint SHA256 required with the cache key
        required: false
        default: ''
        type: string
      allow_unpinned_bootstrap:
        description: Explicitly permit a workflow-dispatch bootstrap without predecessor identity
        required: false
        default: false
        type: boolean
      require_terminal_continuity:
        description: Require sanitized terminal-boundary continuity in the exact predecessor before starting a successor paper owner
        required: false
        default: false
        type: boolean
      self_handoff:
        description: Dispatch a queued successor after a successful session
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - rendezvous/fire/mmibkr-selected-runtime-cloud-r1
      - rendezvous/fire/mmibkr-selected-runtime-cloud-checkpoint-acceptance-r1
      - rendezvous/fire/mmibkr-selected-runtime-cloud-successor-restore-acceptance-r1
      - rendezvous/fire/mmibkr-selected-runtime-cloud-signal-history-reconciliation-r1
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mmibkr-selected-runtime-cloud-r1.yml
      - scripts/mmibkr_source_vault_consumer_v1.py
      - tests/test_mmibkr_source_vault_consumer_v1.py
      - tests/test_mmibkr_source_vault_fetch_retry_v1.py
      - tests/test_mmibkr_cloud_checkpoint_cache_handoff_v1.py
      - tests/test_mmibkr_operator_console_publisher_v1.py
      - tests/test_mmibkr_cloud_session_receipt_v1.py
      - tests/test_mmibkr_cloud_session_acceptance_v1.py
      - tests/test_mmibkr_initial_backfill_ingest_workflow_v1.py
      - tests/test_mmibkr_initial_backfill_preowner_checkpoint_v1.py
      - tests/test_mmibkr_checkpoint_acceptance_job_v1.py
      - tests/test_mmibkr_successor_restore_acceptance_job_v1.py
      - tests/test_mmibkr_signal_history_metadata_reconcile_v1.py
      - tests/test_mmibkr_signal_history_reconciliation_job_v1.py
      - scripts/mmibkr_cloud_session_acceptance_v1.py
      - scripts/mmibkr_signal_history_metadata_reconcile_v1.py
      - scripts/mmibkr_operator_snapshot_publish_v1.py
      - tests/test_mmibkr_operator_snapshot_publish_helper_v1.py

permissions:
  contents: write
  actions: write
  id-token: write

env:
  CHECKPOINT_CACHE_PREFIX: mmibkr-selected-runtime-cloud-checkpoint-v1-
  EXCHANGE_REF: rendezvous-exchange
  RECEIPT_ROOT: rendezvous/receipts
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  OPERATOR_CONSOLE_URL: https://mmibkr-operator-console.slenderiq.workers.dev
  MAX_CONSECUTIVE_OWNER_FAILURES: '4'
  INITIAL_BACKFILL_RUN_ID: '35407829303'
  INITIAL_BACKFILL_ARTIFACT: ibkr-cloudflare-readonly-b1-35407829303

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Resolve workflow route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mode="pr"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$(python - <<'PY'
          import json, os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          inputs = event.get('inputs') if isinstance(event.get('inputs'), dict) else {}
          key = str(inputs.get('expected_checkpoint_cache_key') or '').strip()
          sha = str(inputs.get('expected_checkpoint_sha256') or '').strip().lower()
          raw_allow = inputs.get('allow_unpinned_bootstrap', False)
          allow = (
              raw_allow
              if isinstance(raw_allow, bool)
              else str(raw_allow).strip().lower() in {'1', 'true', 'yes', 'on'}
          )
          if bool(key) != bool(sha):
              print('invalid_dispatch')
          elif key and sha:
              print('owner')
          elif allow:
              print('owner')
          else:
              print('unpinned_dispatch_rejected')
          PY
          )"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)"
            if printf '%s\n' "$changed" | grep -Fxq 'rendezvous/fire/mmibkr-selected-runtime-cloud-signal-history-reconciliation-r1'; then
              mode="signal_history_reconciliation"
            elif printf '%s\n' "$changed" | grep -Fxq 'rendezvous/fire/mmibkr-selected-runtime-cloud-successor-restore-acceptance-r1'; then
              mode="successor_restore_acceptance"
            elif printf '%s\n' "$changed" | grep -Fxq 'rendezvous/fire/mmibkr-selected-runtime-cloud-checkpoint-acceptance-r1'; then
              mode="checkpoint_acceptance"
            else
              mode="owner"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_SELECTED_RUNTIME_CLOUD_ROUTE=$mode"

  reject_unpinned_dispatch:
    if: ${{ needs.route.outputs.mode == 'unpinned_dispatch_rejected' || needs.route.outputs.mode == 'invalid_dispatch' }}
    needs:
      - route
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unpinned or invalid workflow dispatch before owner concurrency
        run: |
          echo "MMIBKR_SELECTED_RUNTIME_DISPATCH_REJECTED=${{ needs.route.outputs.mode }}" >&2
          exit 1

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Validate reusable encrypted source-vault consumer
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/mmibkr_source_vault_consumer_v1.py \
            tests/test_mmibkr_source_vault_consumer_v1.py \
            tests/test_mmibkr_source_vault_fetch_retry_v1.py \
            tests/test_mmibkr_cloud_owner_reusable_vault_contract_v1.py \
            tests/test_mmibkr_cloud_checkpoint_cache_handoff_v1.py \
            tests/test_mmibkr_operator_console_publisher_v1.py \
            tests/test_mmibkr_cloud_session_receipt_v1.py \
            tests/test_mmibkr_cloud_session_acceptance_v1.py \
            tests/test_mmibkr_initial_backfill_ingest_workflow_v1.py \
            tests/test_mmibkr_initial_backfill_preowner_checkpoint_v1.py \
            tests/test_mmibkr_checkpoint_acceptance_job_v1.py \
            tests/test_mmibkr_successor_restore_acceptance_job_v1.py \
            tests/test_mmibkr_signal_history_metadata_reconcile_v1.py \
            tests/test_mmibkr_signal_history_reconciliation_job_v1.py \
            scripts/mmibkr_cloud_session_acceptance_v1.py \
            scripts/mmibkr_signal_history_metadata_reconcile_v1.py \
            scripts/mmibkr_operator_snapshot_publish_v1.py \
            tests/test_mmibkr_operator_snapshot_publish_helper_v1.py
          python -m unittest -v \
            tests.test_mmibkr_source_vault_consumer_v1 \
            tests.test_mmibkr_source_vault_fetch_retry_v1 \
            tests.test_mmibkr_cloud_owner_reusable_vault_contract_v1 \
            tests.test_mmibkr_cloud_checkpoint_cache_handoff_v1 \
            tests.test_mmibkr_operator_console_publisher_v1 \
            tests.test_mmibkr_cloud_session_receipt_v1 \
            tests.test_mmibkr_cloud_session_acceptance_v1 \
            tests.test_mmibkr_initial_backfill_ingest_workflow_v1 \
            tests.test_mmibkr_initial_backfill_preowner_checkpoint_v1 \
            tests.test_mmibkr_checkpoint_acceptance_job_v1 \
            tests.test_mmibkr_successor_restore_acceptance_job_v1 \
            tests.test_mmibkr_signal_history_metadata_reconcile_v1 \
            tests.test_mmibkr_signal_history_reconciliation_job_v1 \
            tests.test_mmibkr_operator_snapshot_publish_helper_v1

  runtime:
    if: ${{ github.event_name != 'pull_request' && needs.route.outputs.mode == 'owner' }}
    needs:
      - contract
      - route
    environment: ibkr-paper-runtime-r1
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    concurrency:
      group: mmibkr-selected-runtime-cloud-r1
      cancel-in-progress: false
    env:
      IBKR_REMOTE_EXCHANGE_TOKEN: ${{ github.token }}
      CANONICAL_SOURCE_REF: d81df85788ebb6be6d4d69b9b9a537be96f16507
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Resolve bounded session request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          event = os.environ['GITHUB_EVENT_NAME']
          if event == 'push':
              fire = Path('rendezvous/fire/mmibkr-selected-runtime-cloud-r1')
              if not fire.is_file():
                  raise SystemExit('push fire request missing')
              payload = json.loads(fire.read_text())
          else:
              event_json = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              payload = dict(event_json.get('inputs') or {})

          canonical_source_ref = os.environ['CANONICAL_SOURCE_REF'].strip().lower()
          requested_source_ref = str(
              payload.get('source_ref')
              or canonical_source_ref
          ).strip().lower()
          if len(requested_source_ref) != 40 or any(ch not in '0123456789abcdef' for ch in requested_source_ref):
              raise SystemExit('source_ref must be an exact approved 40-hex private source SHA')
          if len(canonical_source_ref) != 40 or any(ch not in '0123456789abcdef' for ch in canonical_source_ref):
              raise SystemExit('canonical source_ref must be an exact approved 40-hex private source SHA')
          source_ref = canonical_source_ref
          if requested_source_ref != canonical_source_ref:
              print('MMIBKR_CLOUD_SOURCE_REFRESHED_FROM=' + requested_source_ref)
              print('MMIBKR_CLOUD_SOURCE_REFRESHED_TO=' + canonical_source_ref)
          session_seconds = int(payload.get('session_seconds') or 18000)
          max_cycles = int(payload.get('max_cycles') or 0)
          raw_handoff = payload.get('self_handoff', True)
          self_handoff = (
              raw_handoff
              if isinstance(raw_handoff, bool)
              else str(raw_handoff).strip().lower() in {'1', 'true', 'yes', 'on'}
          )
          if session_seconds < 900 or session_seconds > 18000:
              raise SystemExit('session_seconds must be 900..18000')
          if max_cycles < 0 or max_cycles > 1000:
              raise SystemExit('max_cycles must be 0..1000')

          expected_checkpoint_key = str(
              payload.get('expected_checkpoint_cache_key') or ''
          ).strip()
          expected_checkpoint_sha256 = str(
              payload.get('expected_checkpoint_sha256') or ''
          ).strip().lower()
          raw_require_terminal = payload.get('require_terminal_continuity', False)
          require_terminal_continuity = (
              raw_require_terminal
              if isinstance(raw_require_terminal, bool)
              else str(raw_require_terminal).strip().lower() in {'1', 'true', 'yes', 'on'}
          )
          if bool(expected_checkpoint_key) != bool(expected_checkpoint_sha256):
              raise SystemExit(
                  'expected_checkpoint_cache_key and expected_checkpoint_sha256 must be supplied together'
              )
          if require_terminal_continuity and not expected_checkpoint_key:
              raise SystemExit(
                  'require_terminal_continuity requires an exact predecessor checkpoint identity'
              )
          if expected_checkpoint_key:
              prefix = str(os.environ['CHECKPOINT_CACHE_PREFIX'])
              if not expected_checkpoint_key.startswith(prefix):
                  raise SystemExit('expected predecessor checkpoint key must use canonical prefix')
              if any(ch in expected_checkpoint_key for ch in ('\n', '\r')):
                  raise SystemExit('expected predecessor checkpoint key contains newline')
              if (
                  len(expected_checkpoint_sha256) != 64
                  or any(ch not in '0123456789abcdef' for ch in expected_checkpoint_sha256)
              ):
                  raise SystemExit('expected predecessor checkpoint SHA256 must be 64 lowercase hex')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write(f'REQUEST_SOURCE_REF={source_ref}\n')
              fh.write(f'SESSION_SECONDS={session_seconds}\n')
              fh.write(f'MAX_CYCLES={max_cycles}\n')
              fh.write(f'SELF_HANDOFF={str(self_handoff).lower()}\n')
              fh.write(f'EXPECTED_PREDECESSOR_CHECKPOINT_KEY={expected_checkpoint_key}\n')
              fh.write(
                  f'EXPECTED_PREDECESSOR_CHECKPOINT_SHA256={expected_checkpoint_sha256}\n'
              )
              fh.write(
                  'REQUIRE_PREDECESSOR_TERMINAL_CONTINUITY='
                  + str(require_terminal_continuity).lower()
                  + '\n'
              )
          print(json.dumps({
              'source_ref': source_ref,
              'session_seconds': session_seconds,
              'max_cycles': max_cycles,
              'self_handoff': self_handoff,
              'expected_predecessor_checkpoint_key': expected_checkpoint_key or None,
              'expected_predecessor_checkpoint_sha256': (
                  expected_checkpoint_sha256 or None
              ),
              'require_predecessor_terminal_continuity': require_terminal_continuity,
          }, sort_keys=True))
          PY

      - name: Materialize exact private MM-IBKR source from reusable encrypted Fleet vault
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$REQUEST_SOURCE_REF" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source'
          node = json.loads((root / 'materialization-host.json').read_text())
          if node.get('ok') is not True:
              raise SystemExit('source materialization not ok')
          if node.get('source_transport') != 'fleet_authority_exact_sha_encrypted_snapshot_vault':
              raise SystemExit('reusable encrypted source-vault transport required')
          if node.get('private_repository_token_used') is not False:
              raise SystemExit('private repository token unexpectedly used')
          if node.get('broker_credentials_used') is not False:
              raise SystemExit('broker credentials unexpectedly used')
          if node.get('plaintext_emitted') is not False:
              raise SystemExit('plaintext source emission contract violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution authority unexpectedly enabled')

          archive = root / 'mm-ibkr-source.tar.gz'
          source_root = Path(node['source_root'])
          if not archive.is_file() or not (source_root / 'Dockerfile.bot').is_file():
              raise SystemExit('materialized source layout incomplete')

          container_node = {
              'schema': 'mmibkr.attested_source_materialization.v2',
              'source_ref': node['source_ref'],
              'source_sha': node['source_sha'],
              'source_archive_sha256': node['source_archive_sha256'],
              'source_archive_bytes': node['source_archive_bytes'],
              'source_archive_path': '/private-source/mm-ibkr-source.tar.gz',
              'source_manifest_sha256': node['source_manifest_sha256'],
              'source_transport': node['source_transport'],
              'fleet_authority_base': os.environ['FLEET_AUTHORITY_BASE'],
              'caller_run_id': os.environ['GITHUB_RUN_ID'],
              'vault_attestation_verified': node['vault_attestation_verified'],
              'private_repository_token_used': False,
              'broker_credentials_used': False,
          }
          (root / 'source-materialization.json').write_text(
              json.dumps(container_node, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD=' + node['source_sha'] + '\n')
              fh.write('PRIVATE_SOURCE_ROOT=' + str(source_root) + '\n')
          print('MMIBKR_PRIVATE_HEAD=' + node['source_sha'])
          print('MMIBKR_SOURCE_ARCHIVE_SHA256=' + node['source_archive_sha256'])
          print('MMIBKR_SOURCE_MANIFEST_SHA256=' + node['source_manifest_sha256'])
          print('MMIBKR_SOURCE_TRANSPORT=' + node['source_transport'])
          PY

      - name: Build exact private MM-IBKR bot image
        run: |
          set -euo pipefail
          docker build             -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot"             --target bot             -t "mmibkr-cloud:${GITHUB_RUN_ID}"             "$PRIVATE_SOURCE_ROOT" >/dev/null

      - name: Validate private hostless/runtime contracts in exact image
        run: |
          set -euo pipefail
          docker run --rm "mmibkr-cloud:${GITHUB_RUN_ID}"             python -m unittest -v               tests.test_selected_runtime_execution_roll_v1               tests.test_selected_runtime_execution_expiry_guard_v1               tests.test_selected_runtime_futures_roll_maintenance_v1               tests.test_selected_runtime_signal_history_contract_v1               tests.test_runtime_market_data_cache_cursor_v1               tests.test_runtime_market_data_cache_checkpoint_v1               tests.test_selected_runtime_cloud_runner_dry_plan_v1               tests.test_selected_runtime_boundary_snapshot_hydrator_v1               tests.test_selected_runtime_cloud_natural_evaluator_v1               tests.test_selected_runtime_cloud_cycle_v1               tests.test_selected_runtime_cloud_daemon_v1               tests.test_cloud_operator_snapshot_v1               tests.test_ibkr_remote_selected_runtime_boundary_slot_v1               tests.test_ibkr_remote_selected_runtime_paper_execute_slot_v1               tests.test_mmibkr_cloud_source_producer_v1               tests.test_mmibkr_cloud_source_relay_v1               tests.test_ibkr_remote_warm_read_v1

      - name: Prepare checkpoint restore directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmibkr-checkpoint" "$RUNNER_TEMP/mmibkr-data"

      - name: Restore exact expected predecessor checkpoint cache
        id: restore-expected-cache
        if: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_KEY != '' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_KEY }}
          fail-on-cache-miss: true

      - name: Restore latest sanitized checkpoint cache
        id: restore-cache
        if: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_KEY == '' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}restore-${{ github.run_id }}
          restore-keys: |
            ${{ env.CHECKPOINT_CACHE_PREFIX }}

      - name: Restore canonical market-data and terminal-continuity state
        id: restore_checkpoint
        env:
          RESTORED_CACHE_KEY: ${{ steps.restore-expected-cache.outputs.cache-matched-key || steps.restore-cache.outputs.cache-matched-key }}
          EXPECTED_CHECKPOINT_KEY: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_KEY }}
          EXPECTED_CHECKPOINT_SHA256: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_SHA256 }}
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          if [ -s "$checkpoint" ]; then
            restored_sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
            if [ -n "$EXPECTED_CHECKPOINT_KEY" ]; then
              test "$RESTORED_CACHE_KEY" = "$EXPECTED_CHECKPOINT_KEY"
              test "$restored_sha256" = "$EXPECTED_CHECKPOINT_SHA256"
              echo 'MMIBKR_EXPECTED_PREDECESSOR_CHECKPOINT_MATCH=1'
            fi
            echo 'restored=true' >> "$GITHUB_OUTPUT"
            echo "restored_sha256=$restored_sha256" >> "$GITHUB_OUTPUT"
            echo "restored_cache_key=$RESTORED_CACHE_KEY" >> "$GITHUB_OUTPUT"
            echo "expected_predecessor_match=$([ -z "$EXPECTED_CHECKPOINT_KEY" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
            docker run --rm               -v "$RUNNER_TEMP/mmibkr-data:/app/data"               -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint:ro"               "mmibkr-cloud:${GITHUB_RUN_ID}"               python scripts/operator/runtime_market_data_cache_checkpoint_v1.py                 --repo-root /app                 --restore-archive /checkpoint/latest.tgz
            echo "MMIBKR_CHECKPOINT_RESTORED_SHA256=$restored_sha256"
            echo "MMIBKR_CHECKPOINT_RESTORED_CACHE_KEY=$RESTORED_CACHE_KEY"
            echo 'MMIBKR_CHECKPOINT_RESTORED=1'
          else
            echo 'restored=false' >> "$GITHUB_OUTPUT"
            echo 'restored_sha256=' >> "$GITHUB_OUTPUT"
            echo 'restored_cache_key=' >> "$GITHUB_OUTPUT"
            echo 'expected_predecessor_match=false' >> "$GITHUB_OUTPUT"
            echo 'MMIBKR_CHECKPOINT_RESTORED=0'
            if [ -n "$EXPECTED_CHECKPOINT_KEY" ]; then
              echo 'expected predecessor checkpoint was required but no archive was restored' >&2
              exit 1
            fi
            echo 'No prior cache checkpoint; canonical self-healing bootstrap will be used.'
          fi

      - name: Enforce predecessor terminal continuity before owner
        id: predecessor_terminal_continuity
        if: ${{ env.REQUIRE_PREDECESSOR_TERMINAL_CONTINUITY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-cloud:$GITHUB_RUN_ID" \
            python - <<'PY' > "$RUNNER_TEMP/mmibkr-terminal-continuity.env"
          import json
          from pathlib import Path

          path = Path(
              '/app/data/strategy_runtime/selected_runtime_cloud_cycle_v1/terminal_boundaries.json'
          )
          if not path.is_file():
              raise SystemExit('required predecessor terminal continuity missing')
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.selected_runtime_cloud_cycle_terminal_ledger.v1':
              raise SystemExit('predecessor terminal continuity schema mismatch')
          entries = node.get('entries') if isinstance(node.get('entries'), dict) else {}
          if not entries:
              raise SystemExit('predecessor terminal continuity has no terminal entries')
          for key in (
              'account_state_included',
              'positions_included',
              'orders_included',
              'credentials_included',
              'execution_authority_included',
          ):
              if node.get(key) is not False:
                  raise SystemExit(
                      'predecessor terminal continuity safety boundary violated:' + key
                  )
          if not all(
              isinstance(row, dict)
              and row.get('terminal') is True
              for row in entries.values()
          ):
              raise SystemExit('predecessor terminal continuity contains nonterminal entry')
          print('READY=true')
          print('ENTRY_COUNT=' + str(len(entries)))
          PY

          cat "$RUNNER_TEMP/mmibkr-terminal-continuity.env"
          while IFS='=' read -r key value; do
            case "$key" in
              READY)
                echo "ready=$value" >> "$GITHUB_OUTPUT"
                ;;
              ENTRY_COUNT)
                echo "entry_count=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < "$RUNNER_TEMP/mmibkr-terminal-continuity.env"
          echo 'MMIBKR_PREDECESSOR_TERMINAL_CONTINUITY_READY=1'

      - name: Consume proven initial selected-runtime backfill through canonical ingest
        id: initial_backfill
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          input_dir="$RUNNER_TEMP/mmibkr-initial-backfill"
          rm -rf "$input_dir"
          mkdir -p "$input_dir"

          if docker run --rm -i \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-cloud:${GITHUB_RUN_ID}" \
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/app/data/strategy_runtime/selected_runtime_signal_history_contracts_v1/latest.json')
          if not path.is_file():
              raise SystemExit(1)
          node = json.loads(path.read_text(encoding='utf-8'))
          rows = node.get('runtimes') if isinstance(node.get('runtimes'), dict) else {}
          ok = (
              node.get('schema') == 'mmibkr.selected_runtime_signal_history_contracts.v1'
              and node.get('ok') is True
              and str(node.get('public_run_id') or '') == '35407829303'
              and int(node.get('runtime_count') or 0) == 3
              and len(rows) == 3
              and all(isinstance(row, dict) and row.get('warmup_ready') is True for row in rows.values())
          )
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo 'performed=false' >> "$GITHUB_OUTPUT"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo "public_run_id=$INITIAL_BACKFILL_RUN_ID" >> "$GITHUB_OUTPUT"
            echo 'MMIBKR_INITIAL_BACKFILL_INGEST=already_present'
            echo "MMIBKR_INITIAL_BACKFILL_PUBLIC_RUN_ID=$INITIAL_BACKFILL_RUN_ID"
            exit 0
          fi

          gh run download "$INITIAL_BACKFILL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$INITIAL_BACKFILL_ARTIFACT" \
            --dir "$input_dir"

          for name in \
            ibkr-cloudflare-envelope-receipt.json \
            ibkr-post-auth-handoff.json \
            ibkr-forward-bars-v2.jsonl; do
            test -s "$input_dir/$name"
          done

          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$input_dir:/input:ro" \
            "mmibkr-cloud:${GITHUB_RUN_ID}" \
            python scripts/operator/selected_runtime_initial_backfill_ingest_v1.py \
              --repo-root /app \
              --data-root /app/data \
              --bars /input/ibkr-forward-bars-v2.jsonl \
              --handoff /input/ibkr-post-auth-handoff.json \
              --fleet-receipt /input/ibkr-cloudflare-envelope-receipt.json \
              --output /app/data/strategy_runtime/selected_runtime_initial_backfill_v1/latest.json

          eval "$(
            docker run --rm -i \
              -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
              "mmibkr-cloud:${GITHUB_RUN_ID}" \
              python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/app/data/strategy_runtime/selected_runtime_initial_backfill_v1/latest.json')
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.selected_runtime_initial_backfill_ingest.v1':
              raise SystemExit('initial backfill ingest schema mismatch')
          if node.get('ok') is not True or node.get('all_warmups_ready') is not True:
              raise SystemExit('initial backfill did not satisfy all warmups')
          artifact = node.get('artifact') if isinstance(node.get('artifact'), dict) else {}
          if str(artifact.get('public_run_id') or '') != '35407829303':
              raise SystemExit('initial backfill public run mismatch')
          symbols = node.get('symbols') if isinstance(node.get('symbols'), dict) else {}
          if set(symbols) != {'AMAT', 'APH', 'MNQ'}:
              raise SystemExit('initial backfill symbol coverage mismatch')
          for symbol in ('AMAT', 'APH', 'MNQ'):
              warmup = symbols[symbol].get('warmup') if isinstance(symbols[symbol], dict) else {}
              if not isinstance(warmup, dict) or warmup.get('ready') is not True:
                  raise SystemExit(f'initial backfill warmup incomplete:{symbol}')
          if int(symbols['AMAT'].get('target_rows') or 0) < 400:
              raise SystemExit('AMAT target coverage below warmup')
          if int(symbols['APH'].get('target_rows') or 0) < 400:
              raise SystemExit('APH target coverage below warmup')
          if int(symbols['MNQ'].get('source_rows') or 0) < 4800:
              raise SystemExit('MNQ source coverage below warmup')
          if int(symbols['MNQ'].get('target_rows') or 0) < 400:
              raise SystemExit('MNQ target coverage below warmup')
          if node.get('broker_action') is not False:
              raise SystemExit('backfill ingest broker action boundary violated')
          if node.get('runtime_execution_contract_mutated') is not False:
              raise SystemExit('backfill ingest execution authority boundary violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('backfill ingest live boundary violated')

          def emit(name, value):
              print(f"{name}={int(value)}")
          emit('AMAT_TARGET_ROWS', symbols['AMAT'].get('target_rows') or 0)
          emit('APH_TARGET_ROWS', symbols['APH'].get('target_rows') or 0)
          emit('MNQ_SOURCE_ROWS', symbols['MNQ'].get('source_rows') or 0)
          emit('MNQ_TARGET_ROWS', symbols['MNQ'].get('target_rows') or 0)
          PY
          )"

          echo 'performed=true' >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "public_run_id=$INITIAL_BACKFILL_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "amat_target_rows=$AMAT_TARGET_ROWS" >> "$GITHUB_OUTPUT"
          echo "aph_target_rows=$APH_TARGET_ROWS" >> "$GITHUB_OUTPUT"
          echo "mnq_source_rows=$MNQ_SOURCE_ROWS" >> "$GITHUB_OUTPUT"
          echo "mnq_target_rows=$MNQ_TARGET_ROWS" >> "$GITHUB_OUTPUT"
          echo 'MMIBKR_INITIAL_BACKFILL_INGEST=accepted'
          echo "MMIBKR_INITIAL_BACKFILL_PUBLIC_RUN_ID=$INITIAL_BACKFILL_RUN_ID"
          echo "MMIBKR_INITIAL_BACKFILL_AMAT_TARGET_ROWS=$AMAT_TARGET_ROWS"
          echo "MMIBKR_INITIAL_BACKFILL_APH_TARGET_ROWS=$APH_TARGET_ROWS"
          echo "MMIBKR_INITIAL_BACKFILL_MNQ_SOURCE_ROWS=$MNQ_SOURCE_ROWS"
          echo "MMIBKR_INITIAL_BACKFILL_MNQ_TARGET_ROWS=$MNQ_TARGET_ROWS"

      - name: Build canonical initial-backfill checkpoint before owner
        id: initial_backfill_checkpoint
        if: ${{ steps.initial_backfill.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          rm -f "$checkpoint"

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
            "mmibkr-cloud:${GITHUB_RUN_ID}" \
            python scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              --repo-root /app \
              --data-root /app/data \
              --archive-output /checkpoint/latest.tgz

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
            "mmibkr-cloud:${GITHUB_RUN_ID}" \
            sh -lc "chown ${uid}:${gid} /checkpoint/latest.tgz && chmod 600 /checkpoint/latest.tgz"

          test -r "$checkpoint"
          checkpoint_sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "sha256=$checkpoint_sha256" >> "$GITHUB_OUTPUT"
          echo 'MMIBKR_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_READY=1'
          echo "MMIBKR_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_SHA256=$checkpoint_sha256"

      - name: Save canonical initial-backfill checkpoint before owner
        if: ${{ steps.initial_backfill_checkpoint.outputs.ready == 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-initial-backfill-preowner

      - name: Remove local initial-backfill checkpoint before round-trip proof
        if: ${{ steps.initial_backfill_checkpoint.outputs.ready == 'true' }}
        run: rm -f "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"

      - name: Restore exact initial-backfill checkpoint before owner
        id: verify_initial_backfill_checkpoint
        if: ${{ steps.initial_backfill_checkpoint.outputs.ready == 'true' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-initial-backfill-preowner
          fail-on-cache-miss: true

      - name: Enforce exact initial-backfill checkpoint round-trip before owner
        id: initial_backfill_checkpoint_saved
        if: ${{ steps.initial_backfill_checkpoint.outputs.ready == 'true' }}
        env:
          EXPECTED_SHA256: ${{ steps.initial_backfill_checkpoint.outputs.sha256 }}
          CACHE_HIT: ${{ steps.verify_initial_backfill_checkpoint.outputs.cache-hit }}
          CACHE_KEY: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-initial-backfill-preowner
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test "$CACHE_HIT" = 'true'
          test -r "$checkpoint"
          actual_sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"

          echo 'saved=true' >> "$GITHUB_OUTPUT"
          echo "saved_sha256=$actual_sha256" >> "$GITHUB_OUTPUT"
          echo "saved_cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo 'MMIBKR_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_SAVED=1'
          echo "MMIBKR_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_ROUNDTRIP_SHA256=$actual_sha256"

      - name: Run bounded selected-runtime cloud owner
        id: cloud_owner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          owner_container="mmibkr-cloud-owner-${GITHUB_RUN_ID}"
          snapshot_in_container="/app/data/strategy_runtime/cloud_operator_snapshot_v1/latest.json"
          snapshot_tmp="$RUNNER_TEMP/mmibkr-operator-snapshot-stream.json"
          stream_meta="$RUNNER_TEMP/mmibkr-operator-snapshot-stream-meta.json"
          stream_publish_count=0
          stream_attempt_count=0
          last_seen_sha256=''
          log_pid=''

          cleanup_owner() {
            rm -f "$snapshot_tmp" "$stream_meta"
            if docker inspect "$owner_container" >/dev/null 2>&1; then
              docker rm -f "$owner_container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_owner EXIT

          docker run             --name "$owner_container"             -d             -e IBKR_REMOTE_EXCHANGE_TOKEN             -e ACTIONS_ID_TOKEN_REQUEST_URL             -e ACTIONS_ID_TOKEN_REQUEST_TOKEN             -e ENABLE_LIVE_TRADING=0             -v "$RUNNER_TEMP/mmibkr-data:/app/data"             -v "$RUNNER_TEMP/mmibkr-source:/private-source:ro"             "mmibkr-cloud:${GITHUB_RUN_ID}"             python scripts/operator/selected_runtime_cloud_daemon_v1.py               --repo-root /app               --data-root /app/data               --source-materialization /private-source/source-materialization.json               --session-seconds "$SESSION_SECONDS"               --max-consecutive-failures "$MAX_CONSECUTIVE_OWNER_FAILURES"               --max-cycles "$MAX_CYCLES"               --output /app/data/strategy_runtime/selected_runtime_cloud_daemon_v1/session.json             >/dev/null

          docker logs -f "$owner_container" &
          log_pid=$!

          while true; do
            running="$(docker inspect -f '{{.State.Running}}' "$owner_container" 2>/dev/null || printf 'false')"
            [ "$running" = 'true' ] || break

            if docker exec "$owner_container" test -s "$snapshot_in_container" 2>/dev/null; then
              if docker exec "$owner_container" cat "$snapshot_in_container" > "$snapshot_tmp" 2>/dev/null; then
                chmod 600 "$snapshot_tmp"
                snapshot_sha256="$(sha256sum "$snapshot_tmp" | awk '{print $1}')"
                if [ "$snapshot_sha256" != "$last_seen_sha256" ]; then
                  last_seen_sha256="$snapshot_sha256"
                  stream_attempt_count=$((stream_attempt_count + 1))
                  rm -f "$stream_meta"
                  if python scripts/mmibkr_operator_snapshot_publish_v1.py                     --snapshot "$snapshot_tmp"                     --operator-url "$OPERATOR_CONSOLE_URL"                     --caller-run-id "$GITHUB_RUN_ID"                     --output "$stream_meta"                     --mode stream; then
                    stream_publish_count=$((stream_publish_count + 1))
                    echo "MMIBKR_OPERATOR_SNAPSHOT_STREAM_ACCEPTED_COUNT=$stream_publish_count"
                  else
                    echo "::warning::Operator snapshot stream publish failed; selected-runtime owner continues."
                  fi
                fi
                rm -f "$snapshot_tmp" "$stream_meta"
              fi
            fi

            sleep 30
          done

          owner_exit="$(docker wait "$owner_container")"
          wait "$log_pid" || true
          echo "stream_publish_count=$stream_publish_count" >> "$GITHUB_OUTPUT"
          echo "stream_attempt_count=$stream_attempt_count" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_OPERATOR_SNAPSHOT_STREAM_PUBLISH_COUNT=$stream_publish_count"
          echo "MMIBKR_OPERATOR_SNAPSHOT_STREAM_ATTEMPT_COUNT=$stream_attempt_count"
          exit "$owner_exit"

      - name: Build sanitized successor checkpoint
        if: ${{ always() }}
        id: checkpoint
        shell: bash
        run: |
          set +e
          uid="$(id -u)"
          gid="$(id -g)"
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          rm -f "$checkpoint"
          docker run --rm             -v "$RUNNER_TEMP/mmibkr-data:/app/data"             -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint"             "mmibkr-cloud:${GITHUB_RUN_ID}"             python scripts/operator/runtime_market_data_cache_checkpoint_v1.py               --repo-root /app               --data-root /app/data               --archive-output /checkpoint/latest.tgz               > "$RUNNER_TEMP/checkpoint-build.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/checkpoint-build.log"
          if [ "$code" -eq 0 ] && [ -s "$checkpoint" ]; then
            docker run --rm \
              -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
              "mmibkr-cloud:${GITHUB_RUN_ID}" \
              sh -lc "chown ${uid}:${gid} /checkpoint/latest.tgz && chmod 600 /checkpoint/latest.tgz"
            ownership_code=$?
            if [ "$ownership_code" -eq 0 ] && [ -r "$checkpoint" ]; then
              checkpoint_sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo "sha256=$checkpoint_sha256" >> "$GITHUB_OUTPUT"
              echo "$checkpoint_sha256  $checkpoint"
              echo 'MMIBKR_CHECKPOINT_CACHE_READY=1'
            else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              rm -f "$checkpoint"
              echo 'Checkpoint ownership normalization failed; successor remains able to self-heal from broker history.'
            fi
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            rm -f "$checkpoint"
            echo 'Checkpoint unavailable; successor remains able to self-heal from broker history.'
          fi
          exit 0

      - name: Save sanitized successor checkpoint cache
        if: ${{ steps.checkpoint.outputs.ready == 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}

      - name: Remove local checkpoint before cache round-trip proof
        if: ${{ steps.checkpoint.outputs.ready == 'true' }}
        run: rm -f "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"

      - name: Restore just-saved checkpoint cache for round-trip proof
        id: verify_checkpoint_cache
        if: ${{ steps.checkpoint.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}
          fail-on-cache-miss: true

      - name: Confirm sanitized successor checkpoint cache saved
        id: checkpoint_saved
        if: ${{ always() && steps.checkpoint.outputs.ready == 'true' }}
        env:
          EXPECTED_CHECKPOINT_SHA256: ${{ steps.checkpoint.outputs.sha256 }}
          CHECKPOINT_CACHE_HIT: ${{ steps.verify_checkpoint_cache.outputs.cache-hit }}
          CHECKPOINT_CACHE_KEY: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}
        run: |
          set +e
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          saved=false
          actual_sha256=''
          if [ "$CHECKPOINT_CACHE_HIT" = 'true' ]             && [ -n "$EXPECTED_CHECKPOINT_SHA256" ]             && [ -r "$checkpoint" ]; then
            actual_sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
            if [ "$actual_sha256" = "$EXPECTED_CHECKPOINT_SHA256" ]; then
              saved=true
            fi
          fi
          echo "saved=$saved" >> "$GITHUB_OUTPUT"
          if [ "$saved" = 'true' ]; then
            echo "saved_sha256=$actual_sha256" >> "$GITHUB_OUTPUT"
            echo "saved_cache_key=$CHECKPOINT_CACHE_KEY" >> "$GITHUB_OUTPUT"
            echo "MMIBKR_CHECKPOINT_CACHE_ROUNDTRIP_SHA256=$actual_sha256"
            echo 'MMIBKR_CHECKPOINT_CACHE_SAVED=1'
          else
            echo 'saved_sha256=' >> "$GITHUB_OUTPUT"
            echo 'saved_cache_key=' >> "$GITHUB_OUTPUT"
            echo 'MMIBKR_CHECKPOINT_CACHE_SAVED=0'
            echo 'Checkpoint cache round-trip unavailable; successor may self-heal from broker/history.'
          fi
          exit 0

      - name: Enforce successful selected-runtime cloud session
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          session_path = Path(
              os.environ['RUNNER_TEMP'],
              'mmibkr-data',
              'strategy_runtime',
              'selected_runtime_cloud_daemon_v1',
              'session.json',
          )
          if not session_path.is_file():
              raise SystemExit('cloud owner session receipt missing')
          node = json.loads(session_path.read_text())
          last_cycle = (
              node.get('last_cycle')
              if isinstance(node.get('last_cycle'), dict)
              else {}
          )
          accepted = (
              node.get('ok') is True
              and int(node.get('cycle_count') or 0) >= 1
              and int(node.get('success_count') or 0) >= 1
              and node.get('checkpoint_handoff_ready') is True
              and last_cycle.get('ok') is True
              and node.get('live_execution_allowed') is False
          )
          print('MMIBKR_CLOUD_SESSION_ACCEPTED=' + ('1' if accepted else '0'))
          if not accepted:
              raise SystemExit(
                  'cloud owner session did not produce a successful terminal cycle'
              )
          PY

      - name: Publish private operator snapshot
        id: operator_snapshot
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          publish_status='failed'
          runtime_count=''
          positions_count=''
          durable_readback_verified='false'
          snapshot=''
          publish_meta=''

          finalize_operator_snapshot_publish() {
            {
              printf 'publish_status=%s\n' "$publish_status"
              printf 'runtime_count=%s\n' "$runtime_count"
              printf 'positions_count=%s\n' "$positions_count"
              printf 'durable_readback_verified=%s\n' "$durable_readback_verified"
            } >> "$GITHUB_OUTPUT"
            [ -z "$snapshot" ] || rm -f "$snapshot"
            [ -z "$publish_meta" ] || rm -f "$publish_meta"
          }
          trap finalize_operator_snapshot_publish EXIT

          snapshot_in_container="/app/data/strategy_runtime/cloud_operator_snapshot_v1/latest.json"
          if ! docker run --rm             -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro"             "mmibkr-cloud:${GITHUB_RUN_ID}"             test -s "$snapshot_in_container"; then
            publish_status='not_available_for_runtime_source'
            echo 'MMIBKR_OPERATOR_SNAPSHOT_PUBLISH=not_available_for_runtime_source'
            exit 0
          fi

          snapshot="$RUNNER_TEMP/mmibkr-operator-snapshot-publish.json"
          publish_meta="$RUNNER_TEMP/mmibkr-operator-snapshot-publish-meta.json"
          docker run --rm             -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro"             "mmibkr-cloud:${GITHUB_RUN_ID}"             python -c "from pathlib import Path; import sys; sys.stdout.buffer.write(Path('$snapshot_in_container').read_bytes())"             > "$snapshot"
          chmod 600 "$snapshot"

          python scripts/mmibkr_operator_snapshot_publish_v1.py             --snapshot "$snapshot"             --operator-url "$OPERATOR_CONSOLE_URL"             --caller-run-id "$GITHUB_RUN_ID"             --output "$publish_meta"             --mode final

          read -r publish_status runtime_count positions_count durable_readback_verified < <(
            python - "$publish_meta" <<'PY'
          import json, sys
          node = json.load(open(sys.argv[1], encoding='utf-8'))
          print(
              node.get('status') or 'failed',
              int(node.get('runtime_count') or 0),
              int(node.get('positions_count') or 0),
              'true' if node.get('durable_readback_verified') is True else 'false',
          )
          PY
          )

      - name: Publish sanitized cloud-session receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MMIBKR_RECEIPT_CHECKPOINT_RESTORED: ${{ steps.restore_checkpoint.outputs.restored }}
          MMIBKR_RECEIPT_CHECKPOINT_RESTORED_SHA256: ${{ steps.restore_checkpoint.outputs.restored_sha256 }}
          MMIBKR_RECEIPT_CHECKPOINT_RESTORED_CACHE_KEY: ${{ steps.restore_checkpoint.outputs.restored_cache_key }}
          MMIBKR_RECEIPT_EXPECTED_PREDECESSOR_CHECKPOINT_KEY: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_KEY }}
          MMIBKR_RECEIPT_EXPECTED_PREDECESSOR_CHECKPOINT_SHA256: ${{ env.EXPECTED_PREDECESSOR_CHECKPOINT_SHA256 }}
          MMIBKR_RECEIPT_EXPECTED_PREDECESSOR_MATCH: ${{ steps.restore_checkpoint.outputs.expected_predecessor_match }}
          MMIBKR_RECEIPT_PREDECESSOR_TERMINAL_CONTINUITY_REQUIRED: ${{ env.REQUIRE_PREDECESSOR_TERMINAL_CONTINUITY }}
          MMIBKR_RECEIPT_PREDECESSOR_TERMINAL_CONTINUITY_READY: ${{ steps.predecessor_terminal_continuity.outputs.ready || 'false' }}
          MMIBKR_RECEIPT_PREDECESSOR_TERMINAL_CONTINUITY_ENTRY_COUNT: ${{ steps.predecessor_terminal_continuity.outputs.entry_count || '0' }}
          MMIBKR_RECEIPT_CHECKPOINT_CACHE_READY: ${{ steps.checkpoint.outputs.ready }}
          MMIBKR_RECEIPT_CHECKPOINT_CACHE_SAVED: ${{ steps.checkpoint_saved.outputs.saved || 'false' }}
          MMIBKR_RECEIPT_CHECKPOINT_CACHE_SHA256: ${{ steps.checkpoint_saved.outputs.saved_sha256 }}
          MMIBKR_RECEIPT_CHECKPOINT_CACHE_KEY: ${{ steps.checkpoint_saved.outputs.saved_cache_key }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_READY: ${{ steps.initial_backfill.outputs.ready }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_PERFORMED: ${{ steps.initial_backfill.outputs.performed }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_PUBLIC_RUN_ID: ${{ steps.initial_backfill.outputs.public_run_id }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_AMAT_TARGET_ROWS: ${{ steps.initial_backfill.outputs.amat_target_rows }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_APH_TARGET_ROWS: ${{ steps.initial_backfill.outputs.aph_target_rows }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_MNQ_SOURCE_ROWS: ${{ steps.initial_backfill.outputs.mnq_source_rows }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_MNQ_TARGET_ROWS: ${{ steps.initial_backfill.outputs.mnq_target_rows }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_SAVED: ${{ steps.initial_backfill_checkpoint_saved.outputs.saved || 'false' }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_SHA256: ${{ steps.initial_backfill_checkpoint_saved.outputs.saved_sha256 }}
          MMIBKR_RECEIPT_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_CACHE_KEY: ${{ steps.initial_backfill_checkpoint_saved.outputs.saved_cache_key }}
          MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_STREAM_COUNT: ${{ steps.cloud_owner.outputs.stream_publish_count || '0' }}
          MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_STREAM_ATTEMPTS: ${{ steps.cloud_owner.outputs.stream_attempt_count || '0' }}
          MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_PUBLISH: ${{ steps.operator_snapshot.outputs.publish_status }}
          MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_RUNTIME_COUNT: ${{ steps.operator_snapshot.outputs.runtime_count }}
          MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_POSITIONS_COUNT: ${{ steps.operator_snapshot.outputs.positions_count }}
          MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_DURABLE_READBACK: ${{ steps.operator_snapshot.outputs.durable_readback_verified }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          session_path = Path(
              os.environ['RUNNER_TEMP'],
              'mmibkr-data',
              'strategy_runtime',
              'selected_runtime_cloud_daemon_v1',
              'session.json',
          )
          if session_path.is_file():
              node = json.loads(session_path.read_text())
              roll = (
                  node.get('futures_roll_maintenance')
                  if isinstance(node.get('futures_roll_maintenance'), dict)
                  else {}
              )
              last_cycle = (
                  node.get('last_cycle')
                  if isinstance(node.get('last_cycle'), dict)
                  else {}
              )
              session_accepted = (
                  node.get('ok') is True
                  and int(node.get('cycle_count') or 0) >= 1
                  and int(node.get('success_count') or 0) >= 1
                  and node.get('checkpoint_handoff_ready') is True
                  and last_cycle.get('ok') is True
                  and node.get('live_execution_allowed') is False
              )
              receipt = {
                  'schema': 'mmibkr.selected_runtime_cloud_session_receipt.v2',
                  'ok': session_accepted,
                  'session_accepted': session_accepted,
                  'status': node.get('status'),
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'public_head': os.environ.get('GITHUB_SHA'),
                  'private_head': os.environ.get('PRIVATE_HEAD'),
                  'cycle_count': node.get('cycle_count'),
                  'success_count': node.get('success_count'),
                  'failure_count': node.get('failure_count'),
                  'checkpoint_handoff_ready': node.get('checkpoint_handoff_ready'),
                  'last_cycle': node.get('last_cycle'),
                  'futures_roll_maintenance': roll,
                  'source_transport': 'fleet_authority_exact_sha_encrypted_snapshot_vault',
                  'private_repository_token_used': False,
                  'live_execution_allowed': False,
                  'public_strategy_authority': False,
                  'public_execution_policy_authority': False,
                  'credentials_included': False,
                  'account_state_included': False,
                  'positions_included': False,
                  'orders_included': False,
              }
          else:
              receipt = {
                  'schema': 'mmibkr.selected_runtime_cloud_session_receipt.v2',
                  'ok': False,
                  'status': 'session_receipt_missing_after_runtime_failure',
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'public_head': os.environ.get('GITHUB_SHA'),
                  'private_head': os.environ.get('PRIVATE_HEAD'),
                  'source_transport': 'fleet_authority_exact_sha_encrypted_snapshot_vault',
                  'private_repository_token_used': False,
                  'live_execution_allowed': False,
                  'credentials_included': False,
                  'account_state_included': False,
                  'positions_included': False,
                  'orders_included': False,
              }
          def optional_int(name):
              raw = str(os.environ.get(name) or '').strip()
              try:
                  return int(raw)
              except ValueError:
                  return None

          publish_status = str(
              os.environ.get('MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_PUBLISH') or 'not_run'
          ).strip()
          publish_accepted = publish_status == 'accepted'
          receipt['checkpoint_restored'] = (
              os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_RESTORED') == 'true'
          )
          receipt['checkpoint_restored_sha256'] = (
              str(os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_RESTORED_SHA256') or '').strip()
              or None
          )
          receipt['checkpoint_restored_cache_key'] = (
              str(os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_RESTORED_CACHE_KEY') or '').strip()
              or None
          )
          receipt['expected_predecessor_checkpoint_cache_key'] = (
              str(
                  os.environ.get(
                      'MMIBKR_RECEIPT_EXPECTED_PREDECESSOR_CHECKPOINT_KEY'
                  ) or ''
              ).strip()
              or None
          )
          receipt['expected_predecessor_checkpoint_sha256'] = (
              str(
                  os.environ.get(
                      'MMIBKR_RECEIPT_EXPECTED_PREDECESSOR_CHECKPOINT_SHA256'
                  ) or ''
              ).strip()
              or None
          )
          receipt['expected_predecessor_checkpoint_match'] = (
              os.environ.get('MMIBKR_RECEIPT_EXPECTED_PREDECESSOR_MATCH') == 'true'
          )
          receipt['predecessor_terminal_continuity_required'] = (
              os.environ.get(
                  'MMIBKR_RECEIPT_PREDECESSOR_TERMINAL_CONTINUITY_REQUIRED'
              ) == 'true'
          )
          receipt['predecessor_terminal_continuity_ready'] = (
              os.environ.get(
                  'MMIBKR_RECEIPT_PREDECESSOR_TERMINAL_CONTINUITY_READY'
              ) == 'true'
          )
          receipt['predecessor_terminal_continuity_entry_count'] = (
              optional_int(
                  'MMIBKR_RECEIPT_PREDECESSOR_TERMINAL_CONTINUITY_ENTRY_COUNT'
              ) or 0
          )
          receipt['checkpoint_cache_ready'] = (
              os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_CACHE_READY') == 'true'
          )
          receipt['checkpoint_cache_saved'] = (
              os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_CACHE_SAVED') == 'true'
          )
          receipt['checkpoint_cache_sha256'] = (
              str(os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_CACHE_SHA256') or '').strip()
              or None
          )
          receipt['checkpoint_cache_key'] = (
              str(os.environ.get('MMIBKR_RECEIPT_CHECKPOINT_CACHE_KEY') or '').strip()
              or None
          )
          receipt['initial_backfill_ingest'] = {
              'ready': os.environ.get('MMIBKR_RECEIPT_INITIAL_BACKFILL_READY') == 'true',
              'performed_this_run': (
                  os.environ.get('MMIBKR_RECEIPT_INITIAL_BACKFILL_PERFORMED') == 'true'
              ),
              'public_run_id': (
                  str(os.environ.get('MMIBKR_RECEIPT_INITIAL_BACKFILL_PUBLIC_RUN_ID') or '').strip()
                  or None
              ),
              'artifact_name': 'ibkr-cloudflare-readonly-b1-35407829303',
              'amat_target_rows': optional_int(
                  'MMIBKR_RECEIPT_INITIAL_BACKFILL_AMAT_TARGET_ROWS'
              ),
              'aph_target_rows': optional_int(
                  'MMIBKR_RECEIPT_INITIAL_BACKFILL_APH_TARGET_ROWS'
              ),
              'mnq_source_rows': optional_int(
                  'MMIBKR_RECEIPT_INITIAL_BACKFILL_MNQ_SOURCE_ROWS'
              ),
              'mnq_target_rows': optional_int(
                  'MMIBKR_RECEIPT_INITIAL_BACKFILL_MNQ_TARGET_ROWS'
              ),
              'broker_action': False,
              'runtime_execution_contract_mutated': False,
              'live_execution_allowed': False,
              'preowner_checkpoint_saved': (
                  os.environ.get(
                      'MMIBKR_RECEIPT_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_SAVED'
                  ) == 'true'
              ),
              'preowner_checkpoint_sha256': (
                  str(
                      os.environ.get(
                          'MMIBKR_RECEIPT_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_SHA256'
                      ) or ''
                  ).strip()
                  or None
              ),
              'preowner_checkpoint_cache_key': (
                  str(
                      os.environ.get(
                          'MMIBKR_RECEIPT_INITIAL_BACKFILL_PREOWNER_CHECKPOINT_CACHE_KEY'
                      ) or ''
                  ).strip()
                  or None
              ),
          }
          receipt['operator_snapshot_stream_publish_count'] = (
              optional_int('MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_STREAM_COUNT') or 0
          )
          receipt['operator_snapshot_stream_attempt_count'] = (
              optional_int('MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_STREAM_ATTEMPTS') or 0
          )
          receipt['operator_snapshot_publish'] = {
              'status': publish_status,
              'runtime_count': optional_int(
                  'MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_RUNTIME_COUNT'
              ),
              'positions_count': optional_int(
                  'MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_POSITIONS_COUNT'
              ),
              'durable_readback_verified': (
                  os.environ.get('MMIBKR_RECEIPT_OPERATOR_SNAPSHOT_DURABLE_READBACK')
                  == 'true'
              ),
              'account_identifiers_included': False if publish_accepted else None,
              'credentials_included': False if publish_accepted else None,
              'tokens_included': False if publish_accepted else None,
              'private_source_included': False if publish_accepted else None,
              'execution_authority_included': False if publish_accepted else None,
              'broker_mutation_authority': False if publish_accepted else None,
              'live_execution_allowed': False if publish_accepted else None,
          }

          out = Path(os.environ['RUNNER_TEMP'], 'mmibkr-cloud-session-receipt.json')
          out.write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY

          receipt_path="${RECEIPT_ROOT}/${GITHUB_RUN_ID}-mmibkr-selected-runtime-cloud.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/mmibkr-cloud-session-receipt.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json, sys
          content, branch = sys.argv[1:]
          print(json.dumps({
              'message': 'runtime: publish sanitized MM-IBKR cloud session receipt',
              'content': content,
              'branch': branch,
          }))
          PY
          )"
          curl -fsSL -X PUT             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${receipt_path}"             -d "$body" >/dev/null
          echo "MMIBKR_CLOUD_RECEIPT_PATH=${receipt_path}"

      - name: Enforce sanitized v2 cloud-session receipt acceptance
        if: ${{ success() }}
        run: |
          set -euo pipefail
          python scripts/mmibkr_cloud_session_acceptance_v1.py \
            --receipt "$RUNNER_TEMP/mmibkr-cloud-session-receipt.json" \
            --mode first-post-fix \
            --expected-public-sha "$GITHUB_SHA" \
            --expected-private-sha "$PRIVATE_HEAD"
          echo 'MMIBKR_CLOUD_V2_RECEIPT_ACCEPTED=1'

      - name: Queue successor bounded session
        if: ${{ success() && env.SELF_HANDOFF == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUCCESSOR_CHECKPOINT_CACHE_KEY: ${{ steps.checkpoint_saved.outputs.saved_cache_key }}
          SUCCESSOR_CHECKPOINT_SHA256: ${{ steps.checkpoint_saved.outputs.saved_sha256 }}
        run: |
          set -euo pipefail
          test -n "$SUCCESSOR_CHECKPOINT_CACHE_KEY"
          test -n "$SUCCESSOR_CHECKPOINT_SHA256"
          body="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'source_ref': os.environ['PRIVATE_HEAD'],
                  'session_seconds': os.environ['SESSION_SECONDS'],
                  'max_cycles': os.environ['MAX_CYCLES'],
                  'expected_checkpoint_cache_key': os.environ['SUCCESSOR_CHECKPOINT_CACHE_KEY'],
                  'expected_checkpoint_sha256': os.environ['SUCCESSOR_CHECKPOINT_SHA256'],
                  'allow_unpinned_bootstrap': False,
                  'require_terminal_continuity': True,
                  'self_handoff': True,
              },
          }))
          PY
          )"
          curl -fsSL -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mmibkr-selected-runtime-cloud-r1.yml/dispatches"             -d "$body"
          echo 'MMIBKR_CLOUD_SUCCESSOR_QUEUED=1'

      - name: Destroy private runtime material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          if docker image inspect "mmibkr-cloud:${GITHUB_RUN_ID}" >/dev/null 2>&1; then
            docker run --rm \
              -v "$RUNNER_TEMP/mmibkr-data:/cleanup-data" \
              -v "$RUNNER_TEMP/mmibkr-checkpoint:/cleanup-checkpoint" \
              "mmibkr-cloud:${GITHUB_RUN_ID}" \
              sh -lc "chown -R ${uid}:${gid} /cleanup-data /cleanup-checkpoint"
          fi
          rm -rf \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint"
          docker image rm "mmibkr-cloud:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          for path in \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint"; do
            if [ -e "$path" ]; then
              echo "private runtime cleanup residue: $path" >&2
              exit 1
            fi
          done
          echo 'MMIBKR_PRIVATE_RUNTIME_MATERIAL_DESTROYED=1'


  checkpoint_acceptance:
    if: ${{ github.event_name == 'push' && needs.route.outputs.mode == 'checkpoint_acceptance' }}
    needs:
      - contract
      - route
    environment: ibkr-paper-runtime-r1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: mmibkr-selected-runtime-cloud-checkpoint-acceptance-r1
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SOURCE_REF: d81df85788ebb6be6d4d69b9b9a537be96f16507
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Materialize exact private MM-IBKR source for finite checkpoint acceptance
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$CANONICAL_SOURCE_REF" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source'
          node = json.loads((root / 'materialization-host.json').read_text(encoding='utf-8'))
          if node.get('ok') is not True:
              raise SystemExit('source materialization not ok')
          if node.get('source_sha') != os.environ['CANONICAL_SOURCE_REF']:
              raise SystemExit('private source SHA mismatch')
          if node.get('source_transport') != 'fleet_authority_exact_sha_encrypted_snapshot_vault':
              raise SystemExit('reusable encrypted source-vault transport required')
          if node.get('private_repository_token_used') is not False:
              raise SystemExit('private repository token unexpectedly used')
          if node.get('broker_credentials_used') is not False:
              raise SystemExit('broker credentials unexpectedly used')
          if node.get('plaintext_emitted') is not False:
              raise SystemExit('plaintext source emission contract violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution authority unexpectedly enabled')

          source_root = Path(node['source_root'])
          if not (source_root / 'Dockerfile.bot').is_file():
              raise SystemExit('materialized source layout incomplete')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD=' + node['source_sha'] + '\n')
              fh.write('PRIVATE_SOURCE_ROOT=' + str(source_root) + '\n')
          print('MMIBKR_CHECKPOINT_ACCEPTANCE_PRIVATE_HEAD=' + node['source_sha'])
          PY

      - name: Build exact private MM-IBKR image for finite checkpoint acceptance
        run: |
          set -euo pipefail
          docker build \
            -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot" \
            --target bot \
            -t "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
            "$PRIVATE_SOURCE_ROOT" >/dev/null

      - name: Validate exact private ingest and checkpoint owners
        run: |
          set -euo pipefail
          docker run --rm "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
            python -m unittest -v \
              tests.test_selected_runtime_initial_backfill_ingest_v1 \
              tests.test_selected_runtime_signal_history_contract_v1 \
              tests.test_runtime_market_data_cache_checkpoint_v1

      - name: Prepare finite acceptance directories
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-initial-backfill"

      - name: Download exact proven B1 coverage artifact
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/mmibkr-initial-backfill"
          gh run download "$INITIAL_BACKFILL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$INITIAL_BACKFILL_ARTIFACT" \
            --dir "$input"
          for name in \
            ibkr-cloudflare-envelope-receipt.json \
            ibkr-post-auth-handoff.json \
            ibkr-forward-bars-v2.jsonl; do
            test -s "$input/$name"
          done
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_ARTIFACT_DOWNLOADED=1"

      - name: Apply exact historical artifact through canonical private ingest
        id: acceptance_ingest
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/mmibkr-initial-backfill"
          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$input:/input:ro" \
            "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
            python scripts/operator/selected_runtime_initial_backfill_ingest_v1.py \
              --repo-root /app \
              --data-root /app/data \
              --bars /input/ibkr-forward-bars-v2.jsonl \
              --handoff /input/ibkr-post-auth-handoff.json \
              --fleet-receipt /input/ibkr-cloudflare-envelope-receipt.json \
              --output /app/data/strategy_runtime/selected_runtime_initial_backfill_v1/latest.json

          docker run --rm -i \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
            python - <<'PY' > "$RUNNER_TEMP/mmibkr-checkpoint-acceptance.env"
          import json
          from pathlib import Path

          node = json.loads(
              Path('/app/data/strategy_runtime/selected_runtime_initial_backfill_v1/latest.json')
              .read_text(encoding='utf-8')
          )
          if node.get('schema') != 'mmibkr.selected_runtime_initial_backfill_ingest.v1':
              raise SystemExit('initial backfill ingest schema mismatch')
          if node.get('ok') is not True or node.get('all_warmups_ready') is not True:
              raise SystemExit('initial backfill warmup incomplete')
          artifact = node.get('artifact') if isinstance(node.get('artifact'), dict) else {}
          if str(artifact.get('public_run_id') or '') != '35407829303':
              raise SystemExit('initial backfill public run mismatch')
          symbols = node.get('symbols') if isinstance(node.get('symbols'), dict) else {}
          if set(symbols) != {'AMAT', 'APH', 'MNQ'}:
              raise SystemExit('initial backfill symbol coverage mismatch')
          requirements = {
              'AMAT': ('target_rows', 400),
              'APH': ('target_rows', 400),
              'MNQ': ('source_rows', 4800),
          }
          for symbol, (field, minimum) in requirements.items():
              if int(symbols[symbol].get(field) or 0) < minimum:
                  raise SystemExit(f'{symbol} {field} below required warmup')
              warmup = symbols[symbol].get('warmup')
              if not isinstance(warmup, dict) or warmup.get('ready') is not True:
                  raise SystemExit(f'{symbol} warmup not ready')
          if int(symbols['MNQ'].get('target_rows') or 0) < 400:
              raise SystemExit('MNQ target_rows below required warmup')
          if node.get('broker_action') is not False:
              raise SystemExit('broker action boundary violated')
          if node.get('runtime_execution_contract_mutated') is not False:
              raise SystemExit('execution contract mutation boundary violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution boundary violated')

          print('AMAT_TARGET_ROWS=' + str(int(symbols['AMAT'].get('target_rows') or 0)))
          print('APH_TARGET_ROWS=' + str(int(symbols['APH'].get('target_rows') or 0)))
          print('MNQ_SOURCE_ROWS=' + str(int(symbols['MNQ'].get('source_rows') or 0)))
          print('MNQ_TARGET_ROWS=' + str(int(symbols['MNQ'].get('target_rows') or 0)))
          print('BARS_SHA256=' + str(artifact.get('bars_sha256') or ''))
          PY

          cat "$RUNNER_TEMP/mmibkr-checkpoint-acceptance.env"
          while IFS='=' read -r key value; do
            case "$key" in
              AMAT_TARGET_ROWS|APH_TARGET_ROWS|MNQ_SOURCE_ROWS|MNQ_TARGET_ROWS|BARS_SHA256)
                echo "${key,,}=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < "$RUNNER_TEMP/mmibkr-checkpoint-acceptance.env"
          echo 'MMIBKR_CHECKPOINT_ACCEPTANCE_CANONICAL_INGEST=accepted'

      - name: Build sanitized successor checkpoint
        id: acceptance_checkpoint
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          rm -f "$checkpoint"

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
            "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
            python scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              --repo-root /app \
              --data-root /app/data \
              --archive-output /checkpoint/latest.tgz

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
            "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
            sh -lc "chown ${uid}:${gid} /checkpoint/latest.tgz && chmod 600 /checkpoint/latest.tgz"

          test -r "$checkpoint"
          sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_BUILT_SHA256=$sha256"

      - name: Save checkpoint
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-backfill-checkpoint-acceptance

      - name: Delete local checkpoint copy
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test ! -e "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_LOCAL_COPY_DELETED=1"

      - name: Restore exact saved checkpoint
        id: acceptance_restore
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-backfill-checkpoint-acceptance
          fail-on-cache-miss: true

      - name: Verify exact restored SHA256
        id: acceptance_verify
        env:
          EXPECTED_SHA256: ${{ steps.acceptance_checkpoint.outputs.sha256 }}
          CACHE_HIT: ${{ steps.acceptance_restore.outputs.cache-hit }}
          CACHE_KEY: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-backfill-checkpoint-acceptance
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test "$CACHE_HIT" = 'true'
          test -r "$checkpoint"
          actual="$(sha256sum "$checkpoint" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_RESTORED_SHA256=$actual"
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_EXACT_ROUNDTRIP=1"

      - name: Publish sanitized checkpoint acceptance receipt
        env:
          CHECKPOINT_SHA256: ${{ steps.acceptance_verify.outputs.sha256 }}
          CHECKPOINT_CACHE_KEY: ${{ steps.acceptance_verify.outputs.cache_key }}
          AMAT_TARGET_ROWS: ${{ steps.acceptance_ingest.outputs.amat_target_rows }}
          APH_TARGET_ROWS: ${{ steps.acceptance_ingest.outputs.aph_target_rows }}
          MNQ_SOURCE_ROWS: ${{ steps.acceptance_ingest.outputs.mnq_source_rows }}
          MNQ_TARGET_ROWS: ${{ steps.acceptance_ingest.outputs.mnq_target_rows }}
          BARS_SHA256: ${{ steps.acceptance_ingest.outputs.bars_sha256 }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/mmibkr-checkpoint-acceptance-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path

          node = {
              'schema': 'mmibkr.backfill_checkpoint_acceptance.v1',
              'ok': True,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'public_head': os.environ['GITHUB_SHA'],
              'private_head': os.environ['PRIVATE_HEAD'],
              'source_public_run_id': os.environ['INITIAL_BACKFILL_RUN_ID'],
              'source_artifact': os.environ['INITIAL_BACKFILL_ARTIFACT'],
              'bars_sha256': os.environ['BARS_SHA256'],
              'coverage': {
                  'AMAT': {'target_rows': int(os.environ['AMAT_TARGET_ROWS'])},
                  'APH': {'target_rows': int(os.environ['APH_TARGET_ROWS'])},
                  'MNQ': {
                      'source_rows': int(os.environ['MNQ_SOURCE_ROWS']),
                      'target_rows': int(os.environ['MNQ_TARGET_ROWS']),
                  },
              },
              'checkpoint_cache_key': os.environ['CHECKPOINT_CACHE_KEY'],
              'checkpoint_sha256': os.environ['CHECKPOINT_SHA256'],
              'local_copy_deleted_before_restore': True,
              'exact_saved_checkpoint_restored': True,
              'exact_sha256_verified': True,
              'broker_action': False,
              'paper_owner_started': False,
              'runtime_execution_contract_mutated': False,
              'live_execution_allowed': False,
              'credentials_included': False,
              'private_source_included': False,
          }
          Path(os.environ['RUNNER_TEMP'], 'mmibkr-checkpoint-acceptance-receipt.json').write_text(
              json.dumps(node, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          content="$(base64 -w0 "$receipt")"
          path="${RECEIPT_ROOT}/${GITHUB_RUN_ID}-mmibkr-backfill-checkpoint-acceptance.json"
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=runtime: publish sanitized backfill checkpoint acceptance receipt" \
            -f "content=${content}" \
            -f "branch=${EXCHANGE_REF}" >/dev/null
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_RECEIPT_PATH=$path"

      - name: Destroy finite acceptance private runtime material
        if: always()
        run: |
          set +e
          uid="$(id -u)"
          gid="$(id -g)"
          if docker image inspect "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" >/dev/null 2>&1; then
            docker run --rm \
              -v "$RUNNER_TEMP/mmibkr-data:/cleanup-data" \
              -v "$RUNNER_TEMP/mmibkr-checkpoint:/cleanup-checkpoint" \
              "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" \
              sh -lc "chown -R ${uid}:${gid} /cleanup-data /cleanup-checkpoint" \
              >/dev/null 2>&1 || true
          fi
          rm -rf \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-initial-backfill" \
            "$RUNNER_TEMP/mmibkr-checkpoint-acceptance.env" \
            "$RUNNER_TEMP/mmibkr-checkpoint-acceptance-receipt.json"
          docker image rm "mmibkr-checkpoint-acceptance:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

          for path in \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-initial-backfill"; do
            if [ -e "$path" ]; then
              echo "checkpoint acceptance cleanup residue: $path" >&2
              exit 1
            fi
          done
          echo "MMIBKR_CHECKPOINT_ACCEPTANCE_PRIVATE_RUNTIME_MATERIAL_DESTROYED=1"


  successor_restore_acceptance:
    if: ${{ github.event_name == 'push' && needs.route.outputs.mode == 'successor_restore_acceptance' }}
    needs:
      - contract
      - route
    environment: ibkr-paper-runtime-r1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: mmibkr-selected-runtime-cloud-successor-restore-acceptance-r1
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SOURCE_REF: d81df85788ebb6be6d4d69b9b9a537be96f16507
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Resolve exact successor restore request
        id: restore_request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(
              'rendezvous/fire/mmibkr-selected-runtime-cloud-successor-restore-acceptance-r1'
          )
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.selected_runtime_cloud_successor_restore_acceptance_fire.v1':
              raise SystemExit('successor restore acceptance fire schema mismatch')
          if str(node.get('source_ref') or '').lower() != os.environ['CANONICAL_SOURCE_REF']:
              raise SystemExit('successor restore private source mismatch')

          key = str(node.get('expected_checkpoint_cache_key') or '').strip()
          sha = str(node.get('expected_checkpoint_sha256') or '').strip().lower()
          prefix = os.environ['CHECKPOINT_CACHE_PREFIX']
          if not key.startswith(prefix):
              raise SystemExit('successor restore checkpoint key must use canonical prefix')
          if len(sha) != 64 or any(ch not in '0123456789abcdef' for ch in sha):
              raise SystemExit('successor restore checkpoint SHA256 invalid')
          if str(node.get('source_public_run_id') or '') != os.environ['INITIAL_BACKFILL_RUN_ID']:
              raise SystemExit('successor restore source public run mismatch')
          if node.get('broker_action') is not False:
              raise SystemExit('successor restore broker boundary violated')
          if node.get('paper_owner_started') is not False:
              raise SystemExit('successor restore paper owner boundary violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('successor restore live boundary violated')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write('checkpoint_key=' + key + '\n')
              fh.write('checkpoint_sha256=' + sha + '\n')
          print('MMIBKR_SUCCESSOR_RESTORE_EXPECTED_CACHE_KEY=' + key)
          print('MMIBKR_SUCCESSOR_RESTORE_EXPECTED_SHA256=' + sha)
          PY

      - name: Materialize exact private MM-IBKR source for successor restore acceptance
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$CANONICAL_SOURCE_REF" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source'
          node = json.loads((root / 'materialization-host.json').read_text(encoding='utf-8'))
          if node.get('ok') is not True:
              raise SystemExit('source materialization not ok')
          if node.get('source_sha') != os.environ['CANONICAL_SOURCE_REF']:
              raise SystemExit('private source SHA mismatch')
          if node.get('source_transport') != 'fleet_authority_exact_sha_encrypted_snapshot_vault':
              raise SystemExit('reusable encrypted source-vault transport required')
          if node.get('private_repository_token_used') is not False:
              raise SystemExit('private repository token unexpectedly used')
          if node.get('broker_credentials_used') is not False:
              raise SystemExit('broker credentials unexpectedly used')
          if node.get('plaintext_emitted') is not False:
              raise SystemExit('plaintext source emission contract violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution authority unexpectedly enabled')
          source_root = Path(node['source_root'])
          if not (source_root / 'Dockerfile.bot').is_file():
              raise SystemExit('materialized source layout incomplete')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD=' + node['source_sha'] + '\n')
              fh.write('PRIVATE_SOURCE_ROOT=' + str(source_root) + '\n')
          print('MMIBKR_SUCCESSOR_RESTORE_PRIVATE_HEAD=' + node['source_sha'])
          PY

      - name: Build exact private MM-IBKR image for successor restore acceptance
        run: |
          set -euo pipefail
          docker build \
            -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot" \
            --target bot \
            -t "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            "$PRIVATE_SOURCE_ROOT" >/dev/null

      - name: Validate exact private checkpoint restore owners
        run: |
          set -euo pipefail
          docker run --rm "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            python -m unittest -v \
              tests.test_selected_runtime_signal_history_contract_v1 \
              tests.test_runtime_market_data_cache_checkpoint_v1

      - name: Prepare successor restore directories
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-verify"

      - name: Restore exact accepted predecessor checkpoint cache
        id: restore_exact_predecessor
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ steps.restore_request.outputs.checkpoint_key }}
          fail-on-cache-miss: true

      - name: Verify accepted predecessor archive identity
        id: verify_predecessor
        env:
          EXPECTED_SHA256: ${{ steps.restore_request.outputs.checkpoint_sha256 }}
          EXPECTED_CACHE_KEY: ${{ steps.restore_request.outputs.checkpoint_key }}
          RESTORED_CACHE_KEY: ${{ steps.restore_exact_predecessor.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.restore_exact_predecessor.outputs.cache-hit }}
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test "$CACHE_HIT" = 'true'
          test "$RESTORED_CACHE_KEY" = "$EXPECTED_CACHE_KEY"
          test -r "$checkpoint"
          actual="$(sha256sum "$checkpoint" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "checkpoint_sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "checkpoint_cache_key=$RESTORED_CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_SUCCESSOR_RESTORE_ARCHIVE_SHA256=$actual"
          echo "MMIBKR_SUCCESSOR_RESTORE_EXACT_CACHE_HIT=1"

      - name: Restore canonical market-data state from accepted predecessor
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint:ro" \
            "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            python scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              --repo-root /app \
              --restore-archive /checkpoint/latest.tgz

      - name: Validate restored predecessor terminal continuity
        id: terminal_continuity
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            python - <<'PY' > "$RUNNER_TEMP/mmibkr-restore-terminal-continuity.env"
          import json
          from pathlib import Path

          path = Path(
              '/app/data/strategy_runtime/selected_runtime_cloud_cycle_v1/terminal_boundaries.json'
          )
          if not path.is_file():
              raise SystemExit('restored predecessor terminal continuity missing')
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.selected_runtime_cloud_cycle_terminal_ledger.v1':
              raise SystemExit('restored predecessor terminal continuity schema mismatch')
          entries = node.get('entries') if isinstance(node.get('entries'), dict) else {}
          if not entries:
              raise SystemExit('restored predecessor terminal continuity has no entries')
          if not all(
              isinstance(row, dict) and row.get('terminal') is True
              for row in entries.values()
          ):
              raise SystemExit('restored predecessor terminal continuity contains nonterminal entry')
          for key in (
              'account_state_included',
              'positions_included',
              'orders_included',
              'credentials_included',
              'execution_authority_included',
          ):
              if node.get(key) is not False:
                  raise SystemExit(
                      'restored predecessor terminal continuity safety boundary violated:' + key
                  )
          print('ENTRY_COUNT=' + str(len(entries)))
          PY

          cat "$RUNNER_TEMP/mmibkr-restore-terminal-continuity.env"
          entry_count="$(sed -n 's/^ENTRY_COUNT=//p' "$RUNNER_TEMP/mmibkr-restore-terminal-continuity.env")"
          test -n "$entry_count"
          echo "entry_count=$entry_count" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_SUCCESSOR_RESTORE_TERMINAL_ENTRY_COUNT=$entry_count"

      - name: Rebuild canonical checkpoint plan from restored state
        id: restored_plan
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            -v "$RUNNER_TEMP/mmibkr-verify:/verify" \
            "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            python scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              --repo-root /app \
              --data-root /app/data \
              --manifest-output /verify/restored-plan.json \
              --archive-output /verify/rebuilt.tgz

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-verify:/verify" \
            "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            sh -lc "chown -R $uid:$gid /verify"

          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-verify' / 'restored-plan.json'
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.runtime_market_data_cache_checkpoint.v1':
              raise SystemExit('restored checkpoint plan schema mismatch')
          if node.get('ok') is not True:
              raise SystemExit('restored checkpoint plan incomplete')
          if node.get('signal_history_contract_index_included') is not True:
              raise SystemExit('restored signal-history index missing')
          if node.get('terminal_boundary_continuity_included') is not True:
              raise SystemExit('restored terminal-boundary continuity missing from checkpoint plan')
          if node.get('missing_required_files') not in ([], None):
              raise SystemExit('restored checkpoint has missing required files')
          files = [row for row in (node.get('files') or []) if isinstance(row, dict)]
          symbols = {
              str(row.get('symbol') or '')
              for row in files
              if row.get('kind') == 'source_cache'
          }
          if not {'AMAT', 'APH', 'MNQ'}.issubset(symbols):
              raise SystemExit('restored checkpoint symbol coverage incomplete')
          forbidden = (
              'account_state_included',
              'positions_included',
              'orders_included',
              'credentials_included',
              'execution_authority_included',
          )
          if any(node.get(key) is not False for key in forbidden):
              raise SystemExit('restored checkpoint privacy boundary violated')
          print('MMIBKR_SUCCESSOR_RESTORE_FILE_COUNT=' + str(int(node.get('file_count') or 0)))
          print('MMIBKR_SUCCESSOR_RESTORE_SYMBOLS=' + ','.join(sorted(symbols)))
          PY

          rebuilt="$RUNNER_TEMP/mmibkr-verify/rebuilt.tgz"
          test -r "$rebuilt"
          rebuilt_sha="$(sha256sum "$rebuilt" | awk '{print $1}')"
          file_count="$(python - <<'PY'
          import json, os
          from pathlib import Path
          node = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'mmibkr-verify' / 'restored-plan.json')
              .read_text(encoding='utf-8')
          )
          print(int(node.get('file_count') or 0))
          PY
          )"
          echo "rebuilt_sha256=$rebuilt_sha" >> "$GITHUB_OUTPUT"
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"

      - name: Validate restored signal-history identity
        id: signal_history
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
            python - <<'PY' > "$RUNNER_TEMP/mmibkr-restore-signal-history.env"
          import json
          from pathlib import Path

          path = Path(
              '/app/data/strategy_runtime/selected_runtime_signal_history_contracts_v1/latest.json'
          )
          node = json.loads(path.read_text(encoding='utf-8'))
          rows = node.get('runtimes') if isinstance(node.get('runtimes'), dict) else {}
          if node.get('schema') != 'mmibkr.selected_runtime_signal_history_contracts.v1':
              raise SystemExit('restored signal-history schema mismatch')
          if node.get('ok') is not True:
              raise SystemExit('restored signal-history not ok')
          if str(node.get('public_run_id') or '') != '35407829303':
              raise SystemExit('restored signal-history public run mismatch')
          if int(node.get('runtime_count') or 0) != 3 or len(rows) != 3:
              raise SystemExit('restored signal-history runtime count mismatch')
          if not all(
              isinstance(row, dict) and row.get('warmup_ready') is True
              for row in rows.values()
          ):
              raise SystemExit('restored signal-history warmup not ready')
          for key in (
              'execution_authority_included',
              'execution_contract_values_included',
              'account_state_included',
              'positions_included',
              'orders_included',
              'credentials_included',
              'broker_action',
          ):
              if node.get(key) is not False:
                  raise SystemExit('restored signal-history safety boundary violated:' + key)
          print('PUBLIC_RUN_ID=' + str(node.get('public_run_id')))
          print('RUNTIME_COUNT=' + str(int(node.get('runtime_count') or 0)))
          PY

          cat "$RUNNER_TEMP/mmibkr-restore-signal-history.env"
          while IFS='=' read -r key value; do
            case "$key" in
              PUBLIC_RUN_ID)
                echo "public_run_id=$value" >> "$GITHUB_OUTPUT"
                ;;
              RUNTIME_COUNT)
                echo "runtime_count=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < "$RUNNER_TEMP/mmibkr-restore-signal-history.env"

      - name: Publish sanitized successor restore acceptance receipt
        env:
          CHECKPOINT_CACHE_KEY: ${{ steps.verify_predecessor.outputs.checkpoint_cache_key }}
          CHECKPOINT_SHA256: ${{ steps.verify_predecessor.outputs.checkpoint_sha256 }}
          REBUILT_SHA256: ${{ steps.restored_plan.outputs.rebuilt_sha256 }}
          FILE_COUNT: ${{ steps.restored_plan.outputs.file_count }}
          SIGNAL_PUBLIC_RUN_ID: ${{ steps.signal_history.outputs.public_run_id }}
          SIGNAL_RUNTIME_COUNT: ${{ steps.signal_history.outputs.runtime_count }}
          TERMINAL_ENTRY_COUNT: ${{ steps.terminal_continuity.outputs.entry_count }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/mmibkr-successor-restore-acceptance-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path

          node = {
              'schema': 'mmibkr.successor_restore_acceptance.v1',
              'ok': True,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'public_head': os.environ['GITHUB_SHA'],
              'private_head': os.environ['PRIVATE_HEAD'],
              'source_public_run_id': os.environ['SIGNAL_PUBLIC_RUN_ID'],
              'runtime_count': int(os.environ['SIGNAL_RUNTIME_COUNT']),
              'checkpoint_cache_key': os.environ['CHECKPOINT_CACHE_KEY'],
              'checkpoint_sha256': os.environ['CHECKPOINT_SHA256'],
              'restored_checkpoint_plan_file_count': int(os.environ['FILE_COUNT']),
              'restored_checkpoint_rebuild_sha256': os.environ['REBUILT_SHA256'],
              'exact_cache_key_restored': True,
              'exact_sha256_verified_before_restore': True,
              'canonical_restore_executed': True,
              'canonical_checkpoint_plan_rebuilt': True,
              'signal_history_index_validated': True,
              'terminal_boundary_continuity_validated': True,
              'terminal_boundary_entry_count': int(os.environ['TERMINAL_ENTRY_COUNT']),
              'warmup_ready': True,
              'broker_action': False,
              'paper_owner_started': False,
              'runtime_execution_contract_mutated': False,
              'live_execution_allowed': False,
              'credentials_included': False,
              'private_source_included': False,
              'account_state_included': False,
              'positions_included': False,
              'orders_included': False,
          }
          Path(
              os.environ['RUNNER_TEMP'],
              'mmibkr-successor-restore-acceptance-receipt.json',
          ).write_text(json.dumps(node, sort_keys=True) + '\n', encoding='utf-8')
          PY

          content="$(base64 -w0 "$receipt")"
          path="$RECEIPT_ROOT/$GITHUB_RUN_ID-mmibkr-successor-restore-acceptance.json"
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$path" \
            -f "message=runtime: publish sanitized successor restore acceptance receipt" \
            -f "content=$content" \
            -f "branch=$EXCHANGE_REF" >/dev/null
          echo "MMIBKR_SUCCESSOR_RESTORE_ACCEPTANCE_RECEIPT_PATH=$path"

      - name: Destroy successor restore private runtime material
        if: always()
        run: |
          set +e
          uid="$(id -u)"
          gid="$(id -g)"
          if docker image inspect "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" >/dev/null 2>&1; then
            docker run --rm \
              -v "$RUNNER_TEMP/mmibkr-data:/cleanup-data" \
              -v "$RUNNER_TEMP/mmibkr-checkpoint:/cleanup-checkpoint" \
              -v "$RUNNER_TEMP/mmibkr-verify:/cleanup-verify" \
              "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" \
              sh -lc "chown -R $uid:$gid /cleanup-data /cleanup-checkpoint /cleanup-verify" \
              >/dev/null 2>&1 || true
          fi
          rm -rf \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-verify" \
            "$RUNNER_TEMP/mmibkr-restore-signal-history.env" \
            "$RUNNER_TEMP/mmibkr-restore-terminal-continuity.env" \
            "$RUNNER_TEMP/mmibkr-successor-restore-acceptance-receipt.json"
          docker image rm "mmibkr-successor-restore-acceptance:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

          for path in \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-verify"; do
            if [ -e "$path" ]; then
              echo "successor restore cleanup residue: $path" >&2
              exit 1
            fi
          done
          echo "MMIBKR_SUCCESSOR_RESTORE_PRIVATE_RUNTIME_MATERIAL_DESTROYED=1"


  signal_history_reconciliation:
    if: ${{ github.event_name == 'push' && needs.route.outputs.mode == 'signal_history_reconciliation' }}
    needs:
      - contract
      - route
    environment: ibkr-paper-runtime-r1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: mmibkr-selected-runtime-cloud-signal-history-reconciliation-r1
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SOURCE_REF: d81df85788ebb6be6d4d69b9b9a537be96f16507
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Resolve exact signal-history reconciliation request
        id: reconcile_request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          fire = Path(
              'rendezvous/fire/mmibkr-selected-runtime-cloud-signal-history-reconciliation-r1'
          )
          node = json.loads(fire.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.selected_runtime_cloud_signal_history_reconciliation_fire.v1':
              raise SystemExit('signal-history reconciliation fire schema mismatch')
          if str(node.get('source_ref') or '').lower() != os.environ['CANONICAL_SOURCE_REF']:
              raise SystemExit('signal-history reconciliation private source mismatch')
          if str(node.get('source_public_run_id') or '') != os.environ['INITIAL_BACKFILL_RUN_ID']:
              raise SystemExit('signal-history reconciliation public run mismatch')

          key = str(node.get('expected_checkpoint_cache_key') or '').strip()
          sha = str(node.get('expected_checkpoint_sha256') or '').strip().lower()
          prefix = os.environ['CHECKPOINT_CACHE_PREFIX']
          if not key.startswith(prefix):
              raise SystemExit('reconciliation checkpoint key must use canonical prefix')
          if len(sha) != 64 or any(ch not in '0123456789abcdef' for ch in sha):
              raise SystemExit('reconciliation checkpoint SHA256 invalid')

          conflicts = node.get('expected_conflicts')
          if not isinstance(conflicts, list) or not conflicts:
              raise SystemExit('reconciliation expected conflicts required')
          if not all(isinstance(value, str) and '@' in value for value in conflicts):
              raise SystemExit('reconciliation expected conflict token invalid')
          if len(set(conflicts)) != len(conflicts):
              raise SystemExit('reconciliation expected conflicts must be unique')

          for key_name in (
              'broker_action',
              'paper_owner_started',
              'live_execution_allowed',
              'market_data_overwrite_allowed',
          ):
              if node.get(key_name) is not False:
                  raise SystemExit('reconciliation safety boundary violated:' + key_name)

          conflict_dir = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-reconcile-expected'
          conflict_dir.mkdir(parents=True, exist_ok=True)
          conflict_path = conflict_dir / 'expected-conflicts.json'
          conflict_path.write_text(
              json.dumps(conflicts, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write('checkpoint_key=' + key + '\n')
              fh.write('checkpoint_sha256=' + sha + '\n')
              fh.write('expected_conflict_count=' + str(len(conflicts)) + '\n')
          print('MMIBKR_SIGNAL_HISTORY_RECONCILE_EXPECTED_CACHE_KEY=' + key)
          print('MMIBKR_SIGNAL_HISTORY_RECONCILE_EXPECTED_SHA256=' + sha)
          print('MMIBKR_SIGNAL_HISTORY_RECONCILE_EXPECTED_CONFLICTS=' + str(len(conflicts)))
          PY

      - name: Materialize exact private MM-IBKR source for reconciliation
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$CANONICAL_SOURCE_REF" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source'
          node = json.loads((root / 'materialization-host.json').read_text(encoding='utf-8'))
          if node.get('ok') is not True:
              raise SystemExit('source materialization not ok')
          if node.get('source_sha') != os.environ['CANONICAL_SOURCE_REF']:
              raise SystemExit('private source SHA mismatch')
          if node.get('source_transport') != 'fleet_authority_exact_sha_encrypted_snapshot_vault':
              raise SystemExit('reusable encrypted source-vault transport required')
          if node.get('private_repository_token_used') is not False:
              raise SystemExit('private repository token unexpectedly used')
          if node.get('broker_credentials_used') is not False:
              raise SystemExit('broker credentials unexpectedly used')
          if node.get('plaintext_emitted') is not False:
              raise SystemExit('plaintext source emission contract violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution authority unexpectedly enabled')

          source_root = Path(node['source_root'])
          if not (source_root / 'Dockerfile.bot').is_file():
              raise SystemExit('materialized source layout incomplete')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD=' + node['source_sha'] + '\n')
              fh.write('PRIVATE_SOURCE_ROOT=' + str(source_root) + '\n')
          print('MMIBKR_SIGNAL_HISTORY_RECONCILE_PRIVATE_HEAD=' + node['source_sha'])
          PY

      - name: Build exact private MM-IBKR image for reconciliation
        run: |
          set -euo pipefail
          docker build \
            -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot" \
            --target bot \
            -t "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            "$PRIVATE_SOURCE_ROOT" >/dev/null

      - name: Validate private reconciliation dependencies
        run: |
          set -euo pipefail
          docker run --rm "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python -m unittest -v \
              tests.test_selected_runtime_initial_backfill_ingest_v1 \
              tests.test_selected_runtime_signal_history_contract_v1 \
              tests.test_runtime_market_data_cache_checkpoint_v1

      - name: Prepare reconciliation directories
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-seed-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-reconcile-input" \
            "$RUNNER_TEMP/mmibkr-reconcile-verify" \
            "$RUNNER_TEMP/mmibkr-reconcile-diagnostic"

      - name: Restore exact terminal-aware predecessor checkpoint
        id: reconcile_restore
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ steps.reconcile_request.outputs.checkpoint_key }}
          fail-on-cache-miss: true

      - name: Verify exact predecessor archive before reconciliation
        id: reconcile_verify_predecessor
        env:
          EXPECTED_SHA256: ${{ steps.reconcile_request.outputs.checkpoint_sha256 }}
          EXPECTED_CACHE_KEY: ${{ steps.reconcile_request.outputs.checkpoint_key }}
          RESTORED_CACHE_KEY: ${{ steps.reconcile_restore.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.reconcile_restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test "$CACHE_HIT" = 'true'
          test "$RESTORED_CACHE_KEY" = "$EXPECTED_CACHE_KEY"
          test -r "$checkpoint"
          actual="$(sha256sum "$checkpoint" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "checkpoint_sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "checkpoint_cache_key=$RESTORED_CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "MMIBKR_SIGNAL_HISTORY_RECONCILE_PREDECESSOR_SHA256=$actual"

      - name: Restore canonical predecessor data
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint:ro" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              --repo-root /app \
              --restore-archive /checkpoint/latest.tgz

      - name: Validate predecessor terminal continuity
        id: reconcile_terminal
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python - <<'PY' > "$RUNNER_TEMP/mmibkr-reconcile-terminal.env"
          import json
          from pathlib import Path

          path = Path(
              '/app/data/strategy_runtime/selected_runtime_cloud_cycle_v1/terminal_boundaries.json'
          )
          if not path.is_file():
              raise SystemExit('reconciliation predecessor terminal continuity missing')
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.selected_runtime_cloud_cycle_terminal_ledger.v1':
              raise SystemExit('reconciliation terminal continuity schema mismatch')
          entries = node.get('entries') if isinstance(node.get('entries'), dict) else {}
          if not entries or not all(
              isinstance(row, dict) and row.get('terminal') is True
              for row in entries.values()
          ):
              raise SystemExit('reconciliation terminal continuity incomplete')
          for key in (
              'account_state_included',
              'positions_included',
              'orders_included',
              'credentials_included',
              'execution_authority_included',
          ):
              if node.get(key) is not False:
                  raise SystemExit('reconciliation terminal safety boundary:' + key)
          print('ENTRY_COUNT=' + str(len(entries)))
          PY
          cat "$RUNNER_TEMP/mmibkr-reconcile-terminal.env"
          entry_count="$(sed -n 's/^ENTRY_COUNT=//p' "$RUNNER_TEMP/mmibkr-reconcile-terminal.env")"
          test -n "$entry_count"
          echo "entry_count=$entry_count" >> "$GITHUB_OUTPUT"

      - name: Download exact validated B1 seed artifact
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/mmibkr-reconcile-input"
          gh run download "$INITIAL_BACKFILL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$INITIAL_BACKFILL_ARTIFACT" \
            --dir "$input"
          for name in \
            ibkr-cloudflare-envelope-receipt.json \
            ibkr-post-auth-handoff.json \
            ibkr-forward-bars-v2.jsonl; do
            test -s "$input/$name"
          done
          echo 'MMIBKR_SIGNAL_HISTORY_RECONCILE_SEED_DOWNLOADED=1'

      - name: Validate seed independently on isolated clean data root
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/mmibkr-reconcile-input"
          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            -v "$RUNNER_TEMP/mmibkr-seed-data:/seed-data" \
            -v "$input:/input:ro" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python scripts/operator/selected_runtime_initial_backfill_ingest_v1.py \
              --repo-root /app \
              --data-root /seed-data \
              --bars /input/ibkr-forward-bars-v2.jsonl \
              --handoff /input/ibkr-post-auth-handoff.json \
              --fleet-receipt /input/ibkr-cloudflare-envelope-receipt.json \
              --output /seed-data/strategy_runtime/selected_runtime_initial_backfill_v1/latest.json

      - name: Reconcile signal-history metadata without rewriting forward bars
        id: reconcile_metadata
        run: |
          set -euo pipefail
          docker run --rm \
            -w /app \
            -e PYTHONPATH=/app \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data" \
            -v "$RUNNER_TEMP/mmibkr-seed-data:/seed-data:ro" \
            -v "$RUNNER_TEMP/mmibkr-reconcile-input:/input:ro" \
            -v "$RUNNER_TEMP/mmibkr-reconcile-expected:/expected:ro" \
            -v "$RUNNER_TEMP/mmibkr-reconcile-diagnostic:/diagnostic" \
            -v "$GITHUB_WORKSPACE/scripts/mmibkr_signal_history_metadata_reconcile_v1.py:/public/mmibkr_signal_history_metadata_reconcile_v1.py:ro" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python /public/mmibkr_signal_history_metadata_reconcile_v1.py \
              --repo-root /app \
              --real-data-root /app/data \
              --seed-data-root /seed-data \
              --bars /input/ibkr-forward-bars-v2.jsonl \
              --seed-ingest /seed-data/strategy_runtime/selected_runtime_initial_backfill_v1/latest.json \
              --seed-index /seed-data/strategy_runtime/selected_runtime_signal_history_contracts_v1/latest.json \
              --expected-public-run-id "$INITIAL_BACKFILL_RUN_ID" \
              --expected-conflicts-json /expected/expected-conflicts.json \
              --conflicts-output /diagnostic/conflicts.json \
              --output /app/data/strategy_runtime/selected_runtime_signal_history_reconciliation_v1/latest.json

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python -c "from pathlib import Path; import sys; sys.stdout.buffer.write(Path('/app/data/strategy_runtime/selected_runtime_signal_history_reconciliation_v1/latest.json').read_bytes())" \
            > "$RUNNER_TEMP/mmibkr-signal-history-reconciliation.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          node = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'mmibkr-signal-history-reconciliation.json')
              .read_text(encoding='utf-8')
          )
          if node.get('schema') != 'mmibkr.signal_history_metadata_reconciliation.v1':
              raise SystemExit('reconciliation result schema mismatch')
          if node.get('ok') is not True:
              raise SystemExit('reconciliation result not ok')
          if node.get('market_data_cache_mutated') is not False:
              raise SystemExit('reconciliation mutated market data cache')
          if node.get('artifact_bars_written_to_real_cache') is not False:
              raise SystemExit('reconciliation wrote seed bars to real cache')
          if node.get('execution_authority_mutated') is not False:
              raise SystemExit('reconciliation mutated execution authority')
          if node.get('broker_action') is not False:
              raise SystemExit('reconciliation broker boundary violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('reconciliation live boundary violated')
          expected = int(os.environ['EXPECTED_CONFLICT_COUNT'])
          if int(node.get('conflicting_overlap_rows') or -1) != expected:
              raise SystemExit('reconciliation conflict count changed')
          evidence = node.get('runtime_evidence')
          if not isinstance(evidence, dict) or len(evidence) != 3:
              raise SystemExit('reconciliation runtime evidence incomplete')
          if not all(
              isinstance(row, dict)
              and isinstance(row.get('warmup'), dict)
              and row['warmup'].get('ready') is True
              for row in evidence.values()
          ):
              raise SystemExit('reconciliation real-cache warmup not ready')
          print('MMIBKR_SIGNAL_HISTORY_RECONCILIATION_CONFLICTS=' + str(expected))
          PY
        env:
          EXPECTED_CONFLICT_COUNT: ${{ steps.reconcile_request.outputs.expected_conflict_count }}

      - name: Publish sanitized signal-history conflict diagnostic
        if: ${{ always() }}
        env:
          DIAGNOSTIC_ROOT: rendezvous/diagnostics
        run: |
          set -euo pipefail
          diagnostic="$RUNNER_TEMP/mmibkr-reconcile-diagnostic/conflicts.json"
          if [ ! -s "$diagnostic" ]; then
            echo 'MMIBKR_SIGNAL_HISTORY_CONFLICT_DIAGNOSTIC=not_available'
            exit 0
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-reconcile-diagnostic' / 'conflicts.json'
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.signal_history_conflict_diagnostic.v1':
              raise SystemExit('signal-history conflict diagnostic schema mismatch')
          for key in (
              'market_data_cache_mutated',
              'artifact_bars_written_to_real_cache',
              'execution_authority_mutated',
              'broker_action',
              'paper_owner_started',
              'live_execution_allowed',
              'credentials_included',
              'account_state_included',
              'positions_included',
              'orders_included',
          ):
              if node.get(key) is not False:
                  raise SystemExit('signal-history conflict diagnostic safety boundary:' + key)
          print('MMIBKR_SIGNAL_HISTORY_CONFLICT_COUNT=' + str(int(node.get('conflict_count') or 0)))
          print(
              'MMIBKR_SIGNAL_HISTORY_CONFLICT_SET_MATCH='
              + str(bool(node.get('expected_conflict_set_match'))).lower()
          )
          print(
              'MMIBKR_SIGNAL_HISTORY_CONFLICTS_BY_SYMBOL='
              + json.dumps(node.get('conflicts_by_symbol') or {}, sort_keys=True)
          )
          PY

          payload="$(base64 -w0 "$diagnostic")"
          path="$DIAGNOSTIC_ROOT/$GITHUB_RUN_ID-mmibkr-signal-history-conflicts.json"
          body="$(python - "$payload" <<'PY'
          import json, sys
          print(json.dumps({
              'message': 'runtime: publish sanitized MM-IBKR signal-history conflict diagnostic',
              'content': sys.argv[1],
              'branch': 'rendezvous-exchange',
          }))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$path" \
            -d "$body" >/dev/null
          echo "MMIBKR_SIGNAL_HISTORY_CONFLICT_DIAGNOSTIC_PATH=$path"

      - name: Build reconciled terminal-plus-signal checkpoint
        id: reconciled_checkpoint
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          rm -f "$checkpoint"
          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-data:/app/data:ro" \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
            -v "$RUNNER_TEMP/mmibkr-reconcile-verify:/verify" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            python scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              --repo-root /app \
              --data-root /app/data \
              --manifest-output /verify/reconciled-plan.json \
              --archive-output /checkpoint/latest.tgz

          docker run --rm \
            -v "$RUNNER_TEMP/mmibkr-checkpoint:/checkpoint" \
            -v "$RUNNER_TEMP/mmibkr-reconcile-verify:/verify" \
            "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
            sh -lc "chown -R $uid:$gid /checkpoint /verify && chmod 600 /checkpoint/latest.tgz"

          python - <<'PY'
          import json, os
          from pathlib import Path

          plan = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'mmibkr-reconcile-verify' / 'reconciled-plan.json')
              .read_text(encoding='utf-8')
          )
          if plan.get('ok') is not True:
              raise SystemExit('reconciled checkpoint plan incomplete')
          if plan.get('signal_history_contract_index_included') is not True:
              raise SystemExit('reconciled checkpoint missing signal-history index')
          if plan.get('terminal_boundary_continuity_included') is not True:
              raise SystemExit('reconciled checkpoint missing terminal continuity')
          if plan.get('missing_required_files') not in ([], None):
              raise SystemExit('reconciled checkpoint has missing files')
          files = [row for row in (plan.get('files') or []) if isinstance(row, dict)]
          symbols = {
              str(row.get('symbol') or '')
              for row in files
              if row.get('kind') == 'source_cache'
          }
          if not {'AMAT', 'APH', 'MNQ'}.issubset(symbols):
              raise SystemExit('reconciled checkpoint source coverage incomplete')
          print('MMIBKR_SIGNAL_HISTORY_RECONCILE_FILE_COUNT=' + str(int(plan.get('file_count') or 0)))
          PY

          checkpoint_sha256="$(sha256sum "$checkpoint" | awk '{print $1}')"
          echo "sha256=$checkpoint_sha256" >> "$GITHUB_OUTPUT"

      - name: Save reconciled checkpoint
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-signal-history-reconciled

      - name: Delete local reconciled checkpoint before readback
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test ! -e "$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"

      - name: Restore exact reconciled checkpoint
        id: restore_reconciled
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-checkpoint
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-signal-history-reconciled
          fail-on-cache-miss: true

      - name: Verify reconciled checkpoint round-trip
        id: verify_reconciled
        env:
          EXPECTED_SHA256: ${{ steps.reconciled_checkpoint.outputs.sha256 }}
          CACHE_HIT: ${{ steps.restore_reconciled.outputs.cache-hit }}
          CACHE_KEY: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ github.run_id }}-${{ env.PRIVATE_HEAD }}-signal-history-reconciled
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/mmibkr-checkpoint/latest.tgz"
          test "$CACHE_HIT" = 'true'
          test -r "$checkpoint"
          actual="$(sha256sum "$checkpoint" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "checkpoint_sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "checkpoint_cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo 'MMIBKR_SIGNAL_HISTORY_RECONCILE_CHECKPOINT_ROUNDTRIP=1'

      - name: Publish sanitized signal-history reconciliation receipt
        env:
          PREDECESSOR_CACHE_KEY: ${{ steps.reconcile_verify_predecessor.outputs.checkpoint_cache_key }}
          PREDECESSOR_SHA256: ${{ steps.reconcile_verify_predecessor.outputs.checkpoint_sha256 }}
          RECONCILED_CACHE_KEY: ${{ steps.verify_reconciled.outputs.checkpoint_cache_key }}
          RECONCILED_SHA256: ${{ steps.verify_reconciled.outputs.checkpoint_sha256 }}
          TERMINAL_ENTRY_COUNT: ${{ steps.reconcile_terminal.outputs.entry_count }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/mmibkr-signal-history-reconciliation-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'mmibkr-signal-history-reconciliation.json')
              .read_text(encoding='utf-8')
          )
          node = {
              'schema': 'mmibkr.signal_history_reconciliation_receipt.v1',
              'ok': True,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'public_head': os.environ['GITHUB_SHA'],
              'private_head': os.environ['PRIVATE_HEAD'],
              'source_public_run_id': result.get('source_public_run_id'),
              'predecessor_checkpoint_cache_key': os.environ['PREDECESSOR_CACHE_KEY'],
              'predecessor_checkpoint_sha256': os.environ['PREDECESSOR_SHA256'],
              'reconciled_checkpoint_cache_key': os.environ['RECONCILED_CACHE_KEY'],
              'reconciled_checkpoint_sha256': os.environ['RECONCILED_SHA256'],
              'terminal_boundary_entry_count': int(os.environ['TERMINAL_ENTRY_COUNT']),
              'conflicting_overlap_rows': result.get('conflicting_overlap_rows'),
              'conflicts': result.get('conflicts'),
              'conflict_policy': result.get('conflict_policy'),
              'market_data_cache_mutated': False,
              'artifact_bars_written_to_real_cache': False,
              'signal_history_metadata_written': result.get('signal_history_metadata_written'),
              'exact_predecessor_restored': True,
              'exact_reconciled_checkpoint_roundtrip': True,
              'terminal_boundary_continuity_validated': True,
              'signal_history_contract_index_validated': True,
              'broker_action': False,
              'paper_owner_started': False,
              'execution_authority_mutated': False,
              'live_execution_allowed': False,
              'credentials_included': False,
              'private_source_included': False,
              'account_state_included': False,
              'positions_included': False,
              'orders_included': False,
          }
          receipt = Path(
              os.environ['RUNNER_TEMP'],
              'mmibkr-signal-history-reconciliation-receipt.json',
          )
          receipt.write_text(json.dumps(node, sort_keys=True) + '\n', encoding='utf-8')
          PY

          content="$(base64 -w0 "$receipt")"
          path="$RECEIPT_ROOT/$GITHUB_RUN_ID-mmibkr-signal-history-reconciliation.json"
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$path" \
            -f "message=runtime: publish sanitized signal-history reconciliation receipt" \
            -f "content=$content" \
            -f "branch=$EXCHANGE_REF" >/dev/null
          echo "MMIBKR_SIGNAL_HISTORY_RECONCILIATION_RECEIPT_PATH=$path"

      - name: Destroy reconciliation private runtime material
        if: always()
        run: |
          set +e
          uid="$(id -u)"
          gid="$(id -g)"
          if docker image inspect "mmibkr-signal-reconcile:$GITHUB_RUN_ID" >/dev/null 2>&1; then
            docker run --rm \
              -v "$RUNNER_TEMP/mmibkr-data:/cleanup-data" \
              -v "$RUNNER_TEMP/mmibkr-seed-data:/cleanup-seed" \
              -v "$RUNNER_TEMP/mmibkr-checkpoint:/cleanup-checkpoint" \
              -v "$RUNNER_TEMP/mmibkr-reconcile-verify:/cleanup-verify" \
              "mmibkr-signal-reconcile:$GITHUB_RUN_ID" \
              sh -lc "chown -R $uid:$gid /cleanup-data /cleanup-seed /cleanup-checkpoint /cleanup-verify" \
              >/dev/null 2>&1 || true
          fi
          rm -rf \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-seed-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-reconcile-input" \
            "$RUNNER_TEMP/mmibkr-reconcile-verify" \
            "$RUNNER_TEMP/mmibkr-reconcile-diagnostic" \
            "$RUNNER_TEMP/mmibkr-reconcile-expected" \
            "$RUNNER_TEMP/mmibkr-reconcile-terminal.env" \
            "$RUNNER_TEMP/mmibkr-signal-history-reconciliation.json" \
            "$RUNNER_TEMP/mmibkr-signal-history-reconciliation-receipt.json"
          docker image rm "mmibkr-signal-reconcile:$GITHUB_RUN_ID" >/dev/null 2>&1 || true

          for path in \
            "$RUNNER_TEMP/mmibkr-source" \
            "$RUNNER_TEMP/mmibkr-data" \
            "$RUNNER_TEMP/mmibkr-seed-data" \
            "$RUNNER_TEMP/mmibkr-checkpoint" \
            "$RUNNER_TEMP/mmibkr-reconcile-input" \
            "$RUNNER_TEMP/mmibkr-reconcile-verify" \
            "$RUNNER_TEMP/mmibkr-reconcile-diagnostic"; do
            if [ -e "$path" ]; then
              echo "signal-history reconciliation cleanup residue: $path" >&2
              exit 1
            fi
          done
          echo 'MMIBKR_SIGNAL_HISTORY_RECONCILIATION_PRIVATE_RUNTIME_MATERIAL_DESTROYED=1'
