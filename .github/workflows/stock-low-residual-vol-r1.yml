name: Stock Low Residual Vol R1

on:
  push:
    branches: [main]
    paths:
      - "scripts/stock_low_residual_vol_r1.py"
      - ".github/workflows/stock-low-residual-vol-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run frozen cross-industry low residual-volatility test
        run: python scripts/stock_low_residual_vol_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-low-residual-vol-r1-${{ github.sha }}
          path: results/stock_low_residual_vol_r1.json
          if-no-files-found: error
          retention-days: 90
