name: MMIBKR Original Encrypted Checkpoint Readonly Review R1

# New fixed-purpose non-broker review consumer of existing public-encrypted
# transport, not a parallel live owner, Gateway, or generic compute launcher.
# Security/Release approval is required before publishing the encrypted
# historical checkpoint to the existing public Source Vault branch.
on:
  workflow_dispatch:
    inputs:
      confirm_readonly_checkpoint_review:
        description: 'Explicit security-approved exact original checkpoint AES-GCM classification, no Pi/Gateway/broker changes'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  original-checkpoint-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_readonly_checkpoint_review }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned original checkpoint cryptography dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Fetch exact encrypted 39499524894 checkpoint from approved source vault
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base='https://raw.githubusercontent.com/XoticHaze/mm-ibkr-runtime/mmibkr-source-vault/checkpoint-vault/run39499524894'
          mkdir -p "$RUNNER_TEMP/original-checkpoint-review"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 90 \
            "$base/checkpoint.enc" -o "$RUNNER_TEMP/original-checkpoint-review/checkpoint.enc"
          test "$(wc -c < "$RUNNER_TEMP/original-checkpoint-review/checkpoint.enc" | tr -d ' ')" = 33560349
          echo 'MMIBKR_PINNED_ENCRYPTED_INPUT_ACQUIRED=1'
      - name: Materialize exact original manifest only from protected GitHub secret
        env:
          ORIGINAL_MANIFEST_B64: ${{ secrets.MMIBKR_ORIGINAL_CHECKPOINT_39499524894_MANIFEST_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PYCODE'
          import base64, os
          from pathlib import Path
          value=os.environ.get('ORIGINAL_MANIFEST_B64') or ''
          if not value or len(value)>16384:
              raise SystemExit('PROTECTED_HISTORICAL_MANIFEST_MISSING_OR_OVERSIZED')
          try:
              original=base64.b64decode(value,validate=True)
          except Exception:
              raise SystemExit('PROTECTED_HISTORICAL_MANIFEST_INVALID_ENCODING')
          if not 0<len(original)<=8192:
              raise SystemExit('PROTECTED_HISTORICAL_MANIFEST_INVALID_LENGTH')
          dest=Path(os.environ['RUNNER_TEMP'])/'original-checkpoint-review'/'manifest.json'
          with dest.open('xb') as out:
              out.write(original)
          dest.chmod(0o600)
          print('MMIBKR_PRIVATE_MANIFEST_PRESENT=1')
          PYCODE
      - name: Authenticate checkpoint in memory and return bounded encrypted quarantine
        env:
          MMIBKR_LIVE_GATEWAY_WARM_KEY_B64: ${{ secrets.MMIBKR_LIVE_GATEWAY_WARM_KEY_B64 }}
          PI_RECIPIENT_PUBLIC_B64: ${{ vars.MMIBKR_PI_RECIPIENT_PUBLIC_B64 }}
          APPROVED_PI_RECIPIENT_KEY_ID: ${{ vars.MMIBKR_PI_RECIPIENT_APPROVED_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$MMIBKR_LIVE_GATEWAY_WARM_KEY_B64"
          test -n "$PI_RECIPIENT_PUBLIC_B64"
          test -n "$APPROVED_PI_RECIPIENT_KEY_ID"
          python -m scripts.mmibkr_original_live_checkpoint_review_v1 \
            --ciphertext "$RUNNER_TEMP/original-checkpoint-review/checkpoint.enc" \
            --manifest "$RUNNER_TEMP/original-checkpoint-review/manifest.json" \
            --consumer-run-id "$GITHUB_RUN_ID" \
            --recipient-public-b64 "$PI_RECIPIENT_PUBLIC_B64" \
            --approved-recipient-key-id "$APPROVED_PI_RECIPIENT_KEY_ID" \
            --capsule-dir "$RUNNER_TEMP/original-checkpoint-review/sealed-botdata" \
            --output "$RUNNER_TEMP/original-checkpoint-review/sanitized.json"
          test -s "$RUNNER_TEMP/original-checkpoint-review/sanitized.json"
      - name: Return sanitized audit and recipient-encrypted botdata quarantine only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-original-checkpoint-readonly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/original-checkpoint-review/sanitized.json
            ${{ runner.temp }}/original-checkpoint-review/sealed-botdata/ciphertext.bin
            ${{ runner.temp }}/original-checkpoint-review/sealed-botdata/envelope.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete ciphertext and classified output from ephemeral runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/original-checkpoint-review"
          test ! -e "$RUNNER_TEMP/original-checkpoint-review"
          echo 'MMIBKR_ORIGINAL_CHECKPOINT_EPHEMERAL_CLEANUP=PASS'
