name: p16-sector-breadth-gate

on:
  pull_request:
    paths:
      - 'research/p16_sector_breadth_gate_20260907.py'
      - '.github/workflows/p16-sector-breadth-gate.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install fixed research dependencies
        run: python -m pip install 'numpy==2.3.2' 'pandas==2.3.1'
      - name: Compile frozen discriminator
        run: python -m py_compile research/p16_sector_breadth_gate_20260907.py
      - name: Execute frozen discriminator
        run: python research/p16_sector_breadth_gate_20260907.py
