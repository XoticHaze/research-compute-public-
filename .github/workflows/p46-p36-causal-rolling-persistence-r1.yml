name: P46 P36 Causal Rolling Persistence R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_causal_rolling_persistence_r1.py'
      - '.github/workflows/p46-p36-causal-rolling-persistence-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_causal_rolling_persistence_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_causal_rolling_persistence_r1.json')); a=x['tests']['36m']; b=x['tests']['60m']; vals={'decision':x['decision'],'m36':f"{a['positive_fraction_matched']:.3f}",'q36':f"{a['positive_fraction_qqq']:.3f}",'m60':f"{b['positive_fraction_matched']:.3f}",'q60':f"{b['positive_fraction_qqq']:.3f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-roll__${{ steps.evaluate.outputs.decision }}__m36_${{ steps.evaluate.outputs.m36 }}__q36_${{ steps.evaluate.outputs.q36 }}__m60_${{ steps.evaluate.outputs.m60 }}__q60_${{ steps.evaluate.outputs.q60 }}
          path: artifacts/p46_p36_causal_rolling_persistence_r1.json
          if-no-files-found: error
