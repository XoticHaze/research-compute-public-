name: P120-P127 Industry Model Family Transport R1
on:
  pull_request:
    paths:
      - 'research/p104_p111_crossasset_model_family_tournament_r1.py'
      - 'research/p120_p127_industry_model_family_transport_r1.py'
      - '.github/workflows/p120-p127-industry-model-family-transport-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65 scikit-learn==1.5.2
      - run: python research/p120_p127_industry_model_family_transport_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p120-p127-industry-model-family-transport-r1
          path: artifacts/p120_p127_industry_model_family_transport_r1.json
          if-no-files-found: error
