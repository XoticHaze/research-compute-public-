name: IBKR Read Latency Evidence CI

on:
  push:
    branches:
      - assistant/ibkr-read-latency-evidence-20260918
    paths:
      - scripts/ibkr_post_auth_pipeline_v1.py
      - tests/test_ibkr_post_auth_pipeline_contracts_v1.py
      - .github/workflows/ibkr-read-latency-evidence-ci.yml
  pull_request:
    paths:
      - scripts/ibkr_post_auth_pipeline_v1.py
      - tests/test_ibkr_post_auth_pipeline_contracts_v1.py
      - .github/workflows/ibkr-read-latency-evidence-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check "ib_insync==0.9.86" pandas
      - name: Compile
        run: python -m py_compile scripts/ibkr_post_auth_pipeline_v1.py
      - name: Focused contracts
        run: python -m unittest tests.test_ibkr_post_auth_pipeline_contracts_v1 -v
