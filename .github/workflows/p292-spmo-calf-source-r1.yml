name: P292 SPMO CALF Source R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p292_spmo_calf_source_r1.py'
      - '.github/workflows/p292-spmo-calf-source-r1.yml'
permissions: {contents: read}
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p292_spmo_calf_source_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p292_spmo_calf_source_r1.json')); s=x['summary']; tag=f"{x['decision']}__matched_{s['positive_matched_blocks']}__fidelity_{s['high_fidelity_symbols']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p292-spmo-calf-source__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p292_spmo_calf_source_r1.json
          if-no-files-found: error
