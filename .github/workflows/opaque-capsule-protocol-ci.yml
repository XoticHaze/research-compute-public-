name: Opaque Capsule Protocol CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/opaque_bidirectional_capsule_v1.py'
      - 'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/opaque_bidirectional_capsule_smoke_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/commandcenter_ephemeral_exchange_cleanup_v1.py'
      - 'tests/test_commandcenter_ephemeral_exchange_cleanup_v1.py'
      - 'scripts/public_compute_memory_scratch_v1.py'
      - 'tests/test_public_compute_memory_scratch_v1.py'
      - 'scripts/commandcenter_neutral_gate_ephemeral_consumer_v1.py'
      - 'tests/test_commandcenter_neutral_gate_canonical_envelope_v1.py'
      - 'scripts/commandcenter_neutral_gate_canonical_sender_v1.py'
      - 'tests/test_commandcenter_neutral_gate_canonical_sender_v1.py'
      - 'scripts/commandcenter_public_exchange_redacted_inventory_v1.py'
      - 'tests/test_commandcenter_public_exchange_redacted_inventory_v1.py'
      - '.github/workflows/commandcenter-ledger-ephemeral-rendezvous.yml'
      - '.github/workflows/commandcenter-ledger-ephemeral-rendezvous.yml'
      - 'docs/opaque-compute-profile-v1.md'
      - '.github/workflows/opaque-capsule-protocol-ci.yml'
      - 'proof/fire/opaque/**'
  pull_request:
    paths:
      - 'scripts/opaque_bidirectional_capsule_v1.py'
      - 'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/opaque_bidirectional_capsule_smoke_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/commandcenter_ephemeral_exchange_cleanup_v1.py'
      - 'tests/test_commandcenter_ephemeral_exchange_cleanup_v1.py'
      - 'scripts/public_compute_memory_scratch_v1.py'
      - 'tests/test_public_compute_memory_scratch_v1.py'
      - 'scripts/commandcenter_neutral_gate_ephemeral_consumer_v1.py'
      - 'tests/test_commandcenter_neutral_gate_canonical_envelope_v1.py'
      - 'scripts/commandcenter_neutral_gate_canonical_sender_v1.py'
      - 'tests/test_commandcenter_neutral_gate_canonical_sender_v1.py'
      - 'scripts/commandcenter_public_exchange_redacted_inventory_v1.py'
      - 'tests/test_commandcenter_public_exchange_redacted_inventory_v1.py'
      - '.github/workflows/commandcenter-ledger-ephemeral-rendezvous.yml'
      - '.github/workflows/commandcenter-ledger-ephemeral-rendezvous.yml'
      - 'docs/opaque-compute-profile-v1.md'
      - '.github/workflows/opaque-capsule-protocol-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1 jsonschema==4.25.1
      - name: Compile
        run: |
          python -m py_compile             scripts/opaque_bidirectional_capsule_v1.py             scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py             scripts/opaque_bidirectional_capsule_smoke_v1.py             scripts/commandcenter_ephemeral_exchange_cleanup_v1.py
      - name: Test
        run: |
          python -m unittest -q             tests.test_opaque_bidirectional_capsule_v1             tests.test_opaque_bidirectional_capsule_p256_aesgcm_v1             tests.test_commandcenter_ephemeral_exchange_cleanup_v1
      - name: Verify guest memory-backed private scratch preflight and cleanup
        run: |
          set -euo pipefail
          sudo -n swapoff -a || { echo "PUBLIC_COMPUTE_SWAP=FAIL_CLOSED"; exit 1; }
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_public_compute_memory_scratch_v1
      - name: Verify neutral policy consumer canonical encrypted-source execution
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_commandcenter_neutral_gate_canonical_envelope_v1
      - name: Verify private in-memory canonical producer and public fixed-source consumer
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_commandcenter_neutral_gate_canonical_sender_v1
      - name: Verify redacted storage inventory regression suite
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_commandcenter_public_exchange_redacted_inventory_v1
      - name: Audit real public exchange tree without printing file data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B scripts/commandcenter_public_exchange_redacted_inventory_v1.py --live
      - name: Execute opaque roundtrip
        run: python scripts/opaque_bidirectional_capsule_smoke_v1.py
      - name: Upload encrypted result envelope only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-result-envelope
          path: opaque-result-envelope.json
          if-no-files-found: error
