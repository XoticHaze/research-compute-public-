name: Opaque Capsule Protocol CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/opaque_bidirectional_capsule_v1.py'
      - 'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/opaque_bidirectional_capsule_smoke_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'docs/opaque-compute-profile-v1.md'
      - '.github/workflows/opaque-capsule-protocol-ci.yml'
  pull_request:
    paths:
      - 'scripts/opaque_bidirectional_capsule_v1.py'
      - 'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/opaque_bidirectional_capsule_smoke_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'docs/opaque-compute-profile-v1.md'
      - '.github/workflows/opaque-capsule-protocol-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Compile
        run: |
          python -m py_compile             scripts/opaque_bidirectional_capsule_v1.py             scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py             scripts/opaque_bidirectional_capsule_smoke_v1.py
      - name: Test
        run: |
          python -m unittest -q             tests.test_opaque_bidirectional_capsule_v1             tests.test_opaque_bidirectional_capsule_p256_aesgcm_v1
      - name: Execute opaque roundtrip
        run: python scripts/opaque_bidirectional_capsule_smoke_v1.py
      - name: Upload encrypted result envelope only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-result-envelope
          path: opaque-result-envelope.json
          if-no-files-found: error
