name: P113 SPY Overnight R1
on:
  pull_request:
    paths:
      - 'research/p113_spy_overnight_r1.py'
      - '.github/workflows/p113-spy-overnight-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p113_spy_overnight_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p113_spy_overnight_r1.json')); t=x['tests']['2020']['costs']['2']; vals={'decision':x['decision'],'spy':f"{100*t['excess_spy']:.2f}",'intraday':f"{100*t['excess_intraday']:.2f}",'folds':str(t['positive_spy_folds'])}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in vals.items(): f.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p113-overnight__${{ steps.evaluate.outputs.decision }}__SPY_${{ steps.evaluate.outputs.spy }}pp__intraday_${{ steps.evaluate.outputs.intraday }}pp__folds_${{ steps.evaluate.outputs.folds }}of5
          path: artifacts/p113_spy_overnight_r1.json
          if-no-files-found: error
