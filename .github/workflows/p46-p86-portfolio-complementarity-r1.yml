name: P46 P86 Portfolio Complementarity R1
on:
  pull_request:
    paths:
      - 'research/p46_p86_portfolio_complementarity_r1.py'
      - '.github/workflows/p46-p86-portfolio-complementarity-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p86_portfolio_complementarity_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p86_portfolio_complementarity_r1.json')); t=x['tests']['2020_forward']
          vals={'decision':x['decision'],'excess_p86':f"{100*t['blend_excess_cagr_vs_p86']:.2f}",'excess_qqq':f"{100*t['blend_excess_cagr_vs_qqq']:.2f}",'sharpe_p86':f"{t['blend_sharpe_delta_vs_p86']:.2f}",'folds':str(t['positive_folds_vs_p86'])}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-p86-complementarity__${{ steps.evaluate.outputs.decision }}__excessP86_${{ steps.evaluate.outputs.excess_p86 }}pp__excessQQQ_${{ steps.evaluate.outputs.excess_qqq }}pp__sharpeDelta_${{ steps.evaluate.outputs.sharpe_p86 }}__folds_${{ steps.evaluate.outputs.folds }}of5
          path: artifacts/p46_p86_portfolio_complementarity_r1.json
          if-no-files-found: error
