name: P138 Six Month Momentum Direct Alpha R1
on:
  pull_request:
    paths:
      - 'research/p138_six_month_momentum_direct_alpha_r1.py'
      - '.github/workflows/p138-six-month-momentum-direct-alpha-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65 scikit-learn==1.5.2
      - run: python research/p138_six_month_momentum_direct_alpha_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p138-six-month-momentum-direct-alpha-r1
          path: artifacts/p138_six_month_momentum_direct_alpha_r1.json
          if-no-files-found: error
