name: MR Global Infra Beta-Matched 20260911 R1
on:
  pull_request:
    paths:
      - 'research/mr_global_infra_beta_matched_20260911_r1.py'
      - '.github/workflows/mr-global-infra-beta-matched-20260911-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: eval
        run: |
          python research/mr_global_infra_beta_matched_20260911_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/mr_global_infra_beta_matched_20260911_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-global-infra-beta-matched__${{ steps.eval.outputs.decision }}
          path: research/artifacts/mr_global_infra_beta_matched_20260911_r1.json
          if-no-files-found: error
