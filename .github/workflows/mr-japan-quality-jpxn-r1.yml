name: MR Japan Quality JPXN R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mr_japan_quality_jpxn_r1.py'
      - '.github/workflows/mr-japan-quality-jpxn-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas numpy yfinance
      - id: result
        run: |
          python research/mr_japan_quality_jpxn_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/mr_japan_quality_jpxn_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-japan-quality-jpxn-r1__${{ steps.result.outputs.tag }}
          path: research/artifacts/mr_japan_quality_jpxn_r1.json
          if-no-files-found: error
          retention-days: 90