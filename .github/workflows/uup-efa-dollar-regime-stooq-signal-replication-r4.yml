name: UUP EFA Dollar Regime Stooq Signal Replication R4
on:
  pull_request:
    paths:
      - 'research/uup_efa_dollar_regime_stooq_signal_replication_r4.py'
      - '.github/workflows/uup-efa-dollar-regime-stooq-signal-replication-r4.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check pandas==2.3.3 requests==2.32.5
      - run: set -o pipefail; python research/uup_efa_dollar_regime_stooq_signal_replication_r4.py | tee uup_efa_dollar_regime_stooq_signal_replication_r4_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uup-efa-dollar-regime-stooq-signal-replication-r4-result
          path: uup_efa_dollar_regime_stooq_signal_replication_r4_result.txt
          retention-days: 30
