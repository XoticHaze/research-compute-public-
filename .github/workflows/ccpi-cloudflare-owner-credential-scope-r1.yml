name: CCPI Cloudflare Existing Credential Scope (Read-Only)

# CC uses the existing typed GitHub-public fire route. No Mac commands,
# locally held credentials, Cloudflare mutations, key creation or Pi changes.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ccpi-cloudflare-owner-credential-scope-r1.yml'
      - 'scripts/ccpi_cloudflare_cc_token_scope_probe_v1.py'
      - 'tests/test_ccpi_cloudflare_cc_token_scope_probe_v1.py'
  push:
    branches: [main]
    paths:
      - 'rendezvous/fire/ccpi-cloudflare-owner-credential-scope-r1'
      - '.github/workflows/ccpi-cloudflare-owner-credential-scope-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpi-cloudflare-owner-credential-scope-r1
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: |
          set -euo pipefail
          python -m unittest -v tests.test_ccpi_cloudflare_cc_token_scope_probe_v1
          python -m py_compile scripts/ccpi_cloudflare_cc_token_scope_probe_v1.py

  read-only-account-scope:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CC_CF_ORIGINAL_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CC_CF_R2_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN_R2 }}
      CC_CF_LEGACY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CCPI_SCOPE_PROBE_RECEIPT: ${{ runner.temp }}/ccpi-cloudflare-readonly-scope-receipt.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify public source-safe bounded probe
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_ccpi_cloudflare_cc_token_scope_probe_v1
          python -m py_compile scripts/ccpi_cloudflare_cc_token_scope_probe_v1.py
      - name: Read existing Cloudflare credential scopes via CC GitHub executor
        run: |
          set -euo pipefail
          python scripts/ccpi_cloudflare_cc_token_scope_probe_v1.py
          test -s "$CCPI_SCOPE_PROBE_RECEIPT"
      - name: Preserve sanitized read-only receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ccpi-cloudflare-cc-readonly-scope-${{ github.run_id }}
          path: ${{ runner.temp }}/ccpi-cloudflare-readonly-scope-receipt.json
          retention-days: 7
          if-no-files-found: error
