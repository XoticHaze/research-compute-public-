name: P141 SPY IEF Risk Parity R1
on:
  pull_request:
    paths:
      - 'research/p141_spy_ief_risk_parity_r1.py'
      - '.github/workflows/p141-spy-ief-risk-parity-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p141_spy_ief_risk_parity_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p141_spy_ief_risk_parity_r1.json')); t=x['tests']['2015']['50']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\n"); f.write(f"matched={100*t['excess_matched']:.2f}\n"); f.write(f"sixty40={100*t['excess_6040']:.2f}\n"); f.write(f"sharpe={t['net']['sharpe_rf0']:.2f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p141-spy-ief-risk-parity__${{ steps.run.outputs.decision }}__matched_${{ steps.run.outputs.matched }}pp__6040_${{ steps.run.outputs.sixty40 }}pp__sharpe_${{ steps.run.outputs.sharpe }}
          path: artifacts/p141_spy_ief_risk_parity_r1.json
          if-no-files-found: error
