name: NQ dated-contract trend transport R1

on:
  push:
    branches:
      - market-research/nq-dated-trend-transport-r1-20260913
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record provenance
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "source_artifact_id=10294324888"
          echo "experiment_id=NQ-DATED-TREND-TRANSPORT-R1"
      - name: Download released F1a dated-contract corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/staging
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10294324888/zip > /tmp/staging.zip
          unzip -q /tmp/staging.zip -d input/staging
      - name: Execute frozen NQ dated-contract transport falsifier
        run: python research/nq_dated_trend_transport_r1.py
      - name: Upload scientific result
        uses: actions/upload-artifact@v4
        with:
          name: nq-dated-trend-transport-r1-result
          path: nq-dated-trend-transport-r1-result.json
          if-no-files-found: error
