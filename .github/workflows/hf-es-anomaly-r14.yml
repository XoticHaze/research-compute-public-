name: Hugging Face ES Anomaly R14
on:
  pull_request:
    paths:
      - 'research/hf_es_anomaly_r14.py'
      - '.github/workflows/hf-es-anomaly-r14.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q pandas==2.2.3 pyarrow==17.0.0 huggingface_hub==0.34.4
      - name: Diagnose ESZ25 source rows
        run: python research/hf_es_anomaly_r14.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-es-anomaly-r14
          path: hf_es_anomaly_r14.json
          if-no-files-found: error
          retention-days: 90
