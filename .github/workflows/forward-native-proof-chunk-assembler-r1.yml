name: Forward Native Proof Chunk Assembler R1

on:
  push:
    branches:
      - 'assistant/forward-native-full-roundtrip-r1'
    paths:
      - '.github/workflows/forward-native-proof-chunk-assembler-r1.yml'

permissions:
  contents: write

jobs:
  assemble-homebuilders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXCHANGE_REF: rendezvous-exchange
      RUN_ID: '34718621166'
      HARNESS: homebuilders_adaptive_duration_v1
      PART_ROOT: rendezvous/proof-chunks/34718621166/homebuilders_adaptive_duration_v1
      RESPONSE_PATH: rendezvous/responses/34718621166/homebuilders_adaptive_duration_v1-input.json
    steps:
      - uses: actions/checkout@v4
      - name: Wait for encrypted envelope parts and assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/envelope.json"
          for n in 01 02 03 04 05 06 07; do
            path="${PART_ROOT}/part-${n}.txt"
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
            found=0
            for _ in $(seq 1 180); do
              if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -o "$RUNNER_TEMP/part-${n}.txt"; then
                found=1
                break
              fi
              sleep 2
            done
            test "$found" = 1 || { echo "MISSING_PART=${n}"; exit 42; }
            cat "$RUNNER_TEMP/part-${n}.txt" >> "$RUNNER_TEMP/envelope.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path(os.environ['RUNNER_TEMP'],'envelope.json').read_text())
          assert x['schema']=='forward-native-ephemeral-x25519-v1'
          assert str(x['run_id'])==os.environ['RUN_ID']
          assert x['harness']==os.environ['HARNESS']
          assert x['authority']=='research_only'
          print('ENCRYPTED_HOME_BUILDERS_ENVELOPE_ASSEMBLY=PASS')
          print('plaintext_sha256='+x['plaintext_sha256'])
          PY
      - name: Publish assembled encrypted source capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${RESPONSE_PATH}"
          payload="$(base64 -w0 "$RUNNER_TEMP/envelope.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: assemble encrypted Homebuilders proof capsule','content':content,'branch':branch}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body" >/dev/null
          echo 'ENCRYPTED_HOME_BUILDERS_CAPSULE_PUBLISHED=true'
