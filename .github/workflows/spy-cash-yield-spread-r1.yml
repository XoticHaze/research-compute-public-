name: SPY Cash Yield Spread R1

on:
  push:
    paths:
      - 'research/spy_cash_yield_spread_r1.py'
      - '.github/workflows/spy-cash-yield-spread-r1.yml'
  pull_request:
    paths:
      - 'research/spy_cash_yield_spread_r1.py'
      - '.github/workflows/spy-cash-yield-spread-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed environment
        run: python -m pip install --disable-pip-version-check -q yfinance pandas numpy
      - name: Compile frozen discriminator
        run: python -m py_compile research/spy_cash_yield_spread_r1.py
      - name: Execute frozen discriminator
        run: python research/spy_cash_yield_spread_r1.py | tee spy_cash_yield_spread_r1_result.txt
      - name: Retain result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spy-cash-yield-spread-r1-result
          path: spy_cash_yield_spread_r1_result.txt
          retention-days: 30
          if-no-files-found: error
