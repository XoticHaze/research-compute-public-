name: P46 P64 Fixed Utility R1
on:
  pull_request:
    paths:
      - 'research/p46_p64_fixed_utility_r1.py'
      - '.github/workflows/p46-p64-fixed-utility-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p46_p64_fixed_utility_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p64_fixed_utility_r1.json')); t=x['tests']['2020'];
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\n")
            f.write(f"matched={100*t['excess_vs_matched']:.2f}\n")
            f.write(f"qqq={100*t['excess_vs_qqq']:.2f}\n")
            f.write(f"sp46={t['delta_sharpe_vs_p46']:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-p64-fixed-utility__${{ steps.run.outputs.decision }}__matched_${{ steps.run.outputs.matched }}pp__qqq_${{ steps.run.outputs.qqq }}pp__dSharpeP46_${{ steps.run.outputs.sp46 }}
          path: artifacts/p46_p64_fixed_utility_r1.json
          if-no-files-found: error
