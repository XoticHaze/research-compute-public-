name: P570 P06 Rare Marginal Tilt R1

on:
  pull_request:
    paths:
      - 'rendezvous/requests/p570-p06-*.txt'
      - '.github/workflows/p570-p06-rare-marginal-tilt-r1.yml'
      - 'scripts/p570_p06_ephemeral_consumer_v1.py'

permissions:
  contents: write

env:
  EXCHANGE_REF: rendezvous-exchange
  RECIPIENT_ROOT: rendezvous/recipients
  RESPONSE_ROOT: rendezvous/responses
  HARNESS: research_foundry_p06_slow_funding_216_v1

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography numpy pandas scikit-learn
      - name: Compile fixed consumer
        run: python -m py_compile scripts/p570_p06_ephemeral_consumer_v1.py
      - name: Generate one-run P570 compute recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'p570-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          record={
            'schema':'p06-slow-funding-ephemeral-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'harness':os.environ['HARNESS'],
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
          }
          Path(os.environ['RUNNER_TEMP'],'p570-recipient.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          print('P570_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('P570_RECIPIENT_KEY_ID='+record['recipient_key_id'])
          PY
      - name: Publish one-run recipient to exchange branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-p570-p06.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/p570-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish one-run P570 recipient','content':content,'branch':branch}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body" >/dev/null
          echo "P570_RECIPIENT_PATH=${path}"
      - name: Wait for run-bound encrypted P06 capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/p570-p06-input.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -o "$RUNNER_TEMP/p570-input.json"; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound encrypted P570 source capsule did not arrive'; exit 42; }
      - name: Execute private P570 capsule
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/p570_p06_ephemeral_consumer_v1.py \
            --envelope "$RUNNER_TEMP/p570-input.json" \
            --private-key "$RUNNER_TEMP/p570-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --receipt artifacts/p570_p06_public_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: p570-p06-rare-marginal-tilt-receipt
          path: artifacts/p570_p06_public_receipt.json
          if-no-files-found: error
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/p570-private.b64" "$RUNNER_TEMP/p570-recipient.json" "$RUNNER_TEMP/p570-input.json"
