name: P02 Model Lab XGBoost Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/p02-model-lab-xgboost-*.txt'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography numpy pandas scikit-learn xgboost
      - name: Compile fixed binding
        run: |
          python -m py_compile scripts/ephemeral_x25519_chunked_v1.py
          python -m py_compile scripts/p02_model_lab_xgboost_capsule_consumer_v1.py
      - name: Generate and publish one-run recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'p02-private.b64').write_text(base64.b64encode(private_raw).decode())
          recipient={'schema':'p02-model-lab-xgboost-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'recipient_b64':base64.b64encode(public_raw).decode(),'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest()}
          Path(os.environ['RUNNER_TEMP'],'p02-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          PY
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-p02-model-lab-xgboost.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/p02-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish P02 Model Lab recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" -d "$body" >/dev/null
          echo "P02_RECIPIENT_PATH=${path}"
      - name: Wait for run-bound envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${root}/p02-model-lab-xgboost-envelope.json?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/p02-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound P02 envelope did not arrive'; exit 42; }
          echo "P02_RESPONSE_ROOT=${root}" >> "$GITHUB_ENV"
      - name: Reassemble ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          env=json.loads(Path(os.environ['RUNNER_TEMP'],'p02-envelope.json').read_text())
          pieces=[]
          for node in env['chunks']:
            path=node['path']
            if not path.startswith(os.environ['P02_RESPONSE_ROOT']+'/'): raise SystemExit('invalid chunk path')
            url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref={os.environ['EXCHANGE_REF']}"
            raw=urlopen(Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json'})).read()
            if hashlib.sha256(raw).hexdigest()!=node['sha256']: raise SystemExit('chunk digest mismatch')
            pieces.append(raw.decode())
          raw=base64.b64decode(''.join(pieces),validate=True)
          Path(os.environ['RUNNER_TEMP'],'p02-ciphertext.bin').write_bytes(raw)
          PY
      - name: Execute fixed P02 first consumer
        run: python scripts/p02_model_lab_xgboost_capsule_consumer_v1.py --envelope "$RUNNER_TEMP/p02-envelope.json" --ciphertext "$RUNNER_TEMP/p02-ciphertext.bin" --private-key "$RUNNER_TEMP/p02-private.b64" --run-id "$GITHUB_RUN_ID" --response-root "$P02_RESPONSE_ROOT"
      - name: Remove private material
        if: always()
        run: rm -f "$RUNNER_TEMP/p02-private.b64" "$RUNNER_TEMP/p02-recipient.json" "$RUNNER_TEMP/p02-envelope.json" "$RUNNER_TEMP/p02-ciphertext.bin"
