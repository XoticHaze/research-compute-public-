name: P265 Sector Low Vol R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p265_sector_lowvol_r1.py'
      - '.github/workflows/p265-sector-lowvol-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p265_sector_lowvol_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p265_sector_lowvol_r1.json')); a=x['tests']['2001']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__matched_{bp(a['matched_excess_cagr'])}__folds_{a['positive_matched_folds']}__dd_{bp(a['candidate']['maxdd']-a['matched_equalweight']['maxdd'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p265-sector-lowvol__${{ steps.eval.outputs.tag }}
          path: artifacts/p265_sector_lowvol_r1.json
          if-no-files-found: error
