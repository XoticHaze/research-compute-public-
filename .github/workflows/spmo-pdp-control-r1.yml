name: SPMO PDP Matched Control R1
on:
  pull_request:
    paths:
      - '.github/workflows/spmo-pdp-control-r1.yml'
      - 'research/spmo-pdp-control-r1.json'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Evaluate frozen SPMO vs PDP matched-control hypothesis
        run: |
          python - <<'PY'
          import json,urllib.request,datetime as dt,math
          from pathlib import Path
          c=json.loads(Path('research/spmo-pdp-control-r1.json').read_text()); st=dt.datetime.fromisoformat(c['start']+'T00:00:00+00:00'); en=dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=1)
          def fetch(s):
              u=f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?period1={int(st.timestamp())}&period2={int(en.timestamp())}&interval=1d&events=history&includeAdjustedClose=true"; req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as q:o=json.load(q)['chart']['result'][0]
              a=o['indicators'].get('adjclose',[{}])[0].get('adjclose') or o['indicators']['quote'][0]['close']; return {dt.datetime.fromtimestamp(t,dt.timezone.utc).date().isoformat():float(p) for t,p in zip(o['timestamp'],a) if p is not None}
          syms=['SPMO','PDP','SPY']; px={s:fetch(s) for s in syms}; ds=sorted(set.intersection(*(set(px[s]) for s in syms))); months={}
          for d in ds:months.setdefault(d[:7],[]).append(d)
          rows=[]
          for m,z in sorted(months.items()):
              if len(z)<10:continue
              r={'month':m}
              for s in syms:r[s.lower()]=px[s][z[-1]]/px[s][z[0]]-1
              rows.append(r)
          def cagr(z,k):
              v=1.0
              for r in z:v*=1+r[k]
              return v**(12/max(len(z),1))-1
          def excess(z):return cagr(z,'spmo')-cagr(z,'pdp')
          def reg(z):
              y=[r['spmo'] for r in z]; x1=[r['spy'] for r in z]; x2=[r['pdp'] for r in z]; n=len(z); my=sum(y)/n;m1=sum(x1)/n;m2=sum(x2)/n
              s11=sum((a-m1)**2 for a in x1);s22=sum((b-m2)**2 for b in x2);s12=sum((a-m1)*(b-m2) for a,b in zip(x1,x2));sy1=sum((yy-my)*(a-m1) for yy,a in zip(y,x1));sy2=sum((yy-my)*(b-m2) for yy,b in zip(y,x2));det=s11*s22-s12*s12
              if abs(det)<1e-18:raise RuntimeError('singular')
              b1=(sy1*s22-sy2*s12)/det;b2=(sy2*s11-sy1*s12)/det;alpha=my-b1*m1-b2*m2;res=[yy-(alpha+b1*a+b2*b) for yy,a,b in zip(y,x1,x2)];s2=sum(e*e for e in res)/max(n-3,1);inv00=1/n+(m1*m1*s22-2*m1*m2*s12+m2*m2*s11)/det;se=math.sqrt(max(s2*inv00,0))
              return {'alpha_ann':alpha*12,'alpha_tstat':alpha/se if se>0 else None,'beta_spy':b1,'beta_pdp':b2,'months':n}
          recent=[r for r in rows if r['month']>=c['recent_start'][:7]];yearly=[]
          for y in sorted({r['month'][:4] for r in rows}):
              z=[r for r in rows if r['month'].startswith(y)]
              if len(z)>=10:yearly.append({'year':y,'excess_vs_pdp':excess(z),'positive':excess(z)>0})
          cost=2*c['cost_bps']/10000;full=excess(rows)-cost;rec=excess(recent)-cost;fr=reg(rows);rr=reg(recent);pos=sum(x['positive'] for x in yearly);g=c['gates'];ok=full>=g['full_after_cost_excess_vs_pdp_min'] and rec>=g['recent_after_cost_excess_vs_pdp_min'] and pos>=g['min_positive_calendar_years_vs_pdp'] and fr['alpha_ann']>=g['full_residual_alpha_spy_pdp_min'] and rr['alpha_ann']>=g['recent_residual_alpha_spy_pdp_min']
          out={'schema':'spmo_pdp_control_result.v1','months':len(rows),'recent_months':len(recent),'full_after_cost_excess_vs_pdp_cagr':full,'recent_after_cost_excess_vs_pdp_cagr':rec,'positive_calendar_years_vs_pdp':pos,'full_spy_pdp_residual':fr,'recent_spy_pdp_residual':rr,'supports_second_momentum_control':ok,'yearly':yearly,'gates':g,'research_only':True};Path('spmo-pdp-control-r1-result.json').write_text(json.dumps(out,sort_keys=True,indent=2));print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: spmo-pdp-control-r1-result, path: spmo-pdp-control-r1-result.json, retention-days: 14}
