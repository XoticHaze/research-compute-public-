name: Stock Momentum Independent Transport R2
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/stock_momentum_independent_transport_r2.py'
      - '.github/workflows/stock-momentum-independent-transport-r2.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/stock_momentum_independent_transport_r2.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/stock_momentum_independent_transport_r2.json')); z=x['results']['2017']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__qmom_{bp(z['QMOM_vs_IWB']['matched_excess_cagr'])}_{z['QMOM_vs_IWB']['positive_matched_folds']}__spmo_{bp(z['SPMO_vs_SPY']['matched_excess_cagr'])}_{z['SPMO_vs_SPY']['positive_matched_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'tag={tag}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-momentum-independent__${{ steps.eval.outputs.tag }}
          path: research/artifacts/stock_momentum_independent_transport_r2.json
          if-no-files-found: error
