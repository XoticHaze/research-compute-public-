name: IBKR Warm-State Repair Validate

on:
  push:
    branches:
      - assistant/ibkr-cloud-warm-repair-20260916
    paths:
      - '.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml'
      - '.github/workflows/ibkr-warm-state-repair-validate.yml'
      - 'tests/test_ibkr_b1_warm_state_workflow_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-warm-state-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Validate workflow YAML and warm-state lifecycle contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml')
          node = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(node, dict) or 'jobs' not in node:
              raise SystemExit('workflow YAML did not parse into expected mapping')
          print('IBKR_WARM_REPAIR_YAML_VALID=1')
          PY
          python -m py_compile tests/test_ibkr_b1_warm_state_workflow_v2.py
          python -m unittest tests.test_ibkr_b1_warm_state_workflow_v2 -v
          echo 'IBKR_WARM_REPAIR_CONTRACT_VALID=1'
