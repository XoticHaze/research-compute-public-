name: Foundry Terminal Claim Release Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'release_acceptance/foundry_terminal_claims_20260912.json'
      - 'scripts/accept_foundry_terminal_claims.py'
      - '.github/workflows/foundry-terminal-claim-release-acceptance.yml'

permissions:
  contents: read

jobs:
  deterministic-release-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Validate sanitized Foundry terminal claims
        run: python scripts/accept_foundry_terminal_claims.py
