name: Recovery RC-001 Batch2 Development
on:
  push:
    branches: [assistant/recovery-queue-stagea-parity-20260905-r1]
    paths:
      - 'research/industry_opportunity_discovery_batch2_contract_20260905.json'
      - '.github/workflows/recovery-rc001-batch2-development.yml'
permissions:
  contents: read
jobs:
  batch2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Fetch exact public Stage-A adapter
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/run_stagea.py
          test "$(git hash-object .campaign/run_stagea.py)" = "9f7f802469dc6a33abd3431295d5232ebc4289c5"
          python -m py_compile .campaign/run_stagea.py
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute frozen Batch2 development screen
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('stagea','.campaign/run_stagea.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          c=json.loads(Path('research/industry_opportunity_discovery_batch2_contract_20260905.json').read_text())
          assert c['external_holdouts_loaded'] is False and c['research_only'] is True
          r=m._evaluate_matrix(c['families'],'2026-09-01T13:30:00+00:00')
          out={'schema':'research_compute_public.rc001_batch2_development.v1','source_contract':'research-foundry PR #271','adapter_git_blob':'9f7f802469dc6a33abd3431295d5232ebc4289c5','family_summary':r['family_summary'],'external_holdouts_loaded':False,'research_only':True,'promotion_authority':False,'runtime_mutation':False,'live_trading_change':False}
          Path('batch2-result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('=== BATCH2_DEVELOPMENT_RESULT ==='); print(json.dumps(out,sort_keys=True))
          PY
      - if: always()
        run: test ! -f batch2-result.json || cat batch2-result.json
