name: P29 External Delisting Confirmation
on:
  pull_request:
    paths:
      - 'research/p29c3_delisting_p31_yieldcurve_20260908.py'
      - '.github/workflows/p29-external-delisting-confirmation.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Execute frozen P29 C3
        run: python research/p29c3_delisting_p31_yieldcurve_20260908.py --child p29c3 --out p29-external-delisting-confirmation-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p29-external-delisting-confirmation-${{ github.run_id }}
          path: p29-external-delisting-confirmation-receipt.json
          if-no-files-found: error
          retention-days: 30
