name: P57 Corrected Concentration Product Acceptance

on:
  pull_request:
    paths:
      - 'product_contracts/p57_corrected_concentration/**'
      - '.github/workflows/p57-corrected-concentration-product-acceptance.yml'

permissions:
  contents: read

jobs:
  deterministic-product-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Execute P57 sanitized identity-bound product contract
        run: node --test product_contracts/p57_corrected_concentration/product_contract_acceptance.test.mjs
