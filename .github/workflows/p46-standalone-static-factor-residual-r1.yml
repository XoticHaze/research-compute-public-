name: P46 Standalone Static Factor Residual R1
on:
  pull_request:
    paths:
      - 'research/p46_standalone_static_factor_residual_r1.py'
      - '.github/workflows/p46-standalone-static-factor-residual-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_standalone_static_factor_residual_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('artifacts/p46_standalone_static_factor_residual_r1.json'))
          full=x['tests']['full']['all_static_universe_controls']
          recent=x['tests']['2022_forward']['all_static_universe_controls']
          vals={'decision':x['decision'],'full':f"{100*full['annualized_intercept']:.2f}",'recent':f"{100*recent['annualized_intercept']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-static-factor-residual__${{ steps.evaluate.outputs.decision }}__full_${{ steps.evaluate.outputs.full }}pct__recent_${{ steps.evaluate.outputs.recent }}pct
          path: artifacts/p46_standalone_static_factor_residual_r1.json
          if-no-files-found: error
