name: AutoTuner CRW Score-Core Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/autotuner-score-core-*.txt'
      - '.github/workflows/autotuner-score-core-ephemeral-rendezvous.yml'
      - 'scripts/autotuner_score_core_consumer_v1.py'
      - 'scripts/ephemeral_x25519_chunked_v1.py'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  PRODUCER_REQUEST_ROOT: rendezvous/producer-requests
  EXCHANGE_REF: rendezvous-exchange
  HARNESS: autotuner_crw_score_core_v1

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography pandas numpy numba
      - name: Compile fixed transport and consumer
        run: |
          python -m py_compile scripts/ephemeral_x25519_chunked_v1.py
          python -m py_compile scripts/autotuner_score_core_consumer_v1.py
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'autotuner-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={'schema':'autotuner-score-core-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'recipient_b64':base64.b64encode(public_raw).decode('ascii'),'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest()}
          Path(os.environ['RUNNER_TEMP'],'autotuner-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('AUTOTUNER_SCORE_CORE_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('AUTOTUNER_SCORE_CORE_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY
      - name: Publish recipient and producer request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recipient_path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-autotuner-score-core.json"
          request_path="${PRODUCER_REQUEST_ROOT}/${GITHUB_RUN_ID}-autotuner-score-core.json"
          response_root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          envelope_path="${response_root}/autotuner-score-core-envelope.json"
          upsert() {
            local remote="$1" local_file="$2" msg="$3"
            local api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${remote}"
            local sha=""
            sha="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=${EXCHANGE_REF}" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' || true)"
            python - "$local_file" "$msg" "$EXCHANGE_REF" "$sha" <<'PY' > "$RUNNER_TEMP/upsert.json"
          import base64,json,sys
          path,message,branch,sha=sys.argv[1:]
          body={'message':message,'content':base64.b64encode(open(path,'rb').read()).decode('ascii'),'branch':branch}
          if sha: body['sha']=sha
          print(json.dumps(body,separators=(',',':')))
          PY
            curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" -d @"$RUNNER_TEMP/upsert.json" >/dev/null
          }
          upsert "$recipient_path" "$RUNNER_TEMP/autotuner-recipient.json" 'rendezvous: publish AutoTuner score-core recipient'
          python - "$recipient_path" "$envelope_path" <<'PY' > "$RUNNER_TEMP/producer-request.json"
          import json,os,sys
          recipient_path,envelope_path=sys.argv[1:]
          print(json.dumps({
            'schema':'autotuner-score-core-producer-request-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'parent_id':'P01',
            'authority':'research_only',
            'harness':os.environ['HARNESS'],
            'dataset_sha256':'c04a95debfde500aa245d187a1d30620a88703113013a63af0c3553b0509e44e',
            'rows':192553,
            'scope':'score_core_only_dca_policy_held_out',
            'recipient_path':recipient_path,
            'expected_envelope_path':envelope_path,
            'exchange_ref':os.environ['EXCHANGE_REF'],
          },sort_keys=True))
          PY
          upsert "$request_path" "$RUNNER_TEMP/producer-request.json" 'rendezvous: publish AutoTuner score-core producer request'
          echo "AUTOTUNER_RECIPIENT_PATH=${recipient_path}"
          echo "AUTOTUNER_PRODUCER_REQUEST_PATH=${request_path}"
      - name: Wait for run-bound encrypted envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          envelope_path="${response_root}/autotuner-score-core-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${envelope_path}?ref=${EXCHANGE_REF}"
          expected_key="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"autotuner-recipient.json")))["recipient_key_id"])')"
          found=0
          for _ in $(seq 1 360); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/envelope.candidate.json"; then
              if python - "$RUNNER_TEMP/envelope.candidate.json" "$GITHUB_RUN_ID" "$expected_key" "$response_root" <<'PY'
          import base64,json,sys
          path,run_id,key,response_root=sys.argv[1:]
          try:
              d=json.load(open(path))
              required={'schema','run_id','authority','harness','recipient_key_id','sender_public_b64','nonce_b64','ciphertext_sha256','plaintext_sha256','chunks'}
              assert set(d)==required
              assert d['schema']=='autotuner-score-core-ephemeral-x25519-v1'
              assert str(d['run_id'])==str(run_id) and d['authority']=='research_only'
              assert d['harness']=='autotuner_crw_score_core_v1' and d['recipient_key_id']==key
              assert len(base64.b64decode(d['sender_public_b64'],validate=True))==32
              assert len(base64.b64decode(d['nonce_b64'],validate=True))==12
              chunks=d['chunks']; assert isinstance(chunks,list) and 0 < len(chunks) <= 64
              prefix=response_root.rstrip('/')+'/'
              for node in chunks:
                  assert set(node)=={'path','sha256','chars'}
                  assert str(node['path']).startswith(prefix) and int(node['chars'])>0
          except Exception:
              raise SystemExit(1)
          PY
              then mv "$RUNNER_TEMP/envelope.candidate.json" "$RUNNER_TEMP/envelope.json"; found=1; break; fi
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'valid AutoTuner envelope did not arrive'; exit 42; }
          echo "AUTOTUNER_RESPONSE_ROOT=${response_root}" >> "$GITHUB_ENV"
      - name: Reassemble authenticated ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          env=json.loads(Path(os.environ['RUNNER_TEMP'],'envelope.json').read_text())
          pieces=[]
          for node in env['chunks']:
              path=node['path']
              url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref={os.environ['EXCHANGE_REF']}"
              req=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json'})
              raw=urlopen(req,timeout=30).read()
              if len(raw)!=int(node['chars']) or hashlib.sha256(raw).hexdigest()!=node['sha256']: raise SystemExit('chunk identity mismatch')
              pieces.append(raw.decode('ascii'))
          ciphertext=base64.b64decode(''.join(pieces),validate=True)
          if hashlib.sha256(ciphertext).hexdigest()!=env['ciphertext_sha256']: raise SystemExit('ciphertext digest mismatch')
          Path(os.environ['RUNNER_TEMP'],'ciphertext.bin').write_bytes(ciphertext)
          PY
      - name: Decrypt and execute fixed AutoTuner score-core campaign
        run: |
          set -euo pipefail
          python scripts/autotuner_score_core_consumer_v1.py \
            --envelope "$RUNNER_TEMP/envelope.json" \
            --ciphertext "$RUNNER_TEMP/ciphertext.bin" \
            --private-key "$RUNNER_TEMP/autotuner-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --response-root "$AUTOTUNER_RESPONSE_ROOT" | tee "$RUNNER_TEMP/consumer.log"
          grep '^AUTOTUNER_SCORE_CORE_RECEIPT=' "$RUNNER_TEMP/consumer.log" | sed 's/^AUTOTUNER_SCORE_CORE_RECEIPT=//' > autotuner-score-core-receipt.json
          test -s autotuner-score-core-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('autotuner-score-core-receipt.json'))
          print('AUTOTUNER_SCORE_CORE_CALIBRATION='+r['calibration']['state'])
          print('AUTOTUNER_SCORE_CORE_CONFIGS='+str(r['search']['configuration_count']))
          print('AUTOTUNER_SCORE_CORE_STRONG='+str(r['strong_robust_count']))
          with open('autotuner-score-core-summary.md','w') as f:
              f.write('## AutoTuner CRW Score-Core\n\n')
              f.write(f"- Calibration: `{r['calibration']['state']}`\n")
              f.write(f"- Configurations: **{r['search']['configuration_count']}**\n")
              f.write(f"- Robust gate: **{r['robust_gate_count']}**\n")
              f.write(f"- Strong robust: **{r['strong_robust_count']}**\n")
              for c in r['strong_clusters'][:5]:
                  f.write(f"- W{c['window']} / exit {c['exit']}: support {c['support']}, entry {c['entry_min']}..{c['entry_max']}\n")
          PY
          cat autotuner-score-core-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: autotuner-score-core-receipt
          path: |
            autotuner-score-core-receipt.json
            autotuner-score-core-summary.md
          if-no-files-found: error
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/autotuner-private.b64" "$RUNNER_TEMP/autotuner-recipient.json" "$RUNNER_TEMP/producer-request.json" "$RUNNER_TEMP/upsert.json" "$RUNNER_TEMP/envelope.json" "$RUNNER_TEMP/envelope.candidate.json" "$RUNNER_TEMP/ciphertext.bin" "$RUNNER_TEMP/consumer.log"
