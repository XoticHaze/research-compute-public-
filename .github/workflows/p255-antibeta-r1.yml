name: P255 Anti Beta R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p255_antibeta_r1.py'
      - '.github/workflows/p255-antibeta-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p255_antibeta_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p255_antibeta_r1.json')); a=x['tests']['2012']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__cash_{bp(a['cash_excess_cagr'])}__folds_{a['positive_cash_folds']}__corr_{a['candidate_spy_monthly_corr']:.2f}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p255-antibeta__${{ steps.eval.outputs.tag }}
          path: artifacts/p255_antibeta_r1.json
          if-no-files-found: error
