name: vix-curve-fund-stress-gate-r1
on:
  push:
    paths: ['research/vix_curve_fund_stress_gate_r1.py','.github/workflows/vix-curve-fund-stress-gate-r1.yml']
  pull_request:
    paths: ['research/vix_curve_fund_stress_gate_r1.py','.github/workflows/vix-curve-fund-stress-gate-r1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests
      - name: Execute frozen VIX curve fund stress discriminator
        run: python research/vix_curve_fund_stress_gate_r1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vix-curve-fund-stress-gate-r1-${{ github.run_id }}
          path: artifacts/vix_curve_fund_stress_gate_r1.json
          if-no-files-found: error
          retention-days: 14
