name: P443 P305 DBMF Stress Regime R1
on:
  pull_request:
    paths:
      - 'research/p443_p305_dbmf_stress_regime_r1.py'
      - '.github/workflows/p443-p305-dbmf-stress-regime-r1.yml'
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy
      - name: Materialize exact P423 accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/inputs/p423_exact
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/XoticHaze/research-compute-public-/actions/artifacts/10168949628/zip" -o /tmp/p423-exact.zip
          unzip -q /tmp/p423-exact.zip -d research/inputs/p423_exact
          test -f research/inputs/p423_exact/p423_p305_dbmf_monthly_prices.csv
      - id: result
        run: |
          python research/p443_p305_dbmf_stress_regime_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p443_p305_dbmf_stress_regime_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p443-p305-dbmf-stress-regime__${{ steps.result.outputs.decision }}
          path: research/artifacts/p443_p305_dbmf_stress_regime_r1.json
          if-no-files-found: error
