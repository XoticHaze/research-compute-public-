name: B1 P01 CRW Canonical Replay R1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmibkr-private-pr666-exact-validation-r1.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: b1-p01-crw-canonical-replay-r2
  cancel-in-progress: false

jobs:
  canonical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install transport dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Execute exact private workload against encrypted frozen development corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/b1_p01_crw_canonical_replay_harness_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: b1-p01-crw-canonical-replay-receipt
          path: b1-p01-crw-canonical-replay-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove one-run private material
        if: always()
        run: rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/corpus.csv" "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/replay.json" "$RUNNER_TEMP/build.log"
