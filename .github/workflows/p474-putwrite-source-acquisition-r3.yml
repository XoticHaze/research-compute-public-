name: P474 PUTW Official Source Acquisition R3
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p474_putwrite_source_acquisition_r3.py'
      - '.github/workflows/p474-putwrite-source-acquisition-r3.yml'
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: result
        run: |
          python research/p474_putwrite_source_acquisition_r3.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p474_putwrite_source_acquisition_r3.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p474-putwrite-source-acquisition-r3__${{ steps.result.outputs.tag }}
          path: research/artifacts/p474_putwrite_source_acquisition_r3.json
          if-no-files-found: error
          retention-days: 90