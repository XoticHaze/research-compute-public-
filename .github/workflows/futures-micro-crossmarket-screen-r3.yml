name: Futures Micro Crossmarket Screen R3
on:
  pull_request:
    paths:
      - 'research/futures_micro_crossmarket_screen_r3.py'
      - '.github/workflows/futures-micro-crossmarket-screen-r3.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/futures_micro_crossmarket_screen_r3.py
      - uses: actions/upload-artifact@v4
        with:
          name: futures-micro-crossmarket-screen-r3
          path: futures_micro_crossmarket_screen_r3.json
          if-no-files-found: error
