name: Fleet Authority Health Probe

on:
  workflow_dispatch:
  push:
    branches: [main, assistant/fleet-private-source-health-20260920]
    paths:
      - 'wrangler.jsonc'
      - 'cloudflare/fleet-authority/**'
      - '.github/workflows/fleet-authority-health-probe.yml'

permissions:
  contents: read

jobs:
  health-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require deployed Fleet source-exchange binding
        env:
          FLEET_AUTHORITY_HEALTH: https://fleet-authority.slenderiq.workers.dev/healthz
          FLEET_SOURCE_VAULT_KEY: https://fleet-authority.slenderiq.workers.dev/v1/source-vault/public-key
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen

          url = os.environ['FLEET_AUTHORITY_HEALTH']
          last = None
          for _ in range(36):
              try:
                  req = Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'mmibkr-authority-health-probe-v4',
                      },
                  )
                  with urlopen(req, timeout=10) as response:
                      node = json.loads(response.read().decode('utf-8'))
                  last = node
                  if (
                      node.get('ok') is True
                      and node.get('service') == 'mmibkr-fleet-authority'
                      and node.get('source_exchange_configured') is True
                      and node.get('source_vault_configured') is True
                      and node.get('private_source_authority_configured') is True
                  ):
                      key_req = Request(
                          os.environ['FLEET_SOURCE_VAULT_KEY'],
                          headers={
                              'Accept': 'application/json',
                              'User-Agent': 'mmibkr-source-vault-key-probe-v1',
                          },
                      )
                      with urlopen(key_req, timeout=10) as key_response:
                          key_node = json.loads(
                              key_response.read().decode('utf-8')
                          )
                      if (
                          key_node.get('ok') is not True
                          or key_node.get('schema')
                          != 'mmibkr-source-vault-public-key-v1'
                          or key_node.get('algorithm') != 'RSA-OAEP-256'
                          or not str(key_node.get('key_id') or '').startswith('sha256:')
                          or not isinstance(key_node.get('public_jwk'), dict)
                          or key_node.get('private_key_exported') is not False
                      ):
                          raise RuntimeError('source_vault_public_key_contract_failed')
                      print('FLEET_AUTHORITY_DEPLOYMENT_PROVEN=1')
                      print('SOURCE_EXCHANGE_CONFIGURED=1')
                      print('SOURCE_VAULT_CONFIGURED=1')
                      print('PRIVATE_SOURCE_AUTHORITY_CONFIGURED=1')
                      print(
                          'SOURCE_VAULT_PUBLIC_KEY='
                          + json.dumps(key_node, sort_keys=True)
                      )
                      raise SystemExit(0)
              except Exception as exc:
                  last = {'probe_error': type(exc).__name__}
              time.sleep(5)
          print('LAST_HEALTH=' + json.dumps(last, sort_keys=True))
          raise SystemExit('deployed Fleet source exchange did not converge')
          PY
