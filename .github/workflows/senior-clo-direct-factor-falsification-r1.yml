name: senior-clo-direct-factor-falsification-r1
on:
  push:
    paths: ['.github/workflows/senior-clo-direct-factor-falsification-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance==0.2.65 pandas==2.3.2 numpy==2.3.2
      - name: Falsify senior-CLO residual with direct AAA-CLO factor
        shell: python
        run: |
          import json, math, hashlib
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import yfinance as yf
          EXPERIMENT_ID='MR-SENIOR-CLO-DIRECT-FACTOR-FALSIFICATION-R1-20260914'
          INHERITS=['SLP-20260913-SENIOR-CLO-CURRENT-CORE-FIT-R1','MR-SENIOR-CLO-IMPLEMENTATION-TRANSPORT-R2-20260914']
          TICKERS=['JAAA','CLOA','ICLO','FLRN','HYG','BIL']; START='2023-01-01'; ENDPOINT_COST=0.0025; MIN_COMMON_MONTHS=36; HAC_LAG=3
          px=yf.download(TICKERS,start=START,auto_adjust=True,progress=False,threads=False)['Close'].dropna(how='any')
          raw_last=px.index.max(); current_month_end=raw_last.to_period('M').to_timestamp('M')
          monthly=px.resample('ME').last().dropna(how='any')
          if raw_last.normalize() < current_month_end.normalize(): monthly=monthly[monthly.index < current_month_end]
          ret=monthly.pct_change().dropna(how='any')
          def costed(s):
              x=s.astype(float).copy(); x.iloc[0]-=ENDPOINT_COST; x.iloc[-1]-=ENDPOINT_COST; return x
          def fit(candidate,q,direct=False):
              cols=[candidate,'FLRN','HYG','BIL'] + (['ICLO'] if direct else [])
              z=q[cols].dropna().copy()
              if len(z)<12: return {'months':int(len(z)),'alpha_ann_pp':None,'alpha_t_hac':None}
              y=costed(z[candidate])-z.BIL
              fs=[z.FLRN-z.BIL,z.HYG-z.BIL]
              if direct: fs.append(z.ICLO-z.BIL)
              X=np.column_stack([np.ones(len(z))]+[f.to_numpy(float) for f in fs]); yy=y.to_numpy(float)
              inv=np.linalg.pinv(X.T@X); beta=inv@X.T@yy; u=yy-X@beta; k=X.shape[1]
              S=np.zeros((k,k),float)
              for t in range(len(z)):
                  xt=X[t:t+1].T; S+=(u[t]**2)*(xt@xt.T)
              L=min(HAC_LAG,len(z)-1)
              for lag in range(1,L+1):
                  w=1-lag/(L+1)
                  for t in range(lag,len(z)):
                      xt=X[t:t+1].T; xl=X[t-lag:t-lag+1].T; S+=w*u[t]*u[t-lag]*(xt@xl.T+xl@xt.T)
              cov=inv@S@inv
              if len(z)>k: cov*=len(z)/(len(z)-k)
              se0=math.sqrt(max(float(cov[0,0]),0.0))
              out={'months':int(len(z)),'alpha_ann_pp':float(beta[0]*1200),'alpha_t_hac':None if se0<=0 else float(beta[0]/se0)}
              names=['beta_flrn_excess','beta_hyg_excess'] + (['beta_iclo_excess'] if direct else [])
              for i,n in enumerate(names,1): out[n]=float(beta[i])
              return out
          if len(ret)<MIN_COMMON_MONTHS:
              out={'experiment_id':EXPERIMENT_ID,'inherits_learning_ids':INHERITS,'decision':'UNSCORED_INSUFFICIENT_COMMON_HISTORY','common_months':int(len(ret)),'min_common_months':MIN_COMMON_MONTHS,'raw_last_observation':str(raw_last.date())}
          else:
              windows={'full_common':ret,'2024_plus':ret.loc['2024-01-01':],'2025_plus':ret.loc['2025-01-01':],'block_2023_2024':ret.loc[:'2024-12-31'],'block_2025_plus':ret.loc['2025-01-01':]}
              legacy={c:{w:fit(c,q,False) for w,q in windows.items()} for c in ['JAAA','CLOA','ICLO']}
              direct={c:{w:fit(c,q,True) for w,q in windows.items()} for c in ['JAAA','CLOA']}
              gates={'coverage_ge_36_months':len(ret)>=MIN_COMMON_MONTHS,'iclo_transports_under_legacy_controls':legacy['ICLO']['full_common']['alpha_ann_pp']>0,'jaaa_direct_factor_full_alpha_gt_0':direct['JAAA']['full_common']['alpha_ann_pp']>0,'cloa_direct_factor_full_alpha_gt_0':direct['CLOA']['full_common']['alpha_ann_pp']>0,'jaaa_direct_factor_both_blocks_positive':all(direct['JAAA'][k]['alpha_ann_pp']>0 for k in ['block_2023_2024','block_2025_plus']),'cloa_direct_factor_both_blocks_positive':all(direct['CLOA'][k]['alpha_ann_pp']>0 for k in ['block_2023_2024','block_2025_plus'])}
              survive=all(gates.values())
              out={'experiment_id':EXPERIMENT_ID,'inherits_learning_ids':INHERITS,'uncertainty_resolved':'whether the transported JAAA/CLOA residual survives a direct third AAA-CLO implementation factor rather than reflecting omitted common senior-CLO beta','claim_tested':'JAAA and CLOA retain positive after-cost chronology-stable residual alpha after adding ICLO-BIL to the inherited FLRN-BIL and HYG-BIL controls.','frozen':{'targets':['JAAA','CLOA'],'direct_factor':'ICLO-BIL','legacy_controls':['FLRN-BIL','HYG-BIL'],'start':START,'endpoint_cost_each':ENDPOINT_COST,'min_common_months':MIN_COMMON_MONTHS,'hac_lag':HAC_LAG,'no_parameter_rescue':True},'raw_last_observation':str(raw_last.date()),'common_months':int(len(ret)),'first_month':str(ret.index[0].date()),'last_completed_month':str(ret.index[-1].date()),'legacy_results':legacy,'direct_factor_results':direct,'promotion_gates':gates,'decision':'SURVIVES_DIRECT_AAA_CLO_FACTOR' if survive else 'ABSORBED_BY_DIRECT_AAA_CLO_FACTOR_PARK_DEPTH'}
          Path('result.json').write_text(json.dumps(out,sort_keys=True,indent=2)); print('RESULT_SHA256='+hashlib.sha256(Path('result.json').read_bytes()).hexdigest()); print('RESULT_JSON='+json.dumps(out,sort_keys=True))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senior-clo-direct-factor-falsification-r1
          path: result.json
          if-no-files-found: error
