name: Forward Market Scoreboard R1

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'
  push:
    branches:
      - main
      - 'assistant/**'
    paths:
      - 'research/forward_market_scoreboard_r1.py'
      - 'research/forward_deterministic_allocator_r1.py'
      - 'research/forward_native_program_adapter_r1.py'
      - 'research/current/native_adapters/*.json'
      - '.github/workflows/forward-market-scoreboard-r1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/forward_market_scoreboard_r1.py'
      - 'research/forward_deterministic_allocator_r1.py'
      - 'research/forward_native_program_adapter_r1.py'
      - 'research/current/native_adapters/*.json'
      - '.github/workflows/forward-market-scoreboard-r1.yml'
      - 'research/forward_p249_p266_shadow_r1.py'
      - 'research/forward_p558_current_core_shadow_r1.py'
      - 'research/forward_senior_clo_current_core_shadow_r1.py'
      - 'research/p46_forward_observer_r2.py'
      - 'research/forward_bar_contract_v2.py'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python research/forward_native_program_adapter_r1.py --self-test
      - run: python research/forward_market_scoreboard_r1.py --self-test
      - run: python research/forward_deterministic_allocator_r1.py --self-test

  p46:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy pandas yfinance
      - run: python -m research.p46_forward_observer_r2
      - uses: actions/upload-artifact@v4
        with:
          name: forward-score-input-p46
          path: artifacts/p46_forward_observation_v2.json
          if-no-files-found: error
          retention-days: 90

  p249-p266:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/forward_p249_p266_shadow_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: forward-score-input-p249-p266
          path: artifacts/forward_p249_p266_shadow_r1.json
          if-no-files-found: error
          retention-days: 90

  p558:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 yfinance==0.2.65
      - run: python research/forward_p558_current_core_shadow_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: forward-score-input-p558
          path: artifacts/forward_p558_current_core_shadow_r1.json
          if-no-files-found: error
          retention-days: 90

  senior-clo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 yfinance==0.2.65
      - run: python research/forward_senior_clo_current_core_shadow_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: forward-score-input-senior-clo
          path: artifacts/forward_senior_clo_current_core_shadow_r1.json
          if-no-files-found: error
          retention-days: 90

  report:
    needs: [self-test, p46, p249-p266, p558, senior-clo]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: forward-*
          path: score-inputs
      - name: Add privately admitted sanitized native adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p score-inputs/native-current
          shopt -s nullglob
          adapters=(research/current/native_adapters/*.json)
          for src in "${adapters[@]}"; do
            python - "$src" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='foundry.forward_program_adapter.v1'
          b=x.get('boundaries') or {}
          assert b.get('broker_action') is False
          assert b.get('live_trading_change') is False
          assert b.get('runtime_mutation') is False
          assert b.get('promotion_authority') is False
          print('ADMITTED_NATIVE_ADAPTER',x['program_id'],x.get('signal_date'))
          PY
            cp "$src" score-inputs/native-current/
          done
      - run: python research/forward_market_scoreboard_r1.py --input-root score-inputs --output artifacts/forward_market_scoreboard_r1.json
      - name: Build governed deterministic paper allocation
        run: |
          args=(--scoreboard artifacts/forward_market_scoreboard_r1.json --output artifacts/forward_deterministic_allocator_r1.json)
          if test -f research/current/forward_deterministic_allocator_r1.json; then
            args+=(--prior research/current/forward_deterministic_allocator_r1.json)
          fi
          python research/forward_deterministic_allocator_r1.py "${args[@]}"
      - name: Print compact decision report
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/forward_market_scoreboard_r1.json'))
          a=json.load(open('artifacts/forward_deterministic_allocator_r1.json'))
          for lane in x['lanes']:
              print(lane['program_id'], lane.get('validation_grade', lane.get('status')), lane.get('action_text', ''))
              if lane.get('timing'):
                  print('  timing=', json.dumps(lane['timing'], sort_keys=True))
              if lane.get('scorecard'):
                  print('  scorecard=', json.dumps(lane['scorecard'], sort_keys=True))
          print('native_result_gaps=', ','.join(x['coverage']['native_result_gaps']))
          print('decision_chain=', json.dumps(x['decision_chain'], sort_keys=True))
          print('allocator_policy=', a['policy_id'])
          print('allocator_targets=', json.dumps(a['final_target_weights'], sort_keys=True))
          print('allocator_sleeve_actions=', json.dumps(a['sleeve_actions'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forward-market-scoreboard-r1
          path: |
            artifacts/forward_market_scoreboard_r1.json
            artifacts/forward_deterministic_allocator_r1.json
          if-no-files-found: error
          retention-days: 90

  publish-current:
    if: github.event_name != 'pull_request'
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: forward-market-scoreboard-r1
          path: /tmp/forward-market-scoreboard
      - uses: actions/download-artifact@v4
        with:
          pattern: forward-score-input-*
          path: /tmp/forward-score-inputs
          merge-multiple: true
      - name: Publish one coherent current forward bundle
        run: |
          set -euo pipefail
          scoreboard=/tmp/forward-market-scoreboard/forward_market_scoreboard_r1.json
          allocator=/tmp/forward-market-scoreboard/forward_deterministic_allocator_r1.json
          p249=/tmp/forward-score-inputs/forward_p249_p266_shadow_r1.json
          p558=/tmp/forward-score-inputs/forward_p558_current_core_shadow_r1.json
          clo=/tmp/forward-score-inputs/forward_senior_clo_current_core_shadow_r1.json
          test -f "$scoreboard"
          test -f "$allocator"
          test -f "$p249"
          test -f "$p558"
          test -f "$clo"
          python - "$scoreboard" "$p249" "$p558" "$clo" <<'PY'
          import json,sys
          score,p249,p558,clo=(json.load(open(p)) for p in sys.argv[1:])
          lanes={row['program_id']:row for row in score['lanes']}
          def bp(value): return round(float(value)*10000.0,2)
          p=lanes['P249_P266']; f=p249['forward']
          assert p['forward_days']==f['p249_plus_p266_net']['days']
          assert p['scorecard']['p249_core_net_cumulative_bps']==bp(f['p249_core_net']['cumulative_return'])
          assert p['scorecard']['p249_plus_p266_net_cumulative_bps']==bp(f['p249_plus_p266_net']['cumulative_return'])
          assert p['scorecard']['p266_increment_cumulative_bps']==bp(f['satellite_increment_cumulative'])
          for program,raw in [('P558',p558),('SENIOR_CLO',clo)]:
              lane=lanes[program]
              assert lane['forward_days']==raw['forward']['challenger_if_flattened_now']['days']
              assert lane['scorecard']['challenger_cumulative_bps']==bp(raw['forward']['challenger_if_flattened_now']['cumulative_return'])
              assert lane['scorecard']['excess_vs_incumbent_bps']==bp(raw['forward']['challenger_minus_incumbent_cumulative'])
              assert lane['scorecard']['excess_vs_matched_cash_control_bps']==bp(raw['forward']['challenger_minus_matched_cumulative'])
          print('FORWARD_CURRENT_BUNDLE_COHERENCE=PASS')
          PY
          git fetch origin main
          git checkout -B forward-market-scoreboard-publish origin/main
          mkdir -p research/current
          cp "$scoreboard" research/current/forward_market_scoreboard_r1.json
          cp "$allocator" research/current/forward_deterministic_allocator_r1.json
          cp "$p249" research/current/forward_p249_p266_shadow_r1.json
          cp "$p558" research/current/forward_p558_current_core_shadow_r1.json
          cp "$clo" research/current/forward_senior_clo_current_core_shadow_r1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/current/forward_market_scoreboard_r1.json \
            research/current/forward_deterministic_allocator_r1.json \
            research/current/forward_p249_p266_shadow_r1.json \
            research/current/forward_p558_current_core_shadow_r1.json \
            research/current/forward_senior_clo_current_core_shadow_r1.json
          if git diff --cached --quiet; then
            echo 'CURRENT_FORWARD_BUNDLE_UNCHANGED=true'
            exit 0
          fi
          git commit -m 'Forward: publish coherent current observer bundle'
          git push origin HEAD:main
