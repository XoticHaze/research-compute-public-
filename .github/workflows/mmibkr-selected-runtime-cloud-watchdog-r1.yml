name: MM-IBKR Selected Runtime Cloud Watchdog R1

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mmibkr-selected-runtime-cloud-watchdog-r1.yml'
      - 'scripts/mmibkr_selected_runtime_cloud_watchdog_cooldown_v1.py'
      - 'tests/test_mmibkr_selected_runtime_cloud_watchdog_cooldown_v1.py'
      - 'scripts/mmibkr_selected_runtime_maintenance_hold_v1.py'
      - 'tests/test_mmibkr_selected_runtime_maintenance_hold_v1.py'
      - 'rendezvous/control/mmibkr-selected-runtime-cloud-maintenance-hold-r1.json'

permissions:
  actions: write
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Validate watchdog cooldown contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/mmibkr_selected_runtime_cloud_watchdog_cooldown_v1.py
          python -m unittest -v tests.test_mmibkr_selected_runtime_cloud_watchdog_cooldown_v1
          python -m py_compile scripts/mmibkr_selected_runtime_maintenance_hold_v1.py
          python -m unittest -v tests.test_mmibkr_selected_runtime_maintenance_hold_v1

  ensure-owner:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Respect selected-runtime maintenance hold
        id: maintenance_hold
        run: |
          set -euo pipefail
          hold="$(python scripts/mmibkr_selected_runtime_maintenance_hold_v1.py \
            --path rendezvous/control/mmibkr-selected-runtime-cloud-maintenance-hold-r1.json)"
          echo "enabled=$hold" >> "$GITHUB_OUTPUT"
          if [ "$hold" = "true" ]; then
            echo 'MMIBKR_CLOUD_WATCHDOG=maintenance_hold'
            echo 'MMIBKR_CLOUD_WATCHDOG_MAINTENANCE_REASON=paper_account_hygiene_679'
          fi

      - name: Ensure one selected-runtime cloud owner exists
        if: ${{ steps.maintenance_hold.outputs.enabled != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          from urllib.error import HTTPError
          from scripts.mmibkr_selected_runtime_cloud_watchdog_cooldown_v1 import (
              evaluate_b1_failure_cooldown,
          )
          from urllib.request import Request, urlopen

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflow='mmibkr-selected-runtime-cloud-r1.yml'
          headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'mmibkr-cloud-watchdog/1',
          }

          req=Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=50',
              headers=headers,
          )
          with urlopen(req, timeout=30) as response:
              body=json.loads(response.read().decode())
          active=[
              run for run in body.get('workflow_runs') or []
              if str(run.get('status') or '') in {
                  'queued','in_progress','waiting','pending','requested'
              }
              and str(run.get('head_branch') or '') == 'main'
          ]
          if active:
              print('MMIBKR_CLOUD_WATCHDOG=owner_present')
              print('MMIBKR_CLOUD_ACTIVE_RUNS='+','.join(str(x.get('id')) for x in active))
              raise SystemExit(0)

          b1_workflow='ibkr-cloudflare-readonly-b1-r1.yml'
          b1_req=Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/{b1_workflow}/runs?per_page=20',
              headers=headers,
          )
          with urlopen(b1_req, timeout=30) as response:
              b1_body=json.loads(response.read().decode())
          cooldown=evaluate_b1_failure_cooldown(b1_body.get('workflow_runs') or [])
          if cooldown.get('suppress') is True:
              print('MMIBKR_CLOUD_WATCHDOG=broker_dependency_cooldown')
              print('MMIBKR_CLOUD_WATCHDOG_COOLDOWN_REASON='+str(cooldown.get('reason') or ''))
              print('MMIBKR_CLOUD_WATCHDOG_B1_FAILURE_COUNT='+str(cooldown.get('consecutive_failure_count') or 0))
              print('MMIBKR_CLOUD_WATCHDOG_B1_LATEST_RUN_ID='+str(cooldown.get('latest_run_id') or ''))
              print('MMIBKR_CLOUD_WATCHDOG_RETRY_AFTER_UTC='+str(cooldown.get('retry_after_utc') or ''))
              raise SystemExit(0)

          checkpoint_prefix='mmibkr-selected-runtime-cloud-checkpoint-v1-'

          def receipt_for(run_id):
              path=f'rendezvous/receipts/{run_id}-mmibkr-selected-runtime-cloud.json'
              req=Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}?ref=main',
                  headers=headers,
              )
              try:
                  with urlopen(req, timeout=30) as response:
                      node=json.loads(response.read().decode())
              except HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise
              if str(node.get('encoding') or '') != 'base64':
                  return None
              raw=base64.b64decode(str(node.get('content') or '').encode())
              receipt=json.loads(raw.decode())
              if receipt.get('schema') != 'mmibkr.selected_runtime_cloud_session_receipt.v2':
                  return None
              return receipt

          checkpoint_key=''
          checkpoint_sha=''
          checkpoint_source=''
          checkpoint_run_id=''
          for run in body.get('workflow_runs') or []:
              run_id=str(run.get('id') or '')
              if not run_id.isdigit():
                  continue
              receipt=receipt_for(run_id)
              if not isinstance(receipt, dict):
                  continue

              saved_key=str(receipt.get('checkpoint_cache_key') or '').strip()
              saved_sha=str(receipt.get('checkpoint_cache_sha256') or '').strip().lower()
              if (
                  receipt.get('checkpoint_cache_saved') is True
                  and saved_key.startswith(checkpoint_prefix)
                  and len(saved_sha) == 64
                  and all(ch in '0123456789abcdef' for ch in saved_sha)
              ):
                  checkpoint_key=saved_key
                  checkpoint_sha=saved_sha
                  checkpoint_source='saved_successor'
                  checkpoint_run_id=run_id
                  break

              predecessor_key=str(
                  receipt.get('expected_predecessor_checkpoint_cache_key') or ''
              ).strip()
              predecessor_sha=str(
                  receipt.get('expected_predecessor_checkpoint_sha256') or ''
              ).strip().lower()
              if (
                  receipt.get('expected_predecessor_checkpoint_match') is True
                  and receipt.get('checkpoint_restored') is True
                  and receipt.get('predecessor_terminal_continuity_ready') is True
                  and predecessor_key.startswith(checkpoint_prefix)
                  and len(predecessor_sha) == 64
                  and all(ch in '0123456789abcdef' for ch in predecessor_sha)
              ):
                  checkpoint_key=predecessor_key
                  checkpoint_sha=predecessor_sha
                  checkpoint_source='verified_predecessor_reuse'
                  checkpoint_run_id=run_id
                  break

          if not checkpoint_key or not checkpoint_sha:
              raise SystemExit(
                  'watchdog found no durable exact predecessor checkpoint identity'
              )

          payload=json.dumps({
              'ref':'main',
              'inputs':{
                  'source_ref':'35e6b44e5c2618f780a84c1c204fe14c76bdf0e5',
                  'session_seconds':'18000',
                  'max_cycles':'0',
                  'expected_checkpoint_cache_key':checkpoint_key,
                  'expected_checkpoint_sha256':checkpoint_sha,
                  'require_terminal_continuity':True,
                  'self_handoff':True,
              },
          }).encode()
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_SOURCE='+checkpoint_source)
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_RUN_ID='+checkpoint_run_id)
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_KEY='+checkpoint_key)
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_SHA256='+checkpoint_sha)
          dispatch=Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches',
              data=payload,
              headers={**headers,'Content-Type':'application/json'},
              method='POST',
          )
          with urlopen(dispatch, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'watchdog dispatch failed HTTP {response.status}')
          print('MMIBKR_CLOUD_WATCHDOG=owner_dispatched')
          PY
