name: MM-IBKR Selected Runtime Cloud Watchdog R1

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  ensure-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ensure one selected-runtime cloud owner exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflow='mmibkr-selected-runtime-cloud-r1.yml'
          headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'mmibkr-cloud-watchdog/1',
          }

          req=Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=50',
              headers=headers,
          )
          with urlopen(req, timeout=30) as response:
              body=json.loads(response.read().decode())
          active=[
              run for run in body.get('workflow_runs') or []
              if str(run.get('status') or '') in {
                  'queued','in_progress','waiting','pending','requested'
              }
              and str(run.get('head_branch') or '') == 'main'
          ]
          if active:
              print('MMIBKR_CLOUD_WATCHDOG=owner_present')
              print('MMIBKR_CLOUD_ACTIVE_RUNS='+','.join(str(x.get('id')) for x in active))
              raise SystemExit(0)

          checkpoint_prefix='mmibkr-selected-runtime-cloud-checkpoint-v1-'

          def receipt_for(run_id):
              path=f'rendezvous/receipts/{run_id}-mmibkr-selected-runtime-cloud.json'
              req=Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}?ref=main',
                  headers=headers,
              )
              try:
                  with urlopen(req, timeout=30) as response:
                      node=json.loads(response.read().decode())
              except HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise
              if str(node.get('encoding') or '') != 'base64':
                  return None
              raw=base64.b64decode(str(node.get('content') or '').encode())
              receipt=json.loads(raw.decode())
              if receipt.get('schema') != 'mmibkr.selected_runtime_cloud_session_receipt.v2':
                  return None
              return receipt

          checkpoint_key=''
          checkpoint_sha=''
          checkpoint_source=''
          checkpoint_run_id=''
          for run in body.get('workflow_runs') or []:
              run_id=str(run.get('id') or '')
              if not run_id.isdigit():
                  continue
              receipt=receipt_for(run_id)
              if not isinstance(receipt, dict):
                  continue

              saved_key=str(receipt.get('checkpoint_cache_key') or '').strip()
              saved_sha=str(receipt.get('checkpoint_cache_sha256') or '').strip().lower()
              if (
                  receipt.get('checkpoint_cache_saved') is True
                  and saved_key.startswith(checkpoint_prefix)
                  and len(saved_sha) == 64
                  and all(ch in '0123456789abcdef' for ch in saved_sha)
              ):
                  checkpoint_key=saved_key
                  checkpoint_sha=saved_sha
                  checkpoint_source='saved_successor'
                  checkpoint_run_id=run_id
                  break

              predecessor_key=str(
                  receipt.get('expected_predecessor_checkpoint_cache_key') or ''
              ).strip()
              predecessor_sha=str(
                  receipt.get('expected_predecessor_checkpoint_sha256') or ''
              ).strip().lower()
              if (
                  receipt.get('expected_predecessor_checkpoint_match') is True
                  and receipt.get('checkpoint_restored') is True
                  and receipt.get('predecessor_terminal_continuity_ready') is True
                  and predecessor_key.startswith(checkpoint_prefix)
                  and len(predecessor_sha) == 64
                  and all(ch in '0123456789abcdef' for ch in predecessor_sha)
              ):
                  checkpoint_key=predecessor_key
                  checkpoint_sha=predecessor_sha
                  checkpoint_source='verified_predecessor_reuse'
                  checkpoint_run_id=run_id
                  break

          if not checkpoint_key or not checkpoint_sha:
              raise SystemExit(
                  'watchdog found no durable exact predecessor checkpoint identity'
              )

          payload=json.dumps({
              'ref':'main',
              'inputs':{
                  'source_ref':'8a82107be253c3facd3b090cf752bc51b3a8ef8d',
                  'session_seconds':'18000',
                  'max_cycles':'0',
                  'expected_checkpoint_cache_key':checkpoint_key,
                  'expected_checkpoint_sha256':checkpoint_sha,
                  'require_terminal_continuity':True,
                  'self_handoff':True,
              },
          }).encode()
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_SOURCE='+checkpoint_source)
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_RUN_ID='+checkpoint_run_id)
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_KEY='+checkpoint_key)
          print('MMIBKR_CLOUD_WATCHDOG_CHECKPOINT_SHA256='+checkpoint_sha)
          dispatch=Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches',
              data=payload,
              headers={**headers,'Content-Type':'application/json'},
              method='POST',
          )
          with urlopen(dispatch, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'watchdog dispatch failed HTTP {response.status}')
          print('MMIBKR_CLOUD_WATCHDOG=owner_dispatched')
          PY
