name: MMIBKR Parity Capsule Export R1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mmibkr-parity-capsule-export-r1.yml

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  PRIVATE_SOURCE_SHA: e1c9b49b983122348d8180ef4dec7bcd857a10be
  RECIPIENT_PUBLIC_B64: 6oTp3V+wg0ewqIiaeg+iY3GKeeWLxc9TVLTFyS6yGyI=

jobs:
  export-encrypted-capsule:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Materialize exact private MM source through existing Fleet vault
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$PRIVATE_SOURCE_SHA" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          node=json.loads(Path(os.environ['RUNNER_TEMP'],'mmibkr-source','materialization-host.json').read_text())
          expected=os.environ['PRIVATE_SOURCE_SHA'].strip().lower()
          if node.get('ok') is not True or str(node.get('source_sha') or '').lower()!=expected:
              raise SystemExit('exact source materialization mismatch')
          if node.get('private_repository_token_used') is not False:
              raise SystemExit('private repo token boundary violated')
          if node.get('plaintext_emitted') is not False:
              raise SystemExit('plaintext emission boundary violated')
          print('MMIBKR_PARITY_CAPSULE_SOURCE_SHA='+expected)
          PY

      - name: Seal exact source to one-run recipient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmibkr-parity-capsule"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          rt=Path(os.environ['RUNNER_TEMP'])
          src=rt/'mmibkr-source'/'mm-ibkr-source.tar.gz'
          out=rt/'mmibkr-parity-capsule'
          plaintext=src.read_bytes()
          recipient_raw=base64.b64decode(os.environ['RECIPIENT_PUBLIC_B64'],validate=True)
          recipient=x25519.X25519PublicKey.from_public_bytes(recipient_raw)
          ephemeral=x25519.X25519PrivateKey.generate()
          ephemeral_pub=ephemeral.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          shared=ephemeral.exchange(recipient)
          source_sha=os.environ['PRIVATE_SOURCE_SHA'].strip().lower()
          salt=hashlib.sha256(('mmibkr-parity-capsule-r1:'+source_sha).encode()).digest()
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=salt,info=b'mmibkr-parity-source-capsule-v1').derive(shared)
          nonce=os.urandom(12)
          aad=json.dumps({
              'schema':'mmibkr.parity_source_capsule.v1',
              'source_sha':source_sha,
              'recipient_key_id':'sha256:'+hashlib.sha256(recipient_raw).hexdigest(),
          },sort_keys=True,separators=(',',':')).encode()
          ciphertext=ChaCha20Poly1305(key).encrypt(nonce,plaintext,aad)
          (out/'ciphertext.bin').write_bytes(ciphertext)
          envelope={
              'schema':'mmibkr.parity_source_capsule.v1',
              'source_sha':source_sha,
              'recipient_key_id':'sha256:'+hashlib.sha256(recipient_raw).hexdigest(),
              'ephemeral_public_b64':base64.b64encode(ephemeral_pub).decode(),
              'nonce_b64':base64.b64encode(nonce).decode(),
              'aad_b64':base64.b64encode(aad).decode(),
              'ciphertext_sha256':hashlib.sha256(ciphertext).hexdigest(),
              'ciphertext_bytes':len(ciphertext),
              'plaintext_sha256':hashlib.sha256(plaintext).hexdigest(),
              'plaintext_bytes':len(plaintext),
              'private_plaintext_published':False,
          }
          (out/'envelope.json').write_text(json.dumps(envelope,sort_keys=True)+'\n')
          print('MMIBKR_PARITY_CAPSULE_CIPHERTEXT_SHA256='+envelope['ciphertext_sha256'])
          print('MMIBKR_PARITY_CAPSULE_PLAINTEXT_PUBLISHED=0')
          PY

      - name: Upload encrypted parity capsule
        id: capsule
        uses: actions/upload-artifact@v4
        with:
          name: mmibkr-parity-source-capsule-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mmibkr-parity-capsule/envelope.json
            ${{ runner.temp }}/mmibkr-parity-capsule/ciphertext.bin
          if-no-files-found: error
          retention-days: 1

      - name: Destroy private source material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$RUNNER_TEMP/mmibkr-source"
          test ! -e "$RUNNER_TEMP/mmibkr-source"
          echo 'MMIBKR_PARITY_CAPSULE_PRIVATE_SOURCE_DESTROYED=1'
