name: P474 PutWrite Vol Premium R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p474_putwrite_vol_premium_r1.py'
      - '.github/workflows/p474-putwrite-vol-premium-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: result
        run: |
          python research/p474_putwrite_vol_premium_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p474_putwrite_vol_premium_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p474-putwrite-vol-premium-r1__${{ steps.result.outputs.tag }}
          path: research/artifacts/p474_putwrite_vol_premium_r1.json
          if-no-files-found: error
          retention-days: 90
