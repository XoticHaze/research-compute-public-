name: P209 Developed Value R1
on:
  pull_request:
    paths:
      - 'research/p209_developed_value_fund_r1.py'
      - '.github/workflows/p209-developed-value-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p209_developed_value_fund_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p209_developed_value_fund_r1.json')); a=x['tests']['2010']; b=x['tests']['2015']; c=x['tests']['2020']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__e10_{bp(a['efv_minus_efa'])}__s10_{bp(a['efv_minus_spy'])}__e15_{bp(b['efv_minus_efa'])}__e20_{bp(c['efv_minus_efa'])}__f_{a['positive_efa_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p209-developed-value__${{ steps.eval.outputs.tag }}
          path: artifacts/p209_developed_value_fund_r1.json
          if-no-files-found: error