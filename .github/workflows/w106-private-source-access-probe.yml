name: W106 Private Source Access Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w106-private-source-access-probe.yml'
      - 'recovery/w106_source_chunks/**'

permissions:
  contents: read

jobs:
  private-source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe repository-scoped token against exact private MM source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/XoticHaze/mm-IBKR.git"
          if git ls-remote "$url" '76aa7e9bb64a1aca36865076df1fa4b25f1b06a9' >/tmp/lsremote.out 2>/tmp/lsremote.err; then
            echo 'PRIVATE_MM_GITHUB_TOKEN_READ=PASS'
            cat /tmp/lsremote.out
          else
            code=$?
            echo "PRIVATE_MM_GITHUB_TOKEN_READ=FAIL exit=${code}"
            sed -E 's#https://x-access-token:[^@]+@github.com/#https://x-access-token:***@github.com/#g' /tmp/lsremote.err || true
            exit "$code"
          fi
