name: FNSPID Bounded Semiconductor Materialization 20260906

on:
  push:
    branches:
      - research/fnspid-source-probe-20260906-r1
    paths:
      - "research/fnspid_bounded_semis_20260906.py"
      - ".github/workflows/fnspid-bounded-semis-20260906.yml"
  workflow_dispatch:

jobs:
  bounded-semis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded materializer dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Execute bounded FNSPID Semiconductor materializer
        run: python research/fnspid_bounded_semis_20260906.py
      - name: Upload reduced research evidence
        uses: actions/upload-artifact@v4
        with:
          name: fnspid-bounded-semis-20260906
          path: |
            fnspid-bounded-semis-20260906.csv
            fnspid-bounded-semis-receipt-20260906.json
          if-no-files-found: error
          retention-days: 14
