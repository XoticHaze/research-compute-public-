name: P46 Shadow Forward R1

on:
  pull_request:
    paths:
      - 'research/forward_bar_contract_v1.py'
      - 'research/p46_forward_shadow_r1.py'
      - '.github/workflows/p46-forward-shadow-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas yfinance
      - name: Validate IBKR-compatible input contract and compute P46 shadow decision
        run: python -m research.p46_forward_shadow_r1
      - uses: actions/upload-artifact@v4
        with:
          name: p46-forward-shadow-r1
          path: |
            artifacts/p46_forward_shadow_r1.json
            artifacts/normalized_bar_contract_fixture.json
          if-no-files-found: error
          retention-days: 90
