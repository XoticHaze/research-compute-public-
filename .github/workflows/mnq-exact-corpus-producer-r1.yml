name: MNQ Exact Corpus Producer R1

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Public canonical-session GitHub run id with a fresh MNQ recipient
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mnq-exact-corpus-producer-r1-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed producer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            cryptography==46.0.1 \
            pandas==2.3.3 \
            numpy==2.3.3

      - name: Refill exact admitted corpus and publish encrypted run-bound response
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mnq-corpus-cache" "$RUNNER_TEMP/mnq-corpus-work"
          python scripts/mnq_exact_corpus_producer_v1.py \
            --run-id "$TARGET_RUN_ID" \
            --cache-path "$RUNNER_TEMP/mnq-corpus-cache/mnq-strategy-backtest-12min.csv" \
            --work-root "$RUNNER_TEMP/mnq-corpus-work"

      - name: Remove plaintext producer work
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mnq-corpus-cache" "$RUNNER_TEMP/mnq-corpus-work"
