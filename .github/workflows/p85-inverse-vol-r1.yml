name: P85 Inverse Volatility R1
on:
  pull_request:
    paths:
      - 'research/p85_inverse_vol_r1.py'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p85_inverse_vol_r1.py | tee /tmp/p85.out
      - run: cat artifacts/p85_inverse_vol_r1.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p85-inverse-vol-r1
          path: artifacts/p85_inverse_vol_r1.json
          if-no-files-found: error
