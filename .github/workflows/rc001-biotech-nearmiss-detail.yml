name: RC001 Biotech Near-Miss Detail
on:
  pull_request:
    paths:
      - '.github/workflows/rc001-biotech-nearmiss-detail.yml'
      - 'research/biotech-nearmiss-detail-contract.json'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Materialize pinned evaluator
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
      - name: Install fixed numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute frozen Biotech family and retain detailed evidence
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          s=importlib.util.spec_from_file_location('r','.campaign/runner.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/biotech-nearmiss-detail-contract.json').read_text()); assert not c['external_holdouts_loaded']
          spec=c['family']; r=m._evaluate_matrix(spec,'2026-09-01T13:30:00+00:00')
          assert r['family_summary']['biotech']['passing_symbols']==4
          assert not r['family_summary']['biotech']['development_family_gate_pass']
          out={'schema':'research_compute_public.rc001_biotech_nearmiss_detail.v1','status':'PASS','family_summary':r['family_summary'],'per_symbol':[x for x in r['per_symbol'] if x['family']=='biotech'],'selection_calendar':r['selection_calendar'],'external_holdouts_loaded':False,'research_only':True,'promotion_authority':False}
          Path('biotech-nearmiss-detail-receipt.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print('BIOTECH_NEARMISS_DETAIL='+json.dumps(out,sort_keys=True))
          PY
      - name: Upload detailed receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: biotech-nearmiss-detail-receipt
          path: biotech-nearmiss-detail-receipt.json
          if-no-files-found: error
          retention-days: 14
