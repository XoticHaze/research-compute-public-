name: sector-seasonality-alpha-r1
on:
  push:
    paths: ['.github/workflows/sector-seasonality-alpha-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas numpy
      - name: Evaluate expanding-history calendar-month sector seasonality
        shell: python
        run: |
          import json, math
          import numpy as np
          import pandas as pd
          import yfinance as yf
          EXPERIMENT_ID='MR-SECTOR-SEASONALITY-R1-20260914'
          # Original nine Select Sector SPDRs only, fixed before result, to obtain long common chronology.
          SECTORS=['XLB','XLE','XLF','XLI','XLK','XLP','XLU','XLV','XLY']
          TICKERS=SECTORS+['SPY']; START='1999-01-01'; MIN_PRIOR_YEARS=5; K=3; ROUNDTRIP_COST=0.0020; RECENT_START='2022-01-01'
          px=yf.download(TICKERS,start=START,auto_adjust=True,progress=False)['Close'].dropna()
          m=px.resample('ME').last(); ret=m.pct_change().dropna(); records=[]
          for i in range(len(ret)):
              d=ret.index[i]; prior=ret.iloc[:i]
              same=prior[prior.index.month==d.month]
              if len(same)<MIN_PRIOR_YEARS: continue
              score=same[SECTORS].mean(); top=list(score.nlargest(K).index); bottom=list(score.nsmallest(K).index)
              cur=ret.iloc[i]
              records.append({'date':str(d.date()),'seasonal':float(cur[top].mean()-ROUNDTRIP_COST),'anti':float(cur[bottom].mean()-ROUNDTRIP_COST),'ew':float(cur[SECTORS].mean()),'spy':float(cur['SPY']),'top':top,'bottom':bottom})
          q=pd.DataFrame(records); q['year']=pd.to_datetime(q.date).dt.year
          def ann(x): x=np.asarray(x,float); return float(np.prod(1+x)**(12/len(x))-1)
          def maxdd(x): w=np.cumprod(1+np.asarray(x,float)); return float(np.min(w/np.maximum.accumulate(w)-1))
          years=sorted(q.year.unique()); wins_ew=wins_spy=beats_anti=0; yr=[]
          for y in years:
              z=q[q.year==y]; a,b,c,d=ann(z.seasonal),ann(z.ew),ann(z.spy),ann(z.anti); wins_ew+=a>b; wins_spy+=a>c; beats_anti+=a>d; yr.append({'year':int(y),'seasonal':a,'ew':b,'spy':c,'anti':d})
          recent=q[pd.to_datetime(q.date)>=RECENT_START]
          out={'experiment_id':EXPERIMENT_ID,'claim':'Expanding-history same-calendar-month sector ranking produces durable after-cost excess return by holding the top three historically seasonal sectors for each month, versus equal-weight sectors, SPY, and bottom-three anti-seasonal control','frozen':{'sectors':SECTORS,'start':START,'minimum_prior_same_month_years':MIN_PRIOR_YEARS,'k':K,'roundtrip_cost':ROUNDTRIP_COST,'recent_start':RECENT_START},'months':int(len(q)),'years':int(len(years)),'seasonal_cagr':ann(q.seasonal),'ew_cagr':ann(q.ew),'spy_cagr':ann(q.spy),'anti_cagr':ann(q.anti),'excess_vs_ew_pp':100*(ann(q.seasonal)-ann(q.ew)),'excess_vs_spy_pp':100*(ann(q.seasonal)-ann(q.spy)),'seasonal_minus_anti_pp':100*(ann(q.seasonal)-ann(q.anti)),'recent_excess_vs_ew_pp':100*(ann(recent.seasonal)-ann(recent.ew)),'calendar_wins_vs_ew':int(wins_ew),'calendar_wins_vs_spy':int(wins_spy),'calendar_beats_anti':int(beats_anti),'max_drawdown_seasonal':maxdd(q.seasonal),'max_drawdown_ew':maxdd(q.ew),'max_drawdown_spy':maxdd(q.spy),'year_rows':yr}
          gate=math.ceil(.6*len(years)); out['promotion_gates']={'full_excess_vs_ew_gt_1pp':out['excess_vs_ew_pp']>1,'full_excess_vs_spy_gt_0':out['excess_vs_spy_pp']>0,'recent_excess_vs_ew_gt_0':out['recent_excess_vs_ew_pp']>0,'calendar_wins_vs_ew_ge_60pct':wins_ew>=gate,'opposite_direction_control':out['seasonal_minus_anti_pp']>0}; out['decision']='PROMOTE_MECHANISM_FOR_ORTHOGONAL_VALIDATION' if all(out['promotion_gates'].values()) else 'REJECT_NO_PARAMETER_RESCUE'; print('RESULT_JSON='+json.dumps(out,sort_keys=True))
