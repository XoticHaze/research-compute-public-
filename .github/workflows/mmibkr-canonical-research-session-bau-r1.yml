name: MM-IBKR Canonical Research Session BAU R1
run-name: canonical-session-${{ inputs.expected_job_sha256 }}-${{ inputs.dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact approved private MM-IBKR source SHA
        required: true
        default: 35e6b44e5c2618f780a84c1c204fe14c76bdf0e5
        type: string
      session_zlib_b64:
        description: zlib+base64 encoded mmibkr.canonical_session.v1
        required: true
        type: string
      expected_job_sha256:
        description: Immutable outer CommandCenter job SHA256
        required: true
        type: string
      dispatch_nonce:
        description: Run-correlation nonce generated by the generic selected-surface driver
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  EXCHANGE_REF: rendezvous-exchange
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients

jobs:
  canonical-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed transport dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Decode and validate bounded canonical session input
        env:
          SESSION_ZLIB_B64: ${{ inputs.session_zlib_b64 }}
          EXPECTED_JOB_SHA256: ${{ inputs.expected_job_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,zlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(os.environ['SESSION_ZLIB_B64'],validate=True))
          node=json.loads(raw)
          if node.get('schema')!='mmibkr.canonical_session.v1':
              raise SystemExit('canonical session schema rejected')
          if len(raw)>250000:
              raise SystemExit('canonical session input too large')
          job_sha=os.environ['EXPECTED_JOB_SHA256'].strip().lower()
          if len(job_sha)!=64 or any(ch not in '0123456789abcdef' for ch in job_sha):
              raise SystemExit('expected job SHA256 invalid')
          Path(os.environ['RUNNER_TEMP'],'canonical-session.json').write_bytes(raw)
          Path(os.environ['RUNNER_TEMP'],'outer-job-sha256.txt').write_text(job_sha+'\n')
          print('CANONICAL_SESSION_INPUT_SHA256='+hashlib.sha256(raw).hexdigest())
          print('OUTER_JOB_SHA256='+job_sha)
          PY

      - name: Materialize exact private source from reusable Fleet vault
        env:
          REQUEST_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          umask 077
          test "${#REQUEST_SOURCE_REF}" = 40
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$REQUEST_SOURCE_REF" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"
          python scripts/mmibkr_attested_source_to_canonical_receipt_v1.py \
            --input "$RUNNER_TEMP/mmibkr-source/materialization-host.json" \
            --output "$RUNNER_TEMP/mmibkr-source/canonical-source-receipt.json"

      - name: Generate one-run MNQ corpus recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'mnq-corpus-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={'schema':'mnq-corpus-ephemeral-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest()}
          Path(os.environ['RUNNER_TEMP'],'mnq-corpus-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          PY

      - name: Publish run-bound corpus recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recipient_path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-mnq-corpus.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/mnq-corpus-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish one-run canonical-session corpus recipient','content':content,'branch':branch}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${recipient_path}" -d "$body" >/dev/null

      - name: Wait for run-bound corpus envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          envelope_path="${response_root}/mnq-corpus-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${envelope_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 120); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/mnq-corpus-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound MNQ corpus envelope did not arrive'; exit 42; }
          echo "MNQ_CORPUS_RESPONSE_ROOT=${response_root}" >> "$GITHUB_ENV"

      - name: Reassemble authenticated corpus ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          env=json.loads(Path(os.environ['RUNNER_TEMP'],'mnq-corpus-envelope.json').read_text())
          chunks=env.get('chunks')
          if not isinstance(chunks,list) or not chunks or len(chunks)>64: raise SystemExit('invalid chunk list')
          expected=f"rendezvous/responses/{os.environ['GITHUB_RUN_ID']}/"; pieces=[]; seen=set()
          for node in chunks:
              if set(node)!={'path','sha256','chars'}: raise SystemExit('invalid chunk descriptor')
              path=str(node['path'])
              if not path.startswith(expected) or path in seen or '..' in path.split('/'): raise SystemExit('invalid chunk path')
              seen.add(path)
              url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref={os.environ['EXCHANGE_REF']}"
              req=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'})
              raw=urlopen(req,timeout=30).read()
              if len(raw)!=int(node['chars']) or hashlib.sha256(raw).hexdigest()!=node['sha256']: raise SystemExit('chunk identity mismatch')
              pieces.append(raw.decode('ascii'))
          ciphertext=base64.b64decode(''.join(pieces).encode('ascii'),validate=True)
          if hashlib.sha256(ciphertext).hexdigest()!=env.get('ciphertext_sha256'): raise SystemExit('ciphertext digest mismatch')
          Path(os.environ['RUNNER_TEMP'],'mnq-corpus-ciphertext.bin').write_bytes(ciphertext)
          PY

      - name: Materialize governed MNQ member into canonical input_root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input-root"
          python scripts/mnq_corpus_ephemeral_materialize_v1.py \
            --envelope "$RUNNER_TEMP/mnq-corpus-envelope.json" \
            --ciphertext "$RUNNER_TEMP/mnq-corpus-ciphertext.bin" \
            --private-key "$RUNNER_TEMP/mnq-corpus-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --response-root "$MNQ_CORPUS_RESPONSE_ROOT" \
            --output-root "$RUNNER_TEMP/input-root"

      - name: Execute finite canonical session
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          python scripts/mmibkr_canonical_session_runner_v1.py \
            --session "$RUNNER_TEMP/canonical-session.json" \
            --source-root "$RUNNER_TEMP/mmibkr-source/extracted" \
            --source-receipt "$RUNNER_TEMP/mmibkr-source/canonical-source-receipt.json" \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --input-root "$RUNNER_TEMP/input-root" \
            > "$RUNNER_TEMP/session-terminal.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          node=json.loads((root/'session-terminal.json').read_text())
          if node.get('schema')!='mmibkr.canonical_session_receipt.v1' or node.get('status')!='completed':
              raise SystemExit('canonical session not completed')
          outer=(root/'outer-job-sha256.txt').read_text().strip()
          receipt={'schema':'continue_release.public_canonical_session_terminal.v1','job_sha256':outer,
            'public_head':os.environ['GITHUB_SHA'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
            'surface_run_id':os.environ['GITHUB_RUN_ID'],
            'session_receipt':node,
            'session_receipt_sha256':hashlib.sha256(json.dumps(node,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
            'strategy_spec_write':False,'runtime_activation':False,'broker_submit':False,'broker_cancel':False,
            'broker_flatten':False,'promotion_mutation':False,'live_trading':False}
          (root/'terminal-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload sanitized terminal receipt
        id: terminal_artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-session-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal-receipt.json
          if-no-files-found: error

      - name: Emit sanitized terminal artifact identity
        run: |
          echo "TERMINAL_ARTIFACT_ID=${{ steps.terminal_artifact.outputs.artifact-id }}"
          echo "TERMINAL_ARTIFACT_DIGEST=${{ steps.terminal_artifact.outputs.artifact-digest }}"

      - name: Remove one-run private material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mmibkr-source" "$RUNNER_TEMP/input-root" "$RUNNER_TEMP/receipts"
          rm -f "$RUNNER_TEMP/mnq-corpus-private.b64" "$RUNNER_TEMP/mnq-corpus-recipient.json" \
            "$RUNNER_TEMP/mnq-corpus-envelope.json" "$RUNNER_TEMP/mnq-corpus-ciphertext.bin" \
            "$RUNNER_TEMP/canonical-session.json"