name: IBKR Selected Runtime Paper Proof Validate

on:
  push:
    branches:
      - assistant/ibkr-selected-runtime-paper-proof-20260917
      - ibkr-b1-authority-v1
    paths:
      - 'scripts/ibkr_remote_selected_runtime_paper_proof_v1.py'
      - 'tests/test_ibkr_remote_selected_runtime_paper_proof_v1.py'
      - '.github/workflows/ibkr-selected-runtime-paper-proof-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Compile and test proof driver without broker access
        run: |
          set -euo pipefail
          python -m py_compile scripts/ibkr_remote_selected_runtime_paper_proof_v1.py tests/test_ibkr_remote_selected_runtime_paper_proof_v1.py
          python -m unittest tests.test_ibkr_remote_selected_runtime_paper_proof_v1 -v
          echo 'IBKR_SELECTED_RUNTIME_PROOF_STATIC_VALID=1'
          echo 'IBKR_BROKER_LOGIN_ATTEMPTED=0'
          echo 'IBKR_BROKER_ORDER_ATTEMPTED=0'
