name: merger-arbitrage-alpha-r1
on:
  push:
    paths:
      - '.github/workflows/merger-arbitrage-alpha-r1.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate merger arbitrage funds versus matched controls
        shell: python
        run: |
          import json, math, subprocess, sys
          subprocess.check_call([sys.executable,'-m','pip','install','-q','yfinance','pandas','numpy'])
          import yfinance as yf, pandas as pd, numpy as np
          symbols=['MNA','ARB','BIL','SPY']
          px=yf.download(symbols,start='2011-01-01',auto_adjust=True,progress=False)['Close'].dropna(how='all')
          if isinstance(px,pd.Series): px=px.to_frame()
          px=px.dropna()
          r=px.pct_change().dropna()
          cost_bps=10
          def cagr(s):
              n=(s.index[-1]-s.index[0]).days/365.25
              return (s.iloc[-1]/s.iloc[0])**(1/n)-1
          def mdd(s):
              return (s/s.cummax()-1).min()
          def annret(ret): return (1+ret).prod()**(252/len(ret))-1
          out={}
          for fund in ['MNA','ARB']:
              rr=r[[fund,'BIL','SPY']].dropna()
              beta=np.cov(rr[fund],rr['SPY'])[0,1]/np.var(rr['SPY'])
              beta=max(0,min(1,float(beta)))
              ctrl=beta*rr['SPY']+(1-beta)*rr['BIL']
              fund_net=rr[fund].copy()
              # one-time 10bp implementation haircut annualized conservatively as 10bp/year
              fund_ann=annret(fund_net)-cost_bps/10000
              ctrl_ann=annret(ctrl)
              years=sorted(set(rr.index.year))
              wins=0; eligible=0
              for y in years:
                  fy=rr.loc[rr.index.year==y,fund]
                  cy=ctrl.loc[ctrl.index.year==y]
                  if len(fy)>100:
                      eligible+=1
                      if (1+fy).prod()-1-cost_bps/10000 > (1+cy).prod()-1: wins+=1
              recent=rr.loc[rr.index>='2022-01-01']
              recent_ctrl=beta*recent['SPY']+(1-beta)*recent['BIL']
              out[fund]={
                'beta_spy':beta,
                'after_cost_cagr':fund_ann,
                'matched_control_cagr':ctrl_ann,
                'excess_cagr_pp':100*(fund_ann-ctrl_ann),
                'calendar_wins':wins,
                'calendar_years':eligible,
                'recent_2022_plus_excess_pp':100*((1+recent[fund]).prod()**(252/len(recent))-1-cost_bps/10000-((1+recent_ctrl).prod()**(252/len(recent_ctrl))-1)),
                'max_drawdown':float(((1+rr[fund]).cumprod()/((1+rr[fund]).cumprod().cummax())-1).min())
              }
          print('RESULT_JSON='+json.dumps(out,sort_keys=True))
          survivors={k:v for k,v in out.items() if v['excess_cagr_pp']>1.0 and v['calendar_wins']>=max(1,math.ceil(v['calendar_years']*0.6)) and v['recent_2022_plus_excess_pp']>0}
          print('SURVIVORS='+json.dumps(survivors,sort_keys=True))
