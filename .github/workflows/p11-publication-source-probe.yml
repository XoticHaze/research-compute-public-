name: p11-publication-source-probe

on:
  pull_request:
    paths:
      - 'research/p11_publication_authoritative_source_probe.py'
      - '.github/workflows/p11-publication-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile bounded source probe
        run: python -m py_compile research/p11_publication_authoritative_source_probe.py
      - name: Execute publication-authority gate
        run: python research/p11_publication_authoritative_source_probe.py
      - name: Emit deterministic receipt
        if: always()
        run: |
          if [ -f research/results/p11_publication_authoritative_source_probe.json ]; then
            cat research/results/p11_publication_authoritative_source_probe.json
          else
            echo 'P11_RECEIPT_MISSING=true'
          fi
