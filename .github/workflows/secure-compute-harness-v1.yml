name: Secure Compute Harness V1

on:
  workflow_call:
    inputs:
      grant_id:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: a846c0428d35a88c11407877c6930135ee19dbcb
          path: reference-harness-source
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Execute secure reference harness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFERENCE_GRANT_ID: ${{ inputs.grant_id }}
        run: python reference-harness-source/scripts/live_reference_harness_v1.py
