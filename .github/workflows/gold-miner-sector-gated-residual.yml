name: Gold Miner Sector-Gated Residual Ranker

on:
  pull_request:
    paths:
      - '.github/workflows/gold-miner-sector-gated-residual.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0
      - name: Execute two-stage sector gate plus residual ranker
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/source.py
          test "$(git hash-object /tmp/source.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json, numpy as np, pandas as pd
          from sklearn.linear_model import Ridge
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          spec=importlib.util.spec_from_file_location('src','/tmp/source.py'); src=importlib.util.module_from_spec(spec); spec.loader.exec_module(src)
          DEV=('NEM','GOLD','AEM','WPM','FNV','KGC','AU','AGI'); HOLD=('RGLD','HMY','BTG','PAAS'); CTX=('GDX','GLD','SPY','QQQ')
          H=20; DELAY=1; STEP=20; FEATURES=('rs20','rs60','rs126','beta126','resid_vol20','resid_vol60','rel_dd60','rs_accel')
          raw={s:src._load(s) for s in (*DEV,*CTX)}
          common=set(raw[DEV[0]].timestamp)
          for s in (*DEV[1:],*CTX): common &= set(raw[s].timestamp)
          cal=pd.DatetimeIndex(sorted(common)); px={s:raw[s].set_index('timestamp').price.reindex(cal) for s in (*DEV,*CTX)}
          def mom(x,n): return x/x.shift(n)-1
          gdx=px['GDX']; gld=px['GLD']; gdxr=gdx.pct_change(); rows=[]
          for s in DEV:
            p=px[s]; r=p.pct_change(); f=pd.DataFrame(index=cal); f['i']=np.arange(len(cal));
            for n in (20,60,126): f[f'rs{n}']=mom(p,n)-mom(gdx,n)
            cov=r.rolling(126).cov(gdxr); var=gdxr.rolling(126).var(); beta=cov/var; f['beta126']=beta
            resid=r-beta*gdxr; f['resid_vol20']=resid.rolling(20).std(ddof=0); f['resid_vol60']=resid.rolling(60).std(ddof=0)
            f['rel_dd60']=(p/p.rolling(60).max()-1)-(gdx/gdx.rolling(60).max()-1); f['rs_accel']=f['rs20']-f['rs60']
            f['target']=((p.shift(-(DELAY+H))/p.shift(-DELAY)-1)-(gdx.shift(-(DELAY+H))/gdx.shift(-DELAY)-1))*10000
            f['symbol']=s; rows.append(f.reset_index(names='timestamp'))
          panel=pd.concat(rows,ignore_index=True).replace([np.inf,-np.inf],np.nan)
          decisions=[]
          for i in range(756,len(cal)-(H+DELAY),STEP):
            # Prospectively frozen sector gate: miners admitted only when GDX has positive 126d trend and 63d relative strength vs GLD.
            gate=(mom(gdx,126).iloc[i]>0) and ((mom(gdx,63)-mom(gld,63)).iloc[i]>0)
            if not gate: continue
            train=panel[(panel.i < i-(H+DELAY)) & (panel.i % 5 == 0)].dropna(subset=[*FEATURES,'target'])
            test=panel[panel.i==i].dropna(subset=[*FEATURES])
            if len(train)<3000 or len(test)!=len(DEV): continue
            m=Pipeline([('s',StandardScaler()),('r',Ridge(alpha=10.0))]); m.fit(train[list(FEATURES)],train.target); test=test.copy(); test['pred']=m.predict(test[list(FEATURES)])
            chosen=test.nlargest(3,'pred').symbol.tolist(); e=i+DELAY; x=e+H
            gross=np.mean([px[s].iloc[x]/px[s].iloc[e]-1 for s in chosen])*10000
            equal=np.mean([px[s].iloc[x]/px[s].iloc[e]-1 for s in DEV])*10000
            rec={'signal':cal[i].isoformat(),'entry':cal[e].isoformat(),'exit':cal[x].isoformat(),'year':cal[e].year,'chosen':chosen,'gross_bps':gross,'equal_dev_bps':equal}
            for b in CTX: rec[f'{b}_bps']=(px[b].iloc[x]/px[b].iloc[e]-1)*10000
            decisions.append(rec)
          if len(decisions)<25: raise RuntimeError(f'insufficient gated decisions={len(decisions)}')
          df=pd.DataFrame(decisions); metrics={}
          for cost in (25.,50.,100.):
            net=df.gross_bps-cost; mm={}
            for b,col in [('GDX','GDX_bps'),('GLD','GLD_bps'),('EQUAL_DEV','equal_dev_bps'),('SPY','SPY_bps'),('QQQ','QQQ_bps')]:
              ex=net-df[col]; yrs={str(y):float(ex[df.year==y].mean()) for y in sorted(df.year.unique())}; mm[b]={'excess_bps_per_decision':float(ex.mean()),'positive_years':sum(v>0 for v in yrs.values()),'year_count':len(yrs),'year_excess_bps':yrs}
            metrics[str(int(cost))]=mm
          p=metrics['50']; checks={'gdx_positive':p['GDX']['excess_bps_per_decision']>0,'equal_dev_positive':p['EQUAL_DEV']['excess_bps_per_decision']>0,'gdx_year_breadth':p['GDX']['positive_years']>=max(4,(p['GDX']['year_count']+1)//2),'cost100_gdx_positive':metrics['100']['GDX']['excess_bps_per_decision']>0,'holdouts_loaded':False}
          decision='ELIGIBLE_FOR_SEALED_TRANSFER' if all(v for k,v in checks.items() if k!='holdouts_loaded') else 'SECTOR_GATED_RESIDUAL_NOT_SUPPORTED'
          out={'schema':'gold_miner_sector_gated_residual.v1','contract':{'development':DEV,'sealed_holdout':HOLD,'holdouts_loaded':False,'sector_gate':'GDX_126d_return>0 AND (GDX_63d_return-GLD_63d_return)>0','within_sector_model':'expanding pooled StandardScaler+Ridge(alpha=10)','target':'forward20_stock_minus_GDX','features':FEATURES,'selection':'top3','costs_bps':[25,50,100]},'window':{'first_entry':df.entry.min(),'last_exit':df.exit.max(),'decisions':len(df)},'metrics':metrics,'checks':checks,'decision':decision,'research_only':True,'promotion_authority':False,'allocation_authority':False,'live_trading_change':False}
          print('SECTOR_GATED_GOLD='+json.dumps(out,sort_keys=True))
          open('/tmp/result.json','w').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-miner-sector-gated-residual
          path: /tmp/result.json
