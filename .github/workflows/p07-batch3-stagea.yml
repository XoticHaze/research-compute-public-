name: P07 Batch3 Stage-A Expansion

on:
  pull_request:
    paths:
      - '.github/workflows/p07-batch3-stagea.yml'
      - 'research/p07-batch3-contract.json'

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        family: [large_pharma, consumer_staples, equity_reits, large_retail]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Materialize pinned public Stage-A evaluator
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
      - name: Install accepted numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute independently frozen family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path

          family = os.environ['FAMILY']
          contract = json.loads(Path('research/p07-batch3-contract.json').read_text())
          assert contract['external_holdouts_loaded'] is False
          assert contract['no_failed_family_rescue'] is True
          source = contract['families'][family]
          assert len(source['development_universe']) == 8
          assert len(source['external_holdouts']) == 4
          assert set(source['development_universe']).isdisjoint(source['external_holdouts'])

          spec = importlib.util.spec_from_file_location('stagea', '.campaign/runner.py')
          stagea = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(stagea)
          out_path = Path(f'p07-batch3-{family}-receipt.json')
          try:
              result = stagea._evaluate_matrix(
                  {family: {
                      'development_universe': source['development_universe'],
                      'primary_industry_etf': source['primary_industry_etf'],
                  }},
                  contract['cutoff'],
              )
              summary = result['family_summary'][family]
              out = {
                  'schema': 'research_compute_public.p07_batch3_family_receipt.v1',
                  'family': family,
                  'status': 'PASS',
                  'family_summary': summary,
                  'per_symbol': [x for x in result['per_symbol'] if x['family'] == family],
                  'selection_calendar': result['selection_calendar'],
                  'external_holdouts_frozen': source['external_holdouts'],
                  'external_holdouts_loaded': False,
                  'decision': 'ADVANCE_TO_SEALED_EXTERNAL_HOLDOUT' if summary['development_family_gate_pass'] else 'REJECT_EXACT_GENERIC_STAGEA_NO_RESCUE',
                  'research_only': True,
                  'promotion_authority': False,
                  'runtime_mutation': False,
                  'live_trading_change': False,
              }
          except Exception as exc:
              out = {
                  'schema': 'research_compute_public.p07_batch3_family_receipt.v1',
                  'family': family,
                  'status': 'FAIL',
                  'error': f'{type(exc).__name__}: {exc}',
                  'external_holdouts_frozen': source['external_holdouts'],
                  'external_holdouts_loaded': False,
                  'research_only': True,
                  'promotion_authority': False,
                  'runtime_mutation': False,
                  'live_trading_change': False,
              }
          out_path.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print('P07_BATCH3_TERMINAL=' + json.dumps(out, sort_keys=True))
          if out['status'] != 'PASS':
              raise SystemExit(1)
          PY
      - name: Retain machine-consumable family receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-batch3-${{ matrix.family }}-receipt
          path: p07-batch3-${{ matrix.family }}-receipt.json
          if-no-files-found: error
          retention-days: 14
