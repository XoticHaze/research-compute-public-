name: P46 P36 Causal Sleeve Attribution R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_causal_sleeve_attribution_r1.py'
      - '.github/workflows/p46-p36-causal-sleeve-attribution-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_causal_sleeve_attribution_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_causal_sleeve_attribution_r1.json')); d=x['tests']['1']['50']; vals={'decision':x['decision'],'p46':f"{100*d['p46_excess_cagr']:.3f}",'p36':f"{100*d['p36_excess_cagr']:.3f}",'blend':f"{100*d['blend_excess_cagr']:.3f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            for k,v in vals.items(): f.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-sleeves__${{ steps.evaluate.outputs.decision }}__p46_${{ steps.evaluate.outputs.p46 }}pp__p36_${{ steps.evaluate.outputs.p36 }}pp__blend_${{ steps.evaluate.outputs.blend }}pp
          path: artifacts/p46_p36_causal_sleeve_attribution_r1.json
          if-no-files-found: error
