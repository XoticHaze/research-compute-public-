name: P06 Slow Funding Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/p06-slow-funding-*.txt'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  PRODUCER_REQUEST_ROOT: rendezvous/producer-requests
  EXCHANGE_REF: rendezvous-exchange

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography numpy pandas scikit-learn
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'p06-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          key_id='sha256:'+hashlib.sha256(public_raw).hexdigest()
          public={'schema':'p06-slow-funding-ephemeral-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'recipient_b64':base64.b64encode(public_raw).decode('ascii'),'recipient_key_id':key_id}
          Path(os.environ['RUNNER_TEMP'],'p06-recipient.json').write_text(json.dumps(public,sort_keys=True)+'\n')
          producer_request={
              'schema':'p06-slow-funding-producer-request-v1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'recipient_key_id':key_id,
              'authority':'research_only',
              'private_authority':'XoticHaze/research-foundry',
              'private_ref':'assistant/slow-sector-funding-216-r1@848d0e576cf24bfc4015ae94b6f2e9ab74db7c4f',
              'packager':'scripts/package_p06_slow_funding_ephemeral_v1.py',
              'harness':'research_foundry_p06_slow_funding_216_v1',
              'recipient_path':f"rendezvous/recipients/{os.environ['GITHUB_RUN_ID']}.json",
              'envelope_path':f"rendezvous/responses/{os.environ['GITHUB_RUN_ID']}/p06-slow-funding-envelope.json",
          }
          Path(os.environ['RUNNER_TEMP'],'p06-producer-request.json').write_text(json.dumps(producer_request,sort_keys=True)+'\n')
          print('P06_EPHEMERAL_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('P06_EPHEMERAL_RECIPIENT_KEY_ID='+key_id)
          PY
      - name: Publish recipient and producer request to isolated exchange
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_file() {
            local source="$1"
            local path="$2"
            local message="$3"
            local payload body
            payload="$(base64 -w0 "$source")"
            body="$(python - "$payload" "$EXCHANGE_REF" "$message" <<'PY'
          import json,sys
          print(json.dumps({'message':sys.argv[3],'content':sys.argv[1],'branch':sys.argv[2]}))
          PY
            )"
            curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" -d "$body" >/dev/null
          }
          publish_file "$RUNNER_TEMP/p06-recipient.json" "${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json" 'rendezvous: publish one-run P06 recipient'
          publish_file "$RUNNER_TEMP/p06-producer-request.json" "${PRODUCER_REQUEST_ROOT}/${GITHUB_RUN_ID}.json" 'rendezvous: publish one-run P06 producer request'
      - name: Wait for run-bound encrypted envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/p06-slow-funding-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 540); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/p06-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound P06 envelope did not arrive'; exit 42; }
      - name: Execute fixed private workload and emit sanitized receipt
        run: python scripts/p06_slow_funding_ephemeral_consumer_v1.py --envelope "$RUNNER_TEMP/p06-envelope.json" --private-key "$RUNNER_TEMP/p06-private.b64" --run-id "$GITHUB_RUN_ID"
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/p06-private.b64" "$RUNNER_TEMP/p06-recipient.json" "$RUNNER_TEMP/p06-producer-request.json" "$RUNNER_TEMP/p06-envelope.json"
