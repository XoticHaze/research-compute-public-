name: P29 PIT Causal Entry Delay R1
on:
  pull_request:
    paths:
      - 'research/p29_pit_causal_entry_delay_r1.py'
      - '.github/workflows/p29-pit-causal-entry-delay-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
          python -m pip install --disable-pip-version-check -q 'git+https://github.com/arielNacamulli/pitindex.git@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - run: python research/p29_pit_causal_entry_delay_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p29-pit-causal-entry-delay-r1
          path: p29_pit_causal_entry_delay_r1.json
          if-no-files-found: error
