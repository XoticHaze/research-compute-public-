name: P95 Park P96 Concentration Product Acceptance

on:
  pull_request:
    paths:
      - 'product_contracts/p95_p96_posture/**'
      - '.github/workflows/p95-park-p96-concentration-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-product-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Execute P95 park and P96 concentration product contract
        run: node --test product_contracts/p95_p96_posture/product_contract_acceptance.test.mjs
