name: Completed Trade Schema Acceptance R1
on:
  pull_request:
    paths:
      - '.github/workflows/completed-trade-schema-acceptance-r1.yml'
      - 'research/completed_trade_schema_acceptance_r1.py'
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify sanitized completed-trade schema contract
        run: python research/completed_trade_schema_acceptance_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completed-trade-schema-acceptance-r1-result
          path: completed-trade-schema-acceptance-r1-result.json
          retention-days: 14
