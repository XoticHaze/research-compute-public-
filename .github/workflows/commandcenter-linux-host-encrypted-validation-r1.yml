name: CommandCenter Linux Host Encrypted Validation R1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rendezvous/requests/cc-linux-host-r1-*.txt'
      - '.github/workflows/commandcenter-linux-host-encrypted-validation-r1.yml'
      - 'scripts/commandcenter_linux_host_ephemeral_consumer_v1.py'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses/cc-linux-host
  RECIPIENT_ROOT: rendezvous/recipients/cc-linux-host
  EXCHANGE_REF: rendezvous-exchange
  PRIVATE_HEAD: 968accac5bb72f515471ee2adc6c703f1d3341e8
  CATALOG_SHA256: a39ca7d2f269e3ea5f89c2ccf905b900d4c8c2e88abb8700db2fbd4d53a883cc

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'cc-linux-host-private-key.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={
            'schema':'commandcenter-linux-host-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
            'private_head':os.environ['PRIVATE_HEAD'],
            'catalog_sha256':os.environ['CATALOG_SHA256'],
          }
          Path(os.environ['RUNNER_TEMP'],'cc-linux-host-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('CC_LINUX_HOST_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('CC_LINUX_HOST_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY

      - name: Publish public recipient to exchange branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recipient_path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/cc-linux-host-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish CommandCenter Linux host recipient','content':content,'branch':branch}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${recipient_path}" \
            -d "$body" >/dev/null
          echo "CC_LINUX_HOST_RECIPIENT_PATH=${recipient_path}"

      - name: Wait for run-bound encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/sealed-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${response_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/sealed-envelope.json"; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound encrypted Linux host payload did not arrive'; exit 42; }

      - name: Validate exact private Linux host package
        run: |
          set -euo pipefail
          python scripts/commandcenter_linux_host_ephemeral_consumer_v1.py \
            --envelope "$RUNNER_TEMP/sealed-envelope.json" \
            --private-key "$RUNNER_TEMP/cc-linux-host-private-key.b64" \
            --run-id "$GITHUB_RUN_ID"

      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/cc-linux-host-private-key.b64" "$RUNNER_TEMP/cc-linux-host-recipient.json" "$RUNNER_TEMP/sealed-envelope.json"
