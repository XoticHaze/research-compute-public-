name: P526 P249 Inflation Regime Robustness R1
on:
  pull_request:
    branches: ['market-research/p523-p249-semiconductor-dependency']
    paths:
      - 'research/p526_p249_inflation_regime_robustness_r1.py'
      - '.github/workflows/p526-p249-inflation-regime-robustness-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: eval
        run: |
          python research/p526_p249_inflation_regime_robustness_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p526_p249_inflation_regime_robustness_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p526-p249-inflation-regime-robustness-r1__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p526_p249_inflation_regime_robustness_r1.json
          if-no-files-found: error
          retention-days: 90
