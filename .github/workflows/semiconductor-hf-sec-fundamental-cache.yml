name: Semiconductor HF SEC Fundamental Cache
on:
  pull_request:
    paths:
      - 'research/semiconductor_hf_sec_fundamental_cache_20260906.py'
      - 'research/semiconductor_hf_sec_fundamental_cache_route2_20260906.py'
      - '.github/workflows/semiconductor-hf-sec-fundamental-cache.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install exact public-cache environment
        run: python -m pip install --disable-pip-version-check -q pandas==3.0.5 pyarrow==21.0.0 huggingface_hub==0.34.4
      - name: Execute targeted SEC-derived fundamental cache preflight
        run: |
          python research/semiconductor_hf_sec_fundamental_cache_20260906.py || \
          python research/semiconductor_hf_sec_fundamental_cache_route2_20260906.py
      - name: Retain normalized cache and source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semiconductor-hf-sec-fundamental-cache
          path: |
            semiconductor_hf_sec_fundamental_preflight_20260906.json
            semiconductor_hf_sec_fundamental_cache_20260906.json
          retention-days: 14
          if-no-files-found: warn
