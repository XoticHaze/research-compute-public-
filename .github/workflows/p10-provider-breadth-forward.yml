name: P10 Provider Breadth Forward
on:
  pull_request:
    paths:
      - 'research/compute_provider_breadth_forward.py'
      - 'research/compute_provider_breadth_forward_runner.py'
      - 'research/p10-provider-breadth-contract.json'
      - '.github/workflows/p10-provider-breadth-forward.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute provider-breadth forward discriminator and cache panel
        run: |
          python research/compute_provider_breadth_forward_runner.py \
            research/p10-provider-breadth-contract.json \
            p10-provider-month-panel-20260729.csv.gz \
            p10-provider-breadth-result.json
      - name: Validate terminal result
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('p10-provider-breadth-result.json').read_text())
          assert r['schema']=='research_compute_public.p10_provider_breadth_forward.v1'
          assert r['research_only'] and not r['promotion_authority'] and not r['private_data_loaded']
          panel=Path('p10-provider-month-panel-20260729.csv.gz')
          assert hashlib.sha256(panel.read_bytes()).hexdigest()==r['cache']['provider_month_panel_sha256']
          print('P10_PROVIDER_BREADTH_CLASSIFICATION='+r['classification'])
          print('P10_PROVIDER_BREADTH_WINS='+json.dumps(r['supported_winning_horizons'],sort_keys=True))
          print('P10_PROVIDER_BREADTH_GATE='+json.dumps(r['generation_gate'],sort_keys=True))
          print('P10_PROVIDER_PANEL_SHA256='+r['cache']['provider_month_panel_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p10-provider-month-panel-20260729
          path: p10-provider-month-panel-20260729.csv.gz
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: p10-provider-breadth-result
          path: p10-provider-breadth-result.json
          retention-days: 90
