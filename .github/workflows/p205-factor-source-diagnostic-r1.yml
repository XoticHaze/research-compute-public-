name: P205 Factor Source Diagnostic R1
on:
  pull_request:
    paths:
      - 'research/p205_factor_source_diagnostic_r1.py'
      - '.github/workflows/p205-factor-source-diagnostic-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 requests==2.32.3
      - id: eval
        run: |
          python research/p205_factor_source_diagnostic_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p205_factor_source_diagnostic_r1.json')); r=x['tests']['RMW']['2014']; m=x['tests']['MOM']['2014']; bp=lambda v:int(round(v*10000))
          tag=f"RMW_{bp(r['annualized_mean'])}bp_{r['positive_fold_means']}f__MOM_{bp(m['annualized_mean'])}bp_{m['positive_fold_means']}f"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p205-factor-source-diagnostic__${{ steps.eval.outputs.tag }}
          path: artifacts/p205_factor_source_diagnostic_r1.json
          if-no-files-found: error