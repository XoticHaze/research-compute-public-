name: MM-IBKR Gateway Access App Provisioning R1

# A single protected main-branch run exercises the previously established
# Cloudflare Access-capable repository credential. No broker credentials.
on:
  pull_request:
    paths:
      - .github/workflows/mmibkr-cf-existing-access-credential-probe-r1.yml
      - scripts/mmibkr_cf_access_existing_token_probe_v1.py
      - tests/test_mmibkr_cf_access_existing_token_probe_v1.py
  push:
    branches: [main]
    paths:
      - .github/workflows/mmibkr-cf-existing-access-credential-probe-r1.yml
      - scripts/mmibkr_cf_access_existing_token_probe_v1.py
      - tests/test_mmibkr_cf_access_existing_token_probe_v1.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_mmibkr_cf_access_existing_token_probe_v1.py' -v
          python -m py_compile scripts/mmibkr_cf_access_existing_token_probe_v1.py
          echo MMIBKR_CF_BROKER_CREDENTIALS_LOADED=NO

  create_protected_gateway_access_app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_GATEWAY_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_GATEWAY_ACCESS_TOKEN }}
      CLOUDFLARE_GATEWAY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ACCOUNT_ID }}
      MMIBKR_CF_SHARED_COMPUTE_PROVISION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Provision Shared Compute Gateway SSH Access app and verify deny-by-default readback
        run: |
          set -euo pipefail
          python scripts/mmibkr_cf_access_existing_token_probe_v1.py
