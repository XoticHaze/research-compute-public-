name: MM-IBKR IBKR Paper Ephemeral Rendezvous

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'rendezvous/requests/mmibkr-ibkr-paper-*.txt'

permissions:
  contents: write

concurrency:
  group: mmibkr-ibkr-paper-${{ github.run_id }}
  cancel-in-progress: false

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check -q cryptography
      - name: Compile fixed MM-IBKR paper consumer
        run: python -m py_compile scripts/mmibkr_ephemeral_scoped_v1.py scripts/mmibkr_ibkr_paper_ephemeral_consumer_v1.py
      - name: Generate one-run MM-IBKR paper recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          key_id='sha256:'+hashlib.sha256(public_raw).hexdigest()
          Path(os.environ['RUNNER_TEMP'],'mmibkr-paper-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={
            'schema':'mmibkr-ibkr-paper-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'authority':'paper_execution_only',
            'harness':'mmibkr_ibkr_canonical_paper_submit_v1',
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':key_id,
          }
          Path(os.environ['RUNNER_TEMP'],'mmibkr-paper-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('MMIBKR_PAPER_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('MMIBKR_PAPER_RECIPIENT_KEY_ID='+key_id)
          PY
      - name: Publish one-run public recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-mmibkr-ibkr-paper.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/mmibkr-paper-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish MM-IBKR IBKR paper recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o "$RUNNER_TEMP/mmibkr-paper-publish.json" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" -d "$body")"
            if [ "$code" = 201 ]; then ok=1; break; fi
            if [ "$code" != 409 ]; then cat "$RUNNER_TEMP/mmibkr-paper-publish.json"; exit 43; fi
            sleep "$attempt"
          done
          test "$ok" = 1 || { cat "$RUNNER_TEMP/mmibkr-paper-publish.json"; exit 44; }
          echo "MMIBKR_PAPER_RECIPIENT_PATH=${path}"
      - name: Wait for run-bound encrypted MM-IBKR paper envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          envelope_path="${response_root}/mmibkr-ibkr-paper-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${envelope_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/mmibkr-paper-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound MM-IBKR paper envelope did not arrive'; exit 42; }
          echo "MMIBKR_PAPER_RESPONSE_ROOT=${response_root}" >> "$GITHUB_ENV"
      - name: Assemble authenticated ciphertext chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path
          env=json.loads(Path(os.environ['RUNNER_TEMP'],'mmibkr-paper-envelope.json').read_text())
          chunks=env.get('chunks')
          if not isinstance(chunks,list) or not chunks or len(chunks)>32:
              raise SystemExit('invalid MM-IBKR paper chunk manifest')
          texts=[]
          for node in chunks:
              path=str(node['path'])
              quoted='/'.join(urllib.parse.quote(part,safe='') for part in path.split('/'))
              url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{quoted}?ref={urllib.parse.quote(os.environ['EXCHANGE_REF'],safe='')}"
              req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              if len(raw)!=int(node['chars']) or hashlib.sha256(raw).hexdigest()!=node['sha256']:
                  raise SystemExit('MM-IBKR paper ciphertext chunk integrity failure')
              texts.append(raw.decode('ascii'))
          ciphertext=base64.b64decode(''.join(texts).encode('ascii'),validate=True)
          if hashlib.sha256(ciphertext).hexdigest()!=env.get('ciphertext_sha256'):
              raise SystemExit('MM-IBKR paper assembled ciphertext digest mismatch')
          Path(os.environ['RUNNER_TEMP'],'mmibkr-paper-ciphertext.bin').write_bytes(ciphertext)
          PY
      - name: Execute fixed canonical paper-submit workload
        run: |
          set -euo pipefail
          python scripts/mmibkr_ibkr_paper_ephemeral_consumer_v1.py \
            --envelope "$RUNNER_TEMP/mmibkr-paper-envelope.json" \
            --ciphertext "$RUNNER_TEMP/mmibkr-paper-ciphertext.bin" \
            --private-key "$RUNNER_TEMP/mmibkr-paper-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --response-root "$MMIBKR_PAPER_RESPONSE_ROOT"
      - name: Remove one-run private material and containers
        if: always()
        run: |
          docker rm -f ibkr-gateway >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/mmibkr-paper-private.b64" \
                "$RUNNER_TEMP/mmibkr-paper-recipient.json" \
                "$RUNNER_TEMP/mmibkr-paper-envelope.json" \
                "$RUNNER_TEMP/mmibkr-paper-ciphertext.bin" \
                "$RUNNER_TEMP/mmibkr-paper-publish.json"
