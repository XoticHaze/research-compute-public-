name: P569 TSA FOIA Archive Discovery R1
on:
  pull_request:
    paths:
      - 'research/p569_tsa_foia_archive_discovery_r1.py'
      - '.github/workflows/p569-tsa-foia-archive-discovery-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - run: python research/p569_tsa_foia_archive_discovery_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p569-tsa-foia-archive-discovery-r1
          path: artifacts/p569_tsa_foia_archive_discovery_r1.json
          if-no-files-found: error
