name: Recovery RC-004 W106 Public

on:
  pull_request:
    branches: [main]
    paths:
      - 'recovery/w106_public_recovery.py'
      - '.github/workflows/recovery-w106-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w106-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas pytz tzdata
      - name: Verify public W106 executable
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile recovery/w106_public_recovery.py
          echo 'W106_PUBLIC_EXECUTABLE_COMPILE=PASS'
      - name: Fetch exact pinned MNQ source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .campaign/MNQ_DATA
          mkdir -p .campaign
          git clone --filter=blob:none --no-checkout https://github.com/mbytes21/MNQ_DATA.git .campaign/MNQ_DATA
          cd .campaign/MNQ_DATA
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone 'plaintext_csv/MNQ */*.Last.csv'
          git checkout fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git rev-parse HEAD)" = 'fc5508e2c152938d6d9eb70a36b888ae26107176'
          echo 'W106_MNQ_SOURCE_PIN=PASS'
      - name: Execute W106 parity and Regime-1 recovery consumer
        shell: bash
        run: |
          set -euo pipefail
          python recovery/w106_public_recovery.py \
            --source-root .campaign/MNQ_DATA/plaintext_csv \
            --workdir artifacts/w106 \
            2>&1 | tee artifacts-w106-run.log
      - name: Preserve deterministic receipt in job log
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/w106/recovery-receipt.json ]; then
            echo '=== RC004_W106_RECOVERY_RECEIPT ==='
            cat artifacts/w106/recovery-receipt.json
          fi
