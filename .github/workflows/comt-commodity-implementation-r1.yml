name: COMT Commodity Implementation R1
on:
  pull_request:
    paths:
      - '.github/workflows/comt-commodity-implementation-r1.yml'
      - 'research/comt-commodity-implementation-r1.json'
      - 'research/comt_commodity_implementation_r1.py'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Evaluate frozen COMT commodity implementation discriminator
        run: python research/comt_commodity_implementation_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comt-commodity-implementation-r1-result
          path: comt-commodity-implementation-r1-result.json
          retention-days: 14
