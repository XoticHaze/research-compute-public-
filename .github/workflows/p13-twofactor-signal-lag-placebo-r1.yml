name: P13 Twofactor Signal Lag Placebo R1
on:
  pull_request:
    paths: ['scripts/p13_twofactor_signal_lag_placebo_r1.py','.github/workflows/p13-twofactor-signal-lag-placebo-r1.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python scripts/p13_twofactor_signal_lag_placebo_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_twofactor_signal_lag_placebo_r1.json')); r=x['tests']['2022_forward']; vals={'decision':x['decision'],'lag0':f"{100*r['0']['excess_vs_smh']:.2f}",'lag1':f"{100*r['1']['excess_vs_smh']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-signal-lag__${{ steps.evaluate.outputs.decision }}__lag0_${{ steps.evaluate.outputs.lag0 }}pp__lag1_${{ steps.evaluate.outputs.lag1 }}pp
          path: artifacts/p13_twofactor_signal_lag_placebo_r1.json
          if-no-files-found: error
