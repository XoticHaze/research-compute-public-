name: P04 R3 Trigger Partition Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/mnq_dca_reserve_release_r3_h24_concordance_consumer_v1.py'
      - 'scripts/check_p04_r3_request_trigger_partition.py'
      - '.github/workflows/mnq-dca-reserve-release-r3-h24-concordance-20260912.yml'
      - '.github/workflows/p04-r3-trigger-partition-check.yml'

permissions:
  contents: read

jobs:
  partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Compile frozen consumer and prove request partition
        run: |
          set -euo pipefail
          python -m py_compile scripts/mnq_dca_reserve_release_r3_h24_concordance_consumer_v1.py scripts/check_p04_r3_request_trigger_partition.py
          python scripts/check_p04_r3_request_trigger_partition.py
