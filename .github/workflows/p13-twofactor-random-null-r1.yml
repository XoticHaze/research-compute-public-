name: P13 Twofactor Random Null R1
on:
  pull_request:
    paths:
      - 'scripts/p13_twofactor_random_null_r1.py'
      - '.github/workflows/p13-twofactor-random-null-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python scripts/p13_twofactor_random_null_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_twofactor_random_null_r1.json')); r=x['tests']['2022_forward']; vals={'decision':x['decision'],'p':f"{r['p_null_ge_actual']:.4f}",'pct':f"{100*r['actual_percentile']:.1f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-twofactor-random-null__${{ steps.evaluate.outputs.decision }}__p_${{ steps.evaluate.outputs.p }}__pct_${{ steps.evaluate.outputs.pct }}
          path: artifacts/p13_twofactor_random_null_r1.json
          if-no-files-found: error
