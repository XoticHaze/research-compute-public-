name: MM-IBKR Live Admission Handoff Contract R1

# This ONLY validates sanitized receipt identity, checkpoint transfer, and
# fail-closed admission. No Gateway login, no credentials, no source-vault grant.
on:
  push:
    branches:
      - test/mmibkr-live-fresh-runner-admission-handoff-20261013
      - fix/mmibkr-admission-receipt-synthetic-proof-r2-20261013
    paths:
      - '.github/workflows/mmibkr-live-admission-handoff-contract-r1.yml'
      - 'scripts/mmibkr_live_admission_handoff_v1.py'
      - 'tests/test_mmibkr_live_admission_handoff_v1.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mmibkr-live-admission-handoff-contract-r1.yml'
      - 'scripts/mmibkr_live_admission_handoff_v1.py'
      - 'tests/test_mmibkr_live_admission_handoff_v1.py'

permissions:
  contents: read

jobs:
  predecessor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Fail-closed no-order live admission receipt unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_mmibkr_live_admission_handoff_v1.py' -v
          echo 'MMIBKR_NO_BROKER_LIVE_HANDOFF_CONTRACT=PASS'
      - name: Produce explicit synthetic no-order receipt
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-admission-receipt"
          python scripts/mmibkr_live_admission_handoff_v1.py write \
            --run-id "$GITHUB_RUN_ID" --head "$GITHUB_SHA" \
            --path "$RUNNER_TEMP/mmibkr-admission-receipt/live-handoff.json"
          test "$(stat -c %a "$RUNNER_TEMP/mmibkr-admission-receipt/live-handoff.json")" = 600
      - name: Save synthetic receipt for another GitHub VM
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-admission-receipt
          key: mmibkr-live-admission-only-synthetic-v1-${{ github.run_id }}-${{ github.sha }}
      - name: Delete predecessor local state
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mmibkr-admission-receipt"
          echo 'MMIBKR_BROKER_AUTH=NOT_ATTEMPTED'

  successor:
    needs: predecessor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Restore exact predecessor synthetic receipt
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mmibkr-admission-receipt
          key: mmibkr-live-admission-only-synthetic-v1-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Accept different VM and refuse live order ownership
        run: |
          set -euo pipefail
          python scripts/mmibkr_live_admission_handoff_v1.py accept \
            --run-id "$((GITHUB_RUN_ID + 1))" --head "$GITHUB_SHA" \
            --path "$RUNNER_TEMP/mmibkr-admission-receipt/live-handoff.json" \
            --output "$RUNNER_TEMP/mmibkr-admission-receipt/accepted.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mmibkr-admission-receipt/accepted.json"
          n=json.loads(p.read_text())
          assert n["safe_for_new_readonly_gateway"] is False
          assert n["synthetic_cross_runner_receipt_accepted"] is True
          assert n["live_order_ownership_granted"] is False
          assert n["gateway_authentication_migration_proven"] is False
          print("MMIBKR_FREE_CROSS_VM_SYNTHETIC_ADMISSION_FIXTURE=PASS")
          print("MMIBKR_VERIFIED_LIVE_GATEWAY_HANDOFF=0")
          print("MMIBKR_LIVE_GATEWAY_AUTH_TRANSFER=NOT_TESTED")
          print("MMIBKR_LIVE_ORDER_DISPATCH=0")
          PY
      - name: Destroy successor synthetic receipt
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mmibkr-admission-receipt"
