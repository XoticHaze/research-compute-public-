name: Industry Stage-A Batch 4

on:
  push:
    paths:
      - '.github/workflows/industry-stagea-batch4.yml'
  pull_request:
    paths:
      - '.github/workflows/industry-stagea-batch4.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: transportation
            benchmark: IYT
            symbols: UNP,CSX,NSC,UPS,FDX,ODFL,JBHT,CHRW
          - family: restaurants
            benchmark: PBJ
            symbols: MCD,SBUX,CMG,YUM,DRI,DPZ,TXRH,QSR
          - family: cybersecurity
            benchmark: CIBR
            symbols: PANW,CRWD,FTNT,ZS,OKTA,CYBR,S,GEN
          - family: asset_managers
            benchmark: KCE
            symbols: BLK,BX,KKR,APO,TROW,BEN,IVZ,ARES
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute unchanged Stage-A family evaluator
        env:
          FAMILY: ${{ matrix.family }}
          BENCHMARK: ${{ matrix.benchmark }}
          SYMBOLS: ${{ matrix.symbols }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json, os
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          family=os.environ['FAMILY']; symbols=os.environ['SYMBOLS'].split(',')
          contract={family:{'primary_industry_etf':os.environ['BENCHMARK'],'development_universe':symbols}}
          out=r._evaluate_matrix(contract,'2026-09-01T13:30:00+00:00')
          s=out['family_summary'][family]
          receipt={
            'schema':'industry_stagea_batch4.v1','family':family,'benchmark':os.environ['BENCHMARK'],
            'development_universe':symbols,'external_holdouts_loaded':False,'family_summary':s,
            'per_symbol':out['per_symbol'],
            'decision':'ADVANCE' if s['development_family_gate_pass'] else 'REJECT_OR_REARCHITECT',
            'research_only':True,'promotion_authority':False,'allocation_authority':False,
            'runtime_mutation':False,'live_trading_change':False
          }
          path=f'{family}-stagea-batch4-receipt.json'
          open(path,'w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('INDUSTRY_STAGEA_BATCH4='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagea-batch4-${{ matrix.family }}
          path: ${{ matrix.family }}-stagea-batch4-receipt.json
          retention-days: 14
