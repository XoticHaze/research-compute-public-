name: P128-P130 Survivor Temporal Concentration R1
on:
  pull_request:
    paths:
      - 'research/p104_p111_crossasset_model_family_tournament_r1.py'
      - 'research/p128_p130_survivor_temporal_concentration_r1.py'
      - '.github/workflows/p128-p130-survivor-temporal-concentration-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65 scikit-learn==1.5.2
      - run: python research/p128_p130_survivor_temporal_concentration_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p128-p130-survivor-temporal-concentration-r1
          path: artifacts/p128_p130_survivor_temporal_concentration_r1.json
          if-no-files-found: error
