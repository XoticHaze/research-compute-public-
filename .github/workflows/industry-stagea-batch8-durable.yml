name: Industry Stage-A Batch 8 Durable Receipts

on:
  push:
    paths:
      - '.github/workflows/industry-stagea-batch8-durable.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - family: gold_miners
            benchmark: GDX
            symbols: NEM,GOLD,AEM,WPM,FNV,KGC,AU,AGI
            holdouts: RGLD,HMY,BTG,PAAS
          - family: pharmaceuticals
            benchmark: IHE
            symbols: LLY,JNJ,MRK,PFE,ABBV,BMY,GSK,AZN
            holdouts: AMGN,NVS,SNY,TAK
          - family: freight_transport
            benchmark: IYT
            symbols: UNP,CSX,NSC,CNI,CP,JBHT,ODFL,SAIA
            holdouts: CHRW,EXPD,KNX,FDX
          - family: steel_metals
            benchmark: SLX
            symbols: NUE,STLD,CMC,MT,GGB,SID,CLF,RS
            holdouts: TX,PKX,CENX,AA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute unchanged Stage-A science
        env:
          FAMILY: ${{ matrix.family }}
          BENCHMARK: ${{ matrix.benchmark }}
          SYMBOLS: ${{ matrix.symbols }}
          HOLDOUTS: ${{ matrix.holdouts }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json, os
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          family=os.environ['FAMILY']; benchmark=os.environ['BENCHMARK']; symbols=os.environ['SYMBOLS'].split(','); holdouts=os.environ['HOLDOUTS'].split(',')
          path=f'results/{family}-stagea-batch8-receipt.json'
          os.makedirs('results', exist_ok=True)
          required=[*r.TRAIN,*symbols,'QQQ',benchmark]
          source={}; frames={}
          for symbol in required:
              try:
                  f=r._load(symbol); frames[symbol]=f
                  source[symbol]={'status':'OK','rows':len(f),'start':f.iloc[0].timestamp.isoformat() if len(f) else None,'end':f.iloc[-1].timestamp.isoformat() if len(f) else None}
              except Exception as exc:
                  source[symbol]={'status':'ERROR','error':f'{type(exc).__name__}: {exc}'}
          errors={k:v for k,v in source.items() if v['status']!='OK'}
          try:
              if errors:
                  raise RuntimeError('source load failures: '+json.dumps(errors,sort_keys=True))
              common=set(frames[required[0]].timestamp)
              for symbol in required[1:]: common &= set(frames[symbol].timestamp)
              if len(common) < 1500:
                  raise RuntimeError(f'insufficient common source calendar={len(common)}')
              cutoff=max(common).isoformat()
              out=r._evaluate_matrix({family:{'primary_industry_etf':benchmark,'development_universe':symbols}},cutoff)
              s=out['family_summary'][family]
              receipt={'schema':'industry_stagea_batch8.v1','family':family,'benchmark':benchmark,'development_universe':symbols,
                'frozen_external_holdouts':holdouts,'cutoff':cutoff,'source_support':'SUFFICIENT','source':source,
                'external_holdouts_loaded':False,'family_summary':s,'per_symbol':out['per_symbol'],
                'decision':'ADVANCE_TO_MATCHED_BROAD_ROBUSTNESS' if s['development_family_gate_pass'] else 'REJECT_OR_REARCHITECT',
                'broad_market_alpha_claim_authorized':False,
                'next_if_advance':'same-event matched SPY/QQQ, cost stress, fold breadth, concentration; no holdout load until that consumer passes',
                'research_only':True,'promotion_authority':False,'allocation_authority':False,'runtime_mutation':False,'live_trading_change':False}
          except Exception as exc:
              receipt={'schema':'industry_stagea_batch8.v1','family':family,'benchmark':benchmark,'development_universe':symbols,
                'frozen_external_holdouts':holdouts,'source_support':'INSUFFICIENT','source':source,'model_result_available':False,
                'source_error':f'{type(exc).__name__}: {exc}','external_holdouts_loaded':False,
                'decision':'UNSCORED_SOURCE_FAILURE_NO_SYMBOL_SUBSTITUTION','broad_market_alpha_claim_authorized':False,
                'research_only':True,'promotion_authority':False,'allocation_authority':False,'runtime_mutation':False,'live_trading_change':False}
          open(path,'w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('INDUSTRY_STAGEA_BATCH8='+json.dumps(receipt,sort_keys=True))
          PY
      - name: Persist receipt to branch
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "results/${FAMILY}-stagea-batch8-receipt.json"
          git commit -m "research: persist batch8 ${FAMILY} receipt"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
