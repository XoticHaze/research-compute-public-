name: A5 SEC Form4 Open Market Purchase R1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/sec_form4_open_market_purchase_r1.py'
      - '.github/workflows/a5-sec-form4-open-market-purchase-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - name: Execute frozen SEC Form 4 purchase discriminator
        run: python research/sec_form4_open_market_purchase_r1.py
      - name: Assert filing-time chronology and terminal receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/sec_form4_open_market_purchase_r1.json'))
          assert x['schema']=='research.sec_form4_open_market_purchase_r1.v1'
          assert x['source_lineage']['information_time']=='FILING_DATE'
          assert x['source_lineage']['transaction_date_used_for_entry'] is False
          assert x['boundaries']['2026_price_outcomes_protected'] is True
          assert x['sample']['last_exit_date'] <= '2025-12-31'
          assert x['result']['decision'] in {
              'SEC_FORM4_PURCHASE_R1_SUPPORTED',
              'SEC_FORM4_PURCHASE_R1_REJECTED',
              'SEC_FORM4_PURCHASE_R1_INCONCLUSIVE_SAMPLE',
          }
          print('A5_SEC_FORM4_TERMINAL='+x['result']['decision'])
          print('A5_SEC_FORM4_EVENTS='+str(x['result']['overall']['events']))
          print('A5_SEC_FORM4_MATCHED_EXCESS_BPS='+str(x['result']['overall']['mean_excess_vs_matched_etf_bps']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a5-sec-form4-open-market-purchase-r1-result
          path: artifacts/sec_form4_open_market_purchase_r1.json
          if-no-files-found: error
          retention-days: 90
