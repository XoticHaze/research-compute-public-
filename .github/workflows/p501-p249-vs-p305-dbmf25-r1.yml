name: P501 P249 vs P305 DBMF25 R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p501_p249_vs_p305_dbmf25_r1.py'
      - '.github/workflows/p501-p249-vs-p305-dbmf25-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas numpy yfinance
      - id: result
        run: |
          python research/p501_p249_vs_p305_dbmf25_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p501_p249_vs_p305_dbmf25_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p501-p249-vs-p305-dbmf25__${{ steps.result.outputs.tag }}
          path: research/artifacts/p501_p249_vs_p305_dbmf25_r1.json
          if-no-files-found: error
          retention-days: 90
