name: Reference Release Ticket CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reference_release_ticket_v1.py'
      - 'scripts/reference_release_grant_v1.py'
      - 'scripts/reference_lifecycle_timing_v1.py'
      - 'tests/test_reference_release_ticket_v1.py'
      - 'tests/test_reference_release_grant_v1.py'
      - 'tests/test_reference_lifecycle_timing_v1.py'
      - '.github/workflows/reference-release-ticket-ci.yml'
  pull_request:
    paths:
      - 'scripts/reference_release_ticket_v1.py'
      - 'tests/test_reference_release_ticket_v1.py'
      - '.github/workflows/reference-release-ticket-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ticket:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Test signed release-ticket and lifecycle timing contracts
        run: |
          python -m unittest -v \
            tests.test_reference_release_ticket_v1 \
            tests.test_reference_release_grant_v1 \
            tests.test_reference_lifecycle_timing_v1
