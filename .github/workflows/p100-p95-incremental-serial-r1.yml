name: P100 P95 Incremental Serial R1
on:
  pull_request:
    paths:
      - 'research/p100_p95_incremental_serial_r1.py'
      - '.github/workflows/p100-p95-incremental-serial-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p100_p95_incremental_serial_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p100-p95-incremental-serial-r1
          path: artifacts/p100_p95_incremental_serial_r1.json
          if-no-files-found: error
