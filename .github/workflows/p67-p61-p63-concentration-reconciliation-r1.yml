name: P67 P61 P63 Concentration Reconciliation R1
on:
  pull_request:
    paths:
      - 'research/p67_p61_p63_concentration_reconciliation_r1.py'
      - '.github/workflows/p67-p61-p63-concentration-reconciliation-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p67_p61_p63_concentration_reconciliation_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p67-p61-p63-concentration-reconciliation-r1
          path: artifacts/p67_p61_p63_concentration_reconciliation_r1.json
          if-no-files-found: error
