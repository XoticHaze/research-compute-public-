name: P13 Twofactor Name Jackknife R1
on:
  pull_request:
    paths: ['scripts/p13_twofactor_name_jackknife_r1.py','.github/workflows/p13-twofactor-name-jackknife-r1.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python scripts/p13_twofactor_name_jackknife_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_twofactor_name_jackknife_r1.json')); vals={'decision':x['decision'],'smh':f"{100*x['recent_min_excess_vs_smh']:.2f}",'ew':f"{100*x['recent_min_excess_vs_ew']:.2f}",'worst':x['recent_worst_name_vs_smh']}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-name-jackknife__${{ steps.evaluate.outputs.decision }}__min_smh_${{ steps.evaluate.outputs.smh }}pp__min_ew_${{ steps.evaluate.outputs.ew }}pp__worst_${{ steps.evaluate.outputs.worst }}
          path: artifacts/p13_twofactor_name_jackknife_r1.json
          if-no-files-found: error
