name: RC001 Oil Services CHX Sensitivity
on:
  pull_request:
    paths:
      - '.github/workflows/rc001-oil-services-chx-sensitivity.yml'
      - 'research/oil-services-chx-sensitivity-contract.json'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Materialize pinned evaluator
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          from pathlib import Path
          p=Path('.campaign/runner.py')
          text=p.read_text()
          old='if len(symbols) != 8 or len(set(symbols)) != 8:\n            raise RuntimeError(f"{family}: development universe must contain exactly eight unique symbols")'
          new='if len(symbols) not in (7, 8) or len(set(symbols)) != len(symbols):\n            raise RuntimeError(f"{family}: sensitivity universe must contain seven or eight unique symbols")'
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
      - name: Install fixed numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute development-only CHX survivorship sensitivity
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          s=importlib.util.spec_from_file_location('r','.campaign/runner.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/oil-services-chx-sensitivity-contract.json').read_text()); assert not c['external_holdouts_loaded']
          original=c['family']['oil_services']; assert original['development_universe']==['SLB','HAL','BKR','NOV','FTI','HP','LBRT','CHX']
          spec=json.loads(json.dumps(original)); spec['development_universe']=[x for x in spec['development_universe'] if x!='CHX']
          assert spec['development_universe']==['SLB','HAL','BKR','NOV','FTI','HP','LBRT']
          r=m._evaluate_matrix({'oil_services':spec},'2026-09-01T13:30:00+00:00')
          out={'schema':'research_compute_public.rc001_oil_services_chx_sensitivity.v1','status':'PASS','family_summary':r['family_summary'],'original_development_n':8,'sensitivity_development_n':7,'excluded_for_sensitivity':['CHX'],'evaluator_patch':'cardinality_guard_only_7_or_8','interpretation':'sensitivity_only_not_frozen_gate','external_holdouts_loaded':False,'research_only':True,'promotion_authority':False}
          Path('oil-services-chx-sensitivity-receipt.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print('OIL_SERVICES_CHX_SENSITIVITY='+json.dumps(out,sort_keys=True))
          PY
      - name: Upload sensitivity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oil-services-chx-sensitivity-receipt
          path: oil-services-chx-sensitivity-receipt.json
          if-no-files-found: error
          retention-days: 14
