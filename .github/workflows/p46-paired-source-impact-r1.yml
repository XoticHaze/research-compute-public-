name: P46 Paired Source Impact R1
on:
  pull_request:
    paths:
      - 'research/p46_paired_source_impact_r1.py'
      - '.github/workflows/p46-paired-source-impact-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p46_paired_source_impact_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_paired_source_impact_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"classification={x['classification']}\n"); f.write(f"selectiondiff={x['comparison']['selection_diff_months']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-paired-source-impact__${{ steps.run.outputs.classification }}__selectiondiff_${{ steps.run.outputs.selectiondiff }}
          path: artifacts/p46_paired_source_impact_r1.json
          if-no-files-found: error
