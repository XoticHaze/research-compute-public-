name: P04 R3 Prospective Causal Guard

on:
  push:
    branches:
      - assistant/p04-r3-prospective-causal-guard-20260913
    paths:
      - 'scripts/p04_r3_prospective_causal_guard_v1.py'
      - '.github/workflows/p04-r3-prospective-causal-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/p04_r3_prospective_causal_guard_v1.py'
      - '.github/workflows/p04-r3-prospective-causal-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Compile frozen prospective guard
        run: python -m py_compile scripts/p04_r3_prospective_causal_guard_v1.py
      - name: Prove prospective causal invariants
        run: python scripts/p04_r3_prospective_causal_guard_v1.py self-test
