name: P02 Capsule Source Integrity Contract

on:
  pull_request:
    paths:
      - 'scripts/p02_model_lab_xgboost_capsule_consumer_v1.py'
      - 'tests/test_p02_exact_capsule_member_inventory_r1.py'
      - '.github/workflows/p02-capsule-source-contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p02_model_lab_xgboost_capsule_consumer_v1.py'
      - 'tests/test_p02_exact_capsule_member_inventory_r1.py'
      - '.github/workflows/p02-capsule-source-contract-ci.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Execute exact public P02 capsule source contract (synthetic only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m py_compile scripts/p02_model_lab_xgboost_capsule_consumer_v1.py tests/test_p02_exact_capsule_member_inventory_r1.py
          python -B -m unittest -v tests.test_p02_exact_capsule_member_inventory_r1
