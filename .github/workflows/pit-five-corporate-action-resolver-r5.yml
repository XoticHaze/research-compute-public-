name: PIT Five Corporate Action Resolver R5
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/pit_five_corporate_action_resolver_r5.py'
      - '.github/workflows/pit-five-corporate-action-resolver-r5.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas requests lxml beautifulsoup4 html5lib
      - id: result
        run: |
          python research/pit_five_corporate_action_resolver_r5.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/pit_five_corporate_action_resolver_r5.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pit-five-corporate-action-resolver-r5__${{ steps.result.outputs.tag }}
          path: research/artifacts/pit_five_corporate_action_resolver_r5.json
          if-no-files-found: error
          retention-days: 90
