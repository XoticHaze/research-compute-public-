name: MM Survivor Forward Private Acceptance

on:
  pull_request:
    paths:
      - 'rendezvous/requests/mm-survivor-forward-*.txt'
      - 'scripts/mm_survivor_forward_private_consumer_v1.py'
      - '.github/workflows/mm-survivor-forward-private-acceptance.yml'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange

jobs:
  backend-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'mm-survivor-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          key_id='sha256:'+hashlib.sha256(public_raw).hexdigest()
          public={'schema':'mm-survivor-forward-ephemeral-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'recipient_b64':base64.b64encode(public_raw).decode('ascii'),'recipient_key_id':key_id}
          Path(os.environ['RUNNER_TEMP'],'mm-survivor-recipient.json').write_text(json.dumps(public,sort_keys=True)+'\n')
          print('MM_SURVIVOR_FORWARD_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('MM_SURVIVOR_FORWARD_RECIPIENT_KEY_ID='+key_id)
          PY
      - name: Publish recipient to isolated exchange
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/mm-survivor-recipient.json")"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          current_sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${api}?ref=${EXCHANGE_REF}" 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' || true)"
          body="$(python - "$payload" "$EXCHANGE_REF" "$current_sha" <<'PY'
          import json,sys
          body={'message':'rendezvous: publish one-run MM survivor recipient','content':sys.argv[1],'branch':sys.argv[2]}
          if sys.argv[3]:
              body['sha']=sys.argv[3]
          print(json.dumps(body))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${api}" -d "$body" >/dev/null
      - name: Wait for run-bound encrypted envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/mm-survivor-forward-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/mm-survivor-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound MM survivor envelope did not arrive'; exit 42; }
      - name: Execute fixed private backend acceptance and emit sanitized receipt
        run: python scripts/mm_survivor_forward_private_consumer_v1.py --envelope "$RUNNER_TEMP/mm-survivor-envelope.json" --private-key "$RUNNER_TEMP/mm-survivor-private.b64" --run-id "$GITHUB_RUN_ID"
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/mm-survivor-private.b64" "$RUNNER_TEMP/mm-survivor-recipient.json" "$RUNNER_TEMP/mm-survivor-envelope.json"
