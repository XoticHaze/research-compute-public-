name: IBKR Encrypted Account Return CI

on:
  push:
    branches:
      - assistant/ibkr-paper-encrypted-account-return-r1
  pull_request:
    paths:
      - scripts/ibkr_remote_paper_capsule_v1.py
      - scripts/ibkr_remote_paper_session_v1.py
      - tests/test_ibkr_remote_paper_capsule_v1.py
      - tests/test_ibkr_remote_paper_session_v1.py
      - .github/workflows/ibkr-remote-paper-runtime-rendezvous-r1.yml
      - .github/workflows/ibkr-encrypted-return-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check cryptography pytest
      - name: Compile
        run: |
          python -m py_compile scripts/ephemeral_x25519_chunked_v1.py scripts/ibkr_remote_paper_capsule_v1.py scripts/ibkr_remote_paper_session_v1.py
      - name: Focused tests
        run: pytest -q tests/test_ibkr_remote_paper_capsule_v1.py tests/test_ibkr_remote_paper_session_v1.py
