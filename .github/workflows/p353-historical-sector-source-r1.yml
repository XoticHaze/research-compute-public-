name: P353 Historical Sector Source R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p353_historical_sector_source_r1.py'
      - '.github/workflows/p353-historical-sector-source-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 lxml==5.3.0 html5lib==1.1 beautifulsoup4==4.12.3 requests==2.32.5
      - id: eval
        run: |
          python research/p353_historical_sector_source_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p353_historical_sector_source_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p353-historical-sector-source__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p353_historical_sector_source_r1.json
          if-no-files-found: error
