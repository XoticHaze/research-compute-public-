name: Trading Product P224 P225 Operator Acceptance
on:
  pull_request:
    paths:
      - 'research/trading_product_p224_p225_operator_acceptance.py'
      - '.github/workflows/trading-product-p224-p225-operator-acceptance.yml'
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python research/trading_product_p224_p225_operator_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: trading-product-p224-p225-operator-acceptance-${{ github.sha }}
          path: artifacts/trading_product_p224_p225_operator_acceptance.json
          if-no-files-found: error
