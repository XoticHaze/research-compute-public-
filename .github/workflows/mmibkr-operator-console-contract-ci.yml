name: MM-IBKR Operator Console Contract CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare/operator-console/**'
      - 'cloudflare/pi-owner-authority/**'
      - 'tests/test_mmibkr_operator_console_worker_v1.py'
      - 'tests/operator_console_runtime_union_freshness_contract.mjs'
      - 'tests/pi_owner_approval_contract.mjs'
      - 'tests/pi_owner_cloudflare_primary_authority_contract.mjs'
      - 'tests/pi_owner_device_grant_contract.mjs'
      - 'tests/pi_owner_root_release_transport_contract.mjs'
      - 'tests/pi_owner_access_gate_contract.mjs'
      - 'tests/test_mmibkr_operator_console_publisher_v1.py'
      - '.github/workflows/mmibkr-selected-runtime-cloud-r1.yml'
      - '.github/workflows/mmibkr-operator-console-contract-ci.yml'
  push:
    branches:
      - 'assistant/mmibkr-operator-console-*'
    paths:
      - 'cloudflare/operator-console/**'
      - 'tests/test_mmibkr_operator_console_worker_v1.py'
      - 'tests/operator_console_runtime_union_freshness_contract.mjs'
      - '.github/workflows/mmibkr-operator-console-contract-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Worker JavaScript syntax
        run: |
          set -euo pipefail
          node --check cloudflare/operator-console/src/index.js

      - name: Execute runtime-union, account-projection and privacy fail-closed contract
        run: |
          set -euo pipefail
          node tests/operator_console_runtime_union_freshness_contract.mjs
          # Public-only, source-safe bot-origin v1/v2 contract validation.
          node tests/pi_bot_live_observation_contract.mjs
          node --check cloudflare/operator-console/src/pi_owner_approval.js
          node --check cloudflare/operator-console/src/pi_owner_approval_ui.js
          node --check cloudflare/operator-console/src/pi_owner_device_grant.js
          node tests/pi_owner_device_grant_contract.mjs
          node tests/pi_owner_root_release_transport_contract.mjs
          node tests/pi_owner_approval_contract.mjs
          node --check cloudflare/pi-owner-authority/src/index.js
          node tests/pi_owner_cloudflare_primary_authority_contract.mjs
          node tests/pi_owner_access_gate_contract.mjs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Validate private operator-console contracts
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_mmibkr_operator_console_worker_v1 \
            tests.test_mmibkr_operator_console_publisher_v1

      - name: Dry-run isolated Cloudflare-owner signer bundle (no deploy)
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.2 deploy \
            --dry-run \
            --config cloudflare/pi-owner-authority/wrangler.jsonc \
            --outdir "$RUNNER_TEMP/ccpi-owner-authority-dry-run"

      - name: Record isolated signer artifact hashes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ccpi-owner-authority-dry-run"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Attach public-source isolated signer bundle for protected Cloudflare admin deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ccpi-owner-neutral-source-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/ccpi-owner-authority-dry-run/
          if-no-files-found: error
          retention-days: 7

      - name: Dry-run canonical Worker bundle
        run: |
          set -euo pipefail
          mkdir -p cloudflare/operator-console/dist
          printf '%s\n' '<!doctype html><title>MM-IBKR operator console placeholder</title>' > cloudflare/operator-console/dist/index.html
          npx --yes wrangler@4.131.2 deploy             --dry-run             --config cloudflare/operator-console/wrangler.jsonc             --outdir "$RUNNER_TEMP/mmibkr-operator-console-dry-run"
