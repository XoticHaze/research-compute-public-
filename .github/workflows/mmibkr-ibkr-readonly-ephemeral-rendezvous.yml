name: MM-IBKR IBKR Readonly Ephemeral Rendezvous

on:
  push:
    branches:
      - assistant/ibkr-readonly-b1-r1
    paths:
      - '.github/workflows/mmibkr-ibkr-readonly-ephemeral-rendezvous.yml'
      - 'scripts/mmibkr_ibkr_readonly_ephemeral_consumer_v1.py'
      - 'rendezvous/requests/mmibkr-ibkr-readonly-*.txt'

permissions:
  contents: write

env:
  RECIPIENT_ROOT: rendezvous/recipients/mmibkr-ibkr-readonly
  RESPONSE_ROOT: rendezvous/responses/mmibkr-ibkr-readonly
  EXCHANGE_REF: rendezvous-exchange

jobs:
  readonly-broker-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assistant/ibkr-readonly-b1-r1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography ib_insync==0.9.86
      - name: Generate one-run IBKR recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519

          private = x25519.X25519PrivateKey.generate()
          private_raw = private.private_bytes(
              serialization.Encoding.Raw,
              serialization.PrivateFormat.Raw,
              serialization.NoEncryption(),
          )
          public_raw = private.public_key().public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          key_id = 'sha256:' + hashlib.sha256(public_raw).hexdigest()
          run_id = os.environ['GITHUB_RUN_ID']
          recipient = {
              'schema': 'mmibkr-ibkr-readonly-recipient-v1',
              'run_id': run_id,
              'authority': 'ibkr_readonly_data_only',
              'harness': 'mmibkr_ibkr_readonly_b1_v1',
              'recipient_b64': base64.b64encode(public_raw).decode('ascii'),
              'recipient_key_id': key_id,
          }
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'mmibkr-ibkr-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'), encoding='ascii')
          (root / 'mmibkr-ibkr-recipient.json').write_text(json.dumps(recipient, sort_keys=True) + '\n', encoding='utf-8')
          print('MMIBKR_IBKR_RUN_ID=' + run_id)
          print('MMIBKR_IBKR_RECIPIENT_KEY_ID=' + key_id)
          PY
      - name: Publish one-run recipient to isolated exchange
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/mmibkr-ibkr-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json, sys
          print(json.dumps({
              'message': 'rendezvous: publish one-run MM-IBKR IBKR recipient',
              'content': sys.argv[1],
              'branch': sys.argv[2],
          }))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -d "$body" >/dev/null
      - name: Wait for run-bound encrypted IBKR envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 100); do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.raw+json' \
              "$api" -o "$RUNNER_TEMP/mmibkr-ibkr-envelope.json" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound encrypted IBKR envelope did not arrive'; exit 42; }
      - name: Execute fixed read-only broker/data proof
        run: |
          set -euo pipefail
          python scripts/mmibkr_ibkr_readonly_ephemeral_consumer_v1.py \
            --envelope "$RUNNER_TEMP/mmibkr-ibkr-envelope.json" \
            --private-key "$RUNNER_TEMP/mmibkr-ibkr-private.b64" \
            --run-id "$GITHUB_RUN_ID"
      - name: Remove one-run private material and gateway
        if: always()
        run: |
          docker rm -f mmibkr-ibkr-readonly-b1 >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/mmibkr-ibkr-private.b64" \
            "$RUNNER_TEMP/mmibkr-ibkr-recipient.json" \
            "$RUNNER_TEMP/mmibkr-ibkr-envelope.json"
