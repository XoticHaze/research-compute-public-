name: P46 Economic Repeatability R1
on:
  pull_request:
    paths: ['research/p46_economic_repeatability_r1.py','.github/workflows/p46-economic-repeatability-r1.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_economic_repeatability_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_economic_repeatability_r1.json')); a,b=x['recent_excess_cagr_range']; vals={'decision':x['decision'],'fps':x['unique_return_fingerprints'],'span':f"{100*(b-a):.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p46-economic-repeatability__${{ steps.evaluate.outputs.decision }}__fps_${{ steps.evaluate.outputs.fps }}__recent_span_${{ steps.evaluate.outputs.span }}pp
          path: artifacts/p46_economic_repeatability_r1.json
          if-no-files-found: error
