name: P274 Industry Downside Role R1
on:
  pull_request:
    branches: [assistant/market-research-p273-industry-capital-role-cost-stress-r1]
    paths:
      - 'research/p274_industry_downside_role_r1.py'
      - '.github/workflows/p274-industry-downside-role-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          cd research && python p274_industry_downside_role_r1.py && cd ..
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p274_industry_downside_role_r1.json'))
          a=x['tests']['2020']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__checks_{x['directional_checks_passed']}_{x['directional_checks_total']}__neg_{bp(a['negative_month_mean_return_delta'])}__w12_{bp(a['worst_12m_delta'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p274-industry-downside-role__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p274_industry_downside_role_r1.json
          if-no-files-found: error
