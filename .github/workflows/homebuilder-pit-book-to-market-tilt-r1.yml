name: Homebuilder PIT Book-to-Market Tilt R1
on:
  push:
    branches: ['market-research/homebuilder-pit-valuation-source-r1-20260913']
    paths:
      - 'research/homebuilder_pit_book_to_market_tilt_r1.py'
      - '.github/workflows/homebuilder-pit-book-to-market-tilt-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Frozen provenance
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "experiment_id=HOMEBUILDER-PIT-BOOK-TO-MARKET-TILT-R1"
          echo "source_admission_run=34748117687"
          echo "source_admission_job=103699671845"
          echo "source_admission_artifact=10314642624"
          echo "source_admission_decision=HOMEBUILDER_PIT_VALUATION_SOURCE_ADMITTED_R3"
      - run: python -m py_compile research/homebuilder_pit_valuation_source_probe_r2.py research/homebuilder_pit_valuation_source_probe_r3.py research/homebuilder_pit_book_to_market_tilt_r1.py
      - name: Execute frozen valuation child
        run: python research/homebuilder_pit_book_to_market_tilt_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homebuilder-pit-book-to-market-tilt-r1-result
          path: research/results/homebuilder_pit_book_to_market_tilt_r1.json
          if-no-files-found: error
          retention-days: 30
