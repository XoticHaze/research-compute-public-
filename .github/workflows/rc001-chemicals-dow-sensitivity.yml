name: RC001 Chemicals DOW Sensitivity
on:
  pull_request:
    paths:
      - '.github/workflows/rc001-chemicals-dow-sensitivity.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Materialize pinned evaluator
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
      - name: Install fixed numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute development-only DOW survivorship sensitivity
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          s=importlib.util.spec_from_file_location('r','.campaign/runner.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/batch2-contract.json').read_text()); assert not c['external_holdouts_loaded']
          original=c['families']['chemicals']; assert 'DOW' in original['development_universe']
          spec=json.loads(json.dumps(original)); spec['development_universe']=[x for x in spec['development_universe'] if x!='DOW']
          assert len(spec['development_universe'])==7
          try:
              r=m._evaluate_matrix({'chemicals':spec},'2026-09-01T13:30:00+00:00')
              out={'schema':'research_compute_public.rc001_chemicals_dow_sensitivity.v1','status':'PASS','family_summary':r['family_summary'],'original_development_n':8,'sensitivity_development_n':7,'excluded_for_sensitivity':['DOW'],'interpretation':'sensitivity_only_not_frozen_gate','external_holdouts_loaded':False,'research_only':True,'promotion_authority':False}
          except Exception as exc:
              out={'schema':'research_compute_public.rc001_chemicals_dow_sensitivity.v1','status':'FAIL','error':f'{type(exc).__name__}: {exc}','original_development_n':8,'sensitivity_development_n':7,'excluded_for_sensitivity':['DOW'],'interpretation':'sensitivity_only_not_frozen_gate','external_holdouts_loaded':False,'research_only':True,'promotion_authority':False}
          print('CHEMICALS_DOW_SENSITIVITY='+json.dumps(out,sort_keys=True))
          if out['status']!='PASS': raise SystemExit(1)
          PY