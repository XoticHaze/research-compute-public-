name: MM-IBKR Parity Export R1

on:
  push:
    branches: [main]
    paths:
      - rendezvous/fire/mmibkr-parity-export-r1.json

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Validate fire request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('rendezvous/fire/mmibkr-parity-export-r1.json')
          node=json.loads(p.read_text(encoding='utf-8'))
          if node.get('schema')!='mmibkr.parity_export_fire.v1':
              raise SystemExit('parity export schema rejected')
          sha=str(node.get('source_sha') or '').strip().lower()
          recip=str(node.get('recipient_public_b64') or '').strip()
          keyid=str(node.get('recipient_key_id') or '').strip()
          if len(sha)!=40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('source_sha invalid')
          import base64, hashlib
          raw=base64.b64decode(recip,validate=True)
          if len(raw)!=32:
              raise SystemExit('recipient key invalid')
          if keyid!='sha256:'+hashlib.sha256(raw).hexdigest():
              raise SystemExit('recipient key id mismatch')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('REQUEST_SOURCE_SHA='+sha+'\n')
              fh.write('RECIPIENT_PUBLIC_B64='+recip+'\n')
              fh.write('RECIPIENT_KEY_ID='+keyid+'\n')
          print('PARITY_EXPORT_SOURCE_SHA='+sha)
          print('PARITY_EXPORT_RECIPIENT_KEY_ID='+keyid)
          PY

      - name: Materialize exact private source from reusable Fleet vault
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$REQUEST_SOURCE_SHA" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mmibkr-source'/'materialization.json'
          n=json.loads(p.read_text(encoding='utf-8'))
          if n.get('ok') is not True or str(n.get('source_sha') or '').lower()!=os.environ['REQUEST_SOURCE_SHA']:
              raise SystemExit('source materialization mismatch')
          if n.get('private_repository_token_used') is not False or n.get('plaintext_emitted') is not False:
              raise SystemExit('source materialization safety boundary violated')
          print('PARITY_EXPORT_SOURCE_MATERIALIZED=1')
          print('PARITY_EXPORT_SOURCE_ARCHIVE_SHA256='+str(n.get('source_archive_sha256') or ''))
          print('PARITY_EXPORT_SOURCE_ARCHIVE_BYTES='+str(n.get('source_archive_bytes') or ''))
          PY

      - name: Encrypt exact source archive to one-run recipient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-export"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import serialization

          root=Path(os.environ['RUNNER_TEMP'])
          source=root/'mmibkr-source'/'mm-ibkr-source.tar.gz'
          raw=source.read_bytes()
          recipient_raw=base64.b64decode(os.environ['RECIPIENT_PUBLIC_B64'],validate=True)
          recipient=x25519.X25519PublicKey.from_public_bytes(recipient_raw)
          eph=x25519.X25519PrivateKey.generate()
          eph_pub=eph.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          shared=eph.exchange(recipient)
          salt=os.urandom(32)
          key=HKDF(
              algorithm=hashes.SHA256(), length=32, salt=salt,
              info=b'mmibkr-parity-export-r1',
          ).derive(shared)
          nonce=os.urandom(12)
          aad=json.dumps({
              'schema':'mmibkr.parity_export_envelope.v1',
              'source_sha':os.environ['REQUEST_SOURCE_SHA'],
              'recipient_key_id':os.environ['RECIPIENT_KEY_ID'],
          },sort_keys=True,separators=(',',':')).encode()
          ciphertext=ChaCha20Poly1305(key).encrypt(nonce,raw,aad)
          out=root/'parity-export'
          (out/'ciphertext.bin').write_bytes(ciphertext)
          env={
              'schema':'mmibkr.parity_export_envelope.v1',
              'source_sha':os.environ['REQUEST_SOURCE_SHA'],
              'recipient_key_id':os.environ['RECIPIENT_KEY_ID'],
              'ephemeral_public_b64':base64.b64encode(eph_pub).decode(),
              'salt_b64':base64.b64encode(salt).decode(),
              'nonce_b64':base64.b64encode(nonce).decode(),
              'aad_b64':base64.b64encode(aad).decode(),
              'ciphertext_sha256':hashlib.sha256(ciphertext).hexdigest(),
              'ciphertext_bytes':len(ciphertext),
              'plaintext_sha256':hashlib.sha256(raw).hexdigest(),
              'plaintext_bytes':len(raw),
              'private_source_plaintext_published':False,
          }
          (out/'envelope.json').write_text(json.dumps(env,sort_keys=True)+'\n',encoding='utf-8')
          print('PARITY_EXPORT_ENCRYPTED=1')
          print('PARITY_EXPORT_CIPHERTEXT_SHA256='+env['ciphertext_sha256'])
          PY

      - name: Upload encrypted parity export
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmibkr-parity-export-${{ github.run_id }}
          path: ${{ runner.temp }}/parity-export
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Emit sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "PARITY_EXPORT_STATUS=PASS"
          echo "PARITY_EXPORT_SOURCE_SHA=$REQUEST_SOURCE_SHA"
          echo "PARITY_EXPORT_RECIPIENT_KEY_ID=$RECIPIENT_KEY_ID"
          echo "PARITY_EXPORT_ARTIFACT_ID=${{ steps.artifact.outputs.artifact-id }}"
          echo "PARITY_EXPORT_ARTIFACT_DIGEST=${{ steps.artifact.outputs.artifact-digest }}"
          echo "PARITY_EXPORT_PRIVATE_PLAINTEXT_PUBLISHED=0"

      - name: Destroy private source
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/mmibkr-source" "$RUNNER_TEMP/parity-export"
          echo "PARITY_EXPORT_PRIVATE_SOURCE_DESTROYED=1"
