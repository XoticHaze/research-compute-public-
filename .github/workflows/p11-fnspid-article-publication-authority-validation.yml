name: P11 FNSPID Article Publication Authority Validation
on:
  pull_request:
    paths:
      - 'research/p11_fnspid_article_publication_authority_validation_20260907.py'
      - '.github/workflows/p11-fnspid-article-publication-authority-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install bounded metadata parser environment
        run: python -m pip install --disable-pip-version-check -q beautifulsoup4==4.13.5 python-dateutil==2.9.0.post0
      - name: Compile validation consumer
        run: python -m py_compile research/p11_fnspid_article_publication_authority_validation_20260907.py
      - name: Execute deterministic article-level publication validation
        run: python research/p11_fnspid_article_publication_authority_validation_20260907.py
      - name: Retain sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11-fnspid-article-publication-authority-validation
          path: p11_fnspid_article_publication_authority_validation_20260907.json
          retention-days: 30
          if-no-files-found: warn
