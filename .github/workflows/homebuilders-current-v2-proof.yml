name: Homebuilders Currentized V2 Encrypted Proof

on:
  push:
    branches:
      - 'assistant/homebuilders-currentized-forward-v2'
    paths:
      - 'scripts/forward_native_homebuilders_current_v2.py'
      - '.github/workflows/homebuilders-current-v2-proof.yml'

permissions:
  contents: write

env:
  EXCHANGE_REF: rendezvous-exchange
  HARNESS: homebuilders_adaptive_duration_current_v2
  RECIPIENT_ROOT: rendezvous/recipients
  RESPONSE_ROOT: rendezvous/responses

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 yfinance==0.2.65
      - name: Self-test v2 binding and common adapter
        run: |
          python scripts/forward_native_homebuilders_current_v2.py --self-test
          python research/forward_native_program_adapter_r1.py --self-test
      - name: Generate one-run compute recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          h=os.environ['HARNESS']
          Path(os.environ['RUNNER_TEMP'],f'{h}-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          record={'schema':'forward-native-ephemeral-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'harness':h,'recipient_b64':base64.b64encode(public_raw).decode('ascii'),'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest()}
          Path(os.environ['RUNNER_TEMP'],f'{h}-recipient.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          PY
      - name: Publish one-run recipient with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-${HARNESS}-forward-native.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/${HARNESS}-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish Homebuilders v2 proof recipient','content':content,'branch':branch}))
          PY
          )"
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o "$RUNNER_TEMP/put.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body" || true)"
            if [ "$status" = '200' ] || [ "$status" = '201' ]; then exit 0; fi
            [ "$status" = '409' ] || { cat "$RUNNER_TEMP/put.json" >&2; exit 22; }
            sleep $(( attempt * 2 ))
          done
          exit 23
      - name: Wait for encrypted source capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/${HARNESS}-input.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          for _ in $(seq 1 240); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -o "$RUNNER_TEMP/${HARNESS}-input.json"; then exit 0; fi
            sleep 5
          done
          exit 42
      - name: Execute currentized encrypted native source
        run: |
          python scripts/forward_native_homebuilders_current_v2.py \
            --envelope "$RUNNER_TEMP/${HARNESS}-input.json" \
            --private-key "$RUNNER_TEMP/${HARNESS}-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --harness "$HARNESS" \
            --adapter-script "$GITHUB_WORKSPACE/research/forward_native_program_adapter_r1.py" \
            --return-envelope "$RUNNER_TEMP/${HARNESS}-return.json"
      - name: Publish encrypted return with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/${HARNESS}-return.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/${HARNESS}-return.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish encrypted Homebuilders v2 proof return','content':content,'branch':branch}))
          PY
          )"
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o "$RUNNER_TEMP/put-return.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body" || true)"
            if [ "$status" = '200' ] || [ "$status" = '201' ]; then exit 0; fi
            [ "$status" = '409' ] || { cat "$RUNNER_TEMP/put-return.json" >&2; exit 22; }
            sleep $(( attempt * 2 ))
          done
          exit 23
      - uses: actions/upload-artifact@v4
        with:
          name: homebuilders-current-v2-encrypted-return-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ env.HARNESS }}-return.json
          retention-days: 7
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/${HARNESS}-private.b64" "$RUNNER_TEMP/${HARNESS}-recipient.json" "$RUNNER_TEMP/${HARNESS}-input.json" "$RUNNER_TEMP/${HARNESS}-return.json"
