name: Sector Relative Reversal Allocator
on:
  pull_request:
    paths:
      - 'research/sector_relative_reversal_allocator_20260906.py'
      - '.github/workflows/sector-relative-reversal-allocator-20260906.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install numerical environment
        run: pip install 'numpy==2.3.2' 'pandas==2.3.2'
      - name: Execute matched-baseline reversal discriminator
        run: python research/sector_relative_reversal_allocator_20260906.py
      - name: Retain deterministic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sector-relative-reversal-allocator-receipt
          path: sector-relative-reversal-allocator-receipt.json
          retention-days: 30
