name: SPMO Tech Attribution R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/spmo_tech_attribution_r1.py'
      - '.github/workflows/spmo-tech-attribution-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/spmo_tech_attribution_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/spmo_tech_attribution_r1.json')); z=x['results']['2017']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__alpha_{bp(z['annualized_residual_alpha'])}__t_{int(round(z['nw_tstat_alpha']*100))}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'tag={tag}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spmo-tech-attribution__${{ steps.eval.outputs.tag }}
          path: research/artifacts/spmo_tech_attribution_r1.json
          if-no-files-found: error
