name: RC001 Batch2 Development
on:
  pull_request:
    paths:
      - 'research/batch2-contract.json'
      - '.github/workflows/rc001-batch2.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.16'}
      - run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute Batch2 families independently and preserve exact blockers
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path

          s=importlib.util.spec_from_file_location('r','.campaign/runner.py')
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/batch2-contract.json').read_text())
          assert not c['external_holdouts_loaded']
          cutoff='2026-09-01T13:30:00+00:00'

          def probe(symbol):
              try:
                  m._bounded(symbol, m.pd.Timestamp(cutoff))
                  return None
              except Exception as exc:
                  return f'{type(exc).__name__}:{exc}'

          shared={symbol: probe(symbol) for symbol in list(m.TRAIN)+['QQQ']}
          shared_failures={k:v for k,v in shared.items() if v is not None}
          if shared_failures:
              raise SystemExit('shared training/context source unavailable: '+json.dumps(shared_failures,sort_keys=True))

          family_summary={}
          family_preflight={}
          executed=0
          source_blocked=0
          eval_blocked=0
          for family,spec in c['families'].items():
              symbols=list(spec['development_universe'])+[spec['primary_industry_etf']]
              failures={symbol:error for symbol in symbols if (error:=probe(symbol)) is not None}
              family_preflight[family]={
                  'source_available': not failures,
                  'failures': failures,
                  'development_symbols_checked': len(spec['development_universe']),
                  'benchmark_checked': spec['primary_industry_etf'],
              }
              if failures:
                  source_blocked += 1
                  family_summary[family]={
                      'development_family_gate_pass': False,
                      'support_status': 'INSUFFICIENT_SOURCE_SUPPORT',
                      'source_failures': failures,
                      'external_holdouts_loaded': False,
                  }
                  continue
              try:
                  result=m._evaluate_matrix({family:spec}, cutoff)
                  summary=result['family_summary'][family]
                  summary['support_status']='AVAILABLE_EXECUTED'
                  summary['external_holdouts_loaded']=False
                  family_summary[family]=summary
                  executed += 1
              except Exception as exc:
                  eval_blocked += 1
                  family_summary[family]={
                      'development_family_gate_pass': False,
                      'support_status': 'INSUFFICIENT_EVALUATION_SUPPORT',
                      'evaluation_failure': f'{type(exc).__name__}:{exc}',
                      'external_holdouts_loaded': False,
                  }

          out={
              'schema':'research_compute_public.rc001_batch2.v3',
              'family_summary':family_summary,
              'family_preflight':family_preflight,
              'executed_family_count':executed,
              'source_blocked_family_count':source_blocked,
              'evaluation_blocked_family_count':eval_blocked,
              'scope_note':'Each frozen family is evaluated independently. Source/evaluation blockers are terminal support classifications for that family; no substitutions or post-freeze panel edits are allowed. External holdouts remain unloaded.',
              'external_holdouts_loaded':False,
              'research_only':True,
              'promotion_authority':False,
          }
          print('BATCH2_TERMINAL='+json.dumps(out,sort_keys=True))
          PY
