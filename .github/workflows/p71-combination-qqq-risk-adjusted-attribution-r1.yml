name: P71 Combination QQQ Risk Adjusted Attribution R1

on:
  pull_request:
    paths:
      - 'research/p71_combination_qqq_risk_adjusted_attribution_r1.py'
      - '.github/workflows/p71-combination-qqq-risk-adjusted-attribution-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p71_combination_qqq_risk_adjusted_attribution_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p71-combination-qqq-risk-adjusted-attribution-r1
          path: artifacts/p71_combination_qqq_risk_adjusted_attribution_r1.json
          if-no-files-found: error
