name: MM-IBKR Exact Private Validation R1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mmibkr-exact-private-validation-r1.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmibkr-exact-private-validation-r1
  cancel-in-progress: false

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  PRIVATE_SOURCE_SHA: 468a4d5ca3d235c5ae89547f2d906103ebf9bcf8

jobs:
  exact-private-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Materialize exact admitted private source through Fleet
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import time
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from urllib.request import Request, urlopen

          audience = 'mmibkr-fleet-authority'
          base = os.environ['FLEET_AUTHORITY_BASE'].rstrip('/')
          source_sha = os.environ['PRIVATE_SOURCE_SHA'].strip().lower()
          run_id = os.environ['GITHUB_RUN_ID']
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          archive_path = runner_temp / 'mm-ui-private-source.tar.gz'
          extract_root = runner_temp / 'mm-ui-private-source'

          if len(source_sha) != 40 or any(ch not in '0123456789abcdef' for ch in source_sha):
              raise SystemExit('PRIVATE_SOURCE_SHA must be exact 40-hex')

          def oidc_token():
              raw_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              parsed = urlparse(raw_url)
              query = dict(parse_qsl(parsed.query, keep_blank_values=True))
              query['audience'] = audience
              url = urlunparse((
                  parsed.scheme,
                  parsed.netloc,
                  parsed.path,
                  parsed.params,
                  urlencode(query),
                  parsed.fragment,
              ))
              req = Request(
                  url,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                      'Accept': 'application/json',
                  },
              )
              with urlopen(req, timeout=20) as response:
                  node = json.load(response)
              token = str(node.get('value') or '')
              if token.count('.') != 2:
                  raise RuntimeError('OIDC token invalid')
              return token

          token = oidc_token()
          url = f'{base}/v1/source-vault/private-archive/{source_sha}'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/gzip',
              'User-Agent': 'mmibkr-exact-private-validation-r1',
              'X-MMIBKR-Caller-Run-Id': run_id,
          }

          last = None
          response_headers = None
          for attempt in range(1, 73):
              try:
                  req = Request(url, headers=headers)
                  with urlopen(req, timeout=60) as response:
                      response_headers = dict(response.headers.items())
                      with archive_path.open('wb') as out:
                          shutil.copyfileobj(response, out, length=1024 * 1024)
                  last = None
                  break
              except HTTPError as exc:
                  body = exc.read(2048).decode('utf-8', 'replace')
                  last = f'HTTP {exc.code}: {body[:300]}'
                  if exc.code not in {401, 403, 502, 503}:
                      raise
                  if attempt % 12 == 0:
                      print(f'FLEET_UI_BUILD_WAIT attempt={attempt} last={last}')
                  time.sleep(5)
          else:
              raise SystemExit('Fleet exact-source admission did not converge: ' + str(last))

          if response_headers is None or not archive_path.is_file():
              raise SystemExit('private archive response missing')

          normalized = {str(k).lower(): str(v) for k, v in response_headers.items()}
          if normalized.get('x-mmibkr-source-sha') != source_sha:
              raise SystemExit('Fleet source SHA response mismatch')
          if normalized.get('x-mmibkr-private-source-token-exposed') != 'false':
              raise SystemExit('private source token exposure contract violated')
          stream_id = normalized.get('x-mmibkr-source-stream-id', '')
          if not stream_id:
              raise SystemExit('Fleet source stream id missing')

          digest = hashlib.sha256()
          archive_bytes = 0
          with archive_path.open('rb') as fh:
              while True:
                  chunk = fh.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  archive_bytes += len(chunk)
          archive_sha = digest.hexdigest()
          if archive_bytes <= 0:
              raise SystemExit('private archive empty')

          token = oidc_token()
          attestation = {
              'schema': 'mmibkr-fleet-private-source-attest-v1',
              'source_sha': source_sha,
              'stream_id': stream_id,
              'archive_sha256': archive_sha,
              'archive_bytes': archive_bytes,
          }
          req = Request(
              base + '/v1/source-vault/private-archive/attest',
              data=json.dumps(attestation, sort_keys=True, separators=(',', ':')).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'mmibkr-exact-private-validation-r1',
                  'X-MMIBKR-Caller-Run-Id': run_id,
              },
          )
          with urlopen(req, timeout=30) as response:
              attest_node = json.load(response)
          if (
              attest_node.get('ok') is not True
              or attest_node.get('source_sha') != source_sha
              or attest_node.get('archive_sha256') != archive_sha
              or int(attest_node.get('archive_bytes') or 0) != archive_bytes
              or attest_node.get('private_source_token_exposed') is not False
          ):
              raise SystemExit('Fleet private-source attestation contract failed')

          extract_root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('private archive has no members')
              top = {Path(member.name).parts[0] for member in members if Path(member.name).parts}
              if len(top) != 1:
                  raise SystemExit('private archive must contain one root')
              root_name = next(iter(top))
              root = (extract_root / root_name).resolve()
              files = 0
              total = 0
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts:
                      raise SystemExit('unsafe private archive path')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit('private archive special member rejected')
                  target = (extract_root / path).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit('private archive path escape')
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  if not member.isfile():
                      raise SystemExit('private archive non-file member rejected')
                  files += 1
                  total += int(member.size or 0)
                  if files > 30000 or total > 500 * 1024 * 1024:
                      raise SystemExit('private archive expansion rejected')
                  handle = tf.extractfile(member)
                  if handle is None:
                      raise SystemExit('private archive member unreadable')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open('wb') as out:
                      shutil.copyfileobj(handle, out, length=1024 * 1024)

          ui = root / 'ui-react'
          if not (ui / 'package.json').is_file() or not (ui / 'package-lock.json').is_file():
              raise SystemExit('exact private ui-react tree incomplete')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_SOURCE_ROOT=' + str(root) + '\n')
              fh.write('PRIVATE_UI_ROOT=' + str(ui) + '\n')
              fh.write('PRIVATE_ARCHIVE_SHA256=' + archive_sha + '\n')
              fh.write('PRIVATE_ARCHIVE_BYTES=' + str(archive_bytes) + '\n')

          print('MMIBKR_EXACT_PRIVATE_SOURCE_SHA=' + source_sha)
          print('MMIBKR_EXACT_PRIVATE_ARCHIVE_SHA256=' + archive_sha)
          print('MMIBKR_EXACT_PRIVATE_ARCHIVE_BYTES=' + str(archive_bytes))
          print('MMIBKR_EXACT_PRIVATE_SOURCE_TOKEN_EXPOSED=0')
          PY

      - name: Validate exact private runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mmibkr-exact-private-validation.log"
          set +e
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PRIVATE_SOURCE_ROOT:/workspace:ro" \
            -w /workspace \
            python:3.11.16-slim-bookworm \
            sh -lc '
              set -eu
              python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt >/dev/null
              python -m py_compile \
                market_data_incremental_window.py \
                market_data_request_contract.py \
                data_manager.py \
                futures_manager.py \
                bot_selected_runtime_candidate_materialization_14th27b.py \
                bot_selected_runtime_quote_freshness_idempotency_14th27c.py \
                snapshot_ib_adapter_v1.py \
                strategy.py \
                selected_runtime_boundary_snapshot_hydrator_v1.py \
                scripts/operator/ibkr_remote_warm_read_v1.py \
                scripts/operator/ibkr_remote_selected_runtime_paper_proof_ingress_v1.py \
                scripts/operator/ibkr_remote_selected_runtime_paper_execute_slot_v1.py \
                scripts/operator/ibkr_remote_selected_runtime_boundary_slot_v1.py \
                scripts/operator/runtime_market_data_cache_cursor_v1.py \
                scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
                scripts/operator/selected_runtime_signal_history_contract_v1.py \
                scripts/operator/selected_runtime_initial_backfill_ingest_v1.py \
                scripts/operator/selected_runtime_cloud_bar_clock_v1.py \
                scripts/operator/selected_runtime_cloud_runner_dry_plan_v1.py \
                scripts/operator/selected_runtime_cloud_natural_evaluator_v1.py \
                scripts/operator/selected_runtime_cloud_cycle_v1.py \
                scripts/operator/selected_runtime_cloud_daemon_v1.py \
                scripts/operator/mmibkr_cloud_source_producer_v1.py \
                scripts/operator/mmibkr_cloud_source_relay_v1.py \
                scripts/operator/selected_runtime_futures_roll_maintenance_v1.py \
                scripts/operator/selected_runtime_legacy_compat_config_v1.py
              python -m unittest \
                tests.test_market_data_incremental_window_v1 \
                tests.test_market_data_request_contract_v1 \
                tests.test_market_data_cache_delta_runtime_v1 \
                tests.test_runtime_market_data_cache_cursor_v1 \
                tests.test_runtime_market_data_cache_checkpoint_v1 \
                tests.test_selected_runtime_signal_history_contract_v1 \
                tests.test_selected_runtime_execution_roll_v1 \
                tests.test_selected_runtime_initial_backfill_ingest_v1 \
                tests.test_selected_runtime_execution_expiry_guard_v1 \
                tests.test_selected_runtime_boundary_snapshot_hydrator_v1 \
                tests.test_selected_runtime_cloud_bar_clock_v1 \
                tests.test_selected_runtime_cloud_natural_evaluator_v1 \
                tests.test_strategy_registry_position_state_forwarding_v1 \
                tests.test_selected_runtime_cloud_runner_dry_plan_v1 \
                tests.test_cloud_boundary_idempotency_v1 \
                tests.test_snapshot_ib_adapter_position_state_v1 \
                tests.test_selected_mnq_dca_spec_authority_v1 \
                tests.test_ibkr_remote_warm_read_v1 \
                tests.test_ibkr_remote_selected_runtime_paper_proof_ingress_v1 \
                tests.test_ibkr_remote_selected_runtime_paper_execute_slot_v1 \
                tests.test_ibkr_remote_selected_runtime_boundary_slot_v1 \
                tests.test_selected_runtime_legacy_compat_config_v1 \
                tests.test_selected_runtime_cloud_cycle_v1 \
                tests.test_selected_runtime_cloud_daemon_v1 \
                tests.test_mmibkr_cloud_source_producer_v1 \
                tests.test_mmibkr_cloud_source_relay_v1 \
                tests.test_selected_runtime_futures_roll_maintenance_v1 \
                -v
            ' >"$log" 2>&1
          rc=$?
          set -e
          log_sha="$(sha256sum "$log" | awk '{print $1}')"
          log_bytes="$(wc -c < "$log")"
          rm -f "$log"
          if [ "$rc" -ne 0 ]; then
            echo "MMIBKR_EXACT_PRIVATE_VALIDATION_STATUS=FAIL"
            echo "MMIBKR_EXACT_PRIVATE_VALIDATION_LOG_SHA256=$log_sha"
            echo "MMIBKR_EXACT_PRIVATE_VALIDATION_LOG_BYTES=$log_bytes"
            exit "$rc"
          fi
          echo "MMIBKR_EXACT_PRIVATE_VALIDATION_STATUS=PASS"
          echo "MMIBKR_EXACT_PRIVATE_VALIDATION_SOURCE_SHA=$PRIVATE_SOURCE_SHA"
          echo "MMIBKR_EXACT_PRIVATE_VALIDATION_LOG_SHA256=$log_sha"
          echo "MMIBKR_EXACT_PRIVATE_VALIDATION_LOG_BYTES=$log_bytes"
          echo "MMIBKR_PRIVATE_PLAINTEXT_EMITTED=0"
          echo "MMIBKR_LIVE_EXECUTION_ALLOWED=0"

      - name: Emit sanitized exact-private receipt
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          print("MMIBKR_EXACT_PRIVATE_VALIDATION_RECEIPT=" + json.dumps({
              "schema": "mmibkr.exact_private_validation_receipt.v1",
              "status": "PASS",
              "source_sha": os.environ["PRIVATE_SOURCE_SHA"],
              "suite": "hostless_runtime_normal_fetch_v1",
              "private_source_token_exposed": False,
              "private_plaintext_emitted": False,
              "broker_credentials_used": False,
              "runtime_authority_changed": False,
              "live_execution_allowed": False,
          }, sort_keys=True))
          PY

      - name: Destroy one-run private source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
                    rm -rf \
            "$RUNNER_TEMP/mm-ui-private-source" \
            "$RUNNER_TEMP/mm-ui-private-source.tar.gz"
          test ! -e "$RUNNER_TEMP/mm-ui-private-source"
          test ! -e "$RUNNER_TEMP/mm-ui-private-source.tar.gz"
          echo 'MMIBKR_EXACT_PRIVATE_SOURCE_DESTROYED=1'
