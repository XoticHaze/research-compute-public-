name: P354 Country Momentum Transport R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p354_country_momentum_transport_r1.py'
      - '.github/workflows/p354-country-momentum-transport-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p354_country_momentum_transport_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p354_country_momentum_transport_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p354-country-momentum-transport__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p354_country_momentum_transport_r1.json
          if-no-files-found: error
