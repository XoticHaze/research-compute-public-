name: P555 Price Coverage R0

on:
  pull_request:
    paths:
      - 'research/p555_price_coverage_r0.py'
      - '.github/workflows/p555-price-coverage-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 yfinance==0.2.65
      - run: python research/p555_price_coverage_r0.py
      - uses: actions/upload-artifact@v4
        with:
          name: p555-price-coverage-r0
          path: artifacts/p555_price_coverage_r0.json
          if-no-files-found: error
