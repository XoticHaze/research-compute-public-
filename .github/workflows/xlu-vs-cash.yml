name: XLU matched cash discriminator
on:
  push:
    branches: [research/xlu-vs-cash-20260905]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - run: python research/run_xlu_vs_cash.py
