name: P46 P36 Beta Residual Rolling R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_beta_residual_rolling_r1.py'
      - '.github/workflows/p46-p36-beta-residual-rolling-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_beta_residual_rolling_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_beta_residual_rolling_r1.json')); a=x['tests']['36']; b=x['tests']['60']; vals={'decision':x['decision'],'p36':f"{a['positive_fraction']:.3f}",'p60':f"{b['positive_fraction']:.3f}",'m60':f"{100*b['median_annualized_intercept']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta-residual-roll__${{ steps.evaluate.outputs.decision }}__p36_${{ steps.evaluate.outputs.p36 }}__p60_${{ steps.evaluate.outputs.p60 }}__median60_${{ steps.evaluate.outputs.m60 }}pct
          path: artifacts/p46_p36_beta_residual_rolling_r1.json
          if-no-files-found: error
