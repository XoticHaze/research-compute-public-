name: P46 Five Issuer NAV Overlap R2
on:
  pull_request:
    paths:
      - 'research/p46_five_issuer_nav_overlap_r2.py'
      - '.github/workflows/p46-five-issuer-nav-overlap-r2.yml'
permissions: {contents: read}
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 openpyxl==3.1.5 lxml==5.3.0
      - run: python research/p46_five_issuer_nav_overlap_r2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p46-five-issuer-nav-overlap-r2
          path: artifacts/
          if-no-files-found: error
