name: REIT Yahoo Request Form Diagnostic

on:
  pull_request:
    paths:
      - 'research/reit_yahoo_request_form_diagnostic_20260905.py'
      - '.github/workflows/reit-yahoo-request-form-diagnostic.yml'

permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Execute source-only request-form discriminator
        run: python research/reit_yahoo_request_form_diagnostic_20260905.py
      - name: Retain source diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reit-yahoo-request-form-diagnostic
          path: reit_yahoo_request_form_diagnostic_20260905.json
          if-no-files-found: error
          retention-days: 14
