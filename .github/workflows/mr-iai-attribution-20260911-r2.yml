name: MR IAI Attribution 20260911 R2

on:
  pull_request:
    paths:
      - 'research/mr_iai_attribution_20260911_r2.py'
      - '.github/workflows/mr-iai-attribution-20260911-r2.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: evaluate
        run: |
          python research/mr_iai_attribution_20260911_r2.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/mr_iai_attribution_20260911_r2.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-iai-attribution__${{ steps.evaluate.outputs.decision }}
          path: research/artifacts/mr_iai_attribution_20260911_r2.json
          if-no-files-found: error
