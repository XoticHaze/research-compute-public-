name: Portfolio Rebalance Preview Fail Closed Acceptance R1
on:
  pull_request:
    paths:
      - '.github/workflows/portfolio-rebalance-preview-fail-closed-acceptance-r1.yml'
      - 'research/portfolio_rebalance_preview_fail_closed_acceptance_r1.py'
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify fail-closed rebalance preview boundary
        run: python research/portfolio_rebalance_preview_fail_closed_acceptance_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-rebalance-preview-fail-closed-acceptance-r1-result
          path: portfolio-rebalance-preview-fail-closed-acceptance-r1-result.json
          retention-days: 14
