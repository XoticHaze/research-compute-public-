name: SPY VIX Stress R1
on:
  pull_request:
    paths:
      - 'research/spy_vix_stress_r1.py'
      - '.github/workflows/spy-vix-stress-r1.yml'
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q yfinance pandas numpy
      - run: set -o pipefail; python research/spy_vix_stress_r1.py | tee spy_vix_stress_r1_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spy-vix-stress-r1-result
          path: spy_vix_stress_r1_result.txt
