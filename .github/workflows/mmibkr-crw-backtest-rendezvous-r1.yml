name: MMIBKR CRW Backtest Rendezvous R1

on:
  push:
    branches: [main]
    paths:
      - 'rendezvous/fire/mmibkr-crw-backtest-r1.json'
  pull_request:
    paths:
      - '.github/workflows/mmibkr-crw-backtest-rendezvous-r1.yml'
      - 'scripts/mmibkr_canonical_workload_dispatch_chronology_v1.py'
      - 'scripts/mmibkr_canonical_workload_dispatch_v1.py'

permissions:
  contents: read

jobs:
  validate-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Validate chronology-enabled canonical dispatcher binding
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/mmibkr_canonical_workload_dispatch_v1.py
          python -m py_compile scripts/crw_chronology_fold_receipt_v1.py
          python -m py_compile scripts/mmibkr_canonical_workload_dispatch_chronology_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          fire = Path('rendezvous/fire/mmibkr-crw-backtest-r1.json')
          if not fire.is_file():
              print('MMIBKR_CRW_BACKTEST_FIRE=NOT_REQUESTED')
          else:
              node=json.loads(fire.read_text())
              if node.get('schema') != 'mmibkr.crw_backtest_fire.v1':
                  raise SystemExit('CRW backtest fire schema rejected')
              if node.get('workload_type') != 'CRW_BACKTEST':
                  raise SystemExit('CRW backtest workload rejected')
              print('MMIBKR_CRW_BACKTEST_BINDING=PASS')
          PY
