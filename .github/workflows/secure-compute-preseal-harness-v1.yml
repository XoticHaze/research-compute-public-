name: Secure Compute Preseal Harness V1

on:
  workflow_call:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: c3f6e77b636d928062316dd6d1f63b9ac01a18fc
          path: reference-harness-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Execute preseal reference worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python reference-harness-source/scripts/reference_worker_v1.py
