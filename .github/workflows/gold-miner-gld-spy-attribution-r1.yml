name: Gold Miner GLD SPY Attribution R1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/gold_miner_gld_spy_attribution_r1.py'
      - '.github/workflows/gold-miner-gld-spy-attribution-r1.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - name: Execute frozen attribution
        run: |
          set -euo pipefail
          python research/gold_miner_gld_spy_attribution_r1.py | tee /tmp/gold-miner-attribution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-miner-gld-spy-attribution-r1
          path: research/artifacts/gold_miner_gld_spy_attribution_r1.json
          if-no-files-found: warn
          retention-days: 90
