name: P140 One Month Cross Sectional Reversal R1
on:
  pull_request:
    paths:
      - 'research/p140_one_month_cross_sectional_reversal_r1.py'
      - '.github/workflows/p140-one-month-cross-sectional-reversal-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65 scikit-learn==1.5.2
      - run: python research/p140_one_month_cross_sectional_reversal_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p140-one-month-cross-sectional-reversal-r1
          path: artifacts/p140_one_month_cross_sectional_reversal_r1.json
          if-no-files-found: error
