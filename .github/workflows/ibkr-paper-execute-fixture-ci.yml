name: IBKR Paper Execute Fixture CI

on:
  push:
    branches:
      - assistant/ibkr-b1-paper-execute-fixture-repair-20260918
    paths:
      - tests/test_ibkr_remote_selected_runtime_paper_execute_v1.py
      - .github/workflows/ibkr-paper-execute-fixture-ci.yml
  pull_request:
    paths:
      - tests/test_ibkr_remote_selected_runtime_paper_execute_v1.py
      - .github/workflows/ibkr-paper-execute-fixture-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run persistent paper execute contract
        run: python -m unittest tests.test_ibkr_remote_selected_runtime_paper_execute_v1 -v
