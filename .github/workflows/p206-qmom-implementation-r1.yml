name: P206 QMOM Implementation R1
on:
  pull_request:
    paths:
      - 'research/p206_qmom_implementation_transport_r1.py'
      - '.github/workflows/p206-qmom-implementation-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p206_qmom_implementation_transport_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p206_qmom_implementation_transport_r1.json')); p=x['tests']['2016']; q=x['tests']['2019']; t=x['tests']['2020']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__m16_{bp(p['qmom_minus_mtum'])}__g16_{bp(p['qmom_minus_iwf'])}__m19_{bp(q['qmom_minus_mtum'])}__g19_{bp(q['qmom_minus_iwf'])}__m20_{bp(t['qmom_minus_mtum'])}__g20_{bp(t['qmom_minus_iwf'])}__fm_{p['positive_mtum_folds']}__fg_{p['positive_iwf_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p206-qmom-implementation__${{ steps.eval.outputs.tag }}
          path: artifacts/p206_qmom_implementation_transport_r1.json
          if-no-files-found: error