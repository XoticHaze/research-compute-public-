name: P569 TSA Legacy Endpoint Probe R0

on:
  pull_request:
    paths:
      - 'research/p569_tsa_legacy_endpoint_probe_r0.py'
      - '.github/workflows/p569-tsa-legacy-endpoint-probe-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 pandas==2.2.3
      - run: python research/p569_tsa_legacy_endpoint_probe_r0.py
      - uses: actions/upload-artifact@v4
        with:
          name: p569-tsa-legacy-endpoint-probe-r0
          path: artifacts/p569_tsa_legacy_endpoint_probe_r0.json
          if-no-files-found: error
