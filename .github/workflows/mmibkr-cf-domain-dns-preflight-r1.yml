name: MM-IBKR Cloudflare Domain DNS Preflight R1

# Strictly read-only: not a registrar, Cloudflare zone, credential, Gateway,
# tunneling or broker mutation workflow. Host is a repository variable, not
# a public-repository string containing a future counseling website domain.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/mmibkr_cf_dns_readonly_preflight_v1.py
      - tests/test_mmibkr_cf_dns_readonly_preflight_v1.py
      - .github/workflows/mmibkr-cf-domain-dns-preflight-r1.yml
      - docs/mmibkr-cloudflare-ssh-network-handoff-20261021.md
  push:
    branches: [main]
    paths:
      - scripts/mmibkr_cf_dns_readonly_preflight_v1.py
      - tests/test_mmibkr_cf_dns_readonly_preflight_v1.py
      - .github/workflows/mmibkr-cf-domain-dns-preflight-r1.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Validate DNS read-only safeguards
        run: |
          python -m unittest discover -s tests -p 'test_mmibkr_cf_dns_readonly_preflight_v1.py' -v
          python -m py_compile scripts/mmibkr_cf_dns_readonly_preflight_v1.py
          echo 'DNS_MUTATIONS_ATTEMPTED=0'
          echo 'IBKR_AUTH_ATTEMPTED=0'

  audit:
    if: github.event_name != 'pull_request'
    needs: [contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      TARGET: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Public recursive DNS inventory before changing registrar nameservers
        run: |
          set -euo pipefail
          if [ -z "$TARGET" ]; then
            echo MMIBKR_CF_DOMAIN_HOST_VARIABLE_NOT_CONFIGURED=1
            echo DNS_MUTATIONS_ATTEMPTED=0
            exit 0
          fi
          python scripts/mmibkr_cf_dns_readonly_preflight_v1.py \
            --host "$TARGET" --output "$RUNNER_TEMP/mmibkr-dns-readonly.json"
          echo MMIBKR_CF_DOMAIN_PUBLIC_DNS_PREFLIGHT_EXECUTED=1
      - if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-cloudflare-domain-dns-readonly
          path: ${{ runner.temp }}/mmibkr-dns-readonly.json
          if-no-files-found: ignore
          retention-days: 5
