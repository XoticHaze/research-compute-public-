name: Futures Crossasset Portfolio Momentum R5
on:
  pull_request:
    paths:
      - 'research/futures_crossasset_portfolio_momentum_r5.py'
      - '.github/workflows/futures-crossasset-portfolio-momentum-r5.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/futures_crossasset_portfolio_momentum_r5.py
      - uses: actions/upload-artifact@v4
        with:
          name: futures-crossasset-portfolio-momentum-r5
          path: futures_crossasset_portfolio_momentum_r5.json
          if-no-files-found: error
