name: P251 Small Value Specificity R1
on:
  pull_request:
    branches: [assistant/market-research-p249-smallvalue-capital-role-r1]
    paths:
      - 'research/p251_smallvalue_specificity_r1.py'
      - '.github/workflows/p251-smallvalue-specificity-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p251_smallvalue_specificity_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('artifacts/p251_smallvalue_specificity_r1.json'))
          a=x['tests']['2020']
          bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__excess_{bp(a['specificity_excess_cagr'])}__sharpe_{a['specificity_sharpe_delta']:.2f}__dd_{bp(a['specificity_maxdd_delta'])}__folds_{a['positive_specificity_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p251-smallvalue-specificity__${{ steps.eval.outputs.tag }}
          path: artifacts/p251_smallvalue_specificity_r1.json
          if-no-files-found: error
