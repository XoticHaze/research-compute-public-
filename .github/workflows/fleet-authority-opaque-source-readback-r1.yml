name: Fleet Authority Opaque Source Readback R1

on:
  push:
    branches: [main]
    paths:
      - 'rendezvous/fire/fleet-authority-opaque-source-readback-r1.json'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN_R2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read installed Fleet Worker source with existing scoped credential
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          import sys

          token = os.environ.get('CLOUDFLARE_API_TOKEN') or ''
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID') or ''
          if not token or not account:
              print('FLEET_OPAQUE_SOURCE_READBACK=CONFIG_MISSING')
              raise SystemExit(71)
          if len(token) > 512 or not (len(account) == 32 and all(c in '0123456789abcdef' for c in account)):
              print('FLEET_OPAQUE_SOURCE_READBACK=CONFIG_INVALID')
              raise SystemExit(72)
          url = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/fleet-authority'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + token,
              'Accept': '*/*',
              'User-Agent': 'mmibkr-fleet-opaque-readback-r1',
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  script = response.read(8*1024*1024)
          except urllib.error.HTTPError as exc:
              print('FLEET_OPAQUE_SOURCE_READBACK=HTTP_' +
                    str(exc.code if exc.code in {401,403,404,429,500,503} else 'OTHER'))
              raise SystemExit(73)
          except Exception:
              print('FLEET_OPAQUE_SOURCE_READBACK=TRANSPORT_ERROR')
              raise SystemExit(74)
          if b'mmibkr.pi_ghcr_opaque_candidate.v1' not in script:
              print('FLEET_OPAQUE_SOURCE_READBACK=DEPLOYED_MARKER_MISSING')
              raise SystemExit(75)
          print('FLEET_OPAQUE_SOURCE_READBACK=CURRENT_OPAQUE_MARKER_PASS')
          print('FLEET_CLOUDFLARE_MUTATION=NONE')
          PY

  receipt:
    if: always()
    needs: [readback]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish only fixed status with no Cloudflare account or script content
        env:
          SCOPED_READBACK_STATUS: ${{ needs.readback.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          status=os.environ.get('SCOPED_READBACK_STATUS')
          if status not in {'success','failure','cancelled','skipped'}:
              raise SystemExit('readback result invalid')
          obj={
              'schema':'fleet_authority.opaque_source_readback_receipt.v1',
              'run_id':str(os.environ['GITHUB_RUN_ID']),
              'readback_result':'current_marker_pass' if status=='success' else 'not_proven',
              'mutation_performed':False,
              'token_values_included':False,
              'private_source_metadata_included':False,
          }
          path=Path('rendezvous/receipts/fleet-authority-opaque-source-readback-r1.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(obj,indent=2,sort_keys=True))
          PY
          git -c user.name='Fleet Readback' -c user.email='fleet-readback@users.noreply.github.com' add -- rendezvous/receipts/fleet-authority-opaque-source-readback-r1.json
          git -c user.name='Fleet Readback' -c user.email='fleet-readback@users.noreply.github.com' commit -m 'fleet: sanitized opaque source deployment readback [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main
