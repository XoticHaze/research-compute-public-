name: Apply IBKR Warm Paper Proof Guard

on:
  push:
    branches:
      - assistant/ibkr-warm-paper-proof-activation-20260917
    paths:
      - 'scripts/patch_ibkr_warm_paper_proof_activation_v1.py'
      - '.github/workflows/ibkr-warm-paper-proof-patch-apply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assistant/ibkr-warm-paper-proof-activation-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Apply and validate warm-only mutation guard
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'cryptography==46.0.1'
          python scripts/patch_ibkr_warm_paper_proof_activation_v1.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow=Path('.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml').read_text()
          node=yaml.safe_load(workflow)
          assert isinstance(node,dict) and 'jobs' in node
          assert "default: readonly" in workflow
          assert "IBKR_PAPER_PROOF_MODE:" in workflow
          assert "name: Require restored warm state for paper submit proof" in workflow
          assert "if: env.IBKR_PAPER_PROOF_MODE == '1'" in workflow
          assert 'steps.restore.outputs.restored' in workflow
          assert 'IBKR_PAPER_PROOF_WARM_STATE_REQUIRED=1' in workflow
          assert '-e READ_ONLY_API="$api_read_only"' in workflow
          print('IBKR_WARM_ONLY_MUTATION_GUARD_STATIC_VALID=1')
          PY
          python -m unittest tests.test_ibkr_b1_warm_state_workflow_v2 tests.test_ibkr_warm_selected_runtime_activation_v1 -v
          git diff --check
      - name: Commit guard and regression test
        run: |
          set -euo pipefail
          git config user.name 'XoticHaze'
          git config user.email '152584286+XoticHaze@users.noreply.github.com'
          git add .github/workflows/ibkr-cloudflare-readonly-b1-r1.yml tests/test_ibkr_b1_warm_state_workflow_v2.py
          git diff --cached --quiet && { echo 'warm-only guard already present'; exit 0; }
          git commit -m 'IBKR: require restored warm state for paper proof'
          git push origin HEAD:assistant/ibkr-warm-paper-proof-activation-20260917
