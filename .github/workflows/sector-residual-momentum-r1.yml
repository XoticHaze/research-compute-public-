name: Sector Residual Momentum R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/sector_residual_momentum_r1.py'
      - '.github/workflows/sector-residual-momentum-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/sector_residual_momentum_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('artifacts/sector_residual_momentum_r1.json'))
          assert x['workload_id']=='SECTOR_RESIDUAL_MOMENTUM_R1'
          w=x['windows']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__m_{x['period']['months']}__ex_{bp(w['2005-01-01']['matched_excess_cagr'])}_{bp(w['2020-01-01']['matched_excess_cagr'])}_{bp(w['2022-01-01']['matched_excess_cagr'])}__folds_{x['positive_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sector-residual-momentum__${{ steps.eval.outputs.tag }}
          path: artifacts/sector_residual_momentum_r1.json
          if-no-files-found: error
