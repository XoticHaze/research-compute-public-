name: P567 Baker Rig Overlap Audit R0

on:
  pull_request:
    paths:
      - 'research/p567_baker_rig_overlap_audit_r0.py'
      - '.github/workflows/p567-baker-rig-overlap-audit-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 openpyxl==3.1.5 pandas==2.2.3
      - run: python research/p567_baker_rig_overlap_audit_r0.py
      - uses: actions/upload-artifact@v4
        with:
          name: p567-baker-rig-overlap-audit-r0
          path: artifacts/p567_baker_rig_overlap_audit_r0.json
          if-no-files-found: error
