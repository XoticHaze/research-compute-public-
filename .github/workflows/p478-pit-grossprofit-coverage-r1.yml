name: P478 PIT GrossProfit Coverage R1
on:
  pull_request:
    paths:
      - 'research/p478_pit_grossprofit_coverage_r1.py'
      - '.github/workflows/p478-pit-grossprofit-coverage-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas requests lxml html5lib beautifulsoup4
      - id: result
        run: |
          python research/p478_pit_grossprofit_coverage_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p478_pit_grossprofit_coverage_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p478-pit-grossprofit-coverage__${{ steps.result.outputs.decision }}
          path: research/artifacts/p478_pit_grossprofit_coverage_r1.json
          if-no-files-found: error
