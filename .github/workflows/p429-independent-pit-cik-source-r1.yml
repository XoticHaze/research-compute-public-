name: P429 Independent PIT CIK Source R1
on:
  pull_request:
    paths:
      - 'research/p429_independent_pit_cik_source_r1.py'
      - '.github/workflows/p429-independent-pit-cik-source-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: result
        run: |
          python research/p429_independent_pit_cik_source_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/p429_independent_pit_cik_source_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p429-independent-pit-cik__${{ steps.result.outputs.decision }}
          path: research/artifacts/p429_independent_pit_cik_source_r1.json
          if-no-files-found: error
