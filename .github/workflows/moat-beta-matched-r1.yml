name: MOAT Beta Matched Alpha R1
on:
  pull_request:
    paths:
      - '.github/workflows/moat-beta-matched-r1.yml'
      - 'research/moat-beta-matched-r1.json'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Evaluate frozen MOAT beta-matched alpha
        run: |
          python - <<'PY'
          import json,urllib.request,datetime as dt,math
          from pathlib import Path
          c=json.loads(Path('research/moat-beta-matched-r1.json').read_text()); st=dt.datetime.fromisoformat(c['start']+'T00:00:00+00:00'); en=dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=1)
          def fetch(s):
              u=f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?period1={int(st.timestamp())}&period2={int(en.timestamp())}&interval=1d&events=history&includeAdjustedClose=true"; req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as q:o=json.load(q)['chart']['result'][0]
              a=o['indicators'].get('adjclose',[{}])[0].get('adjclose') or o['indicators']['quote'][0]['close']; return {dt.datetime.fromtimestamp(t,dt.timezone.utc).date().isoformat():float(p) for t,p in zip(o['timestamp'],a) if p is not None}
          px={s:fetch(s) for s in ['MOAT','SPY','BIL']}; ds=sorted(set(px['MOAT'])&set(px['SPY'])&set(px['BIL'])); months={}
          for d in ds: months.setdefault(d[:7],[]).append(d)
          rows=[]
          for m,z in sorted(months.items()):
              if len(z)<10: continue
              rows.append((m,px['MOAT'][z[-1]]/px['MOAT'][z[0]]-1,px['SPY'][z[-1]]/px['SPY'][z[0]]-1,px['BIL'][z[-1]]/px['BIL'][z[0]]-1))
          xb=sum(x[2] for x in rows)/len(rows); yb=sum(x[1] for x in rows)/len(rows); beta=sum((x[2]-xb)*(x[1]-yb) for x in rows)/sum((x[2]-xb)**2 for x in rows); beta=max(0,min(1,beta))
          def stats(z):
              wealth=ctrl=1.0; peak=1.0; mdd=0.0; yrs={}
              for m,r,s,b in z:
                  rc=beta*s+(1-beta)*b; wealth*=1+r; ctrl*=1+rc; peak=max(peak,wealth); mdd=min(mdd,wealth/peak-1); yrs.setdefault(m[:4],[1.0,1.0]); yrs[m[:4]][0]*=1+r; yrs[m[:4]][1]*=1+rc
              years=max(1,(len(z)/12)); cost=c['cost_bps']/10000; wf=wealth*(1-cost); cf=ctrl*(1-cost); cg=wf**(1/years)-1; cc=cf**(1/years)-1; wins=sum(1 for a,b in yrs.values() if a>b); return {'months':len(z),'cagr':cg,'control_cagr':cc,'excess_cagr':cg-cc,'max_drawdown':mdd,'positive_year_fraction':wins/max(1,len(yrs)),'winning_years':wins,'calendar_years':len(yrs)}
          p={k:stats([x for x in rows if x[0]>=lo and (hi is None or x[0]<hi)]) for k,(lo,hi) in c['periods'].items()}; g=c['gates']; dd_penalty=max(0,abs(p['full']['max_drawdown'])-0.30)
          out={'schema':'moat_beta_matched_result.v1','beta':beta,'periods':p,'gates':g}; out['supported']=(p['full']['excess_cagr']>=g['min_full_excess_cagr'] and p['pre2020']['excess_cagr']>=g['min_pre2020_excess_cagr'] and p['post2020']['excess_cagr']>=g['min_post2020_excess_cagr'] and p['full']['positive_year_fraction']>=g['min_positive_year_fraction'] and dd_penalty<=g['max_drawdown_penalty']); out['research_only']=True
          Path('moat-beta-matched-r1-result.json').write_text(json.dumps(out,sort_keys=True,indent=2)); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: moat-beta-matched-r1-result, path: moat-beta-matched-r1-result.json, retention-days: 14}
