name: IBKR Legacy Gateway Image Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ibkr-legacy-image-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LEGACY_IMAGE: ghcr.io/gnzsnz/ib-gateway:10.45.1c
    steps:
      - name: Resolve historical Gateway identity
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$LEGACY_IMAGE"
          echo "LEGACY_IMAGE_ID=$(docker image inspect "$LEGACY_IMAGE" --format '{{.Id}}')"
          echo "LEGACY_REPO_DIGESTS=$(docker image inspect "$LEGACY_IMAGE" --format '{{json .RepoDigests}}')"
          echo "LEGACY_CREATED=$(docker image inspect "$LEGACY_IMAGE" --format '{{.Created}}')"
          docker run --rm --entrypoint /bin/sh "$LEGACY_IMAGE" -lc '
            set -eu
            printf "TWS_MAJOR_VRSN=%s\n" "${TWS_MAJOR_VRSN:-}"
            printf "IBC_PATH="; command -v ibcstart.sh || true
            find /opt /home/ibgateway -maxdepth 4 \( -iname "*ibc*.jar" -o -iname "ibcstart.sh" \) -print 2>/dev/null | head -20 || true
            find /home/ibgateway/Jts/ibgateway -maxdepth 1 -mindepth 1 -type d -printf "GATEWAY_DIR=%f\n" 2>/dev/null || true
          '
