name: IBKR Legacy Gateway Image Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ibkr-legacy-image-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      IMAGE_1045: ghcr.io/gnzsnz/ib-gateway:10.45.1c
      IMAGE_1047: ghcr.io/gnzsnz/ib-gateway:10.47.1e
      IMAGE_1049: ghcr.io/gnzsnz/ib-gateway:10.49.1c
    steps:
      - name: Resolve Gateway image identities
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; image="$2"
            echo "=== ${label} ${image} ==="
            if ! docker pull "$image"; then
              echo "${label}_AVAILABLE=0"
              return 0
            fi
            echo "${label}_AVAILABLE=1"
            echo "${label}_IMAGE_ID=$(docker image inspect "$image" --format '{{.Id}}')"
            echo "${label}_REPO_DIGESTS=$(docker image inspect "$image" --format '{{json .RepoDigests}}')"
            echo "${label}_CREATED=$(docker image inspect "$image" --format '{{.Created}}')"
            docker run --rm --entrypoint /bin/sh "$image" -lc '
              set -eu
              printf "TWS_MAJOR_VRSN=%s\n" "${TWS_MAJOR_VRSN:-}"
              printf "IBC_PATH="; command -v ibcstart.sh || true
              find /home/ibgateway/Jts/ibgateway -maxdepth 1 -mindepth 1 -type d -printf "GATEWAY_DIR=%f\n" 2>/dev/null || true
            '
          }
          probe V1045 "$IMAGE_1045"
          probe V1047 "$IMAGE_1047"
          probe V1049 "$IMAGE_1049"
