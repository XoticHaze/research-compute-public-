name: P13 PIT Semiconductor Residual R1
on:
  pull_request:
    paths:
      - 'research/p13_pit_semiconductor_residual_r1.py'
      - '.github/workflows/p13-pit-semiconductor-residual-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --disable-pip-version-check -q numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
          python -m pip install --disable-pip-version-check -q 'git+https://github.com/arielNacamulli/pitindex.git@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - id: evaluate
        run: |
          python research/p13_pit_semiconductor_residual_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_pit_semiconductor_residual_r1.json')); t=x['tests']['2022_forward']; c=x['coverage']; vals={'decision':x['decision'],'raw':f"{100*t['excess_vs_raw_cagr']:.2f}",'ew':f"{100*t['excess_vs_pit_ew_cagr']:.2f}",'smh':f"{100*t['excess_vs_smh_cagr']:.2f}",'folds':str(t['positive_folds_vs_raw']),'cov':f"{100*c['median']:.0f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-pit__${{ steps.evaluate.outputs.decision }}__recentRaw_${{ steps.evaluate.outputs.raw }}pp__PITEW_${{ steps.evaluate.outputs.ew }}pp__SMH_${{ steps.evaluate.outputs.smh }}pp__folds_${{ steps.evaluate.outputs.folds }}of5__coverage_${{ steps.evaluate.outputs.cov }}pct
          path: artifacts/p13_pit_semiconductor_residual_r1.json
          if-no-files-found: error
