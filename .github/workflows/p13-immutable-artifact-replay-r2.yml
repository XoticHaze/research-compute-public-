name: P13 Immutable Artifact Replay R2
on:
  pull_request:
    paths: ['scripts/p13_immutable_artifact_replay_r2.py','.github/workflows/p13-immutable-artifact-replay-r2.yml']
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - name: Materialize immutable prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34325797529 -n 'p13-frozen-contract__panel_a5f7f8eb3ce1__fp_e6b63d26f01d__recent_53.13pct' -D input
      - run: python scripts/p13_immutable_artifact_replay_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: p13-immutable-artifact-replay-r2
          path: artifacts/p13_immutable_artifact_replay_r2.json
          if-no-files-found: error
