name: Semiconductor Volume Liquidity Preflight

on:
  pull_request:
    paths:
      - 'research/semiconductor_volume_liquidity_preflight_20260906.py'
      - '.github/workflows/semiconductor-volume-liquidity-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install exact numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Execute source-only volume-liquidity preflight
        run: python research/semiconductor_volume_liquidity_preflight_20260906.py
      - name: Retain deterministic source receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semiconductor-volume-liquidity-preflight
          path: semiconductor_volume_liquidity_preflight_20260906.json
          retention-days: 14
          if-no-files-found: error
