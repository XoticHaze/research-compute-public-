name: MTUM Panic Rebound Regime R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mtum_panic_rebound_regime_r1.py'
      - '.github/workflows/mtum-panic-rebound-regime-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: eval
        run: |
          python research/mtum_panic_rebound_regime_r1.py
          python - <<'PY'
          import json,os
          r=json.load(open('research/artifacts/mtum_panic_rebound_regime_r1.json'))['result']
          b=lambda v:'na' if v is None else str(round(10000*v))
          tag=f"{r['decision']}__n_{r['panic_rebound_months']}__panicbps_{b(r['panic_mean_monthly_residual'])}__diffbps_{b(r['panic_minus_nonpanic_residual'])}"
          open(os.environ['GITHUB_OUTPUT'],'a').write(f'tag={tag}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mtum-panic-rebound-regime-r1__${{ steps.eval.outputs.tag }}
          path: research/artifacts/mtum_panic_rebound_regime_r1.json
          if-no-files-found: error
