name: P04 R3 H24 Context Concordance CI

on:
  push:
    branches:
      - research/p04-r3-h24-context-concordance-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install fixed test environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 pytest
      - name: Compile corrected consumer
        run: python -m py_compile scripts/p04_r3_h24_context_consumer_v1.py
      - name: Prove frozen nondirectional context semantics
        run: python -m pytest -q tests/test_p04_r3_h24_context_consumer_v1.py
