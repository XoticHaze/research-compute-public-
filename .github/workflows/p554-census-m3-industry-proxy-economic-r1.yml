name: P554 Census M3 Industry Proxy Economic R1

on:
  pull_request:
    paths:
      - 'research/p554_census_m3_vintage_manifest_r1.py'
      - 'research/p554_census_m3_industry_proxy_economic_r1.py'
      - 'contracts/p554_census_m3_industry_security_causal_contract_r1.json'
      - '.github/workflows/p554-census-m3-industry-proxy-economic-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 pypdf==5.9.0 pandas==2.3.2 numpy==2.3.2
      - name: Materialize point-in-time Census vintages
        run: python research/p554_census_m3_vintage_manifest_r1.py
      - name: Execute frozen industry-state proxy test
        run: python research/p554_census_m3_industry_proxy_economic_r1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p554-census-m3-industry-proxy-economic-r1
          path: |
            artifacts/p554_census_m3_vintage_manifest_r1.csv
            artifacts/p554_census_m3_vintage_manifest_r1_summary.json
            artifacts/p554_census_m3_industry_proxy_economic_r1.json
            artifacts/p554_census_m3_industry_proxy_intervals_r1.csv
          if-no-files-found: warn
