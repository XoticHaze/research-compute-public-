name: Medical Devices Alpha Fragility Discriminator

on:
  pull_request:
    paths:
      - "research/medical_devices_alpha_fragility_discriminator_20260906.py"
      - ".github/workflows/medical-devices-alpha-fragility-20260906.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install accepted numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Materialize exact accepted public Stage-A adapter
        run: |
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/stagea_runner.py
          test "$(git hash-object /tmp/stagea_runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python -m py_compile /tmp/stagea_runner.py research/medical_devices_alpha_fragility_discriminator_20260906.py
      - name: Execute exact-window benchmark and dependency discriminator
        run: |
          python research/medical_devices_alpha_fragility_discriminator_20260906.py \
            --runner /tmp/stagea_runner.py \
            --output medical-devices-alpha-fragility-receipt.json
          python -m json.tool medical-devices-alpha-fragility-receipt.json >/dev/null
          cat medical-devices-alpha-fragility-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain deterministic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: medical-devices-alpha-fragility-receipt
          path: medical-devices-alpha-fragility-receipt.json
          retention-days: 30
          if-no-files-found: error
