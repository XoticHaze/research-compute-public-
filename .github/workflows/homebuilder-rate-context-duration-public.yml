name: Homebuilder Rate Context Duration Public

on:
  pull_request:
    paths:
      - 'research/homebuilder_rate_context_duration_public_20260905.py'
      - '.github/workflows/homebuilder-rate-context-duration-public.yml'
      - 'research/homebuilder_rate_context_preflight_20260905.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install exact accepted numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1

      - name: Reprove born-public causal rate-context source plane
        run: python research/homebuilder_rate_context_preflight_20260905.py

      - name: Materialize exact already-public Stage-A adapter and contract
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/stagea.py
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/industry_stagea_public_runner_contract_20260905.json -o .campaign/stagea_contract.json
          test "$(git hash-object .campaign/stagea.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          test "$(git hash-object .campaign/stagea_contract.json)" = e710cf483e3afb634275e462bfdc4bedd34319b9
          python -m py_compile .campaign/stagea.py research/homebuilder_rate_context_duration_public_20260905.py
          python -m json.tool .campaign/stagea_contract.json >/dev/null

      - name: Execute born-public LOSO Homebuilder duration consumer
        run: python research/homebuilder_rate_context_duration_public_20260905.py

      - name: Retain deterministic result receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebuilder-rate-context-duration-public
          path: homebuilder_rate_context_duration_public_20260905.json
          if-no-files-found: error
          retention-days: 14
