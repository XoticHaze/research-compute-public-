name: HAOS Existing Cloudflare Zone Read Only (one-time branch check)
# One-time, GET-only observation using an EXISTING operator account credential.
# Does not grant Gateway Access service credentials to HAOS. No mutation.
# Does not run on main, schedule, PR or repository_dispatch.
on:
  push:
    branches:
      - assistant/haos-cf-existing-zone-read-20261029
    paths:
      - .github/workflows/haos-existing-cloudflare-zone-readonly-20261029.yml

permissions:
  contents: read

jobs:
  observe-existing-zone:
    if: github.repository == 'XoticHaze/research-compute-public-' && github.ref == 'refs/heads/assistant/haos-cf-existing-zone-read-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      # Existing authenticated Account/Access operator credential, not an HAOS
      # runtime token, mTLS cert, tunnel connector token, or SSH service token.
      CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_GATEWAY_ACCESS_TOKEN }}
      CF_READ_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ACCOUNT_ID }}
    steps:
      - name: Bounded credential-scope and route inventory (GET only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, build_opener, HTTPSHandler, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          ZONE='lifelatelycounseling.com'
          HOSTS=['ha.'+ZONE, 'hass.'+ZONE, 'homeassistant.'+ZONE, 'gateway-ops.'+ZONE]
          NAMES=['home-edge-01', 'haos-remote-edge', 'mmibkr-github-gateway-readonly']
          token=os.environ.get('CF_READ_TOKEN','')
          account=os.environ.get('CF_READ_ACCOUNT_ID','')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',account) or not token.strip():
              print('HAOS_CF_CREDENTIAL_SCOPE=MISSING; RESULT=NOT_OBSERVED')
              raise SystemExit(0)
          base='https://api.cloudflare.com/client/v4'
          opener=build_opener(HTTPSHandler(),NoRedirect())
          def get(path, query=''):
              if not path.startswith('/zones') and not path.startswith('/accounts/'+account+'/'):
                  raise ValueError('off-account Cloudflare path')
              if '..' in path or '://' in path: raise ValueError('bad path')
              url=base+path+query
              try:
                  req=Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
                  with opener.open(req,timeout=12) as response:
                      body=json.load(response)
                  if not isinstance(body,dict) or not body.get('success'): return 'API_ERROR',None
                  return 'OK',body
              except HTTPError as e:
                  if e.code in (401,403): return 'PERMISSION_DENIED',None
                  if e.code==404: return 'NOT_FOUND',None
                  return 'HTTP_ERROR',None
              except (URLError, OSError, ValueError,TimeoutError):
                  return 'NETWORK_OR_RESPONSE_ERROR',None
          def partial(body):
              info=(body or {}).get('result_info') or {}
              total=int(info.get('total_count') or 0)
              per=int(info.get('per_page') or 100)
              pages=int(info.get('total_pages') or 0)
              return pages>1 or total>per
          zstatus, zones=get('/zones','?name='+ZONE+'&per_page=100')
          if zstatus!='OK':
              print('HAOS_CF_ZONE_READ='+zstatus+'; RESULT=NOT_OBSERVED')
              raise SystemExit(0)
          matches=[z for z in (zones.get('result') or []) if
              z.get('name')==ZONE and z.get('status')=='active' and
              (z.get('account') or {}).get('id')==account]
          if len(matches)!=1 or partial(zones):
              print('HAOS_CF_ZONE_IDENTITY=NOT_UNIQUELY_MATCHED; RESULT=FAIL_CLOSED')
              raise SystemExit(0)
          zid=matches[0].get('id','')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',zid):
              print('HAOS_CF_ZONE_IDENTITY=INVALID; RESULT=FAIL_CLOSED')
              raise SystemExit(0)
          print('HAOS_CF_ZONE_IDENTITY=EXACT_ACTIVE_MATCH')
          tunnels_status,tunnels=get('/accounts/'+account+'/cfd_tunnel','?is_deleted=false&per_page=100')
          print('HAOS_CF_TUNNEL_READ='+tunnels_status)
          if tunnels_status=='OK':
              print('HAOS_CF_TUNNEL_LIST_COMPLETENESS='+('PARTIAL' if partial(tunnels) else 'FIRST_PAGE_COMPLETE'))
              observed=tunnels.get('result') or []
              print('HAOS_CF_TUNNEL_FIRST_PAGE_COUNT='+str(len(observed)))
              inf=tunnels.get('result_info') or {}
              total=inf.get('total_count')
              print('HAOS_CF_TUNNEL_REPORTED_TOTAL='+str(total) if isinstance(total,int) and 0<=total<10000 else 'HAOS_CF_TUNNEL_REPORTED_TOTAL=UNKNOWN')
              selected={t.get('name'):t for t in (tunnels.get('result') or []) if t.get('name') in NAMES}
              for name in NAMES:
                  t=selected.get(name)
                  if t is None:
                      print('TUNNEL_'+NAMES.index(name).__str__()+'=NOT_IN_FIRST_PAGE')
                      continue
                  state=t.get('status','unknown')
                  mode=t.get('config_src','unknown')
                  state=state if state in ('inactive','degraded','healthy','down') else 'UNKNOWN'
                  mode=mode if mode in ('local','cloudflare') else 'UNKNOWN'
                  tid=t.get('id','')
                  print('TUNNEL_'+str(NAMES.index(name))+'_STATE='+state+'_CONFIG='+mode)
                  if not isinstance(tid,str) or not re.fullmatch(r'[a-fA-F0-9-]{36}',tid):
                      continue
                  conn_state,conn=get('/accounts/'+account+'/cfd_tunnel/'+tid+'/connections')
                  print('TUNNEL_'+str(NAMES.index(name))+'_CONNECTION_READ='+conn_state)
                  if conn_state=='OK':
                      print('TUNNEL_'+str(NAMES.index(name))+'_CONNECTED_CLIENTS='+str(len(conn.get('result') or [])))
                  if mode=='cloudflare':
                      cstate,conf=get('/accounts/'+account+'/cfd_tunnel/'+tid+'/configurations')
                      print('TUNNEL_'+str(NAMES.index(name))+'_CONFIG_READ='+cstate)
                      if cstate=='OK':
                          ingress=((conf.get('result') or {}).get('config') or {}).get('ingress') or []
                          for host in HOSTS:
                              present=any(i.get('hostname')==host for i in ingress if isinstance(i,dict))
                              print('TUNNEL_'+str(NAMES.index(name))+'_HOST_'+str(HOSTS.index(host))+'='+('PRESENT' if present else 'ABSENT'))
          for h in HOSTS:
              state,records=get('/zones/'+zid+'/dns_records','?name='+h+'&per_page=100')
              hit=(state=='OK' and any(x.get('name')==h for x in (records.get('result') or [])))
              label=('PARTIAL' if state=='OK' and partial(records) else
                     'PRESENT' if hit else 'ABSENT' if state=='OK' else state)
              print('DNS_HOST_'+str(HOSTS.index(h))+'='+label)
          state,hosts=get('/zones/'+zid+'/certificate_authorities/hostname_associations')
          print('HAOS_CF_MTLS_HOST_ASSOCIATIONS_READ='+state)
          if state=='OK':
              present=set(((hosts.get('result') or {}).get('hostnames') or []))
              print('HAOS_CF_MTLS_ASSOCIATED='+('YES' if HOSTS[0] in present else 'NO'))
          state,waf=get('/zones/'+zid+'/rulesets/phases/http_request_firewall_custom/entrypoint')
          print('HAOS_CF_WAF_READ='+state)
          if state=='OK':
              rules=((waf.get('result') or {}).get('rules') or [])
              matched=any(r.get('action')=='block' and r.get('enabled',True)
                and ('"'+HOSTS[0]+'"') in str(r.get('expression',''))
                and 'not cf.tls_client_auth.cert_verified' in str(r.get('expression',''))
                and 'cf.tls_client_auth.cert_revoked' in str(r.get('expression',''))
                for r in rules if isinstance(r,dict))
              print('HAOS_CF_WAF_BLOCK_RULE_CANDIDATE='+('YES' if matched else 'NO'))
          print('HAOS_CF_LIVE_MTLS_DENY_TEST=NOT_EXECUTED')
          print('HAOS_CF_MUTATIONS=NONE')
          PY
