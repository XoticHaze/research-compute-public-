name: P404 PIT Membership CIK Coverage R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p404_pit_membership_cik_coverage_r1.py'
      - '.github/workflows/p404-pit-membership-cik-coverage-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'git+https://github.com/arielNacamulli/pitindex@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - id: eval
        run: |
          python research/p404_pit_membership_cik_coverage_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p404_pit_membership_cik_coverage_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p404-pit-membership-cik-coverage__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p404_pit_membership_cik_coverage_r1.json
          if-no-files-found: error
