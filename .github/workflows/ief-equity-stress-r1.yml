name: ief-equity-stress-r1
on:
  push:
    paths:
      - 'research/ief_equity_stress_r1.py'
      - '.github/workflows/ief-equity-stress-r1.yml'
  pull_request:
    paths:
      - 'research/ief_equity_stress_r1.py'
      - '.github/workflows/ief-equity-stress-r1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas numpy
      - name: Execute frozen IEF equity-stress discriminator
        run: set -o pipefail; python research/ief_equity_stress_r1.py | tee ief_equity_stress_r1_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ief-equity-stress-r1-result
          path: ief_equity_stress_r1_result.txt
