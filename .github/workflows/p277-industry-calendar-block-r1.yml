name: P277 Industry Calendar Block R1
on:
  pull_request:
    branches: [assistant/market-research-p273-industry-capital-role-cost-stress-r1]
    paths:
      - 'research/p277_industry_calendar_block_r1.py'
      - '.github/workflows/p277-industry-calendar-block-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          cd research && python p277_industry_calendar_block_r1.py && cd ..
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p277_industry_calendar_block_r1.json'))
          tag=f"{x['decision']}__matched_{x['matched_positive_blocks']}_3__cagradd_{x['industry_addition_positive_cagr_blocks']}_3__dd_{x['industry_addition_nonworse_maxdd_blocks']}_3"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p277-industry-calendar-block__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p277_industry_calendar_block_r1.json
          if-no-files-found: error
