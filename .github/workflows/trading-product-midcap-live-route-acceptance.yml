name: Trading Product Midcap Live Route Acceptance
on:
  pull_request:
    paths:
      - 'research/trading_product_midcap_live_route_acceptance.py'
      - '.github/workflows/trading-product-midcap-live-route-acceptance.yml'
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python research/trading_product_midcap_live_route_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: trading-product-midcap-live-route-${{ github.sha }}
          path: artifacts/trading_product_midcap_live_route_acceptance.json
          if-no-files-found: error
