name: Atomic Capsule Publisher Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atomic-capsule-publisher-live-smoke.yml'
      - 'scripts/publish_chunked_envelope_atomic_v1.py'

permissions:
  contents: write

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Build synthetic encrypted publication inputs
        run: |
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          ciphertext=(b'atomic-live-smoke-' + os.environ['GITHUB_RUN_ID'].encode()) * 600
          payload=base64.b64encode(ciphertext).decode('ascii')
          Path('/tmp/payload.b64').write_text(payload)
          envelope={
            'schema':'atomic-live-smoke-envelope-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'authority':'research_only',
            'harness':'atomic_capsule_publisher_live_smoke_v1',
            'recipient_key_id':'sha256:'+'1'*64,
            'sender_public_b64':base64.b64encode(b's'*32).decode('ascii'),
            'nonce_b64':base64.b64encode(b'n'*12).decode('ascii'),
            'ciphertext_sha256':hashlib.sha256(ciphertext).hexdigest(),
            'plaintext_sha256':'2'*64,
            'chunks':[],
          }
          Path('/tmp/envelope.json').write_text(json.dumps(envelope,sort_keys=True)+'\n')
          PY
      - name: Publish chunks and envelope in one exchange-ref advance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="smoke/${GITHUB_RUN_ID}"
          out="$(python scripts/publish_chunked_envelope_atomic_v1.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch atomic-publisher-smoke-exchange \
            --payload-b64-file /tmp/payload.b64 \
            --envelope-file /tmp/envelope.json \
            --response-root "$root" \
            --stem capsule \
            --envelope-path "$root/envelope.json" \
            --message "smoke: atomically publish capsule ${GITHUB_RUN_ID}")"
          echo "$out"
          sha="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["published_commit"])' "$out")"
          echo "PUBLISHED_SHA=$sha" >> "$GITHUB_ENV"
      - name: Verify one commit contains complete publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="smoke/${GITHUB_RUN_ID}"
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['PUBLISHED_SHA']; token=os.environ['GH_TOKEN']; root=f"smoke/{os.environ['GITHUB_RUN_ID']}/"
          def get(url):
              req=Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urlopen(req,timeout=30) as r: return json.load(r)
          commit=get(f'https://api.github.com/repos/{repo}/git/commits/{sha}')
          tree=get(f'https://api.github.com/repos/{repo}/git/trees/{commit["tree"]["sha"]}?recursive=1')
          paths=sorted(x['path'] for x in tree['tree'] if x['path'].startswith(root))
          assert paths and paths[-1] == root+'envelope.json', paths
          chunks=[p for p in paths if p.endswith('.txt')]
          assert len(chunks) >= 2, paths
          print(json.dumps({'atomic_publication_commit':sha,'paths':paths},sort_keys=True))
          PY
