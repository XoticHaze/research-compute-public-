name: Opportunity Matched Alpha Memory Recency
on:
  pull_request:
    paths:
      - 'research/opportunity_matched_alpha_memory_recency_20260907.py'
      - '.github/workflows/opportunity-matched-alpha-memory-recency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Restore exact accepted Stage-A adapter and contract
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/stagea.py
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/industry_stagea_public_runner_contract_20260905.json -o .campaign/stagea_contract.json
          test "$(git hash-object .campaign/stagea.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          test "$(git hash-object .campaign/stagea_contract.json)" = e710cf483e3afb634275e462bfdc4bedd34319b9
          PYTHONPATH=research python -m py_compile research/opportunity_cross_family_stagea_capacity_allocator_20260907.py research/opportunity_prior_alpha_blend_disjoint_family_confirmation_20260907.py research/opportunity_matched_alpha_memory_recency_20260907.py
      - name: Execute two-surface memory discriminator
        run: PYTHONPATH=research python research/opportunity_matched_alpha_memory_recency_20260907.py
      - name: Retain receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opportunity-matched-alpha-memory-recency
          path: opportunity_matched_alpha_memory_recency_20260907.json
          retention-days: 30
          if-no-files-found: warn
