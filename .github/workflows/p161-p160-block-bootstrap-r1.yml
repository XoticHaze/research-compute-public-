name: P161 P160 Block Bootstrap R1
on:
  pull_request:
    paths:
      - 'research/p161_p160_block_bootstrap_r1.py'
      - '.github/workflows/p161-p160-block-bootstrap-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p161_p160_block_bootstrap_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p161_p160_block_bootstrap_r1.json')); a=x['tests']['2015']['bootstrap']; b=x['tests']['2020']['bootstrap']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"decision={x['decision']}\np15={a['prob_nonpositive_matched']:.3f}\np20={b['prob_nonpositive_matched']:.3f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p161-p160-bootstrap__${{ steps.run.outputs.decision }}__p15_${{ steps.run.outputs.p15 }}__p20_${{ steps.run.outputs.p20 }}
          path: artifacts/p161_p160_block_bootstrap_r1.json
          if-no-files-found: error
