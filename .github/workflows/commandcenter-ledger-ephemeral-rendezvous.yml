name: CommandCenter Ledger Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/commandcenter-ledger-*.txt'
      - 'rendezvous/requests/commandcenter-neutral-gate-*.txt'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange
  TRUST_MODE: public_encrypted
  PROOF_KIND: ${{ startsWith(github.head_ref, 'assistant/neutral-broker-public-gate-') && 'neutral_gate' || 'ledger' }}

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography pytest jsonschema
      - name: Allocate fail-closed memory-backed private scratch
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(python scripts/public_compute_memory_scratch_v1.py init)"
          {
            echo "TMPDIR=$scratch"
            echo "XDG_CACHE_HOME=$scratch/.cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
            echo "PUBLIC_COMPUTE_REQUIRE_RAM_SCRATCH=1"
          } >> "$GITHUB_ENV"
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['TMPDIR'],'cc-ledger-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          key_id='sha256:'+hashlib.sha256(public_raw).hexdigest()
          public={'schema':'commandcenter-ledger-ephemeral-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'recipient_b64':base64.b64encode(public_raw).decode('ascii'),'recipient_key_id':key_id}
          Path(os.environ['TMPDIR'],'cc-ledger-recipient.json').write_text(json.dumps(public,sort_keys=True)+'\n')
          print('COMMANDCENTER_LEDGER_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('COMMANDCENTER_LEDGER_RECIPIENT_KEY_ID='+key_id)
          PY
      - name: Publish recipient to isolated exchange
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json"
          payload="$(base64 -w0 "$TMPDIR/cc-ledger-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish one-run CommandCenter ledger recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -d "$body" >/dev/null
      - name: Wait for run-bound encrypted envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PROOF_KIND" = "neutral_gate" ]; then
            path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/commandcenter-neutral-gate-envelope.json"
          else
            path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/commandcenter-ledger-envelope.json"
          fi
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 90); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$TMPDIR/cc-ledger-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound CommandCenter ledger envelope did not arrive'; exit 42; }
      - name: Execute fixed encrypted contract and emit sanitized receipt
        run: |
          set -euo pipefail
          test "$TRUST_MODE" = "public_encrypted"
          ulimit -c 0
          python scripts/public_compute_memory_scratch_v1.py check
          if [ "$PROOF_KIND" = "neutral_gate" ]; then
            python scripts/commandcenter_neutral_gate_ephemeral_consumer_v1.py --envelope "$TMPDIR/cc-ledger-envelope.json" --private-key "$TMPDIR/cc-ledger-private.b64" --run-id "$GITHUB_RUN_ID"
          else
            python scripts/commandcenter_ledger_ephemeral_consumer_v1.py --envelope "$TMPDIR/cc-ledger-envelope.json" --private-key "$TMPDIR/cc-ledger-private.b64" --run-id "$GITHUB_RUN_ID"
          fi
      - name: Remove one-run private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TMPDIR:-}" ]; then
            python scripts/public_compute_memory_scratch_v1.py cleanup
          fi
