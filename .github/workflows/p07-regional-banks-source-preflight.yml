name: P07 Regional Banks Source Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/p07-regional-banks-source-preflight.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute source-only preflight then frozen regional-bank Stage-A
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          # Source-only recovery: query1 returned HTTP 404 before the first symbol on run 34061554509.
          # Yahoo's query2 chart endpoint exposes the same JSON/adjusted-close contract; scientific code is unchanged.
          sed -i 's#https://query1.finance.yahoo.com/v8/finance/chart/#https://query2.finance.yahoo.com/v8/finance/chart/#' /tmp/runner.py
          grep -q 'https://query2.finance.yahoo.com/v8/finance/chart/' /tmp/runner.py
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          family='regional_banks'; benchmark='KRE'
          symbols=['FITB','KEY','RF','CFG','HBAN','ZION','MTB','CMA']
          required=[*r.TRAIN,*symbols,'QQQ',benchmark]
          preflight={}
          try:
              frames={s:r._load(s) for s in required}
              for s,f in frames.items():
                  preflight[s]={'rows':int(len(f)),'first':f.timestamp.iloc[0].isoformat(),'last':f.timestamp.iloc[-1].isoformat()}
              common=set(frames[required[0]].timestamp)
              for s in required[1:]: common &= set(frames[s].timestamp)
              common=sorted(common)
              if len(common)<1500: raise RuntimeError(f'insufficient common source calendar={len(common)}')
              cutoff=common[-1].isoformat()
              out=r._evaluate_matrix({family:{'primary_industry_etf':benchmark,'development_universe':symbols}},cutoff)
              summary=out['family_summary'][family]
              first=common[0]; last=common[-1]
              qqq=frames['QQQ'].set_index('timestamp').price
              kre=frames[benchmark].set_index('timestamp').price
              qqq_window=float(qqq.loc[last]/qqq.loc[first]-1.0)
              kre_window=float(kre.loc[last]/kre.loc[first]-1.0)
              decision='ADVANCE_REGIONAL_BANKS_TO_INDEPENDENT_CONFIRMATION' if summary['development_family_gate_pass'] else 'REJECT_REGIONAL_BANKS_STAGEA'
              receipt={'schema':'p07-regional-banks-source-preflight.v1','family':family,'benchmark':benchmark,
                       'development_universe':symbols,'source_support':'SUFFICIENT','source_endpoint':'query2.finance.yahoo.com/v8/finance/chart',
                       'preflight':preflight,'common_calendar_rows':len(common),'window_first':first.isoformat(),'window_last':last.isoformat(),
                       'matched_window_benchmark_return':kre_window,'matched_window_qqq_return':qqq_window,
                       'family_summary':summary,'per_symbol':out['per_symbol'],'decision':decision,
                       'frozen_stagea_cost_bps':25.0,'sector_substitution_stress_bps':50.0,
                       'research_only':True,'promotion_authority':False,'allocation_authority':False,
                       'runtime_mutation':False,'live_trading_change':False}
          except Exception as exc:
              receipt={'schema':'p07-regional-banks-source-preflight.v1','family':family,'benchmark':benchmark,
                       'development_universe':symbols,'source_support':'INSUFFICIENT','source_endpoint':'query2.finance.yahoo.com/v8/finance/chart',
                       'preflight':preflight,'source_error':f'{type(exc).__name__}: {exc}','decision':'SOURCE_FAILURE_NO_SCIENTIFIC_SCORE',
                       'research_only':True,'promotion_authority':False,'allocation_authority':False,
                       'runtime_mutation':False,'live_trading_change':False}
          open('p07-regional-banks-source-preflight-receipt.json','w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('P07_REGIONAL_BANKS_RECEIPT='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-regional-banks-source-preflight
          path: p07-regional-banks-source-preflight-receipt.json
          retention-days: 14
