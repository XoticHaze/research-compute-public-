name: P46 P36 Causal Recent Cost R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_causal_recent_cost_r1.py'
      - '.github/workflows/p46-p36-causal-recent-cost-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_causal_recent_cost_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_causal_recent_cost_r1.json')); vals={'decision':x['decision'],'bm':str(x['break_even_matched_bps']),'bq':str(x['break_even_qqq_bps']),'m100':f"{100*x['at_100']['excess_matched']:.3f}",'q100':f"{100*x['at_100']['excess_qqq']:.3f}",'to':f"{x['annual_turnover']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-recent-cost__${{ steps.evaluate.outputs.decision }}__beM_${{ steps.evaluate.outputs.bm }}__beQ_${{ steps.evaluate.outputs.bq }}__m100_${{ steps.evaluate.outputs.m100 }}pp__q100_${{ steps.evaluate.outputs.q100 }}pp__turn_${{ steps.evaluate.outputs.to }}x
          path: artifacts/p46_p36_causal_recent_cost_r1.json
          if-no-files-found: error
