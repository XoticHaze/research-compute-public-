name: HFDL Equity History E1 R1

on:
  pull_request:
    paths:
      - 'cloudflare/fleet-authority/**'
      - 'scripts/hfdl_api_key_envelope_consumer_v1.py'
      - 'research/hfdl_equity_history_e1.py'
      - 'tests/test_hfdl_api_key_envelope_consumer_v1.py'
      - 'tests/test_hfdl_equity_history_e1.py'
      - 'tests/test_hfdl_fleet_authority_contract_v1.py'
      - '.github/workflows/hfdl-equity-history-e1-r1.yml'
      - 'rendezvous/fire/hfdl-equity-history-e1-r1'
  push:
    branches: [hfdl-e1-authority-v1]
    paths:
      - 'rendezvous/fire/hfdl-equity-history-e1-r1'
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated E1 symbols
        required: false
        default: 'AMAT,APH'
        type: string
      start_date:
        description: Requested provider start date
        required: false
        default: '2004-01-01'
        type: string
      end_date:
        description: Requested provider end date
        required: false
        default: '2022-02-28'
        type: string
      mm_source_sha:
        description: Exact MM-IBKR source SHA for canonical admission
        required: false
        default: '24128a842cd860cbf1fe6c93f368fabdae925f80'
        type: string

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed Data E1 dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow cryptography pytest
      - name: Validate source and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/fleet-authority/src/index.js
          python -m py_compile scripts/hfdl_api_key_envelope_consumer_v1.py
          python -m py_compile research/hfdl_equity_history_e1.py
          python -m pytest -q \
            tests/test_hfdl_api_key_envelope_consumer_v1.py \
            tests/test_hfdl_equity_history_e1.py \
            tests/test_hfdl_fleet_authority_contract_v1.py
      - name: Probe public AMAT APH metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/hfdl-e1-pr-probe
          python research/hfdl_equity_history_e1.py \
            --metadata-only \
            --symbols AMAT,APH \
            --output-root artifacts/hfdl-e1-pr-probe
          python - <<'PY'
          import json
          from pathlib import Path
          node=json.loads(Path('artifacts/hfdl-e1-pr-probe/coverage_receipt.json').read_text())
          rows=node.get('symbols') or []
          if [row.get('symbol') for row in rows] != ['AMAT','APH']:
              raise SystemExit('unexpected metadata symbols')
          if not all(row.get('status') == 'AVAILABLE' for row in rows):
              raise SystemExit('HFDL public metadata probe did not prove both symbols')
          print('HFDL_E1_PUBLIC_METADATA=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hfdl-e1-public-metadata-${{ github.run_id }}
          path: artifacts/hfdl-e1-pr-probe/
          retention-days: 7
          if-no-files-found: error

  acquire:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed Data E1 dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow cryptography
      - name: Resolve bounded acquisition request
        shell: bash
        env:
          DISPATCH_SYMBOLS: ${{ inputs.symbols }}
          DISPATCH_START_DATE: ${{ inputs.start_date }}
          DISPATCH_END_DATE: ${{ inputs.end_date }}
          DISPATCH_MM_SOURCE_SHA: ${{ inputs.mm_source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              symbols=(os.environ.get('DISPATCH_SYMBOLS') or 'AMAT,APH').strip()
              start=(os.environ.get('DISPATCH_START_DATE') or '2004-01-01').strip()
              end=(os.environ.get('DISPATCH_END_DATE') or '2022-02-28').strip()
              mm_source=(os.environ.get('DISPATCH_MM_SOURCE_SHA') or '24128a842cd860cbf1fe6c93f368fabdae925f80').strip().lower()
              target_tf='15Min'
          else:
              node=json.loads(Path('rendezvous/fire/hfdl-equity-history-e1-r1').read_text())
              if node.get('schema') != 'public_research.hfdl_e1_fire.v1':
                  raise SystemExit('HFDL E1 fire schema rejected')
              symbols=','.join(str(x).strip().upper() for x in (node.get('symbols') or []) if str(x).strip())
              start=str(node.get('start_date') or '').strip()
              end=str(node.get('end_date') or '').strip()
              mm_source=str(node.get('mm_source_sha') or '').strip().lower()
              target_tf=str(node.get('canonical_target_timeframe') or '15Min').strip()

          items=[x.strip().upper() for x in symbols.split(',') if x.strip()]
          if not items or any(not re.fullmatch(r'[A-Z0-9.^_-]{1,20}', x) for x in items):
              raise SystemExit('HFDL E1 symbol contract rejected')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', start) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}', end):
              raise SystemExit('HFDL E1 date contract rejected')
          if not re.fullmatch(r'[0-9a-f]{40}', mm_source):
              raise SystemExit('HFDL E1 exact MM source SHA rejected')
          if not re.fullmatch(r'(?:[1-9]\d*)Min|[1-9]\d*Hour|1Day', target_tf):
              raise SystemExit('HFDL E1 canonical target timeframe rejected')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('HFDL_E1_SYMBOLS='+','.join(items)+'\n')
              fh.write('HFDL_E1_START_DATE='+start+'\n')
              fh.write('HFDL_E1_END_DATE='+end+'\n')
              fh.write('MMIBKR_SOURCE_SHA='+mm_source+'\n')
              fh.write('HFDL_E1_TARGET_TF='+target_tf+'\n')
          print('HFDL_E1_REQUEST=PASS')
          print('HFDL_E1_SYMBOL_COUNT='+str(len(items)))
          PY
      - name: Probe public provider coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/hfdl-e1
          python research/hfdl_equity_history_e1.py \
            --metadata-only \
            --symbols "$HFDL_E1_SYMBOLS" \
            --output-root artifacts/hfdl-e1
      - name: Consume sealed HFDL key
        id: authority
        shell: bash
        run: |
          set +e
          python scripts/hfdl_api_key_envelope_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/hfdl-e1.key" \
            --receipt artifacts/hfdl-e1/hfdl_authority_receipt.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            echo "classification=PRIVATE_INPUT_READY" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "classification=PRIVATE_INPUT_FULFILLMENT_FAILURE" >> "$GITHUB_OUTPUT"
            echo "HFDL_E1_AUTHORITY=PRIVATE_INPUT_FULFILLMENT_FAILURE"
          else
            exit "$rc"
          fi
      - name: Acquire HFDL raw 1-minute PiTrading history
        if: steps.authority.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/hfdl_equity_history_e1.py \
            --symbols "$HFDL_E1_SYMBOLS" \
            --output-root artifacts/hfdl-e1 \
            --api-key-file "$RUNNER_TEMP/hfdl-e1.key" \
            --start-date "$HFDL_E1_START_DATE" \
            --end-date "$HFDL_E1_END_DATE"
      - name: Materialize exact MM source for canonical admission
        if: steps.authority.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --source-sha "$MMIBKR_SOURCE_SHA" \
            --destination "$RUNNER_TEMP/mm-source" \
            --archive-output "$RUNNER_TEMP/mm-source.tar.gz" \
            --output "$RUNNER_TEMP/mm-source.json" \
            --run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          node=json.loads(Path(os.environ['RUNNER_TEMP'],'mm-source.json').read_text())
          if node.get('source_sha') != os.environ['MMIBKR_SOURCE_SHA']:
              raise SystemExit('MM source identity mismatch')
          if node.get('vault_attestation_verified') is not True:
              raise SystemExit('MM source vault attestation not verified')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('MM_SOURCE_ROOT='+str(node['source_root'])+'\n')
          print('HFDL_E1_MM_SOURCE=PASS')
          PY
      - name: Install exact MM canonical consumer dependencies
        if: steps.authority.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$MM_SOURCE_ROOT/requirements.txt"
      - name: Prepare deterministic MM admission handoffs
        if: steps.authority.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd

          root=Path('artifacts/hfdl-e1')
          rows=[]
          for symbol in [x for x in os.environ['HFDL_E1_SYMBOLS'].split(',') if x]:
              symbol_dir=root/symbol
              parquet=symbol_dir/f'{symbol}_1Min.parquet'
              lineage_path=symbol_dir/f'{symbol}_1Min.lineage.json'
              frame=pd.read_parquet(parquet)
              handoff=symbol_dir/f'{symbol}_1Min.mm_admission.csv'
              serial=frame.copy()
              serial['timestamp']=pd.to_datetime(serial['timestamp'],utc=True).map(lambda x:x.isoformat())
              serial.to_csv(handoff,index=False,lineterminator='\n')
              digest=hashlib.sha256(handoff.read_bytes()).hexdigest()
              lineage=json.loads(lineage_path.read_text())
              parent_sha=str(lineage.get('source_sha256') or '')
              lineage.update({
                  'schema':'public_research.hfdl_e1_mm_admission_lineage.v1',
                  'source_sha256':digest,
                  'normalized_parent_sha256':parent_sha,
                  'normalized_parent_format':'parquet',
                  'admission_transport_format':'csv',
                  'admission_transport_derivation':'deterministic OHLCV CSV serialization of normalized 1Min parquet',
              })
              handoff_lineage=symbol_dir/f'{symbol}_1Min.mm_admission.lineage.json'
              handoff_lineage.write_text(json.dumps(lineage,indent=2,sort_keys=True)+'\n')
              rows.append({
                  'symbol':symbol,
                  'source_csv':str(handoff),
                  'source_sha256':digest,
                  'lineage':str(handoff_lineage),
                  'normalized_parent_sha256':parent_sha,
              })
          Path('artifacts/hfdl-e1/mm_admission_handoffs.json').write_text(
              json.dumps({'schema':'public_research.hfdl_e1_mm_admission_handoffs.v1','rows':rows},indent=2,sort_keys=True)+'\n'
          )
          print('HFDL_E1_MM_HANDOFFS='+str(len(rows)))
          PY
      - name: Invoke MM admitted-stock canonical owner
        if: steps.authority.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          mm_root=Path(os.environ['MM_SOURCE_ROOT'])
          handoffs=json.loads(Path('artifacts/hfdl-e1/mm_admission_handoffs.json').read_text())['rows']
          receipts=Path('artifacts/hfdl-e1-mm/receipts')
          receipts.mkdir(parents=True,exist_ok=True)
          for row in handoffs:
              symbol=row['symbol']
              cmd=[
                  sys.executable,
                  str(mm_root/'scripts/operator/materialize_admitted_stock_source_canonical.py'),
                  '--source-csv',row['source_csv'],
                  '--source-lineage-json',row['lineage'],
                  '--expected-source-sha256',row['source_sha256'],
                  '--data-root','artifacts/hfdl-e1-mm/data',
                  '--symbol',symbol,
                  '--source-timeframe','1Min',
                  '--target-timeframe',os.environ['HFDL_E1_TARGET_TF'],
                  '--receipt-json',str(receipts/f'{symbol}.json'),
              ]
              subprocess.run(cmd,check=True,cwd=mm_root)
          print('HFDL_E1_MM_CANONICALIZATION=PASS')
          PY
      - name: Validate canonical MM receipts
        if: steps.authority.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipts=[]
          for symbol in [x for x in os.environ['HFDL_E1_SYMBOLS'].split(',') if x]:
              path=Path('artifacts/hfdl-e1-mm/receipts')/f'{symbol}.json'
              node=json.loads(path.read_text())
              if node.get('status') != 'PASS':
                  raise SystemExit(f'{symbol} canonical materialization not PASS')
              if node.get('source_timeframe') != '1Min' or node.get('target_timeframe') != os.environ['HFDL_E1_TARGET_TF']:
                  raise SystemExit(f'{symbol} canonical timeframe identity mismatch')
              if node.get('safety',{}).get('network_ib_calls') is not False:
                  raise SystemExit(f'{symbol} broker/network boundary violated')
              receipts.append({
                  'symbol':symbol,
                  'source_rows':node.get('source_rows'),
                  'canonical_rows':node.get('canonical_rows'),
                  'source_sha256':node.get('source_sha256'),
                  'features_sha256':node.get('features_sha256'),
                  'source_overlap_evidence':node.get('source_overlap_evidence'),
              })
          summary={
              'schema':'public_research.hfdl_e1_mm_canonicalization_summary.v1',
              'mm_source_sha':os.environ['MMIBKR_SOURCE_SHA'],
              'target_timeframe':os.environ['HFDL_E1_TARGET_TF'],
              'receipts':receipts,
              'broker_credentials_used':False,
              'live_trading_allowed':False,
          }
          Path('artifacts/hfdl-e1-mm/canonicalization_summary.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n'
          )
          print('HFDL_E1_MM_CANONICAL_RECEIPTS=PASS')
          PY
      - name: Emit typed acquisition state
        shell: bash
        env:
          AUTH_READY: ${{ steps.authority.outputs.ready }}
          AUTH_CLASS: ${{ steps.authority.outputs.classification }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('artifacts/hfdl-e1')
          coverage=json.loads((root/'coverage_receipt.json').read_text())
          acquisition_path=root/'acquisition_receipt.json'
          acquisition=json.loads(acquisition_path.read_text()) if acquisition_path.exists() else None
          result={
              'schema':'public_research.hfdl_e1_execution_summary.v1',
              'authority_classification':os.environ.get('AUTH_CLASS'),
              'authority_ready':os.environ.get('AUTH_READY') == '1',
              'public_coverage_symbols':[
                  {'symbol':row.get('symbol'),'status':row.get('status')}
                  for row in coverage.get('symbols',[])
              ],
              'acquisition_status':None if acquisition is None else acquisition.get('status'),
              'data_truly_unavailable_claimed':False,
              'broker_credentials_used':False,
              'live_trading_allowed':False,
          }
          (root/'execution_summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('HFDL_E1_EXECUTION_SUMMARY='+json.dumps(result,sort_keys=True))
          PY
      - name: Destroy one-run HFDL key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/hfdl-e1.key"
          echo 'HFDL_E1_PRIVATE_KEY_MATERIAL_DESTROYED=1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hfdl-e1-${{ github.run_id }}
          path: |
            artifacts/hfdl-e1/
            artifacts/hfdl-e1-mm/
          retention-days: 7
          if-no-files-found: error
