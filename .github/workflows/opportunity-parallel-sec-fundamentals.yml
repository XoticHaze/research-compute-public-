name: opportunity-parallel-sec-fundamentals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/opportunity_parallel_sec_fundamentals_20260907.py'
      - '.github/workflows/opportunity-parallel-sec-fundamentals.yml'

permissions:
  contents: read

jobs:
  opportunity-parallel-sec-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Compile batch
        run: python -m py_compile research/opportunity_parallel_sec_fundamentals_20260907.py
      - name: Execute chronology-causal parallel opportunity batch
        run: python research/opportunity_parallel_sec_fundamentals_20260907.py
      - name: Upload research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-parallel-sec-fundamentals-receipt
          path: opportunity-parallel-sec-fundamentals-receipt.json
          if-no-files-found: ignore
          retention-days: 7
