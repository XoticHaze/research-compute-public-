name: Atomic Capsule Publisher Smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_chunked_envelope_atomic_v1.py'
      - 'tests/test_atomic_capsule_publish_v1.py'
      - '.github/workflows/atomic-capsule-publisher-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Compile atomic publisher
        run: python -m py_compile scripts/publish_chunked_envelope_atomic_v1.py
      - name: Run deterministic publisher tests
        run: python -m unittest -v tests.test_atomic_capsule_publish_v1
