name: Reference Broker State Probe R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-broker-state-probe-r1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Probe live broker state
        shell: bash
        run: |
          set -euo pipefail
          health_url='https://reference-release-broker-v1.slenderiq.workers.dev/healthz'
          key_url='https://reference-release-broker-v1.slenderiq.workers.dev/v1/public-key'
          health_body="$RUNNER_TEMP/health.json"
          key_body="$RUNNER_TEMP/key.json"
          health_status="$(curl -sS -o "$health_body" -w '%{http_code}' "$health_url" || true)"
          key_status="$(curl -sS -o "$key_body" -w '%{http_code}' "$key_url" || true)"
          python - "$health_body" "$key_body" "$health_status" "$key_status" <<'PY' > "$RUNNER_TEMP/receipt.json"
          import json,sys,os
          health_path,key_path,health_status,key_status=sys.argv[1:]
          def load(path):
              try:
                  return json.load(open(path,encoding='utf-8'))
              except Exception:
                  return {}
          health=load(health_path)
          key=load(key_path)
          key_id=str(key.get('key_id') or '')
          receipt={
              'schema':'reference-broker-state-probe.r1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'health_http_status':int(health_status or 0),
              'health_ok':health.get('ok') is True,
              'public_key_http_status':int(key_status or 0),
              'broker_signer_configured':bool(key_status=='200' and key_id.startswith('sha256:') and len(key_id)==71),
              'broker_key_id':key_id if key_status=='200' else None,
              'mutation_performed':False,
              'secrets_included':False,
          }
          print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          PY
          cat "$RUNNER_TEMP/receipt.json"
      - name: Publish sanitized receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='rendezvous/receipts/reference-broker-state-probe-r1.json'
          payload="$(base64 -w0 "$RUNNER_TEMP/receipt.json")"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          existing_sha="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=main" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha",""))' || true)"
          python - "$payload" "$existing_sha" <<'PY' > "$RUNNER_TEMP/body.json"
          import json,sys
          content,sha=sys.argv[1:]
          body={'message':'receipt: reference broker state probe','content':content,'branch':'main'}
          if sha:
              body['sha']=sha
          print(json.dumps(body,separators=(',',':')))
          PY
          curl -fsSL -X PUT             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "$api"             -d @"$RUNNER_TEMP/body.json" >/dev/null
