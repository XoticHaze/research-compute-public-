name: Reference Broker State Probe R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-broker-state-probe-r1.yml'
      - 'cloudflare/reference-release-broker/src/index.js'
      - 'cloudflare/reference-release-broker/src/ticket.js'
      - 'cloudflare/reference-release-broker/src/intent.js'
      - 'cloudflare/reference-release-broker/wrangler.jsonc'
      - 'scripts/reference_broker_state_probe_receipt_v1.py'
      - 'tests/test_reference_broker_state_probe_receipt_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate non-secret broker observation classifications
        run: python tests/test_reference_broker_state_probe_receipt_v1.py
      - name: Probe live broker state
        shell: bash
        run: |
          set -euo pipefail
          health_url='https://reference-release-broker-v1.shared-compute-neutral-authorization.workers.dev/healthz'
          key_url='https://reference-release-broker-v1.shared-compute-neutral-authorization.workers.dev/v1/public-key'
          health_body="$RUNNER_TEMP/health.json"
          key_body="$RUNNER_TEMP/key.json"
          health_status="$(curl --max-time 15 --max-filesize 4096 -sS -o "$health_body" -w '%{http_code}' "$health_url" || true)"
          key_status="$(curl --max-time 15 --max-filesize 4096 -sS -o "$key_body" -w '%{http_code}' "$key_url" || true)"
          python scripts/reference_broker_state_probe_receipt_v1.py "$health_body" "$key_body" "$health_status" "$key_status" > "$RUNNER_TEMP/receipt.json"
          cat "$RUNNER_TEMP/receipt.json"
      - name: Publish sanitized receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='rendezvous/receipts/reference-broker-state-probe-r1.json'
          payload="$(base64 -w0 "$RUNNER_TEMP/receipt.json")"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          existing_sha="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=main" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha",""))' || true)"
          python - "$payload" "$existing_sha" <<'PY' > "$RUNNER_TEMP/body.json"
          import json,sys
          content,sha=sys.argv[1:]
          body={'message':'receipt: reference broker state probe','content':content,'branch':'main'}
          if sha:
              body['sha']=sha
          print(json.dumps(body,separators=(',',':')))
          PY
          curl -fsSL -X PUT             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "$api"             -d @"$RUNNER_TEMP/body.json" >/dev/null
