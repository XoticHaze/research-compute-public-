name: SMH NPORT Relay Transport R1
on:
  pull_request:
    paths:
      - '.github/workflows/smh-nport-relay-transport-r1.yml'
      - 'research/smh-nport-relay-transport-r1.json'
      - 'research/smh_nport_relay_transport_r1.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Probe relay transport for exact SEC N-PORT accessions
        run: python research/smh_nport_relay_transport_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smh-nport-relay-transport-r1-result
          path: smh-nport-relay-transport-r1-result.json
          retention-days: 14
