name: Opportunity Semiconductor Fundamental Cycle Allocator

on:
  pull_request:
    paths:
      - 'research/opportunity_semiconductor_fundamental_cycle_allocator_20260907.py'
      - '.github/workflows/opportunity-semiconductor-fundamental-cycle-allocator.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Restore exact prior SEC and causal-cycle artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_ARTIFACT_ID: '9980193167'
          CYCLE_ARTIFACT_ID: '9980128719'
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SEC_ARTIFACT_ID}/zip" -o /tmp/sec.zip
          unzip -q /tmp/sec.zip sec_hf_root_parquet_semiconductor_cache_20260906.json
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CYCLE_ARTIFACT_ID}/zip" -o /tmp/cycle.zip
          unzip -q /tmp/cycle.zip semiconductor_alfred_information_snapshot_cache_20260906.json
          test -s sec_hf_root_parquet_semiconductor_cache_20260906.json
          test -s semiconductor_alfred_information_snapshot_cache_20260906.json
      - name: Compile integrated batch
        run: python -m py_compile research/opportunity_semiconductor_fundamental_cycle_allocator_20260907.py
      - name: Execute ranking and capital-scaling consumer
        run: python research/opportunity_semiconductor_fundamental_cycle_allocator_20260907.py
      - name: Retain sanitized research receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opportunity-semiconductor-fundamental-cycle-allocator
          path: opportunity_semiconductor_fundamental_cycle_allocator_20260907.json
          retention-days: 30
          if-no-files-found: warn
