name: AVDV IDMO Coverage Valid Confirmation R2
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/avdv_idmo_coverage_valid_confirmation_r2.py'
      - '.github/workflows/avdv-idmo-coverage-valid-confirmation-r2.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: eval
        run: |
          python research/avdv_idmo_coverage_valid_confirmation_r2.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/avdv_idmo_coverage_valid_confirmation_r2.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avdv-idmo-coverage-valid-confirmation-r2__${{ steps.eval.outputs.tag }}
          path: research/artifacts/avdv_idmo_coverage_valid_confirmation_r2.json
          if-no-files-found: error
          retention-days: 90
