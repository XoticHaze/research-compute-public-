name: Refining Target-Free Mixture 20260906

on:
  push:
    branches:
      - research/refining-targetfree-mixture-20260906-r1
    paths:
      - research/refining_targetfree_mixture_20260906.py
      - .github/workflows/refining-targetfree-mixture-20260906.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install focused numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.8.0
      - name: Execute target-free state mixture experiment
        run: python research/refining_targetfree_mixture_20260906.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refining-targetfree-mixture-20260906
          path: refining-targetfree-mixture-20260906.json
          retention-days: 14
