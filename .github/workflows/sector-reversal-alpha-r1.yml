name: sector-reversal-alpha-r1
on:
  push:
    paths: ['.github/workflows/sector-reversal-alpha-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas numpy
      - name: Evaluate frozen cross-sector short-horizon reversal
        shell: python
        run: |
          import json, math
          import numpy as np
          import pandas as pd
          import yfinance as yf

          EXPERIMENT_ID='MR-SECTOR-REVERSAL-R1-20260914'
          TICKERS=['XLB','XLE','XLF','XLI','XLK','XLP','XLRE','XLU','XLV','XLY','XLC','SPY']
          START='2018-07-01'  # XLC availability fixes common-universe start before seeing this result
          LOOKBACK=21
          HOLDING=21
          K=3
          ROUNDTRIP_COST=0.0020
          RECENT_START='2022-01-01'

          px=yf.download(TICKERS,start=START,auto_adjust=True,progress=False)['Close'].dropna()
          sectors=[c for c in TICKERS if c!='SPY']
          r=px.pct_change().dropna()

          # Decision dates are every 21 common trading sessions. Signal uses only prior LOOKBACK closes.
          dates=list(px.index)
          records=[]
          for i in range(LOOKBACK, len(dates)-HOLDING, HOLDING):
              d=dates[i]
              end=dates[i+HOLDING]
              trailing=px.loc[d,sectors]/px.iloc[i-LOOKBACK][sectors]-1
              bottom=list(trailing.nsmallest(K).index)
              top=list(trailing.nlargest(K).index)
              fwd=px.loc[end,sectors]/px.loc[d,sectors]-1
              spy=float(px.loc[end,'SPY']/px.loc[d,'SPY']-1)
              ew=float(fwd.mean())
              rev=float(fwd[bottom].mean()-ROUNDTRIP_COST)
              mom=float(fwd[top].mean()-ROUNDTRIP_COST)
              records.append({'date':str(d.date()),'end':str(end.date()),'rev':rev,'mom':mom,'ew':ew,'spy':spy,'bottom':bottom,'top':top})

          q=pd.DataFrame(records)
          if len(q)<24:
              raise RuntimeError(f'insufficient periods: {len(q)}')

          def ann(x):
              x=np.asarray(x,dtype=float)
              return float(np.prod(1+x)**(252/(HOLDING*len(x)))-1)
          def maxdd(x):
              w=np.cumprod(1+np.asarray(x,dtype=float)); p=np.maximum.accumulate(w)
              return float(np.min(w/p-1))

          q['year']=pd.to_datetime(q.date).dt.year
          years=sorted(q.year.unique())
          year_rows=[]
          rev_wins_ew=rev_wins_spy=rev_beats_mom=0
          for y in years:
              z=q[q.year==y]
              rr=ann(z.rev); ee=ann(z.ew); ss=ann(z.spy); mm=ann(z.mom)
              if rr>ee: rev_wins_ew+=1
              if rr>ss: rev_wins_spy+=1
              if rr>mm: rev_beats_mom+=1
              year_rows.append({'year':int(y),'rev':rr,'ew':ee,'spy':ss,'mom':mm})

          recent=q[pd.to_datetime(q.date)>=RECENT_START]
          out={
              'experiment_id':EXPERIMENT_ID,
              'claim':'bottom-3 U.S. sector ETFs by prior 21-session return deliver durable after-cost reversal alpha over equal-weight sectors and SPY, while beating the opposite top-3 direction',
              'frozen':{'tickers':sectors,'start':START,'lookback_sessions':LOOKBACK,'holding_sessions':HOLDING,'k':K,'roundtrip_cost':ROUNDTRIP_COST,'recent_start':RECENT_START},
              'periods':int(len(q)),
              'years':int(len(years)),
              'rev_cagr':ann(q.rev),
              'ew_cagr':ann(q.ew),
              'spy_cagr':ann(q.spy),
              'top3_cagr':ann(q.mom),
              'rev_excess_vs_ew_pp':100*(ann(q.rev)-ann(q.ew)),
              'rev_excess_vs_spy_pp':100*(ann(q.rev)-ann(q.spy)),
              'rev_minus_top3_pp':100*(ann(q.rev)-ann(q.mom)),
              'recent_excess_vs_ew_pp':100*(ann(recent.rev)-ann(recent.ew)),
              'recent_excess_vs_spy_pp':100*(ann(recent.rev)-ann(recent.spy)),
              'calendar_wins_vs_ew':int(rev_wins_ew),
              'calendar_wins_vs_spy':int(rev_wins_spy),
              'calendar_beats_top3':int(rev_beats_mom),
              'max_drawdown_rev':maxdd(q.rev),
              'max_drawdown_ew':maxdd(q.ew),
              'max_drawdown_spy':maxdd(q.spy),
              'year_rows':year_rows
          }
          breadth_gate=math.ceil(0.6*len(years))
          out['promotion_gates']={
              'full_excess_vs_ew_gt_1pp':out['rev_excess_vs_ew_pp']>1.0,
              'full_excess_vs_spy_gt_0':out['rev_excess_vs_spy_pp']>0.0,
              'recent_excess_vs_ew_gt_0':out['recent_excess_vs_ew_pp']>0.0,
              'calendar_wins_vs_ew_ge_60pct':rev_wins_ew>=breadth_gate,
              'opposite_direction_control':out['rev_minus_top3_pp']>0.0
          }
          out['decision']='PROMOTE_MECHANISM_FOR_ORTHOGONAL_VALIDATION' if all(out['promotion_gates'].values()) else 'REJECT_NO_PARAMETER_RESCUE'
          print('RESULT_JSON='+json.dumps(out,sort_keys=True))
