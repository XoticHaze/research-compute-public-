name: P359 Multi-Strategy Liquid Alt R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p359_multistrategy_liquid_alt_r1.py'
      - '.github/workflows/p359-multistrategy-liquid-alt-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p359_multistrategy_liquid_alt_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p359-multistrategy-liquid-alt
          path: research/artifacts/p359_multistrategy_liquid_alt_r1.json
          if-no-files-found: error
          retention-days: 90
