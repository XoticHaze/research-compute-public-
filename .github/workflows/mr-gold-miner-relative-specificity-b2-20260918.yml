name: MR Gold Miner Relative Specificity B2 20260918

on:
  pull_request:
    paths:
      - 'research/mr_gold_miner_relative_specificity_b2_20260918.py'
      - '.github/workflows/mr-gold-miner-relative-specificity-b2-20260918.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet yfinance pandas
      - id: evaluate
        run: |
          python research/mr_gold_miner_relative_specificity_b2_20260918.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/mr_gold_miner_relative_specificity_b2_20260918.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-gold-miner-relative-specificity__${{ steps.evaluate.outputs.decision }}
          path: research/artifacts/mr_gold_miner_relative_specificity_b2_20260918.json
          if-no-files-found: error