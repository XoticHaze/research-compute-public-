name: IBKR Proof JIT Quote Patch

on:
  push:
    branches:
      - assistant/ibkr-proof-jit-quote-refresh-20260917
    paths:
      - '.github/workflows/ibkr-proof-jit-quote-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assistant/ibkr-proof-jit-quote-refresh-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Patch and validate canonical JIT quote refresh
        run: |
          set -euo pipefail
          python scripts/ibkr_proof_jit_quote_patch_tmp.py
          python -m py_compile \
            scripts/ibkr_remote_selected_runtime_paper_proof_v1.py \
            tests/test_ibkr_remote_selected_runtime_paper_proof_v1.py
          python -m unittest tests.test_ibkr_remote_selected_runtime_paper_proof_v1 -v
          echo 'IBKR_REMOTE_PROOF_JIT_QUOTE_VALID=1'
          echo 'IBKR_BROKER_LOGIN_ATTEMPTED=0'
          echo 'IBKR_BROKER_ORDER_ATTEMPTED=0'
          git config user.name 'Xotic Haze'
          git config user.email '152584286+XoticHaze@users.noreply.github.com'
          git add scripts/ibkr_remote_selected_runtime_paper_proof_v1.py tests/test_ibkr_remote_selected_runtime_paper_proof_v1.py
          git commit -m 'feat: refresh authorized LMT at canonical quote boundary'
          git push origin HEAD:assistant/ibkr-proof-jit-quote-refresh-20260917
