name: japan-fx-hedge-alpha-r1
on:
  push:
    paths: ['.github/workflows/japan-fx-hedge-alpha-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas numpy
      - name: Evaluate currency-hedged Japan versus unhedged Japan and broad US opportunity cost
        shell: python
        run: |
          import json,math,yfinance as yf,pandas as pd,numpy as np
          px=yf.download(['HEWJ','EWJ','SPY'],start='2015-01-01',auto_adjust=True,progress=False)['Close'].dropna(); r=px.pct_change().dropna(); cost=.001
          def ann(z): return float(np.prod(1+z)**(252/len(z))-1)
          wins=eligible=0
          for y in sorted(set(r.index.year)):
            h=r.loc[r.index.year==y,'HEWJ']; u=r.loc[r.index.year==y,'EWJ']
            if len(h)>100: eligible+=1; wins += ((1+h).prod()-1-cost > (1+u).prod()-1)
          recent=r.loc[r.index>='2022-01-01']; w=(1+r.HEWJ).cumprod()
          out={'fund':'HEWJ','after_cost_cagr':ann(r.HEWJ)-cost,'ewj_cagr':ann(r.EWJ),'spy_cagr':ann(r.SPY),'excess_vs_ewj_pp':100*(ann(r.HEWJ)-cost-ann(r.EWJ)),'opportunity_vs_spy_pp':100*(ann(r.HEWJ)-cost-ann(r.SPY)),'calendar_wins_vs_ewj':int(wins),'calendar_years':int(eligible),'recent_2022_plus_excess_vs_ewj_pp':100*(ann(recent.HEWJ)-cost-ann(recent.EWJ)),'max_drawdown':float((w/w.cummax()-1).min())}; out['pass']=bool(out['excess_vs_ewj_pp']>1 and wins>=math.ceil(.6*eligible) and out['recent_2022_plus_excess_vs_ewj_pp']>0); print('RESULT_JSON='+json.dumps(out,sort_keys=True))
