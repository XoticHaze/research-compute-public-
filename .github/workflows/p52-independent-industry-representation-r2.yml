name: P52 Independent Industry Representation R2
on:
  pull_request:
    paths:
      - 'research/p52_independent_industry_representation_r2.py'
      - '.github/workflows/p52-independent-industry-representation-r2.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p52_independent_industry_representation_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: p52-independent-industry-representation-r2
          path: artifacts/p52_independent_industry_representation_r2.json
          if-no-files-found: error
