name: P457 PIT Identity Gate R2
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p457_pit_identity_gate_r2.py'
      - '.github/workflows/p457-pit-identity-gate-r2.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas requests lxml beautifulsoup4 html5lib 'git+https://github.com/arielNacamulli/pitindex@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - id: result
        run: |
          python research/p457_pit_identity_gate_r2.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p457_pit_identity_gate_r2.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p457-pit-identity-gate-r2__${{ steps.result.outputs.tag }}
          path: research/artifacts/p457_pit_identity_gate_r2.json
          if-no-files-found: error
          retention-days: 90
