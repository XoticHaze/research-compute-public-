name: P36 Signal Permutation Null R1
on:
  pull_request:
    paths:
      - 'scripts/p36_signal_permutation_null_r1.py'
      - '.github/workflows/p36-signal-permutation-null-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        asset: [SOXX, XSD]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P36_ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - run: python scripts/p36_signal_permutation_null_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p36-${{ matrix.asset }}-signal-permutation-null-r1
          path: artifacts/p36_*_signal_permutation_null_r1.json
          if-no-files-found: error
