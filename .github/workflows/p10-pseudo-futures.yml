name: P10 Pseudo Futures Forecast
on:
  pull_request:
    paths:
      - 'research/compute_pseudo_futures_forecast.py'
      - 'research/p10-pseudo-futures-contract.json'
      - '.github/workflows/p10-pseudo-futures.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Execute frozen pseudo-futures forward discriminator
        run: |
          python research/compute_pseudo_futures_forecast.py \
            research/p10-pseudo-futures-contract.json \
            p10-pseudo-futures-result.json
      - name: Validate terminal result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('p10-pseudo-futures-result.json').read_text())
          assert r['schema']=='research_compute_public.p10_pseudo_futures_forecast.v1'
          assert r['research_only'] and not r['promotion_authority'] and not r['private_data_loaded']
          print('P10_PSEUDO_FUTURES_CLASSIFICATION='+r['classification'])
          print('P10_PSEUDO_FUTURES_COVERAGE='+json.dumps(r['coverage'],sort_keys=True))
          print('P10_PSEUDO_FUTURES_WINS='+json.dumps(r['supported_winning_horizons'],sort_keys=True))
          print('P10_PSEUDO_FUTURES_GATE='+json.dumps(r['generation_gate'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p10-pseudo-futures-result
          path: p10-pseudo-futures-result.json
          retention-days: 30
