name: P219 Midcap Baseline Transport R1
on:
  pull_request:
    paths:
      - 'research/p219_midcap_baseline_transport_r1.py'
      - '.github/workflows/p219-midcap-baseline-transport-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p219_midcap_baseline_transport_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p219_midcap_baseline_transport_r1.json')); a=x['tests']['2010']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__mdy_{bp(a['xmmo_minus_mdy'])}__fm_{a['positive_mdy_folds']}__spy_{bp(a['xmmo_minus_spy'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p219-midcap-baseline-transport__${{ steps.eval.outputs.tag }}
          path: artifacts/p219_midcap_baseline_transport_r1.json
          if-no-files-found: error
