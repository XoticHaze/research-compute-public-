name: Labor Claims Smallcap Relative R1
on:
  pull_request:
    paths:
      - 'research/labor_claims_smallcap_relative_r1.py'
      - 'research/contracts/labor_claims_smallcap_relative_r1.json'
      - '.github/workflows/labor-claims-smallcap-relative-r1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 pandas==2.2.3 yfinance==0.2.65
      - run: python research/labor_claims_smallcap_relative_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: labor-claims-smallcap-relative-r1
          path: artifacts/labor_claims_smallcap_relative_r1.json
          if-no-files-found: error
