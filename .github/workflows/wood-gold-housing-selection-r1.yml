name: WOOD Gold Housing Selection R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/wood_gold_housing_selection_r1.py'
      - '.github/workflows/wood-gold-housing-selection-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/wood_gold_housing_selection_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: wood-gold-housing-selection-r1-result
          path: artifacts/wood_gold_housing_selection_r1.json
          if-no-files-found: error
