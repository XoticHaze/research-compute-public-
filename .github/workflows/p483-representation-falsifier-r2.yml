name: P483 Representation Falsifier R2
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p483_representation_falsifier_r2.py'
      - '.github/workflows/p483-representation-falsifier-r2.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy requests lxml html5lib beautifulsoup4
      - id: result
        run: |
          python research/p483_representation_falsifier_r2.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p483_representation_falsifier_r2.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p483-representation-falsifier-r2__${{ steps.result.outputs.decision }}
          path: research/artifacts/p483_representation_falsifier_r2.json
          if-no-files-found: error
          retention-days: 90