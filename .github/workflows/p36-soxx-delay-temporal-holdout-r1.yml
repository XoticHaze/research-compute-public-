name: P36 SOXX Delay Temporal Holdout R1
on:
  pull_request:
    paths:
      - 'scripts/p36_soxx_delay_temporal_holdout_r1.py'
      - '.github/workflows/p36-soxx-delay-temporal-holdout-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - run: python scripts/p36_soxx_delay_temporal_holdout_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p36-soxx-delay-temporal-holdout-r1
          path: artifacts/p36_soxx_delay_temporal_holdout_r1.json
          if-no-files-found: error
