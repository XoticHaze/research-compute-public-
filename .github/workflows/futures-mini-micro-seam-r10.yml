name: Futures Mini Micro Seam Diagnostic R10
on:
  pull_request:
    paths:
      - 'research/futures_mini_micro_equivalence_r8.py'
      - 'research/futures_mini_micro_seam_r10.py'
      - '.github/workflows/futures-mini-micro-seam-r10.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==1.26.4 pandas==2.2.3
      - name: Diagnose mini/micro roll seams
        run: python research/futures_mini_micro_seam_r10.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: futures-mini-micro-seam-r10
          path: futures_mini_micro_seam_r10.json
          if-no-files-found: error
          retention-days: 90
