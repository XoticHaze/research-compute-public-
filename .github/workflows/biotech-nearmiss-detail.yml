name: Biotech Near-Miss Detail
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Materialize accepted adapter
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          python -m py_compile .campaign/runner.py
      - name: Evaluate frozen Biotech development result
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('runner','.campaign/runner.py')
          runner=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          contract=json.loads(Path('research/biotech-nearmiss-detail-contract.json').read_text())
          assert contract['external_holdouts_loaded'] is False
          result=runner._evaluate_matrix(contract['family'], contract['frozen_cutoff'])
          summary=result['family_summary']['biotech']
          assert summary['passing_symbols']==contract['expected_passing_symbols']
          detail=[row for row in result['per_symbol'] if row['family']=='biotech']
          output={'summary':summary,'per_symbol':detail,'external_holdouts_loaded':False,'research_only':True}
          Path('biotech-nearmiss-detail-receipt.json').write_text(json.dumps(output,sort_keys=True,indent=2))
          print(json.dumps(output,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: biotech-nearmiss-detail-receipt
          path: biotech-nearmiss-detail-receipt.json
          retention-days: 14
