name: A4 FINRA Short Interest Positions R1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/finra_short_interest_positions_r1.py'
      - '.github/workflows/a4-finra-short-interest-positions-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - name: Execute frozen consolidated-short-interest discriminator
        run: python research/finra_short_interest_positions_r1.py
      - name: Assert protected chronology and terminal receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/finra_short_interest_positions_r1.json'))
          assert x['schema']=='research.finra_short_interest_positions_r1.v1'
          assert x['source_lineage']['position_not_volume'] is True
          assert x['price_source']['2026_price_outcomes_used'] is False
          assert x['sample']['last_exit_date'] <= '2025-12-31'
          assert x['result']['decision'] in {'FINRA_SHORT_INTEREST_POSITIONS_R1_SUPPORTED','FINRA_SHORT_INTEREST_POSITIONS_R1_REJECTED'}
          print('A4_FINRA_SI_TERMINAL='+x['result']['decision'])
          print('A4_FINRA_SI_OBSERVATIONS='+str(x['result']['overall']['observations']))
          print('A4_FINRA_SI_SPREAD_BPS='+str(x['result']['overall']['mean_neutral_spread_net_bps']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a4-finra-short-interest-positions-r1-result
          path: artifacts/finra_short_interest_positions_r1.json
          if-no-files-found: error
          retention-days: 90
