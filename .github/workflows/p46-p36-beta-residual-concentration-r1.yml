name: P46 P36 Beta Residual Concentration R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_beta_residual_concentration_r1.py'
      - '.github/workflows/p46-p36-beta-residual-concentration-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_beta_residual_concentration_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_beta_residual_concentration_r1.json')); vals={'decision':x['decision'],'f5':f"{100*x['tests']['full']['cases']['5']['annualized_intercept']:.2f}",'r3':f"{100*x['tests']['2022_forward']['cases']['3']['annualized_intercept']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta-residual-conc__${{ steps.evaluate.outputs.decision }}__full5_${{ steps.evaluate.outputs.f5 }}pct__recent3_${{ steps.evaluate.outputs.r3 }}pct
          path: artifacts/p46_p36_beta_residual_concentration_r1.json
          if-no-files-found: error
