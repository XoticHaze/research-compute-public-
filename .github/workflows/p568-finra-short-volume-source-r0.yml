name: P568 FINRA Short Volume Source R0

on:
  pull_request:
    paths:
      - 'research/p568_finra_short_volume_source_r0.py'
      - '.github/workflows/p568-finra-short-volume-source-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python research/p568_finra_short_volume_source_r0.py
      - uses: actions/upload-artifact@v4
        with:
          name: p568-finra-short-volume-source-r0
          path: artifacts/p568_finra_short_volume_source_r0.json
          if-no-files-found: error
