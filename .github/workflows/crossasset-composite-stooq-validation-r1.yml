name: Cross-Asset Composite Stooq Validation R1
on:
  pull_request:
    paths:
      - 'research/crossasset_composite_stooq_validation_r1.py'
      - '.github/workflows/crossasset-composite-stooq-validation-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/crossasset_composite_stooq_validation_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: crossasset-composite-stooq-validation-r1
          path: artifacts/crossasset_composite_stooq_validation.json
          if-no-files-found: error
          retention-days: 30
