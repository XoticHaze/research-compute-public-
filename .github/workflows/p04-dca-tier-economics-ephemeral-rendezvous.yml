name: P04 DCA Tier Economics Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/p04-dca-tier-economics-*.txt'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography pandas
      - name: Compile fixed transport and consumer
        run: |
          python -m py_compile scripts/ephemeral_x25519_chunked_v1.py
          python -m py_compile scripts/p04_dca_tier_economics_consumer_v1.py
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate(); public=private.public_key()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=public.public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'p04-tier-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={'schema':'p04-dca-tier-economics-recipient-v1','run_id':os.environ['GITHUB_RUN_ID'],'recipient_b64':base64.b64encode(public_raw).decode('ascii'),'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest()}
          Path(os.environ['RUNNER_TEMP'],'p04-tier-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('P04_DCA_TIER_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('P04_DCA_TIER_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY
      - name: Publish public recipient to exchange branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-p04-dca-tier-economics.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/p04-tier-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish one-run P04 DCA tier recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" -d "$body" >/dev/null
      - name: Wait for run-bound chunked envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_root="${RESPONSE_ROOT}/${GITHUB_RUN_ID}"
          envelope_path="${response_root}/p04-dca-tier-economics-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${envelope_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/p04-tier-envelope.json"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound P04 DCA tier envelope did not arrive'; exit 42; }
          echo "P04_TIER_RESPONSE_ROOT=${response_root}" >> "$GITHUB_ENV"
      - name: Reassemble authenticated ciphertext chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          env=json.loads(Path(os.environ['RUNNER_TEMP'],'p04-tier-envelope.json').read_text()); chunks=env.get('chunks')
          if not isinstance(chunks,list) or not chunks or len(chunks)>64: raise SystemExit('invalid chunk list')
          prefix=f"rendezvous/responses/{os.environ['GITHUB_RUN_ID']}/"; pieces=[]; seen=set()
          for node in chunks:
            if set(node)!={'path','sha256','chars'}: raise SystemExit('invalid chunk descriptor fields')
            path=str(node['path'])
            if not path.startswith(prefix) or path in seen or '..' in path.split('/'): raise SystemExit('invalid chunk path')
            seen.add(path); url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref={os.environ['EXCHANGE_REF']}"
            req=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'}); raw=urlopen(req,timeout=30).read()
            if len(raw)!=int(node['chars']) or hashlib.sha256(raw).hexdigest()!=node['sha256']: raise SystemExit('chunk identity mismatch')
            pieces.append(raw.decode('ascii'))
          ciphertext=base64.b64decode(''.join(pieces).encode('ascii'),validate=True)
          if hashlib.sha256(ciphertext).hexdigest()!=env.get('ciphertext_sha256'): raise SystemExit('assembled ciphertext digest mismatch')
          Path(os.environ['RUNNER_TEMP'],'p04-tier-ciphertext.bin').write_bytes(ciphertext)
          PY
      - name: Decrypt privately and execute fixed P04 tier consumer
        run: |
          set -euo pipefail
          python scripts/p04_dca_tier_economics_consumer_v1.py --envelope "$RUNNER_TEMP/p04-tier-envelope.json" --ciphertext "$RUNNER_TEMP/p04-tier-ciphertext.bin" --private-key "$RUNNER_TEMP/p04-tier-private.b64" --run-id "$GITHUB_RUN_ID" --response-root "$P04_TIER_RESPONSE_ROOT" | tee "$RUNNER_TEMP/p04-tier-receipt.log"
          grep '^P04_DCA_TIER_ECONOMICS_RECEIPT=' "$RUNNER_TEMP/p04-tier-receipt.log" > "$RUNNER_TEMP/p04-tier-sanitized-receipt.txt"
      - name: Upload sanitized deterministic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p04-dca-tier-economics-sanitized-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/p04-tier-sanitized-receipt.txt
          retention-days: 7
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/p04-tier-private.b64" "$RUNNER_TEMP/p04-tier-recipient.json" "$RUNNER_TEMP/p04-tier-envelope.json" "$RUNNER_TEMP/p04-tier-ciphertext.bin" "$RUNNER_TEMP/p04-tier-receipt.log" "$RUNNER_TEMP/p04-tier-sanitized-receipt.txt"
