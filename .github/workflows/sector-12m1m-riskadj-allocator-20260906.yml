name: Sector 12m1m Risk-Adjusted Allocator

on:
  pull_request:
    paths:
      - "research/sector_12m1m_riskadj_allocator_20260906.py"
      - ".github/workflows/sector-12m1m-riskadj-allocator-20260906.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Execute matched-baseline allocator discriminator
        run: |
          python -m py_compile research/sector_12m1m_riskadj_allocator_20260906.py
          python research/sector_12m1m_riskadj_allocator_20260906.py
          python -m json.tool sector-12m1m-riskadj-allocator-receipt.json >/dev/null
          cat sector-12m1m-riskadj-allocator-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain deterministic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sector-12m1m-riskadj-allocator-receipt
          path: sector-12m1m-riskadj-allocator-receipt.json
          retention-days: 30
          if-no-files-found: error
