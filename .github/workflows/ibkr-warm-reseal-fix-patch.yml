name: IBKR Warm Reseal Fix Patch

on:
  push:
    branches:
      - assistant/ibkr-paper-proof-warm-reseal-fix-20260917
    paths:
      - '.github/workflows/ibkr-warm-reseal-fix-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assistant/ibkr-paper-proof-warm-reseal-fix-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Apply and validate warm reseal fix
        run: |
          set -euo pipefail
          python scripts/ibkr_warm_reseal_fix_patch_tmp.py
          python -m py_compile tests/test_ibkr_b1_warm_state_workflow_v2.py
          python -m unittest tests.test_ibkr_b1_warm_state_workflow_v2 -v
          git config user.name 'Xotic Haze'
          git config user.email '152584286+XoticHaze@users.noreply.github.com'
          git add .github/workflows/ibkr-cloudflare-readonly-b1-r1.yml tests/test_ibkr_b1_warm_state_workflow_v2.py docs/IBKR_WARM_PAPER_PROOF_ACTIVATION_20260917.md
          git commit -m 'fix: preserve warm reseal after paper proof failure'
          git push origin HEAD:assistant/ibkr-paper-proof-warm-reseal-fix-20260917
