name: IBKR Warm Reseal Fix Validate

on:
  push:
    branches:
      - assistant/ibkr-paper-proof-warm-reseal-fix-20260917
    paths:
      - '.github/workflows/ibkr-warm-reseal-fix-patch.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assistant/ibkr-paper-proof-warm-reseal-fix-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Validate warm lifecycle and proof contracts without broker access
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==46.0.1'
          python -m py_compile \
            scripts/ibkr_remote_selected_runtime_command_capsule_v2.py \
            scripts/ibkr_remote_selected_runtime_paper_proof_v1.py \
            scripts/ibkr_remote_selected_runtime_paper_proof_v2.py \
            scripts/ibkr_remote_paper_proof_return_v1.py \
            scripts/ibkr_warm_selected_runtime_activation_v1.py \
            tests/test_ibkr_b1_warm_state_workflow_v2.py \
            tests/test_ibkr_remote_selected_runtime_command_capsule_v2.py \
            tests/test_ibkr_remote_selected_runtime_paper_proof_v1.py \
            tests/test_ibkr_remote_selected_runtime_paper_proof_v2.py \
            tests/test_ibkr_remote_paper_proof_return_v1.py \
            tests/test_ibkr_warm_selected_runtime_activation_v1.py
          python -m unittest \
            tests.test_ibkr_b1_warm_state_workflow_v2 \
            tests.test_ibkr_remote_selected_runtime_command_capsule_v2 \
            tests.test_ibkr_remote_selected_runtime_paper_proof_v1 \
            tests.test_ibkr_remote_selected_runtime_paper_proof_v2 \
            tests.test_ibkr_remote_paper_proof_return_v1 \
            tests.test_ibkr_warm_selected_runtime_activation_v1 -v
          echo 'IBKR_WARM_RESEAL_FIX_VALID=1'
          echo 'IBKR_BROKER_LOGIN_ATTEMPTED=0'
          echo 'IBKR_BROKER_ORDER_ATTEMPTED=0'
