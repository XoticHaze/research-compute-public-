name: P490 Preferred Hybrid Income Alpha R1
on:
  pull_request:
    paths:
      - 'research/p490_preferred_hybrid_income_alpha_r1.py'
      - '.github/workflows/p490-preferred-hybrid-income-alpha-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: evaluate
        run: |
          python research/p490_preferred_hybrid_income_alpha_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p490_preferred_hybrid_income_alpha_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p490-preferred-hybrid-income-alpha__${{ steps.evaluate.outputs.decision }}
          path: research/artifacts/p490_preferred_hybrid_income_alpha_r1.json
          if-no-files-found: error
