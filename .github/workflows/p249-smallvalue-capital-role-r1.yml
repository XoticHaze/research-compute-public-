name: P249 Small Value Capital Role R1
on:
  pull_request:
    branches: [assistant/market-research-p248-smallvalue-survivor-complementarity-r1]
    paths:
      - 'research/p249_smallvalue_capital_role_r1.py'
      - '.github/workflows/p249-smallvalue-capital-role-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p249_smallvalue_capital_role_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p249_smallvalue_capital_role_r1.json')); a=x['tests']['2020']; r=a['smallvalue_removal_impact']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__matched_{bp(a['matched_excess_cagr'])}__remove_{bp(r['cagr_delta'])}__sharpe_{r['sharpe_delta']:.2f}__folds_{a['positive_matched_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p249-smallvalue-capital-role__${{ steps.eval.outputs.tag }}
          path: artifacts/p249_smallvalue_capital_role_r1.json
          if-no-files-found: error
