name: P46 P36 Beta Residual Sleeves R1
on:
  pull_request:
    paths:
      - 'research/p46_p36_beta_residual_sleeves_r1.py'
      - '.github/workflows/p46-p36-beta-residual-sleeves-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p46_p36_beta_residual_sleeves_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p46_p36_beta_residual_sleeves_r1.json')); f=x['tests']['full']; r=x['tests']['2022_forward']; vals={'decision':x['decision'],'p46':f"{100*f['P46']['annualized_intercept']:.2f}",'p36':f"{100*f['P36']['annualized_intercept']:.2f}",'r46':f"{100*r['P46']['annualized_intercept']:.2f}",'r36':f"{100*r['P36']['annualized_intercept']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta-residual-sleeves__${{ steps.evaluate.outputs.decision }}__fullP46_${{ steps.evaluate.outputs.p46 }}pct__fullP36_${{ steps.evaluate.outputs.p36 }}pct__recentP46_${{ steps.evaluate.outputs.r46 }}pct__recentP36_${{ steps.evaluate.outputs.r36 }}pct
          path: artifacts/p46_p36_beta_residual_sleeves_r1.json
          if-no-files-found: error
