name: Homebuilder PIT Valuation Economic R1
on:
  push:
    branches: ['market-research/homebuilder-pit-valuation-source-r1-20260913']
    paths:
      - 'research/homebuilder_pit_valuation_economic_r1.py'
      - '.github/workflows/homebuilder-pit-valuation-economic-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Provenance
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "experiment_id=HOMEBUILDER-PIT-VALUATION-ECONOMIC-R1"
          echo "inherits=SLP-20260913-HOMEBUILDER-PIT-VALUATION-SOURCE-R3"
      - run: python -m py_compile research/homebuilder_pit_valuation_source_probe_r2.py research/homebuilder_pit_valuation_source_probe_r3.py research/homebuilder_pit_valuation_economic_r1.py
      - name: Execute frozen valuation economics
        run: python research/homebuilder_pit_valuation_economic_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homebuilder-pit-valuation-economic-r1-result
          path: research/results/homebuilder_pit_valuation_economic_r1.json
          if-no-files-found: error
          retention-days: 30
