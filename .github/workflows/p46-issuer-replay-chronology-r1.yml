name: P46 Issuer Replay Chronology R1
on:
  pull_request:
    paths:
      - 'research/p46_issuer_replay_chronology_r1.py'
      - '.github/workflows/p46-issuer-replay-chronology-r1.yml'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - run: python research/p46_issuer_replay_chronology_r1.py
      - name: Persist result on execution branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/p46_issuer_replay_chronology_r1.json
          git commit -m 'research: persist P46 issuer replay chronology result'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
