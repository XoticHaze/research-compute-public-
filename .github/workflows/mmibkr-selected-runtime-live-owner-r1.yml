      - name: Restore existing encrypted live Gateway warm state (admission only)
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode != 'producer' && inputs.warm_handoff_mode != 'supervised_5h' && inputs.warm_handoff_mode != 'gateway_pool_5h' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MMIBKR_LIVE_GATEWAY_WARM_KEY_B64: ${{ secrets.MMIBKR_LIVE_GATEWAY_WARM_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          # Independent high-entropy key is mandatory even on first bootstrap;
          # never reuse brokerage password as a public-artifact key.
          python - <<'PY'
          import os,sys
          sys.path.insert(0,"scripts")
          from mmibkr_live_gateway_state_envelope_v1 import read_master
          read_master()
          print("LIVE_WARM_INDEPENDENT_KEY_CONFIGURED=1")
          PY
          name="mmibkr-live-gateway-state-v1"
          if [ "${{ inputs.warm_handoff_mode }}" = successor ]; then
            predecessor_run="${{ inputs.warm_predecessor_run }}"
            aid="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$predecessor_run/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "mmibkr-live-gateway-state-v1" and .expired == false)] | .[0].id // empty')"
            [ -n "$aid" ] || { echo "EXACT_WARM_PRODUCER_ARTIFACT_MISSING=1"; exit 1; }
            echo "MMIBKR_EXACT_WARM_PRODUCER_REQUIRED=$predecessor_run"
          else
            aid="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [ -z "$aid" ]; then
              echo "LIVE_WARM_STATE_BOOTSTRAP=COLD_NO_PRIOR_SNAPSHOT"
              echo "MMIBKR_LIVE_WARM_STATE_RESTORED=0" >> "$GITHUB_ENV"
              exit 0
            fi
            predecessor_run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid" --jq '.workflow_run.id')"
          fi
          dir="$RUNNER_TEMP/live-warm-import"
          mkdir -p "$dir"
          [[ "$predecessor_run" =~ ^[0-9]+$ && "$predecessor_run" != "$GITHUB_RUN_ID" ]]
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$predecessor_run" --jq '(.path == ".github/workflows/mmibkr-selected-runtime-live-owner-r1.yml") and (.event == "workflow_dispatch") and (.head_branch == "main") and (.conclusion == "success")' | grep -qx true
          echo "MMIBKR_AUTHORIZED_PREDECESSOR_RUN=$predecessor_run"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "$dir/state.zip"
          unzip -j -o "$dir/state.zip" "state.enc" "manifest.json" -d "$dir" >/dev/null
          python - "$dir/manifest.json" "$predecessor_run" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fh: manifest=json.load(fh)
          assert manifest["context"]["run_id"] == sys.argv[2], "warm-state predecessor id mismatch"
          PY
          python scripts/mmibkr_live_gateway_state_envelope_v1.py unseal             --envelope "$dir/state.enc" --manifest "$dir/manifest.json"             --current-run-id "$GITHUB_RUN_ID"             --output-archive "$dir/restore.tgz"
          # Restore into a distinct native seed, never overlay live TWS settings.
          vol="mmibkr-live-warm-$GITHUB_RUN_ID"
          docker volume create "$vol" >/dev/null
          gateway_uid="$(docker run --rm --entrypoint /usr/bin/id "$IBKR_CONTROLLER_IMAGE" -u)"
          gateway_gid="$(docker run --rm --entrypoint /usr/bin/id "$IBKR_CONTROLLER_IMAGE" -g)"
          [[ "$gateway_uid" =~ ^[0-9]+$ && "$gateway_gid" =~ ^[0-9]+$ ]]
          docker run --rm --network none --user 0:0 -e GATEWAY_UID="$gateway_uid" -e GATEWAY_GID="$gateway_gid" -v "$vol:/seed" -v "$dir:/import:ro" alpine:3.22 sh -ec 'tar -xzf /import/restore.tgz -C /seed; chown -R "$GATEWAY_UID:$GATEWAY_GID" /seed; chmod -R u+rwX,go-rwx /seed'
          docker run --rm --network none --user "$gateway_uid:$gateway_gid" --entrypoint /bin/sh -v "$vol:/home/ibgateway/warm-state:ro" "$IBKR_CONTROLLER_IMAGE" -ec 'p="$(find /home/ibgateway/warm-state -type f -print -quit)"; test -n "$p" && test -r "$p"; dd if="$p" of=/dev/null bs=4096 count=1 2>/dev/null'
          echo "MMIBKR_CONTROLLER_NATIVE_LIVE_WARM_SEED_READABLE=1"
          rm -rf "$dir"
          echo "MMIBKR_LIVE_WARM_STATE_RESTORED=1" >> "$GITHUB_ENV"
          echo "MMIBKR_LIVE_STATE_BROKER_AUTH_RECHECK_REQUIRED=1"

      - name: Start the established IBKR controller in writable live mode on host 4001
        run: |
          set -euo pipefail
          controller_image="$IBKR_CONTROLLER_IMAGE"
          if [ "${{ inputs.admission_only }}" = false ] ||
             { [ "${{ inputs.admission_only }}" = true ] &&
               { [ "${{ inputs.warm_handoff_mode }}" = supervised_5h ] ||
                 [ "${{ inputs.warm_handoff_mode }}" = gateway_pool_5h ]; }; }; then
            # Reuse the existing CI-verified v0.16.2 recovery release for live,
            # supervised, and no-order split Gateway pool; no new login path.
            controller_image='ghcr.io/code-hustler-ft3d/ibg-controller@sha256:2e4f4911991386e941f6e95d58ee38a8242474dd3be239f21ad82557d24b4368'
          fi
          docker pull "$controller_image" >/dev/null
          if [ "${{ inputs.admission_only }}" = false ] ||
             { [ "${{ inputs.admission_only }}" = true ] &&
               { [ "${{ inputs.warm_handoff_mode }}" = supervised_5h ] ||
                 [ "${{ inputs.warm_handoff_mode }}" = gateway_pool_5h ]; }; }; then
            controller_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$controller_image")"
            test "$controller_version" = v0.16.2
            echo 'MMIBKR_SUPERVISED_CONTROLLER_UPGRADE_V0_16_2_VERIFIED=1'
            if [ "${{ inputs.warm_handoff_mode }}" = gateway_pool_5h ]; then
              echo 'MMIBKR_READONLY_GATEWAY_POOL_CONTROLLER_V0_16_2_VERIFIED=1'
            fi
          fi
          vol="mmibkr-live-jts-$GITHUB_RUN_ID"
          docker volume create "$vol" >/dev/null
          docker run --rm --user 0 --entrypoint /bin/sh \
            -v "$vol:/state" "$controller_image" -lc 'chmod 0777 /state' >/dev/null
          warm_args=()
          if [ "${MMIBKR_LIVE_WARM_STATE_RESTORED:-0}" = 1 ]; then
            warm_args=(-e GATEWAY_WARM_STATE=/home/ibgateway/warm-state
                       -v "mmibkr-live-warm-$GITHUB_RUN_ID:/home/ibgateway/warm-state:ro")
          fi
          read_only_api=no
          twofa_exit_interval=120
          relogin_after_twofa_timeout=yes
          supervised_recovery_args=()
          if [ "${{ inputs.admission_only }}" = false ]; then
            twofa_exit_interval=300
            relogin_after_twofa_timeout=no
            supervised_recovery_args=(-e AUTO_RESTART_ADOPT=yes
                                      -e CCP_MAINTENANCE_RECOVERY_DELAY_SECONDS=480 \
                                      -e UPSTREAM_RELAUNCH=yes)
            echo 'MMIBKR_LIVE_RECOVERY_CONTROLLER_ENABLED=1'
            echo 'MMIBKR_LIVE_ATTENDED_UPSTREAM_RELAUNCH_ENABLED=1'
          fi
          if [ "${{ inputs.admission_only }}" = true ] && [ "${{ inputs.warm_handoff_mode }}" = supervised_5h ]; then
            read_only_api=yes
            # Attended approval: give a single challenge adequate time.
            # Suppress an automatic second login (which can cause a new push).
            # Fail closed on timeout, never bypass 2FA or authorize orders.
            twofa_exit_interval=300
            relogin_after_twofa_timeout=no
            # Keep the existing Gateway-internal restart/adoption logic active.
            # Native v0.16.2 maintenance re-auth intentionally waits 480s.
            supervised_recovery_args=(-e AUTO_RESTART_ADOPT=yes
                                      -e CCP_MAINTENANCE_RECOVERY_DELAY_SECONDS=480)
            echo 'MMIBKR_SUPERVISED_MAINTENANCE_BACKOFF_SECONDS=480'
            echo 'MMIBKR_SUPERVISED_AUTO_RESTART_ADOPT=1'
            echo 'MMIBKR_SUPERVISED_GATEWAY_API_READONLY=1'
            echo 'MMIBKR_SUPERVISED_2FA_APPROVAL_WINDOW_SECONDS=300'
            echo 'MMIBKR_SUPERVISED_AUTOMATIC_2FA_RELOGIN=0'
          fi
          if [ "${{ inputs.admission_only }}" = true ] && [ "${{ inputs.warm_handoff_mode }}" = gateway_pool_5h ]; then
            # Standby API must be broker-enforced read-only: different client
            # IDs are not a privilege boundary. No canon bot here.
            read_only_api=yes
            twofa_exit_interval=300
            relogin_after_twofa_timeout=no
            supervised_recovery_args=(-e AUTO_RESTART_ADOPT=yes
                                      -e CCP_MAINTENANCE_RECOVERY_DELAY_SECONDS=480)
            echo 'MMIBKR_SPLIT_GATEWAY_POOL_API_READ_ONLY=1'
            echo 'MMIBKR_SPLIT_GATEWAY_POOL_AUTO_RELOGIN=0'
          fi
          docker run -d --name mmibkr-live-gateway \
            --env-file "$RUNNER_TEMP/mmibkr-live-gateway.env" \
            -e USE_IBG_CONTROLLER=yes \
            -e TRADING_MODE=live \
            -e READ_ONLY_API="$read_only_api" \
            -e TWOFA_TIMEOUT_ACTION=exit \
            -e TWOFA_EXIT_INTERVAL="$twofa_exit_interval" \
            -e RELOGIN_AFTER_TWOFA_TIMEOUT="$relogin_after_twofa_timeout" \
            -e CONTROLLER_HEALTH_SERVER_PORT=8080 \
            -e TWS_SETTINGS_PATH=/home/ibgateway/Jts_b1 \
            -e TIME_ZONE=America/Chicago \
            "${supervised_recovery_args[@]}" \
            "${warm_args[@]}" \
            -v "$vol:/home/ibgateway/Jts_b1" \
            -p 127.0.0.1:4001:4003 \
            "$controller_image" >/dev/null
          docker exec mmibkr-live-gateway /bin/sh -lc \
            'test "$READ_ONLY_API" = "${{ inputs.admission_only && (inputs.warm_handoff_mode == 'supervised_5h' || inputs.warm_handoff_mode == 'gateway_pool_5h') && 'yes' || 'no' }}" && test "$TRADING_MODE" = live' 
          # Exact network proof. The only published socket is loopback TWS
          # 4001:4003. Bot joins the Gateway namespace with no published
          # control/API 8001 port and no public HTTP ingress.
          docker inspect -f '{{json .HostConfig.PortBindings}}' mmibkr-live-gateway |
            python -c "import json,sys; p=json.load(sys.stdin); assert set(p)=={'4003/tcp'},p; r=p['4003/tcp']; assert len(r)==1 and r[0]['HostIp']=='127.0.0.1' and r[0]['HostPort']=='4001',p; print('HEADLESS_LIVE_PRIVATE_NETWORK_ATTESTED=1')"
          echo 'WRITABLE_LIVE_GATEWAY_STARTED=1'
          if [ "${{ inputs.admission_only }}" = true ] && [ "${{ inputs.warm_handoff_mode }}" = gateway_pool_5h ]; then
            docker stats --no-stream --format 'MMIBKR_POOL_GATEWAY_START_MEM={{.MemUsage}} CPU={{.CPUPerc}} NET_IO={{.NetIO}} PIDS={{.PIDs}}' mmibkr-live-gateway || echo 'MMIBKR_POOL_GATEWAY_START_STATS_UNAVAILABLE=1'
          fi

      - name: Bind and reconcile the expected existing production account without order mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,logging
          from pathlib import Path
          from scripts.mmibkr_public_broker_log_guard_v1 import install; install()
          from ib_insync import IB
          # ib_insync may log raw broker account IDs on sync timeout.
          # Only sanitized fixed-field markers may enter public Actions logs.
          logging.disable(logging.CRITICAL)
          p=Path(os.environ['RUNNER_TEMP'])/'mmibkr-live-bot.env'
          expected=p.read_text().strip().split('=',1)[1]
          deadline=time.monotonic()+900
          authenticated=False
          while time.monotonic()<deadline:
              ib=IB()
              try:
                  ib.connect('127.0.0.1',4001,clientId=78,timeout=5,readonly=True)
                  accounts=ib.managedAccounts()
                  if expected not in accounts: raise RuntimeError('expected_live_account_not_managed')
                  ib.reqAccountSummary()
                  ib.reqPositions()
                  ib.reqAllOpenOrders()
                  ib.reqExecutions()
                  print('PRODUCTION_LIVE_EXECUTION_HISTORY_READ=1')
                  authenticated=True
                  print('PRODUCTION_LIVE_EXPECTED_ACCOUNT_READ=1')
                  print('PRODUCTION_LIVE_POSITIONS_AND_ORDERS_READ=1')
                  break
              except RuntimeError: raise
              except Exception: time.sleep(5)
              finally:
                  if ib.isConnected(): ib.disconnect()
          if not authenticated: raise SystemExit('live_gateway_authenticated_account_read_failed')
          PY

      - name: Open Gateway's read-only API to permitted ephemeral tailnet clients
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode == 'gateway_pool_5h' && inputs.pool_transport == 'tailscale' }}
        run: |
          set -euo pipefail
          docker exec mmibkr-live-gateway /bin/sh -lc 'test "$READ_ONLY_API" = yes'
          TS_IP="$(tailscale ip -4 | head -n 1)"
          python - "$TS_IP" <<'PY'
          import sys
          from scripts.mmibkr_split_gateway_tcp_relay_v1 import validate_tailnet_ip
          assert validate_tailnet_ip(sys.argv[1]) == sys.argv[1]
          print("MMIBKR_SPLIT_GATEWAY_VERIFIED_PRIVATE_TAILNET_ADDRESS=1")
          PY
          nohup python -m scripts.mmibkr_split_gateway_tcp_relay_v1 \
            --private-ip "$TS_IP" --port 4001 \
            > "$RUNNER_TEMP/mmibkr-gateway-relay.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/mmibkr-gateway-relay.pid"
          for attempt in $(seq 1 20); do
            if grep -q 'MMIBKR_SPLIT_GATEWAY_PRIVATE_RELAY_ACTIVE=1' \
                  "$RUNNER_TEMP/mmibkr-gateway-relay.log"; then break; fi
            sleep 1
          done
          grep -qx 'MMIBKR_SPLIT_GATEWAY_PRIVATE_RELAY_ACTIVE=1' \
            "$RUNNER_TEMP/mmibkr-gateway-relay.log"
          echo "MMIBKR_SPLIT_GATEWAY_READER_ENDPOINT=mmibkr-gw-$GITHUB_RUN_ID:4001"
          echo 'MMIBKR_SPLIT_GATEWAY_BROKER_MUTATION=DISABLED'

      - name: Hold one authenticated read-only Gateway for independent GitHub compute jobs
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode == 'gateway_pool_5h' }}
        env:
          POOL_TRANSPORT: ${{ inputs.pool_transport }}
          GH_TOKEN: ${{ github.token }}
          POOL_SESSION_MINUTES: ${{ inputs.pool_session_minutes }}
        timeout-minutes: 290
        run: |
          set -euo pipefail
          # Same authenticated production owner and A/B consumers for short
          # acceptance (15m) or the original long continuity (280m).
          case "$POOL_SESSION_MINUTES" in 15|280) ;; *) echo 'MMIBKR_POOL_DURATION_INVALID=1'; exit 64 ;; esac
          start="$(date +%s)"
          end="$((start + POOL_SESSION_MINUTES * 60))"
          pool_resource_sample() {
            local phase="$1"
            local elapsed="$(( $(date +%s) - start ))"
            # Safe totals only; no account, order or credential payloads.
            docker stats --no-stream --format "MMIBKR_POOL_GATEWAY_RESOURCES_PHASE=${phase} ELAPSED_SECONDS=${elapsed} MEM={{.MemUsage}} CPU={{.CPUPerc}} NET_IO={{.NetIO}} PIDS={{.PIDs}}" mmibkr-live-gateway || echo 'MMIBKR_POOL_GATEWAY_STATS_UNAVAILABLE=1'
          }
          outage_since=0
          ready=0
          owner_probe_sample=0
          if [ "$POOL_TRANSPORT" = tailscale ]; then
            relay_pid="$(cat "$RUNNER_TEMP/mmibkr-gateway-relay.pid")"
            kill -0 "$relay_pid"
          elif [ "$POOL_TRANSPORT" = cloudflare_access_ssh ]; then
            cf_pid="$(cat "$RUNNER_TEMP/mmibkr-cf-ssh-host/cloudflared.pid")"
            kill -0 "$cf_pid"
            test "$(ss -lnt | awk '$4=="127.0.0.1:2222"{print $4}' | wc -l)" -eq 1
            # Sealed account is read only by this owner-local verification
            # process. Remote readers learn only match/no-match via pinned SSH.
            nohup python -m scripts.mmibkr_gateway_account_attestor_v1 \
              --expected-env "$RUNNER_TEMP/mmibkr-live-bot.env" \
              --gateway-run-id "$GITHUB_RUN_ID" \
              > "$RUNNER_TEMP/mmibkr-account-attestor.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/mmibkr-account-attestor.pid"
            for attempt in $(seq 1 25); do
              if ss -lnt | grep -q '127.0.0.1:4002'; then break; fi
              kill -0 "$(cat "$RUNNER_TEMP/mmibkr-account-attestor.pid")" || exit 1
              sleep 1
            done
            test "$(ss -lnt | awk '$4=="127.0.0.1:4002"{print $4}' | wc -l)" -eq 1
            echo 'MMIBKR_GATEWAY_ACCOUNT_ATTESTOR_LOOPBACK_ONLY=1'
          else
            echo MMIBKR_POOL_TRANSPORT_INVALID=1; exit 64
          fi
          echo "MMIBKR_GATEWAY_ONLY_POOL_TRANSPORT=$POOL_TRANSPORT"
          echo "MMIBKR_GATEWAY_ONLY_POOL_SESSION_SECONDS=$((POOL_SESSION_MINUTES * 60))"
          pool_resource_sample initial
          docker exec mmibkr-live-gateway du -sm /home/ibgateway/Jts_b1 2>/dev/null | awk '{print "MMIBKR_POOL_JTS_DISK_MIB_INITIAL="$1}' || true
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$POOL_TRANSPORT" = tailscale ]; then
              kill -0 "$relay_pid"
            else
              kill -0 "$cf_pid"
              kill -0 "$(cat "$RUNNER_TEMP/mmibkr-account-attestor.pid")"
              test "$(ss -lnt | awk '$4=="127.0.0.1:2222"{print $4}' | wc -l)" -eq 1
              test "$(ss -lnt | awk '$4=="127.0.0.1:4002"{print $4}' | wc -l)" -eq 1
            fi
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true
            docker exec mmibkr-live-gateway /bin/sh -lc 'test "$READ_ONLY_API" = yes'
            pool_resource_sample interval
            owner_probe_sample=$((owner_probe_sample + 1))
            export MMIBKR_OWNER_PROBE_SAMPLE="$owner_probe_sample"
            if python - <<'PY'
          import os,logging
          from pathlib import Path
          from scripts.mmibkr_public_broker_log_guard_v1 import install; install()
          from ib_insync import IB, util
          # Suppress ib_insync's raw-account timeout diagnostics in public logs.
          # Sanitized failure stage/class below remain visible via print().
          logging.disable(logging.CRITICAL)
          expected=(Path(os.environ['RUNNER_TEMP'])/'mmibkr-live-bot.env').read_text().strip().split('=',1)[1]
          # Avoid reusing a broker client ID retained after an interrupted probe.
          # This pool is read-only and never launches the canonical trading bot.
          client_id=79+int(os.environ['MMIBKR_OWNER_PROBE_SAMPLE'])
          ib=IB()
          ib.RequestTimeout=25
          stage='api_connect_and_sync'
          try:
              # ib_insync performs account-update sync and then executions
              # sequentially. Give the *whole* read-only sync 75s while
              # bounding each internal request to 25s; never infer success
              # from a connected TCP socket without the explicit reads below.
              util.run(ib.connectAsync('127.0.0.1',4001,clientId=client_id,readonly=True,timeout=25),timeout=75)
              stage='account_identity'
              if expected not in ib.managedAccounts():
                  raise SystemExit(70)  # fail closed: wrong account, not transient
              stage='positions_read'
              ib.reqPositions()
              stage='orders_read'
              ib.reqAllOpenOrders()
              stage='executions_read'
              ib.reqExecutions()
          except Exception as exc:
              # Only stable stage/type metadata; no account IDs or broker payloads.
              print('MMIBKR_GATEWAY_POOL_BROKER_FAILURE_STAGE='+stage,flush=True)
              print('MMIBKR_GATEWAY_POOL_BROKER_FAILURE_CLASS='+type(exc).__name__,flush=True)
              print('MMIBKR_GATEWAY_POOL_BROKER_PROBE_RETRYABLE=1',flush=True)
              raise SystemExit(75)
          finally:
              if ib.isConnected(): ib.disconnect()
          PY
            then
              outage_since=0
              echo 'MMIBKR_GATEWAY_POOL_BROKER_READ_PASS=1'
              if [ "$ready" -eq 0 ]; then
                echo 'MMIBKR_GATEWAY_ONLY_POOL_READY=1'
                ready=1
                if [ "$POOL_TRANSPORT" = cloudflare_access_ssh ]; then
                  # In the same authenticated holding stage; no other login,
                  # Gateway owner, or order-capable process is started.
                  gh api --method POST \
                    "/repos/${GITHUB_REPOSITORY}/actions/workflows/mmibkr-gh-independent-readers-r1.yml/dispatches" \
                    -f ref=main \
                    -f "inputs[gateway_run_id]=$GITHUB_RUN_ID" \
                    -f "inputs[test_mode]=handoff_ab" \
                    -f "inputs[network_transport]=cloudflare_access_ssh"
                  echo 'MMIBKR_READONLY_AB_DISPATCHED_EXACT_OWNER=1'
                fi
              fi
              echo "MMIBKR_GATEWAY_POOL_HEARTBEAT_SECONDS=$(( $(date +%s) - start ))"
              sleep 90
            else
              result=$?
              if [ "$result" -eq 70 ]; then
                echo 'MMIBKR_GATEWAY_POOL_ACCOUNT_MISMATCH_FAIL_CLOSED=1'
                exit 70
              fi
              if [ "$outage_since" -eq 0 ]; then outage_since="$(date +%s)"; fi
              elapsed="$(( $(date +%s) - outage_since ))"
              echo "MMIBKR_GATEWAY_POOL_API_UNAVAILABLE_SECONDS=$elapsed"
              if [ "$elapsed" -ge 600 ]; then
                echo 'MMIBKR_GATEWAY_POOL_BROKER_RECOVERY_BUDGET_EXPIRED=1'
                exit 75
              fi
              sleep 45
            fi
          done
          pool_resource_sample final
          docker exec mmibkr-live-gateway du -sm /home/ibgateway/Jts_b1 2>/dev/null | awk '{print "MMIBKR_POOL_JTS_DISK_MIB_FINAL="$1}' || true
          test "$outage_since" -eq 0 || { echo 'MMIBKR_GATEWAY_POOL_ENDS_UNVERIFIED=1'; exit 75; }
          echo 'MMIBKR_GATEWAY_ONLY_POOL_BOUNDED_SESSION_COMPLETE=1'
      - name: Confirm no-order admission did not authorize live bot startup
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode != 'supervised_5h' }}
        run: |
          set -euo pipefail
          echo 'LIVE_WRT_ADMISSION_ONLY_NO_BOT_STARTED=1'
          echo 'LIVE_WRT_ACCOUNT_READ_ONLY_RECONCILED=1'
          echo 'LIVE_WRT_NO_LIVE_ORDER_DISPATCHED=1'

      - name: Observe authenticated Gateway without canonical bot for eight minutes (read only)
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode == 'supervised_5h' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Distinguish broker/Gateway session instability from bot-triggered
          # disconnects before starting canonical main.py. No submit route,
          # order mutation, restart, login or controller commands here.
          docker exec mmibkr-live-gateway /bin/sh -ec 'test "$READ_ONLY_API" = yes'
          down_samples=0
          for sample in $(seq 1 16); do
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true || {
              echo 'SUPERVISED_GATEWAY_ONLY_CONTROLLER_PROCESS_LOST=1'
              exit 1
            }
            raw="$(docker exec mmibkr-live-gateway curl -sS --max-time 4 http://127.0.0.1:8080/health 2>/dev/null)" || raw=''
            safe="$(printf '%s' "$raw" | python -c 'import json,sys
          try: p=json.load(sys.stdin)
          except (TypeError,ValueError): p={}
          keys=("api_port_open","socat_port_open","upstream_connected","upstream_recovery_active","jvm_alive")
          allowed={k:(p.get(k) if type(p.get(k)) is bool else None) for k in keys}
          allowed["state"]=p.get("state") if p.get("state") in ("MONITORING","READY","LOGIN","TWO_FA","HALTED","UPSTREAM_DOWN") else "other"
          allowed["status"]=p.get("status") if p.get("status") in ("healthy","unhealthy") else "unknown"
          print(json.dumps(allowed,sort_keys=True,separators=(",",":")))' )" || safe='{}'
            echo "SUPERVISED_GATEWAY_ONLY_HEALTH_SAMPLE=$sample $safe"
            if [[ "$safe" != *'"api_port_open":true'* ]]; then
              down_samples=$((down_samples + 1))
            fi
            # Fixed 8-minute no-bot control phase, even if the listener
            # flaps: capture whether the controller actually recovers.
            sleep 30
          done
          echo "SUPERVISED_GATEWAY_ONLY_API_DOWN_SAMPLES=$down_samples"
          if [ "$down_samples" -gt 0 ]; then
            echo 'SUPERVISED_GATEWAY_ONLY_API_UNSTABLE=1'
            exit 1
          fi
          if ! python - <<'PY'
          import os
          from pathlib import Path
          from scripts.mmibkr_public_broker_log_guard_v1 import install; install()
          from ib_insync import IB
          expected=(Path(os.environ["RUNNER_TEMP"])/"mmibkr-live-bot.env").read_text().strip().split("=",1)[1]
          ib=IB()
          try:
              ib.connect("127.0.0.1",4001,clientId=78,timeout=10,readonly=True)
              assert expected in ib.managedAccounts()
              ib.reqPositions()
              ib.reqAllOpenOrders()
              print("SUPERVISED_GATEWAY_ONLY_BROKER_RECONCILED=1")
          finally:
              if ib.isConnected(): ib.disconnect()
          PY
          then
            echo 'SUPERVISED_GATEWAY_ONLY_API_HANDSHAKE_FAILED=1'
            exit 1
          fi
          echo 'SUPERVISED_GATEWAY_ONLY_EIGHT_MINUTES_PASS=1'

      - name: Run supervised five-hour live-account canonical bot shadow (no orders)
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode == 'supervised_5h' }}
        run: |
          set -euo pipefail
          umask 077
          # Separate protection layers: Gateway readonly, selected live flags off,
          # canonical global live trading disabled. No orders/position mutations.
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])/"mmibkr-live-data/strategy_runtime/selected_runtime_authority_14th31jv"
          cp = root/"live_bot_runtime_config.json"
          sp = root/"selected_runtime_universe_14tu.json"
          conf=json.loads(cp.read_text())
          selected=json.loads(sp.read_text())
          assert set(("AMAT","APH","MNQ")).issubset(conf["SELECTED_STRATEGY_SETS"])
          assert {x["symbol"] for x in selected["runtime_ids"] if x.get("status")=="active_selected"}=={"AMAT","APH","MNQ"}
          conf["ENABLE_LIVE_TRADING"]=False
          for symbol in ("AMAT","APH","MNQ"):
              conf["SELECTED_STRATEGY_SETS"][symbol]["live_submit_enabled"]=False
          for row in selected["runtime_ids"]:
              if row.get("symbol") in ("AMAT","APH","MNQ"):
                  row["execution_policy"]["live_submit_enabled"]=False
          cp.write_text(json.dumps(conf,sort_keys=True,indent=2)+"\n")
          sp.write_text(json.dumps(selected,sort_keys=True,indent=2)+"\n")
          cp.chmod(0o600)
          sp.chmod(0o600)
          assert all(not conf["SELECTED_STRATEGY_SETS"][s]["live_submit_enabled"] for s in ("AMAT","APH","MNQ"))
          print("SUPERVISED_SHADOW_CANONICAL_SELECTED_SUBMIT_DISABLED=1")
          PY
          docker exec mmibkr-live-gateway /bin/sh -ec 'test "$READ_ONLY_API" = yes'
          docker run -d --name mmibkr-live-bot \
            --network container:mmibkr-live-gateway \
            --env-file "$RUNNER_TEMP/mmibkr-live-bot.env" \
            -e MMIBKR_ACCOUNT_MODE=production_live \
            -e CONFIG_PATH=/app/data/strategy_runtime/selected_runtime_authority_14th31jv/live_bot_runtime_config.json \
            -e ENABLE_LIVE_TRADING=0 \
            -e MM_IB_HOST=127.0.0.1 \
            -e MM_IB_PORT=4003 \
            -e STATUS_SERVICE_MODE=external \
            -e CONTROL_RUNTIME_PORT=8001 \
            -e BOT_SELECTED_RUNTIME_NATURAL_CANDIDATE_14TH31BV_ENABLED=1 \
            -e BOT_SELECTED_RUNTIME_LIVE_STOCK_CANARY_V1_ENABLED=0 \
            -e BOT_SELECTED_RUNTIME_LIVE_OPERATOR_INGRESS_VERIFIED=0 \
            -e BOT_SELECTED_RUNTIME_LIVE_PRIVATE_NETWORK_ATTESTED=1 \
            -v "$RUNNER_TEMP/mmibkr-live-data:/app/data" \
            "mmibkr-live-canonical:$GITHUB_RUN_ID" python main.py >/dev/null
          echo "SUPERVISED_CANONICAL_BOT_PROCESS_STARTED=1"
          # Only project controller-owned status booleans/state; never return
          # titles, credentials, accounts, user names, ports or raw logs.
          gateway_status() {
            local raw
            raw="$(docker exec mmibkr-live-gateway curl -sS --max-time 4 http://127.0.0.1:8080/health 2>/dev/null)" || raw=''
            printf '%s' "$raw" | python -c 'import json,sys
          try: p=json.load(sys.stdin)
          except (ValueError,TypeError): p={}
          allowed=("status","state","jvm_alive","api_port_open","upstream_connected","upstream_recovery_active","ccp_lockout_streak")
          a={k:p.get(k) for k in allowed}
          assert isinstance(a["status"],(str,type(None)))
          print("SUPERVISED_GATEWAY_HEALTH="+json.dumps(a,sort_keys=True,separators=(",",":")))' || true
          }
          start="$(date +%s)"
          duration=18000
          deadline=$((start + duration))
          minute=0
          probe_failures=0
          maintenance_failure_since=0
          maintenance_recovery_active=0
          maintenance_grace_used=0
          maintenance_grace_seconds=720
          while [ "$(date +%s)" -lt "$deadline" ]; do
            minute=$((minute + 1))
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true || { echo 'SUPERVISED_GATEWAY_PROCESS_LOST=1'; exit 1; }
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-bot)" = true || { echo 'SUPERVISED_CANONICAL_BOT_PROCESS_LOST=1'; exit 1; }
            if [ "$minute" -ge 4 ]; then
              docker exec mmibkr-live-bot python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=8).status==200" || { echo 'SUPERVISED_CANONICAL_HEALTHZ_FAILED=1'; exit 1; }
            fi
            gateway_status
            if [ $((minute % 5)) -eq 1 ] || [ "$probe_failures" -gt 0 ]; then
              if python - <<'PY'
          import os
          from pathlib import Path
          from scripts.mmibkr_public_broker_log_guard_v1 import install; install()
          from ib_insync import IB
          expected=(Path(os.environ["RUNNER_TEMP"])/"mmibkr-live-bot.env").read_text().strip().split("=",1)[1]
          ib=IB()
          try:
              ib.connect("127.0.0.1",4001,clientId=78,timeout=10,readonly=True)
              assert expected in ib.managedAccounts(), "authenticated_account_not_matching"
              ib.reqPositions()
              ib.reqAllOpenOrders()
              print("SUPERVISED_LIVE_ACCOUNT_RECONCILED=1")
          finally:
              if ib.isConnected(): ib.disconnect()
          PY
              then
                if [ "$maintenance_recovery_active" -eq 1 ]; then
                  echo 'SUPERVISED_MAINTENANCE_RECONCILED_ACCOUNT_POSITIONS_ORDERS=1'
                  maintenance_recovery_active=0
                fi
                maintenance_failure_since=0
                probe_failures=0
              else
                probe_failures=$((probe_failures + 1))
                [ "$maintenance_failure_since" -gt 0 ] ||
                  maintenance_failure_since="$(date +%s)"
                echo "SUPERVISED_ACCOUNT_READ_FAILURE_STREAK=$probe_failures"
                gateway_status
                if [ "$probe_failures" -ge 3 ]; then
                  if [ "$maintenance_recovery_active" -eq 1 ]; then
                    recovery_age=$(( $(date +%s) - maintenance_failure_since ))
                    if [ "$recovery_age" -ge "$maintenance_grace_seconds" ]; then
                      echo 'SUPERVISED_MAINTENANCE_RECOVERY_EXPIRED=1'
                      exit 1
                    fi
                    echo 'SUPERVISED_MAINTENANCE_RECOVERY_OBSERVING=1'
                  elif [ "$maintenance_grace_used" -eq 0 ]; then
                    eastern_time="$(TZ=America/New_York date +%H%M)"
                    if [[ "$eastern_time" > "2329" || "$eastern_time" < "0201" ]] &&
                       docker logs --since 10m mmibkr-live-gateway 2>&1 |
                         grep -F 'ALERT_IBKR_MAINTENANCE_RECOVERY' >/dev/null; then
                      maintenance_grace_used=1
                      maintenance_recovery_active=1
                      echo 'SUPERVISED_MAINTENANCE_RECOVERY_GRACE_STARTED=1'
                    else
                      echo 'SUPERVISED_BROKER_UNAVAILABLE_CONSECUTIVE_PROBES=3'
                      exit 1
                    fi
                  else
                    echo 'SUPERVISED_BROKER_UNAVAILABLE_CONSECUTIVE_PROBES=3'
                    exit 1
                  fi
                fi
              fi
            fi
            echo "SUPERVISED_LIVE_SHADOW_HEARTBEAT_MINUTE=$minute"
            sleep 60
          done
          if [ "$maintenance_recovery_active" -eq 1 ]; then
            echo 'SUPERVISED_MAINTENANCE_RECOVERY_INCOMPLETE_AT_SESSION_END=1'
            exit 1
          fi
          echo 'SUPERVISED_FIVE_HOUR_SHADOW_COMPLETE=1'
          docker stop --time 60 mmibkr-live-bot >/dev/null

      - name: Cleanly stop authenticated no-order admission Gateway
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode != 'producer' }}
        run: |
          set -euo pipefail
          docker stop --time 90 mmibkr-live-gateway >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = false
          echo "MMIBKR_LIVE_GATEWAY_GRACEFUL_STOP=PASS"

      - name: Encrypt real live Gateway state with independent protected key
        if: ${{ inputs.admission_only }}
        env:
          MMIBKR_LIVE_GATEWAY_WARM_KEY_B64: ${{ secrets.MMIBKR_LIVE_GATEWAY_WARM_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/live-warm-export"
          mkdir -p "$dir"
          if [ "${{ inputs.warm_handoff_mode }}" = producer ]; then
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true
            echo "MMIBKR_LIVE_AUTHENTICATED_ONLINE_SNAPSHOT=1"
            echo "MMIBKR_NO_GRACEFUL_LOGOUT_BEFORE_SNAPSHOT=1"
          fi
          docker run --rm --network none -v "mmibkr-live-jts-$GITHUB_RUN_ID:/state:ro"             -v "$dir:/export" alpine:3.22             sh -ec 'tar -C /state -czf /export/state.tgz .'
          python scripts/mmibkr_live_gateway_state_envelope_v1.py seal             --archive "$dir/state.tgz" --run-id "$GITHUB_RUN_ID"             --envelope "$dir/state.enc" --manifest "$dir/manifest.json"
          rm -f "$dir/state.tgz"
          echo "MMIBKR_LIVE_GATEWAY_WARM_STATE_ENCRYPTED=PASS"

      - name: Persist only encrypted Gateway warm-state for successor
        if: ${{ inputs.admission_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-live-gateway-state-v1
          path: |
            ${{ runner.temp }}/live-warm-export/state.enc
            ${{ runner.temp }}/live-warm-export/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Report sanitized no-order controller lifecycle observations
        if: ${{ always() && inputs.admission_only }}
        run: |
          set +e
          if docker container inspect mmibkr-live-bot >/dev/null 2>&1; then
            docker inspect -f 'MMIBKR_CANONICAL_BOT_STATUS={{.State.Status}} EXIT_CODE={{.State.ExitCode}} OOM={{.State.OOMKilled}}' mmibkr-live-bot
          fi
          if docker container inspect mmibkr-live-gateway >/dev/null 2>&1; then
            docker inspect -f 'MMIBKR_CONTROLLER_CONTAINER_STATUS={{.State.Status}} EXIT_CODE={{.State.ExitCode}} OOM={{.State.OOMKilled}}' mmibkr-live-gateway
            if [ "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true ]; then
              # Sanitize controller state even if login/account bind failed BEFORE the 5h shadow.
              # No user identities, dialog contents, network addresses or raw log text.
              docker exec mmibkr-live-gateway /bin/sh -ec 'curl -sS --max-time 3 http://127.0.0.1:8080/health' |
                python -c 'import json,sys; p=json.load(sys.stdin); keys=("jvm_alive","api_port_open","upstream_connected","upstream_recovery_active"); v={k:p.get(k) if type(p.get(k)) is bool else None for k in keys}; v["state"]=p.get("state") if p.get("state") in ("INIT","LAUNCHING","AGENT_WAIT","APP_DISCOVERY","LOGIN","POST_LOGIN","TWO_FA","DISCLAIMERS","API_WAIT","CONFIG","COMMAND_SERVER","READY","MONITORING","HALTED","UPSTREAM_DOWN") else "unknown"; v["status"]=p.get("status") if p.get("status") in ("healthy","unhealthy") else "unknown"; n=p.get("ccp_lockout_streak"); v["ccp_lockout_streak"]=n if type(n) is int and 0<=n<=1000 else None; print("MMIBKR_FINAL_CONTROLLER_HEALTH="+json.dumps(v,sort_keys=True,separators=(",",":")))' ||
                echo 'MMIBKR_FINAL_CONTROLLER_HEALTH=unavailable'
              docker exec mmibkr-live-gateway /bin/sh -ec 'curl -sS --max-time 3 -o /dev/null -w "CONTROLLER_HEALTH_HTTP=%{http_code}\n" http://127.0.0.1:8080/health' || true
            fi
            # Only alert class names, never raw logs, account identifiers, UI titles or secrets.
            docker logs mmibkr-live-gateway 2>&1 | grep -oE 'ALERT_[A-Z0-9_]+' | sort -u | head -n 30 || true
            # Never print raw Gateway/JTS logs on public runners: emit only
            # predeclared event-class counts, even on an early 2FA failure.
            docker logs mmibkr-live-gateway 2>&1 | python3 -c 'import sys,re,json
          patterns={
            "port_closed":r"API port [0-9]+ closed",
            "port_recovered":r"API port [0-9]+ recovered",
            "reauth_check":r"Sustained API port closure",
            "login_dialog":r"Login dialog detected during monitor loop",
            "wedged_no_login":r"Wedged failure",
            "wedge_restart":r"Gateway appears wedged",
            "recovery_relaunch":r"Recovery: .*Relaunching Gateway",
            "upstream_down":r"ALERT_UPSTREAM_DOWN",
            "upstream_restored":r"UPSTREAM_RESTORED",
            "existing_session_conflict":r"ALERT_EXISTING_SESSION_CONFLICT",
            "config_not_applied":r"ALERT_CONFIG_NOT_APPLIED",
            "2fa_failed":r"ALERT_2FA_FAILED",
            "controller_halted":r"ALERT_HALTED",
            "ccp_lockout":r"ALERT_CCP",
            "clean_logout":r"ALERT_CLEAN_LOGOUT",
          }
          counts={k:0 for k in patterns}
          for line in sys.stdin:
              for k,pat in patterns.items():
                  if re.search(pat,line): counts[k]=min(999,counts[k]+1)
          print("MMIBKR_SAFE_CONTROLLER_LIFECYCLE="+json.dumps(counts,sort_keys=True,separators=(",",":")))' || true
          fi
      - name: Reconcile restored live successor with canonical broker-ledger read-only gate
        if: ${{ !inputs.admission_only && inputs.warm_handoff_mode == 'successor' }}
        run: |
          set -euo pipefail
          # No broker mutation and no submit enable. Execute only restored MM source.
          checker="$PRIVATE_SOURCE_ROOT/scripts/operator/ibkr_live_successor_ledger_reconcile_v1.py"
          test -f "$checker" || {
            echo 'LIVE_RUNTIME_SUCCESSOR_CANONICAL_RECONCILER_SOURCE_NOT_ADMITTED=1'
            exit 1
          }
          data="$RUNNER_TEMP/mmibkr-live-data"
          universe="$data/strategy_runtime/selected_runtime_authority_14th31jv/selected_runtime_universe_14tu.json"
          PYTHONPATH="$PRIVATE_SOURCE_ROOT" python "$checker" \
            --data-root "$data" --universe "$universe" \
            --account-env-file "$RUNNER_TEMP/mmibkr-live-bot.env"
          echo 'LIVE_RUNTIME_SUCCESSOR_READ_ONLY_RECONCILIATION_PASSED=1'
          # Existing next step still refuses to start an order-capable successor.

      - name: Start unchanged canonical bot natural owner with three persisted live policies
        if: ${{ !inputs.admission_only }}
        run: |
          set -euo pipefail
          # An authenticated broker read is not an attribution of restored
          # orderRef/permId/execId intent, fills, open orders and positions.
          # Until the owning MM consumer produces that same-owner proof, an
          # encrypted predecessor checkpoint cannot safely resume live.
          if [ "${{ inputs.warm_handoff_mode }}" = successor ]; then
            echo 'LIVE_RUNTIME_SUCCESSOR_PRESTART_LEDGER_RECONCILIATION_REQUIRED=1'
            exit 1
          fi
          # No separate execution capsule, strategy selector, broker client or submit route.
          # Gateway exposes only 4001 loopback on the runner. Bot shares its
          # private network namespace; its internal TWS port is 4003.
          # Bot-only ingress alternative was independently attested above by
          # checking the Gateway namespace has no published control/API port.
          # Canonical live guard accepts this without claiming a Caddy 401.
          docker run -d --name mmibkr-live-bot \
              --network container:mmibkr-live-gateway \
              --env-file "$RUNNER_TEMP/mmibkr-live-bot.env" \
              -e MMIBKR_ACCOUNT_MODE=production_live \
              -e CONFIG_PATH=/app/data/strategy_runtime/selected_runtime_authority_14th31jv/live_bot_runtime_config.json \
              -e ENABLE_LIVE_TRADING=1 \
              -e MM_IB_HOST=127.0.0.1 \
              -e MM_IB_PORT=4003 \
              -e STATUS_SERVICE_MODE=external \
              -e CONTROL_RUNTIME_PORT=8001 \
              -e BOT_SELECTED_RUNTIME_NATURAL_CANDIDATE_14TH31BV_ENABLED=1 \
              -e BOT_SELECTED_RUNTIME_LIVE_STOCK_CANARY_V1_ENABLED=1 \
              -e BOT_SELECTED_RUNTIME_LIVE_OPERATOR_INGRESS_VERIFIED=0 \
              -e BOT_SELECTED_RUNTIME_LIVE_PRIVATE_NETWORK_ATTESTED=1 \
              -v "$RUNNER_TEMP/mmibkr-live-data:/app/data" \
              "mmibkr-live-canonical:$GITHUB_RUN_ID" \
              python main.py >/dev/null
          echo 'PRODUCTION_CANONICAL_LIVE_BOT_STARTED=1'
          start_epoch="$(date +%s)"
          end_epoch="$((start_epoch + SESSION_SECONDS))"
          last_verified=0
          bot_paused=0
          broker_outage_since=0
          # 600s upstream detection plus attended IB Key requires a longer budget.
          broker_recovery_budget_seconds=1800
          echo "LIVE_RUNTIME_BROKER_RECOVERY_BUDGET_SECONDS=$broker_recovery_budget_seconds"
          iteration=0
          while [ "$(date +%s)" -lt "$end_epoch" ]; do
            iteration=$((iteration+1))
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-bot)" = true || {
              echo 'PRODUCTION_CANONICAL_BOT_LOST=1'; exit 1;
            }
            test "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true || {
              echo 'PRODUCTION_GATEWAY_CONTAINER_LOST=1'; exit 1;
            }
            # Controller /health is diagnostic: upstream_connected can be null
            # while its UI label has not been sampled. Never infer broker
            # disconnection solely from that value. Always retry actual API
            # handshake, even while bot is paused.
            raw="$(docker exec mmibkr-live-gateway curl -sS --max-time 4 http://127.0.0.1:8080/health 2>/dev/null)" || raw=''
            gateway_healthy="$(printf '%s' "$raw" | python -c 'import json,sys
          try: j=json.load(sys.stdin)
          except (ValueError,TypeError): j={}
          allowed=("jvm_alive","api_port_open","upstream_connected","upstream_recovery_active")
          v={k:(j.get(k) if type(j.get(k)) is bool else None) for k in allowed}
          v["state"]=j.get("state") if j.get("state") in ("MONITORING","UPSTREAM_DOWN","HALTED","LOGIN","TWO_FA","API_WAIT","INIT","READY") else "other"
          print("1" if all(v.get(k) is True for k in ("jvm_alive","api_port_open","upstream_connected")) else "0")
          print("LIVE_RUNTIME_CONTROLLER_HEALTH="+json.dumps(v,sort_keys=True,separators=(",",":")),file=sys.stderr)')" || gateway_healthy=0
            # At startup and once per five minutes, prove real API/account
            # connectivity. A false/unknown controller field or paused bot
            # forces a read-only broker probe on EVERY cycle, not just once.
            # A successful broker reconciliation overrides uncertain status.
            if [ "$gateway_healthy" != 1 ] || [ "$bot_paused" -eq 1 ] ||
               [ $((iteration%5)) -eq 1 ]; then
              if python - <<'PY'
          import os
          from pathlib import Path
          from scripts.mmibkr_public_broker_log_guard_v1 import install; install()
          from ib_insync import IB
          expected=(Path(os.environ["RUNNER_TEMP"])/"mmibkr-live-bot.env").read_text().strip().split("=",1)[1]
          ib=IB()
          try:
              ib.connect("127.0.0.1",4001,clientId=78,timeout=10,readonly=True)
              assert expected in ib.managedAccounts(), "expected_account_mismatch"
              ib.reqPositions()
              ib.reqAllOpenOrders()
              ib.reqExecutions()
              print("LIVE_RUNTIME_BROKER_READ_RECONCILED=1")
          finally:
              if ib.isConnected(): ib.disconnect()
          PY
              then
                last_verified="$(date +%s)"
                if [ "$gateway_healthy" != 1 ]; then
                  echo 'LIVE_RUNTIME_CONTROLLER_HEALTH_DISAGREES_WITH_BROKER_READ=1'
                fi
                if [ "$bot_paused" -eq 1 ]; then
                  # Fresh account/position/order/execution reads establish API
                  # health, NOT reconciliation to persisted bot orderRef/permId/
                  # execId intent and inventory. Never resume a paused live bot
                  # from a connectivity-only receipt after an unknown outage.
                  # The canonical MM owner must first bind the exact account,
                  # open orders, positions and fills to its persisted intent.
                  echo 'LIVE_RUNTIME_CANONICAL_LEDGER_RECONCILIATION_REQUIRED_BOT_STAYS_FROZEN=1'
                fi
              else
                if [ "$bot_paused" -eq 0 ]; then
                  docker pause mmibkr-live-bot >/dev/null
                  bot_paused=1
                  broker_outage_since="$(date +%s)"
                  echo 'LIVE_RUNTIME_BROKER_PROBE_FAILED_BOT_FROZEN=1'
                fi
              fi
            fi
            if [ "$bot_paused" -eq 1 ]; then
              if [ "$(( $(date +%s) - broker_outage_since ))" -ge "$broker_recovery_budget_seconds" ]; then
                echo 'LIVE_RUNTIME_RECOVERY_EXPIRED_NEEDS_OPERATOR=1'
                exit 1
              fi
              echo "LIVE_RUNTIME_BROKER_RECOVERY_OBSERVING=1"
            fi
            echo "PRODUCTION_LIVE_OWNER_HEARTBEAT_MINUTE=$iteration"
            sleep 60
          done
          if [ "$bot_paused" -eq 1 ]; then
            echo 'LIVE_RUNTIME_ENDS_WITH_UNRECONCILED_BROKER=1'
            exit 1
          fi
          docker stop --time 90 mmibkr-live-bot >/dev/null
          echo 'PRODUCTION_LIVE_OWNER_SESSION_COMPLETE=1'

      - name: Report sanitized production-live controller recovery evidence
        if: ${{ always() && !inputs.admission_only }}
        run: |
          set +e
          if docker container inspect mmibkr-live-bot >/dev/null 2>&1; then
            docker inspect -f 'LIVE_RUNTIME_FINAL_CANONICAL_BOT={{.State.Status}} EXIT={{.State.ExitCode}} OOM={{.State.OOMKilled}}' mmibkr-live-bot
          fi
          if docker container inspect mmibkr-live-gateway >/dev/null 2>&1; then
            docker inspect -f 'LIVE_RUNTIME_FINAL_GATEWAY={{.State.Status}} EXIT={{.State.ExitCode}} OOM={{.State.OOMKilled}}' mmibkr-live-gateway
            if [ "$(docker inspect -f '{{.State.Running}}' mmibkr-live-gateway)" = true ]; then
              docker exec mmibkr-live-gateway curl -sS --max-time 4 http://127.0.0.1:8080/health 2>/dev/null |
                python -c 'import json,sys
          try: j=json.load(sys.stdin)
          except (ValueError,TypeError): j={}
          keys=("jvm_alive","api_port_open","upstream_connected","upstream_recovery_active")
          safe={k:(j.get(k) if type(j.get(k)) is bool else None) for k in keys}
          safe["state"]=j.get("state") if j.get("state") in ("INIT","LOGIN","TWO_FA","READY","MONITORING","UPSTREAM_DOWN","HALTED") else "unknown"
          print("LIVE_RUNTIME_FINAL_CONTROLLER_HEALTH="+json.dumps(safe,sort_keys=True,separators=(",",":")))' || true
            fi
            docker logs mmibkr-live-gateway 2>&1 | python -c 'import json,re,sys
          patterns={
            "maintenance_recovery": r"ALERT_IBKR_MAINTENANCE_RECOVERY",
            "auto_restart": r"ALERT_AUTO_RESTART",
            "session_conflict": r"ALERT_EXISTING_SESSION_CONFLICT",
            "ccp_lockout": r"ALERT_CCP_",
            "upstream_down": r"ALERT_UPSTREAM_DOWN",
            "upstream_restored": r"ALERT_UPSTREAM_RESTORED",
            "login_failed": r"ALERT_LOGIN_FAILED",
            "twofa_failed": r"ALERT_2FA_FAILED",
            "clean_logout": r"ALERT_CLEAN_LOGOUT",
            "config_not_applied": r"ALERT_CONFIG_NOT_APPLIED",
          }
          counts={k:0 for k in patterns}
          for line in sys.stdin:
              for k,p in patterns.items():
                  if re.search(p,line): counts[k]=min(999,counts[k]+1)
          print("LIVE_RUNTIME_CONTROLLER_ALERT_COUNTS="+json.dumps(counts,sort_keys=True,separators=(",",":")))' || true
          fi
      - name: Stop live owner and encrypt canonical Gateway and bot data for successor
        id: produce-live-checkpoint
        if: ${{ always() && !inputs.admission_only }}
        env:
          MMIBKR_LIVE_GATEWAY_WARM_KEY_B64: ${{ secrets.MMIBKR_LIVE_GATEWAY_WARM_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          docker inspect mmibkr-live-gateway >/dev/null
          test -d "$RUNNER_TEMP/mmibkr-live-data"
          if docker inspect mmibkr-live-bot >/dev/null 2>&1; then
            docker stop --time 90 mmibkr-live-bot >/dev/null 2>&1 || true
          fi
          docker stop --time 90 mmibkr-live-gateway >/dev/null 2>&1 || true
          work="$RUNNER_TEMP/mmibkr-live-checkpoint"
          mkdir -p "$work"
          docker run --rm --network none --user 0:0 \
            -v "mmibkr-live-jts-$GITHUB_RUN_ID:/snapshot/gateway:ro" \
            -v "$RUNNER_TEMP/mmibkr-live-data:/snapshot/bot_data:ro" \
            -v "$work:/export" alpine:3.22 \
            sh -ec 'tar -C /snapshot -czf /export/runtime.tgz gateway bot_data'
          python -m scripts.mmibkr_live_runtime_checkpoint_v1 seal \
            --archive "$work/runtime.tgz" --producer-run "$GITHUB_RUN_ID" \
            --envelope "$work/checkpoint.enc" --manifest "$work/manifest.json"
          rm -f "$work/runtime.tgz"
          echo 'LIVE_RUNTIME_BOT_AND_GATEWAY_CHECKPOINT_SEALED=1'

      - name: Persist exact encrypted production-live successor state
        if: ${{ always() && !inputs.admission_only && steps.produce-live-checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-live-runtime-checkpoint-v1
          path: |
            ${{ runner.temp }}/mmibkr-live-checkpoint/checkpoint.enc
            ${{ runner.temp }}/mmibkr-live-checkpoint/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Destroy one-run credentials, Gateway and account-scoped data
        if: always()
        run: |
          set -euo pipefail
          # Allow the Gateway controller's own clean-logout chain to finish.
          # A hard remove after a failed shadow can strand a broker session slot.
          if [ -f "$RUNNER_TEMP/mmibkr-account-attestor.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/mmibkr-account-attestor.pid")" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/mmibkr-account-attestor.pid" "$RUNNER_TEMP/mmibkr-account-attestor.log"
          fi
          if docker inspect mmibkr-live-gateway >/dev/null 2>&1; then
            docker stop --time 90 mmibkr-live-gateway >/dev/null 2>&1 || true
          fi
          docker rm -f mmibkr-live-bot mmibkr-live-gateway >/dev/null 2>&1 || true
          docker volume rm "mmibkr-live-jts-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          docker volume rm "mmibkr-live-warm-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          # The bot writes some artifacts as root. Host-side rm reported
          # Permission denied in #40, while falsely claiming destruction.
          # Delete the EXACT isolated mounted data tree using networkless
          # root inside a throwaway container, never the worktree.
          data_dir="$RUNNER_TEMP/mmibkr-live-data"
          if [ -d "$data_dir" ]; then
            docker run --rm --network none --user 0:0 \
              -v "$data_dir:/private-data" alpine:3.22 \
              sh -ec 'find /private-data -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +'
            test -z "$(find "$data_dir" -mindepth 1 -maxdepth 1 -print -quit)"
          fi
          rm -rf "$RUNNER_TEMP/live-warm-import" "$RUNNER_TEMP/live-warm-export"
          rm -rf "$RUNNER_TEMP/mmibkr-live-source" "$RUNNER_TEMP/mmibkr-live-data"
          rm -f "$RUNNER_TEMP/mmibkr-live-gateway.env" "$RUNNER_TEMP/mmibkr-live-bot.env" "$RUNNER_TEMP/mmibkr-live-seal-receipt.json"
          test ! -e "$RUNNER_TEMP/mmibkr-live-gateway.env"
          test ! -e "$RUNNER_TEMP/mmibkr-live-data"
          echo 'LIVE_RUN_ONE_RUN_PRIVATE_MATERIAL_DESTROYED=1'
