name: MM-IBKR Canonical Production Live Owner R1

# Live order execution is always workflow_dispatch-only. A path-scoped push
# only dispatches an explicit approved owner request; it does not start IBKR.
on:
  workflow_dispatch:
    inputs:
      admission_only:
        description: Read expected live account without starting the bot (explicit false required for order-capable owner)
        type: boolean
        required: true
        default: true
      warm_handoff_mode:
        description: No-order warm-state handoff trial; legacy preserves prior behavior
        type: choice
        required: true
        default: legacy
        options:
          - legacy
          - producer
          - successor
          - supervised_5h
          - gateway_pool_5h
      pool_transport:
        description: Private network adapter for the read-only GitHub Gateway pool
        type: choice
        required: true
        default: cloudflare_access_ssh
        options:
          - cloudflare_access_ssh
          - tailscale
      pool_session_minutes:
        description: Duration for the same production read-only pool (short A/B acceptance or full continuity)
        type: number
        required: true
        default: 280
      warm_predecessor_run:
        description: Exact successful producer run ID required for successor mode
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - rendezvous/fire/mmibkr-live-writable-admission-r1
  pull_request:
    paths:
      - .github/workflows/mmibkr-selected-runtime-live-owner-r1.yml
      - scripts/mmibkr_live_runtime_checkpoint_v1.py
      - tests/test_mmibkr_live_runtime_checkpoint_v1.py

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: mmibkr-production-live-canonical-owner
  cancel-in-progress: false

env:
  PRIVATE_SOURCE_SHA: 46fcdf26cf84603b305a3ea20bcd3cf28c67bc0b
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  LIVE_SEAL_URL: https://fleet-authority.slenderiq.workers.dev/v1/authorities/ibkr-live-bot/seal
  IBKR_CONTROLLER_IMAGE: ghcr.io/code-hustler-ft3d/ibg-controller@sha256:5db4074ec952d130937afc3bb926ee97f115d09f7f46676eb16d98c2805572b5
  SESSION_SECONDS: "14400"

jobs:
  dispatch_admission:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dispatch explicitly authorized canonical owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a newly ADDED exact marker may request live. Existing historical
          # fire markers and general source pushes cannot replay live startup.
          mode=legacy
          admission_only=true
          predecessor_run=''
          pool_session_minutes=280
          # GitHub Actions checkout is shallow: git show can wrongly treat this
          # commit as a root and mark every historical fire marker as newly added.
          # Use the authoritative GitHub commit PATCH; fail closed if unavailable.
          changed="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '[.files[] | select(.filename == "rendezvous/fire/mmibkr-live-writable-admission-r1") | (.patch // "")] | join("\n")')"
          marker_count="$(printf '%s\n' "$changed" | grep -Ec '^\+(live_successor_approved_dispatch_request|live_owner_approved_dispatch_request|supervised_5h_dispatch_request|gateway_pool_5h_readonly_dispatch_request)' || true)"
          if [ "$marker_count" != 1 ]; then
            echo "LIVE_OWNER_EXACT_NEW_MARKER_COUNT_INVALID=$marker_count"
            exit 64
          fi
          # A fresh random suffix on an old marker is not independent operator
          # authorization. Never let a public Git push replay a writable owner
          # or successor, even if the marker's historical predecessor ID matches.
          # Preserve explicit workflow_dispatch for the canonical operator and
          # the separately bounded read-only pool/supervised push markers.
          if printf '%s\n' "$changed" | grep -Eq '^\+(live_successor_approved_dispatch_request|live_owner_approved_dispatch_request)'; then
            echo 'LIVE_WRITABLE_PUSH_DISPATCH_REQUIRES_INDEPENDENT_ADMISSION=1'
            exit 64
          fi
          if printf '%s\n' "$changed" | grep -Eq '^\+gateway_pool_5h_readonly_dispatch_request_20261022_[a-z0-9]{6}: (true|15m)$'; then
            mode=gateway_pool_5h
            admission_only=true
            if printf '%s\n' "$changed" | grep -Eq '^\+gateway_pool_5h_readonly_dispatch_request_20261022_[a-z0-9]{6}: 15m$'; then
              pool_session_minutes=15
            fi
            echo 'EXPLICIT_OPERATOR_READONLY_CF_GATEWAY_POOL_REQUEST_MATCHED=1'
          elif printf '%s\n' "$changed" | grep -Eq '^\+supervised_5h_dispatch_request_[0-9]{8}_[a-z0-9]{6}: true$'; then
            mode=supervised_5h
          else
            # An accepted prefix with an unapproved value must never start
            # even a read-only production Gateway or request an IB Key login.
            echo 'LIVE_OWNER_UNRECOGNIZED_NEW_MARKER=1'
            exit 64
          fi
          if [ "$mode" = gateway_pool_5h ]; then
            active_owners="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/mmibkr-selected-runtime-live-owner-r1.yml/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested"))] | length')"
            if [ "$active_owners" != 0 ]; then
              echo 'READONLY_CF_GATEWAY_POOL_EXISTING_OWNER_BLOCK=1'
              exit 1
            fi
          fi
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/mmibkr-selected-runtime-live-owner-r1.yml/dispatches" \
            -f ref=main \
            -f "inputs[admission_only]=$admission_only" \
            -f "inputs[warm_handoff_mode]=$mode" \
            -f "inputs[pool_transport]=cloudflare_access_ssh" \
            -f "inputs[pool_session_minutes]=$pool_session_minutes" \
            -f "inputs[warm_predecessor_run]=$predecessor_run"
          echo "LIVE_OWNER_FIRE_DISPATCHED_ADMISSION_ONLY=$admission_only"
          echo "LIVE_OWNER_FIRE_DISPATCHED_MODE=$mode"
          echo "LIVE_OWNER_FIRE_DISPATCHED_POOL_SESSION_MINUTES=$pool_session_minutes"
          echo "LIVE_OWNER_FIRE_DISPATCHED_PREDECESSOR=$predecessor_run"

  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Confirm exclusive direct-bot live owner and existing credential path
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/mmibkr-selected-runtime-live-owner-r1.yml').read_text()
          required=(
              'workflow_dispatch:', 'production_live_bot',
              '/v1/authorities/ibkr-live-bot/seal',
              'mmibkr_source_vault_consumer_v1.py',
              'mmibkr-live-gateway',
              'MM_IB_PORT=4003',
              'MMIBKR_ACCOUNT_MODE=production_live',
              'ENABLE_LIVE_TRADING=1',
              'BOT_SELECTED_RUNTIME_LIVE_OPERATOR_INGRESS_VERIFIED=0',
              'BOT_SELECTED_RUNTIME_LIVE_PRIVATE_NETWORK_ATTESTED=1',
              'HEADLESS_LIVE_PRIVATE_NETWORK_ATTESTED=1',
              'CANONICAL_EXISTING_LIVE_RUNTIME_CONFIG_VERIFIED=1',
              'CONFIG_PATH=/app/data/strategy_runtime/selected_runtime_authority_14th31jv/live_bot_runtime_config.json',
              'python main.py',
          )
          for marker in required:
              assert marker in s, marker
          # Check the execution job, not these literal regression assertions.
          owner=s.split('\n  owner:\n',1)[1]
          assert "contract['localSymbol']=='MNQZ6'" not in owner
          assert "contract['lastTradeDateOrContractMonth']=='20261218'" not in owner
          assert 'is_continuous_futures_symbol(local_symbol' in owner
          assert 'paper_execute' not in owner
          assert 'ibkr_remote_selected_runtime_paper_execute' not in owner
          assert 'placeOrder(' not in owner
          assert 'rendezvous/fire/mmibkr-live-writable-admission-r1' in s
          assert "if: github.event_name == 'workflow_dispatch'" in owner
          assert "if: " + chr(36) + "{{ !inputs.admission_only }}" in owner
          assert "if: " + chr(36) + "{{ inputs.admission_only }}" in owner
          assert '"inputs[admission_only]=$admission_only"' in s
          assert "'inputs[warm_handoff_mode]=$mode'" in s or 'inputs[warm_handoff_mode]=$mode' in s
          assert 'supervised_5h_dispatch_request_[0-9]{8}_[a-z0-9]{6}' in s
          assert 'mode=legacy' in s and 'mode=supervised_5h' in s
          assert 'inputs[warm_predecessor_run]=$predecessor_run' in s
          fire=s.split('      - name: Dispatch explicitly authorized canonical owner',1)[1].split('\n  contract:',1)[0]
          assert 'LIVE_WRITABLE_PUSH_DISPATCH_REQUIRES_INDEPENDENT_ADMISSION=1' in fire
          assert 'live_owner_approved_dispatch_request_20261019_' not in fire
          assert 'live_successor_approved_dispatch_request_20261020_' not in fire
          run=fire.split('        run: |',1)[1]
          import subprocess
          script="\n".join(line[10:] if line.startswith("          ") else line for line in run.splitlines())
          subprocess.run(["bash","-n"],input=script,text=True,check=True)
          print('LIVE_EXACT_SUCCESSOR_DISPATCH_SHELL_PARSE=PASS')
          assert 'LIVE_WRT_ADMISSION_ONLY_NO_BOT_STARTED=1' in owner
          assert 'EXPLICIT_APPROVED_CANONICAL_LIVE_OWNER=1' in owner
          assert 'LIVE_MODE_REQUIRES_LEGACY_OR_EXACT_SUCCESSOR=1' in owner
          assert 'EPHEMERAL_LIVE_BROKER_MUTATION_DISABLED=1' not in owner
          assert 'python /app/scripts/operator/selected_runtime_legacy_compat_config_v1.py' in owner
          assert "--entrypoint /bin/sh" in owner
          assert "--user 0:0" in owner
          assert "--network none" in owner
          assert 'chown -R "$RUNNER_UID:$RUNNER_GID"' in owner
          assert 'python -m scripts.operator.selected_runtime_legacy_compat_config_v1' not in owner
          assert 'ib.reqAllOpenOrders()' in owner
          # Bounded authenticated shadow: explicit admission, independent denial
          # at the broker and canonical submit policy, not merely a label.
          assert 'supervised_5h' in owner
          assert 'MMIBKR_SUPERVISED_GATEWAY_API_READONLY=1' in owner
          assert 'SUPERVISED_SHADOW_CANONICAL_SELECTED_SUBMIT_DISABLED=1' in owner
          assert 'SUPERVISED_FIVE_HOUR_SHADOW_COMPLETE=1' in owner
          assert 'SUPERVISED_GATEWAY_ONLY_EIGHT_MINUTES_PASS=1' in owner
          assert 'SUPERVISED_GATEWAY_ONLY_API_UNSTABLE=1' in owner
          assert 'SUPERVISED_GATEWAY_ONLY_BROKER_RECONCILED=1' in owner
          assert 'SUPERVISED_GATEWAY_HEALTH=' in owner
          assert 'SUPERVISED_BROKER_UNAVAILABLE_CONSECUTIVE_PROBES=3' in owner
          assert 'AUTO_RESTART_ADOPT=yes' in owner
          assert 'CCP_MAINTENANCE_RECOVERY_DELAY_SECONDS=480' in owner
          assert 'maintenance_grace_seconds=720' in owner
          assert 'SUPERVISED_MAINTENANCE_RECOVERY_GRACE_STARTED=1' in owner
          assert 'SUPERVISED_MAINTENANCE_RECOVERY_EXPIRED=1' in owner
          assert 'SUPERVISED_MAINTENANCE_RECONCILED_ACCOUNT_POSITIONS_ORDERS=1' in owner
          assert 'SUPERVISED_MAINTENANCE_RECOVERY_INCOMPLETE_AT_SESSION_END=1' in owner
          assert 'docker logs --since 10m mmibkr-live-gateway' in owner
          assert 'TZ=America/New_York date +%H%M' in owner
          assert 'docker stop --time 90 mmibkr-live-gateway' in owner
          assert 'MMIBKR_CANONICAL_BOT_STATUS=' in owner
          assert 'MMIBKR_FINAL_CONTROLLER_HEALTH=' in owner
          assert 'MMIBKR_SAFE_CONTROLLER_LIFECYCLE=' in owner
          assert 'MMIBKR_SUPERVISED_2FA_APPROVAL_WINDOW_SECONDS=300' in owner
          assert 'MMIBKR_SUPERVISED_AUTOMATIC_2FA_RELOGIN=0' in owner
          assert 'MMIBKR_SUPERVISED_CONTROLLER_UPGRADE_V0_16_2_VERIFIED=1' in owner
          assert 'ghcr.io/code-hustler-ft3d/ibg-controller@sha256:2e4f4911991386e941f6e95d58ee38a8242474dd3be239f21ad82557d24b4368' in owner
          assert 'controller_image="$IBKR_CONTROLLER_IMAGE"' in owner
          assert 'twofa_exit_interval=300' in owner
          assert 'relogin_after_twofa_timeout=no' in owner
          assert 'find /private-data -mindepth 1 -maxdepth 1' in owner
          assert 'timeout-minutes: 340' in owner
          # Parse the actual monitored shell block with bash -n (no execution,
          # no broker session, no secrets). Literal string gates alone miss syntax.
          import subprocess
          step=owner.split('      - name: Run supervised five-hour live-account canonical bot shadow (no orders)',1)[1]
          run=step.split('      - name: Cleanly stop authenticated no-order admission Gateway',1)[0]
          run=run.split('        run: |',1)[1]
          script="\n".join(line[10:] if line.startswith("          ") else line for line in run.splitlines())
          subprocess.run(["bash","-n"],input=script,text=True,check=True)
          print('SUPERVISED_MAINTENANCE_SHELL_PARSE=PASS')
          assert 'PRODUCTION_CANONICAL_LIVE_BOT_STARTED=1' in owner
          assert 'PRODUCTION_LIVE_OWNER_SESSION_COMPLETE=1' in owner
          assert 'LIVE_RUNTIME_BROKER_READ_RECONCILED=1' in owner
          assert owner.count('logging.disable(logging.CRITICAL)') >= 2
          assert 'util.run(ib.connectAsync(' in owner
          assert 'ib.RequestTimeout=25' in owner
          # A nullable upstream_connected is advisory; only a failed real IB
          # account probe is grounds to freeze the live canonical bot.
          assert 'LIVE_RUNTIME_CONTROLLER_HEALTH_DISAGREES_WITH_BROKER_READ=1' in owner
          assert 'LIVE_RUNTIME_BROKER_PROBE_FAILED_BOT_FROZEN=1' in owner
          assert 'UPSTREAM_RELAUNCH=yes' in owner
          assert 'MMIBKR_LIVE_ATTENDED_UPSTREAM_RELAUNCH_ENABLED=1' in owner
          assert 'broker_recovery_budget_seconds=1800' in owner
          assert 'LIVE_RUNTIME_BROKER_RECOVERY_BUDGET_SECONDS=' in owner
          assert 'broker_outage_since ))" -ge 720' not in owner
          assert '"$gateway_healthy" != 1 ] || [ "$bot_paused" -eq 1' in owner
          assert 'LIVE_RUNTIME_CANONICAL_LEDGER_RECONCILIATION_REQUIRED_BOT_STAYS_FROZEN=1' in owner
          assert 'docker unpause mmibkr-live-bot' not in owner
          assert 'LIVE_RUNTIME_BROKER_LOST_BOT_FROZEN=1' not in owner
          assert 'LIVE_RUNTIME_BOT_AND_GATEWAY_CHECKPOINT_SEALED=1' in owner
          assert 'LIVE_RUNTIME_PREDECESSOR_GATEWAY_AND_BOT_DATA_RESTORED=1' in owner
          assert 'LIVE_RUNTIME_FAILED_PREDECESSOR_CHECKPOINT_AND_CLEANUP_VERIFIED=1' in owner
          assert 'Bind and reconcile the expected existing production account without order mutation")' in owner
          assert 'PRODUCTION_LIVE_EXECUTION_HISTORY_READ=1' in owner
          assert 'mmibkr-live-runtime-checkpoint-v1' in owner
          assert 'LIVE_RUNTIME_SUCCESSOR_AUTH_AND_BROKER_RECONCILIATION_REQUIRED=1' in owner
          assert 'LIVE_RUNTIME_SUCCESSOR_PRESTART_LEDGER_RECONCILIATION_REQUIRED=1' in owner
          assert "SESSION_SECONDS: \"14400\"" in s
          live=owner.split('      - name: Start unchanged canonical bot natural owner with three persisted live policies',1)[1]
          live=live.split('      - name: Stop live owner and encrypt canonical Gateway and bot data for successor',1)[0]
          live=live.split('        run: |',1)[1]
          live_script="\n".join(line[10:] if line.startswith("          ") else line for line in live.splitlines())
          subprocess.run(["bash","-n"],input=live_script,text=True,check=True)
          print('CANONICAL_LIVE_SCRIPT_SHELL_PARSE=PASS')
          admission=owner.split('      - name: Require explicit canonical owner activation and exact handoff scope',1)[1].split('      - uses: actions/setup-python',1)[0]
          assert admission.count('        run: |') == 1
          assert admission.count('        env:') == 1
          for section, after in (
              ('Restore exact encrypted live Gateway and bot-state predecessor', 'Promote only the three approved persisted selected runtimes'),
              ('Stop live owner and encrypt canonical Gateway and bot data for successor', 'Persist exact encrypted production-live successor state'),
          ):
              block=owner.split('      - name: '+section,1)[1].split('      - name: '+after,1)[0]
              script=block.split('        run: |',1)[1]
              script="\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
              subprocess.run(["bash","-n"],input=script,text=True,check=True)
          print('LIVE_ACTIVATION_RESTORE_AND_CHECKPOINT_SHELL_PARSE=PASS')
          live_evidence=owner.split('      - name: Report sanitized production-live controller recovery evidence',1)[1].split('      - name: Stop live owner and encrypt canonical Gateway and bot data for successor',1)[0]
          live_evidence_script=live_evidence.split('        run: |',1)[1]
          live_evidence_script="\n".join(line[10:] if line.startswith("          ") else line for line in live_evidence_script.splitlines())
          subprocess.run(["bash","-n"],input=live_evidence_script,text=True,check=True)
          assert 'LIVE_RUNTIME_CONTROLLER_ALERT_COUNTS=' in owner
          assert 'LIVE_RUNTIME_FINAL_CONTROLLER_HEALTH=' in owner
          print('LIVE_RUNTIME_RECOVERY_OBSERVABILITY_PARSE=PASS')
          prestart='      - name: ' + 'Reconcile restored live successor with canonical broker-ledger read-only gate'
          start='      - name: ' + 'Start unchanged canonical bot natural owner with three persisted live policies'
          assert owner.count(prestart) == 1
          assert owner.rfind(prestart) < owner.rfind(start)
          checked=owner.rsplit(prestart,1)[1].split(start,1)[0]
          assert ('if: ' + chr(36) + "{{ !inputs.admission_only && inputs.warm_handoff_mode == 'successor' }}") in checked
          assert "ibkr_live_successor_ledger_reconcile_v1.py" in checked
          assert "--account-env-file" in checked and "--universe" in checked and "--data-root" in checked
          assert "LIVE_RUNTIME_SUCCESSOR_CANONICAL_RECONCILER_SOURCE_NOT_ADMITTED=1" in checked
          assert "LIVE_RUNTIME_SUCCESSOR_READ_ONLY_RECONCILIATION_PASSED=1" in checked
          assert "LIVE_RUNTIME_SUCCESSOR_PRESTART_LEDGER_RECONCILIATION_REQUIRED=1" in owner
          assert "ENABLE_LIVE_TRADING=1" not in checked
          assert "placeOrder" not in checked and "cancelOrder" not in checked
          prestart_shell=checked.split('        run: |',1)[1]
          prestart_shell="\n".join(line[10:] if line.startswith("          ") else line for line in prestart_shell.splitlines())
          subprocess.run(["bash","-n"],input=prestart_shell,text=True,check=True)
          print('LIVE_SUCCESSOR_READONLY_PRESTART_STEP_CONTRACT_PASS=1')
          print('CANONICAL_LIVE_OWNER_CONTRACT_PASS=1')
          PY
          python -m unittest -v tests.test_mmibkr_live_runtime_checkpoint_v1

      - name: Verify writable push replay denial and read-only preservation (brokerless)
        run: python -m unittest discover -s tests -p 'test_mmibkr_live_writable_push_replay_guard_v1.py' -v

  owner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    # Needed ONLY for bounded read-only reader dispatch after live account proof.
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require explicit canonical owner activation and exact handoff scope
        env:
          ADMISSION_ONLY: ${{ inputs.admission_only }}
          HANDOFF_MODE: ${{ inputs.warm_handoff_mode }}
          PREDECESSOR_RUN: ${{ inputs.warm_predecessor_run }}
        run: |
          set -euo pipefail
          case "$HANDOFF_MODE" in legacy|producer|successor|supervised_5h|gateway_pool_5h) ;; *) exit 64 ;; esac
          if [ "$ADMISSION_ONLY" = false ]; then
            case "$HANDOFF_MODE" in
              legacy)
                test -z "$PREDECESSOR_RUN" || exit 64 ;;
              successor)
                [[ "$PREDECESSOR_RUN" =~ ^[0-9]+$ ]] || exit 64 ;;
              *) echo 'LIVE_MODE_REQUIRES_LEGACY_OR_EXACT_SUCCESSOR=1'; exit 64 ;;
            esac
            echo 'EXPLICIT_APPROVED_CANONICAL_LIVE_OWNER=1'
          else
            if [ "$HANDOFF_MODE" = successor ]; then
              [[ "$PREDECESSOR_RUN" =~ ^[0-9]+$ ]] || exit 64
            elif [ -n "$PREDECESSOR_RUN" ]; then
              exit 64
            fi
            echo "NO_ORDER_WARM_HANDOFF_MODE=$HANDOFF_MODE"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install existing source and broker client dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==46.0.1 ib_insync==0.9.86

      # Fail before requesting IBKR credentials if no private cloud-to-cloud
      # path is provisioned. Same workflow identity keeps existing Fleet seal.
      - name: Join restricted tailnet for Gateway-only research pool
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode == 'gateway_pool_5h' && inputs.pool_transport == 'tailscale' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.MMIBKR_TS_GATEWAY_OIDC_CLIENT_ID }}
          audience: ${{ secrets.MMIBKR_TS_GATEWAY_OIDC_AUDIENCE }}
          tags: tag:mmibkr-gateway
          hostname: mmibkr-gw-${{ github.run_id }}

      - name: Establish Cloudflare Access SSH tunnel before any IBKR credential is requested
        if: ${{ inputs.admission_only && inputs.warm_handoff_mode == 'gateway_pool_5h' && inputs.pool_transport == 'cloudflare_access_ssh' }}
        env:
          MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
          MMIBKR_CF_GATEWAY_TUNNEL_TOKEN: ${{ secrets.MMIBKR_CF_GATEWAY_TUNNEL_TOKEN }}
          MMIBKR_CF_GATEWAY_SSH_HOST_KEY_B64: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_KEY_B64 }}
          MMIBKR_CF_READER_SSH_PUBKEY: ${{ secrets.MMIBKR_CF_READER_SSH_PUBKEY }}
        run: |
          set -euo pipefail
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_gateway_start_v1.sh
          echo 'MMIBKR_CF_GATEWAY_BROKER_LOGIN_NOT_YET_REQUESTED=1'

      - name: Materialize canonical exact private source through existing encrypted Fleet vault
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-live-source" "$RUNNER_TEMP/mmibkr-live-data"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$PRIVATE_SOURCE_SHA" \
            --public-repo XoticHaze/mm-ibkr-runtime \
            --public-branch mmibkr-source-vault \
            --destination "$RUNNER_TEMP/mmibkr-live-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-live-source/source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-live-source/materialization.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'mmibkr-live-source'
          node=json.loads((base/'materialization.json').read_text())
          assert node['ok'] is True
          assert node['source_sha']==os.environ['PRIVATE_SOURCE_SHA']
          assert node['vault_attestation_verified'] is True
          assert node['plaintext_emitted'] is False
          assert node['private_repository_token_used'] is False
          assert node['broker_credentials_used'] is False
          source=Path(node['source_root'])
