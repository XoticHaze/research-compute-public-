                  (.[0].steps | any(.name == "Persist exact encrypted production-live successor state" and .conclusion == "success")) and
                  (.[0].steps | any(.name == "Destroy one-run credentials, Gateway and account-scoped data" and .conclusion == "success")))' | grep -qx true
