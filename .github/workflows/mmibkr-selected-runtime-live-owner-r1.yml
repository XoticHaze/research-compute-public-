            sh -ec 'tar -xzf /import/recovered.tgz -C /seed --strip-components=1 gateway; chown -R "$GATEWAY_UID:$GATEWAY_GID" /seed; chmod -R u+rwX,go-rwx /seed'
          mkdir -p "$RUNNER_TEMP/mmibkr-live-data"
