          gateway_gid="$(docker run --rm --entrypoint /usr/bin/id "$controller_image" -g)"
          [[ "$gateway_uid" =~ ^[0-9]+$ && "$gateway_gid" =~ ^[0-9]+$ ]]
          gateway_volume="mmibkr-live-jts-$GITHUB_RUN_ID"
          docker volume create "$gateway_volume" >/dev/null
          docker run --rm --network none --user 0:0 \
            -e GATEWAY_UID="$gateway_uid" -e GATEWAY_GID="$gateway_gid" \
