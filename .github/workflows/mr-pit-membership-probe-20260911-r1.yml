name: MR PIT Membership Probe 20260911 R1

on:
  pull_request:
    paths:
      - 'research/mr_pit_membership_probe_20260911_r1.py'
      - '.github/workflows/mr-pit-membership-probe-20260911-r1.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas 'git+https://github.com/arielNacamulli/pitindex.git@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - id: evaluate
        run: |
          python research/mr_pit_membership_probe_20260911_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/mr_pit_membership_probe_20260911_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-pit-membership-probe__${{ steps.evaluate.outputs.decision }}
          path: research/artifacts/mr_pit_membership_probe_20260911_r1.json
          if-no-files-found: error
