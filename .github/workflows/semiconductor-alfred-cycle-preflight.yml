name: Semiconductor ALFRED Cycle Preflight
on:
  pull_request:
    paths:
      - 'research/semiconductor_alfred_cycle_preflight_20260906.py'
      - '.github/workflows/semiconductor-alfred-cycle-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Execute key-free point-in-time semiconductor-cycle preflight
        run: python research/semiconductor_alfred_cycle_preflight_20260906.py
      - name: Retain deterministic cycle source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semiconductor-alfred-cycle-preflight
          path: semiconductor_alfred_cycle_preflight_20260906.json
          retention-days: 14
          if-no-files-found: error
