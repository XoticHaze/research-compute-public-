name: F1a MM Dated-Cache Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/f1a_mm_dated_cache_acceptance_v1.py'
      - '.github/workflows/f1a-mm-dated-cache-acceptance.yml'
      - 'data_requests/f1a-mm-dated-cache-acceptance-*.txt'

permissions:
  actions: read
  contents: read

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '34684071280'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed acceptance environment
        run: python -m pip install --disable-pip-version-check -q pandas==3.0.5
      - name: Compile fixed acceptance consumer
        run: python -m py_compile scripts/f1a_mm_dated_cache_acceptance_v1.py
      - name: Download exact admitted F1a raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f1a_raw"
          cat > "$RUNNER_TEMP/artifacts.tsv" <<'EOF'
          6E	10294309080	aa922cc1a2dc664725e95f0786711254489b2c01ea1b6474fb546628720231fa
          ES	10295321272	2d152bd41c9af1b6f476d1d9e927d2d4655261a36a463eae003a6df9809a528c
          NG	10295022830	8b89dee30113d07421b5c330c4c670c11b79fac664c9b059973e002a76e7f263
          NQ	10294722102	f91620b43b58e5f6e7a1986e433fca5ab1f9da50fa678c1b22fb8342f9416fcd
          ZS	10294518710	9587498fba5c35f797b10e66992d8fd8d1049b0b7fa47c9ee354a339ba78fe02
          EOF
          while IFS=$'\t' read -r root artifact_id expected; do
            zip="$RUNNER_TEMP/${root}.zip"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$zip"
            actual="$(sha256sum "$zip" | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "artifact digest mismatch root=$root expected=$expected actual=$actual"; exit 41; }
            mkdir -p "$RUNNER_TEMP/f1a_raw/$root"
            unzip -q "$zip" -d "$RUNNER_TEMP/f1a_raw/$root"
          done < "$RUNNER_TEMP/artifacts.tsv"
      - name: Execute MM dated-cache acceptance consumer
        run: |
          set -euo pipefail
          python scripts/f1a_mm_dated_cache_acceptance_v1.py \
            --input-root "$RUNNER_TEMP/f1a_raw" \
            --output-root "$RUNNER_TEMP/mm_staging" \
            --receipt "$RUNNER_TEMP/f1a-mm-dated-cache-acceptance.json" \
            --source-run-id "$SOURCE_RUN_ID" | tee "$RUNNER_TEMP/acceptance.log"
          grep '^F1A_MM_DATED_CACHE_ACCEPTANCE=PASS$' "$RUNNER_TEMP/acceptance.log"
          python -m json.tool "$RUNNER_TEMP/f1a-mm-dated-cache-acceptance.json" >/dev/null
      - name: Upload MM-compatible dated-cache staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1a-mm-dated-cache-staging
          path: ${{ runner.temp }}/mm_staging
          retention-days: 30
          if-no-files-found: error
      - name: Upload sanitized acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1a-mm-dated-cache-acceptance-receipt
          path: ${{ runner.temp }}/f1a-mm-dated-cache-acceptance.json
          retention-days: 30
          if-no-files-found: error
