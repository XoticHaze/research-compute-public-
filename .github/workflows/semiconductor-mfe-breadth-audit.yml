name: Semiconductor MFE Breadth Audit
on:
  pull_request:
    paths:
      - 'research/semiconductor_mfe_breadth_audit_20260905.py'
      - '.github/workflows/semiconductor-mfe-breadth-audit.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install exact numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute development-only MFE breadth falsifier
        run: PYTHONPATH=. python -m research.semiconductor_mfe_breadth_audit_20260905
      - name: Retain deterministic MFE breadth receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semiconductor-mfe-breadth-audit
          path: semiconductor_mfe_breadth_audit_20260905.json
          retention-days: 14
          if-no-files-found: error
