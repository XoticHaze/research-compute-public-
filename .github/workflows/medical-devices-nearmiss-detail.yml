name: Medical Devices Near-Miss Detail

on:
  pull_request:
    paths:
      - 'research/medical-devices-nearmiss-detail-contract.json'
      - '.github/workflows/medical-devices-nearmiss-detail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install exact accepted numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1

      - name: Materialize exact accepted public Stage-A adapter
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          test "$(git hash-object .campaign/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python -m py_compile .campaign/runner.py
          python -m json.tool research/medical-devices-nearmiss-detail-contract.json >/dev/null

      - name: Reproduce and decompose frozen Medical Devices development result
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          s=importlib.util.spec_from_file_location('r','.campaign/runner.py')
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=json.loads(Path('research/medical-devices-nearmiss-detail-contract.json').read_text())
          assert not c['external_holdouts_loaded']
          r=m._evaluate_matrix(c['family'], c['frozen_cutoff'])
          summary=r['family_summary']['medical_devices']
          assert summary['passing_symbols']==c['expected_passing_symbols']
          assert not summary['development_family_gate_pass']
          detail=[x for x in r['per_symbol'] if x['family']=='medical_devices']
          out={
            'schema':'research_compute_public.rc001_medical_devices_nearmiss_detail.v1',
            'status':'PASS',
            'family_summary':r['family_summary'],
            'per_symbol':detail,
            'selection_calendar':r['selection_calendar'],
            'external_holdouts_loaded':False,
            'research_only':True,
            'promotion_authority':False,
          }
          Path('medical-devices-nearmiss-detail-receipt.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print('MEDICAL_DEVICES_NEARMISS_DETAIL='+json.dumps(out,sort_keys=True))
          PY

      - name: Retain deterministic receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: medical-devices-nearmiss-detail-receipt
          path: medical-devices-nearmiss-detail-receipt.json
          if-no-files-found: warn
          retention-days: 14
