name: MR Free Cash Flow 20260911 R1

on:
  pull_request:
    paths:
      - 'research/mr_free_cash_flow_20260911_r1.py'
      - '.github/workflows/mr-free-cash-flow-20260911-r1.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet yfinance pandas
      - id: evaluate
        run: |
          python research/mr_free_cash_flow_20260911_r1.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/mr_free_cash_flow_20260911_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-free-cash-flow__${{ steps.evaluate.outputs.decision }}
          path: research/artifacts/mr_free_cash_flow_20260911_r1.json
          if-no-files-found: error
