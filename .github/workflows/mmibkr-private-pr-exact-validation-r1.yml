name: MM-IBKR Private PR Exact Validation R1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mmibkr-private-pr-exact-validation-r1.yml'
      - 'cloudflare/fleet-authority/src/source_exchange.js'
      - 'tests/test_fleet_source_vault_contract_v1.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmibkr-private-pr-exact-validation-r1
  cancel-in-progress: false

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  PRIVATE_SOURCE_SHA: aac81518231e776c28c646d974473c631d6e3a05

jobs:
  exact-private-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Materialize exact private PR source through bounded Fleet stream
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import time
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from urllib.request import Request, urlopen

          audience = 'mmibkr-fleet-authority'
          base = os.environ['FLEET_AUTHORITY_BASE'].rstrip('/')
          source_sha = os.environ['PRIVATE_SOURCE_SHA'].strip().lower()
          run_id = os.environ['GITHUB_RUN_ID']
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          archive_path = runner_temp / 'mmibkr-private-pr-validation.tar.gz'
          extract_root = runner_temp / 'mmibkr-private-pr-validation'

          if len(source_sha) != 40 or any(ch not in '0123456789abcdef' for ch in source_sha):
              raise SystemExit('PRIVATE_SOURCE_SHA must be exact 40-hex')

          def oidc_token():
              raw_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              parsed = urlparse(raw_url)
              query = dict(parse_qsl(parsed.query, keep_blank_values=True))
              query['audience'] = audience
              url = urlunparse((
                  parsed.scheme,
                  parsed.netloc,
                  parsed.path,
                  parsed.params,
                  urlencode(query),
                  parsed.fragment,
              ))
              req = Request(
                  url,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                      'Accept': 'application/json',
                  },
              )
              with urlopen(req, timeout=20) as response:
                  node = json.load(response)
              token = str(node.get('value') or '')
              if token.count('.') != 2:
                  raise RuntimeError('OIDC token invalid')
              return token

          token = oidc_token()
          url = f'{base}/v1/source-vault/private-archive/{source_sha}'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/gzip',
              'User-Agent': 'mmibkr-private-pr-exact-validation-r1',
              'X-MMIBKR-Caller-Run-Id': run_id,
          }

          last = None
          response_headers = None
          for attempt in range(1, 73):
              try:
                  req = Request(url, headers=headers)
                  with urlopen(req, timeout=60) as response:
                      response_headers = dict(response.headers.items())
                      with archive_path.open('wb') as out:
                          shutil.copyfileobj(response, out, length=1024 * 1024)
                  last = None
                  break
              except HTTPError as exc:
                  body = exc.read(2048).decode('utf-8', 'replace')
                  last = f'HTTP {exc.code}: {body[:300]}'
                  if exc.code not in {401, 403, 502, 503}:
                      raise
                  if attempt % 12 == 0:
                      print(f'FLEET_PRIVATE_PR_VALIDATION_WAIT attempt={attempt} last={last}')
                  time.sleep(5)
          else:
              raise SystemExit('Fleet exact-source admission did not converge: ' + str(last))

          if response_headers is None or not archive_path.is_file():
              raise SystemExit('private archive response missing')

          normalized = {str(k).lower(): str(v) for k, v in response_headers.items()}
          if normalized.get('x-mmibkr-source-sha') != source_sha:
              raise SystemExit('Fleet source SHA response mismatch')
          if normalized.get('x-mmibkr-private-source-token-exposed') != 'false':
              raise SystemExit('private source token exposure contract violated')
          stream_id = normalized.get('x-mmibkr-source-stream-id', '')
          if not stream_id:
              raise SystemExit('Fleet source stream id missing')

          digest = hashlib.sha256()
          archive_bytes = 0
          with archive_path.open('rb') as fh:
              while True:
                  chunk = fh.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  archive_bytes += len(chunk)
          archive_sha = digest.hexdigest()
          if archive_bytes <= 0:
              raise SystemExit('private archive empty')

          token = oidc_token()
          attestation = {
              'schema': 'mmibkr-fleet-private-source-attest-v1',
              'source_sha': source_sha,
              'stream_id': stream_id,
              'archive_sha256': archive_sha,
              'archive_bytes': archive_bytes,
          }
          req = Request(
              base + '/v1/source-vault/private-archive/attest',
              data=json.dumps(attestation, sort_keys=True, separators=(',', ':')).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'mmibkr-private-pr-exact-validation-r1',
                  'X-MMIBKR-Caller-Run-Id': run_id,
              },
          )
          with urlopen(req, timeout=30) as response:
              attest_node = json.load(response)
          if (
              attest_node.get('ok') is not True
              or attest_node.get('source_sha') != source_sha
              or attest_node.get('archive_sha256') != archive_sha
              or int(attest_node.get('archive_bytes') or 0) != archive_bytes
              or attest_node.get('private_source_token_exposed') is not False
          ):
              raise SystemExit('Fleet private-source attestation contract failed')

          extract_root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('private archive has no members')
              top = {Path(member.name).parts[0] for member in members if Path(member.name).parts}
              if len(top) != 1:
                  raise SystemExit('private archive must contain one root')
              root_name = next(iter(top))
              root = (extract_root / root_name).resolve()
              files = 0
              total = 0
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts:
                      raise SystemExit('unsafe private archive path')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit('private archive special member rejected')
                  target = (extract_root / path).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit('private archive path escape')
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  if not member.isfile():
                      raise SystemExit('private archive non-file member rejected')
                  files += 1
                  total += int(member.size or 0)
                  if files > 30000 or total > 500 * 1024 * 1024:
                      raise SystemExit('private archive expansion rejected')
                  handle = tf.extractfile(member)
                  if handle is None:
                      raise SystemExit('private archive member unreadable')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open('wb') as out:
                      shutil.copyfileobj(handle, out, length=1024 * 1024)

          if not (root / 'Dockerfile.bot').is_file():
              raise SystemExit('exact private source missing Dockerfile.bot')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('PRIVATE_SOURCE_ROOT=' + str(root) + '\n')
              fh.write('PRIVATE_ARCHIVE_SHA256=' + archive_sha + '\n')
              fh.write('PRIVATE_ARCHIVE_BYTES=' + str(archive_bytes) + '\n')

          print('MMIBKR_PRIVATE_PR_SOURCE_SHA=' + source_sha)
          print('MMIBKR_PRIVATE_PR_ARCHIVE_SHA256=' + archive_sha)
          print('MMIBKR_PRIVATE_PR_ARCHIVE_BYTES=' + str(archive_bytes))
          print('MMIBKR_PRIVATE_SOURCE_TOKEN_EXPOSED=0')
          PY

      - name: Build exact private bot image for PR 668 validation
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot" \
            --target bot \
            -t "mmibkr-private-pr668-validation:$GITHUB_RUN_ID" \
            "$PRIVATE_SOURCE_ROOT" >/dev/null
          echo "MMIBKR_PRIVATE_PR668_EXACT_IMAGE_READY=1"

      - name: Validate exact private PR 668 operator backend contracts
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mmibkr-private-pr668-backend.log"
          set +e
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENABLE_LIVE_TRADING=0 \
            "mmibkr-private-pr668-validation:$GITHUB_RUN_ID" \
            python -m unittest -v \
              tests.test_cloud_operator_snapshot_v1 \
              tests.test_crw_operator_context_projection_v1 \
            >"$log" 2>&1
          rc=$?
          set -e
          log_sha="$(sha256sum "$log" | awk '{print $1}')"
          log_bytes="$(wc -c < "$log")"
          if [ "$rc" -ne 0 ]; then
            python - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          safe = []
          for raw in Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines():
              line = raw.strip()
              if re.match(r"^test_[A-Za-z0-9_]+ \([^)]*\) \.\.\. (ok|FAIL|ERROR)$", line):
                  safe.append(line)
              elif re.match(r"^(FAIL|ERROR): test_[A-Za-z0-9_]+ \([^)]*\)$", line):
                  safe.append(line)
              elif re.match(r"^Ran [0-9]+ tests? in ", line):
                  safe.append(re.sub(r" in .*$", "", line))
              elif line.startswith("FAILED (") or line == "OK":
                  safe.append(line)
              elif re.match(r"^[A-Za-z][A-Za-z0-9_]*(Error|Exception):", line):
                  safe.append(line.split(":", 1)[0])
          for item in safe[-40:]:
              print("MMIBKR_PRIVATE_PR_SAFE_DIAGNOSTIC=" + item)
          PY
            echo "MMIBKR_PRIVATE_PR_EXACT_VALIDATION_STATUS=FAIL"
            echo "MMIBKR_PRIVATE_PR_VALIDATION_SCOPE=pr668_operator_backend_exact_bot_image"
            echo "MMIBKR_PRIVATE_PR_VALIDATION_LOG_SHA256=$log_sha"
            echo "MMIBKR_PRIVATE_PR_VALIDATION_LOG_BYTES=$log_bytes"
            echo "MMIBKR_PRIVATE_PLAINTEXT_PUBLISHED=0"
            rm -f "$log"
            exit "$rc"
          fi
          rm -f "$log"
          echo "MMIBKR_PRIVATE_PR668_BACKEND_STATUS=PASS"
          echo "MMIBKR_PRIVATE_PR668_BACKEND_LOG_SHA256=$log_sha"
          echo "MMIBKR_PRIVATE_PR668_BACKEND_LOG_BYTES=$log_bytes"

      - name: Validate exact private PR 668 Bot Console acceptance and production build
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mmibkr-private-pr668-ui.log"
          ui="$PRIVATE_SOURCE_ROOT/ui-react"
          set +e
          (
            cd "$ui"
            npm ci --ignore-scripts --no-audit --no-fund
            npm run verify:bot-console
            npm run build
            test -s dist/index.html
          ) >"$log" 2>&1
          rc=$?
          set -e
          log_sha="$(sha256sum "$log" | awk '{print $1}')"
          log_bytes="$(wc -c < "$log")"
          rm -f "$log"
          if [ "$rc" -ne 0 ]; then
            echo "MMIBKR_PRIVATE_PR_EXACT_VALIDATION_STATUS=FAIL"
            echo "MMIBKR_PRIVATE_PR_VALIDATION_SCOPE=pr668_bot_console_ui"
            echo "MMIBKR_PRIVATE_PR_VALIDATION_LOG_SHA256=$log_sha"
            echo "MMIBKR_PRIVATE_PR_VALIDATION_LOG_BYTES=$log_bytes"
            echo "MMIBKR_PRIVATE_PLAINTEXT_PUBLISHED=0"
            exit "$rc"
          fi
          echo "MMIBKR_PRIVATE_PR668_UI_STATUS=PASS"
          echo "MMIBKR_PRIVATE_PR668_UI_LOG_SHA256=$log_sha"
          echo "MMIBKR_PRIVATE_PR668_UI_LOG_BYTES=$log_bytes"
          echo "MMIBKR_PRIVATE_PLAINTEXT_PUBLISHED=0"

      - name: Emit sanitized validation receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          receipt = {
              'schema': 'mmibkr.private_pr_exact_validation_receipt.v1',
              'status': 'PASS',
              'source_sha': os.environ['PRIVATE_SOURCE_SHA'],
              'source_archive_sha256': os.environ['PRIVATE_ARCHIVE_SHA256'],
              'source_archive_bytes': int(os.environ['PRIVATE_ARCHIVE_BYTES']),
              'pr668_operator_backend_contracts': True,
              'pr668_bot_console_acceptance': True,
              'vite_production_build': True,
              'exact_bot_image': True,
              'private_source_token_exposed': False,
              'private_plaintext_published': False,
              'broker_credentials_used': False,
              'broker_request_made': False,
              'broker_action': False,
              'runtime_authority_changed': False,
              'live_trading_allowed': False,
          }
          print('MMIBKR_PRIVATE_PR_EXACT_VALIDATION_RECEIPT=' + json.dumps(receipt, sort_keys=True))
          PY

      - name: Destroy one-run private source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "mmibkr-private-pr668-validation:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          sudo rm -rf \
            "$RUNNER_TEMP/mmibkr-private-pr-validation" \
            "$RUNNER_TEMP/mmibkr-private-pr-validation.tar.gz"
          test ! -e "$RUNNER_TEMP/mmibkr-private-pr-validation"
          test ! -e "$RUNNER_TEMP/mmibkr-private-pr-validation.tar.gz"
          echo 'MMIBKR_PRIVATE_PR_PLAINTEXT_DESTROYED=1'
