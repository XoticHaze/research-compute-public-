name: P423 P305 DBMF Coverage R2
on:
  pull_request:
    paths:
      - 'research/p423_p305_dbmf_coverage_r2.py'
      - '.github/workflows/p423-p305-dbmf-coverage-r2.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: preflight
        name: Performance-blind coverage preflight
        run: |
          python research/p423_p305_dbmf_coverage_r2.py --mode preflight
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/p423_p305_dbmf_coverage_plan.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('eligible='+str(bool(x['coverage_eligible'])).lower()+'\n')
          PY
      - id: result
        name: Evaluate unchanged challenger only after coverage passes
        run: |
          python research/p423_p305_dbmf_coverage_r2.py --mode evaluate
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/p423_p305_dbmf_coverage_r2.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p423-p305-dbmf-coverage-r2__${{ steps.result.outputs.decision }}
          path: research/artifacts/p423_p305_dbmf_*
          if-no-files-found: error
