name: MM-IBKR Legacy Live Owner Fire Retired (Contract Only)

# Historical push marker asserted operator approval in its own JSON and
# invoked gh workflow run without independent authorization or exact inputs.
# The marker is absent from current main. The canonical selected owner has
# a separate current explicit workflow_dispatch and guarded admission route.
# Do not resurrect this parallel launcher or a fresh IB Key login trigger.
on:
  pull_request:
    paths:
      - .github/workflows/mmibkr-selected-runtime-live-owner-fire-r1.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify legacy owner push-fire route is retired
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/mmibkr-selected-runtime-live-owner-fire-r1.yml').read_text()
          lines=s.splitlines()
          assert not any(line == '  push:' for line in lines)
          assert not any(line == '  dispatch:' for line in lines)
          assert not any(line.strip().startswith('gh workflow run') for line in lines)
          assert not any(line.strip() == 'actions: write' for line in lines)
          assert 'on:\n  pull_request:' in s
          print('LEGACY_LIVE_OWNER_PUSH_FIRE_RETIRED=PASS')
          PY
