name: MM-IBKR Canonical Live Owner Fire R1

# Existing GitHub rendezvous/fire mechanism: transport only, no broker action.
on:
  pull_request:
    paths:
      - .github/workflows/mmibkr-selected-runtime-live-owner-fire-r1.yml
  push:
    branches: [main]
    paths:
      - rendezvous/fire/mmibkr-selected-runtime-live-owner-r1

permissions:
  contents: read
  actions: write

concurrency:
  group: mmibkr-canonical-live-owner-fire-r1
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require exact preapproved three-selected-runtime fire
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('rendezvous/fire/mmibkr-selected-runtime-live-owner-r1')
          req=json.loads(p.read_text())
          assert req['schema']=='mmibkr.live_canonical_owner_dispatch.v1'
          assert req['private_source_sha']=='1ad9fbee1b2257c4040d3a82e71177988ca4a22f'
          assert req['selected_symbols']==['AMAT','APH','MNQ']
          assert req['operator_live_activation_approved'] is True
          assert req['force_trade'] is False
          assert req['new_order_route'] is False
          print('EXACT_APPROVED_LIVE_OWNER_FIRE=1')
          PY
      - name: Dispatch the one canonical live owner workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mmibkr-selected-runtime-live-owner-r1.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CANONICAL_LIVE_OWNER_DISPATCH_REQUESTED=1'

  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prove fire dispatch cannot run on PR
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/mmibkr-selected-runtime-live-owner-fire-r1.yml').read_text()
          assert "if: github.event_name == 'push'" in text
          assert "if: github.event_name == 'pull_request'" in text
          assert 'gh workflow run mmibkr-selected-runtime-live-owner-r1.yml' in text
          print('LIVE_OWNER_DISPATCH_CONTRACT_PASS=1')
          PY
