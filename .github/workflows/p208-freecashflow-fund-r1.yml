name: P208 Free Cash Flow Fund R1
on:
  pull_request:
    paths:
      - 'research/p208_freecashflow_fund_r1.py'
      - '.github/workflows/p208-freecashflow-fund-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p208_freecashflow_fund_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p208_freecashflow_fund_r1.json')); a=x['tests']['2018']; b=x['tests']['2020']; c=x['tests']['2022']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__v18_{bp(a['cowz_minus_iwd'])}__s18_{bp(a['cowz_minus_spy'])}__v20_{bp(b['cowz_minus_iwd'])}__s20_{bp(b['cowz_minus_spy'])}__v22_{bp(c['cowz_minus_iwd'])}__s22_{bp(c['cowz_minus_spy'])}__fv_{a['positive_iwd_folds']}__fs_{a['positive_spy_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p208-freecashflow-fund__${{ steps.eval.outputs.tag }}
          path: artifacts/p208_freecashflow_fund_r1.json
          if-no-files-found: error