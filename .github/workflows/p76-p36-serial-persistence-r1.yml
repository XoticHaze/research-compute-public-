name: P76 P36 Serial Persistence R1
on:
  pull_request:
    paths:
      - 'research/p76_p36_serial_persistence_r1.py'
      - '.github/workflows/p76-p36-serial-persistence-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p76_p36_serial_persistence_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p76-p36-serial-persistence-r1
          path: artifacts/p76_p36_serial_persistence_r1.json
          if-no-files-found: error
