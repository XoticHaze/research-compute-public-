name: P105 Country LowVol R1
on:
  pull_request:
    paths:
      - 'research/p105_country_lowvol_r1.py'
      - '.github/workflows/p105-country-lowvol-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p105_country_lowvol_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p105_country_lowvol_r1.json')); t=x['tests']['2020_forward']['costs']['50']; vals={'decision':x['decision'],'matched':f"{100*t['excess_vs_matched_cagr']:.2f}",'spy':f"{100*t['excess_vs_spy_cagr']:.2f}",'folds':str(t['positive_matched_folds'])}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in vals.items(): f.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p105-country-lowvol__${{ steps.evaluate.outputs.decision }}__matched_${{ steps.evaluate.outputs.matched }}pp__SPY_${{ steps.evaluate.outputs.spy }}pp__folds_${{ steps.evaluate.outputs.folds }}of5
          path: artifacts/p105_country_lowvol_r1.json
          if-no-files-found: error
