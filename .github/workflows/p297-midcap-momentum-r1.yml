name: P297 Midcap Momentum R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p297_midcap_momentum_r1.py'
      - '.github/workflows/p297-midcap-momentum-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p297_midcap_momentum_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p297_midcap_momentum_r1.json')); z=x['results']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__2015_{bp(z['2015']['matched_excess_cagr'])}_{z['2015']['positive_matched_folds']}__2020_{bp(z['2020']['matched_excess_cagr'])}__2022_{bp(z['2022']['matched_excess_cagr'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p297-midcap-momentum__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p297_midcap_momentum_r1.json
          if-no-files-found: error
