name: P171 Sector 12M1M Momentum R1
on:
  pull_request:
    paths:
      - 'research/p171_sector_12m1m_momentum_r1.py'
      - '.github/workflows/p171-sector-12m1m-momentum-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p171_sector_12m1m_momentum_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p171_sector_12m1m_momentum_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"decision={x['decision']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p171-sector-12m1m__${{ steps.run.outputs.decision }}
          path: artifacts/p171_sector_12m1m_momentum_r1.json
          if-no-files-found: error
