name: Cybersecurity Stage-A Source Audit
on:
  push:
    paths: ['.github/workflows/cybersecurity-stagea-source-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Audit frozen source panel without model outcomes
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py'); r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          panel=['PANW','CRWD','FTNT','ZS','OKTA','CYBR','S','GEN']; required=[*r.TRAIN,*panel,'QQQ','CIBR']
          source={}; frames={}
          for s in required:
            try:
              f=r._load(s); frames[s]=f; source[s]={'status':'OK','rows':len(f),'start':f.iloc[0].timestamp.isoformat() if len(f) else None,'end':f.iloc[-1].timestamp.isoformat() if len(f) else None}
            except Exception as e: source[s]={'status':'ERROR','error':f'{type(e).__name__}: {e}'}
          common=None
          for s,f in frames.items(): common=set(f.timestamp) if common is None else common & set(f.timestamp)
          out={'schema':'cybersecurity_stagea_source_audit.v1','panel':panel,'source':source,'common_rows_across_successful_loads':len(common or []),'model_evaluated':False,'research_only':True}
          open('cybersecurity-stagea-source-audit.json','w').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cybersecurity-stagea-source-audit
          path: cybersecurity-stagea-source-audit.json
          retention-days: 14
