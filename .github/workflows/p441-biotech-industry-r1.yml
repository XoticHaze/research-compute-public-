name: P441 Biotech Industry R1
on:
  pull_request:
    paths: ['research/p441_biotech_industry_r1.py','.github/workflows/p441-biotech-industry-r1.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet yfinance pandas numpy
      - id: result
        run: |
          python research/p441_biotech_industry_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p441_biotech_industry_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p441-biotech-industry__${{ steps.result.outputs.decision }}
          path: research/artifacts/p441_biotech_industry_r1.json
          if-no-files-found: error
