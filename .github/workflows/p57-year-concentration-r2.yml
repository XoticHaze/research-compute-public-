name: P57 Year Concentration R2
on:
  pull_request:
    paths:
      - 'research/p57_year_concentration_r2.py'
      - '.github/workflows/p57-year-concentration-r2.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p57_year_concentration_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: p57-year-concentration-r2
          path: artifacts/p57_year_concentration_r2.json
          if-no-files-found: error
