name: IBKR OIDC Claim Diagnostic R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ibkr-oidc-claim-diagnostic-r1.yml'

permissions:
  contents: read
  id-token: write

jobs:
  inspect-claims:
    runs-on: ubuntu-24.04
    steps:
      - name: Print non-secret GitHub OIDC identity claims
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mmibkr-fleet-authority")"
          TOKEN_JSON="$token_json" python -c 'import base64,json,os; node=json.loads(os.environ["TOKEN_JSON"]); token=node["value"]; parts=token.split("."); p=parts[1]+"="*(-len(parts[1])%4); claims=json.loads(base64.urlsafe_b64decode(p).decode()); allow=["iss","aud","repository","repository_visibility","runner_environment","ref","workflow_ref","workflow_sha","event_name","run_id","run_attempt"]; print("OIDC_CLAIMS="+json.dumps({k:claims.get(k) for k in allow},sort_keys=True))'
