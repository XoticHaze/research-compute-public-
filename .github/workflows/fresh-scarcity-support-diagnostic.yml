name: Fresh Scarcity Support Diagnostic

on:
  pull_request:
    paths:
      - 'research/fresh_scarcity_confirmation_20260905.py'
      - 'research/fresh_scarcity_support_diagnostic_20260905.py'
      - '.github/workflows/fresh-scarcity-support-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute fresh-cohort training-support diagnostic
        run: PYTHONPATH=. python -m research.fresh_scarcity_support_diagnostic_20260905
      - name: Retain support diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-scarcity-support-diagnostic
          path: fresh_scarcity_support_diagnostic_20260905.json
          if-no-files-found: error
          retention-days: 14
