name: P308 Momentum Small Value Head To Head R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p308_momentum_smallvalue_headtohead_r1.py'
      - '.github/workflows/p308-momentum-smallvalue-headtohead-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p308_momentum_smallvalue_headtohead_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p308_momentum_smallvalue_headtohead_r1.json'))
          tag=x['decision']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p308-momentum-smallvalue-headtohead__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p308_momentum_smallvalue_headtohead_r1.json
          if-no-files-found: error
