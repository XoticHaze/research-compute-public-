name: P79 Expanding Nonlinear Cross Universe R1
on:
  pull_request:
    paths:
      - 'research/p79_expanding_nonlinear_cross_universe_r1.py'
      - '.github/workflows/p79-expanding-nonlinear-cross-universe-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65 scikit-learn==1.7.2
      - run: python research/p79_expanding_nonlinear_cross_universe_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p79-expanding-nonlinear-cross-universe-r1
          path: artifacts/p79_expanding_nonlinear_cross_universe_r1.json
          if-no-files-found: error
