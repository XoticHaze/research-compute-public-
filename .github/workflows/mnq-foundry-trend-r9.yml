name: MNQ Foundry Individual Contract Trend R9
on:
  pull_request:
    paths:
      - 'research/mnq_foundry_trend_r9.py'
      - '.github/workflows/mnq-foundry-trend-r9.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==1.26.4 pandas==2.2.3 pyarrow==17.0.0
      - name: Fetch pinned Foundry source authority
        run: |
          rm -rf /tmp/research-foundry
          git clone --filter=blob:none --no-checkout https://github.com/XoticHaze/research-foundry.git /tmp/research-foundry
          cd /tmp/research-foundry
          git checkout eafe3cb8f62855b4321cb16f96b3887b85710cbd
          test -f src/foundry_mm_ml/external_mnq_training.py
      - name: Fetch pinned MNQ individual contract trade bars
        run: |
          rm -rf /tmp/mnq-source
          git clone --filter=blob:none --no-checkout https://github.com/mbytes21/MNQ_DATA.git /tmp/mnq-source
          cd /tmp/mnq-source
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone 'plaintext_csv/MNQ */*.Last.csv'
          git checkout fc5508e2c152938d6d9eb70a36b888ae26107176
          test -f 'plaintext_csv/MNQ 06-19/20190505.Last.csv'
      - name: Execute frozen individual-contract trend test
        env:
          FOUNDRY_SRC: /tmp/research-foundry/src
          MNQ_SOURCE_ROOT: /tmp/mnq-source/plaintext_csv
        run: python research/mnq_foundry_trend_r9.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mnq-foundry-individual-contract-trend-r9
          path: mnq_foundry_trend_r9.json
          if-no-files-found: error
          retention-days: 90
