name: P46 SPY Identity Validation R1
on:
  pull_request:
    paths:
      - 'research/p46_spy_identity_validation_r1.py'
      - '.github/workflows/p46-spy-identity-validation-r1.yml'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 openpyxl==3.1.5
      - run: python research/p46_spy_identity_validation_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p46-spy-identity-validation-r1
          path: artifacts/p46_spy_identity_validation_r1.json
          if-no-files-found: error
