name: MTUM Beta Adjusted Alpha R1
on:
  pull_request:
    paths:
      - '.github/workflows/mtum-beta-alpha-r1.yml'
      - 'research/mtum-beta-alpha-r1.json'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Evaluate frozen beta-adjusted momentum alpha
        run: |
          python - <<'PY'
          import json,urllib.request,datetime as dt,math
          from pathlib import Path
          c=json.loads(Path('research/mtum-beta-alpha-r1.json').read_text()); start=dt.datetime.fromisoformat(c['start']+'T00:00:00+00:00'); end=dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=1)
          def fetch(s):
              u=f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?period1={int(start.timestamp())}&period2={int(end.timestamp())}&interval=1d&events=history&includeAdjustedClose=true"; req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as q:o=json.load(q)['chart']['result'][0]
              a=o['indicators'].get('adjclose',[{}])[0].get('adjclose') or o['indicators']['quote'][0]['close']; return {dt.datetime.fromtimestamp(t,dt.timezone.utc).date().isoformat():float(p) for t,p in zip(o['timestamp'],a) if p is not None}
          px={s:fetch(s) for s in ['MTUM','IWB']}; ds=sorted(set(px['MTUM'])&set(px['IWB'])); assert len(ds)>2500
          months={}
          for d in ds: months.setdefault(d[:7],[]).append(d)
          rows=[]
          for m,z in sorted(months.items()):
              if len(z)<10:continue
              a=px['MTUM'][z[-1]]/px['MTUM'][z[0]]-1; b=px['IWB'][z[-1]]/px['IWB'][z[0]]-1; rows.append((m,a,b))
          def ols(z):
              n=len(z); ys=[x[1] for x in z]; xs=[x[2] for x in z]; xb=sum(xs)/n; yb=sum(ys)/n; sxx=sum((x-xb)**2 for x in xs); beta=sum((x-xb)*(y-yb) for x,y in zip(xs,ys))/sxx; alpha=yb-beta*xb; resid=[y-alpha-beta*x for x,y in zip(xs,ys)]; s2=sum(e*e for e in resid)/(n-2); se_alpha=math.sqrt(s2*(1/n+xb*xb/sxx)); t=alpha/se_alpha; return {'months':n,'alpha_monthly':alpha,'alpha_annualized_arithmetic':alpha*12,'beta':beta,'alpha_tstat':t,'mean_mtum_monthly':yb,'mean_iwb_monthly':xb}
          periods={}
          for k,(lo,hi) in c['periods'].items(): periods[k]=ols([x for x in rows if x[0]>=lo and (hi is None or x[0]<hi)])
          g=c['gates']; out={'schema':'mtum_beta_alpha_result.v1','periods':periods,'gates':g}
          out['beta_adjusted_edge_supported']=(periods['full']['alpha_annualized_arithmetic']>=g['min_full_alpha'] and periods['pre2020']['alpha_annualized_arithmetic']>=g['min_pre2020_alpha'] and periods['post2020']['alpha_annualized_arithmetic']>=g['min_post2020_alpha'] and periods['full']['alpha_tstat']>=g['min_full_alpha_tstat']); out['research_only']=True
          Path('mtum-beta-alpha-r1-result.json').write_text(json.dumps(out,sort_keys=True,indent=2)); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: mtum-beta-alpha-r1-result, path: mtum-beta-alpha-r1-result.json, retention-days: 14}
