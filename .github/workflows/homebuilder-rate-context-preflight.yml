name: Homebuilder Rate Context Preflight

on:
  pull_request:
    paths:
      - 'research/homebuilder_rate_context_preflight_20260905.py'
      - '.github/workflows/homebuilder-rate-context-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Execute causal source preflight
        run: python research/homebuilder_rate_context_preflight_20260905.py
      - name: Retain preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebuilder-rate-context-preflight
          path: homebuilder_rate_context_preflight_20260905.json
          if-no-files-found: error
          retention-days: 14
