name: P29 PIT Survivorship Validation
on:
  pull_request:
    paths:
      - 'research/p29_pit_p28_independent_validation_20260908.py'
      - '.github/workflows/p29-pit-survivorship-validation.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
          python -m pip install --disable-pip-version-check -q 'git+https://github.com/arielNacamulli/pitindex.git@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - name: Execute frozen P29 PIT validation
        run: python research/p29_pit_p28_independent_validation_20260908.py --child p29 --out p29-pit-survivorship-validation-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p29-pit-survivorship-validation-${{ github.run_id }}
          path: p29-pit-survivorship-validation-receipt.json
          if-no-files-found: error
          retention-days: 30
