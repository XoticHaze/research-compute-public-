name: Opportunity Biotech Prior Edge Capacity Allocator

on:
  pull_request:
    paths:
      - 'research/opportunity_biotech_prior_edge_capacity_allocator_20260907.py'
      - '.github/workflows/opportunity-biotech-prior-edge-capacity-allocator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install exact numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Restore accepted Stage-A adapter
        run: |
          mkdir -p .campaign
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o .campaign/runner.py
          python -m py_compile .campaign/runner.py research/opportunity_biotech_prior_edge_capacity_allocator_20260907.py
      - name: Execute fold-causal ticker allocation consumer
        run: python research/opportunity_biotech_prior_edge_capacity_allocator_20260907.py
      - name: Retain research receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opportunity-biotech-prior-edge-capacity-allocator
          path: opportunity_biotech_prior_edge_capacity_allocator_20260907.json
          retention-days: 30
          if-no-files-found: warn
