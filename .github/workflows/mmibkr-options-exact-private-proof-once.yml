name: MMIBKR Options Exact Private Proof Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mmibkr-options-exact-private-proof-once.yml'

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  MMIBKR_SOURCE_SHA: 39095b6e2822eb84263db283ea3d60f4a0b33e17
  PYTEST_VERSION: 8.4.2

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Materialize exact private MM source through bounded Fleet stream
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import hashlib, json, os, shutil, tarfile, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from urllib.request import Request, urlopen

          base=os.environ["FLEET_AUTHORITY_BASE"].rstrip("/")
          source_sha=os.environ["MMIBKR_SOURCE_SHA"].strip().lower()
          run_id=os.environ["GITHUB_RUN_ID"]
          temp=Path(os.environ["RUNNER_TEMP"])
          archive=temp/"mmibkr-options-proof.tar.gz"
          extract=temp/"mmibkr-options-proof-source"

          if len(source_sha)!=40 or any(ch not in "0123456789abcdef" for ch in source_sha):
              raise SystemExit("invalid exact private source sha")

          def oidc():
              parsed=urlparse(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
              q=dict(parse_qsl(parsed.query,keep_blank_values=True))
              q["audience"]="mmibkr-fleet-authority"
              url=urlunparse((parsed.scheme,parsed.netloc,parsed.path,parsed.params,urlencode(q),parsed.fragment))
              req=Request(url,headers={
                  "Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
                  "Accept":"application/json",
              })
              with urlopen(req,timeout=20) as response:
                  token=str(json.load(response).get("value") or "")
              if token.count(".")!=2:
                  raise RuntimeError("OIDC token invalid")
              return token

          url=f"{base}/v1/source-vault/private-archive/{source_sha}"
          headers={
              "Authorization":"Bearer "+oidc(),
              "Accept":"application/gzip",
              "User-Agent":"mmibkr-options-exact-private-proof-once",
              "X-MMIBKR-Caller-Run-Id":run_id,
          }
          response_headers=None
          last=None
          for attempt in range(1,73):
              try:
                  with urlopen(Request(url,headers=headers),timeout=60) as response:
                      response_headers=dict(response.headers.items())
                      with archive.open("wb") as out:
                          shutil.copyfileobj(response,out,length=1024*1024)
                  last=None
                  break
              except HTTPError as exc:
                  body=exc.read(1024).decode("utf-8","replace")
                  last=f"HTTP {exc.code}: {body[:240]}"
                  if exc.code not in {401,403,502,503}:
                      raise
                  if attempt % 12 == 0:
                      print(f"MMIBKR_OPTIONS_SOURCE_WAIT={attempt}")
                  time.sleep(5)
          else:
              raise SystemExit("exact private source admission did not converge: "+str(last))

          normalized={str(k).lower():str(v) for k,v in (response_headers or {}).items()}
          if normalized.get("x-mmibkr-source-sha") != source_sha:
              raise SystemExit("source sha response mismatch")
          if normalized.get("x-mmibkr-private-source-token-exposed") != "false":
              raise SystemExit("source token exposure contract violated")
          stream_id=normalized.get("x-mmibkr-source-stream-id","")
          if not stream_id:
              raise SystemExit("source stream id missing")

          digest=hashlib.sha256()
          size=0
          with archive.open("rb") as fh:
              while True:
                  chunk=fh.read(1024*1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  size+=len(chunk)
          archive_sha=digest.hexdigest()
          if size<=0:
              raise SystemExit("private archive empty")

          att={
              "schema":"mmibkr-fleet-private-source-attest-v1",
              "source_sha":source_sha,
              "stream_id":stream_id,
              "archive_sha256":archive_sha,
              "archive_bytes":size,
          }
          req=Request(
              base+"/v1/source-vault/private-archive/attest",
              data=json.dumps(att,sort_keys=True,separators=(",",":")).encode(),
              method="POST",
              headers={
                  "Authorization":"Bearer "+oidc(),
                  "Accept":"application/json",
                  "Content-Type":"application/json",
                  "User-Agent":"mmibkr-options-exact-private-proof-once",
                  "X-MMIBKR-Caller-Run-Id":run_id,
              },
          )
          with urlopen(req,timeout=30) as response:
              node=json.load(response)
          if (
              node.get("ok") is not True
              or node.get("source_sha") != source_sha
              or node.get("archive_sha256") != archive_sha
              or int(node.get("archive_bytes") or 0) != size
              or node.get("private_source_token_exposed") is not False
          ):
              raise SystemExit("source attestation failed")

          extract.mkdir(parents=True,exist_ok=True)
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
              tops={Path(m.name).parts[0] for m in members if Path(m.name).parts}
              if len(tops)!=1:
                  raise SystemExit("private archive root invalid")
              root=(extract/next(iter(tops))).resolve()
              files=0
              total=0
              for member in members:
                  path=Path(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit("unsafe private archive member")
                  target=(extract/path).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit("private archive escape")
                  if member.isdir():
                      target.mkdir(parents=True,exist_ok=True)
                      continue
                  if not member.isfile():
                      raise SystemExit("private archive member type rejected")
                  files+=1
                  total+=int(member.size or 0)
                  if files>30000 or total>500*1024*1024:
                      raise SystemExit("private archive expansion rejected")
                  handle=tf.extractfile(member)
                  if handle is None:
                      raise SystemExit("private archive member unreadable")
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open("wb") as out:
                      shutil.copyfileobj(handle,out,length=1024*1024)

          if not (root/"Dockerfile.bot").is_file():
              raise SystemExit("exact private source missing Dockerfile.bot")
          with Path(os.environ["GITHUB_ENV"]).open("a",encoding="utf-8") as fh:
              fh.write("MMIBKR_SOURCE_ROOT="+str(root)+"\n")
              fh.write("MMIBKR_SOURCE_ARCHIVE_SHA256="+archive_sha+"\n")
          print("MMIBKR_OPTIONS_EXACT_SOURCE_READY=1")
          print("MMIBKR_OPTIONS_SOURCE_SHA="+source_sha)
          print("MMIBKR_PRIVATE_SOURCE_TOKEN_EXPOSED=0")
          PY

      - name: Build canonical MM bot image
        id: build
        shell: bash
        run: |
          set +e
          docker build             -f "$MMIBKR_SOURCE_ROOT/Dockerfile.bot"             --target bot             -t "mmibkr-options-proof:${GITHUB_RUN_ID}"             "$MMIBKR_SOURCE_ROOT"             > "$RUNNER_TEMP/mmibkr-options-build.log" 2>&1
          rc=$?
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mmibkr-options-build.log"
          raw=p.read_bytes()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a",encoding="utf-8") as fh:
              fh.write("output_sha256="+hashlib.sha256(raw).hexdigest()+"\n")
              fh.write("output_bytes="+str(len(raw))+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Build fixed pytest layer
        id: pytest_image
        shell: bash
        run: |
          set +e
          cat > "$RUNNER_TEMP/Dockerfile.options-pytest" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG PYTEST_VERSION
          RUN python -m pip install --no-cache-dir --disable-pip-version-check pytest==${PYTEST_VERSION}
          EOF
          docker build             -f "$RUNNER_TEMP/Dockerfile.options-pytest"             --build-arg "BASE_IMAGE=mmibkr-options-proof:${GITHUB_RUN_ID}"             --build-arg "PYTEST_VERSION=$PYTEST_VERSION"             -t "mmibkr-options-proof:${GITHUB_RUN_ID}-pytest"             "$RUNNER_TEMP"             > "$RUNNER_TEMP/mmibkr-options-pytest-image.log" 2>&1
          rc=$?
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mmibkr-options-pytest-image.log"
          raw=p.read_bytes()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a",encoding="utf-8") as fh:
              fh.write("output_sha256="+hashlib.sha256(raw).hexdigest()+"\n")
              fh.write("output_bytes="+str(len(raw))+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Execute exact Options research regressions
        id: tests
        shell: bash
        run: |
          set +e
          docker run --rm             -e ENABLE_LIVE_TRADING=0             -e PYTHONDONTWRITEBYTECODE=1             "mmibkr-options-proof:${GITHUB_RUN_ID}-pytest"             python -m pytest -q               tests/test_options_snapshot_analysis.py               tests/test_options_snapshot_features.py             > "$RUNNER_TEMP/mmibkr-options-tests.log" 2>&1
          rc=$?
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mmibkr-options-tests.log"
          raw=p.read_bytes()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a",encoding="utf-8") as fh:
              fh.write("output_sha256="+hashlib.sha256(raw).hexdigest()+"\n")
              fh.write("output_bytes="+str(len(raw))+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Write sanitized exact-private receipt
        if: always()
        shell: bash
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          BUILD_SHA: ${{ steps.build.outputs.output_sha256 }}
          BUILD_BYTES: ${{ steps.build.outputs.output_bytes }}
          PYTEST_IMAGE_EXIT: ${{ steps.pytest_image.outputs.exit_code }}
          PYTEST_IMAGE_SHA: ${{ steps.pytest_image.outputs.output_sha256 }}
          PYTEST_IMAGE_BYTES: ${{ steps.pytest_image.outputs.output_bytes }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          TEST_SHA: ${{ steps.tests.outputs.output_sha256 }}
          TEST_BYTES: ${{ steps.tests.outputs.output_bytes }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def num(name):
              raw=str(os.environ.get(name,"")).strip()
              return None if raw=="" else int(raw)
          receipt={
              "schema":"mmibkr.options_exact_private_proof_once.v1",
              "source_sha":os.environ["MMIBKR_SOURCE_SHA"],
              "source_archive_sha256":os.environ.get("MMIBKR_SOURCE_ARCHIVE_SHA256"),
              "tests":[
                  "tests/test_options_snapshot_analysis.py",
                  "tests/test_options_snapshot_features.py"
              ],
              "build":{"exit_code":num("BUILD_EXIT"),"captured_output_sha256":os.environ.get("BUILD_SHA") or None,"captured_output_bytes":num("BUILD_BYTES")},
              "pytest_image":{"exit_code":num("PYTEST_IMAGE_EXIT"),"captured_output_sha256":os.environ.get("PYTEST_IMAGE_SHA") or None,"captured_output_bytes":num("PYTEST_IMAGE_BYTES")},
              "tests_result":{"exit_code":num("TEST_EXIT"),"captured_output_sha256":os.environ.get("TEST_SHA") or None,"captured_output_bytes":num("TEST_BYTES")},
              "status":"PASS" if num("BUILD_EXIT")==0 and num("PYTEST_IMAGE_EXIT")==0 and num("TEST_EXIT")==0 else "FAIL",
              "authority":{"research_only":True,"private_source_token_emitted":False,"broker_credentials_materialized":False,"broker_action":False,"strategy_spec_write":False,"runtime_activation":False,"promotion_mutation":False,"live_trading":False},
              "sanitization":{"private_plaintext_published":False,"captured_output_published":False,"digest_only":True}
          }
          out=Path(os.environ["RUNNER_TEMP"])/"mmibkr-options-exact-private-receipt.json"
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("MMIBKR_OPTIONS_EXACT_PRIVATE_RECEIPT="+json.dumps(receipt,sort_keys=True,separators=(",",":")))
          PY

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-options-exact-private-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-options-exact-private-receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Destroy private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "mmibkr-options-proof:${GITHUB_RUN_ID}-pytest" >/dev/null 2>&1 || true
          docker image rm "mmibkr-options-proof:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          sudo rm -rf             "$RUNNER_TEMP/mmibkr-options-proof.tar.gz"             "$RUNNER_TEMP/mmibkr-options-proof-source"             "$RUNNER_TEMP/mmibkr-options-build.log"             "$RUNNER_TEMP/mmibkr-options-pytest-image.log"             "$RUNNER_TEMP/mmibkr-options-tests.log"             "$RUNNER_TEMP/Dockerfile.options-pytest"
          echo 'MMIBKR_OPTIONS_EXACT_PRIVATE_MATERIAL_DESTROYED=1'
