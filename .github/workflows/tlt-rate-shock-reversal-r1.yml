name: tlt-rate-shock-reversal-r1
on:
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q yfinance pandas numpy
      - name: Execute current Market Research discriminator
        run: |
          set -o pipefail
          if [ -f research/uup_efa_dollar_regime_r1.py ]; then
            python research/uup_efa_dollar_regime_r1.py | tee market_research_result.txt
          else
            python research/tlt_rate_shock_reversal_r1.py | tee market_research_result.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: market-research-result
          path: market_research_result.txt
