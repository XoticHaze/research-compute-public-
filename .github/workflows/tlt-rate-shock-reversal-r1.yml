name: tlt-rate-shock-reversal-r1
on:
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q yfinance pandas numpy
      - run: set -o pipefail; python research/tlt_rate_shock_reversal_r1.py | tee tlt_rate_shock_reversal_r1_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tlt-rate-shock-reversal-r1-result
          path: tlt_rate_shock_reversal_r1_result.txt
