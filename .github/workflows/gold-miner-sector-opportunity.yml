name: Gold Miner Sector Opportunity

on:
  pull_request:
    paths:
      - '.github/workflows/gold-miner-sector-opportunity.yml'
      - 'research/gold_miner_sector_opportunity_20260907.py'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute sector opportunity discriminator
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/source.py
          test "$(git hash-object /tmp/source.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python research/gold_miner_sector_opportunity_20260907.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-miner-sector-opportunity
          path: /tmp/sector-opportunity.json
