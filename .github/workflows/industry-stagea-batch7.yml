name: Industry Stage-A Batch 7

on:
  push:
    paths:
      - '.github/workflows/industry-stagea-batch7.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: industrial_machinery
            benchmark: XLI
            symbols: DE,ETN,PH,EMR,ITW,ROK,CMI,PCAR
          - family: retail
            benchmark: XRT
            symbols: WMT,TGT,ROST,TJX,BBY,DG,DLTR,AZO
          - family: healthcare_providers
            benchmark: IHF
            symbols: HCA,THC,UHS,CNC,HUM,CI,ELV,CVS
          - family: oilfield_services
            benchmark: OIH
            symbols: SLB,HAL,BKR,NOV,FTI,HP,PTEN,NBR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Execute source-diagnostic frozen Stage-A evaluator
        env:
          FAMILY: ${{ matrix.family }}
          BENCHMARK: ${{ matrix.benchmark }}
          SYMBOLS: ${{ matrix.symbols }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json, os
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          family=os.environ['FAMILY']; benchmark=os.environ['BENCHMARK']; symbols=os.environ['SYMBOLS'].split(',')
          path=f'{family}-stagea-batch7-receipt.json'
          required=[*r.TRAIN,*symbols,'QQQ',benchmark]
          source={}
          frames={}
          for symbol in required:
              try:
                  f=r._load(symbol); frames[symbol]=f
                  source[symbol]={'status':'OK','rows':len(f),'start':f.iloc[0].timestamp.isoformat() if len(f) else None,'end':f.iloc[-1].timestamp.isoformat() if len(f) else None}
              except Exception as exc:
                  source[symbol]={'status':'ERROR','error':f'{type(exc).__name__}: {exc}'}
          errors={k:v for k,v in source.items() if v['status']!='OK'}
          try:
              if errors:
                  raise RuntimeError('source load failures: '+json.dumps(errors,sort_keys=True))
              common=set(frames[required[0]].timestamp)
              for symbol in required[1:]: common &= set(frames[symbol].timestamp)
              if len(common) < 1500:
                  raise RuntimeError(f'insufficient common source calendar={len(common)}')
              cutoff=max(common).isoformat()
              contract={family:{'primary_industry_etf':benchmark,'development_universe':symbols}}
              out=r._evaluate_matrix(contract,cutoff)
              s=out['family_summary'][family]
              receipt={
                'schema':'industry_stagea_batch7.v1','family':family,'benchmark':benchmark,
                'development_universe':symbols,'cutoff':cutoff,'source_support':'SUFFICIENT','source':source,
                'external_holdouts_loaded':False,'family_summary':s,'per_symbol':out['per_symbol'],
                'decision':'ADVANCE' if s['development_family_gate_pass'] else 'REJECT_OR_REARCHITECT',
                'research_only':True,'promotion_authority':False,'allocation_authority':False,
                'runtime_mutation':False,'live_trading_change':False
              }
          except Exception as exc:
              receipt={
                'schema':'industry_stagea_batch7.v1','family':family,'benchmark':benchmark,
                'development_universe':symbols,'source_support':'INSUFFICIENT','source':source,
                'model_result_available':False,'source_error':f'{type(exc).__name__}: {exc}',
                'external_holdouts_loaded':False,'decision':'UNSCORED_SOURCE_FAILURE_NO_SYMBOL_SUBSTITUTION',
                'research_only':True,'promotion_authority':False,'allocation_authority':False,
                'runtime_mutation':False,'live_trading_change':False
              }
          open(path,'w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('INDUSTRY_STAGEA_BATCH7='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagea-batch7-${{ matrix.family }}
          path: ${{ matrix.family }}-stagea-batch7-receipt.json
          retention-days: 14
