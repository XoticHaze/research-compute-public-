name: P444 PIT CIK Temporal Leakage R1
on:
  pull_request:
    paths:
      - 'research/p444_pit_cik_temporal_leakage_r1.py'
      - '.github/workflows/p444-pit-cik-temporal-leakage-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas requests lxml beautifulsoup4 html5lib 'git+https://github.com/arielNacamulli/pitindex@2df030e5c9be7c83cf4b28c3d8597d74d274757e'
      - id: result
        run: |
          python research/p444_pit_cik_temporal_leakage_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p444_pit_cik_temporal_leakage_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p444-pit-cik-temporal-leakage__${{ steps.result.outputs.decision }}
          path: research/artifacts/p444_pit_cik_temporal_leakage_r1.json
          if-no-files-found: error
