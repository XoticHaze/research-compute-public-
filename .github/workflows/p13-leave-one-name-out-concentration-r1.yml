name: P13 Leave One Name Out Concentration R1
on:
  pull_request:
    paths:
      - 'research/p13_leave_one_name_out_concentration_r1.py'
      - '.github/workflows/p13-leave-one-name-out-concentration-r1.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python research/p13_leave_one_name_out_concentration_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_leave_one_name_out_concentration_r1.json')); s=x['summary']; vals={'decision':x['decision'],'rsmh':str(s['recent_positive_vs_smh']),'rraw':str(s['recent_positive_vs_raw']),'fsmh':str(s['full_positive_vs_smh']),'worst':f"{100*s['recent_worst_excess_vs_smh']:.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-loo__${{ steps.evaluate.outputs.decision }}__recentSMH_${{ steps.evaluate.outputs.rsmh }}of10__recentRaw_${{ steps.evaluate.outputs.rraw }}of10__fullSMH_${{ steps.evaluate.outputs.fsmh }}of10__worstRecent_${{ steps.evaluate.outputs.worst }}pp
          path: artifacts/p13_leave_one_name_out_concentration_r1.json
          if-no-files-found: error
