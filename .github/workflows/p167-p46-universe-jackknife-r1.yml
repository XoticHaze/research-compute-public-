name: P167 P46 Universe Jackknife R1
on:
  pull_request:
    paths:
      - 'research/p167_p46_universe_jackknife_r1.py'
      - '.github/workflows/p167-p46-universe-jackknife-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p167_p46_universe_jackknife_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p167_p46_universe_jackknife_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"decision={x['decision']}\nsurvivors={x['jackknife_survivors_2015']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p167-p46-jackknife__${{ steps.run.outputs.decision }}__survivors_${{ steps.run.outputs.survivors }}of5
          path: artifacts/p167_p46_universe_jackknife_r1.json
          if-no-files-found: error
