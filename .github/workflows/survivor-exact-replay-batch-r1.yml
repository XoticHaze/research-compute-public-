name: Survivor Exact Replay Batch R1
on:
  pull_request:
    paths:
      - '.github/workflows/survivor-exact-replay-batch-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: P46_RANDOM_NULL
            ref: 73b93a56e8f188866319eea4655789b1187cf664
            deps: numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
            command: python research/p46_standalone_random_selection_null_r1.py
          - lane: P36_SOXX
            ref: 429745b3e0dd5c52de1a14b2df65cca1ad4e6ca2
            deps: numpy==1.26.4 pandas==2.2.3
            command: P36_ASSET=SOXX P36_CHILD=C2 python scripts/p36_independent_proxy_validation.py
          - lane: P36_XSD
            ref: 429745b3e0dd5c52de1a14b2df65cca1ad4e6ca2
            deps: numpy==1.26.4 pandas==2.2.3
            command: P36_ASSET=XSD P36_CHILD=C3 python scripts/p36_independent_proxy_validation.py
          - lane: P64_SERIAL
            ref: 33016d04e1c77823b93406a82266b66dd82e8981
            deps: numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
            command: python research/p66_combination_serial_persistence_r1.py
          - lane: P52_SERIAL
            ref: 3d4cfc3c418b8a73ae9e92105c8476ada05079df
            deps: numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
            command: python research/p52_serial_persistence_r2.py
          - lane: P13_FROZEN_REPLAY
            ref: 0378c521f0204098e239033a25ea126521b96911
            deps: numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
            command: python scripts/p13_frozen_contract_replay_r1.py
    steps:
      - name: Checkout exact frozen scientific head
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lane-pinned dependencies
        run: python -m pip install --disable-pip-version-check ${{ matrix.deps }}
      - name: Execute exact frozen lane
        shell: bash
        run: ${{ matrix.command }}
      - name: Bind replay provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, datetime
          out={
            'schema':'research.survivor_exact_replay_receipt.v1',
            'lane':os.environ['LANE'],
            'scientific_head':os.environ['SCIENTIFIC_REF'],
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'workflow_head':os.environ['GITHUB_SHA'],
            'replayed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'interpretation':'Reproducibility/implementation check only. A harness/source/execution failure or changed result is not scientific rejection; classify the mismatch before any parent decision.'
          }
          pathlib.Path('replay_metadata.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
        env:
          LANE: ${{ matrix.lane }}
          SCIENTIFIC_REF: ${{ matrix.ref }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivor-replay-${{ matrix.lane }}
          path: |
            replay_metadata.json
            artifacts/**
          if-no-files-found: warn
