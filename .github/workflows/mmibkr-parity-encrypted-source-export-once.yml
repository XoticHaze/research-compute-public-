name: MMIBKR Parity Encrypted Source Export Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmibkr-parity-encrypted-source-export-once.yml'

permissions:
  contents: read

jobs:
  export:
    environment: ibkr-paper-runtime-r1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IBKR_REMOTE_SOURCE_TOKEN: ${{ secrets.IBKR_REMOTE_SOURCE_TOKEN }}
      MMIBKR_SOURCE_SHA: 48c4119bed5cc572e1078386070cb2263032f3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Materialize pinned private MM-IBKR source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-parity-source"
          python scripts/mmibkr_private_source_materialize_v1.py             --runner-temp "$RUNNER_TEMP/mmibkr-parity-source"             --source-ref "$MMIBKR_SOURCE_SHA"             > "$RUNNER_TEMP/mmibkr-parity-materialize.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mmibkr-parity-source"/"mmibkr-private-source.json"
          node=json.loads(p.read_text())
          expected=os.environ["MMIBKR_SOURCE_SHA"]
          if node.get("mmibkr_head") != expected:
              raise SystemExit("source head mismatch")
          print("MMIBKR_PARITY_SOURCE_HEAD="+node["mmibkr_head"])
          print("MMIBKR_PARITY_SOURCE_ARCHIVE_SHA256="+node["source_archive_sha256"])
          PY

      - name: Encrypt source archive to one-time fleet key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-parity-export"
          cat > "$RUNNER_TEMP/mmibkr-parity-public.pem" <<'PEM'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA8jpbBLPZeYJruE54kq1I
xXVlOZGvdDzmz+/pjLxY9M45pfJnF12qAz0iVXiZAljF867ayeSBeDpcBqSXXlLg
AIJoi6Zv/gg2obAS1bP/B1tX8cWavARnxHxUUjdvmzQG/2+g3nXnIrOYZyemIUro
yQm9HzbI0aCVteZkT26g7JDDK8N4Q7Evb6LWnNOGq3Lf0ADEk3uvd43WfaINdgKz
Pe2BNbCY2MYe44FwPM9zEtyBZv6bQSP+lS2dZ7HHOeeeKvPkxyby7ckUkNTQLmP1
PSNQMF8jIEKc4lQUujEJBqXG1owEyAaO3DN8AENNVjrUavLYaftnATlqHPfYCSNj
2BZABLVj+NpmNcUTmqkfotFQf3eq5PvwA8/lOwnViVhfQ+mCUys68jqPjfKhEeCZ
WO2GDOyYl/JnDgUdjOFKKRpQm6mm4PS0oZ+WQ/htXWz+olJnTeNC5w376lKlMseV
f6EK3UnK6GIgrTtj2aL9XYIJ2zFC9evGgPn2/HZdv8JfAgMBAAE=
-----END PUBLIC KEY-----
PEM
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          temp=Path(os.environ["RUNNER_TEMP"])
          source=os.environ["MMIBKR_SOURCE_SHA"]
          archive=temp/"mmibkr-parity-source"/"mm-ibkr-source.tar.gz"
          raw=archive.read_bytes()
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=("mmibkr-parity:"+source).encode()
          cipher=AESGCM(key).encrypt(nonce, raw, aad)
          public=serialization.load_pem_public_key((temp/"mmibkr-parity-public.pem").read_bytes())
          wrapped=public.encrypt(
              key,
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None),
          )
          out=temp/"mmibkr-parity-export"
          (out/"mm-ibkr-source.enc").write_bytes(cipher)
          (out/"wrapped-key.bin").write_bytes(wrapped)
          (out/"manifest.json").write_text(json.dumps({
              "schema":"mmibkr.parity_encrypted_source_export.v1",
              "source_sha":source,
              "archive_sha256":hashlib.sha256(raw).hexdigest(),
              "archive_bytes":len(raw),
              "ciphertext_sha256":hashlib.sha256(cipher).hexdigest(),
              "ciphertext_bytes":len(cipher),
              "nonce_b64":base64.b64encode(nonce).decode(),
              "aad_b64":base64.b64encode(aad).decode(),
              "cipher":"AES-256-GCM",
              "key_wrap":"RSA-OAEP-256",
              "private_plaintext_published":False,
          },sort_keys=True,indent=2)+"\n")
          print("MMIBKR_PARITY_CIPHERTEXT_SHA256="+hashlib.sha256(cipher).hexdigest())
          PY

      - name: Destroy plaintext before artifact publication
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$RUNNER_TEMP/mmibkr-parity-source"                        "$RUNNER_TEMP/mmibkr-parity-materialize.log"                        "$RUNNER_TEMP/mmibkr-parity-public.pem"
          test ! -e "$RUNNER_TEMP/mmibkr-parity-source"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-parity-encrypted-48c4119bed5cc572e1078386070cb2263032f3d8
          path: ${{ runner.temp }}/mmibkr-parity-export/
          retention-days: 1
          if-no-files-found: error
