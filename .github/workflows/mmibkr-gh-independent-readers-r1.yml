name: MM-IBKR Independent GitHub Gateway Readers R1

# One already-authenticated Gateway owner run, TWO separate GitHub VMs.
# This workflow NEVER starts IB Gateway, logs in, transmits orders,
# flattens/cancels or requests a new IB Key approval.
on:
  workflow_dispatch:
    inputs:
      gateway_run_id:
        description: Exact still-running Gateway pool owner workflow run ID
        type: string
        required: true
      test_mode:
        description: Full independent A/B overlap or an on-demand independent read
        type: choice
        required: true
        default: handoff_ab
        options:
          - handoff_ab
          - single_read
      network_transport:
        description: Network adapter used by the authenticated Gateway pool
        type: choice
        required: true
        default: cloudflare_access_ssh
        options:
          - cloudflare_access_ssh
          - tailscale
  push:
    branches: [main]
    paths:
      - rendezvous/fire/mmibkr-independent-readers-r1
  pull_request:
    paths:
      - .github/workflows/mmibkr-selected-runtime-live-owner-r1.yml
      - .github/workflows/mmibkr-gh-independent-readers-r1.yml
      - scripts/mmibkr_split_gateway_tcp_relay_v1.py
      - scripts/mmibkr_gh_gateway_readonly_client_v1.py
      - scripts/mmibkr_gateway_account_attestor_v1.py
      - tests/test_mmibkr_gh_gateway_split_v1.py

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  dispatch_readonly_reader:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dispatch read-only A/B against already authenticated owner
        run: |
          set -euo pipefail
          patch="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '[.files[] | select(.filename == "rendezvous/fire/mmibkr-independent-readers-r1") | (.patch // "")] | join("\n")')"
          count="$(printf '%s\n' "$patch" | grep -Ec '^\+reader_handoff_ab_request_20261022_[a-z0-9]{6}: [0-9]{8,24}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: No-broker, no-login API-client and pool contract suite
        run: |
          python -m unittest discover -s tests -p 'test_mmibkr_gh_gateway_split_v1.py' -v
          python -m py_compile scripts/mmibkr_split_gateway_tcp_relay_v1.py scripts/mmibkr_gh_gateway_readonly_client_v1.py scripts/mmibkr_gateway_account_attestor_v1.py

  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      POOL_RUN: ${{ inputs.gateway_run_id }}
      TS_ID: ${{ secrets.MMIBKR_TS_READER_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.MMIBKR_TS_READER_OIDC_AUDIENCE }}
      NETWORK: ${{ inputs.network_transport }}
      CF_HOST: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
      CF_ACCESS_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
      CF_ACCESS_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
      CF_READER_KEY: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
      CF_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
      ACCOUNT: ${{ secrets.MMIBKR_PRODUCTION_LIVE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify one in-progress, exact approved Gateway pool
        run: |
          set -euo pipefail
          if [ "$NETWORK" = cloudflare_access_ssh ]; then
            test -n "$CF_HOST" && test -n "$CF_ACCESS_ID" && test -n "$CF_ACCESS_SECRET"
            test -n "$CF_READER_KEY" && test -n "$CF_HOST_PUBKEY"
            python - <<'PY'
          import os
          from scripts.mmibkr_cf_ssh_transport_v1 import hostname,ed25519_pubkey
          hostname(os.environ["CF_HOST"])
          ed25519_pubkey(os.environ["CF_HOST_PUBKEY"])
          print("MMIBKR_CF_READER_PREAUTH_CONFIG_PASS=1")
          PY
          elif [ "$NETWORK" = tailscale ]; then
            test -n "$ACCOUNT" && test -n "$TS_ID" && test -n "$TS_AUDIENCE"
          else
            exit 64
          fi
          python - "$POOL_RUN" <<'PY'
          import sys
          from scripts.mmibkr_gh_gateway_readonly_client_v1 import gateway_name
          print("MMIBKR_GATEWAY_POOL_TARGET="+gateway_name(sys.argv[1]))
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$POOL_RUN" --jq \
            '(.status == "in_progress") and (.event == "workflow_dispatch") and (.head_branch == "main") and (.path == ".github/workflows/mmibkr-selected-runtime-live-owner-r1.yml")' |
            grep -qx true
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$POOL_RUN/jobs?per_page=100" --jq \
            '[.jobs[] | select(.name == "owner") | .steps[]? | select(.name == "Hold one authenticated read-only Gateway for independent GitHub compute jobs" and .status == "in_progress")] | length > 0' |
            grep -qx true
          echo 'MMIBKR_EXACT_ACTIVE_AUTH_GATEWAY_OWNER=PASS'
          echo 'MMIBKR_WORKER_MUTATING_ORDER_AUTHORITY=NONE'

  runner_a:
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      # Only legacy tailnet readers use the separate account secret. Cloudflare
      # readers verify through the sealed owner over pinned SSH account oracle.
      MMIBKR_PRODUCTION_LIVE_ACCOUNT: ${{ secrets.MMIBKR_PRODUCTION_LIVE_ACCOUNT }}
      EXACT_CONTRACTS: ${{ secrets.MMIBKR_READONLY_EXACT_CONTRACTS_JSON }}
      POOL_RUN: ${{ inputs.gateway_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: ${{ inputs.network_transport == 'tailscale' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.MMIBKR_TS_READER_OIDC_CLIENT_ID }}
          audience: ${{ secrets.MMIBKR_TS_READER_OIDC_AUDIENCE }}
          tags: tag:mmibkr-reader
          hostname: mmibkr-reader-a-${{ github.run_id }}
      - name: Establish pinned Cloudflare Access SSH forward A
        if: ${{ inputs.network_transport == 'cloudflare_access_ssh' }}
        env:
          MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
          MMIBKR_CF_READER_SSH_PRIVKEY_B64: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
          MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
        run: |
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_reader_start_v1.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check ib_insync==0.9.86
      - name: First isolated GitHub VM, read and optionally hold client session
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          NETWORK: ${{ inputs.network_transport }}
        run: |
          set -euo pipefail
          HOST="mmibkr-gw-$POOL_RUN"
          PORT=4001
          if [ "$NETWORK" = cloudflare_access_ssh ]; then
            HOST=127.0.0.1
            PORT=14001
            export MMIBKR_CF_SSH_FORWARD_ATTESTED=1
            export MMIBKR_CF_ACCOUNT_ATTESTOR_FORWARD=1
          else
            tailscale ping "$HOST"
          fi
          hold_seconds=0
          if [ "$TEST_MODE" = handoff_ab ]; then hold_seconds=210; fi
          contract_args=()
          if [ -n "$EXACT_CONTRACTS" ]; then
            umask 077
            printf '%s' "$EXACT_CONTRACTS" > "$RUNNER_TEMP/reader-contracts.json"
            contract_args=(--contracts-file "$RUNNER_TEMP/reader-contracts.json")
          fi
          python -m scripts.mmibkr_gh_gateway_readonly_client_v1 \
            --gateway-run-id "$POOL_RUN" --host "$HOST" --port "$PORT" --transport "$NETWORK" --phase A \
            --hold-seconds "$hold_seconds" --output "$RUNNER_TEMP/mmibkr-gateway-client-a.json" \
            "${contract_args[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-gateway-client-a
          path: ${{ runner.temp }}/mmibkr-gateway-client-a.json
          retention-days: 7
      - if: always()
        run: rm -f "$RUNNER_TEMP/reader-contracts.json"

  runner_b:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'handoff_ab' }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      # Only legacy tailnet readers use the separate account secret. Cloudflare
      # readers verify through the sealed owner over pinned SSH account oracle.
      MMIBKR_PRODUCTION_LIVE_ACCOUNT: ${{ secrets.MMIBKR_PRODUCTION_LIVE_ACCOUNT }}
      EXACT_CONTRACTS: ${{ secrets.MMIBKR_READONLY_EXACT_CONTRACTS_JSON }}
      POOL_RUN: ${{ inputs.gateway_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: ${{ inputs.network_transport == 'tailscale' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.MMIBKR_TS_READER_OIDC_CLIENT_ID }}
          audience: ${{ secrets.MMIBKR_TS_READER_OIDC_AUDIENCE }}
          tags: tag:mmibkr-reader
          hostname: mmibkr-reader-b-${{ github.run_id }}
      - name: Establish pinned Cloudflare Access SSH forward B
        if: ${{ inputs.network_transport == 'cloudflare_access_ssh' }}
        env:
          MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
          MMIBKR_CF_READER_SSH_PRIVKEY_B64: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
          MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
        run: |
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_reader_start_v1.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check ib_insync==0.9.86
      - name: Join session while A should still be connected
        run: sleep 90
      - name: Second independent GitHub VM, read before and after A exits
        env:
          NETWORK: ${{ inputs.network_transport }}
        run: |
          set -euo pipefail
          HOST="mmibkr-gw-$POOL_RUN"
          PORT=4001
          if [ "$NETWORK" = cloudflare_access_ssh ]; then
            HOST=127.0.0.1
            PORT=14001
            export MMIBKR_CF_SSH_FORWARD_ATTESTED=1
            export MMIBKR_CF_ACCOUNT_ATTESTOR_FORWARD=1
          else
            tailscale ping "$HOST"
          fi
          contract_args=()
          if [ -n "$EXACT_CONTRACTS" ]; then
            umask 077
            printf '%s' "$EXACT_CONTRACTS" > "$RUNNER_TEMP/reader-contracts.json"
            contract_args=(--contracts-file "$RUNNER_TEMP/reader-contracts.json")
          fi
          python -m scripts.mmibkr_gh_gateway_readonly_client_v1 \
            --gateway-run-id "$POOL_RUN" --host "$HOST" --port "$PORT" --transport "$NETWORK" --phase B \
            --hold-seconds 300 --output "$RUNNER_TEMP/mmibkr-gateway-client-b.json" \
            "${contract_args[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-gateway-client-b
          path: ${{ runner.temp }}/mmibkr-gateway-client-b.json
          retention-days: 7
      - if: always()
        run: rm -f "$RUNNER_TEMP/reader-contracts.json"

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'handoff_ab' }}
    needs: [runner_a, runner_b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mmibkr-gateway-client-*
          merge-multiple: true
          path: receipt
      - name: Assert distinct real runner sessions and handoff chronology
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          a=json.loads(Path('receipt/mmibkr-gateway-client-a.json').read_text())
          b=json.loads(Path('receipt/mmibkr-gateway-client-b.json').read_text())
          ts=lambda s:datetime.fromisoformat(s)
          assert a['gateway_run_id']==b['gateway_run_id']
          assert a['client_id']!=b['client_id']
          assert a['ok'] and b['ok']
          assert a['post_hold']['ok'] and b['post_hold']['ok']
          assert ts(a['at_utc']) < ts(b['at_utc']) < ts(a['api_disconnected_utc']) < ts(b['post_hold']['at_utc'])
          assert a['broker_mutations_attempted'] is False
          assert b['broker_mutations_attempted'] is False
          print('TWO_INDEPENDENT_GITHUB_VM_SAME_GATEWAY_READ=PASS')
          print('REAL_API_CLIENT_OVERLAP_AND_A_TO_B_HANDOFF=PASS')
          print('BROKER_MUTATIONS=ZERO')
          print('IBKEY_CHALLENGE_ABSENCE=REQUIRES_CONTROLLER_AND_OPERATOR_CONFIRMATION')
          print('CANONICAL_SUBMIT_GATE=NOT_PROVEN_BY_CONTRACT_DETAILS')
          PY
 || true)"
          test "$count" = 1 || { echo 'READER_EXACT_NEW_REQUEST_INVALID=1'; exit 64; }
          pool_run="$(printf '%s\n' "$patch" | sed -nE 's/^\+reader_handoff_ab_request_20261022_[a-z0-9]{6}: ([0-9]{8,24})$/\1/p')"
          [[ "$pool_run" =~ ^[0-9]{8,24}$ ]]
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$pool_run" --jq \
            '(.status == "in_progress") and (.event == "workflow_dispatch") and (.head_branch == "main") and (.path == ".github/workflows/mmibkr-selected-runtime-live-owner-r1.yml")' | grep -qx true
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$pool_run/jobs?per_page=100" --jq \
            '[.jobs[] | select(.name == "owner") | .steps[]? | select(.name == "Hold one authenticated read-only Gateway for independent GitHub compute jobs" and .status == "in_progress")] | length == 1' | grep -qx true
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/mmibkr-gh-independent-readers-r1.yml/dispatches" \
            -f ref=main \
            -f "inputs[gateway_run_id]=$pool_run" \
            -f "inputs[test_mode]=handoff_ab" \
            -f "inputs[network_transport]=cloudflare_access_ssh"
          echo "MMIBKR_EXACT_ACTIVE_READONLY_OWNER_DISPATCHED=$pool_run"

  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: No-broker, no-login API-client and pool contract suite
        run: |
          python -m unittest discover -s tests -p 'test_mmibkr_gh_gateway_split_v1.py' -v
          python -m py_compile scripts/mmibkr_split_gateway_tcp_relay_v1.py scripts/mmibkr_gh_gateway_readonly_client_v1.py scripts/mmibkr_gateway_account_attestor_v1.py

  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      POOL_RUN: ${{ inputs.gateway_run_id }}
      TS_ID: ${{ secrets.MMIBKR_TS_READER_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.MMIBKR_TS_READER_OIDC_AUDIENCE }}
      NETWORK: ${{ inputs.network_transport }}
      CF_HOST: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
      CF_ACCESS_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
      CF_ACCESS_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
      CF_READER_KEY: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
      CF_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
      ACCOUNT: ${{ secrets.MMIBKR_PRODUCTION_LIVE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify one in-progress, exact approved Gateway pool
        run: |
          set -euo pipefail
          if [ "$NETWORK" = cloudflare_access_ssh ]; then
            test -n "$CF_HOST" && test -n "$CF_ACCESS_ID" && test -n "$CF_ACCESS_SECRET"
            test -n "$CF_READER_KEY" && test -n "$CF_HOST_PUBKEY"
            python - <<'PY'
          import os
          from scripts.mmibkr_cf_ssh_transport_v1 import hostname,ed25519_pubkey
          hostname(os.environ["CF_HOST"])
          ed25519_pubkey(os.environ["CF_HOST_PUBKEY"])
          print("MMIBKR_CF_READER_PREAUTH_CONFIG_PASS=1")
          PY
          elif [ "$NETWORK" = tailscale ]; then
            test -n "$ACCOUNT" && test -n "$TS_ID" && test -n "$TS_AUDIENCE"
          else
            exit 64
          fi
          python - "$POOL_RUN" <<'PY'
          import sys
          from scripts.mmibkr_gh_gateway_readonly_client_v1 import gateway_name
          print("MMIBKR_GATEWAY_POOL_TARGET="+gateway_name(sys.argv[1]))
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$POOL_RUN" --jq \
            '(.status == "in_progress") and (.event == "workflow_dispatch") and (.head_branch == "main") and (.path == ".github/workflows/mmibkr-selected-runtime-live-owner-r1.yml")' |
            grep -qx true
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$POOL_RUN/jobs?per_page=100" --jq \
            '[.jobs[] | select(.name == "owner") | .steps[]? | select(.name == "Hold one authenticated read-only Gateway for independent GitHub compute jobs" and .status == "in_progress")] | length > 0' |
            grep -qx true
          echo 'MMIBKR_EXACT_ACTIVE_AUTH_GATEWAY_OWNER=PASS'
          echo 'MMIBKR_WORKER_MUTATING_ORDER_AUTHORITY=NONE'

  runner_a:
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      # Only legacy tailnet readers use the separate account secret. Cloudflare
      # readers verify through the sealed owner over pinned SSH account oracle.
      MMIBKR_PRODUCTION_LIVE_ACCOUNT: ${{ secrets.MMIBKR_PRODUCTION_LIVE_ACCOUNT }}
      EXACT_CONTRACTS: ${{ secrets.MMIBKR_READONLY_EXACT_CONTRACTS_JSON }}
      POOL_RUN: ${{ inputs.gateway_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: ${{ inputs.network_transport == 'tailscale' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.MMIBKR_TS_READER_OIDC_CLIENT_ID }}
          audience: ${{ secrets.MMIBKR_TS_READER_OIDC_AUDIENCE }}
          tags: tag:mmibkr-reader
          hostname: mmibkr-reader-a-${{ github.run_id }}
      - name: Establish pinned Cloudflare Access SSH forward A
        if: ${{ inputs.network_transport == 'cloudflare_access_ssh' }}
        env:
          MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
          MMIBKR_CF_READER_SSH_PRIVKEY_B64: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
          MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
        run: |
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_reader_start_v1.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check ib_insync==0.9.86
      - name: First isolated GitHub VM, read and optionally hold client session
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          NETWORK: ${{ inputs.network_transport }}
        run: |
          set -euo pipefail
          HOST="mmibkr-gw-$POOL_RUN"
          PORT=4001
          if [ "$NETWORK" = cloudflare_access_ssh ]; then
            HOST=127.0.0.1
            PORT=14001
            export MMIBKR_CF_SSH_FORWARD_ATTESTED=1
            export MMIBKR_CF_ACCOUNT_ATTESTOR_FORWARD=1
          else
            tailscale ping "$HOST"
          fi
          hold_seconds=0
          if [ "$TEST_MODE" = handoff_ab ]; then hold_seconds=210; fi
          contract_args=()
          if [ -n "$EXACT_CONTRACTS" ]; then
            umask 077
            printf '%s' "$EXACT_CONTRACTS" > "$RUNNER_TEMP/reader-contracts.json"
            contract_args=(--contracts-file "$RUNNER_TEMP/reader-contracts.json")
          fi
          python -m scripts.mmibkr_gh_gateway_readonly_client_v1 \
            --gateway-run-id "$POOL_RUN" --host "$HOST" --port "$PORT" --transport "$NETWORK" --phase A \
            --hold-seconds "$hold_seconds" --output "$RUNNER_TEMP/mmibkr-gateway-client-a.json" \
            "${contract_args[@]}"
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-gateway-client-a
          path: ${{ runner.temp }}/mmibkr-gateway-client-a.json
          retention-days: 7
      - if: always()
        run: rm -f "$RUNNER_TEMP/reader-contracts.json"

  runner_b:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'handoff_ab' }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      # Only legacy tailnet readers use the separate account secret. Cloudflare
      # readers verify through the sealed owner over pinned SSH account oracle.
      MMIBKR_PRODUCTION_LIVE_ACCOUNT: ${{ secrets.MMIBKR_PRODUCTION_LIVE_ACCOUNT }}
      EXACT_CONTRACTS: ${{ secrets.MMIBKR_READONLY_EXACT_CONTRACTS_JSON }}
      POOL_RUN: ${{ inputs.gateway_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: ${{ inputs.network_transport == 'tailscale' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.MMIBKR_TS_READER_OIDC_CLIENT_ID }}
          audience: ${{ secrets.MMIBKR_TS_READER_OIDC_AUDIENCE }}
          tags: tag:mmibkr-reader
          hostname: mmibkr-reader-b-${{ github.run_id }}
      - name: Establish pinned Cloudflare Access SSH forward B
        if: ${{ inputs.network_transport == 'cloudflare_access_ssh' }}
        env:
          MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME }}
          MMIBKR_CF_READER_SSH_PRIVKEY_B64: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
          MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
        run: |
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_reader_start_v1.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check ib_insync==0.9.86
      - name: Join session while A should still be connected
        run: sleep 90
      - name: Second independent GitHub VM, read before and after A exits
        env:
          NETWORK: ${{ inputs.network_transport }}
        run: |
          set -euo pipefail
          HOST="mmibkr-gw-$POOL_RUN"
          PORT=4001
          if [ "$NETWORK" = cloudflare_access_ssh ]; then
            HOST=127.0.0.1
            PORT=14001
            export MMIBKR_CF_SSH_FORWARD_ATTESTED=1
            export MMIBKR_CF_ACCOUNT_ATTESTOR_FORWARD=1
          else
            tailscale ping "$HOST"
          fi
          contract_args=()
          if [ -n "$EXACT_CONTRACTS" ]; then
            umask 077
            printf '%s' "$EXACT_CONTRACTS" > "$RUNNER_TEMP/reader-contracts.json"
            contract_args=(--contracts-file "$RUNNER_TEMP/reader-contracts.json")
          fi
          python -m scripts.mmibkr_gh_gateway_readonly_client_v1 \
            --gateway-run-id "$POOL_RUN" --host "$HOST" --port "$PORT" --transport "$NETWORK" --phase B \
            --hold-seconds 300 --output "$RUNNER_TEMP/mmibkr-gateway-client-b.json" \
            "${contract_args[@]}"
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mmibkr-gateway-client-b
          path: ${{ runner.temp }}/mmibkr-gateway-client-b.json
          retention-days: 7
      - if: always()
        run: rm -f "$RUNNER_TEMP/reader-contracts.json"

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == 'handoff_ab' }}
    needs: [runner_a, runner_b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mmibkr-gateway-client-*
          merge-multiple: true
          path: receipt
      - name: Assert distinct real runner sessions and handoff chronology
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          a=json.loads(Path('receipt/mmibkr-gateway-client-a.json').read_text())
          b=json.loads(Path('receipt/mmibkr-gateway-client-b.json').read_text())
          ts=lambda s:datetime.fromisoformat(s)
          assert a['gateway_run_id']==b['gateway_run_id']
          assert a['client_id']!=b['client_id']
          assert a['ok'] and b['ok']
          assert a['post_hold']['ok'] and b['post_hold']['ok']
          assert ts(a['at_utc']) < ts(b['at_utc']) < ts(a['api_disconnected_utc']) < ts(b['post_hold']['at_utc'])
          assert a['broker_mutations_attempted'] is False
          assert b['broker_mutations_attempted'] is False
          print('TWO_INDEPENDENT_GITHUB_VM_SAME_GATEWAY_READ=PASS')
          print('REAL_API_CLIENT_OVERLAP_AND_A_TO_B_HANDOFF=PASS')
          print('BROKER_MUTATIONS=ZERO')
          print('IBKEY_CHALLENGE_ABSENCE=REQUIRES_CONTROLLER_AND_OPERATOR_CONFIRMATION')
          print('CANONICAL_SUBMIT_GATE=NOT_PROVEN_BY_CONTRACT_DETAILS')
          PY
