name: IBKR Cloudflare Read-Only B1 R1

on:
  workflow_dispatch:
  push:
    branches: [ibkr-b1-authority-v1]
    paths:
      - '.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml'
      - 'scripts/fleet_authority_envelope_consumer_v1.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ibkr-cloudflare-readonly-b1
  cancel-in-progress: false

jobs:
  broker-data-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLEET_AUTHORITY_URL: https://fleet-authority.slenderiq.workers.dev/v1/authorities/ibkr-paper/seal
      FLEET_AUTHORITY_HEALTH: https://fleet-authority.slenderiq.workers.dev/healthz
      IBKR_GATEWAY_IMAGE: ghcr.io/gnzsnz/ib-gateway:10.49.1c
      PROBE_SYMBOL: AMAT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed read-only probe dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==46.0.1' 'ib_insync==0.9.86'
          python -m py_compile scripts/fleet_authority_envelope_consumer_v1.py scripts/ibkr_readonly_data_probe_v1.py

      - name: Require configured private authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          req=Request(os.environ['FLEET_AUTHORITY_HEALTH'],headers={'Accept':'application/json','User-Agent':'mmibkr-b1-health-v1'})
          with urlopen(req,timeout=15) as r:
              node=json.loads(r.read().decode('utf-8'))
          if node.get('ok') is not True or node.get('authority_configured') is not True:
              raise SystemExit('fleet authority is not configured')
          print('FLEET_AUTHORITY_HEALTH=READY')
          PY

      - name: Obtain one-run sealed gateway environment
        run: |
          set -euo pipefail
          umask 077
          python scripts/fleet_authority_envelope_consumer_v1.py \
            --authority-url "$FLEET_AUTHORITY_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/ibkr-gateway.env" \
            --receipt "$RUNNER_TEMP/ibkr-cloudflare-envelope-receipt.json"

      - name: Start disposable double-read-only paper IB Gateway
        run: |
          set -euo pipefail
          docker pull "$IBKR_GATEWAY_IMAGE" >/dev/null

          docker run -d --name ibkr-cloudflare-b1 \
            --env-file "$RUNNER_TEMP/ibkr-gateway.env" \
            -e TWS_MAJOR_VRSN=10.49.1c \
            -p 127.0.0.1:4002:4004 \
            --entrypoint /bin/bash \
            "$IBKR_GATEWAY_IMAGE" -lc \
            "set -e; if grep -q '^ReadOnlyLogin=' /home/ibgateway/ibc/config.ini.tmpl; then sed -i 's/^ReadOnlyLogin=.*/ReadOnlyLogin=yes/' /home/ibgateway/ibc/config.ini.tmpl; else printf '\nReadOnlyLogin=yes\n' >> /home/ibgateway/ibc/config.ini.tmpl; fi; grep -q '^ReadOnlyLogin=yes$' /home/ibgateway/ibc/config.ini.tmpl; exec /home/ibgateway/scripts/run.sh" >/dev/null

          configured=0
          for _ in $(seq 1 30); do
            if docker exec ibkr-cloudflare-b1 /bin/bash -lc \
              "test -f /home/ibgateway/ibc/config.ini && grep -q '^ReadOnlyLogin=yes$' /home/ibgateway/ibc/config.ini && grep -q '^ReadOnlyApi=yes$' /home/ibgateway/ibc/config.ini" >/dev/null 2>&1; then
              configured=1
              break
            fi
            sleep 1
          done
          test "$configured" = 1 || { echo 'IBKR_DOUBLE_READONLY_CONFIGURED=0'; docker inspect -f '{{.State.Status}}' ibkr-cloudflare-b1 2>/dev/null | sed 's/.*/IBKR_GATEWAY_CONTAINER_STATE=NOT_READY/' || true; exit 44; }
          echo 'IBKR_DOUBLE_READONLY_CONFIGURED=1'

          ready=0
          for _ in $(seq 1 36); do
            if python - <<'PY'
          from ib_insync import IB
          ib = IB()
          ok = False
          try:
              ib.connect('127.0.0.1', 4002, clientId=77, timeout=5, readonly=True)
              ok = ib.isConnected()
          except Exception:
              ok = False
          finally:
              if ib.isConnected():
                  ib.disconnect()
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" != 1 ]; then
            docker logs ibkr-cloudflare-b1 2>&1 | python -c 'import json,sys; t=sys.stdin.read().lower(); out={"schema":"mmibkr-ibkr-gateway-sanitized-failure-v2","read_only_login_initiated":"initiating read-only login" in t,"twofa_initiated_exact":"second factor authentication initiated" in t,"twofa_dialog_opened":"detected dialog entitled: second factor authentication; event=opened" in t,"device_selection_required":"select second factor device" in t,"security_code_dialog":"detected dialog entitled: enter security code" in t,"paper_login_clicked":"click button: paper log in" in t,"authenticating_seen":"detected frame entitled: authenticating" in t,"login_completed":"login has completed" in t,"credential_rejection_signal":any(x in t for x in ["invalid username","invalid password","authentication failed","login failed"]),"existing_session_signal":"existing session" in t,"container_log_bytes":len(t.encode())}; print("IBKR_GATEWAY_SANITIZED_FAILURE="+json.dumps(out,sort_keys=True))'
            echo 'IBKR_GATEWAY_API_READY=0'
            exit 45
          fi
          echo 'IBKR_GATEWAY_API_READY=1'

      - name: Prove read-only broker session and historical data fetch
        run: |
          set -euo pipefail
          python scripts/ibkr_readonly_data_probe_v1.py \
            --host 127.0.0.1 \
            --port 4002 \
            --client-id 78 \
            --symbol "$PROBE_SYMBOL" \
            --output "$RUNNER_TEMP/ibkr-readonly-data-proof.json"

      - name: Publish sanitized proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibkr-cloudflare-readonly-b1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ibkr-cloudflare-envelope-receipt.json
            ${{ runner.temp }}/ibkr-readonly-data-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Destroy private runtime material
        if: always()
        run: |
          set +e
          docker rm -f ibkr-cloudflare-b1 >/dev/null 2>&1
          rm -f \
            "$RUNNER_TEMP/ibkr-gateway.env" \
            "$RUNNER_TEMP/ibkr-cloudflare-envelope-receipt.json" \
            "$RUNNER_TEMP/ibkr-readonly-data-proof.json"
          echo 'IBKR_PRIVATE_RUNTIME_DESTROYED=1'
