name: IBKR Cloudflare Read-Only B1 R1

on:
  workflow_dispatch:
  push:
    branches: [ibkr-b1-authority-v1]
    paths:
      - '.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml'
      - 'scripts/fleet_authority_envelope_consumer_v1.py'
      - 'scripts/ibkr_readonly_data_probe_v1.py'
      - 'scripts/ibkr_gateway_state_classifier_v1.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ibkr-cloudflare-readonly-b1
  cancel-in-progress: false

jobs:
  broker-data-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      FLEET_AUTHORITY_URL: https://fleet-authority.slenderiq.workers.dev/v1/authorities/ibkr-paper/seal
      FLEET_AUTHORITY_HEALTH: https://fleet-authority.slenderiq.workers.dev/healthz
      IBKR_CONTROLLER_IMAGE: ghcr.io/code-hustler-ft3d/ibg-controller@sha256:5db4074ec952d130937afc3bb926ee97f115d09f7f46676eb16d98c2805572b5
      PROBE_SYMBOL: AMAT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed read-only probe dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==46.0.1' 'ib_insync==0.9.86'
          python -m py_compile \
            scripts/fleet_authority_envelope_consumer_v1.py \
            scripts/ibkr_readonly_data_probe_v1.py \
            scripts/ibkr_gateway_state_classifier_v1.py

      - name: Require configured private authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          req=Request(os.environ['FLEET_AUTHORITY_HEALTH'],headers={'Accept':'application/json','User-Agent':'mmibkr-b1-health-v1'})
          with urlopen(req,timeout=15) as r:
              node=json.loads(r.read().decode('utf-8'))
          if node.get('ok') is not True or node.get('authority_configured') is not True:
              raise SystemExit('fleet authority is not configured')
          print('FLEET_AUTHORITY_HEALTH=READY')
          PY

      - name: Obtain one-run sealed gateway environment
        run: |
          set -euo pipefail
          umask 077
          python scripts/fleet_authority_envelope_consumer_v1.py \
            --authority-url "$FLEET_AUTHORITY_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/ibkr-gateway.env" \
            --receipt "$RUNNER_TEMP/ibkr-cloudflare-envelope-receipt.json"

      - name: Start disposable post-IBC paper Gateway
        run: |
          set -euo pipefail
          docker pull "$IBKR_CONTROLLER_IMAGE" >/dev/null
          image_id="$(docker image inspect --format '{{.Id}}' "$IBKR_CONTROLLER_IMAGE")"
          test -n "$image_id"
          echo "IBKR_CONTROLLER_IMAGE_PINNED=1"

          jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$jts_volume" >/dev/null
          docker run --rm --user 0 --entrypoint /bin/sh \
            -v "$jts_volume:/state" \
            "$IBKR_CONTROLLER_IMAGE" \
            -lc 'chmod 0777 /state' >/dev/null
          echo 'IBKR_EPHEMERAL_JTS_EVIDENCE_READY=1'

          docker run -d --name ibkr-cloudflare-b1 \
            --env-file "$RUNNER_TEMP/ibkr-gateway.env" \
            -e USE_IBG_CONTROLLER=yes \
            -e TRADING_MODE=paper \
            -e READ_ONLY_API=yes \
            -e TWOFA_TIMEOUT_ACTION=none \
            -e TWOFA_EXIT_INTERVAL=3600 \
            -e CONTROLLER_HEALTH_SERVER_PORT=8080 \
            -e TWS_SETTINGS_PATH=/home/ibgateway/Jts_b1 \
            -v "$jts_volume:/home/ibgateway/Jts_b1" \
            -p 127.0.0.1:4002:4004 \
            -p 127.0.0.1:18080:8080 \
            "$IBKR_CONTROLLER_IMAGE" >/dev/null

          docker exec ibkr-cloudflare-b1 /bin/sh -lc 'test "$TRADING_MODE" = paper && test "$READ_ONLY_API" = yes && test "$TWOFA_TIMEOUT_ACTION" = none && test "$TWS_SETTINGS_PATH" = /home/ibgateway/Jts_b1' >/dev/null
          echo 'IBKR_PAPER_READONLY_ENV_ASSERTED=1'
          echo 'IBKR_CCP_RECOVERY_WINDOW_ENABLED=1'

          ready=0
          for _ in $(seq 1 720); do
            running="$(docker inspect -f '{{.State.Running}}' ibkr-cloudflare-b1 2>/dev/null || echo false)"
            if [ "$running" != true ]; then
              break
            fi

            if python - <<'PY'
          import socket
          try:
              with socket.create_connection(('127.0.0.1', 4002), timeout=0.25):
                  pass
          except OSError:
              raise SystemExit(1)
          PY
            then
              if python - <<'PY'
          from ib_insync import IB
          ib = IB()
          ok = False
          try:
              ib.connect('127.0.0.1', 4002, clientId=77, timeout=3, readonly=True)
              ok = ib.isConnected()
          except Exception:
              ok = False
          finally:
              if ib.isConnected():
                  ib.disconnect()
          raise SystemExit(0 if ok else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import urlopen
          raw = b'{}'
          reachable = False
          try:
              with urlopen('http://127.0.0.1:18080/health', timeout=2) as r:
                  raw = r.read()
                  reachable = True
          except HTTPError as e:
              raw = e.read()
              reachable = True
          except Exception:
              pass
          try:
              node = json.loads(raw.decode('utf-8'))
          except Exception:
              node = {}
          out = {
              'schema': 'mmibkr-ibkr-controller-health-proof-v1',
              'reachable': reachable,
              'status': node.get('status'),
              'mode': node.get('mode'),
              'state': node.get('state'),
              'jvm_alive': node.get('jvm_alive'),
              'api_port_open': node.get('api_port_open'),
              'ccp_lockout_streak': node.get('ccp_lockout_streak'),
              'ccp_backoff_seconds': node.get('ccp_backoff_seconds'),
              'last_auth_present': bool(node.get('last_auth_timestamp') or node.get('last_auth')),
          }
          print('IBKR_CONTROLLER_HEALTH=' + json.dumps(out, sort_keys=True))
          PY

          if [ "$ready" != 1 ]; then
            running="$(docker inspect -f '{{.State.Running}}' ibkr-cloudflare-b1 2>/dev/null || echo false)"
            exit_code="$(docker inspect -f '{{.State.ExitCode}}' ibkr-cloudflare-b1 2>/dev/null || echo -1)"
            RUNNING="$running" EXIT_CODE="$exit_code" python - <<'PY'
          import json, os
          out = {
              'schema': 'mmibkr-ibkr-controller-container-proof-v1',
              'running': os.environ.get('RUNNING', '').lower() == 'true',
              'exit_code': int(os.environ.get('EXIT_CODE', '-1')),
          }
          print('IBKR_CONTROLLER_CONTAINER=' + json.dumps(out, sort_keys=True))
          PY

            docker logs ibkr-cloudflare-b1 > "$RUNNER_TEMP/ibkr-controller.log" 2>&1 || true
            docker run --rm --entrypoint /bin/sh \
              -v "$jts_volume:/evidence:ro" \
              "$IBKR_CONTROLLER_IMAGE" \
              -lc 'cat /evidence/launcher.log 2>/dev/null || true' \
              > "$RUNNER_TEMP/ibkr-launcher.log" 2>/dev/null || true

            python scripts/ibkr_gateway_state_classifier_v1.py \
              --controller-log-file "$RUNNER_TEMP/ibkr-controller.log" \
              --launcher-log-file "$RUNNER_TEMP/ibkr-launcher.log"
            echo 'IBKR_GATEWAY_API_READY=0'
            exit 45
          fi
          echo 'IBKR_GATEWAY_API_READY=1'

      - name: Prove read-only broker session and historical data fetch
        run: |
          set -euo pipefail
          python scripts/ibkr_readonly_data_probe_v1.py \
            --host 127.0.0.1 \
            --port 4002 \
            --client-id 78 \
            --symbol "$PROBE_SYMBOL" \
            --output "$RUNNER_TEMP/ibkr-readonly-data-proof.json"

      - name: Publish sanitized proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibkr-cloudflare-readonly-b1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ibkr-cloudflare-envelope-receipt.json
            ${{ runner.temp }}/ibkr-readonly-data-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Destroy private runtime material
        if: always()
        run: |
          set +e
          jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker stop --time 75 ibkr-cloudflare-b1 >/dev/null 2>&1
          docker rm -f ibkr-cloudflare-b1 >/dev/null 2>&1
          docker volume rm -f "$jts_volume" >/dev/null 2>&1
          rm -f \
            "$RUNNER_TEMP/ibkr-gateway.env" \
            "$RUNNER_TEMP/ibkr-cloudflare-envelope-receipt.json" \
            "$RUNNER_TEMP/ibkr-readonly-data-proof.json" \
            "$RUNNER_TEMP/ibkr-controller.log" \
            "$RUNNER_TEMP/ibkr-launcher.log"
          echo 'IBKR_PRIVATE_RUNTIME_DESTROYED=1'
