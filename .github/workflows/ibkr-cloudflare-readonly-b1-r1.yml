name: IBKR Cloudflare Read-Only B1 R1
run-name: >-
  IBKR B1 ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.mode, inputs.dispatch_nonce) || github.event_name }}

on:
  pull_request:
    branches:
      - ibkr-b1-authority-v1
    paths:
      - '.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: readonly
        type: choice
        options:
          - readonly
          - production_live_readonly
          - paper_submit_proof
          - paper_execute
          - paper_account_hygiene
          - paper_account_snapshot
          - forward_exact_ticks
      dispatch_nonce:
        description: Optional one-run correlation token
        required: false
        default: ''
        type: string
      symbols:
        description: Comma-separated market symbols for the read-only post-auth handoff
        required: false
        default: 'AMAT,APH'
        type: string
      contracts_json:
        description: Optional exact MM execution contracts keyed by requested symbol
        required: false
        default: '{}'
        type: string
      bar_requests_json:
        description: Optional exact MM-owned historical bar requests keyed by requested symbol
        required: false
        default: ''
        type: string
      snapshot_not_before_utc:
        description: Optional UTC instant; encrypted detailed snapshot must not be sampled before this boundary
        required: false
        default: ''
        type: string
      include_quotes:
        description: Include exact-contract read-only quote snapshots for requested symbols
        required: false
        default: false
        type: boolean
      read_return_recipient_b64:
        description: Optional one-run X25519 public recipient for encrypted detailed read return
        required: false
        default: ''
        type: string
      read_return_recipient_key_id:
        description: SHA-256 fingerprint of the encrypted read-return recipient
        required: false
        default: ''
        type: string
      read_return_envelope_profile:
        description: Versioned encrypted return framing; v1 remains default for old clients
        required: false
        default: v1
        type: choice
        options:
          - v1
          - v2
  push:
    branches:
      - ibkr-b1-authority-v1
      - assistant/ibkr-controller-native-warm-20260917
      - assistant/ibkr-warm-seed-owner-20260917
      - assistant/ibkr-warm-paper-proof-activation-20260917
      - assistant/ibkr-warm-read-gateway-20260917
      - assistant/b1-account-hygiene-transport-20260923
      - assistant/b1-hygiene-skip-history-20260923
      - assistant/b1-account-hygiene-snapshot-freshness-20260923
      - assistant/b1-fleet-stream-attestation-20260923
      - assistant/b1-account-snapshot-refresh-20260923
      - assistant/b1-vault-attestation-contract-20260923
      - assistant/b1-production-live-readonly-r1
      - b1/hygiene-canonical-route-authority-667-r1
      - b1/forward-exact-ticks-669-r1
    paths:
      - '.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml'
      - 'scripts/fleet_authority_envelope_consumer_v1.py'
      - 'scripts/ibkr_auth_boundary_v1.py'
      - 'scripts/ibkr_login_window_guard_v1.py'
      - 'scripts/ibkr_post_auth_pipeline_v1.py'
      - 'scripts/ibkr_remote_selected_runtime_command_capsule_v2.py'
      - 'scripts/ibkr_remote_forward_exact_ticks_v1.py'
      - 'scripts/ibkr_remote_account_hygiene_v1.py'
      - 'scripts/mmibkr_b1_attested_source_consumer_v1.py'
      - 'scripts/ibkr_remote_selected_runtime_paper_proof_v1.py'
      - 'scripts/ibkr_remote_selected_runtime_paper_proof_v2.py'
      - 'scripts/ibkr_remote_selected_runtime_paper_execute_v1.py'
      - 'scripts/ibkr_remote_paper_proof_return_v1.py'
      - 'scripts/ibkr_warm_selected_runtime_activation_v1.py'
      - 'scripts/ibkr_warm_read_return_v1.py'
      - 'scripts/ibkr_account_snapshot_return_v1.py'
      - 'research/forward_bar_contract_v2.py'
      - 'tests/test_ibkr_b1_auth_contracts_v1.py'
      - 'tests/test_ibkr_post_auth_pipeline_contracts_v1.py'
      - 'tests/test_forward_bar_multitimeframe_v2.py'
      - 'tests/test_ibkr_b1_warm_state_workflow_v2.py'
      - 'tests/test_ibkr_warm_selected_runtime_activation_v1.py'
      - 'tests/test_ibkr_remote_selected_runtime_command_capsule_v2.py'
      - 'tests/test_ibkr_remote_forward_exact_ticks_v1.py'
      - 'tests/test_ibkr_remote_account_hygiene_v1.py'
      - 'tests/test_mmibkr_b1_attested_source_consumer_v1.py'
      - 'tests/test_ibkr_b1_canonical_dockerfile_v1.py'
      - 'tests/test_ibkr_remote_selected_runtime_paper_execute_v1.py'
      - 'tests/test_ibkr_remote_paper_proof_return_v1.py'
      - 'tests/test_ibkr_warm_read_return_v1.py'
      - 'tests/test_ibkr_account_snapshot_return_v1.py'
      - 'tests/test_ibkr_initial_selected_runtime_backfill_v1.py'
      - 'tests/test_ibkr_b1_live_readonly_workflow_v1.py'
      - 'scripts/ibkr_paper_warning_rescue_v1.py'
      - 'tests/test_ibkr_paper_warning_rescue_v1.py'
      - 'ibkr_login_trigger.txt'
      - 'config/ibkr_initial_selected_runtime_backfill_v1.json'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ibkr-cloudflare-readonly-b1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Verify B1 auth contracts without broker access
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'cryptography==46.0.1' \
            'ib_insync==0.9.86' \
            'pandas==2.2.3' \
            'PyYAML==6.0.2'
          python -m py_compile \
            scripts/fleet_authority_envelope_consumer_v1.py \
            scripts/ibkr_auth_boundary_v1.py \
            scripts/ibkr_paper_warning_rescue_v1.py \
            scripts/ibkr_login_window_guard_v1.py \
            scripts/ibkr_post_auth_pipeline_v1.py \
            tests/test_ibkr_post_auth_pipeline_contracts_v1.py \
            tests/test_forward_bar_multitimeframe_v2.py \
            scripts/ibkr_remote_selected_runtime_command_capsule_v2.py \
            scripts/ibkr_remote_forward_exact_ticks_v1.py \
            scripts/ibkr_remote_account_hygiene_v1.py \
            scripts/mmibkr_b1_attested_source_consumer_v1.py \
            scripts/ibkr_remote_selected_runtime_paper_proof_v1.py \
            scripts/ibkr_remote_selected_runtime_paper_proof_v2.py \
            scripts/ibkr_remote_selected_runtime_paper_execute_v1.py \
            scripts/ibkr_remote_paper_proof_return_v1.py \
            scripts/ibkr_warm_selected_runtime_activation_v1.py \
            scripts/ibkr_warm_read_return_v1.py \
            scripts/ibkr_account_snapshot_return_v1.py \
            research/forward_bar_contract_v2.py \
            tests/test_ibkr_b1_auth_contracts_v1.py \
            tests/test_ibkr_paper_warning_rescue_v1.py \
            tests/test_ibkr_b1_warm_state_workflow_v2.py \
            tests/test_ibkr_warm_selected_runtime_activation_v1.py \
            tests/test_ibkr_remote_selected_runtime_command_capsule_v2.py \
            tests/test_ibkr_remote_forward_exact_ticks_v1.py \
            tests/test_ibkr_remote_account_hygiene_v1.py \
            tests/test_mmibkr_b1_attested_source_consumer_v1.py \
            tests/test_ibkr_b1_canonical_dockerfile_v1.py \
            tests/test_ibkr_remote_selected_runtime_paper_execute_v1.py \
            tests/test_ibkr_remote_paper_proof_return_v1.py \
            tests/test_ibkr_warm_read_return_v1.py \
            tests/test_ibkr_account_snapshot_return_v1.py \
            tests/test_ibkr_initial_selected_runtime_backfill_v1.py \
            tests/test_ibkr_b1_live_readonly_workflow_v1.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/ibkr-cloudflare-readonly-b1-r1.yml')
          node=yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(node, dict) or 'jobs' not in node:
              raise SystemExit('workflow YAML did not parse into expected mapping')
          print('IBKR_WORKFLOW_YAML_VALID=1')
          PY
          python -m unittest \
            tests.test_ibkr_b1_auth_contracts_v1 \
            tests.test_ibkr_paper_warning_rescue_v1 \
            tests.test_ibkr_post_auth_pipeline_contracts_v1 \
            tests.test_forward_bar_multitimeframe_v2 \
            tests.test_ibkr_b1_warm_state_workflow_v2 \
            tests.test_ibkr_warm_selected_runtime_activation_v1 \
            tests.test_ibkr_remote_selected_runtime_command_capsule_v2 \
            tests.test_ibkr_remote_forward_exact_ticks_v1 \
            tests.test_ibkr_remote_account_hygiene_v1 \
            tests.test_mmibkr_b1_attested_source_consumer_v1 \
            tests.test_ibkr_b1_canonical_dockerfile_v1 \
            tests.test_ibkr_remote_selected_runtime_paper_execute_v1 \
            tests.test_ibkr_remote_paper_proof_return_v1 \
            tests.test_ibkr_warm_read_return_v1 \
            tests.test_ibkr_account_snapshot_return_v1 \
            tests.test_ibkr_initial_selected_runtime_backfill_v1 \
            tests.test_ibkr_b1_live_readonly_workflow_v1 -v
          echo 'IBKR_BROKER_LOGIN_ATTEMPTED=0'
          echo 'IBKR_BROKER_ORDER_ATTEMPTED=0'

  broker-data-proof:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ibkr-login]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      FLEET_AUTHORITY_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production_live_readonly' && 'https://fleet-authority.slenderiq.workers.dev/v1/authorities/ibkr-live-readonly/seal' || 'https://fleet-authority.slenderiq.workers.dev/v1/authorities/ibkr-paper/seal' }}
      FLEET_AUTHORITY_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production_live_readonly' && 'production_live_readonly' || 'paper' }}
      IBKR_CONTROLLER_IMAGE: ghcr.io/code-hustler-ft3d/ibg-controller@sha256:5db4074ec952d130937afc3bb926ee97f115d09f7f46676eb16d98c2805572b5
      POST_AUTH_SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.symbols || 'AMAT,APH' }}
      POST_AUTH_CONTRACTS_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.contracts_json || '{}' }}
      POST_AUTH_BAR_REQUESTS_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.bar_requests_json || '' }}
      POST_AUTH_INCLUDE_QUOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.include_quotes && '1' || '0' }}
      IBKR_WARM_READ_RETURN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'readonly' || inputs.mode == 'paper_execute' || inputs.mode == 'production_live_readonly') && inputs.read_return_recipient_b64 != '' && inputs.read_return_recipient_key_id != '' && '1' || '0' }}
      IBKR_PRODUCTION_LIVE_READONLY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production_live_readonly' && '1' || '0' }}
      IBKR_ACCOUNT_SNAPSHOT_RETURN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_account_snapshot' && inputs.read_return_recipient_b64 != '' && inputs.read_return_recipient_key_id != '' && '1' || '0' }}
      IBKR_PAPER_PROOF_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_submit_proof' && '1' || '0' }}
      IBKR_PAPER_EXECUTE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_execute' && '1' || '0' }}
      IBKR_PAPER_ACCOUNT_HYGIENE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_account_hygiene' && '1' || '0' }}
      IBKR_PAPER_ACCOUNT_SNAPSHOT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_account_snapshot' && '1' || '0' }}
      IBKR_FORWARD_EXACT_TICKS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'forward_exact_ticks' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install and verify fixed broker dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'cryptography==46.0.1' \
            'ib_insync==0.9.86' \
            'pandas==2.2.3'
          python -m py_compile \
            scripts/fleet_authority_envelope_consumer_v1.py \
            scripts/ibkr_auth_boundary_v1.py \
            scripts/ibkr_paper_warning_rescue_v1.py \
            scripts/ibkr_login_window_guard_v1.py \
            scripts/ibkr_post_auth_pipeline_v1.py \
            tests/test_ibkr_post_auth_pipeline_contracts_v1.py \
            tests/test_forward_bar_multitimeframe_v2.py \
            scripts/ibkr_remote_selected_runtime_command_capsule_v2.py \
            scripts/ibkr_remote_forward_exact_ticks_v1.py \
            scripts/ibkr_remote_account_hygiene_v1.py \
            scripts/mmibkr_b1_attested_source_consumer_v1.py \
            scripts/ibkr_remote_selected_runtime_paper_proof_v1.py \
            scripts/ibkr_remote_selected_runtime_paper_proof_v2.py \
            scripts/ibkr_remote_selected_runtime_paper_execute_v1.py \
            scripts/ibkr_remote_paper_proof_return_v1.py \
            scripts/ibkr_warm_selected_runtime_activation_v1.py \
            scripts/ibkr_warm_read_return_v1.py \
            scripts/ibkr_account_snapshot_return_v1.py \
            research/forward_bar_contract_v2.py \
            tests/test_ibkr_b1_auth_contracts_v1.py \
            tests/test_ibkr_paper_warning_rescue_v1.py \
            tests/test_ibkr_warm_selected_runtime_activation_v1.py \
            tests/test_ibkr_remote_selected_runtime_command_capsule_v2.py \
            tests/test_ibkr_remote_forward_exact_ticks_v1.py \
            tests/test_ibkr_remote_account_hygiene_v1.py \
            tests/test_mmibkr_b1_attested_source_consumer_v1.py \
            tests/test_ibkr_b1_canonical_dockerfile_v1.py \
            tests/test_ibkr_remote_selected_runtime_paper_execute_v1.py \
            tests/test_ibkr_remote_paper_proof_return_v1.py \
            tests/test_ibkr_warm_read_return_v1.py \
            tests/test_ibkr_account_snapshot_return_v1.py \
            tests/test_ibkr_initial_selected_runtime_backfill_v1.py \
            tests/test_ibkr_b1_live_readonly_workflow_v1.py
          python -m unittest \
            tests.test_ibkr_b1_auth_contracts_v1 \
            tests.test_ibkr_paper_warning_rescue_v1 \
            tests.test_ibkr_post_auth_pipeline_contracts_v1 \
            tests.test_forward_bar_multitimeframe_v2 \
            tests.test_ibkr_warm_selected_runtime_activation_v1 \
            tests.test_ibkr_remote_selected_runtime_command_capsule_v2 \
            tests.test_ibkr_remote_forward_exact_ticks_v1 \
            tests.test_ibkr_remote_account_hygiene_v1 \
            tests.test_mmibkr_b1_attested_source_consumer_v1 \
            tests.test_ibkr_b1_canonical_dockerfile_v1 \
            tests.test_ibkr_remote_selected_runtime_paper_execute_v1 \
            tests.test_ibkr_remote_paper_proof_return_v1 \
            tests.test_ibkr_warm_read_return_v1 \
            tests.test_ibkr_account_snapshot_return_v1 \
            tests.test_ibkr_initial_selected_runtime_backfill_v1 \
            tests.test_ibkr_b1_live_readonly_workflow_v1 -v
          echo "IBKR_PAPER_PROOF_MODE=${IBKR_PAPER_PROOF_MODE}"

      - name: Load one-shot selected-runtime initial backfill request
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ibkr-initial-backfill]') }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          node=json.loads(Path('config/ibkr_initial_selected_runtime_backfill_v1.json').read_text(encoding='utf-8'))
          symbols=node.get('symbols') or []
          contracts=node.get('contracts') or {}
          requests=node.get('bar_requests') or {}
          required=node.get('required_completed_bars') or {}
          if set(symbols) != set(requests):
              raise SystemExit('initial backfill request must cover every requested symbol')
          if int(required.get('AMAT_target_15Min') or 0) < 400:
              raise SystemExit('AMAT warmup floor must remain >=400 target bars')
          if int(required.get('APH_target_15Min') or 0) < 400:
              raise SystemExit('APH warmup floor must remain >=400 target bars')
          if int(required.get('MNQ_source_1Min') or 0) < 4800:
              raise SystemExit('MNQ warmup floor must remain >=4800 source bars')
          print('POST_AUTH_SYMBOLS=' + ','.join(symbols))
          print('POST_AUTH_CONTRACTS_JSON=' + json.dumps(contracts,separators=(',',':')))
          print('POST_AUTH_BAR_REQUESTS_JSON=' + json.dumps(requests,separators=(',',':')))
          print('IBKR_INITIAL_SELECTED_RUNTIME_BACKFILL=1')
          PY
          echo 'IBKR_INITIAL_SELECTED_RUNTIME_BACKFILL_REQUEST_LOADED=1'

      - name: Validate optional encrypted warm read-return request
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'readonly' || inputs.mode == 'paper_execute' || inputs.mode == 'production_live_readonly') && (inputs.read_return_recipient_b64 != '' || inputs.read_return_recipient_key_id != '') }}
        env:
          READ_RETURN_MODE: ${{ inputs.mode }}
          READ_RETURN_RECIPIENT_B64: ${{ inputs.read_return_recipient_b64 }}
          READ_RETURN_RECIPIENT_KEY_ID: ${{ inputs.read_return_recipient_key_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os
          mode=os.environ.get('READ_RETURN_MODE')
          if mode not in {'readonly','paper_execute','production_live_readonly'}:
              raise SystemExit('encrypted detailed read return is admitted only in approved read-return modes')
          encoded=os.environ.get('READ_RETURN_RECIPIENT_B64','').strip()
          key_id=os.environ.get('READ_RETURN_RECIPIENT_KEY_ID','').strip()
          if not encoded or not key_id:
              raise SystemExit('encrypted read return requires recipient key and fingerprint together')
          try:
              raw=base64.b64decode(encoded.encode('ascii'),validate=True)
          except Exception as exc:
              raise SystemExit('encrypted read return recipient is not valid base64') from exc
          if len(raw) != 32:
              raise SystemExit('encrypted read return recipient must be a 32-byte X25519 public key')
          expected='sha256:'+hashlib.sha256(raw).hexdigest()
          if key_id != expected:
              raise SystemExit('encrypted read return recipient fingerprint mismatch')
          print('IBKR_WARM_READ_RETURN_REQUEST_VALID=1')
          PY

      - name: Validate required encrypted account snapshot recipient
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_account_snapshot' }}
        env:
          READ_RETURN_RECIPIENT_B64: ${{ inputs.read_return_recipient_b64 }}
          READ_RETURN_RECIPIENT_KEY_ID: ${{ inputs.read_return_recipient_key_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os
          encoded=os.environ.get('READ_RETURN_RECIPIENT_B64','').strip()
          key_id=os.environ.get('READ_RETURN_RECIPIENT_KEY_ID','').strip()
          if not encoded or not key_id:
              raise SystemExit('paper account snapshot requires recipient key and fingerprint')
          try:
              raw=base64.b64decode(encoded.encode('ascii'),validate=True)
          except Exception as exc:
              raise SystemExit('paper account snapshot recipient is not valid base64') from exc
          if len(raw) != 32:
              raise SystemExit('paper account snapshot recipient must be a 32-byte X25519 public key')
          expected='sha256:'+hashlib.sha256(raw).hexdigest()
          if key_id != expected:
              raise SystemExit('paper account snapshot recipient fingerprint mismatch')
          print('IBKR_ACCOUNT_SNAPSHOT_RECIPIENT_VALID=1')
          PY

      - name: Obtain one-run sealed gateway environment
        run: |
          set -euo pipefail
          umask 077
          python scripts/fleet_authority_envelope_consumer_v1.py \
            --authority-url "$FLEET_AUTHORITY_URL" \
            --profile "$FLEET_AUTHORITY_PROFILE" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/ibkr-gateway.env" \
            --receipt "$RUNNER_TEMP/ibkr-cloudflare-envelope-receipt.json"

          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'ibkr-gateway.env'
          keys = {line.split('=', 1)[0] for line in p.read_text().splitlines() if '=' in line}
          profile=os.environ.get('FLEET_AUTHORITY_PROFILE','paper').strip()
          server_key='TWS_SERVER_LIVE' if profile == 'production_live_readonly' else 'TWS_SERVER_PAPER'
          explicit_server = server_key in keys
          print('SEALED_IBKR_AUTHORITY_PROFILE=' + profile)
          print('SEALED_IBKR_SERVER_PRESENT=' + ('1' if explicit_server else '0'))
          print('SEALED_TOTP_PRESENT=' + ('1' if 'TWOFACTOR_CODE' in keys else '0'))
          kept=[]
          for raw in p.read_text().splitlines():
              key = raw.split('=', 1)[0] if '=' in raw else ''
              if key in {'TWOFACTOR_CODE', 'TWOFA_DEVICE'}:
                  continue
              kept.append(raw)
          (Path(os.environ['RUNNER_TEMP']) / 'ibkr-gateway-bootstrap.env').write_text('\n'.join(kept) + '\n')
          PY

      - name: Restore encrypted warm Gateway state if available
        if: env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1'
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          warm_volume="ibkr-b1-warm-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$jts_volume" >/dev/null
          docker volume create "$warm_volume" >/dev/null
          gateway_uid="$(docker run --rm --entrypoint /usr/bin/id "$IBKR_CONTROLLER_IMAGE" -u)"
          gateway_gid="$(docker run --rm --entrypoint /usr/bin/id "$IBKR_CONTROLLER_IMAGE" -g)"
          docker run --rm --user 0 --entrypoint /bin/sh -v "$jts_volume:/state" "$IBKR_CONTROLLER_IMAGE" -lc 'chmod 0777 /state' >/dev/null
          docker run --rm --user 0 --entrypoint /bin/sh -v "$warm_volume:/warm-seed" "$IBKR_CONTROLLER_IMAGE" -lc 'chmod 0777 /warm-seed' >/dev/null
          echo 'IBKR_WARM_STATE_GENERATION=clean-stop-v2'

          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ibkr-b1-warm-state-clean-v2&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo 'IBKR_WARM_STATE_RESTORED=0'
            echo 'restored=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bind the warm decrypt input to one exact prior B1 Actions run.
          # GitHub artifact metadata is public non-secret provenance; Jts and
          # credentials remain inside sealed material, never printed.
          warm_source_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.workflow_run.id // empty')"
          warm_source_branch="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.workflow_run.head_branch // empty')"
          warm_source_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.workflow_run.head_sha // empty')"
          [[ "$warm_source_run" =~ ^[0-9]{4,24}$ ]] || { echo 'IBKR_WARM_SOURCE_RUN_ID_INVALID=1'; exit 53; }
          [[ "$warm_source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'IBKR_WARM_SOURCE_HEAD_INVALID=1'; exit 54; }
          test "$warm_source_run" != "$GITHUB_RUN_ID" || { echo 'IBKR_WARM_SELF_ARTIFACT_REFUSED=1'; exit 55; }
          test "$warm_source_branch" = "ibkr-b1-authority-v1" || { echo 'IBKR_WARM_FOREIGN_BRANCH_REFUSED=1'; exit 56; }
          echo "IBKR_WARM_SOURCE_RUN_ID=$warm_source_run"
          echo "IBKR_WARM_SOURCE_ARTIFACT_ID=$artifact_id"
          echo 'IBKR_WARM_SOURCE_EXACT_REPOSITORY_BRANCH=PASS'

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/ibkr-b1-warm-state.zip"
          unzip -q "$RUNNER_TEMP/ibkr-b1-warm-state.zip" -d "$RUNNER_TEMP/warm-artifact"
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          temp=Path(os.environ['RUNNER_TEMP'])
          vals={}
          for raw in (temp/'ibkr-gateway.env').read_text().splitlines():
              if '=' in raw:
                  k,v=raw.split('=',1); vals[k]=v
          password=vals.get('TWS_PASSWORD_PAPER') or vals.get('TWS_PASSWORD')
          if not password:
              raise SystemExit('paper password missing from sealed environment')
          blob=(temp/'warm-artifact'/'ibkr-b1-warm-state.tgz.enc').read_bytes()
          if blob[:9] != b'MMIBKRWS1':
              raise SystemExit('warm state envelope schema mismatch')
          salt,nonce,ciphertext=blob[9:25],blob[25:37],blob[37:]
          key=PBKDF2HMAC(algorithm=hashes.SHA256(),length=32,salt=salt,iterations=250000).derive(password.encode())
          plain=AESGCM(key).decrypt(nonce,ciphertext,b'mmibkr-b1-warm-state-v1')
          (temp/'ibkr-b1-warm-state.tgz').write_bytes(plain)
          PY
          docker run --rm \
            -e GATEWAY_UID="$gateway_uid" \
            -e GATEWAY_GID="$gateway_gid" \
            -v "$warm_volume:/warm-seed" \
            -v "$RUNNER_TEMP:/import:ro" \
            alpine:3.22 \
            sh -lc 'set -eu; tar -xzf /import/ibkr-b1-warm-state.tgz -C /warm-seed; chown -R "$GATEWAY_UID:$GATEWAY_GID" /warm-seed; chmod -R u+rwX,go-rwx /warm-seed'
          docker run --rm --entrypoint /bin/sh \
            -v "$warm_volume:/warm-seed:ro" \
            "$IBKR_CONTROLLER_IMAGE" \
            -lc 'set -eu; rm -rf /tmp/warm-read-check; mkdir -p /tmp/warm-read-check; cp -a /warm-seed/. /tmp/warm-read-check/; rm -rf /tmp/warm-read-check'
          echo 'IBKR_WARM_STATE_SEED_READABLE=1'
          echo 'IBKR_WARM_STATE_RESTORED=1'
          echo 'IBKR_WARM_STATE_SEED_MODE=CONTROLLER_NATIVE'
          echo 'restored=1' >> "$GITHUB_OUTPUT"

      - name: Require restored warm state for broker-mutating selected-runtime command
        if: env.IBKR_PAPER_PROOF_MODE == '1' || env.IBKR_PAPER_EXECUTE_MODE == '1' || env.IBKR_PAPER_ACCOUNT_HYGIENE_MODE == '1'
        run: |
          set -euo pipefail
          test "${{ steps.restore.outputs.restored }}" = "1" || { echo 'broker-mutating selected-runtime command requires accepted restored warm state'; exit 43; }
          echo 'IBKR_PAPER_MUTATION_WARM_STATE_REQUIRED=1'

      - name: Refuse cold login inside IBKR reset window
        if: steps.restore.outputs.restored != '1'
        run: |
          set -euo pipefail
          python scripts/ibkr_login_window_guard_v1.py

      - name: Resolve authenticated session boundary
        id: auth_boundary
        run: |
          set -euo pipefail
          jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          warm_volume="ibkr-b1-warm-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker pull "$IBKR_CONTROLLER_IMAGE" >/dev/null
          echo 'IBKR_CONTROLLER_IMAGE_PINNED=1'
          # Paper prepares this volume inside the warm-restore step. Live
          # intentionally skips that step, so give the isolated live JTS
          # volume writable permissions before Gateway applies settings.
          if [ "$IBKR_PRODUCTION_LIVE_READONLY_MODE" = "1" ]; then
            docker volume create "$jts_volume" >/dev/null
            docker run --rm --user 0 --entrypoint /bin/sh \
              -v "$jts_volume:/state" "$IBKR_CONTROLLER_IMAGE" \
              -lc 'chmod 0777 /state' >/dev/null
            echo 'IBKR_LIVE_JTS_VOLUME_WRITABLE=1'
          fi

          api_read_only=yes
          if [ "$IBKR_PAPER_PROOF_MODE" = "1" ] || [ "$IBKR_PAPER_EXECUTE_MODE" = "1" ] || [ "$IBKR_PAPER_ACCOUNT_HYGIENE_MODE" = "1" ]; then
            api_read_only=no
          fi
          echo "IBKR_GATEWAY_READ_ONLY_API=${api_read_only}"
          gateway_mode=paper
          gateway_host_port=4002
          gateway_container_port=4004
          gateway_twofa_timeout_action=none
          if [ "$IBKR_PRODUCTION_LIVE_READONLY_MODE" = "1" ]; then
            test "$api_read_only" = yes
            gateway_mode=live
            gateway_host_port=4001
            gateway_container_port=4003
            gateway_twofa_timeout_action=exit
          fi
          export IBKR_GATEWAY_API_PORT="$gateway_host_port"
          echo "IBKR_GATEWAY_API_PORT=$gateway_host_port" >> "$GITHUB_ENV"
          echo "IBKR_GATEWAY_ACCOUNT_MODE=$gateway_mode" >> "$GITHUB_ENV"
          echo "IBKR_GATEWAY_ACCOUNT_MODE_SELECTED=$gateway_mode"

          warm_state_args=()
          if [ "${{ steps.restore.outputs.restored }}" = "1" ]; then
            warm_state_args=(
              -e GATEWAY_WARM_STATE=/home/ibgateway/warm-state
              -v "$warm_volume:/home/ibgateway/warm-state:ro"
            )
          fi

          docker run -d --name ibkr-cloudflare-b1 \
            --env-file "$RUNNER_TEMP/ibkr-gateway-bootstrap.env" \
            -e USE_IBG_CONTROLLER=yes \
            -e IBKR_PAPER_DISCLAIMER_RESCUE="$([ "$gateway_mode" = paper ] && echo 1 || echo 0)" \
            -e TRADING_MODE="$gateway_mode" \
            -e READ_ONLY_API="$api_read_only" \
            -e TWOFA_TIMEOUT_ACTION="$gateway_twofa_timeout_action" \
            -e TWOFA_EXIT_INTERVAL=120 \
            -e RELOGIN_AFTER_TWOFA_TIMEOUT=yes \
            -e CONTROLLER_HEALTH_SERVER_PORT=8080 \
            -e TWS_SETTINGS_PATH=/home/ibgateway/Jts_b1 \
            -e AUTO_RESTART_TIME='04:15 AM' \
            -e AUTO_LOGOFF_TIME='04:15 AM' \
            -e TIME_ZONE=America/Chicago \
            "${warm_state_args[@]}" \
            -v "$jts_volume:/home/ibgateway/Jts_b1" \
            -p "127.0.0.1:$gateway_host_port:$gateway_container_port" \
            -p 127.0.0.1:18080:8080 \
            "$IBKR_CONTROLLER_IMAGE" >/dev/null

          if [ "$gateway_mode" = paper ]; then
            docker cp scripts/ibkr_paper_warning_rescue_v1.py ibkr-cloudflare-b1:/tmp/ibkr_paper_warning_rescue_v1.py
            echo 'IBKR_PAPER_WARNING_EXACT_MODAL_RESCUE_INSTALLED=1'
          fi
          actual_read_only="$(docker exec ibkr-cloudflare-b1 /bin/sh -lc 'printf %s "$READ_ONLY_API"')"
          test "$actual_read_only" = "$api_read_only"
          docker exec -e "EXPECTED_GATEWAY_MODE=$gateway_mode" -e "EXPECTED_TWOFA_TIMEOUT_ACTION=$gateway_twofa_timeout_action" ibkr-cloudflare-b1 /bin/sh -lc 'test "$TRADING_MODE" = "$EXPECTED_GATEWAY_MODE" && test "$TWOFA_TIMEOUT_ACTION" = "$EXPECTED_TWOFA_TIMEOUT_ACTION" && test "$TWOFA_EXIT_INTERVAL" = 120 && test "$RELOGIN_AFTER_TWOFA_TIMEOUT" = yes' >/dev/null
          if [ "${{ steps.restore.outputs.restored }}" = "1" ]; then
            docker exec ibkr-cloudflare-b1 /bin/sh -lc 'test "$GATEWAY_WARM_STATE" = /home/ibgateway/warm-state && test "$TWS_SETTINGS_PATH" = /home/ibgateway/Jts_b1 && test "$GATEWAY_WARM_STATE" != "$TWS_SETTINGS_PATH"' >/dev/null
            echo 'IBKR_CONTROLLER_NATIVE_WARM_SEED_BOUND=1'
          fi
          echo 'IBKR_SESSION_RESOLUTION_STARTED=1'

          mode=none
          last_paper_warning_rescue_at=0
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            running="$(docker inspect -f '{{.State.Running}}' ibkr-cloudflare-b1 2>/dev/null || echo false)"
            [ "$running" = true ] || break

            if python - <<'PY'
          import os
          from ib_insync import IB
          ib=IB()
          try:
              ib.connect('127.0.0.1',int(os.environ['IBKR_GATEWAY_API_PORT']),clientId=76,timeout=2,readonly=True)
              ok=ib.isConnected()
          except Exception:
              ok=False
          finally:
              if ib.isConnected(): ib.disconnect()
          raise SystemExit(0 if ok else 1)
          PY
            then
              if [ "${{ steps.restore.outputs.restored }}" = "1" ]; then
                mode=warm
                echo 'IBKR_AUTH_PATH=WARM_STATE_RESTORED'
              else
                mode=fresh
                echo 'IBKR_AUTH_PATH=FRESH_SESSION'
              fi
              echo 'IBKR_GATEWAY_API_READY=1'
              break
            fi

            # The pinned controller already auto-dismisses standard warning
            # buttons. Rescue an alternate IBC-era button only after proof of
            # a specific paper-only modal; no arbitrary clicks or live access.
            if [ "$gateway_mode" = paper ] && (( SECONDS - last_paper_warning_rescue_at >= 20 )); then
              docker exec ibkr-cloudflare-b1 python3 /tmp/ibkr_paper_warning_rescue_v1.py --apply || true
              last_paper_warning_rescue_at=$SECONDS
            fi
            docker logs ibkr-cloudflare-b1 > "$RUNNER_TEMP/ibkr-controller.log" 2>&1 || true
            docker exec ibkr-cloudflare-b1 /bin/sh -lc 'cat "$TWS_SETTINGS_PATH/launcher.log" 2>/dev/null || true' \
              > "$RUNNER_TEMP/ibkr-launcher.log" 2>/dev/null || true
            python scripts/ibkr_auth_boundary_v1.py \
              --quiet \
              --controller-log-file "$RUNNER_TEMP/ibkr-controller.log" \
              --launcher-log-file "$RUNNER_TEMP/ibkr-launcher.log" \
              --output "$RUNNER_TEMP/ibkr-auth-boundary.json"

            boundary_state="$(python - <<'PY'
          import json, os
          from pathlib import Path
          node=json.loads((Path(os.environ['RUNNER_TEMP'])/'ibkr-auth-boundary.json').read_text())
          if node.get('ibkey_mobile_approval_wait_signal'):
              print('challenge')
          elif node.get('terminal_prechallenge_blocker'):
              print('blocker')
          else:
              print('continue')
          PY
            )"

            if [ "$boundary_state" = challenge ]; then
              mode=challenge
              echo 'IBKR_IBKEY_PUSH_WAIT_SIGNAL=1'
              echo 'IBKR_SECOND_FACTOR_CHALLENGE_OBSERVED=1'
              break
            fi
            if [ "$boundary_state" = blocker ]; then
              echo 'IBKR_PRECHALLENGE_TERMINAL_BLOCKER=1'
              python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ibkr-auth-boundary.json'
          print('IBKR_AUTH_BOUNDARY=' + json.dumps(json.loads(p.read_text()), sort_keys=True))
          PY
              exit 49
            fi
            sleep 5
          done

          if [ "$mode" = none ]; then
            # The pinned controller already auto-dismisses standard warning
            # buttons. Rescue an alternate IBC-era button only after proof of
            # a specific paper-only modal; no arbitrary clicks or live access.
            if [ "$gateway_mode" = paper ] && (( SECONDS - last_paper_warning_rescue_at >= 20 )); then
              docker exec ibkr-cloudflare-b1 python3 /tmp/ibkr_paper_warning_rescue_v1.py --apply || true
              last_paper_warning_rescue_at=$SECONDS
            fi
            docker logs ibkr-cloudflare-b1 > "$RUNNER_TEMP/ibkr-controller.log" 2>&1 || true
            docker exec ibkr-cloudflare-b1 /bin/sh -lc 'cat "$TWS_SETTINGS_PATH/launcher.log" 2>/dev/null || true' \
              > "$RUNNER_TEMP/ibkr-launcher.log" 2>/dev/null || true
            # Publish fixed-category early-exit evidence, not raw logs or private values.
            container_state="$(docker inspect -f '{{.State.Running}}:{{.State.ExitCode}}:{{.State.OOMKilled}}' ibkr-cloudflare-b1 2>/dev/null || echo unavailable)"
            export IBKR_DIAGNOSTIC_CONTAINER_STATE="$container_state"
            python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          log = (root / "ibkr-controller.log").read_text(encoding="utf-8", errors="replace")
          launcher = (root / "ibkr-launcher.log").read_text(encoding="utf-8", errors="replace")
          evidence = log + "\n" + launcher
          categories = {
              "python_traceback": r"Traceback \(most recent call last\)",
              "missing_runtime": r"ModuleNotFoundError|ImportError|FileNotFoundError|No such file or directory",
              "display_failure": r"cannot open display|Xvfb.*(fail|error)|DISPLAY.*(fail|error)",
              "jvm_failure": r"JVM.*(exit|error|fail)|java.*(exit|error|fail)",
              "credential_config_failure": r"missing.*(password|userid)|invalid.*(password|userid)",
              "region_or_network_failure": r"SSLHandshakeException|handshake fail|unknown host|No route to host|TWS_SERVER.*required",
              "controller_error": r"\b(?:fatal|critical|exception|shutdown|crash)\b",
              "controller_started": r"\b(?:controller|gateway)\b",
          }
          categories_seen = sorted(k for k, p in categories.items() if re.search(p, evidence, re.I))
          alerts = sorted(set(re.findall(r"\bALERT_[A-Z0-9_]{2,48}\b", evidence)))
          exceptions = sorted(set(re.findall(r"\b[A-Za-z_]{2,36}(?:Error|Exception)\b", evidence)))
          print("IBKR_GATEWAY_BOOT_DIAGNOSTIC=" + json.dumps({
              "container_state": os.environ["IBKR_DIAGNOSTIC_CONTAINER_STATE"],
              "controller_log_bytes": len(log.encode()),
              "launcher_log_bytes": len(launcher.encode()),
              "categories": categories_seen,
              "alert_tokens": alerts[:12],
              "exception_types": exceptions[:12],
              "sensitive_content_emitted": False,
          }, sort_keys=True))
          # Only emit controller launch-stage lines after masking all known
          # sealed credential values and common account/token representations.
          secrets_file = root / "ibkr-gateway.env"
          redactions = []
          if secrets_file.is_file():
              for record in secrets_file.read_text(encoding="utf-8").splitlines():
                  if "=" not in record:
                      continue
                  key, value = record.split("=", 1)
                  if (any(k in key.upper() for k in ("USERID", "PASSWORD", "ACCOUNT", "TOKEN", "TWOFACTOR", "SECRET"))
                      and len(value.strip()) > 2):
                      redactions.append(value.strip())
          clean = []
          for line in log.splitlines():
              if not re.search(r"(?i)\b(?:error|failed|fatal|stop|exit|gateway|controller|launcher|missing|invalid|xvfb|vnc|ready|starting|terminated|not found|settings)\b", line):
                  continue
              for value in sorted(set(redactions), key=len, reverse=True):
                  line = re.sub(re.escape(value), "[REDACTED]", line, flags=re.I)
              line = re.sub(r"\b(?:DU|DF|DI|U|F|I)[0-9]{5,10}\b", "[REDACTED_ACCOUNT]", line)
              line = re.sub(r"(?i)\b(?:bearer|token|secret|password|userid|username|account)\s*[=:]\s*[^\s,;]+", "[REDACTED_FIELD]", line)
              line = re.sub(r"(?i)(?:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})", "[REDACTED_EMAIL]", line)
              if re.search(r"(?i)\b(?:TWS_PASSWORD|TWS_USERID|TWOFACTOR_CODE|API_KEY)\b", line):
                  continue
              clean.append(line[:220])
          print("IBKR_GATEWAY_REDACTED_STARTUP=" + json.dumps(clean[-20:]))
          PY
            python scripts/ibkr_auth_boundary_v1.py \
              --controller-log-file "$RUNNER_TEMP/ibkr-controller.log" \
              --launcher-log-file "$RUNNER_TEMP/ibkr-launcher.log" \
              --output "$RUNNER_TEMP/ibkr-auth-boundary.json"
            echo 'IBKR_SECOND_FACTOR_CHALLENGE_OBSERVED=0'
            echo 'IBKR_MOBILE_CHALLENGE_REACHED=0'
            exit 47
          fi

          echo "auth_mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = challenge ]; then
            echo 'IBKR_MOBILE_CHALLENGE_REACHED=1'
            echo 'IBKR_OPERATOR_ACTION=APPROVE_IBKR_MOBILE_NOTIFICATION'
          elif [ "$mode" = warm ]; then
            echo 'IBKR_MOBILE_CHALLENGE_REACHED=0'
            echo 'IBKR_WARM_SESSION_REUSED=1'
            echo 'IBKR_OPERATOR_ACTION=NONE_WARM_SESSION_REUSED'
          else
            echo 'IBKR_MOBILE_CHALLENGE_REACHED=0'
            echo 'IBKR_WARM_SESSION_REUSED=0'
            echo 'IBKR_OPERATOR_ACTION=NONE_FRESH_SESSION_ESTABLISHED'
          fi

      - name: Wait for verified IBKR Mobile approval
        if: steps.auth_boundary.outputs.auth_mode == 'challenge'
        run: |
          set -euo pipefail
          ready=0
          deadline=$((SECONDS + 960))
          while (( SECONDS < deadline )); do
            running="$(docker inspect -f '{{.State.Running}}' ibkr-cloudflare-b1 2>/dev/null || echo false)"
            [ "$running" = true ] || break
            if python - <<'PY'
          import os
          from ib_insync import IB
          ib=IB()
          try:
              ib.connect('127.0.0.1',int(os.environ['IBKR_GATEWAY_API_PORT']),clientId=77,timeout=3,readonly=True)
              ok=ib.isConnected()
          except Exception:
              ok=False
          finally:
              if ib.isConnected(): ib.disconnect()
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then
            jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker logs ibkr-cloudflare-b1 > "$RUNNER_TEMP/ibkr-controller.log" 2>&1 || true
            docker run --rm --entrypoint /bin/sh \
              -v "$jts_volume:/evidence:ro" \
              "$IBKR_CONTROLLER_IMAGE" \
              -lc 'cat /evidence/launcher.log 2>/dev/null || true' \
              > "$RUNNER_TEMP/ibkr-launcher.log" 2>/dev/null || true
            python scripts/ibkr_auth_boundary_v1.py \
              --controller-log-file "$RUNNER_TEMP/ibkr-controller.log" \
              --launcher-log-file "$RUNNER_TEMP/ibkr-launcher.log" \
              --output "$RUNNER_TEMP/ibkr-auth-boundary.json"
            if [ "$IBKR_PRODUCTION_LIVE_READONLY_MODE" = "1" ]; then
              # IB Key acceptance and Gateway API readiness are distinct proofs.
              # Whitelist only fixed state fields; never print raw broker logs.
              python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          root = Path(os.environ["RUNNER_TEMP"])
          launcher = (root / "ibkr-launcher.log").read_text(encoding="utf-8", errors="replace")
          inspect = subprocess.run(
              ["docker", "inspect", "-f", "{{.State.Running}}:{{.State.ExitCode}}:{{.State.OOMKilled}}", "ibkr-cloudflare-b1"],
              capture_output=True, text=True, check=False, timeout=5)
          state = inspect.stdout.strip() if inspect.returncode == 0 else "unavailable"
          health = {}
          health_error = ""
          try:
              try:
                  response = urlopen("http://127.0.0.1:18080/health", timeout=3)
              except HTTPError as e:
                  response = e
              with response:
                  health = json.loads(response.read().decode("utf-8"))
          except (OSError, ValueError, TimeoutError) as e:
              health_error = type(e).__name__
          allowed = ("status", "mode", "state", "jvm_alive", "api_port", "api_port_open",
                     "socat_port", "socat_port_open", "last_auth_success_age_seconds")
          print("IBKR_LIVE_POST_2FA_DIAGNOSTIC=" + json.dumps({
              "container_state": state,
              "launcher_authentication_complete": "Authentication complete" in launcher,
              "launcher_post_authenticate": "JTS-PostAuthenticate" in launcher,
              "controller_health": {k: health[k] for k in allowed if k in health},
              "controller_health_error_type": health_error,
              "api_ready_verified": False,
              "broker_mutation_attempted": False,
              "private_account_fields_emitted": False,
          }, sort_keys=True))
          PY
            fi
            echo 'IBKR_GATEWAY_API_READY_VERIFIED=0'
            echo 'IBKR_OPERATOR_APPROVAL_ACCEPTED=0'
            exit 48
          fi
          echo 'IBKR_OPERATOR_APPROVAL_ACCEPTED=1'
          echo 'IBKR_GATEWAY_API_READY=1'

      - name: Wait for optional completed-bar snapshot boundary
        if: ${{ env.IBKR_WARM_READ_RETURN_REQUESTED == '1' && inputs.snapshot_not_before_utc != '' }}
        env:
          IBKR_SNAPSHOT_NOT_BEFORE_UTC: ${{ inputs.snapshot_not_before_utc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time
          from datetime import datetime,timezone

          raw=os.environ['IBKR_SNAPSHOT_NOT_BEFORE_UTC'].strip()
          try:
              target=datetime.fromisoformat(raw.replace('Z','+00:00'))
          except Exception as exc:
              raise SystemExit('snapshot_not_before_utc must be ISO-8601') from exc
          if target.tzinfo is None:
              raise SystemExit('snapshot_not_before_utc must include an explicit UTC offset')
          target=target.astimezone(timezone.utc)
          now=datetime.now(timezone.utc)
          delay=(target-now).total_seconds()
          if delay > 600:
              raise SystemExit('snapshot boundary is more than 600 seconds in the future')
          if delay < -60:
              print('IBKR_SNAPSHOT_BOUNDARY_STALE_AFTER_AUTH=1')
              print('IBKR_CANONICAL_SNAPSHOT_REISSUE_REQUIRED=1')
              raise SystemExit('snapshot boundary is more than 60 seconds stale; original producer must reissue a fresh approved boundary')
          if delay > 0:
              print('IBKR_SNAPSHOT_BOUNDARY_WAIT_SEC='+str(round(delay,3)))
              time.sleep(delay)
          print('IBKR_SNAPSHOT_BOUNDARY_REACHED_UTC='+target.isoformat().replace('+00:00','Z'))
          PY

      - name: Reject paper-only snapshot return contract in live mode
        if: env.IBKR_PRODUCTION_LIVE_READONLY_MODE == '1' && env.IBKR_WARM_READ_RETURN_REQUESTED == '1'
        run: |
          echo 'IBKR_LIVE_READONLY_PAPER_SNAPSHOT_RETURN_UNSUPPORTED=1' >&2
          exit 56

      - name: Read live IBKR account from authenticated API without orders
        if: env.IBKR_PRODUCTION_LIVE_READONLY_MODE == '1'
        run: |
          set -euo pipefail
          test "$IBKR_GATEWAY_API_PORT" = 4001
          python - <<'PY'
          import os
          from pathlib import Path
          from ib_insync import IB
          sealed = Path(os.environ['RUNNER_TEMP']) / 'ibkr-gateway.env'
          expected = ''
          for raw in sealed.read_text(encoding='utf-8').splitlines():
              if raw.startswith('MMIBKR_PRODUCTION_LIVE_ACCOUNT='):
                  expected = raw.split('=', 1)[1].strip()
          if not expected or expected.upper().startswith('DU'):
              raise RuntimeError('expected non-paper live account missing from sealed authority')
          ib = IB()
          try:
              ib.connect('127.0.0.1', 4001, clientId=81, timeout=10, readonly=True)
              if not ib.isConnected():
                  raise RuntimeError('live IBKR API not connected')
              accounts = [str(x).strip() for x in ib.managedAccounts()]
              if expected not in accounts:
                  raise RuntimeError('expected live account absent from managed accounts')
              if ib.reqCurrentTime() is None:
                  raise RuntimeError('live broker clock unavailable')
              summary = list(ib.accountSummary())
              if not any(str(getattr(x, 'account', '')).strip() == expected for x in summary):
                  raise RuntimeError('selected live account summary unavailable')
              list(ib.positions())
              ib.reqAllOpenOrders()
              ib.sleep(0.5)
              list(ib.openOrders())
              print('IBKR_LIVE_AUTHENTICATED_API=1')
              print('IBKR_LIVE_EXPECTED_NON_DU_ACCOUNT_BOUND=1')
              print('IBKR_LIVE_ACCOUNT_STATE_READ=1')
              print('IBKR_LIVE_POSITIONS_OPEN_ORDERS_READ=1')
              print('IBKR_LIVE_READ_ONLY_API=1')
              print('IBKR_LIVE_ORDER_MUTATION_ATTEMPTED=0')
              print('IBKR_LIVE_ACCOUNT_ID_EMITTED=0')
          finally:
              if ib.isConnected():
                  ib.disconnect()
          PY

      - name: Materialize canonical post-auth broker and forward-data handoff
        id: post_auth
        if: env.IBKR_PAPER_ACCOUNT_HYGIENE_MODE != '1' && env.IBKR_PAPER_ACCOUNT_SNAPSHOT_MODE != '1' && env.IBKR_FORWARD_EXACT_TICKS_MODE != '1' && env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1'
        run: |
          set -euo pipefail
          quote_args=()
          if [ "$POST_AUTH_INCLUDE_QUOTES" = "1" ]; then
            quote_args+=(--include-quotes)
          fi
          python scripts/ibkr_post_auth_pipeline_v1.py \
            --host 127.0.0.1 \
            --port 4002 \
            --client-id 78 \
            --symbols "$POST_AUTH_SYMBOLS" \
            --contracts-json "$POST_AUTH_CONTRACTS_JSON" \
            --bar-requests-json "$POST_AUTH_BAR_REQUESTS_JSON" \
            "${quote_args[@]}" \
            --output "$RUNNER_TEMP/ibkr-post-auth-handoff.json" \
            --bars-output "$RUNNER_TEMP/ibkr-forward-bars-v2.jsonl"
          echo 'IBKR_CONSUMER_READY=1'

      - name: Encrypt optional detailed warm read snapshot for private consumer
        id: warm_read_return
        if: env.IBKR_WARM_READ_RETURN_REQUESTED == '1' && env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1'
        env:
          READ_RETURN_RECIPIENT_B64: ${{ inputs.read_return_recipient_b64 }}
          READ_RETURN_RECIPIENT_KEY_ID: ${{ inputs.read_return_recipient_key_id }}
          READ_RETURN_ENVELOPE_PROFILE: ${{ inputs.read_return_envelope_profile }}
        run: |
          set -euo pipefail
          python scripts/ibkr_warm_read_return_v1.py \
            --host 127.0.0.1 \
            --port 4002 \
            --client-id 79 \
            --run-id "$GITHUB_RUN_ID" \
            --public-head "$GITHUB_SHA" \
            --handoff-file "$RUNNER_TEMP/ibkr-post-auth-handoff.json" \
            --bars-file "$RUNNER_TEMP/ibkr-forward-bars-v2.jsonl" \
            --recipient-b64 "$READ_RETURN_RECIPIENT_B64" \
            --recipient-key-id "$READ_RETURN_RECIPIENT_KEY_ID" \
            --return-profile "$READ_RETURN_ENVELOPE_PROFILE" \
            --output-dir "$RUNNER_TEMP/ibkr-warm-read-return"
          echo 'ready=1' >> "$GITHUB_OUTPUT"
          echo 'IBKR_WARM_READ_RETURN_ENCRYPTED=1'

      - name: Publish encrypted warm read return
        if: steps.warm_read_return.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ibkr-warm-read-return'
          envelope=json.loads((root/'ibkr-warm-read-envelope.json').read_text(encoding='utf-8'))
          run_id=os.environ['GITHUB_RUN_ID']
          if str(envelope.get('run_id')) != run_id:
              raise SystemExit('encrypted warm read return run id mismatch')
          prefix=f'rendezvous/returns/{run_id}/'
          files=[]
          for node in envelope.get('chunks') or []:
              path=str(node.get('path') or '')
              local_name=str(node.get('local_name') or '')
              if not path.startswith(prefix) or '..' in path.split('/') or '/' in local_name:
                  raise SystemExit('encrypted warm read return publish path rejected')
              files.append((path, root/local_name))
          files.append((prefix+'ibkr-warm-read-envelope.json', root/'ibkr-warm-read-envelope.json'))
          repo=os.environ['GITHUB_REPOSITORY']
          for path,local in files:
              content=base64.b64encode(local.read_bytes()).decode('ascii')
              subprocess.run([
                  'gh','api','--method','PUT',f'/repos/{repo}/contents/{path}',
                  '-f','message=rendezvous: publish encrypted IBKR warm read return',
                  '-f',f'content={content}','-f','branch=rendezvous-exchange',
              ],check=True,stdout=subprocess.DEVNULL)
          print('IBKR_WARM_READ_RETURN_PUBLISHED=1')
          print('IBKR_WARM_READ_RETURN_PLAINTEXT_PUBLISHED=0')
          PY

      - name: Encrypt bounded account-only snapshot for maintenance refresh
        id: account_snapshot_return
        if: env.IBKR_ACCOUNT_SNAPSHOT_RETURN_REQUESTED == '1'
        env:
          READ_RETURN_RECIPIENT_B64: ${{ inputs.read_return_recipient_b64 }}
          READ_RETURN_RECIPIENT_KEY_ID: ${{ inputs.read_return_recipient_key_id }}
        run: |
          set -euo pipefail
          python scripts/ibkr_account_snapshot_return_v1.py \
            --host 127.0.0.1 \
            --port 4002 \
            --client-id 80 \
            --run-id "$GITHUB_RUN_ID" \
            --public-head "$GITHUB_SHA" \
            --recipient-b64 "$READ_RETURN_RECIPIENT_B64" \
            --recipient-key-id "$READ_RETURN_RECIPIENT_KEY_ID" \
            --output-dir "$RUNNER_TEMP/ibkr-account-snapshot-return"
          echo 'ready=1' >> "$GITHUB_OUTPUT"
          echo 'IBKR_ACCOUNT_SNAPSHOT_RETURN_ENCRYPTED=1'

      - name: Publish encrypted account-only snapshot
        if: steps.account_snapshot_return.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ibkr-account-snapshot-return'
          envelope=json.loads((root/'ibkr-account-snapshot-envelope.json').read_text(encoding='utf-8'))
          run_id=os.environ['GITHUB_RUN_ID']
          if str(envelope.get('run_id')) != run_id:
              raise SystemExit('encrypted account snapshot run id mismatch')
          prefix=f'rendezvous/returns/{run_id}/'
          files=[]
          for node in envelope.get('chunks') or []:
              path=str(node.get('path') or '')
              local_name=str(node.get('local_name') or '')
              if not path.startswith(prefix) or '..' in path.split('/') or '/' in local_name:
                  raise SystemExit('encrypted account snapshot publish path rejected')
              files.append((path, root/local_name))
          files.append((prefix+'ibkr-account-snapshot-envelope.json', root/'ibkr-account-snapshot-envelope.json'))
          repo=os.environ['GITHUB_REPOSITORY']
          for path,local in files:
              content=base64.b64encode(local.read_bytes()).decode('ascii')
              subprocess.run([
                  'gh','api','--method','PUT',f'/repos/{repo}/contents/{path}',
                  '-f','message=rendezvous: publish encrypted IBKR account snapshot',
                  '-f',f'content={content}','-f','branch=rendezvous-exchange',
              ],check=True,stdout=subprocess.DEVNULL)
          print('IBKR_ACCOUNT_SNAPSHOT_RETURN_PUBLISHED=1')
          print('IBKR_ACCOUNT_SNAPSHOT_RETURN_PLAINTEXT_PUBLISHED=0')
          PY

      - name: Execute one encrypted MM-authorized selected-runtime paper proof
        id: paper_proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_submit_proof' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$IBKR_PAPER_PROOF_MODE" = "1"
          python scripts/ibkr_warm_selected_runtime_activation_v1.py \
            --run-id "$GITHUB_RUN_ID" \
            --public-head "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --exchange-ref rendezvous-exchange \
            --runner-temp "$RUNNER_TEMP" \
            --gateway-host 127.0.0.1 \
            --gateway-port 4002 \
            --wait-seconds 900 \
            --mode paper_submit_proof
          echo 'IBKR_WARM_SELECTED_RUNTIME_PAPER_PROOF_TRANSPORT_COMPLETE=1'

      - name: Execute one encrypted MM-authorized persistent paper command
        id: paper_execute
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_execute' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$IBKR_PAPER_EXECUTE_MODE" = "1"
          python scripts/ibkr_warm_selected_runtime_activation_v1.py \
            --run-id "$GITHUB_RUN_ID" \
            --public-head "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --exchange-ref rendezvous-exchange \
            --runner-temp "$RUNNER_TEMP" \
            --gateway-host 127.0.0.1 \
            --gateway-port 4002 \
            --wait-seconds 900 \
            --mode paper_execute
          if [ -f "$RUNNER_TEMP/ibkr-no-command-close.json" ]; then
            echo 'no_command=true' >> "$GITHUB_OUTPUT"
            echo 'IBKR_WARM_SELECTED_RUNTIME_NO_COMMAND_CLOSE=1'
          else
            echo 'no_command=false' >> "$GITHUB_OUTPUT"
            echo 'IBKR_WARM_SELECTED_RUNTIME_PAPER_EXECUTE_TRANSPORT_COMPLETE=1'
          fi

      - name: Execute one encrypted operator-authorized paper account hygiene command
        id: account_hygiene
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_account_hygiene' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$IBKR_PAPER_ACCOUNT_HYGIENE_MODE" = "1"
          python scripts/ibkr_warm_selected_runtime_activation_v1.py \
            --run-id "$GITHUB_RUN_ID" \
            --public-head "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --exchange-ref rendezvous-exchange \
            --runner-temp "$RUNNER_TEMP" \
            --gateway-host 127.0.0.1 \
            --gateway-port 4002 \
            --wait-seconds 900 \
            --mode paper_account_hygiene
          echo 'IBKR_WARM_PAPER_ACCOUNT_HYGIENE_TRANSPORT_COMPLETE=1'

      - name: Execute one encrypted MM-owned exact historical tick command
        id: forward_exact_ticks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'forward_exact_ticks' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$IBKR_FORWARD_EXACT_TICKS_MODE" = "1"
          python scripts/ibkr_warm_selected_runtime_activation_v1.py \
            --run-id "$GITHUB_RUN_ID" \
            --public-head "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --exchange-ref rendezvous-exchange \
            --runner-temp "$RUNNER_TEMP" \
            --gateway-host 127.0.0.1 \
            --gateway-port 4002 \
            --wait-seconds 900 \
            --mode forward_exact_ticks
          echo 'IBKR_FORWARD_EXACT_TICKS_ENCRYPTED_TRANSPORT_COMPLETE=1'

      - name: Gracefully stop authenticated Gateway before warm-state snapshot
        id: graceful_stop
        # Preserve failed post-auth paper runs without touching persistent Pi Gateway.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          running="$(docker inspect -f '{{.State.Running}}' ibkr-cloudflare-b1 2>/dev/null || echo missing)"
          if [ "$running" = missing ]; then
            echo 'IBKR_GATEWAY_CLEANUP_CONTAINER_ABSENT=1'
            exit 0
          fi
          if [ "$running" = true ]; then
            docker stop --time 90 ibkr-cloudflare-b1 >/dev/null
          fi
          running="$(docker inspect -f '{{.State.Running}}' ibkr-cloudflare-b1 2>/dev/null || echo missing)"
          if [ "$running" != false ]; then
            echo 'IBKR_GATEWAY_GRACEFUL_STOP=0'
            exit 46
          fi
          echo 'IBKR_GATEWAY_GRACEFUL_STOP=1'
          echo 'stopped=1' >> "$GITHUB_OUTPUT"

      - name: Seal authenticated Gateway warm state
        id: seal_warm_state
        if: ${{ always() && steps.auth_boundary.outcome == 'success' && steps.graceful_stop.outputs.stopped == '1' && env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1' }}
        run: |
          set -euo pipefail
          jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm -v "$jts_volume:/state:ro" -v "$RUNNER_TEMP:/export" alpine:3.22 sh -lc 'tar -C /state -czf /export/ibkr-b1-warm-state.tgz .'
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          temp=Path(os.environ['RUNNER_TEMP'])
          vals={}
          for raw in (temp/'ibkr-gateway.env').read_text().splitlines():
              if '=' in raw:
                  k,v=raw.split('=',1); vals[k]=v
          password=vals.get('TWS_PASSWORD_PAPER') or vals.get('TWS_PASSWORD')
          if not password:
              raise SystemExit('paper password missing from sealed environment')
          salt=os.urandom(16); nonce=os.urandom(12)
          key=PBKDF2HMAC(algorithm=hashes.SHA256(),length=32,salt=salt,iterations=250000).derive(password.encode())
          plain=(temp/'ibkr-b1-warm-state.tgz').read_bytes()
          ciphertext=AESGCM(key).encrypt(nonce,plain,b'mmibkr-b1-warm-state-v1')
          (temp/'ibkr-b1-warm-state.tgz.enc').write_bytes(b'MMIBKRWS1'+salt+nonce+ciphertext)
          (temp/'ibkr-b1-warm-state.tgz').unlink()
          print('IBKR_WARM_STATE_SEALED=1')
          print('IBKR_WARM_STATE_PERSISTED=1')
          print('IBKR_WARM_REUSE_READY=1')
          PY

      - name: Publish reusable encrypted warm state
        id: publish_warm_state
        if: ${{ always() && steps.seal_warm_state.outcome == 'success' && steps.graceful_stop.outputs.stopped == '1' && env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibkr-b1-warm-state-clean-v2
          path: ${{ runner.temp }}/ibkr-b1-warm-state.tgz.enc
          if-no-files-found: error
          retention-days: 30

      - name: Publish canonical session and forward-data handoff
        if: env.IBKR_PAPER_ACCOUNT_HYGIENE_MODE != '1' && env.IBKR_PAPER_ACCOUNT_SNAPSHOT_MODE != '1' && env.IBKR_FORWARD_EXACT_TICKS_MODE != '1' && env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibkr-cloudflare-readonly-b1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ibkr-cloudflare-envelope-receipt.json
            ${{ runner.temp }}/ibkr-post-auth-handoff.json
            ${{ runner.temp }}/ibkr-forward-bars-v2.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Publish fixed-field historical session-conflict failure
        if: ${{ always() && steps.post_auth.outcome == 'failure' && env.IBKR_PRODUCTION_LIVE_READONLY_MODE != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibkr-b1-historical-session-conflict-${{ github.run_id }}
          path: ${{ runner.temp }}/ibkr-post-auth-handoff.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce paper proof result after warm-state persistence
        if: ${{ always() && env.IBKR_PAPER_PROOF_MODE == '1' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.paper_proof.outcome }}" != "success" ]; then
            echo 'IBKR_WARM_SELECTED_RUNTIME_PAPER_PROOF_ACCEPTED=0'
            echo 'IBKR_WARM_STATE_PUBLISH_OUTCOME=${{ steps.publish_warm_state.outcome }}'
            echo 'Paper proof failed or was blocked; warm-state publication is independently reported above.'
            exit 52
          fi
          echo 'IBKR_WARM_SELECTED_RUNTIME_PAPER_PROOF_ACCEPTED=1'

      - name: Enforce persistent paper execute result after warm-state persistence
        if: ${{ always() && env.IBKR_PAPER_EXECUTE_MODE == '1' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.paper_execute.outcome }}" != "success" ]; then
            echo 'IBKR_WARM_SELECTED_RUNTIME_PAPER_EXECUTE_ACCEPTED=0'
            echo 'IBKR_WARM_STATE_PUBLISH_OUTCOME=${{ steps.publish_warm_state.outcome }}'
            echo 'Persistent paper execute failed or was blocked; warm-state publication is independently reported above.'
            exit 53
          fi
          if [ "${{ steps.paper_execute.outputs.no_command }}" = "true" ]; then
            echo 'IBKR_WARM_SELECTED_RUNTIME_NO_COMMAND_TERMINAL=1'
            echo 'IBKR_WARM_SELECTED_RUNTIME_COMMAND_EXECUTED=0'
            exit 0
          fi
          echo 'IBKR_WARM_SELECTED_RUNTIME_PAPER_EXECUTE_ACCEPTED=1'

      - name: Enforce paper account hygiene result after warm-state persistence
        if: ${{ always() && env.IBKR_PAPER_ACCOUNT_HYGIENE_MODE == '1' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.account_hygiene.outcome }}" != "success" ]; then
            echo 'IBKR_WARM_PAPER_ACCOUNT_HYGIENE_ACCEPTED=0'
            echo 'IBKR_WARM_STATE_PUBLISH_OUTCOME=${{ steps.publish_warm_state.outcome }}'
            echo 'Paper account hygiene failed or was blocked; warm-state publication is independently reported above.'
            exit 54
          fi
          echo 'IBKR_WARM_PAPER_ACCOUNT_HYGIENE_ACCEPTED=1'

      - name: Enforce exact historical tick result after warm-state persistence
        if: ${{ always() && env.IBKR_FORWARD_EXACT_TICKS_MODE == '1' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.forward_exact_ticks.outcome }}" != "success" ]; then
            echo 'IBKR_FORWARD_EXACT_TICKS_ACCEPTED=0'
            echo 'IBKR_WARM_STATE_PUBLISH_OUTCOME=${{ steps.publish_warm_state.outcome }}'
            echo 'Exact historical tick transport failed; warm-state publication is independently reported above.'
            exit 55
          fi
          echo 'IBKR_FORWARD_EXACT_TICKS_ACCEPTED=1'

      - name: Destroy private runtime material
        if: always()
        run: |
          set +e
          jts_volume="ibkr-b1-jts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          warm_volume="ibkr-b1-warm-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f mmibkr-warm-selected-runtime-proof >/dev/null 2>&1
          docker image rm "mmibkr-warm-proof:${GITHUB_RUN_ID}" >/dev/null 2>&1
          docker stop --time 90 ibkr-cloudflare-b1 >/dev/null 2>&1
          docker rm -f ibkr-cloudflare-b1 >/dev/null 2>&1
          docker volume rm -f "$jts_volume" >/dev/null 2>&1
          docker volume rm -f "$warm_volume" >/dev/null 2>&1
          rm -rf \
            "$RUNNER_TEMP/ibkr-gateway.env" \
            "$RUNNER_TEMP/ibkr-gateway-bootstrap.env" \
            "$RUNNER_TEMP/ibkr-cloudflare-envelope-receipt.json" \
            "$RUNNER_TEMP/ibkr-post-auth-handoff.json" \
            "$RUNNER_TEMP/ibkr-forward-bars-v2.jsonl" \
            "$RUNNER_TEMP/ibkr-auth-boundary.json" \
            "$RUNNER_TEMP/ibkr-controller.log" \
            "$RUNNER_TEMP/ibkr-launcher.log" \
            "$RUNNER_TEMP/ibkr-b1-warm-state.zip" \
            "$RUNNER_TEMP/ibkr-b1-warm-state.tgz" \
            "$RUNNER_TEMP/ibkr-b1-warm-state.tgz.enc" \
            "$RUNNER_TEMP/ibkr-command-private.b64" \
            "$RUNNER_TEMP/ibkr-command-envelope.json" \
            "$RUNNER_TEMP/ibkr-command-ciphertext.bin" \
            "$RUNNER_TEMP/ibkr-submit-request.json" \
            "$RUNNER_TEMP/ibkr-runtime.json" \
            "$RUNNER_TEMP/ibkr-proof-return-recipient.json" \
            "$RUNNER_TEMP/ibkr-paper-proof-receipt.json" \
            "$RUNNER_TEMP/ibkr-paper-execute-receipt.json" \
            "$RUNNER_TEMP/ibkr-paper-account-hygiene-receipt.json" \
            "$RUNNER_TEMP/ibkr-forward-exact-ticks-receipt.json" \
            "$RUNNER_TEMP/ibkr-paper-proof-return" \
            "$RUNNER_TEMP/ibkr-forward-exact-ticks-return" \
            "$RUNNER_TEMP/ibkr-warm-read-return" \
            "$RUNNER_TEMP/mm-ibkr-source" \
            "$RUNNER_TEMP/mmibkr-proof-data" \
            "$RUNNER_TEMP/warm-artifact"
          echo 'IBKR_PRIVATE_RUNTIME_DESTROYED=1'
