name: Model Challenger Ephemeral Rendezvous R1

on:
  push:
    branches:
      - 'assistant/model-challenger-rendezvous-r1'
    paths:
      - 'scripts/forward_native_ephemeral_consumer_v1.py'
      - '.github/workflows/model-challenger-ephemeral-rendezvous-r1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-challenger-ephemeral-rendezvous-r1-${{ github.sha }}
  cancel-in-progress: false

env:
  HARNESS: semiconductor_matched_residual_ridge_challenger_v1
  EXCHANGE_REF: rendezvous-exchange
  RECIPIENT_ROOT: rendezvous/recipients
  RESPONSE_ROOT: rendezvous/responses

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 yfinance==0.2.65
      - name: Self-test encrypted consumer
        run: python scripts/forward_native_ephemeral_consumer_v1.py --self-test
      - name: Generate one-run compute recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          h=os.environ['HARNESS']
          root=Path(os.environ['RUNNER_TEMP'])
          root.joinpath('model-challenger-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          record={
            'schema':'forward-native-ephemeral-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'harness':h,
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
          }
          root.joinpath('model-challenger-recipient.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          print('MODEL_CHALLENGER_RECIPIENT key_id='+record['recipient_key_id'])
          PY
      - name: Publish one-run recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-${HARNESS}-forward-native.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/model-challenger-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish model challenger recipient','content':content,'branch':branch}))
          PY
          )"
          status="$(curl -sS -o "$RUNNER_TEMP/put.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body")"
          test "$status" = 200 -o "$status" = 201 || { cat "$RUNNER_TEMP/put.json"; exit 22; }
          echo "MODEL_CHALLENGER_RECIPIENT_PATH=${path}"
      - name: Wait for encrypted private source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/${HARNESS}-input.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 240); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -o "$RUNNER_TEMP/model-challenger-input.json"; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo MODEL_CHALLENGER_CAPSULE_NOT_RECEIVED; exit 42; }
      - name: Execute private challenger and encrypt result
        run: |
          set -euo pipefail
          python scripts/forward_native_ephemeral_consumer_v1.py             --envelope "$RUNNER_TEMP/model-challenger-input.json"             --private-key "$RUNNER_TEMP/model-challenger-private.b64"             --run-id "$GITHUB_RUN_ID"             --harness "$HARNESS"             --return-envelope "$RUNNER_TEMP/model-challenger-return.json"
      - name: Publish encrypted return only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/${HARNESS}-return.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/model-challenger-return.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish encrypted model challenger return','content':content,'branch':branch}))
          PY
          )"
          status="$(curl -sS -o "$RUNNER_TEMP/put-return.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body")"
          test "$status" = 200 -o "$status" = 201 || { cat "$RUNNER_TEMP/put-return.json"; exit 23; }
          echo "MODEL_CHALLENGER_RETURN_PATH=${path}"
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/model-challenger-private.b64" "$RUNNER_TEMP/model-challenger-recipient.json" "$RUNNER_TEMP/model-challenger-input.json" "$RUNNER_TEMP/model-challenger-return.json"
