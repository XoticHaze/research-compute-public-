name: P282 CFTC Relative Alpha R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p282_cftc_relative_alpha_r1.py'
      - '.github/workflows/p282-cftc-relative-alpha-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p282_cftc_relative_alpha_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p282_cftc_relative_alpha_r1.json')); a=x['tests']['all']; r=x['tests']['recent']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__allinc_{bp(a['arms']['combined']['cagr']-a['arms']['price']['cagr'])}__recentinc_{bp(r['arms']['combined']['cagr']-r['arms']['price']['cagr'])}__folds_{a['positive_combined_minus_price_folds']}_{r['positive_combined_minus_price_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p282-cftc-relative-alpha__${{ steps.eval.outputs.tag }}
          path: artifacts/p282_cftc_relative_alpha_r1.json
          if-no-files-found: error
