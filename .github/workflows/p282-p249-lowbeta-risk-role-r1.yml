name: P282 P249 Low Beta Risk Role R1
on:
  pull_request:
    branches: [assistant/market-research-p281-sector-lowbeta-r1]
    paths:
      - 'research/p282_p249_lowbeta_risk_role_r1.py'
      - '.github/workflows/p282-p249-lowbeta-risk-role-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact admitted P248 source owner
        run: |
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/research-compute-public-/20490f115d901aac3b586c33072c1157ad4d10a6/research/p248_smallvalue_survivor_complementarity_r1.py -o research/p248_smallvalue_survivor_complementarity_r1.py
          test "$(git hash-object research/p248_smallvalue_survivor_complementarity_r1.py)" = "a0c63a4277913512ad8b081d324cca5f0c074c39"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          cd research && python p282_p249_lowbeta_risk_role_r1.py && cd ..
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p282_p249_lowbeta_risk_role_r1.json')); z=x['tests']['2020']['lowbeta_increment']; bp=lambda v:int(round(v*10000))
          tag=f"{x['decision']}__cagr_{bp(z['cagr_delta'])}__dd_{bp(z['maxdd_delta'])}__w12_{bp(z['worst_rolling_12m_delta'])}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p282-p249-lowbeta-risk-role__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p282_p249_lowbeta_risk_role_r1.json
          if-no-files-found: error
