name: Fixed Multi-Factor Cross-Sectional R1

on:
  pull_request:
    paths:
      - 'research/fixed_multifactor_cross_sectional_r1.py'
      - '.github/workflows/fixed-multifactor-cross-sectional-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        universe:
          - sector
          - industry
          - crossasset
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - name: Execute fixed composite child
        run: >-
          python research/fixed_multifactor_cross_sectional_r1.py
          --universe '${{ matrix.universe }}'
          --out 'artifacts/${{ matrix.universe }}_fixed_multifactor.json'
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-multifactor-${{ matrix.universe }}
          path: artifacts/${{ matrix.universe }}_fixed_multifactor.json
          if-no-files-found: error
          retention-days: 30
