name: P553 SEC FTD Transport Probe R2

on:
  pull_request:
    paths:
      - 'research/p553_sec_ftd_transport_probe_r2.py'
      - '.github/workflows/p553-sec-ftd-transport-probe-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python research/p553_sec_ftd_transport_probe_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: p553-sec-ftd-transport-probe-r2
          path: artifacts/p553_sec_ftd_transport_probe_r2.json
          if-no-files-found: error
