name: P169 P46 Calendar Block Stability R1
on:
  pull_request:
    paths:
      - 'research/p169_p46_calendar_block_stability_r1.py'
      - '.github/workflows/p169-p46-calendar-block-stability-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p169_p46_calendar_block_stability_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p169_p46_calendar_block_stability_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"decision={x['decision']}\npositive={x['positive_matched_blocks']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p169-p46-calendar-block__${{ steps.run.outputs.decision }}__positive_${{ steps.run.outputs.positive }}of3
          path: artifacts/p169_p46_calendar_block_stability_r1.json
          if-no-files-found: error
