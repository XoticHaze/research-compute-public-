name: PKW Buyback Alpha R1
on:
  pull_request:
    paths:
      - '.github/workflows/pkw-buyback-alpha-r1.yml'
      - 'research/pkw-buyback-alpha-r1.json'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Evaluate frozen PKW buyback alpha
        run: |
          python - <<'PY'
          import json,urllib.request,datetime as dt
          from pathlib import Path
          c=json.loads(Path('research/pkw-buyback-alpha-r1.json').read_text()); st=dt.datetime.fromisoformat(c['start']+'T00:00:00+00:00'); en=dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=1)
          def fetch(s):
              u=f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?period1={int(st.timestamp())}&period2={int(en.timestamp())}&interval=1d&events=history&includeAdjustedClose=true"; req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as q:o=json.load(q)['chart']['result'][0]
              a=o['indicators'].get('adjclose',[{}])[0].get('adjclose') or o['indicators']['quote'][0]['close']; return {dt.datetime.fromtimestamp(t,dt.timezone.utc).date().isoformat():float(p) for t,p in zip(o['timestamp'],a) if p is not None}
          px={s:fetch(s) for s in ['PKW','VTV','SPY']}; ds=sorted(set(px['PKW'])&set(px['VTV'])&set(px['SPY'])); months={}
          for d in ds: months.setdefault(d[:7],[]).append(d)
          rows=[]
          for m,z in sorted(months.items()):
              if len(z)<10: continue
              rows.append((m,px['PKW'][z[-1]]/px['PKW'][z[0]]-1,px['VTV'][z[-1]]/px['VTV'][z[0]]-1,px['SPY'][z[-1]]/px['SPY'][z[0]]-1))
          def stats(z):
              w=v=s=1.0; peak=1.0; mdd=0.0; yrs={}
              for m,r,rv,rs in z:
                  w*=1+r; v*=1+rv; s*=1+rs; peak=max(peak,w); mdd=min(mdd,w/peak-1); yrs.setdefault(m[:4],[1,1,1]); yrs[m[:4]][0]*=1+r; yrs[m[:4]][1]*=1+rv; yrs[m[:4]][2]*=1+rs
              y=max(1,len(z)/12); cost=c['cost_bps']/10000; cg=(w*(1-cost))**(1/y)-1; vg=(v*(1-cost))**(1/y)-1; sg=(s*(1-cost))**(1/y)-1; wins=sum(1 for a,b,_ in yrs.values() if a>b)
              return {'months':len(z),'cagr':cg,'vtv_cagr':vg,'spy_cagr':sg,'excess_vs_vtv':cg-vg,'excess_vs_spy':cg-sg,'max_drawdown':mdd,'winning_years_vs_vtv':wins,'calendar_years':len(yrs),'positive_year_fraction_vs_vtv':wins/max(1,len(yrs))}
          p={k:stats([x for x in rows if x[0]>=lo and (hi is None or x[0]<hi)]) for k,(lo,hi) in c['periods'].items()}; g=c['gates']; f=p['full']
          out={'schema':'pkw_buyback_alpha_result.v1','periods':p,'gates':g}; out['supported']=(f['excess_vs_vtv']>=g['min_full_excess_vs_vtv'] and f['excess_vs_spy']>=g['min_full_excess_vs_spy'] and p['pre2020']['excess_vs_vtv']>=g['min_pre2020_excess_vs_vtv'] and p['post2020']['excess_vs_vtv']>=g['min_post2020_excess_vs_vtv'] and f['positive_year_fraction_vs_vtv']>=g['min_positive_year_fraction_vs_vtv']); out['research_only']=True
          Path('pkw-buyback-alpha-r1-result.json').write_text(json.dumps(out,sort_keys=True,indent=2)); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: pkw-buyback-alpha-r1-result, path: pkw-buyback-alpha-r1-result.json, retention-days: 14}
