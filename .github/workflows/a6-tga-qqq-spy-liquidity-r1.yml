name: A6 TGA QQQ SPY Liquidity R1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tga_qqq_spy_liquidity_r1.py'
      - '.github/workflows/a6-tga-qqq-spy-liquidity-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - name: Execute frozen Treasury-liquidity discriminator
        run: python research/tga_qqq_spy_liquidity_r1.py
      - name: Assert chronology and terminal receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/tga_qqq_spy_liquidity_r1.json'))
          assert x['schema']=='research.tga_qqq_spy_liquidity_r1.v1'
          assert x['frozen_contract']['information_delay_market_sessions']==2
          assert x['boundaries']['2026_outcomes_protected'] is True
          assert x['source_lineage']['2026_tga_requested'] is False
          assert x['sample']['last_exit_date'] <= '2025-12-31'
          assert x['result']['decision'] in {'TGA_QQQ_SPY_LIQUIDITY_R1_SUPPORTED','TGA_QQQ_SPY_LIQUIDITY_R1_REJECTED'}
          print('A6_TGA_TERMINAL='+x['result']['decision'])
          print('A6_TGA_EVENTS='+str(x['sample']['scoreable_weekly_events']))
          print('A6_TGA_2016_EXCESS_BPS='+str(x['result']['windows']['2016_plus']['mean_matched_excess_bps']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a6-tga-qqq-spy-liquidity-r1-result
          path: artifacts/tga_qqq_spy_liquidity_r1.json
          if-no-files-found: error
          retention-days: 90
