name: SEC 8-K Management Reaction Drift R1
on:
  push:
    branches: [market-research/sec-8k-management-reaction-drift-r1-20260913]
    paths:
      - 'research/sec_8k_management_reaction_drift_r1.py'
      - '.github/workflows/sec-8k-management-reaction-drift-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Frozen provenance
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "experiment_id=SEC_8K_MANAGEMENT_REACTION_DRIFT_R1_20260913"
          echo "prereg=CommandCenter@ea8105796d968e30568f9a34c24a438e5ce91280"
      - name: Compile evaluator
        run: python -m py_compile research/sec_8k_earnings_reaction_drift_r1.py research/sec_8k_management_reaction_drift_r1.py
      - name: Execute frozen Item 5.02 comparator
        run: python research/sec_8k_management_reaction_drift_r1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec-8k-management-reaction-drift-r1-result
          path: research/results/sec_8k_management_reaction_drift_r1.json
          retention-days: 30
          if-no-files-found: error
