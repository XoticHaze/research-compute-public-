name: P03 Private Preview Binding Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/p03-private-binding-*.txt'
      - '.github/workflows/p03-private-binding-ephemeral-rendezvous.yml'
      - 'scripts/p03_private_binding_contract_consumer_v1.py'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses
  RECIPIENT_ROOT: rendezvous/recipients
  EXCHANGE_REF: rendezvous-exchange

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'p03-binding-private-key.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={
            'schema':'p03-private-binding-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
          }
          Path(os.environ['RUNNER_TEMP'],'p03-binding-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('P03_BINDING_EPHEMERAL_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('P03_BINDING_EPHEMERAL_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY
      - name: Publish public recipient to exchange branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recipient_path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/p03-binding-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish one-run P03 binding recipient','content':content,'branch':branch}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${recipient_path}" \
            -d "$body" >/dev/null
          echo "P03_BINDING_EPHEMERAL_RECIPIENT_PATH=${recipient_path}"
      - name: Wait for structurally valid run-bound encrypted envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/sealed-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${response_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/p03-binding-envelope.candidate.json"; then
              if python - "$RUNNER_TEMP/p03-binding-envelope.candidate.json" "$GITHUB_RUN_ID" <<'PY'
          import base64,json,sys
          path,run_id=sys.argv[1:]
          try:
              d=json.load(open(path,encoding='utf-8'))
              required={'schema','run_id','authority','harness','recipient_key_id','sender_public_b64','nonce_b64','ciphertext_b64','plaintext_sha256'}
              assert set(d)==required
              assert d['schema']=='p03-private-binding-x25519-v1'
              assert str(d['run_id'])==str(run_id)
              assert d['authority']=='research_only'
              assert d['harness']=='mm_p03_preview_operator_binding_contract_v1'
              assert len(base64.b64decode(d['sender_public_b64'],validate=True))==32
              assert len(base64.b64decode(d['nonce_b64'],validate=True))==12
              assert len(base64.b64decode(d['ciphertext_b64'],validate=True))>32
              assert len(d['plaintext_sha256'])==64
          except Exception:
              raise SystemExit(1)
          PY
              then
                mv "$RUNNER_TEMP/p03-binding-envelope.candidate.json" "$RUNNER_TEMP/p03-binding-envelope.json"
                found=1
                break
              fi
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'valid run-bound encrypted envelope did not arrive'; exit 42; }
      - name: Execute fixed private P03 preview binding contract
        run: |
          set -euo pipefail
          python scripts/p03_private_binding_contract_consumer_v1.py \
            --envelope "$RUNNER_TEMP/p03-binding-envelope.json" \
            --private-key "$RUNNER_TEMP/p03-binding-private-key.b64" \
            --run-id "$GITHUB_RUN_ID"
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/p03-binding-private-key.b64" "$RUNNER_TEMP/p03-binding-recipient.json" "$RUNNER_TEMP/p03-binding-envelope.json" "$RUNNER_TEMP/p03-binding-envelope.candidate.json"
