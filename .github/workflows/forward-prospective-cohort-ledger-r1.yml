name: Forward Prospective Cohort Ledger R1

on:
  workflow_dispatch:
  schedule:
    - cron: '35 0 * * 2-6'
  push:
    branches:
      - main
      - 'assistant/forward-prospective-cohort-ledger-r1'
    paths:
      - 'research/forward_prospective_cohort_ledger_r1.py'
      - 'research/current/native_adapters/*.json'
      - '.github/workflows/forward-prospective-cohort-ledger-r1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/forward_prospective_cohort_ledger_r1.py'
      - '.github/workflows/forward-prospective-cohort-ledger-r1.yml'

permissions:
  contents: read

concurrency:
  group: forward-prospective-cohort-ledger-r1
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 yfinance==0.2.65
      - name: Self-test prospective chronology
        run: python research/forward_prospective_cohort_ledger_r1.py --self-test
      - name: Resolve only matured prospective cohorts
        run: |
          python research/forward_prospective_cohort_ledger_r1.py \
            --adapter-dir research/current/native_adapters \
            --prior research/current/forward_prospective_cohort_ledger_r1.json \
            --output artifacts/forward_prospective_cohort_ledger_r1.json
      - name: Print compact resolution state
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/forward_prospective_cohort_ledger_r1.json'))
          print('summary=',json.dumps(x['summary'],sort_keys=True))
          for c in x['cohorts']:
              print(c['cohort_id'],c['status'],c.get('signal_date'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forward-prospective-cohort-ledger-r1
          path: artifacts/forward_prospective_cohort_ledger_r1.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve single canonical current-bundle owner
        run: |
          set -euo pipefail
          test -f artifacts/forward_prospective_cohort_ledger_r1.json
          echo 'CANONICAL_CURRENT_OWNER=forward-market-scoreboard-r1.yml'
          echo 'STANDALONE_LEDGER_MODE=diagnostic_artifact_only'
