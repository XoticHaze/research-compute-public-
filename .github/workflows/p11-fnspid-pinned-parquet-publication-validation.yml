name: P11 FNSPID Pinned Parquet Publication Validation

on:
  pull_request:
    paths:
      - 'research/p11_fnspid_pinned_parquet_publication_validation_20260907.py'
      - '.github/workflows/p11-fnspid-pinned-parquet-publication-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed transport and metadata environment
        run: |
          python -m pip install --disable-pip-version-check -q \
            duckdb==1.4.1 \
            huggingface_hub==0.35.3 \
            beautifulsoup4==4.13.5 \
            python-dateutil==2.9.0.post0
      - name: Compile pinned transport consumer
        run: |
          python -m py_compile \
            research/p11_fnspid_article_publication_authority_validation_20260907.py \
            research/p11_fnspid_pinned_parquet_publication_validation_20260907.py
      - name: Execute pinned Parquet publication-authority validation
        working-directory: research
        run: python p11_fnspid_pinned_parquet_publication_validation_20260907.py
      - name: Retain sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11-fnspid-pinned-parquet-publication-validation
          path: research/p11_fnspid_pinned_parquet_publication_validation_20260907.json
          retention-days: 30
          if-no-files-found: warn
