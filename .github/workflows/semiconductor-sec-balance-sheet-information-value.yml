name: Semiconductor SEC Balance Sheet Information Value
on:
  pull_request:
    paths:
      - 'research/sec_hf_local_materialized_semiconductor_cache_20260906.py'
      - 'research/semiconductor_sec_balance_sheet_information_value_20260906.py'
      - 'research/semiconductor_fundamental_consumer_contract_20260906.json'
      - '.github/workflows/semiconductor-sec-balance-sheet-information-value.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: '600'
      HF_HUB_ETAG_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install exact source and numerical environment
        run: python -m pip install --disable-pip-version-check -q 'huggingface_hub[hf_xet]==0.34.4' duckdb==1.3.2 numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Materialize current revision once and build frozen SEC cache locally
        run: python research/sec_hf_local_materialized_semiconductor_cache_20260906.py
      - name: Execute first filing-safe balance-sheet information consumer
        run: PYTHONPATH=. python -m research.semiconductor_sec_balance_sheet_information_value_20260906
      - name: Retain compact reusable source and consumer receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semiconductor-sec-balance-sheet-information-value
          path: |
            sec_hf_root_parquet_semiconductor_preflight_20260906.json
            sec_hf_root_parquet_semiconductor_cache_20260906.json
            semiconductor_sec_balance_sheet_information_value_20260906.json
          retention-days: 90
          if-no-files-found: warn
