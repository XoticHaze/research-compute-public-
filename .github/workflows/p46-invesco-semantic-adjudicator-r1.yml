name: P46 Invesco Semantic Adjudicator R1
on:
  pull_request:
    paths:
      - 'research/p46_invesco_semantic_adjudicator_r1.py'
      - '.github/workflows/p46-invesco-semantic-adjudicator-r1.yml'
permissions: {contents: read}
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python research/p46_invesco_semantic_adjudicator_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p46-invesco-semantic-adjudicator-r1
          path: artifacts/p46_invesco_semantic_adjudicator_r1.json
          if-no-files-found: error
