name: MM-IBKR Promotion Candidate Publisher R1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'promotion/candidates/**'
      - '.github/workflows/mmibkr-promotion-candidate-publisher-r1.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmibkr-promotion-candidate-publisher-r1
  cancel-in-progress: false

env:
  OPERATOR_CONSOLE_URL: https://mmibkr-operator-console.slenderiq.workers.dev
  CANDIDATE_FILE: promotion/candidates/mnq_crw_w96_entry_m252_research_v1.json

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Validate candidate packet before publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['CANDIDATE_FILE'])
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('schema') != 'mmibkr.promotion_candidate_snapshot.v1':
              raise SystemExit('candidate schema rejected')
          rows = node.get('candidates')
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit('initial publisher requires exactly one candidate')
          row = rows[0]
          if row.get('candidate_id') != 'autotuner:mnq-crw-w96-entry-m252:3680e21e3bdbc38a':
              raise SystemExit('candidate identity mismatch')
          if row.get('candidate_digest') != '3680e21e3bdbc38a1729cc38fd0c9d42d66242d970cce1617bbdd71c761a1ac6':
              raise SystemExit('StrategySpec digest mismatch')
          if row.get('evidence_digest') != '9f4e88c69e787ee0a4b87d3349498b73acb4b79e':
              raise SystemExit('evidence identity mismatch')
          if row.get('current_stage') != 'RESEARCH' or row.get('proposed_stage') != 'ARENA':
              raise SystemExit('stage contract mismatch')
          if row.get('review_ready') is not False:
              raise SystemExit('fresh-holdout candidate must remain non-reviewable')
          if (row.get('health') or {}).get('research_disposition') != 'CONTINUE_FRESH_HOLDOUT':
              raise SystemExit('research disposition mismatch')
          safety = node.get('safety') or {}
          if (
              safety.get('broker_mutation_authority') is not False
              or safety.get('selected_runtime_write') is not False
              or safety.get('live_execution_allowed') is not False
          ):
              raise SystemExit('candidate packet authority rejected')
          print('MMIBKR_PROMOTION_CANDIDATE_PACKET=PASS')
          PY

      - name: Publish candidate packet to durable Operator Console
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from urllib.request import Request, urlopen

          parsed = urlparse(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'])
          query = dict(parse_qsl(parsed.query, keep_blank_values=True))
          query['audience'] = 'mmibkr-operator-console'
          token_url = urlunparse((
              parsed.scheme,
              parsed.netloc,
              parsed.path,
              parsed.params,
              urlencode(query),
              parsed.fragment,
          ))
          token_request = Request(
              token_url,
              headers={
                  'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                  'Accept': 'application/json',
              },
          )
          with urlopen(token_request, timeout=20) as response:
              token = str(json.load(response).get('value') or '')
          if token.count('.') != 2:
              raise SystemExit('OIDC token invalid')

          body = Path(os.environ['CANDIDATE_FILE']).read_bytes()
          request = Request(
              os.environ['OPERATOR_CONSOLE_URL'].rstrip('/') + '/v1/promotion-candidates',
              data=body,
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'mmibkr-promotion-candidate-publisher-r1',
                  'X-MMIBKR-Caller-Run-Id': os.environ['GITHUB_RUN_ID'],
              },
          )
          receipt = None
          for attempt in range(1, 61):
              try:
                  with urlopen(request, timeout=30) as response:
                      receipt = json.load(response)
                  break
              except HTTPError as exc:
                  if exc.code not in {401, 403, 502, 503}:
                      raise
                  if attempt % 12 == 0:
                      print('MMIBKR_PROMOTION_PUBLISH_WAIT=' + str(attempt))
                  time.sleep(5)
          if receipt is None:
              raise SystemExit('candidate publication authority did not converge')
          if receipt.get('ok') is not True:
              raise SystemExit('candidate publication failed')
          if receipt.get('schema') != 'mmibkr.promotion_candidate_publish_receipt.v1':
              raise SystemExit('candidate receipt schema mismatch')
          if receipt.get('candidate_count') != 1:
              raise SystemExit('candidate count mismatch')
          if receipt.get('durable_readback_verified') is not True:
              raise SystemExit('durable readback not verified')
          if receipt.get('broker_mutation_authority') is not False:
              raise SystemExit('broker mutation authority unexpectedly present')
          if receipt.get('live_execution_allowed') is not False:
              raise SystemExit('live execution unexpectedly present')
          print('MMIBKR_PROMOTION_CANDIDATE_PUBLISH=PASS')
          print('MMIBKR_PROMOTION_CANDIDATE_COUNT=1')
          print('MMIBKR_PROMOTION_DURABLE_READBACK=1')
          print('MMIBKR_PROMOTION_BROKER_MUTATION=0')
          print('MMIBKR_PROMOTION_LIVE_EXECUTION=0')
          PY
