name: US Cross-Cap Momentum Factor R2
on:
  push:
    branches:
      - market-research/us-crosscap-momentum-factor-r1-20260913
    paths:
      - 'research/us-crosscap-momentum-factor-r2.json'
      - 'research/us_crosscap_momentum_factor_r2.py'
      - '.github/workflows/us-crosscap-momentum-factor-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Frozen provenance
        run: |
          echo "public_head=${GITHUB_SHA}"
          echo "scientific_id=US-CROSSCAP-MOMENTUM-FACTOR-R2-20260913"
          echo "correction=completed_month_end_to_prior_month_end_returns"
      - name: Compile evaluator
        run: python -m py_compile research/us_crosscap_momentum_factor_r2.py
      - name: Execute corrected frozen factor discriminator
        run: python research/us_crosscap_momentum_factor_r2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: us-crosscap-momentum-factor-r2-result
          path: research/results/us_crosscap_momentum_factor_r2.json
          retention-days: 30
