name: REIT Source Preflight

on:
  push:
    paths:
      - '.github/workflows/reit-source-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen numerical environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.17.1
      - name: Inspect fixed REIT panel source support only
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/XoticHaze/TextConverterToolbox/2d8995ba66502a4de25c64c1c32a67e132b05522/research/run_industry_stagea_public_runner_20260905.py -o /tmp/runner.py
          test "$(git hash-object /tmp/runner.py)" = 9f7f802469dc6a33abd3431295d5232ebc4289c5
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('r','/tmp/runner.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          original=['AMT','PLD','O','SPG','EQIX','PSA','WELL','DLR']
          fresh=['CCI','VICI','AVB','EQR','EXR','MAA','CPT','ARE']
          required=[*r.TRAIN,*fresh,'QQQ','VNQ']
          rows={}
          calendars=[]
          for symbol in required:
              try:
                  f=r._load(symbol)
                  rows[symbol]={
                    'status':'OK','rows':len(f),
                    'start':None if f.empty else f.iloc[0].timestamp.isoformat(),
                    'end':None if f.empty else f.iloc[-1].timestamp.isoformat()
                  }
                  calendars.append(set(f.timestamp))
              except Exception as exc:
                  rows[symbol]={'status':'ERROR','error':f'{type(exc).__name__}: {exc}'}
          common=set.intersection(*calendars) if calendars else set()
          receipt={
            'schema':'reit_source_preflight.v1',
            'original_development_universe':original,
            'fresh_confirmation_universe':fresh,
            'required_inputs':required,
            'source_rows':rows,
            'common_calendar_rows':len(common),
            'common_calendar_start':min(common).isoformat() if common else None,
            'common_calendar_end':max(common).isoformat() if common else None,
            'model_executed':False,
            'outcomes_seen':False,
            'symbol_substitution':False,
            'research_only':True,
            'promotion_authority':False,
            'allocation_authority':False,
            'runtime_mutation':False,
            'live_trading_change':False
          }
          open('reit-source-preflight.json','w').write(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('REIT_SOURCE_PREFLIGHT='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reit-source-preflight
          path: reit-source-preflight.json
          retention-days: 14
