name: P13 Source Repeatability R1
on:
  pull_request:
    paths: ['scripts/p13_source_repeatability_r1.py','.github/workflows/p13-source-repeatability-r1.yml']
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python scripts/p13_source_repeatability_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_source_repeatability_r1.json')); lo,hi=x['candidate_recent_cagr_range']; vals={'decision':x['decision'],'hashes':x['unique_panel_hashes'],'span':f"{100*(hi-lo):.2f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-source-repeatability__${{ steps.evaluate.outputs.decision }}__hashes_${{ steps.evaluate.outputs.hashes }}__cagr_span_${{ steps.evaluate.outputs.span }}pp
          path: artifacts/p13_source_repeatability_r1.json
          if-no-files-found: error
