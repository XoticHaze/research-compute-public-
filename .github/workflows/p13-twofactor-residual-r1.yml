name: P13 Twofactor Residual R1
on:
  pull_request:
    paths:
      - 'scripts/p13_twofactor_residual_r1.py'
      - '.github/workflows/p13-twofactor-residual-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 yfinance==0.2.65
      - id: evaluate
        run: |
          python scripts/p13_twofactor_residual_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p13_twofactor_residual_r1.json'))
          r=x['tests']['2022_forward']['50']
          vals={'decision':x['decision'],'one':f"{100*r['excess_vs_onefactor_cagr']:.2f}",'smh':f"{100*r['excess_vs_smh_cagr']:.2f}",'changed':f"{100*x['selection_changed_fraction_vs_onefactor']:.1f}"}
          with open(os.environ['GITHUB_OUTPUT'],'a') as z:
            for k,v in vals.items(): z.write(f'{k}={v}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-twofactor__${{ steps.evaluate.outputs.decision }}__vs_one_${{ steps.evaluate.outputs.one }}pp__vs_smh_${{ steps.evaluate.outputs.smh }}pp__changed_${{ steps.evaluate.outputs.changed }}pct
          path: artifacts/p13_twofactor_residual_r1.json
          if-no-files-found: error
