name: sec-ftd-fund-stress-gate-r1

on:
  push:
    paths:
      - 'research/sec_ftd_fund_stress_gate_r1.py'
      - 'research/sec_ftd_fund_stress_gate_r1_sec_index_fix.py'
      - '.github/workflows/sec-ftd-fund-stress-gate-r1.yml'
  pull_request:
    paths:
      - 'research/sec_ftd_fund_stress_gate_r1.py'
      - 'research/sec_ftd_fund_stress_gate_r1_sec_index_fix.py'
      - '.github/workflows/sec-ftd-fund-stress-gate-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests brotli
      - name: Execute frozen SEC FTD fund stress discriminator
        run: python research/sec_ftd_fund_stress_gate_r1_sec_index_fix.py
      - name: Upload deterministic scientific result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-ftd-fund-stress-gate-r1-${{ github.run_id }}
          path: artifacts/sec_ftd_fund_stress_gate_r1.json
          if-no-files-found: error
          retention-days: 14
