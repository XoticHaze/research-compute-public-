name: P554 Census M3 Industry Shape R1

on:
  pull_request:
    paths:
      - 'research/p554_census_m3_industry_shape_r1.py'
      - '.github/workflows/p554-census-m3-industry-shape-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python research/p554_census_m3_industry_shape_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p554-census-m3-industry-shape
          path: artifacts/p554_census_m3_industry_shape_r1.json
          if-no-files-found: error
