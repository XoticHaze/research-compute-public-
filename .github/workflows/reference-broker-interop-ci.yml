name: Reference Broker Interop CI

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/reference-release-broker/**'
      - 'scripts/reference_release_grant_v1.py'
      - 'tests/reference_release_intent_interop.mjs'
      - 'tests/reference_release_intent_interop_prepare.py'
      - 'scripts/reference_release_intent_v1.py'
      - 'tests/reference_release_broker_policy.mjs'
      - 'tests/reference_release_ticket_interop.py'
      - 'tests/reference_release_grant_interop_prepare.py'
      - 'tests/reference_release_grant_interop.mjs'
      - 'tests/reference_release_broker_package.mjs'
      - 'tests/reference_live_release_contract.py'
      - 'scripts/reference_release_ticket_v1.py'
      - 'scripts/operator/reference_release_keygen.mjs'
      - 'scripts/operator/reference_release_prepare_intent.mjs'
      - 'tests/reference_operator_helper_roundtrip.py'
      - '.github/workflows/reference-broker-interop-ci.yml'
  pull_request:
    paths:
      - 'cloudflare/reference-release-broker/**'
      - 'tests/reference_release_broker_policy.mjs'
      - 'tests/reference_release_ticket_interop.py'
      - 'scripts/reference_release_ticket_v1.py'
      - '.github/workflows/reference-broker-interop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Prove broker claim policy and WebCrypto signer
        run: node tests/reference_release_broker_policy.mjs
      - name: Prepare private-authority signed grant
        run: python tests/reference_release_grant_interop_prepare.py
      - name: Prove WebCrypto verifies private-authority grant
        run: node tests/reference_release_grant_interop.mjs
      - name: Prove Python private-authority interoperability
        run: python tests/reference_release_ticket_interop.py
      - name: Prepare offline signed intent
        run: python tests/reference_release_intent_interop_prepare.py
      - name: Prove WebCrypto verifies offline signed intent
        run: node tests/reference_release_intent_interop.mjs
      - name: Prove pinned live broker-harness contract
        run: python tests/reference_live_release_contract.py
      - name: Prove local operator key and intent helpers
        run: python tests/reference_operator_helper_roundtrip.py
      - name: Validate broker package and dry-run build
        run: |
          node --check cloudflare/reference-release-broker/src/index.js
          node --check cloudflare/reference-release-broker/src/intent.js
          node --check cloudflare/reference-release-broker/src/ticket.js
          node tests/reference_release_broker_package.mjs
          npx --yes wrangler@4.135.0 deploy --dry-run             --config cloudflare/reference-release-broker/wrangler.jsonc             --outdir "$RUNNER_TEMP/reference-release-broker-dry-run"
      - name: Ensure proof files contain no private signing key
        run: |
          set -euo pipefail
          test -s reference-release-ticket.json
          test -s reference-release-signer-public.txt
          test -s reference-release-expected.json
          ! grep -R -E 'PRIVATE KEY|privateKey|BEGIN PRIVATE'             reference-release-ticket.json             reference-release-signer-public.txt             reference-release-expected.json \
            reference-authority-grant.json \
            reference-authority-public.txt \
            reference-authority-grant-expected.json
