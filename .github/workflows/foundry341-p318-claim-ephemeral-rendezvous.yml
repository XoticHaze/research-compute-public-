name: Foundry 341 P318 Claim Ephemeral Rendezvous

on:
  pull_request:
    paths:
      - 'rendezvous/requests/foundry341-p318-claim-*.txt'
      - '.github/workflows/foundry341-p318-claim-ephemeral-rendezvous.yml'
      - 'scripts/foundry341_p318_claim_ephemeral_consumer_v1.py'

permissions:
  contents: write

env:
  RESPONSE_ROOT: rendezvous/responses/foundry341-p318
  RECIPIENT_ROOT: rendezvous/recipients/foundry341-p318
  EXCHANGE_REF: rendezvous-exchange

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Generate one-run recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'foundry341-p318-private-key.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          recipient={
            'schema':'foundry341-p318-claim-recipient-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
            'foundry_pr':341,
            'foundry_head_sha':'a570e8f60514bf4acb8d8ce2828c17bb3032dc20',
            'claim_git_blob_sha':'5ddd9f6743ebaefbdedf79fc7e3bd64f3fee66e6',
          }
          Path(os.environ['RUNNER_TEMP'],'foundry341-p318-recipient.json').write_text(json.dumps(recipient,sort_keys=True)+'\n')
          print('FOUNDRY341_P318_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('FOUNDRY341_P318_RECIPIENT_KEY_ID='+recipient['recipient_key_id'])
          PY
      - name: Publish recipient to exchange branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recipient_path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}.json"
          payload="$(base64 -w0 "$RUNNER_TEMP/foundry341-p318-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          content,branch=sys.argv[1:]
          print(json.dumps({'message':'rendezvous: publish one-run Foundry 341 P318 recipient','content':content,'branch':branch}))
          PY
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${recipient_path}" \
            -d "$body" >/dev/null
          echo "FOUNDRY341_P318_RECIPIENT_PATH=${recipient_path}"
      - name: Wait for run-bound encrypted envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/sealed-envelope.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${response_path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 120); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' "$api" -o "$RUNNER_TEMP/sealed-envelope.json"; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound encrypted envelope did not arrive'; exit 42; }
      - name: Accept exact P318 private claim
        run: |
          set -euo pipefail
          python scripts/foundry341_p318_claim_ephemeral_consumer_v1.py \
            --envelope "$RUNNER_TEMP/sealed-envelope.json" \
            --private-key "$RUNNER_TEMP/foundry341-p318-private-key.b64" \
            --run-id "$GITHUB_RUN_ID"
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/foundry341-p318-private-key.b64" "$RUNNER_TEMP/foundry341-p318-recipient.json" "$RUNNER_TEMP/sealed-envelope.json"
