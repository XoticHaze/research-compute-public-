name: CPER GLD EM Selection R1 Source Integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/cper_gld_em_selection_r1.py'
      - '.github/workflows/cper-gld-em-selection-r1.yml'
permissions: {contents: read}
jobs:
  source-only-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - run: python research/cper_gld_em_selection_r1.py --self-test
