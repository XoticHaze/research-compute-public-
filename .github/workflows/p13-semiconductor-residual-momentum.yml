name: P13 Semiconductor Residual Momentum

on:
  pull_request:
    paths:
      - 'scripts/p13_semiconductor_residual_momentum.py'
      - '.github/workflows/p13-semiconductor-residual-momentum.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2' 'pandas==2.3.1' 'yfinance==0.2.65'
      - name: Compile discriminator
        run: python -m py_compile scripts/p13_semiconductor_residual_momentum.py
      - name: Execute frozen matched-window discriminator
        run: python scripts/p13_semiconductor_residual_momentum.py | tee "$RUNNER_TEMP/p13-receipt.txt"
      - name: Upload deterministic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p13-semiconductor-residual-momentum-${{ github.sha }}
          path: ${{ runner.temp }}/p13-receipt.txt
          retention-days: 30
          if-no-files-found: error
