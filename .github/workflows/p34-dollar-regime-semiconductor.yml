name: P34 Dollar Regime Semiconductor Allocator

on:
  pull_request:
    paths:
      - 'scripts/p34_dollar_regime_semiconductor_allocator.py'
      - '.github/workflows/p34-dollar-regime-semiconductor.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned evaluation dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: Compile frozen discriminator
        run: python -m py_compile scripts/p34_dollar_regime_semiconductor_allocator.py
      - name: Execute frozen P34 discriminator
        run: python scripts/p34_dollar_regime_semiconductor_allocator.py
      - uses: actions/upload-artifact@v4
        with:
          name: p34-dollar-regime-semiconductor-${{ github.run_id }}
          path: artifacts/p34_dollar_regime_semiconductor_allocator.json
          if-no-files-found: error
          retention-days: 30
