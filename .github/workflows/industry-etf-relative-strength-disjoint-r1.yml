name: Industry ETF Relative Strength Disjoint R1
on:
  push:
    paths: ['.github/workflows/industry-etf-relative-strength-disjoint-r1.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet yfinance pandas numpy
      - name: Execute disjoint transport test
        run: |
          cat > /tmp/run.py <<'PY'
          import json,hashlib,numpy as np,pandas as pd,yfinance as yf
          assets=['XOP','XPH','KRE','IHI','IGV','XHB','REM','JETS','PBJ','XAR']; T=assets+['SPY']
          px=yf.download(T,start='2015-01-01',auto_adjust=True,progress=False,threads=False)['Close'].dropna(); lb,hold,topn,cost=126,21,3,0.002; rows=[]
          for i in range(lb,len(px)-hold,hold):
            sig=(px[assets].iloc[i]/px[assets].iloc[i-lb]-1).sort_values(ascending=False); sel=list(sig.index[:topn])
            rows.append({'strategy':float((px[sel].iloc[i+hold]/px[sel].iloc[i]-1).mean())-cost,'ew':float((px[assets].iloc[i+hold]/px[assets].iloc[i]-1).mean()),'spy':float(px.SPY.iloc[i+hold]/px.SPY.iloc[i]-1)})
          r=pd.DataFrame(rows)
          def cagr(x): return float(np.prod(1+x)**(1/(len(x)*hold/252))-1)
          def mdd(x):
            e=np.cumprod(1+x); return float(np.min(e/np.maximum.accumulate(e)-1))
          folds=np.array_split(np.arange(len(r)),5); pe=sum((r.iloc[f].strategy-r.iloc[f].ew).mean()>0 for f in folds); ps=sum((r.iloc[f].strategy-r.iloc[f].spy).mean()>0 for f in folds)
          out={'experiment_id':'CC-RF-INDUSTRY-ETF-RELATIVE-STRENGTH-DISJOINT-001','inherited_learning_ids':['SLP-20260912-INDUSTRY-ETF-RELATIVE-STRENGTH-R1'],'uncertainty':'Whether the same frozen industry relative-strength mechanism transports to a fully disjoint industry ETF universe.','frozen_params':{'lookback_sessions':126,'hold_sessions':21,'top_n':3,'round_trip_cost_bps':20.0},'universe':assets,'common_start':str(px.index[0].date()),'common_end':str(px.index[-1].date()),'periods':len(r),'strategy_after_cost_cagr_pct':100*cagr(r.strategy),'equal_weight_cagr_pct':100*cagr(r.ew),'spy_cagr_pct':100*cagr(r.spy),'excess_vs_equal_weight_cagr_pp':100*(cagr(r.strategy)-cagr(r.ew)),'excess_vs_spy_cagr_pp':100*(cagr(r.strategy)-cagr(r.spy)),'strategy_max_drawdown_pct':100*mdd(r.strategy),'equal_weight_max_drawdown_pct':100*mdd(r.ew),'positive_ew_excess_folds':int(pe),'positive_spy_excess_folds':int(ps)}
          out['transport_pass']=bool(out['excess_vs_equal_weight_cagr_pp']>1 and out['excess_vs_spy_cagr_pp']>0 and pe>=4 and ps>=3)
          blob=json.dumps(out,sort_keys=True,indent=2); open('industry_etf_relative_strength_disjoint_r1.json','w').write(blob+'\n'); print(blob); print('RESULT_SHA256='+hashlib.sha256((blob+'\n').encode()).hexdigest())
          PY
          python /tmp/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: industry-etf-relative-strength-disjoint-r1
          path: industry_etf_relative_strength_disjoint_r1.json
