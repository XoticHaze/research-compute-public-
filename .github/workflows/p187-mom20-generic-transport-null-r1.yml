name: P187 Mom20 Generic Transport Null R1
on:
  pull_request:
    paths:
      - 'research/p187_mom20_generic_transport_null_r1.py'
      - '.github/workflows/p187-mom20-generic-transport-null-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 yfinance==0.2.65
      - id: eval
        run: |
          python research/p187_mom20_generic_transport_null_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p187_mom20_generic_transport_null_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"decision={x['decision']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p187-mom20-generic-null__${{ steps.eval.outputs.decision }}
          path: artifacts/p187_mom20_generic_transport_null_r1.json
          if-no-files-found: error
