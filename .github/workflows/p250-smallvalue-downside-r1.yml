name: P250 Small Value Downside R1
on:
  pull_request:
    branches: [assistant/market-research-p249-smallvalue-capital-role-r1]
    paths:
      - 'research/p250_smallvalue_downside_r1.py'
      - '.github/workflows/p250-smallvalue-downside-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p250_smallvalue_downside_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p250-smallvalue-downside
          path: artifacts/p250_smallvalue_downside_r1.json
          if-no-files-found: error
