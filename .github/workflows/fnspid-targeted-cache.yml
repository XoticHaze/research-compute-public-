name: FNSPID Targeted Cache
on:
  pull_request:
    paths:
      - 'research/fnspid-target-span-probe.py'
      - 'research/fnspid-pilot-locator.json'
      - 'research/fnspid-targeted-slice.py'
      - 'research/fnspid-targeted-slice.json'
      - '.github/workflows/fnspid-targeted-cache.yml'
permissions:
  contents: read
jobs:
  span-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Restore source-identity range cache
        uses: actions/cache@v4
        with:
          path: .cache/fnspid-range
          key: fnspid-span-v1-1a7a3eb8e6b97ec1-${{ hashFiles('research/fnspid-targeted-slice.json') }}
          restore-keys: |
            fnspid-span-v1-1a7a3eb8e6b97ec1-
            fnspid-range-v3-1a7a3eb8e6b97ec1-pilot-
            fnspid-range-v1-5d4c018036bd82ca-1a7a3eb8e6b97ec1
          save-always: true
      - name: Binary-locate symbol blocks and 2015 date cutoffs
        run: python research/fnspid-target-span-probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: fnspid-target-span-receipt
          path: fnspid-target-span-receipt.json
          retention-days: 30
