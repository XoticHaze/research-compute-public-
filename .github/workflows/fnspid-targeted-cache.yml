name: FNSPID Targeted Cache
on:
  pull_request:
    paths:
      - 'research/fnspid-target-locator.py'
      - 'research/fnspid-targeted-slice.py'
      - 'research/fnspid-targeted-slice.json'
      - '.github/workflows/fnspid-targeted-cache.yml'
permissions:
  contents: read
jobs:
  target-locator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FNSPID_TARGETS: NVDA,DHI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Restore growing content-addressed FNSPID range cache
        uses: actions/cache@v4
        with:
          path: .cache/fnspid-range
          key: fnspid-range-v3-1a7a3eb8e6b97ec1-pilot-${{ github.sha }}
          restore-keys: |
            fnspid-range-v3-1a7a3eb8e6b97ec1-pilot-
            fnspid-range-v2-1a7a3eb8e6b97ec1-locator-
            fnspid-range-v1-5d4c018036bd82ca-1a7a3eb8e6b97ec1
      - name: Locate pilot semiconductor and homebuilder ticker blocks
        run: python research/fnspid-target-locator.py
      - uses: actions/upload-artifact@v4
        with:
          name: fnspid-target-locator-receipt
          path: fnspid-target-locator-receipt.json
          retention-days: 30

  materialize-pilot:
    needs: target-locator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Restore locator-expanded range cache
        uses: actions/cache@v4
        with:
          path: .cache/fnspid-range
          key: fnspid-range-v3-1a7a3eb8e6b97ec1-pilot-${{ github.sha }}
          restore-keys: |
            fnspid-range-v3-1a7a3eb8e6b97ec1-pilot-
            fnspid-range-v2-1a7a3eb8e6b97ec1-locator-
            fnspid-range-v1-5d4c018036bd82ca-1a7a3eb8e6b97ec1
      - name: Restore exact materialized slice cache
        id: slice-cache
        uses: actions/cache@v4
        with:
          path: .cache/fnspid-slices
          key: fnspid-slice-v1-1a7a3eb8e6b97ec1-${{ hashFiles('research/fnspid-targeted-slice.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: fnspid-target-locator-receipt
          path: locator
      - name: Materialize exact slice only on cache miss
        if: steps.slice-cache.outputs.cache-hit != 'true'
        run: python research/fnspid-targeted-slice.py
      - name: Surface deterministic slice receipt
        run: cat .cache/fnspid-slices/*/*/fnspid-pilot-slice-receipt.json
      - name: Publish reusable slice and receipt
        uses: actions/upload-artifact@v4
        with:
          name: fnspid-pilot-slice
          path: |
            .cache/fnspid-slices/*/*/fnspid-pilot-slice.csv
            .cache/fnspid-slices/*/*/fnspid-pilot-slice-receipt.json
          retention-days: 30
          compression-level: 6
