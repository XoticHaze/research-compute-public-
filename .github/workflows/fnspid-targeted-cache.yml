name: FNSPID Targeted Cache
on:
  pull_request:
    paths:
      - 'research/fnspid-all-external-schema-probe.py'
      - 'research/fnspid-all-external-nvda-span-probe.py'
      - 'research/fnspid-pilot-nasdaq-span.json'
      - '.github/workflows/fnspid-targeted-cache.yml'
permissions:
  contents: read
jobs:
  all-external-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Restore content-addressed All_external range cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fnspid-range
          key: fnspid-all-external-schema-v1-5d4c018036bd82ca-${{ github.run_id }}
          restore-keys: |
            fnspid-all-external-schema-v1-5d4c018036bd82ca-
            fnspid-all-external-v1-5d4c018036bd82ca-nvda-2015-
            fnspid-range-v1-5d4c018036bd82ca-1a7a3eb8e6b97ec1
      - name: Inspect actual bounded head schema and ordering
        run: python research/fnspid-all-external-schema-probe.py
      - name: Publish schema receipt
        uses: actions/upload-artifact@v4
        with:
          name: fnspid-all-external-schema-receipt
          path: fnspid-all-external-schema-receipt.json
          retention-days: 30
      - name: Save every paid source range
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/fnspid-range
          key: fnspid-all-external-schema-v1-5d4c018036bd82ca-${{ github.run_id }}
