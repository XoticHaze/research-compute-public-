name: P236 AVDV HAC Alpha R1
on:
  pull_request:
    paths:
      - 'research/p236_avdv_hac_alpha_r1.py'
      - '.github/workflows/p236-avdv-hac-alpha-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p236_avdv_hac_alpha_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p236_avdv_hac_alpha_r1.json')); a=x['tests']['2020']; bp=lambda v:int(round(v*10000)); tag=f"{x['decision']}__alpha_{bp(a['alpha_ann'])}__hac_t_{a['alpha_t_hac']:.2f}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p236-avdv-hac-alpha__${{ steps.eval.outputs.tag }}
          path: artifacts/p236_avdv_hac_alpha_r1.json
          if-no-files-found: error
