name: PIT 2015 Historical CIK Lineage R2
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/pit_2015_historical_cik_lineage_r2.py'
      - '.github/workflows/pit-2015-historical-cik-lineage-r2.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pandas requests lxml beautifulsoup4 html5lib
      - id: result
        run: |
          python research/pit_2015_historical_cik_lineage_r2.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/pit_2015_historical_cik_lineage_r2.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pit-2015-historical-cik-lineage-r2__${{ steps.result.outputs.tag }}
          path: research/artifacts/pit_2015_historical_cik_lineage_r2.json
          if-no-files-found: error
          retention-days: 90
