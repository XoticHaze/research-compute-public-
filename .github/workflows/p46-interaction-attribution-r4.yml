name: P46 Interaction Attribution R4
on:
  pull_request:
    paths:
      - 'research/p46_interaction_attribution_r4.py'
      - '.github/workflows/p46-interaction-attribution-r4.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p46_interaction_attribution_r4.py
      - uses: actions/upload-artifact@v4
        with:
          name: p46-interaction-attribution-r4
          path: artifacts/p46_interaction_attribution_r4.json
          if-no-files-found: error
