name: MM-IBKR Canonical Session Contract CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/mmibkr_canonical_workload_dispatch_v1.py'
      - 'scripts/mmibkr_canonical_session_runner_v1.py'
      - 'tests/test_mmibkr_canonical_workload_dispatch_v1.py'
      - 'tests/test_mmibkr_canonical_claim_lease_v1.py'
      - 'tests/test_mmibkr_canonical_session_runner_v1.py'
      - 'docs/MMIBKR_CANONICAL_SESSION_RUNTIME_V1.md'
      - '.github/workflows/mmibkr-canonical-session-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Compile runtime substrate
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/mmibkr_canonical_workload_dispatch_v1.py \
            scripts/mmibkr_canonical_session_runner_v1.py

      - name: Run dispatcher lease and session contracts
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_mmibkr_canonical_workload_dispatch_v1 \
            tests.test_mmibkr_canonical_claim_lease_v1 \
            tests.test_mmibkr_canonical_session_runner_v1
