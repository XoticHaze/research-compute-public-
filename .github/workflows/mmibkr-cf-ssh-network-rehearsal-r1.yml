name: MM-IBKR Cloudflare SSH Network-Only Rehearsal R1

# Run this BEFORE an attended IBKR Gateway session. A real isolated GitHub
# origin and two other independent jobs prove the same SSH/Access path with
# only a synthetic echo server; no broker credentials or orders are loaded.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mmibkr-cf-ssh-network-rehearsal-r1.yml
      - scripts/mmibkr_cf_gateway_start_v1.sh
      - scripts/mmibkr_cf_ssh_transport_v1.py
  pull_request:
    paths:
      - .github/workflows/mmibkr-cf-ssh-network-rehearsal-r1.yml
      - .github/workflows/mmibkr-selected-runtime-live-owner-r1.yml
      - .github/workflows/mmibkr-gh-independent-readers-r1.yml
      - scripts/mmibkr_cf_ssh_transport_v1.py
      - scripts/mmibkr_cf_install_cloudflared_v1.sh
      - scripts/mmibkr_cf_gateway_start_v1.sh
      - scripts/mmibkr_cf_reader_start_v1.sh
      - tests/test_mmibkr_cf_ssh_transport_v1.py

permissions:
  contents: read

jobs:
  source_contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: |
          python -m unittest discover -s tests -p 'test_mmibkr_cf_ssh_transport_v1.py' -v
          python -m unittest discover -s tests -p 'test_mmibkr_gh_gateway_split_v1.py' -v
          bash -n scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash -n scripts/mmibkr_cf_gateway_start_v1.sh
          bash -n scripts/mmibkr_cf_reader_start_v1.sh
          python -m py_compile scripts/mmibkr_cf_ssh_transport_v1.py

  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF_HOST: ${{ vars.MMIBKR_CF_SSH_HOSTNAME || 'gateway-ops.lifelatelycounseling.com' }}
      CF_TUNNEL: ${{ secrets.MMIBKR_CF_GATEWAY_TUNNEL_TOKEN }}
      CF_HOST_KEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_KEY_B64 }}
      CF_READER_PUBLIC: ${{ secrets.MMIBKR_CF_READER_SSH_PUBKEY }}
      CF_READER_PRIVATE: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
      CF_HOST_PUBLIC: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
      CF_ACCESS_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
      CF_ACCESS_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert all Cloudflare/SSH credentials configured (never print them)
        run: |
          set -euo pipefail
          missing=0
          for v in CF_HOST CF_TUNNEL CF_HOST_KEY CF_READER_PUBLIC CF_READER_PRIVATE CF_HOST_PUBLIC CF_ACCESS_ID CF_ACCESS_SECRET; do
            test -n "${!v}" || { echo "NETWORK_REHEARSAL_MISSING_$v=1"; missing=1; }
          done
          test "$missing" -eq 0 || exit 1
          python - <<'PY'
          import os
          from scripts.mmibkr_cf_ssh_transport_v1 import hostname,ed25519_pubkey
          hostname(os.environ["CF_HOST"])
          ed25519_pubkey(os.environ["CF_READER_PUBLIC"])
          ed25519_pubkey(os.environ["CF_HOST_PUBLIC"])
          print("NETWORK_ONLY_NO_BROKER_SECRETS_REQUESTED=1")
          print("CF_NETWORK_CONFIG_PREFLIGHT=PASS")
          PY

  gateway:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME || 'gateway-ops.lifelatelycounseling.com' }}
      MMIBKR_CF_GATEWAY_TUNNEL_TOKEN: ${{ secrets.MMIBKR_CF_GATEWAY_TUNNEL_TOKEN }}
      MMIBKR_CF_GATEWAY_SSH_HOST_KEY_B64: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_KEY_B64 }}
      MMIBKR_CF_READER_SSH_PUBKEY: ${{ secrets.MMIBKR_CF_READER_SSH_PUBKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          set -euo pipefail
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_gateway_start_v1.sh
      - name: Synthetic echo on exact broker-port number (no broker process)
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import socket,threading,time
          srv=socket.socket()
          srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          srv.bind(("127.0.0.1",4001))
          srv.listen(12)
          srv.settimeout(5)
          started=time.monotonic()
          print("NETWORK_ONLY_SYNTHETIC_TCP_ECHO_READY=1",flush=True)
          def handle(c):
              with c:
                  b=c.recv(256)
                  if b.startswith(b"MMIBKR_NETWORK_PROBE_V1:") and len(b)<200:
                      c.sendall(b)
          while time.monotonic()-started<315:
              try:
                  c,_=srv.accept()
              except socket.timeout:
                  continue
              threading.Thread(target=handle,args=(c,),daemon=True).start()
          srv.close()
          print("NETWORK_ONLY_SYNTHETIC_SESSION_CLEAN_END=1",flush=True)
          PY
        timeout-minutes: 7
        # The synthetic test exits normally after a bounded observation window.

  reader_a:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME || 'gateway-ops.lifelatelycounseling.com' }}
      MMIBKR_CF_READER_SSH_PRIVKEY_B64: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
      MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Allow independent Gateway run to start
        run: sleep 45
      - run: |
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_reader_start_v1.sh
      - name: Send harmless nonce through Cloudflare Access and pinned SSH
        run: |
          python - <<'PY'
          import os,secrets,socket
          payload=b"MMIBKR_NETWORK_PROBE_V1:"+secrets.token_hex(12).encode()
          with socket.create_connection(("127.0.0.1",14001),timeout=15) as conn:
              conn.sendall(payload)
              got=conn.recv(256)
          assert got == payload
          print("CF_PRIVATE_NETWORK_SYNTHETIC_A_TO_GATEWAY=PASS")
          print("IBKR_BROKER_INVOKED=NO")
          PY

  reader_b:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      MMIBKR_CF_SSH_HOSTNAME: ${{ vars.MMIBKR_CF_SSH_HOSTNAME || 'gateway-ops.lifelatelycounseling.com' }}
      MMIBKR_CF_READER_SSH_PRIVKEY_B64: ${{ secrets.MMIBKR_CF_READER_SSH_PRIVKEY_B64 }}
      MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY: ${{ secrets.MMIBKR_CF_GATEWAY_SSH_HOST_PUBKEY }}
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.MMIBKR_CF_ACCESS_SERVICE_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Allow independent Gateway run and A to start
        run: sleep 90
      - run: |
          bash scripts/mmibkr_cf_install_cloudflared_v1.sh
          bash scripts/mmibkr_cf_reader_start_v1.sh
      - name: Validate second independent transport while A session may persist
        run: |
          python - <<'PY'
          import secrets,socket
          payload=b"MMIBKR_NETWORK_PROBE_V1:"+secrets.token_hex(12).encode()
          with socket.create_connection(("127.0.0.1",14001),timeout=15) as conn:
              conn.sendall(payload)
              got=conn.recv(256)
          assert got == payload
          print("CF_PRIVATE_NETWORK_SYNTHETIC_B_TO_GATEWAY=PASS")
          print("IBKR_BROKER_INVOKED=NO")
          PY
