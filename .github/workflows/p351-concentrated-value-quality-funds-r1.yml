name: P351 Concentrated Value Quality Funds R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p351_concentrated_value_quality_funds_r1.py'
      - '.github/workflows/p351-concentrated-value-quality-funds-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p351_concentrated_value_quality_funds_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p351_concentrated_value_quality_funds_r1.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={x['decision']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p351-concentrated-value-quality__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p351_concentrated_value_quality_funds_r1.json
          if-no-files-found: error