name: P30 SMH Capitulation Mean Reversion
on:
  pull_request:
    paths:
      - 'research/p29_p30_dual_research_20260908.py'
      - '.github/workflows/p30-smh-capitulation-mean-reversion.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==2.4.6 pandas==3.0.5
      - name: Execute frozen P30 discriminator
        run: python research/p29_p30_dual_research_20260908.py --child p30 --out p30-smh-capitulation-mean-reversion-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p30-smh-capitulation-mean-reversion-${{ github.run_id }}
          path: p30-smh-capitulation-mean-reversion-receipt.json
          if-no-files-found: error
          retention-days: 30
