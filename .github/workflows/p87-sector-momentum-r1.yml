name: P87 Sector Momentum R1
on:
  pull_request:
    paths:
      - 'research/p87_sector_momentum_r1.py'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - run: python research/p87_sector_momentum_r1.py | tee /tmp/p87.out
      - run: cat artifacts/p87_sector_momentum_r1.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p87-sector-momentum-r1
          path: artifacts/p87_sector_momentum_r1.json
          if-no-files-found: error
