name: Semiconductor Forward Ephemeral Rendezvous V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rendezvous/requests/semiconductor-forward-v2-*.txt'
      - '.github/workflows/semiconductor-forward-ephemeral-rendezvous-v2.yml'
      - 'scripts/semiconductor_forward_ephemeral_consumer_v2.py'

permissions:
  contents: write

env:
  EXCHANGE_REF: rendezvous-exchange
  RECIPIENT_ROOT: rendezvous/recipients
  RESPONSE_ROOT: rendezvous/responses
  HARNESS: semiconductor_entry_value_model_forward_v2

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check cryptography numpy pandas scikit-learn
      - name: Compile fixed consumer
        run: python -m py_compile scripts/semiconductor_forward_ephemeral_consumer_v2.py
      - name: Generate one-run compute recipient
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          private=x25519.X25519PrivateKey.generate()
          private_raw=private.private_bytes(serialization.Encoding.Raw,serialization.PrivateFormat.Raw,serialization.NoEncryption())
          public_raw=private.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          Path(os.environ['RUNNER_TEMP'],'semiconductor-forward-v2-private.b64').write_text(base64.b64encode(private_raw).decode('ascii'))
          record={
            'schema':'semiconductor-forward-ephemeral-recipient-v2',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'harness':os.environ['HARNESS'],
            'recipient_b64':base64.b64encode(public_raw).decode('ascii'),
            'recipient_key_id':'sha256:'+hashlib.sha256(public_raw).hexdigest(),
          }
          Path(os.environ['RUNNER_TEMP'],'semiconductor-forward-v2-recipient.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          print('SEMICONDUCTOR_FORWARD_V2_RUN_ID='+os.environ['GITHUB_RUN_ID'])
          print('SEMICONDUCTOR_FORWARD_V2_RECIPIENT_KEY_ID='+record['recipient_key_id'])
          PY
      - name: Publish one-run recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RECIPIENT_ROOT}/${GITHUB_RUN_ID}-semiconductor-forward-v2.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/semiconductor-forward-v2-recipient.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish one-run semiconductor forward v2 recipient','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body" >/dev/null
          echo "SEMICONDUCTOR_FORWARD_V2_RECIPIENT_PATH=${path}"
      - name: Wait for run-bound encrypted private capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/semiconductor-forward-v2-input.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EXCHANGE_REF}"
          found=0
          for _ in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -o "$RUNNER_TEMP/semiconductor-forward-v2-input.json"; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'run-bound encrypted semiconductor v2 source capsule did not arrive'; exit 42; }
      - name: Execute parity-gated private capsule
        run: |
          set -euo pipefail
          python scripts/semiconductor_forward_ephemeral_consumer_v2.py \
            --envelope "$RUNNER_TEMP/semiconductor-forward-v2-input.json" \
            --private-key "$RUNNER_TEMP/semiconductor-forward-v2-private.b64" \
            --run-id "$GITHUB_RUN_ID" \
            --return-envelope "$RUNNER_TEMP/semiconductor-forward-v2-return.json"
      - name: Publish encrypted return envelope only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="${RESPONSE_ROOT}/${GITHUB_RUN_ID}/semiconductor-forward-v2-return.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          payload="$(base64 -w0 "$RUNNER_TEMP/semiconductor-forward-v2-return.json")"
          body="$(python - "$payload" "$EXCHANGE_REF" <<'PY'
          import json,sys
          print(json.dumps({'message':'rendezvous: publish encrypted semiconductor forward v2 return','content':sys.argv[1],'branch':sys.argv[2]}))
          PY
          )"
          curl -fsSL -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$body" >/dev/null
          echo "SEMICONDUCTOR_FORWARD_V2_RETURN_PATH=${path}"
      - name: Remove one-run private material
        if: always()
        run: rm -f "$RUNNER_TEMP/semiconductor-forward-v2-private.b64" "$RUNNER_TEMP/semiconductor-forward-v2-recipient.json" "$RUNNER_TEMP/semiconductor-forward-v2-input.json" "$RUNNER_TEMP/semiconductor-forward-v2-return.json"
