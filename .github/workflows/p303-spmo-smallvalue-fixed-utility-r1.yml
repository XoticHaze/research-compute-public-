name: P303 SPMO SmallValue Fixed Utility R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p303_spmo_smallvalue_fixed_utility_r1.py'
      - '.github/workflows/p303-spmo-smallvalue-fixed-utility-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 yfinance==0.2.65
      - id: eval
        run: |
          python research/p303_spmo_smallvalue_fixed_utility_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('research/artifacts/p303_spmo_smallvalue_fixed_utility_r1.json')); tag=f"{x['decision']}__folds_{x['positive_folds']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"tag={tag}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p303-spmo-smallvalue-fixed-utility__${{ steps.eval.outputs.tag }}
          path: research/artifacts/p303_spmo_smallvalue_fixed_utility_r1.json
          if-no-files-found: error
