name: Studio Existing Cloudflare Access Metadata Readonly R1
# Existing public, GET-only credential route. No private-source compute,
# API writes, environment creation, new tokens, or personal values in logs.
on:
  pull_request:
    paths:
      - 'scripts/cc_incomeengine_studio_shared_compute_readonly_v1.py'
      - 'tests/test_cc_incomeengine_studio_shared_compute_readonly_v1.py'
      - '.github/workflows/studio-existing-cloudflare-access-metadata-readonly-r1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cc_incomeengine_studio_shared_compute_readonly_v1.py'
      - 'tests/test_cc_incomeengine_studio_shared_compute_readonly_v1.py'
      - '.github/workflows/studio-existing-cloudflare-access-metadata-readonly-r1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cc_incomeengine_studio_shared_compute_readonly_v1.py' -v
          python -m py_compile scripts/cc_incomeengine_studio_shared_compute_readonly_v1.py

  existing-neural-access-metadata:
    # Credentials are already enrolled on this admitted public READ lane.
    # Never run them in PR context and never print bearer/identity/AUD.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_GATEWAY_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_GATEWAY_ACCESS_TOKEN }}
      CLOUDFLARE_GATEWAY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Existing read-only credential checks exact Studio Access metadata
        run: |
          set -euo pipefail
          python -m scripts.cc_incomeengine_studio_shared_compute_readonly_v1
          echo 'STUDIO_ACCESS_READ_ONLY_METHODS=GET'
          echo 'STUDIO_PUBLIC_RUNNER_PRIVATE_ASSETS=NONE'
          echo 'STUDIO_ACCESS_CONFIG_VALUES_EXPORTED=NO'
