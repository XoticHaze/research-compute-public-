name: Futures Trend ETF Proxy Transport R7
on:
  pull_request:
    paths:
      - 'research/futures_etf_proxy_transport_r7.py'
      - '.github/workflows/futures-etf-proxy-transport-r7.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -q numpy==1.26.4 pandas==2.2.3
      - name: Execute frozen ETF proxy transport
        run: python research/futures_etf_proxy_transport_r7.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: futures-etf-proxy-transport-r7
          path: futures_etf_proxy_transport_r7.json
          if-no-files-found: error
          retention-days: 90
