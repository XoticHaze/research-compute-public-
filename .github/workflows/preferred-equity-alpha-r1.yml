name: preferred-equity-alpha-r1
on:
  push:
    paths: ['.github/workflows/preferred-equity-alpha-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas numpy scipy
      - name: Evaluate preferred equity versus exposure-matched equity-bond-cash control
        shell: python
        run: |
          import json, math
          import yfinance as yf, pandas as pd, numpy as np
          from scipy.optimize import nnls
          syms=['PFF','SPY','AGG','BIL']
          px=yf.download(syms,start='2008-01-01',auto_adjust=True,progress=False)['Close'].dropna()
          r=px.pct_change().dropna()
          y=r['PFF'].values
          X=r[['SPY','AGG']].values
          w,_=nnls(X,y)
          if w.sum()>1: w=w/w.sum()
          cash=max(0,1-w.sum())
          ctrl=w[0]*r['SPY']+w[1]*r['AGG']+cash*r['BIL']
          cost=.001
          def ann(z): return float(np.prod(1+z)**(252/len(z))-1)
          years=[]; wins=0
          for yr in sorted(set(r.index.year)):
            f=r.loc[r.index.year==yr,'PFF']; c=ctrl.loc[ctrl.index.year==yr]
            if len(f)>100:
              ex=(1+f).prod()-1-cost-((1+c).prod()-1)
              years.append({'year':int(yr),'excess_pp':100*float(ex)})
              wins += ex>0
          recent=r.loc[r.index>='2022-01-01']; rc=ctrl.loc[ctrl.index>='2022-01-01']
          wealth=(1+r['PFF']).cumprod(); dd=float((wealth/wealth.cummax()-1).min())
          out={'fund':'PFF','control_weights':{'SPY':float(w[0]),'AGG':float(w[1]),'BIL':float(cash)},'cost_bps_per_year':10,'after_cost_cagr':ann(r['PFF'])-cost,'matched_control_cagr':ann(ctrl),'excess_cagr_pp':100*(ann(r['PFF'])-cost-ann(ctrl)),'calendar_wins':int(wins),'calendar_years':len(years),'recent_2022_plus_excess_pp':100*(ann(recent['PFF'])-cost-ann(rc)),'max_drawdown':dd,'pass':bool((ann(r['PFF'])-cost-ann(ctrl))>.01 and wins>=math.ceil(.6*len(years)) and ann(recent['PFF'])-cost-ann(rc)>0)}
          print('RESULT_JSON='+json.dumps(out,sort_keys=True))
