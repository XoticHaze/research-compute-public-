name: return-stacking-alpha-r1
on:
  push:
    paths: ['.github/workflows/return-stacking-alpha-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas numpy
      - name: Evaluate NTSX versus matched 90-60 synthetic and conventional 60-40
        shell: python
        run: |
          import json,math,yfinance as yf,pandas as pd,numpy as np
          px=yf.download(['NTSX','SPY','IEF','BIL'],start='2018-08-01',auto_adjust=True,progress=False)['Close'].dropna(); r=px.pct_change().dropna(); cost=.001
          matched=.9*r.SPY+.6*r.IEF-.5*r.BIL; classic=.6*r.SPY+.4*r.IEF
          def ann(z): return float(np.prod(1+z)**(252/len(z))-1)
          wins=eligible=0
          for y in sorted(set(r.index.year)):
            f=r.loc[r.index.year==y,'NTSX']; c=matched.loc[matched.index.year==y]
            if len(f)>100: eligible+=1; wins += ((1+f).prod()-1-cost > (1+c).prod()-1)
          recent=r.loc[r.index>='2022-01-01']; rm=matched.loc[matched.index>='2022-01-01']; rc=classic.loc[classic.index>='2022-01-01']; w=(1+r.NTSX).cumprod()
          out={'fund':'NTSX','after_cost_cagr':ann(r.NTSX)-cost,'matched_90_60_cagr':ann(matched),'classic_60_40_cagr':ann(classic),'excess_vs_matched_pp':100*(ann(r.NTSX)-cost-ann(matched)),'excess_vs_classic_pp':100*(ann(r.NTSX)-cost-ann(classic)),'calendar_wins_vs_matched':int(wins),'calendar_years':int(eligible),'recent_2022_plus_excess_vs_matched_pp':100*(ann(recent.NTSX)-cost-ann(rm)),'recent_vs_classic_pp':100*(ann(recent.NTSX)-cost-ann(rc)),'max_drawdown':float((w/w.cummax()-1).min())}; out['pass']=bool(out['excess_vs_matched_pp']>1 and wins>=math.ceil(.6*eligible) and out['recent_2022_plus_excess_vs_matched_pp']>0); print('RESULT_JSON='+json.dumps(out,sort_keys=True))
