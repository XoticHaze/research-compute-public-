name: SEC Datapond Transport Probe
on:
  pull_request:
    paths:
      - 'research/sec_datapond_transport_probe_20260906.py'
      - 'research/sec_datapond_semiconductor_cache_20260906.py'
      - '.github/workflows/sec-datapond-transport-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install exact remote-query environment
        run: python -m pip install --disable-pip-version-check -q datapond==0.1.2
      - name: Execute SEC remote-database transport probe
        run: python research/sec_datapond_transport_probe_20260906.py
      - name: Consume transport into frozen six-category semiconductor cache
        run: python research/sec_datapond_semiconductor_cache_20260906.py
      - name: Retain transport and cache receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec-datapond-semiconductor-cache
          path: |
            sec_datapond_transport_probe_20260906.json
            sec_datapond_semiconductor_preflight_20260906.json
            sec_datapond_semiconductor_cache_20260906.json
          retention-days: 14
          if-no-files-found: warn
