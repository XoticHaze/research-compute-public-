name: P145 Credit Risk Regime SPY R1
on:
  pull_request:
    paths:
      - 'research/p145_credit_risk_regime_spy_r1.py'
      - '.github/workflows/p145-credit-risk-regime-spy-r1.yml'
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 yfinance==0.2.65
      - id: run
        run: |
          python research/p145_credit_risk_regime_spy_r1.py
          python - <<'PY'
          import json,os
          x=json.load(open('artifacts/p145_credit_risk_regime_spy_r1.json')); t=x['tests']['2015']['50']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"decision={x['decision']}\nmatched={100*t['excess_matched']:.2f}\nspy={100*t['excess_spy']:.2f}\nsharpe={t['net']['sharpe_rf0']:.2f}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p145-credit-risk__${{ steps.run.outputs.decision }}__matched_${{ steps.run.outputs.matched }}pp__spy_${{ steps.run.outputs.spy }}pp__sharpe_${{ steps.run.outputs.sharpe }}
          path: artifacts/p145_credit_risk_regime_spy_r1.json
          if-no-files-found: error
