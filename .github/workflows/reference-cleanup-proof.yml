name: Reference Cleanup Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/live_reference_harness_v1.py'
      - 'tests/test_reference_live_cleanup_v1.py'
      - '.github/workflows/reference-cleanup-proof.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/live_reference_harness_v1.py'
      - 'tests/test_reference_live_cleanup_v1.py'
      - '.github/workflows/reference-cleanup-proof.yml'

permissions:
  contents: read

jobs:
  cleanup-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Prove success and forced-failure cleanup
        run: python -m unittest -v tests.test_reference_live_cleanup_v1
