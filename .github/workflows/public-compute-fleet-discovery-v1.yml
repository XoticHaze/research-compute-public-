name: Public Compute Fleet Discovery V1

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-compute-fleet-discovery-v1.yml'
      - 'scripts/public_compute_fleet_discovery_v1.py'
      - 'tests/test_public_compute_fleet_discovery_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-compute-fleet-discovery-v1.yml'
      - 'scripts/public_compute_fleet_discovery_v1.py'
      - 'tests/test_public_compute_fleet_discovery_v1.py'

permissions:
  contents: read

concurrency:
  group: public-compute-fleet-discovery-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify public-only bounded scanner
        run: python -m unittest discover -s tests -p 'test_public_compute_fleet_discovery_v1.py' -v

  discover:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Scan public repository metadata and commit discovery snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B scripts/public_compute_fleet_discovery_v1.py
          echo 'PUBLIC_FLEET_DISCOVERY_ADMISSION_BOUNDARY=DISCOVERY_ONLY'
