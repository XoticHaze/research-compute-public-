name: MR DBMF Stooq Independent 20260911 R3
on:
  pull_request:
    paths:
      - 'research/mr_dbmf_stooq_independent_20260911_r3.py'
      - '.github/workflows/mr-dbmf-stooq-independent-20260911-r3.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas numpy
      - id: eval
        run: |
          python research/mr_dbmf_stooq_independent_20260911_r3.py
          python - <<'PY'
          import json, os
          x=json.load(open('research/artifacts/mr_dbmf_stooq_independent_20260911_r3.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('decision='+x['decision']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mr-dbmf-stooq-independent__${{ steps.eval.outputs.decision }}
          path: research/artifacts/mr_dbmf_stooq_independent_20260911_r3.json
          if-no-files-found: error
